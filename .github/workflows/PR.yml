name: PR Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: build-${{ github.event.pull_request.number || github.head_ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch commits through the merge base
        uses: fulcrumgenomics/fetch-through-merge-base@v1
        with:
          base-ref: ${{ env.GITHUB_BASE_REF }}
          head-ref: ${{ github.sha }}
          fallback-base-ref: master
          fallback-fetch-all: true

      - uses: ./.github/actions/setup-bioconda-utils

      - name: Perform lint
        env:
          # Mimic circleci
          OSTYPE: "linux-gnu"
          CI: "true"
        run: |
          set -e
          px() { pixi run "$@"; }
          echo '============'
          px conda info --all
          px conda config --show-sources
          px bioconda-utils diagnostics
          echo '============'
          px bioconda-utils lint --loglevel debug --git-range origin/"$GITHUB_BASE_REF"...HEAD
          px conda clean -y --all

  build-linux:
    name: Linux Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Free space
        # HACK fixes 'No space left on device'
        # see:
        # - https://github.com/orgs/community/discussions/25678#discussioncomment-5242449
        # - https://github.com/galaxyproteomics/tools-galaxyp/blob/master/.github/workflows/pr.yaml#L293
        # NOTE we don't use those, bioconda-utils run everything inside conda environment, anyway
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift

      - uses: actions/checkout@v4

      - name: Fetch commits through the merge base
        uses: fulcrumgenomics/fetch-through-merge-base@v1
        with:
          base-ref: ${{ env.GITHUB_BASE_REF }}
          head-ref: ${{ github.sha }}
          fallback-base-ref: master
          fallback-fetch-all: true

      - uses: ./.github/actions/setup-bioconda-utils

      - name: Build and test
        env:
          # Mimic circleci
          OSTYPE: "linux-gnu"
          CI: "true"
        run: |
          set -e
          px() { pixi run "$@"; }
          CONDA_BLD="$(px python -c 'from conda_build.config import Config; print(Config().croot, end="")')"

          # Clean up lingering build artifacts
          for n in linux-64 osx-64 noarch; do
              rm -f "$CONDA_BLD"/$n/*.tar.bz2
              rm -f "$CONDA_BLD"/$n/*.conda
          done

          px bioconda-utils build recipes config.yml \
            --docker --mulled-build-and-test \
            --git-range origin/"$GITHUB_BASE_REF"...HEAD

      - name: Prepare artifacts
        run: |
          CONDA_BLD="$(pixi run python -c 'from conda_build.config import Config; print(Config().croot, end="")')"
          (
          rm -rf /tmp/artifacts
          mkdir -p /tmp/artifacts/packages
          cd "$CONDA_BLD" || exit 0
          find -name .cache | xargs rm -rf || true
          for n in index.html channeldata.json linux-64 osx-64 noarch; do
            cp -rv $n /tmp/artifacts/packages || true
          done
          if command -V docker >/dev/null; then
            mkdir -p /tmp/artifacts/images
            cd /tmp/artifacts/images
            docker image ls --format='{{.Repository}}:{{.Tag}}' | \
              { grep biocontainers || true ; } | \
              xargs -n1 -P4 bash -c '
                test -n "${1+x}" || exit 0
                echo "Start compressing docker image ${1} ..."
                docker save "${1}" | pigz -1 -c > "${1##*/}.tar.gz"
                echo "Finished compressing docker image ${1} ."
                ' --
            # There's no : allowed in artifact names, replace it with ---
            for f in /tmp/artifacts/images/*:* ; do mv -- "$f" "${f//:/---}"; done
          fi
          ) || true

      - name: Archive packages
        uses: actions/upload-artifact@v6
        with:
          name: linux-packages
          path: |
            /tmp/artifacts
          compression-level: 0


  build-osx-64:
    name: OSX-64 Tests
    runs-on: macos-15-intel
    # Limited concurrency for osx, so first make sure linux can pass
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch commits through the merge base
        uses: fulcrumgenomics/fetch-through-merge-base@v1
        continue-on-error: true
        with:
          base-ref: ${{ env.GITHUB_BASE_REF }}
          head-ref: ${{ github.sha }}
          fallback-base-ref: master
          fallback-fetch-all: true

      # This is required so the pixi cache restores properly on macOS
      # See: https://github.com/actions/cache/issues/629#issuecomment-1189184648
      - name: Make gtar SUDO
        run: |
          echo -e '#!/bin/sh\nexec sudo /usr/local/bin/gtar.orig "$@"\n' > gtar;
          cat gtar;
          sudo mv -v /usr/local/bin/gtar /usr/local/bin/gtar.orig;
          sudo cp -v gtar /usr/local/bin/gtar;
          sudo chmod +x /usr/local/bin/gtar;

      - uses: ./.github/actions/setup-bioconda-utils

      - name: Build and Test
        env:
          # Mimic circleci
          OSTYPE: "darwin"
          CI: "true"
        run: |
          set -e
          CONDA_BLD="$(pixi run python -c 'from conda_build.config import Config; print(Config().croot, end="")')"

          # Clean up lingering build artifacts
          for n in linux-64 osx-64 noarch; do
              rm -f "$CONDA_BLD"/$n/*.tar.bz2
          done

          # SDK setup and build must share one shell: run_conda_forge_build_setup
          # (from conda-forge-ci-setup in the pixi env) only exports into its own shell
          pixi run bash -lc "set -e; run_conda_forge_build_setup; bioconda-utils build recipes config.yml --git-range origin/\"$GITHUB_BASE_REF\"...HEAD"

      - name: Prepare artifacts
        run: |
              CONDA_BLD="$(pixi run python -c 'from conda_build.config import Config; print(Config().croot, end="")')"
              (
              rm -rf /tmp/artifacts
              mkdir -p /tmp/artifacts/packages
              cd "$CONDA_BLD" || exit 0
              find . -name .cache | xargs rm -rf || true
              for n in index.html channeldata.json linux-64 osx-64 noarch; do
                cp -rv $n /tmp/artifacts/packages || true
              done
              ) || true

      - name: Archive packages
        uses: actions/upload-artifact@v6
        with:
          name: osx-packages
          path: |
            /tmp/artifacts
          compression-level: 0

  build-linux-arm64:
    name: Linux ARM64 Tests
    runs-on: ubuntu-24.04-arm
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Fetch commits through the merge base
        uses: fulcrumgenomics/fetch-through-merge-base@v1
        with:
          base-ref: ${{ env.GITHUB_BASE_REF }}
          head-ref: ${{ github.sha }}
          fallback-base-ref: master
          fallback-fetch-all: true

      - uses: ./.github/actions/setup-bioconda-utils

      - name: Build and test
        env:
          OSTYPE: "linux-gnu"
          CI: "true"
        run: |
          set -e
          px() { pixi run "$@"; }
          CONDA_BLD="$(px python -c 'from conda_build.config import Config; print(Config().croot, end="")')"

          # Clean up lingering build artifacts
          for n in linux-aarch64 noarch; do
              rm -f "$CONDA_BLD"/$n/*.tar.bz2
              rm -f "$CONDA_BLD"/$n/*.conda
          done

          px bioconda-utils build recipes config.yml \
            --docker --mulled-build-and-test \
            --platform linux-aarch64 \
            --git-range origin/"$GITHUB_BASE_REF"...HEAD

      - name: Prepare artifacts
        run: |
          CONDA_BLD="$(pixi run python -c 'from conda_build.config import Config; print(Config().croot, end="")')"
          (
          rm -rf /tmp/artifacts
          mkdir -p /tmp/artifacts/packages
          cd "$CONDA_BLD" || exit 0
          find -name .cache | xargs rm -rf || true
          for n in index.html channeldata.json linux-aarch64 noarch; do
            cp -rv $n /tmp/artifacts/packages || true
          done
          if command -V docker >/dev/null; then
            mkdir -p /tmp/artifacts/images
            cd /tmp/artifacts/images
            docker image ls --format='{{.Repository}}:{{.Tag}}' | \
              { grep biocontainers || true ; } | \
              xargs -n1 -P4 bash -c '
                test -n "${1+x}" || exit 0
                echo "Start compressing docker image ${1} ..."
                docker save "${1}" | pigz -1 -c > "${1##*/}.tar.gz"
                echo "Finished compressing docker image ${1} ."
                ' --
            for f in /tmp/artifacts/images/*:* ; do mv -- "$f" "${f//:/---}"; done
          fi
          ) || true

      - name: Archive packages
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-packages
          path: /tmp/artifacts
          compression-level: 0
