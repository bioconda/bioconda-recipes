name: Update build failure list

on:
  workflow_dispatch:
  schedule:
    - cron: 5 5 * * *
  push:
    branches:
      - master
      - bulk
    paths:
      - "**build_failure.*.yaml"

jobs:
  update-build-failure-page:
    name: Update build failure page
    if: ${{ github.repository == 'bioconda/bioconda-recipes' && !contains(github.event.head_commit.message, '[ci skip]') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        branch: ${{ fromJSON(github.event_name == 'push' && format('["{0}"]', github.ref_name) || '["master","bulk"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0 # needed here to ensure that the git range comparison works correctly

      # NOTE: the bulk branch pins its own utils version via the setup action's
      # utils-ref default, so this job automatically matches the branch it runs on.
      - uses: ./.github/actions/setup-bioconda-utils

      - name: Generate build failure table
        run: |
          set -e
          px() { pixi run "$@"; }
          branch=${{ matrix.branch }}
          mkdir build-failures
          if [[ -z $branch || $branch == "master" ]] ; then
            md=build-failures/build-failures.md
            echo "# Build failures" > $md
            echo "Automatically updated (nightly) list of build failures that currently block builds from the listed recipes. Please help with fixing them!" >> $md
            px bioconda-utils list-build-failures recipes --output-format markdown --link-prefix https://github.com/bioconda/bioconda-recipes/blob/master >> $md
          else
            base_ref="${GITHUB_BASE_REF:-master}"
            md="build-failures/build-failures-${branch}.md"
            echo "# Build failures on \`${branch}\`" > $md
            echo "Automatically updated list of build failures that currently block builds from the listed recipes on the \`${branch}\` branch." >> $md
            px bioconda-utils list-build-failures recipes --git-range origin/"$base_ref"...HEAD --output-format markdown --link-prefix https://github.com/bioconda/bioconda-recipes/blob/$branch >> $md
          fi
      - name: Upload build failure to wiki
        uses: docker://decathlon/wiki-page-creator-action:latest
        env:
          GH_PAT: ${{secrets.BIOCONDA_BOT_REPO_TOKEN}}
          ACTION_MAIL: BiocondaBot@users.noreply.github.com
          ACTION_NAME: BiocondaBot
          OWNER: bioconda
          REPO_NAME: bioconda-recipes
          MD_FOLDER: build-failures
