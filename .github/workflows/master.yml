name: Upload
on:
  push:
    branches:
      - master
jobs:
  build-linux:
    name: Linux Upload
    if: github.repository == 'bioconda/bioconda-recipes'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 13
    steps:
      # Fetch the last two commits for the --git-range argument to bioconda-utils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - uses: ./.github/actions/setup-bioconda-utils

      - name: Build and upload
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          INVOLUCRO_AUTH: ${{ secrets.INVOLUCRO_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mimic circleci
          OSTYPE: "linux-gnu"
          CI: "true"
        run: |
          set -ex
          source scripts/activate-bioconda-utils.sh
          bioconda-utils handle-merged-pr recipes config.yml \
            --repo bioconda/bioconda-recipes \
            --git-range ${GITHUB_SHA}~1...${GITHUB_SHA} \
            --container-upload-target biocontainers \
            --fallback build \
            --artifact-source github-actions

  build-osx-64:
    name: OSX-64 Upload
    if: github.repository == 'bioconda/bioconda-recipes'
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      max-parallel: 4
    steps:
      # Fetch the last two commits for the --git-range argument to bioconda-utils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bioconda-utils

      - name: Build and Test
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          INVOLUCRO_AUTH: ${{ secrets.INVOLUCRO_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mimic circleci
          OSTYPE: "darwin"
          CI: "true"
        run: |
          set -e
          source scripts/activate-bioconda-utils.sh

          # Sets up OSX SDK
          run_conda_forge_build_setup

          bioconda-utils handle-merged-pr recipes config.yml \
          --repo bioconda/bioconda-recipes \
          --git-range ${GITHUB_SHA}~1...${GITHUB_SHA} \
          --fallback build \
          --artifact-source github-actions


