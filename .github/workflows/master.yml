name: Upload
on:
  push:
    branches:
      - master
jobs:
  plan-linux:
    name: Select Linux platforms
    if: github.repository == 'bioconda/bioconda-recipes'
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set path
        run: echo "/opt/mambaforge/bin" >> $GITHUB_PATH

      - name: Fetch conda install script
        run: |
          wget https://raw.githubusercontent.com/bioconda/bioconda-common/master/{install-and-set-up-conda,configure-conda,common}.sh

      - name: Set up bioconda-utils
        run: bash install-and-set-up-conda.sh

      - name: Select platforms
        id: platforms
        run: |
          eval "$(conda shell.bash hook)"
          conda activate bioconda
          arm_recipes=$(bioconda-utils list-recipes recipes config.yml \
            --git-range "${GITHUB_SHA}~1...${GITHUB_SHA}" \
            --platform linux-aarch64 --format json)
          if [[ ${arm_recipes} == "[]" ]]; then
            matrix='{"include":[{"runner":"ubuntu-22.04","package_platform":"linux-64","artifact_arch":"amd64"}]}'
          else
            matrix='{"include":[{"runner":"ubuntu-22.04","package_platform":"linux-64","artifact_arch":"amd64"},{"runner":"ubuntu-22.04-arm","package_platform":"linux-aarch64","artifact_arch":"arm64"}]}'
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Linux ${{ matrix.artifact_arch }} Upload
    if: github.repository == 'bioconda/bioconda-recipes'
    needs: plan-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-linux.outputs.matrix) }}
    steps:
      # Fetch the last two commits for the --git-range argument to bioconda-utils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: set path
        run: echo "/opt/mambaforge/bin" >> $GITHUB_PATH

      - name: Fetch conda install script
        run: |
          wget https://raw.githubusercontent.com/bioconda/bioconda-common/master/{install-and-set-up-conda,configure-conda,common}.sh

      - name: Set up bioconda-utils
        run: bash install-and-set-up-conda.sh

      # This script can be used to reconfigure conda to use the right channel setup.
      - name: Configure conda
        run: bash configure-conda.sh

      - name: Initialize mulled image records
        run: mkdir -p /tmp/mulled-images && touch /tmp/mulled-images/EMPTY

      - name: Build and upload
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          INVOLUCRO_AUTH: ${{ secrets.INVOLUCRO_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mimic circleci
          OSTYPE: "linux-gnu"
          CI: "true"
        run: |
          set -ex
          eval "$(conda shell.bash hook)"
          conda activate bioconda
          bioconda-utils handle-merged-pr recipes config.yml \
            --repo bioconda/bioconda-recipes \
            --git-range ${GITHUB_SHA}~1...${GITHUB_SHA} \
            --quay-upload-target biocontainers \
            --platform ${{ matrix.package_platform }} \
            --mulled-upload-records /tmp/mulled-images \
            --fallback build \
            --artifact-source github-actions

      - name: Archive mulled image records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mulled-images-${{ matrix.artifact_arch }}
          path: /tmp/mulled-images

  build-osx-64:
    name: OSX-64 Upload
    if: github.repository == 'bioconda/bioconda-recipes'
    runs-on: macos-15-intel
    steps:
      # Fetch the last two commits for the --git-range argument to bioconda-utils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set path
        run: echo "/opt/mambaforge/bin" >> $GITHUB_PATH

      - name: Fetch conda install script
        run: |
          wget https://raw.githubusercontent.com/bioconda/bioconda-common/master/{install-and-set-up-conda,configure-conda,common}.sh

      - name: Set up bioconda-utils
        run: bash install-and-set-up-conda.sh

      # This script can be used to reconfigure conda to use the right channel setup.
      - name: Configure conda
        run: bash configure-conda.sh

      - name: Build and Test
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          INVOLUCRO_AUTH: ${{ secrets.INVOLUCRO_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mimic circleci
          OSTYPE: "darwin"
          CI: "true"
        run: |
          set -e
          eval "$(conda shell.bash hook)"
          conda activate bioconda

          # Sets up OSX SDK
          run_conda_forge_build_setup

          bioconda-utils handle-merged-pr recipes config.yml \
          --repo bioconda/bioconda-recipes \
          --git-range ${GITHUB_SHA}~1...${GITHUB_SHA} \
          --fallback build \
          --artifact-source github-actions

  publish-mulled-manifests:
    if: always() && !cancelled()
    needs: build-linux
    uses: ./.github/workflows/publish-mulled-manifests.yml
    with:
      bioconda_common_ref: master
    secrets: inherit
