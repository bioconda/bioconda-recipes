name: Upload
on:
  push:
    branches:
      - master
jobs:
  build-linux:
    name: Linux Upload
    if: github.repository == 'bioconda/bioconda-recipes'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 13
    steps:
      # Fetch the last two commits for the --git-range argument to bioconda-utils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: set path
        run: echo "/opt/mambaforge/bin" >> $GITHUB_PATH

      - name: Fetch conda install script
        run: |
          wget https://raw.githubusercontent.com/bioconda/bioconda-common/master/{install-and-set-up-conda,configure-conda,common}.sh

      - name: Set up bioconda-utils
        run: bash install-and-set-up-conda.sh

      # This script can be used to reconfigure conda to use the right channel setup.
      - name: Configure conda
        run: bash configure-conda.sh

      - name: Initialize mulled image records
        run: mkdir -p /tmp/mulled-images

      - name: Build and upload
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          INVOLUCRO_AUTH: ${{ secrets.INVOLUCRO_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mimic circleci
          OSTYPE: "linux-gnu"
          CI: "true"
        run: |
          set -ex
          eval "$(conda shell.bash hook)"
          conda activate bioconda
          bioconda-utils handle-merged-pr recipes config.yml \
            --repo bioconda/bioconda-recipes \
            --git-range ${GITHUB_SHA}~1 ${GITHUB_SHA} \
            --quay-upload-target biocontainers \
            --container-platform linux/amd64 \
            --package-platform linux-64 \
            --mulled-upload-records /tmp/mulled-images \
            --fallback build \
            --artifact-source github-actions

      - name: Archive mulled image records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mulled-images-amd64
          path: /tmp/mulled-images

  build-osx-64:
    name: OSX-64 Upload
    if: github.repository == 'bioconda/bioconda-recipes'
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      max-parallel: 4
    steps:
      # Fetch the last two commits for the --git-range argument to bioconda-utils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set path
        run: echo "/opt/mambaforge/bin" >> $GITHUB_PATH

      - name: Fetch conda install script
        run: |
          wget https://raw.githubusercontent.com/bioconda/bioconda-common/master/{install-and-set-up-conda,configure-conda,common}.sh

      - name: Set up bioconda-utils
        run: bash install-and-set-up-conda.sh

      # This script can be used to reconfigure conda to use the right channel setup.
      - name: Configure conda
        run: bash configure-conda.sh

      - name: Build and Test
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          INVOLUCRO_AUTH: ${{ secrets.INVOLUCRO_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mimic circleci
          OSTYPE: "darwin"
          CI: "true"
        run: |
          set -e
          eval "$(conda shell.bash hook)"
          conda activate bioconda

          # Sets up OSX SDK
          run_conda_forge_build_setup

          bioconda-utils handle-merged-pr recipes config.yml \
          --repo bioconda/bioconda-recipes \
          --git-range ${GITHUB_SHA}~1 ${GITHUB_SHA} \
          --fallback build \
          --artifact-source github-actions


  build-and-upload-linux-arm64:
    name: Linux ARM64 Upload
    if: github.repository == 'bioconda/bioconda-recipes'
    runs-on: ubuntu-24.04-arm
    # NOTE: uses ubuntu-24.04 (native ARM64) while x86-64 jobs use ubuntu-22.04;
    # this base-image skew is intentional for now.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Additional Platforms
        id: additional_platforms
        run: |
          result=$(./scripts/check-for-additional-platforms.sh \
            "${GITHUB_SHA}~1 ${GITHUB_SHA}" "build_and_upload" "build_and_upload-linux-aarch64")
          if [[ ${result} != "build" ]]; then
            echo "No recipes using this platform, skipping rest of job."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          fi

      - name: set path
        if: steps.additional_platforms.outputs.skip_build != 'true'
        run: echo "/opt/mambaforge/bin" >> $GITHUB_PATH

      - name: Fetch conda install script
        if: steps.additional_platforms.outputs.skip_build != 'true'
        run: |
          wget https://raw.githubusercontent.com/bioconda/bioconda-common/master/{install-and-set-up-conda,configure-conda,common}.sh

      - name: Set up bioconda-utils
        if: steps.additional_platforms.outputs.skip_build != 'true'
        run: bash install-and-set-up-conda.sh

      - name: Configure conda
        if: steps.additional_platforms.outputs.skip_build != 'true'
        run: bash configure-conda.sh

      - name: Initialize mulled image records
        run: mkdir -p /tmp/mulled-images

      - name: Build and upload
        if: steps.additional_platforms.outputs.skip_build != 'true'
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          INVOLUCRO_AUTH: ${{ secrets.INVOLUCRO_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSTYPE: "linux-gnu"
          CI: "true"
        run: |
          set -ex
          eval "$(conda shell.bash hook)"
          conda activate bioconda
          bioconda-utils handle-merged-pr recipes config.yml \
            --repo bioconda/bioconda-recipes \
            --git-range ${GITHUB_SHA}~1 ${GITHUB_SHA} \
            --quay-upload-target biocontainers \
            --container-platform linux/arm64 \
            --package-platform linux-aarch64 \
            --mulled-upload-records /tmp/mulled-images \
            --fallback build \
            --artifact-source github-actions

      - name: Archive mulled image records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mulled-images-arm64
          path: /tmp/mulled-images/images.jsonl

  publish-mulled-manifests:
    name: Publish multi-arch manifests
    if: >-
      always() &&
      needs['build-linux'].result == 'success' &&
      needs['build-and-upload-linux-arm64'].result == 'success'
    needs:
      - build-linux
      - build-and-upload-linux-arm64
    runs-on: ubuntu-22.04
    concurrency:
      group: biocontainers-manifest-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download mulled image records
        uses: actions/download-artifact@v6
        with:
          pattern: mulled-images-*
          path: /tmp/mulled-images

      - name: set path
        run: echo "/opt/mambaforge/bin" >> $GITHUB_PATH

      - name: Fetch conda install script
        run: |
          wget https://raw.githubusercontent.com/bioconda/bioconda-common/master/{install-and-set-up-conda,configure-conda,common}.sh

      - name: Set up bioconda-utils
        run: bash install-and-set-up-conda.sh

      - name: Configure conda
        run: bash configure-conda.sh

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: $oauthtoken
          password: ${{ secrets.QUAY_OAUTH_TOKEN }}

      - name: Publish and verify manifests
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
        run: |
          set -e
          eval "$(conda shell.bash hook)"
          conda activate bioconda
          bioconda-utils create-mulled-manifests /tmp/mulled-images

