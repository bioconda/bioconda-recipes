name: Nightly Uploader
on:
  schedule:
    - cron: "0 0 * * *"
jobs:
  nightly-osx-arm:
    name: Nightly OSX-ARM64 Builds
    if: github.repository == 'bioconda/bioconda-recipes'
    runs-on: macOS-14 # M1
    steps:
      - uses: actions/checkout@v4

      - name: set path
        run: echo "/opt/mambaforge/bin" >> $GITHUB_PATH

      - name: Fetch conda install script
        run: |
          wget https://raw.githubusercontent.com/bioconda/bioconda-common/master/{install-and-set-up-conda,configure-conda,common}.sh

      - name: Set up bioconda-utils
        run: bash install-and-set-up-conda.sh

      - name: Configure conda
        run: bash configure-conda.sh

      - name: Build and push leftover packages
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          INVOLUCRO_AUTH: ${{ secrets.INVOLUCRO_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mimic circleci
          OSTYPE: "darwin"
          CI: "true"
        run: |
          set -e
          eval "$(conda shell.bash hook)"
          conda activate bioconda

          source common.sh
          # Sets up OSX SDK
          run_conda_forge_build_setup

          # build and push all leftover packages
          bioconda-utils build recipes config.yml \
              --anaconda-upload \
              --lint --exclude bioconda-repodata-patches

  nightly-linux:
    name: Nightly Linux ${{ matrix.architecture.artifact_arch }} Builds
    if: github.repository == 'bioconda/bioconda-recipes'
    runs-on: ${{ matrix.architecture.runner }}
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - runner: ubuntu-22.04
            platform: linux/amd64
            artifact_arch: amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
            artifact_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: set path
        run: echo "/opt/mambaforge/bin" >> $GITHUB_PATH

      - name: Fetch conda install script
        run: |
          wget https://raw.githubusercontent.com/bioconda/bioconda-common/master/{install-and-set-up-conda,configure-conda,common}.sh

      - name: Set up bioconda-utils
        run: bash install-and-set-up-conda.sh

      - name: Configure conda
        run: bash configure-conda.sh

      - name: Initialize mulled image records
        run: mkdir -p /tmp/mulled-images && touch /tmp/mulled-images/EMPTY

      - name: Rebuild and upload bioconda-repodata-patches
        if: matrix.architecture.artifact_arch == 'amd64'
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          eval "$(conda shell.bash hook)"
          conda activate bioconda
          conda build --token "$ANACONDA_TOKEN" --user bioconda --quiet recipes/bioconda-repodata-patches

      - name: Build and push leftover packages
        env:
          QUAY_LOGIN: ${{ secrets.QUAY_LOGIN }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          INVOLUCRO_AUTH: ${{ secrets.INVOLUCRO_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSTYPE: "linux-gnu"
          CI: "true"
        run: |
          set -e
          eval "$(conda shell.bash hook)"
          conda activate bioconda
          bioconda-utils build recipes config.yml \
            --docker --mulled-build-and-test \
            --platform ${{ matrix.architecture.platform }} \
            --anaconda-upload --mulled-upload-target biocontainers \
            --mulled-upload-records /tmp/mulled-images \
            --lint --exclude bioconda-repodata-patches

      - name: Archive mulled image records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mulled-images-${{ matrix.architecture.artifact_arch }}-nightly
          path: /tmp/mulled-images

  publish-mulled-manifests:
    if: always() && !cancelled()
    needs: nightly-linux
    uses: ./.github/workflows/publish-mulled-manifests.yml
    with:
      bioconda_common_ref: master
    secrets: inherit
