{% set name = "tangram2-sc" %}
{% set version = "0.2.0" %}
{% set commit = "0af3056ff537c4e063b960a5f02a60b1711a89c4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_url: https://github.com/Genentech/tangram2.git
  git_rev: {{ commit }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=3.10
    # --- core single-cell / scientific stack (mapping, ccc, evalkit) ---
    - anndata >=0.10
    - scanpy >=1.10
    - numpy >=1.26
    - pandas >=2.0
    - scipy >=1.11
    - h5py >=3.8
    - scikit-learn >=1.3
    - statsmodels >=0.14
    - numba >=0.58
    - xarray >=2023.1
    # --- deep learning ---
    - pytorch >=2.0
    - pytorch-lightning >=2.5
    - lightning >=2.5
    # --- plotting / utilities ---
    - matplotlib-base >=3.7
    - seaborn >=0.13
    - tqdm >=4.65
    - wandb >=0.15
    # --- evalkit method backends ---
    - glum >=3.1
    - moscot >=0.3.4
    - pot >=0.9.5
    # --- vendored cellphonedb runtime deps ---
    - fbpca >=1.0
    - geosketch >=1.3
    - numpy-groupies >=0.11
    - requests >=2.28
    # --- vendored spaotsc runtime deps ---
    - dit >=1.2
    - python-igraph >=0.10
    - python-louvain >=0.16
    - networkx >=3.0
    - astropy >=5.0
    - progressbar2 >=4.0
    - umap-learn >=0.5
    # --- optional but used by evalkit benchmarks / diagnostics ---
    - tangram-sc >=1.0.4
    - gprofiler-official >=1.0.0

test:
  imports:
    - tangram2
    - tangram2.mapping
    - tangram2.ccc
    - tangram2.evalkit
    - tangram2.external
    - tangram2.external.cellphonedb
    - tangram2.external.spaotsc
  commands:
    - python -c "from tangram2.evalkit import _version; print(_version.__version__)"
    - python -c "from tangram2.ccc.methods import TangramCCC; from tangram2.mapping import mapping_utils"

about:
  home: https://github.com/Genentech/tangram2
  license: Apache-2.0
  license_file: LICENSE
  summary: >
    Tangram 2: infer cell-cell communication from single-cell and spatial
    transcriptomics via probabilistic mapping and interaction modeling.
  description: |
    Tangram2 is a computational framework with three modules: mapping (align
    scRNA-seq to spatial data), CCC (cell-cell communication inference), and
    evalkit (synthetic benchmarking). This recipe installs the Python package
    importable as ``tangram2``.
  doc_url: https://doi.org/10.1101/2025.09.28.679077
  dev_url: https://github.com/Genentech/tangram2

extra:
  recipe-maintainers:
    - LuisHeinzlmeier
  identifiers:
    - doi:10.1101/2025.09.28.679077