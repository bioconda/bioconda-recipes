# Disable Azure checks in favor of GitHub Actions due to memory issues
pr: none
trigger: none
# trigger:
#   - master

jobs:
  - job: "build_and_push_linux"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      maxParallel: 8
    timeoutInMinutes: 360

    steps:
      - script: |
          git checkout master

      - bash: bash scripts/setup-bioconda-utils.sh
        displayName: Set up pinned bioconda-utils

      - bash: |
          set -e
          source scripts/activate-bioconda-utils.sh

          export OSTYPE="linux-gnu"
          export CI="true"

          bioconda-utils handle-merged-pr recipes config.yml \
            --repo bioconda/bioconda-recipes \
            --git-range $(Build.SourceVersion)~1...$(Build.SourceVersion) \
            --container-upload-target biocontainers

        env:
          QUAY_LOGIN: $(QUAY_LOGIN)
          QUAY_OAUTH_TOKEN: $(QUAY_OAUTH_TOKEN)
          ANACONDA_TOKEN: $(ANACONDA_TOKEN)
          INVOLUCRO_AUTH: $(INVOLUCRO_AUTH)
          GITHUB_TOKEN: $(GITHUB_TOKEN)
        displayName: Handle merged PR

  - job: "build_and_push_osx"
    pool:
      vmImage: "macOS-latest"
    strategy:
      maxParallel: 4
    timeoutInMinutes: 360

    steps:
      - script: |
          git checkout master

      - bash: bash scripts/setup-bioconda-utils.sh
        displayName: Set up pinned bioconda-utils

      - bash: |
          set -e
          source scripts/activate-bioconda-utils.sh
          export OSTYPE="darwin"
          export CI="true"

          run_conda_forge_build_setup

          bioconda-utils handle-merged-pr recipes config.yml \
            --repo bioconda/bioconda-recipes \
            --git-range $(Build.SourceVersion)~1...$(Build.SourceVersion) \
            --fallback build
        env:
          QUAY_LOGIN: $(QUAY_LOGIN)
          ANACONDA_TOKEN: $(ANACONDA_TOKEN)
          INVOLUCRO_AUTH: $(INVOLUCRO_AUTH)
          GITHUB_TOKEN: $(GITHUB_TOKEN)
        displayName: Handle merged PR
