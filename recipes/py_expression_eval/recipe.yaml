schema_version: 1

context:
  version: "0.3.14"

package:
  name: py_expression_eval
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/py_expression_eval/py_expression_eval-${{ version }}.tar.gz
  sha256: ea60f9404a18346d5a63854db21c50666dfb4274ae111000165b31c6f8ab93f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - py_expression_eval
      pip_check: true

about:
  summary: Python Mathematical Expression Evaluator
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/AxiaCore/py-expression-eval/

extra:
  recipe-maintainers:
    - hechth
