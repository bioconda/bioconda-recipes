{% set version = "1.2.8" %}
{% set commit = "2566515733806c50573fdacefe51e17fa61efce8" %}

package:
  name: r-teddy
  version: {{ version }}

source:
  url: https://github.com/YeehanXiao/Teddy/archive/{{ commit }}.tar.gz
  sha256: 61a95683cb2e95cc6bd5761e6314d6f45c1bdb59e4a77f5c18fa2052f2343872

build:
  number: 1
  run_exports:
    - {{ pin_subpackage('r-teddy', max_pin="x") }}

requirements:
  build:
    - make
    - cmake
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pkg-config
  host:
    - r-base
    - zlib
    - xz
    - bzip2
    - r-dplyr >=1.1.1
    - r-ggplot2
    - r-readr
    - r-statmod
    - r-stringr
    - r-tibble
    - r-tidyr
    - bioconductor-rtracklayer
    - bioconductor-genomeinfodb
    - bioconductor-genomicfeatures
    - bioconductor-txdbmaker
    - bioconductor-rsamtools
    - bioconductor-genomicalignments
    - bioconductor-genomicranges
    - bioconductor-iranges
    - bioconductor-s4vectors
    - bioconductor-summarizedexperiment
    - bioconductor-rsubread
    - bioconductor-deseq2
    - bioconductor-biocparallel
    - bioconductor-matrixgenerics
    - bioconductor-biostrings

  run:
    - r-base
    - r-dplyr >=1.1.1
    - r-ggplot2
    - r-readr
    - r-statmod
    - r-stringr
    - r-tibble
    - r-tidyr
    - bioconductor-rtracklayer
    - bioconductor-genomeinfodb
    - bioconductor-genomicfeatures
    - bioconductor-txdbmaker
    - bioconductor-rsamtools
    - bioconductor-genomicalignments
    - bioconductor-genomicranges
    - bioconductor-iranges
    - bioconductor-s4vectors
    - bioconductor-summarizedexperiment
    - bioconductor-rsubread
    - bioconductor-deseq2
    - bioconductor-biocparallel
    - bioconductor-matrixgenerics
    - bioconductor-biostrings

test:
  source_files:
    - demo/data
    - demo/run_demo.R
  commands:
    - $R -e "stopifnot(is.function(Teddy::annotateTEPosition), is.function(Teddy::formTEPositionPlot))"
    - >-
      $R --vanilla --slave -e "source('demo/run_demo.R');
      stopifnot(length(anno) > 0L, nrow(se) == length(anno),
      ncol(se) == 2L, ncol(combineSE) == 2L, length(chi_GTF) > 0L,
      length(Teddy::annotateTEPosition(chi_GTF, te, combineSE = combineSE, minoverlap = 5)) > 0L)"
    - $R -e "for (p in c('stringtie', 'stringtie3/stringtie', 'gffcompare')) stopifnot(system2(system.file(p, package='Teddy'), '--version') == 0L)"

about:
  home: "https://github.com/YeehanXiao/Teddy"
  summary: "Analysis of TE-dependent gene isoforms."
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  dev_url: "https://github.com/YeehanXiao/Teddy"

extra:
  recipe-maintainers:
    - YeehanXiao
