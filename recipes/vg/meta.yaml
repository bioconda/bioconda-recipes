{% set name = "vg" %}
{% set version = "1.76.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/vgteam/vg/releases/download/v{{ version }}/vg       # [linux and x86_64]
    sha256: 87b457fdda6801c9580f79a53c3c0aa502261420abf222920c7222a703fd856b    # [linux and x86_64]
  - url: https://github.com/vgteam/vg/releases/download/v{{ version }}/vg-arm64 # [linux and aarch64]
    sha256: 8862fd3d805a15808846f8ad2e75cf8d84cfb553ea3f9296199154d4e1409fae    # [linux and aarch64]
  # vg ships as a prebuilt binary, so the source tree has no LICENSE to point
  # license_file at; fetch it explicitly so the package carries its MIT text.
  - url: https://raw.githubusercontent.com/vgteam/vg/refs/tags/v{{ version }}/LICENSE
    sha256: 7c3fe1c48ef0594c8d6728353d9325b5f4335eceea5bda3734820d7478bdeaef

build:
  number: 0
  skip: true  # [osx]
  script:
    - mkdir -p ${PREFIX}/bin
    - cp vg* ${PREFIX}/bin/vg
    - chmod +x ${PREFIX}/bin/vg
  run_exports:
    - {{ pin_subpackage('vg', max_pin="x") }}

test:
  commands:
    - vg help

about:
  home: https://github.com/vgteam/vg
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Variation graph data structures, interchange formats, alignment, genotyping, and variant calling methods

extra:
  additional-platforms:
    - linux-aarch64
  skip-lints:
    - should_be_noarch_generic
