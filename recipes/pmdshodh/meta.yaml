{% set name = "pmdshodh" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pmdshodh/pmdshodh-{{ version }}.tar.gz
  sha256: c62a81dbe406f5ea651529014a836436695535c9b3c6a2659283933e14e6f6cc

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  source_files:
    - tests/data/reads_random.sam
  commands:
    - pmdshodh --version
    - pmdshodh filter --help
    - pmdshodh score --quiet tests/data/reads_random.sam -o scores.tsv
    - test "$(wc -l < scores.tsv)" -eq 1501

about:
  home: https://github.com/dpatel511/pmdshodh
  dev_url: https://github.com/dpatel511/pmdshodh
  doc_url: https://github.com/dpatel511/pmdshodh/blob/v{{ version }}/README.md
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Per-read post-mortem damage (PMD) scoring and filtering of ancient DNA alignments, compatible with PMDtools.

extra:
  recipe-maintainers:
    - dpatel511
  additional-platforms:
    - linux-aarch64
    - osx-arm64
