{% set name = "RepeatAfterMe" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Dfam-consortium/RepeatAfterMe/archive/refs/tags/{{ version }}.tar.gz
  sha256: 166670699d6a5e74683b4be5d26ccb074db5dba666951863aad92ee3edd9a137
  patches:
    - 0001-Makefile.patch
    - 0002-dnautil-macOS.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - make
    - python >=3
    - pkg-config
  host:
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
  run:
    - perl
    - libgomp  # [linux]
    - llvm-openmp  # [osx]

test:
  commands:
    - RAMExtend 2>&1 | grep 'RAMExtend Version'

about:
  home: "https://github.com/Dfam-consortium/RepeatAfterMe"
  license: "CC0"
  license_file: LICENSE
  summary: "A package for the extension of repetitive DNA sequences."
  dev_url: "https://github.com/Dfam-consortium/RepeatAfterMe"
  doc_url: "https://github.com/Dfam-consortium/RepeatAfterMe/blob/{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
