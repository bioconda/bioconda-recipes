{% set name = "rigel" %}
{% set version = "0.8.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/r/rigel-rnaseq/rigel_rnaseq-{{ version }}.tar.gz
  sha256: f08e9a1eb081e1a5cca586d732497f11cc2d261614af6aef91d8f8a0a8be822e

build:
  number: 0
  skip: true  # [py < 312]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.15
    - make
    - pkg-config
  host:
    - python
    - pip
    - scikit-build-core >=0.12,<2
    - nanobind >=2.0
    - htslib
    - zlib
    - libcurl
    - openssl
    - bzip2
    - xz
    - libdeflate
    - numpy >=1.26
  run:
    - python >=3.12
    - numpy >=1.26
    - pandas >=2.1
    - pyarrow >=14.0
    - pysam >=0.22
    - pyyaml >=6.0
    - scipy >=1.12
    - htslib

test:
  imports:
    - rigel
    - rigel.native
  commands:
    - rigel --help

about:
  home: https://github.com/mkiyer/rigel
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Bayesian RNA-seq transcript quantification that separates RNA from genomic DNA contamination
  description: |
    Rigel is a Bayesian transcript quantification method for RNA-seq data
    that models three sources of signal in the same library: RNA from the
    annotated transcripts, nascent RNA, and genomic DNA contamination (gDNA). A single-pass
    native BAM scan feeds a calibration stage that separates RNA from gDNA
    genome-wide, and a locus-level EM then assigns the RNA to transcripts.
  dev_url: https://github.com/mkiyer/rigel
  doc_url: https://github.com/mkiyer/rigel/blob/main/docs/MANUAL.md

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - mkiyer
