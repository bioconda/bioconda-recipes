{% set name = "vitessce" %}
{% set version = "3.9.3" %}

package:
  name: {{ name }}-python
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/v/vitessce/vitessce-{{ version }}.tar.gz
  sha256: 512d9a97145b7c0a9aba3e005286d6612d7fc33bb290d2189106977e1739d9c8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  number: 0
  run_exports:
    - {{ pin_subpackage('vitessce-python', max_pin="x") }}

requirements:
  host:
    - python >=3.12
    - hatchling
    - setuptools >=67.0
    - pip
  run:
    - python >=3.12
    - zarr >=3
    #- numcodecs >=0.5.7,<0.16.0
    - scipy >=1.2.1
    - negspy >=0.2.24
    - pandas >=1.1.2
    - black >=21.11b1
    - numpy >=1.21.2
    - anndata >=0.7.8
    - scanpy >=1.9.3
    - ome-zarr >=0.2.1
    - tifffile >=2020.10.1
    - jsonschema >=3.2
    - anywidget

test:
  imports:
    - vitessce

about:
  home: "https://vitessce.io"
  summary: "Jupyter widget facilitating interactive visualization of spatial single-cell data with Vitessce."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/vitessce/vitessce-python"
  doc_url: "https://github.com/vitessce/vitessce-python/blob/main/README.md"

extra:
  recipe-maintainers:
    - dannyspadaro
