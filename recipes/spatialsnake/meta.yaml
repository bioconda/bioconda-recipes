{% set name = "spatialsnake" %}
{% set version = "0.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/s/spatialsnake/spatialsnake-{{ version }}.tar.gz
  sha256: 14362e3e1684f18b4f664b8c87ae3b3697509d7af5a49f6fa16883485c9f6153

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - spatialsnake = spatialsnake.command_line:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.12.11,<3.13
    - pip
    - setuptools >=80.9,<81
    - wheel
  run:
    - python >=3.12.11,<3.13
    - pip
    - setuptools >=80.9,<81
    - snakemake-minimal ==9.8.1
    - r-base ==4.4.0
    - numpy ==2.2.6
    - scanpy ==1.10.4
    - anndata ==0.12.0
    - umap-learn ==0.5.7
    - pandas ==2.2.3
    - scipy ==1.13.1
    - scikit-learn ==1.7.2
    - numba ==0.62.1
    - llvmlite ==0.45.1
    - shapely ==2.1.1
    - matplotlib-base ==3.9.4
    - seaborn ==0.13.2
    - plotnine ==0.15.0
    - pillow ==11.3.0
    - zarr ==2.18.7
    - h5py ==3.14.0
    - tifffile ==2025.8.28
    - imageio ==2.37.0
    - ome-zarr ==0.11.1
    - statsmodels ==0.14.5
    - pint ==0.25
    - dask-core ==2024.11.2
    - pooch ==1.8.2
    - pims ==0.7
    - xarray ==2025.1.2
    - click ==8.3.0
    - typer ==0.16.0
    - docopt ==0.6.2
    - pyyaml ==6.0.3
    - geosketch ==1.3
    - pydeseq2 ==0.5.2
    - harmonypy ==0.0.10
    - bbknn ==1.6.0
    - r-optparse ==1.8.2
    - r-tidyverse ==2.0.0
    - r-future ==1.70.0
    - r-jsonlite ==2.0.0
    - r-rcolorbrewer ==1.1_3
    - r-patchwork ==1.3.2
    - r-cowplot ==1.2.0
    - r-pheatmap ==1.0.13
    - r-remotes ==2.5.0
    - r-biocmanager ==1.30.27
    - r-presto ==1.0.0
    - bioconductor-annotationdbi ==1.68.0
    - bioconductor-complexheatmap ==2.22.0
    - bioconductor-clusterprofiler ==4.14.0
    - bioconductor-edger ==4.4.0
    - bioconductor-org.hs.eg.db ==3.20.0
    - bioconductor-org.mm.eg.db ==3.20.0
    - bioconductor-rhdf5 ==2.50.0
    - bioconductor-biocneighbors ==2.0.0

test:
  imports:
    - spatialsnake
  commands:
    - spatialsnake --version
    - mkdir -p /tmp/spatialsnake-numba-cache /tmp/spatialsnake-mpl-cache
    - NUMBA_CACHE_DIR=/tmp/spatialsnake-numba-cache MPLCONFIGDIR=/tmp/spatialsnake-mpl-cache python -c "import spatialsnake, scanpy, anndata, numpy, pandas, scipy, sklearn, numba, shapely, matplotlib, seaborn, plotnine, zarr, h5py, tifffile, imageio, ome_zarr, statsmodels, pint, dask, pooch, pims, xarray, click, typer, yaml, geosketch, pydeseq2, harmonypy, bbknn"
    - Rscript -e "library(optparse); library(edgeR); library(clusterProfiler)"

about:
  home: https://github.com/l-zh007/spatialsnake
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Snakemake workflow for spatial transcriptomics powered by SpatialData.
  doc_url: https://spatialsnake-tutorial.readthedocs.io/en/latest/
  dev_url: https://github.com/l-zh007/spatialsnake

extra:
  notes: |
    This recipe installs Spatialsnake and the conda-managed runtime dependencies
    that solve quickly at the same versions as the validated test environment.
    Heavy exact-version Python packages such as the torch/scvi stack, packages
    unavailable from conda, or packages that conflict with the pinned R 4.4.0
    stack are installed after installation with `spatialsnake install-packages`.
    The default helper command completes a minimal conda install; `--extended`
    installs downstream Python packages, pybanksy, and R/GitHub packages.
  skip-lints:
    - uses_setuptools
  recipe-maintainers:
    - zhenghlin
