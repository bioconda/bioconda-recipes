{% set name = "isotools" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/isotools-{{ version }}.tar.gz
  sha256: 4eb0a8b515d77cf28a61ab3134727eb5e83263494c0817c2d8e573e7e76016af

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('isotools', max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - setuptools >=77.0.3
    - pip
  run:
    - python >=3.10
    - numpy
    - pandas
    - tqdm
    - intervaltree
    - matplotlib-base
    - seaborn-base
    - biopython
    - pysam
    - umap-learn
    - scikit-learn
    - scipy
    - statsmodels
    - pyhmmer
    - requests
    - cpat >=3.0
    - python-ternary

test:
  imports:
    - isotools
  commands:
    - run_isotools --help

about:
  home: "https://github.com/HerwigLab/IsoTools2"
  summary: "Framework for the analysis of long read transcriptome sequencing data."
  license: MIT
  license_family: MIT
  license_file: "LICENSE.txt"
  dev_url: "https://github.com/HerwigLab/IsoTools2"
  doc_url: "https://isotools.readthedocs.io/en/latest"

extra:
  recipe-maintainers:
    - kbseah
  identifiers:
    - "doi:10.1093/bioinformatics/btad364" # v1 publication
    - "doi:10.1016/j.jmb.2025.169049" # v2 publication
