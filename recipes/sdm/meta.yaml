{% set name = "sdm" %}
{% set version = "3.66" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/hildebra/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 5991a69cd2bcab87c544dd75ca9ab77d6682651fd670fe5b81c45e89625540c9

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - make
    - pkg-config
  host:
    - zlib
    - htslib
    - isa-l
  run:
    - isa-l

test:
  commands:
    - sdm

about:
  home: "https://github.com/hildebra/sdm"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "sdm - simple demultiplex tool for FASTQ demultiplexing and dereplication."
  dev_url: "https://github.com/hildebra/sdm"
  doc_url: "https://github.com/hildebra/sdm/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1186/2049-2618-2-30
