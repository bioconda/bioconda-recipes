{% set name = "sdm" %}
{% set version = "3.52" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/hildebra/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 25489182cdbe07502c7724c74a2084b99b9f926ff6b83c6d6a669c9e1d8ad0f7
  patches:
    - fix-cxx20-shared-ptr-unique.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
    - pkg-config
  host:
    - zlib
    - htslib

test:
  commands:
    - sdm

about:
  home: "https://github.com/hildebra/sdm"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "sdm - simple demultiplex tool for FASTQ demultiplexing and dereplication."
  dev_url: "https://github.com/hildebra/sdm"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - compiler_needs_stdlib_c
