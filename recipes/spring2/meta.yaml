{% set version = "1.3.5" %}

package:
  name: spring2
  version: {{ version }}

source:
  url: https://github.com/thisisamirv/SPRING2/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 97fef277af4250d9a944efcb29944c333aeaedbc6818983172668a178cde2d83

build:
  number: 0
  skip: True  # [win]
  run_exports:
    - {{ pin_subpackage('spring2', max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.31
    - nasm         # [linux64]
    - python
    - make         # [unix]
    - ninja        # [win]
  host:
    - libgomp      # [linux]
    - llvm-openmp  # [osx]

test:
  commands:
    - spring2 --version > /dev/null
    - spring2 --help > /dev/null 2>&1

about:
  home: https://spring2.readthedocs.io/
  summary: Cross-platform FASTQ/FASTA compressor and decompressor
  license: LicenseRef-SPRING
  license_file:
    - LICENSE
    - REDISTRIBUTION_PERMISSION.md
  dev_url: https://github.com/thisisamirv/SPRING2

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - thisisamirv
