{% set name = "regenie" %}
{% set version = "4.1.3" %}
{% set sha256 = "5a8ea6ce8a89693cbd272dd64290d361285e0aa858376d25c29284dc58a57b0d" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/rgcgithub/regenie/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    # Fixing postrelease issues
    - patches/0015-update-cmakelist.txt-for-v3.6.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
    
requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - binutils >=2.33.1  # [linux]
    - cmake >=3.13
    - make
  host:
    - llvm-openmp  # [osx]
    - libgomp  # [linux]
    - bgenix >=1.1.7
    - boost-cpp 1.74
    - liblapack * *mkl
    - mkl >=2020.4
    - mkl-include
    - zlib
    - zstd
  run:
    - llvm-openmp  # [osx]
    - libgomp  # [linux]
    - boost-cpp 1.74
    - mkl >=2020.4
    - sqlite

test:
  commands:
    - test -f ${PREFIX}/bin/regenie  # [linux]
    - regenie --help
    - regenie --version

about:
  home: "https://rgcgithub.github.io/regenie"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Regenie is a C++ program for whole genome regression modelling of large genome-wide association studies (GWAS).'
  dev_url: "https://github.com/rgcgithub/regenie"
  doc_url: "https://rgcgithub.github.io/regenie/options"

extra:
  recipe-maintainers:
    - matuskosut
    - joellembatchou
