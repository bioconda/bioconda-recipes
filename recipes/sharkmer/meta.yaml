{% set version = "4.0.0" %}

package:
  name: sharkmer
  version: {{ version }}

source:
  url: https://github.com/caseywdunn/sharkmer/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 18a64c080e45bb6d8d5ce5301ff317edc5ae9432cbda3163d2d1463ad267a25e

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('sharkmer', max_pin='x') }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}

test:
  commands:
    - sharkmer --help
    - sharkmer --version
    - sharkmer --list-panels
    - sharkmer --cite

about:
  home: https://github.com/caseywdunn/sharkmer
  summary: "Kmer counter and seeded de Bruijn graph assembler for in silico PCR and genome size estimation"
  license: MIT
  license_file: LICENSE

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - caseywdunn
  skip-lints:
    - compiler_needs_stdlib_c
