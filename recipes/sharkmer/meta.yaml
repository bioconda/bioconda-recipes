{% set version = "4.0.0" %}

package:
  name: sharkmer
  version: {{ version }}

source:
  url: https://github.com/caseywdunn/sharkmer/releases/download/v{{ version }}/sharkmer-{{ version }}.tar.gz
  sha256: 8aa08756c3f47bc128ab5a80575eade4a34b3751a7eea698482d5f1f90878ca0

build:
  number: 1
  run_exports:
    - {{ pin_subpackage('sharkmer', max_pin='x') }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}

test:
  commands:
    - sharkmer --help
    - sharkmer --version
    - sharkmer --list-panels
    - sharkmer --cite

about:
  home: https://github.com/caseywdunn/sharkmer
  summary: "Kmer counter and seeded de Bruijn graph assembler for in silico PCR and genome size estimation"
  license: MIT
  license_file: LICENSE

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - caseywdunn
  skip-lints:
    - compiler_needs_stdlib_c
