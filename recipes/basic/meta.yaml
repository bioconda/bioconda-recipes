package:
  name: basic
  version: "2.0.1"

source:
  url: https://github.com/akds/BASIC/archive/refs/tags/v2.0.1.tar.gz
  sha256: 0d75d9a3159f199c0f14209636ebda62d0eb3ad630050d0d8b9eadc98fa15a2d

build:
  number: 0
  noarch: python

requirements:
  host:
    - python
  run:
    - python
    - bowtie2

test:
  commands:
    - BASIC.py -h
    - touch file.txt && BASIC.py -b $(which bowtie2) -SE file.txt -a && rm file.txt result.fasta

about:
  home: http://ttic.uchicago.edu/~aakhan/BASIC/
  license: MIT
  summary: >
    BASIC is a semi-de novo assembly method for assembling BCR and TCR genes 
    from single cell RNA-seq data.
