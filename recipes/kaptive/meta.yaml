{% set name = "kaptive" %}
{% set version = "3.3.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/kaptive-{{ version }}.tar.gz
  sha256: 11213da2f1c7025af315c34ea943a7a1f813b014ee01532112f6418ccccee25a

build:
  number: 0
  entry_points:
    - kaptive = kaptive.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=3.11
    - numpy >=2.4
    - numba >=0.62
    - rammappy >=0.1.3
    - gb-io >=0.4
    - orjson
    - plotly

test:
  imports:
    - kaptive
  commands:
    - kaptive --help

about:
  home: "https://klebgenomics.github.io/Kaptive/"
  dev_url: "https://github.com/klebgenomics/Kaptive"
  summary: "Reports information about surface polysaccharide loci for bacterial genome assemblies."
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  doc_url: "https://klebgenomics.github.io/Kaptive/"

extra:
  recipe-maintainers:
    - tomdstanton
