{% set name = "kaptive" %}
{% set version = "3.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/kaptive-{{ version }}.tar.gz
  sha256: 06ca4915f663efaa807bd85e6f49c0444cde3ffd1cb845a95debbd76ab9030ca

build:
  entry_points:
    - kaptive = kaptive.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage('kaptive', max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=3.11
    - numpy >=2.4
    - numba >=0.62
    - rammappy >=0.1.3
    - gb-io >=0.4
    - orjson
    - plotly

test:
  imports:
    - kaptive
  commands:
    - kaptive --help

about:
  home: "http://klebgenomics.github.io/Kaptive/"
  dev_url: "https://github.com/klebgenomics/Kaptive"
  summary: "Reports information about surface polysaccharide loci for bacterial genome assemblies."
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  doc_url: "http://klebgenomics.github.io/Kaptive/"

extra:
  recipe-maintainers:
    - tomdstanton
