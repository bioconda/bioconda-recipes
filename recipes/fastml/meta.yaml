{% set version = "3.11" %}
{% set sha256 = "2d1ec87116eae1163177631ad39083db01cdd78ffb8d119bebbdbb6a43e99451" %}

package:
  name: fastml
  version: {{ version }}

source:
  url: http://fastml.tau.ac.il/source/FastML.v{{ version }}.tgz
  sha256: {{ sha256 }}

build:
  number: 1
  run_exports:
    - {{ pin_subpackage('fastml', max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  run:
    - perl
    - raxml
    - perl-bioperl

test:
  commands:
    - command -v fastml

about:
  home: "http://fastml.tau.ac.il"
  license: "GPL-2.0-or-later"
  license_family: GPL
  summary: "FastML is a bioinformatics tool for the reconstruction of ancestral sequences based on the phylogenetic relations between homologous sequences."
  doc_url: "http://fastml.tau.ac.il"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
