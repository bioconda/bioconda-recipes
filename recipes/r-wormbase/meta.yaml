{% set version = "0.5.1" %}
{% set github = "https://github.com/acidgenomics/r-wormbase" %}

package:
  name: r-wormbase
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: ed44bc627e53fd4bac5217c330d9a2d70a63095fc27dc2508e2bdf8d162f5c18

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('r-wormbase', max_pin="x.x") }}

requirements:
  host:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - r-acidbase >=0.7.8
    - r-acidcli >=0.3.3
    - r-acidgenerics >=0.7.11
    - r-acidplyr >=0.5.8
    - r-goalie >=0.7.10
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1
    # Suggests:
    - r-httr2 >=0.2.3
  run:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - r-acidbase >=0.7.8
    - r-acidcli >=0.3.3
    - r-acidgenerics >=0.7.11
    - r-acidplyr >=0.5.8
    - r-goalie >=0.7.10
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1
    # Suggests:
    - r-httr2 >=0.2.3

test:
  commands:
    - $R -e "library('WormBase')"

about:
  home: https://r.acidgenomics.com/packages/wormbase/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: Fetch Caenorhabditis elegans genome annotations from WormBase.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
