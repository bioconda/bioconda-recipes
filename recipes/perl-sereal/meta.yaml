{% set name = "perl-sereal" %}
{% set version = "6.003" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/Y/YV/YVES/Sereal-{{ version }}.tar.gz
  sha256: 67d87fdfb9cdae205b6e52f6f998a1347ad000d1cac98d8e5d06017b2231d2fb

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
    - perl-pathtools
    - perl-scalar-list-utils
    - perl-test-deep 
    - perl-test-differences
    - perl-test-longstring
    - perl-test-simple
    - perl-test-warn
    - perl-sereal-decoder >={{ version }}
    - perl-sereal-encoder >={{ version }}
  run:
    - perl
    - perl-sereal-decoder >={{ version }}
    - perl-sereal-encoder >={{ version }}

test:
  imports:
    - Sereal::Performance

about:
  home: "https://metacpan.org/pod/Sereal"
  license: "Perl_5"
  summary: "Fast, compact, powerful binary (de-)serialization."
  doc_url: "https://metacpan.org/pod/Sereal"
