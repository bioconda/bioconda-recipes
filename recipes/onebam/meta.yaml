{% set version = "1.2" %}

package:
  name: onebam
  version: {{ version }}

source:
  url: https://github.com/richarddurbin/onebam/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1f900f2f2d49b54a19f33976cfefbe168ec58ab454d06d35e0280bfbf551db7c

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('onebam', max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
  host:
    - htslib
    - zstd
    - libcurl
    - bzip2
    - xz
    - zlib
  run:
    - htslib

test:
  commands:
    - onebam 2>&1 | head -5
    - bamsort 2>&1 | head -5
    - ONEview 2>&1 | head -5
    - ONEstat 2>&1 | head -5
    - seqstat 2>&1 | head -5
    - seqconvert 2>&1 | head -5

about:
  home: https://github.com/richarddurbin/onebam
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "ONEcode replacement for SAM/BAM in large-scale eDNA mapping and taxonomic analysis."
  description: |
    onebam converts read-sorted SAM/BAM/CRAM files into a compact ONEcode
    .1read format, storing reads with sequences, quality scores, best-match
    damage information, and taxonomy hit data. It supports merging, LCA
    (Lowest Common Ancestor) assignment, taxonomic reporting, and read
    extraction, making it suitable for eDNA workflows mapping against very
    large reference databases such as all of NCBI.
  doc_url: https://github.com/richarddurbin/onebam
  dev_url: https://github.com/richarddurbin/onebam

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - compiler_needs_stdlib_c  # https://github.com/bioconda/bioconda-utils/issues/1095
  recipe-maintainers:
    - 7PintsOfCherryGarcia
