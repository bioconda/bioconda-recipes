{% set name = "rammap" %}
{% set version = "1.1.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/jwanglab/rammap/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 39b9e74da0b39546d39c992f8e8c91ce9da97a7ac0f0045d541c44e0106eb17b

build:
  number: 1
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - rammap --version
    - rammap --help

about:
  home: "https://github.com/jwanglab/rammap"
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "An extensible and performant aligner and read mapper."
  description: |
    rammap is a pure-Rust, minimap2-compatible sequence aligner and read mapper.
    It is designed to be extensible and performant for mapping sequencing reads
    against reference sequences.
  dev_url: "https://github.com/jwanglab/rammap"
  doc_url: "https://github.com/jwanglab/rammap/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - thanhleviet
