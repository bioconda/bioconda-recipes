{% set name = "timsrust_pyo3" %}
{% set version = "0.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/jspaezp/timsrust_pyo3/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 7e98005a3a9b3071fc1c851a618d005ad41e9818e31faa9e03efb4d4981a7810

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.3,<2.0
  run:
    - python

test:
  imports:
    - timsrust_pyo3

about:
  home: https://github.com/jspaezp/timsrust_pyo3
  dev_url: https://github.com/jspaezp/timsrust_pyo3
  license: Apache-2.0
  license_file: THIRDPARTY.yml
  summary: Python bindings to the TimsRust reader
  description: |
    timsrust_pyo3 provides Python bindings to TimsRust, a high-performance Rust ecosystem for reading and preprocessing Bruker timsTOF mass spectrometry data.
    TimsRust provides type-safe, composable abstractions for working with liquid chromatography coupled to trapped ion mobility spectrometry (LC-TIMS-TOF) data in multiple formats.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - wagnerr-umn
