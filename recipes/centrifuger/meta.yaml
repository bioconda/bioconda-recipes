{% set name = "centrifuger" %}
{% set version = "1.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

source:
  url: https://github.com/mourisl/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: cf2c4f0a1535e2175e32fa3bccdd133a8cf029a4302a9b07be0ad084b35260bb

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - zlib
  run:
    - perl
    - wget
    - tar
    - python

test:
  commands:
    - centrifuger -v | grep 'Centrifuger v'
    - centrifuger-inspect 2>&1 | grep 'Required'

about:
  home: "https://github.com/mourisl/centrifuger"
  license: MIT
  license_family: MIT
  summary: "Lossless compression of microbial genomes for efficient and accurate metagenomic sequence classification."
  dev_url: "https://github.com/mourisl/centrifuger"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1101/2023.11.15.567129
