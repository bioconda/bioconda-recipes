{% set version = "1.1.1" %}

package:
  name: g_capsul
  version: {{ version }}

source:
  url: https://github.com/thackshanaramana0-spec/g_capsul/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 4007492f3641242f814a6cde320f93607c3faf2e7159e8028c4a65341187f10d

build:
  number: 0
  skip: True  # [not linux]
  run_exports:
    - {{ pin_subpackage("g_capsul", max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - xz
  run:
    - xz

test:
  commands:
    - best106 --version
    - capsule_decode --version

about:
  home: https://github.com/thackshanaramana0-spec/g_capsul
  license: Apache-2.0
  license_file: LICENSE
  summary: Reference-free FASTQ compressor with archive-native variant calling
  dev_url: https://github.com/thackshanaramana0-spec/g_capsul

extra:
  recipe-maintainers:
    - thackshanaramana0-spec
