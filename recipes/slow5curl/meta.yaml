{% set name = "slow5curl" %}
{% set version = "0.3.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/BonsonW/slow5curl/releases/download/v{{ version }}/slow5curl-v{{ version }}-release.tar.gz
  sha256: 4846f2a6c4ed26c344ec372e6eb1ec0cfcce1da7bd2d7d967e63b9ad97a89224

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - zlib
    - wget
    - curl
  run:
    - curl

test:
  commands:
    - slow5curl --help
    - slow5curl --version

about:
  home: "https://github.com/BonsonW/slow5curl"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Tool for accessing remote BLOW5 files."
  description: 'slow5curl is a command line tool for fetching reads from remote BLOW5 files, which is built on top of slow5lib and libcurl.'
  dev_url: "https://github.com/BonsonW/slow5curl"
  doc_url: "https://bonsonw.github.io/slow5curl"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
