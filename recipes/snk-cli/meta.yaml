{% set name = "snk-cli" %}
{% set version = "0.8.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace("-","_") }}-{{ version }}.tar.gz
  sha256: 62339e1a45e8c06916212a91340fc49dd3fc3f3ac4aff4e9a7f283c4ab10db6f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - hatchling
    - pip
  run:
    - python >=3.8
    - snakemake-minimal >=7  # [py < 314]
    - snakemake-minimal >=9.22  # [py >= 314]
    - typer >=0.9,<1.dev0
    - shellingham >=1.3.0
    - rich >=10.11.0
    - pulp <2.8
    - ascii-art >=5.9,<6.dev0
    - makefun >=1.15,<2.dev0
    - datrie >=0.8.2
    - graphviz >=2.38.0
    - packaging

test:
  imports:
    - snk_cli

about:
  home: "https://github.com/wytamma/snk-cli"
  dev_url: "https://github.com/wytamma/snk-cli"
  summary: "Dynamically generate CLIs from Snakemake configuration files."
  license: MIT
  license_family: MIT
  license_file: "LICENSE.txt"

extra:
  recipe-maintainers:
    - Wytamma
