{% set name = "nextpyper" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f5f7f11ae803107f6427a3acd62c97d325256460dcf7c504132f4388f36b5cf7

build:
  entry_points:
    - nextpyper = nextpyper.__main__:main
    - my-cli = nextpyper.src:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.12
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=3.12
    - snaketool-utils >=0.0.4
    - snakemake >=9.21
    - pyyaml >=6.0
    - click >=8.1.3
    - rich-click >=1.9.7
    - pandas >=2.2
    - biopython >=1.83
    - numpy >=1.26
    - scikit-learn >=1.5
    - scipy >=1.14
    - polars >=1.32.3
    - intervaltree >=3.1
    - kmedoids >=0.5.3.1
    - more-itertools >=10.7

test:
  commands:
    # - pip check
    - nextpyper --help
  # requires:
  #   - pip

about:
  summary: Recovery of homoeologous loci from target capture data in higher ploidy samples
  home: "https://m2bl.github.io/NextPyper"
  doc_url: "https://m2bl.github.io/NextPyper"
  dev_url: "https://github.com/M2BL/NextPyper"
  license: MIT
  license_file: nextpyper/nextpyper.LICENSE

extra:
  recipe-maintainers:
    - sivico26
  skip-lints:
    - missing_run_exports
