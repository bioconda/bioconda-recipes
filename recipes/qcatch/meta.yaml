{% set name = "qcatch" %}
{% set version = "0.2.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/qcatch-{{ version }}.tar.gz
  sha256: 0dbb13452436bbcc69903da95206eebbfa272a516e0f83e002c96c519d031e38

build:
  entry_points:
    - qcatch = qcatch.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage('qcatch', max_pin="x.x") }}

requirements:
  host:
    - python ==3.12.9
    - hatchling
    - pip
  run:
    - python ==3.12.9
    - numpy ==2.1.3
    - scipy ==1.15.2
    - pandas ==2.2.3
    - beautifulsoup4 ==4.13.3
    - pyroe ==0.9.0
    - scanpy ==1.10.4
    - plotly ==6.0.0
    - python-igraph ==0.11.8
    - requests
    - hdf5plugin >=4

test:
  requires:
    - pytest
  files:
    - test_hdf5_compression.py
  imports:
    - qcatch
  commands:
    - qcatch --help
    - python -c "import hdf5plugin; import h5py; assert h5py.h5z.filter_avail(32001)"

about:
  home: "https://github.com/COMBINE-lab/QCatch"
  summary: "QCatch: Quality Control downstream of alevin-fry / simpleaf."
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  dev_url: "https://github.com/COMBINE-lab/QCatch"

extra:
  recipe-maintainers:
    - ygao61
