{% set name = "kmask" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/yge15/kmask/archive/refs/tags/v{{ version }}.tar.gz
  sha256: <paste the sha256 from step 3>

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - make

test:
  commands:
    - kmask -h

about:
  home: https://github.com/yge15/kmask
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: Entropy-based masking of low-complexity k-mers for Kraken2/KrakenUniq databases

extra:
  recipe-maintainers:
    - yge15