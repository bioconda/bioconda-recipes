{% set name = "kmask" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/yge15/kmask/archive/refs/tags/v{{ version }}.tar.gz
  sha256: d1b261d02c51d4f8455bf622dc21518d777179f9aa6186a99984ce810af25013

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("kmask", max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make

test:
  commands:
    - kmask -h

about:
  home: https://github.com/yge15/kmask
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: Entropy-based masking of low-complexity k-mers for Kraken2/KrakenUniq databases

extra:
  recipe-maintainers:
    - yge15