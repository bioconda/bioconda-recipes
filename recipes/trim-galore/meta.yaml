{% set name = "trim-galore" %}
{% set version = "2.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/FelixKrueger/TrimGalore/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5bace0caf71abb2d35bbef9a5b3a1edb6e2b7062963c194768dfb0dfa6f4ffad

build:
  number: 2
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - make
    - pkg-config
  host:
    - zlib
  run:
    - zlib

test:
  commands:
    - which trim_galore
    - trim_galore --version | grep -q '^Trim Galore'

about:
  home: https://www.trimgalore.com/
  dev_url: https://github.com/FelixKrueger/TrimGalore
  summary: "Fast adapter and quality trimming for NGS data — Oxidized Edition (Rust)"
  description: |
    Trim Galore v2 is a Rust rewrite of the original Perl Trim Galore. Single
    static binary, no Python/Perl/Cutadapt/Java/igzip/pigz dependencies. Drop-in
    compatible with v0.6.x scripts and pipelines (same CLI, same output
    filenames, same report format) with adapter auto-detection (Illumina,
    Nextera, Small RNA, BGI/DNBSEQ), poly-G/poly-A trimming, paired-end
    single-pass processing, RRBS support, and bundled FastQC integration via
    fastqc-rust.
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE

extra:
  notes: |
    Built natively from the GitHub source tarball using the conda-forge Rust
    toolchain (rust >= 1.88). Replaces the prebuilt-binary install pattern
    used in v2.2.0 builds 0 and 1 — eliminates the glibc-2.39 baseline issue
    and declares the libz runtime dependency (via host/run zlib) that
    transitive crates (fastqc-rust→zip, noodles-bgzf) pull through Cargo's
    feature unification. See bioconda/bioconda-recipes#65446 for the
    diagnosis context.
  skip-lints:
    - should_be_noarch_generic
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - usegalaxy-eu:trim_galore
  recipe-maintainers:
    - FelixKrueger
    - ewels
