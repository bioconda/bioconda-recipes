{% set version = "1.38.0" %}
{% set name = "MultiAssayExperiment" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  sha256: 6ae5fd573b503134f2cd4108c47d2178e293467e70c0053cddae6d545828192e

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-multiassayexperiment", max_pin="x.x") }}'
  noarch: generic

# Suggests: BiocStyle, HDF5Array, h5mread, knitr, maftools, RaggedExperiment, reshape2, rmarkdown, survival, survminer, testthat, UpSetR
requirements:
  host:
    - bioconductor-biobase >=2.72.0,<2.73.0
    - bioconductor-biocbaseutils >=1.14.0,<1.15.0
    - bioconductor-biocgenerics >=0.58.0,<0.59.0
    - bioconductor-delayedarray >=0.38.0,<0.39.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-s4vectors >=0.50.0,<0.51.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-tidyr
  run:
    - bioconductor-biobase >=2.72.0,<2.73.0
    - bioconductor-biocbaseutils >=1.14.0,<1.15.0
    - bioconductor-biocgenerics >=0.58.0,<0.59.0
    - bioconductor-delayedarray >=0.38.0,<0.39.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-s4vectors >=0.50.0,<0.51.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-tidyr

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: Artistic-2.0
  summary: Software for the integration of multi-omics experiments in Bioconductor
  description: Harmonize data management of multiple experimental assays performed on an overlapping set of specimens.  It provides a familiar Bioconductor user experience by extending concepts from SummarizedExperiment, supporting an open-ended mix of standard data classes for individual assays, and allowing subsetting by genomic ranges or rownames. Facilities are provided for reshaping data into wide and long formats for adaptability to graphing and downstream analysis.

extra:
  identifiers:
    - biotools:multiassayexperiment
    - doi:10.1101/144774
  parent_recipe:
    name: bioconductor-multiassayexperiment
    path: recipes/bioconductor-multiassayexperiment
    version: 1.6.0

