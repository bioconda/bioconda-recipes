{% set name = "nanoporetk" %}
{% set version = "0.8.10" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://gitlab.com/FLI_Bioinfo/nanoporetk/-/archive/v{{ version }}/nanoporetk-v{{ version }}.tar.gz
  sha256: 2529af457afc2a3847c69c7680100fa776e863c8f346515d7e0a9eb51caa465f

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  run:
    - bash
    - python

test:
  commands:
    - nanoporeTK --version

about:
  home: https://gitlab.com/FLI_Bioinfo/nanoporetk
  dev_url: https://gitlab.com/FLI_Bioinfo/nanoporetk
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Process Oxford Nanopore sequencing data"

extra:
  recipe-maintainers:
    - magbio