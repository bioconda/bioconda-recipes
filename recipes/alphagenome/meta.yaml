{% set name = "alphagenome" %}
{% set version = "0.11.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3afc81a6aeff9c1374fe2bf686b2340a248511da9e2c451b46527feb2de5d8c9

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - hatchling
    # The generated protobuf and gRPC modules refuse to load on a runtime
    # older than the tools that generated them. TensorFlow on conda-forge pins
    # protobuf 6.33 and grpcio 1.78, and alphagenome-research needs it in the
    # same env, so generate with those and take the runtime floor from host.
    - grpcio-tools 1.78.*
    - grpcio
    - protobuf 6.*
  run:
    - python >=3.11
    - absl-py
    - anndata
    - {{ pin_compatible('grpcio', max_pin=None) }}
    - immutabledict
    - intervaltree
    - jaxtyping
    - matplotlib-base
    - ml_dtypes
    - numpy
    - pandas
    - {{ pin_compatible('protobuf', max_pin=None) }}
    - pyarrow
    - scipy
    - seaborn
    - tqdm
    - typeguard
    - typing-extensions
    - zstandard

test:
  imports:
    - alphagenome
    - alphagenome.data
    - alphagenome.models

about:
  home: https://github.com/google-deepmind/alphagenome
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Python SDK for interacting with and visualizing AlphaGenome genomic models
  description: |
    AlphaGenome is a unified DNA sequence model from Google DeepMind for
    regulatory variant-effect prediction. This package provides the Python
    SDK for interacting with the AlphaGenome API and visualizing predictions
    across gene expression, splicing, chromatin features, and contact maps.
  doc_url: https://www.alphagenomedocs.com/
  dev_url: https://github.com/google-deepmind/alphagenome

extra:
  recipe-maintainers:
    - dannon
