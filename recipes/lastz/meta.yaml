{% set name = "lastz" %}
{% set version = "1.04.60" %}
# 1.04.60 is lastz master at fbc303c (2026-09-28), which merged lastz#78 (segfault when --masking is
# combined with --segments) and lastz#80 (gcc 15 build failure) and set its version to 1.04.60; it is not
# tagged yet. Switch source back to the release tarball once 1.04.60 is tagged.
{% set commit = "fbc303c77f60fdaf6e9830e3c723d77f7b296e36" %}

package:
  name: {{ name }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('lastz', max_pin='x') }}

source:
  url: https://github.com/lastz/lastz/archive/{{ commit }}.tar.gz
  sha256: 3aec02eee8bbf5138fa468c431efae50c457299afcf2d7897a78e8656ba99577
  patches:
    - makefile.patch

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}

test:
  commands:
    - lastz --version 2>&1 | grep {{ version }} > /dev/null

about:
  home: "https://www.bx.psu.edu/~rsharris/lastz"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "LASTZ is a program for aligning DNA sequences, a pairwise aligner."
  dev_url: "https://github.com/lastz/lastz"
  doc_url: "https://lastz.github.io/lastz"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:lastz
