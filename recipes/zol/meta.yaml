{% set name = "zol" %}
{% set version = "1.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://github.com/Kalan-Lab/zol/archive/refs/tags/v{{ version }}.tar.gz
    sha256: f09d575f2386f109a5cbb30eda478f5cf27b8b8fbc74f727c2ac353ea0d0ea68
    folder: zol_folder
    
build:
  number: 1
  noarch: python
  run_exports:
    - {{ pin_subpackage('zol', max_pin="x") }}
  script:
    - set -xe
    - mkdir -p ${PREFIX}/bin
    - # setup gravis from forked version
    - # pip installation configuration based on conda-forge recipe: https://github.com/conda-forge/gravis-feedstock/blob/main/recipe/meta.yaml
    - cd ../zol_folder/
    - "{{ PYTHON }} -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv"
    - export LDFLAGS=
    - ${CXX} -std=c++14 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/runRBH src/zol/orthologs/runRBH.cpp
    - ${CXX} -std=c++14 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/splitDiamondResults src/zol/orthologs/splitDiamondResults.cpp
    - ${CXX} -std=c++14 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/splitDiamondResultsForFai src/zol/splitDiamondResultsForFai.cpp
    - chmod +x ${PREFIX}/bin/runRBH
    - chmod +x ${PREFIX}/bin/splitDiamondResults 
    - chmod +x ${PREFIX}/bin/splitDiamondResultsForFai
    - # create folder for database download
    - ZOL_DATA_PATH="${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}/db"
    - ZOL_EXEC_PATH="${PREFIX}/bin"
    - mkdir -p "${ZOL_DATA_PATH}"
    - echo 'Default conda space for downloading annotation databases.\n' > ${ZOL_DATA_PATH}/README.txt
    - # set ZOL_DATA_PATH and ZOL_EXEC_PATH variables on env activation
    - mkdir -p ${PREFIX}/etc/conda/activate.d ${PREFIX}/etc/conda/deactivate.d
    - cat <<EOF >> ${PREFIX}/etc/conda/activate.d/zol.sh; export ZOL_DATA_PATH=${ZOL_DATA_PATH}; export ZOL_EXEC_PATH=${ZOL_EXEC_PATH}; EOF
    - cat <<EOF >> ${PREFIX}/etc/conda/deactivate.d/zol.sh; unset ZOL_DATA_PATH; unset ZOL_EXEC_PATH; EOF

echo "Users of zol, please note, we use an unofficial fork of gravis (v0.1.1; https://github.com/raufs/gravis), not the original/official gravis (https://github.com/robert-haas/gravis)"

requirements:
  build:
     - {{ compiler('cxx') }}
     - {{ stdlib('c') }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python >=3.10
    - pip
    - curl
    - setuptools
    - r-base
    - biopython
    - muscle =5.1
    - famsa >2
    - mcl
    - pal2nal >=14.1
    - hmmer >=3.0.0
    - fasttree
    - diamond =2.1.11
    - pyrodigal
    - prodigal
    - prodigal-gv
    - pyhmmer =0.11.4
    - libopenblas
    - pympler
    - pandas >=2.0
    - xlsxwriter >=3.0.3
    - scikit-learn
    - hyphy >=2.5.14
    - pomegranate >=1.0.0
    - r-ggplot2
    - r-cowplot
    - r-gggenes
    - r-gridextra
    - skani >=0.2.2
    - slclust
    - trimal
    - gzip
    - miniprot =0.13  # [x86_64]
    - miniprot >=0.13  # [not x86_64]
    - bioconductor-ggtree
    - ete3
    - legacy-cgi 
    - codoff >=1.2.3
    - colour
    - rich-argparse
    - tqdm
    - aiofile
    - aiohttp
    - peptides
    - pip:
      - gravis @ https://github.com/raufs/gravis/archive/refs/tags/v0.1.1.tar.gz

test:
  commands:
    - zol -h

about:
  home: "https://github.com/Kalan-Lab/zol"
  license: "BSD-3-Clause"
  license_file: zol_folder/LICENSE
  license_family: BSD
  summary: "zol (& fai): large-scale targeted detection and evolutionary investigation of gene clusters."
  dev_url: "https://github.com/Kalan-Lab/zol"
  doc_url: "https://github.com/Kalan-Lab/zol/wiki"
  
extra:
  recipe-maintainers:
    - raufs
