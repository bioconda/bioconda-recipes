{% set name = "zol" %}
{% set version = "1.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Kalan-Lab/zol/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f09d575f2386f109a5cbb30eda478f5cf27b8b8fbc74f727c2ac353ea0d0ea68
  folder: zol_folder

build:
  number: 2
  skip: True  # [py < 311]
  run_exports:
    - {{ pin_subpackage('zol', max_pin="x") }}
  script:
    - set -euxo pipefail
    - mkdir -p "${PREFIX}/bin"
    - cd "${SRC_DIR}/zol_folder"
    - "{{ PYTHON }} -m pip install 'gravis @ https://github.com/raufs/gravis/archive/refs/tags/v0.1.1.tar.gz#sha256=d8a8b09a23522ab746eea740adc05f22cb6a1d5190c1b64ee4f304e62b37268b' --no-deps --no-build-isolation -vv"
    - "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
    - ${CXX} ${CXXFLAGS} -std=c++14 -o "${PREFIX}/bin/runRBH" src/zol/orthologs/runRBH.cpp ${LDFLAGS}
    - ${CXX} ${CXXFLAGS} -std=c++14 -o "${PREFIX}/bin/splitDiamondResults" src/zol/orthologs/splitDiamondResults.cpp ${LDFLAGS}
    - ${CXX} ${CXXFLAGS} -std=c++14 -o "${PREFIX}/bin/splitDiamondResultsForFai" src/zol/splitDiamondResultsForFai.cpp ${LDFLAGS}
    - mkdir -p "${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}/db" "${PREFIX}/etc/conda/activate.d" "${PREFIX}/etc/conda/deactivate.d"
    - printf '%s\n' 'Default conda space for downloading annotation databases.' > "${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}/db/README.txt"
    - printf 'export ZOL_DATA_PATH="${CONDA_PREFIX}/share/%s/db"\nexport ZOL_EXEC_PATH="${CONDA_PREFIX}/bin"\n' "${PKG_NAME}-${PKG_VERSION}" > "${PREFIX}/etc/conda/activate.d/zol.sh"
    - printf 'unset ZOL_DATA_PATH\nunset ZOL_EXEC_PATH\n' > "${PREFIX}/etc/conda/deactivate.d/zol.sh"

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - curl
    - r-base
    - biopython
    - muscle =5.1
    - famsa >2
    - mcl
    - pal2nal >=14.1
    - hmmer >=3.0.0
    - fasttree
    - diamond =2.1.11
    - pyrodigal
    - prodigal
    - prodigal-gv
    - pyhmmer =0.11.4
    - libopenblas
    - pympler
    - pandas >=2.0
    - xlsxwriter >=3.0.3
    - scikit-learn
    - hyphy >=2.5.14
    - pomegranate >=1.0.0
    - r-ggplot2
    - r-cowplot
    - r-gggenes
    - r-gridextra
    - skani >=0.2.2
    - slclust
    - trimal
    - gzip
    - miniprot =0.13  # [x86_64]
    - miniprot >=0.13  # [not x86_64]
    - bioconductor-ggtree
    - ete3
    - legacy-cgi
    - codoff >=1.2.3
    - colour
    - rich-argparse
    - tqdm
    - aiofile
    - aiohttp
    - peptides

test:
  requires:
    - pip
  imports:
    - zol
    - gravis
  commands:
    - pip check
    - zol -h
    - fai -h
    - test -x ${PREFIX}/bin/runRBH
    - test -x ${PREFIX}/bin/splitDiamondResults
    - test -x ${PREFIX}/bin/splitDiamondResultsForFai

about:
  home: "https://github.com/Kalan-Lab/zol"
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: zol_folder/LICENSE
  summary: "zol (& fai): large-scale targeted detection and evolutionary investigation of gene clusters."
  dev_url: "https://github.com/Kalan-Lab/zol"
  doc_url: "https://github.com/Kalan-Lab/zol/wiki"

extra:
  additional-platforms:
    - osx-arm64
    - linux-aarch64
  recipe-maintainers:
    - raufs
