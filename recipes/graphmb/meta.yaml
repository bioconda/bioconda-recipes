{% set name = "graphmb" %}
{% set version = "0.2.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/graphmb-{{ version }}.tar.gz
  sha256: 234017e2b3182c67e45a03b2cd85b8752fc6f943e9a245ed4c0d42717018c0c2

build:
  entry_points:
    - graphmb=graphmb.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python
    - pip
  run:
    - python
    - requests
    - networkx >=2.6.2
    - pytorch >=1.13.1
    - tensorflow >=2.11.1
    - tqdm >=4.61.2
    - mlflow >=2.3.1
    - importlib-resources

test:
  imports:
    - graphmb
  commands:
    - graphmb --help

about:
  home: https://github.com/MicrobialDarkMatter/GraphMB
  summary: GraphMB is a Metagenomic Binner developed for long-read assemblies, that takes advantage of graph machine learning algorithms and the assembly graph generated during assembly.
  license: MIT
  license_file: LICENSE

