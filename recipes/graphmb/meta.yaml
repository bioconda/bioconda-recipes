{% set version = "0.2.6" %}

package:
  name: graphmb
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/g/graphmb/graphmb-{{ version }}.tar.gz
  sha256: 234017e2b3182c67e45a03b2cd85b8752fc6f943e9a245ed4c0d42717018c0c2

build:
  entry_points:
    - graphmb=graphmb.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  run_exports:
    - {{ pin_subpackage('graphmb', max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - setuptools >=58.0,<59.dev0
    - pip >=19,!=20.0,!=20.0.1,<21
    - wheel
    - sphinx_rtd_theme
    - twine
  run:
    - python >=3.8
    - wheel
    - requests
    - networkx ==2.6.2
    - pytorch ==1.13.1
    - tensorflow ==2.11.1
    - tqdm ==4.61.2
    - mlflow ==2.6.0
    - importlib_resources

test:
  imports:
    - graphmb
  commands:
    - pip check
    - graphmb --help
  requires:
    - pip
    - python

about:
  home: https://github.com/MicrobialDarkMatter/GraphMB
  summary: GraphMB is a Metagenomic Binner developed for long-read assemblies, that takes advantage of graph machine learning algorithms and the assembly graph generated during assembly.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - AndreLamurias
