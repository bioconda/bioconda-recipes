{% set name = "rnanorm" %}
{% set version = "2.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rnanorm-{{ version }}.tar.gz
  sha256: 0cb25c2c31aa77c8fe8263b09dff5f96690a4b90c7ac0ebce9a905f0b102440e

build:
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
  entry_points:
    - rnanorm = rnanorm.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9,<3.14
    - setuptools >=64.0.0
    - setuptools-scm >=6.4.0
    - pip
  run:
    - python >=3.9,<3.14
    - click
    - numpy >=1.0.0
    - pandas >=1.0.0
    - scikit-learn >=1.6.0
    - pandera

test:
  imports:
    - rnanorm
  commands:
    - pip check
    - rnanorm --help
  requires:
    - pip

about:
  summary: Common RNA-seq normalization methods
  license: Apache-2.0
  license_file: LICENSE
  home: https://github.com/genialis/RNAnorm

extra:
  recipe-maintainers:
    - VinzentRisch
