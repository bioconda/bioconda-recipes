{% set version = "0.6.2" %}
{% set sha256 = "2b5480e5b3163c67bcf49820c476a7f4c05a17c13adba0ea0577b1c2ad1c17bc" %}

package:
  name: genrich
  version: {{ version }}

source:
  url: https://github.com/jsh58/Genrich/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - Makefile.patch
    - getlong-reject-nonpositive.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('genrich', max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - zlib

test:
  commands:
    - which Genrich
    - Genrich -V 2>&1 | grep 'John M. Gaspar'
    - Genrich -V 2>&1 | grep '0.6.2'
    # -L is upstream code as of 0.6.2. The -L 0 check is the regression test
    # for getlong-reject-nonpositive.patch: without it stock 0.6.2 accepts any
    # non-positive -L. 0 falls through to the auto-computed genome length,
    # while a negative value is cast to uint64_t and wraps to 2^64-1, which
    # collapses the background lambda and inflates every q-value derived from
    # it -- silently, at exit status 0.
    - Genrich -L 0 2>&1 | grep 'Genome length must be a positive int'
    - Genrich -L 1000 2>&1 | grep 'Need input/output files'

about:
  home: "https://github.com/jsh58/Genrich"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Detecting sites of genomic enrichment."
  dev_url: "https://github.com/jsh58/Genrich"
  doc_url: "https://github.com/jsh58/Genrich/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - usegalaxy-eu:genrich
