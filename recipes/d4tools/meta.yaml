{% set name = "d4tools" %}
{% set version = "0.3.11" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/38/d4-format/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 376e61c93cfe2efc15f5e74b75214e065e278146555e67b8769818bf49594726
  patches:
    # upstream fix (include-path only): https://github.com/38/d4-format/pull/119
    # this patch additionally includes two bioconda-specific changes not in #119:
    # - hard-fails instead of silently falling back to a vendored htslib build if HTSLIB=system
    #   is requested but pkg-config can't find htslib
    # - bumps the pinned bindgen 0.55.1 -> 0.72.1: 0.55.1 panics generating bindings for real
    #   htslib structs (e.g. htsFormat) on some platforms, since it detects anonymous
    #   structs/unions by checking for an empty clang-reported name rather than clang's own
    #   is_anonymous() API, and can hand a non-identifier debug string to Ident::new(). Fixed
    #   upstream in rust-bindgen PR #2319 (bindgen/bindgen#2319), included by 0.72.1.
    - fix-system-htslib-include-path.patch

build:
  number: 4
  run_exports:
    - {{ pin_subpackage('d4tools', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - clangdev
    - pkg-config
    - make
    - cmake
    - perl
  host:
    - curl
    - tar
    - htslib
    - zlib
    - xz
    - bzip2
  run:
    - starcode
    - htslib

test:
  files:
    - test-data/test.cram
    - test-data/test.cram.crai
    - test-data/ref.fa
    - test-data/ref.fa.fai
    - test-data/expected_output.txt
  commands:
    - d4tools --help
    # confirm htslib is dynamically linked (not a static/vendored htslib creeping back in).
    # Checking the *resolved path* is unreliable across toolchains: on osx, otool -L reports
    # each dylib's own (usually @rpath-relative) install name, never an absolute path; on the
    # aarch64 CI image, ldd's resolved path is a literal, unexpanded "$PREFIX/..." template
    # rather than the real absolute path, even though the library does load correctly (valid
    # address, and the CRAM decode test below proves it's the right one end to end).
    - ldd $(command -v d4tools)  # [linux]
    - ldd $(command -v d4tools) | grep -q libhts.so  # [linux]
    - otool -L $(command -v d4tools) | grep -q libhts  # [osx]
    # exercise real CRAM decoding (test.cram is CRAM v3.1, the format this recipe's
    # system-htslib fix targets -- see test-data/README.md) rather than just linking/--help
    - d4tools create -r test-data/ref.fa.fai test-data/test.cram test-output.d4
    - d4tools view test-output.d4 | diff - test-data/expected_output.txt

about:
  home: "https://github.com/38/d4-format"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "The D4 command line utility program."
  dev_url: "https://github.com/38/d4-format"
  doc_url: "https://github.com/38/d4-format/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1038/s43588-021-00085-0
  recipe-maintainers:
    - haohou
