{% set name = "d4tools" %}
{% set version = "0.3.11" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/38/d4-format/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 376e61c93cfe2efc15f5e74b75214e065e278146555e67b8769818bf49594726
  patches:
    # pull request for fix: https://github.com/38/d4-format/pull/119
    - fix-system-htslib-include-path.patch

build:
  number: 4
  run_exports:
    - {{ pin_subpackage('d4tools', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - clangdev
    - pkg-config
    - make
    - cmake
    - perl
  host:
    - curl
    - tar
    - htslib
    - zlib
    - xz
  run:
    - starcode
    - htslib

test:
  commands:
    - d4tools --help
    # check if the htslib that d4tools uses is the same as the one vendored by bioconda
    - ldd $(command -v d4tools) | grep -q libhts.so  # [linux]

about:
  home: "https://github.com/38/d4-format"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "The D4 command line utility program."
  dev_url: "https://github.com/38/d4-format"
  doc_url: "https://github.com/38/d4-format/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1038/s43588-021-00085-0
  recipe-maintainers:
    - haohou
