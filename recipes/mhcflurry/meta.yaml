{% set name = "mhcflurry" %}
{% set version = "2.3.13" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 97424ecdd9d5da2b895754afe5d106b40e90f979d443a4f26812bd2d0b853f9e

build:
  number: 0
  noarch: python
  entry_points:
    - mhcflurry = mhcflurry.cli.main:main
    - mhcflurry-downloads = mhcflurry.cli.downloads_command:run
    - mhcflurry-pseudosequences = mhcflurry.pseudosequences:main
    - mhcflurry-predict = mhcflurry.cli.predict_command:run
    - mhcflurry-predict-scan = mhcflurry.cli.predict_scan_command:run
    - mhcflurry-class1-train-allele-specific-models = mhcflurry.cli.train_allele_specific_models_command:run
    - mhcflurry-class1-train-pan-allele-models = mhcflurry.cli.train_pan_allele_models_command:run
    - mhcflurry-class1-train-processing-models = mhcflurry.cli.train_processing_models_command:run
    - mhcflurry-class1-select-allele-specific-models = mhcflurry.cli.select_allele_specific_models_command:run
    - mhcflurry-class1-select-pan-allele-models = mhcflurry.cli.select_pan_allele_models_command:run
    - mhcflurry-class1-select-processing-models = mhcflurry.cli.select_processing_models_command:run
    - mhcflurry-calibrate-percentile-ranks = mhcflurry.cli.calibrate_percentile_ranks_command:run
    - mhcflurry-class1-train-presentation-models = mhcflurry.cli.train_presentation_models_command:run
    - _mhcflurry-cluster-worker-entry-point = mhcflurry.cluster_parallelism:worker_entry_point
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - pandas >=2.0
    - appdirs
    - ahocorasick-rs
    - threadpoolctl
    - matplotlib-base
    - scikit-learn
    - mhcgnomes >=3.33.6
    - numpy >=1.22.4
    - pytorch >=2.0.0
    - pyyaml
    - tqdm

test:
  imports:
    - mhcflurry
  requires:
    - pip
  commands:
    - python -m pip check
    - mhcflurry --version
    - mhcflurry predict --help
    - mhcflurry downloads releases
    - mhcflurry-pseudosequences --help
    - mhcflurry-downloads --help
    - mhcflurry-predict --help
    - mhcflurry-predict-scan --help
    - mhcflurry-class1-train-allele-specific-models --help
    - mhcflurry-class1-train-pan-allele-models --help
    - mhcflurry-class1-train-processing-models --help
    - mhcflurry-class1-select-allele-specific-models --help
    - mhcflurry-class1-select-pan-allele-models --help
    - mhcflurry-class1-select-processing-models --help
    - mhcflurry-calibrate-percentile-ranks --help
    - mhcflurry-class1-train-presentation-models --help
    - _mhcflurry-cluster-worker-entry-point --help

about:
  home: "https://github.com/openvax/mhcflurry"
  license: "Apache-2.0"
  license_family: APACHE
  license_file: LICENSE
  summary: "MHC Binding Predictor"
  dev_url: "https://github.com/openvax/mhcflurry"
  doc_url: "https://openvax.github.io/mhcflurry"

extra:
  recipe-maintainers:
    - jonasscheid
  identifiers:
    - doi:10.1016/j.cels.2020.06.010
    - doi:10.1016/j.cels.2018.05.014
    - biotools:mhcflurry
