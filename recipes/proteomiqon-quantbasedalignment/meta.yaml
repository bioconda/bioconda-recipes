{% set name = "proteomiqon-quantbasedalignment" %}
{% set version = "0.1.0" %}
{% set sha256 = "ff86748c2a6071a92041b8d68ff10667d05fa68dd6b7ae412efeb653d36c5b3d" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.QuantBasedAlignment/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-quantbasedalignment"
    - test -f "$PREFIX/lib/dotnet/tools/QuantBasedAlignment/ProteomIQon.QuantBasedAlignment.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-quantbasedalignment"
    - grep -q "QuantBasedAlignment/ProteomIQon.QuantBasedAlignment.dll" "$PREFIX/bin/proteomiqon-quantbasedalignment"


about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: "Aligns proteomics runs to predict peptide ion retention times across runs."
  description: | 
    In data dependent acquisition a peptide ion quantified in one run is often present in another run without having been fragmented there. QuantBasedAlignment predicts where such an ion elutes in the run that lacks it.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/quant-based-alignment/
