{% set version = "1.0.1" %}

package:
  name: mastrspy
  version: {{ version }}

source:
  url: https://github.com/DP-Genome/MaSTRspy/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f81d308ff9c14f4cb740e5c27f35a3fdcc44fec2666f89c658b1b96ffe041f66

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - mastrspy = main:main

requirements:
  host:
    - python >=3.9
    - pip
    - hatchling
  run:
    - python >=3.9
    - samtools >=1.19
    - bedtools >=2.31
    - minimap2 >=2.26
    - r-base >=4.3
    - r-ggplot2
    - r-viridis
    - r-png
    - pyside6 >=6.5
    - pysam >=0.21
    - matplotlib >=3.7

test:
  commands:
    - MaSTRspy --help

about:
  home: https://github.com/DP-Genome/MaSTRspy
  license: MIT
  license_file: LICENSE
  summary: GUI-based pipeline for forensic STR profiling from nanopore and long-read sequencing data

extra:
  recipe-maintainers:
    - MalsLabs
