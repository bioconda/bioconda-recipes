## Nemo-age conda package smoke test.
##
## Checking that `nemoage` prints its version only shows that the binary starts.
## This drives a real stage-structured simulation instead: `quanti_pleiotropy full`
## draws mutations through Uniform::MultivariateGaussian, `viability_selection`
## computes Gaussian fitness with the GSL linear algebra, and `stat adlt.quanti`
## runs the quanti stat machinery, so the GSL linkage, the RNG, the life cycle
## and the stats all have to work. run_test.sh then asserts that a non-zero
## additive genetic variance was recorded.
##
## Scaled to run in a few seconds; it is a build check, not a simulation.

run_mode                overwrite
random_seed             13215

root_dir                smoke-out
filename                smoke

replicates              1
generations             300

## POPULATION ##
patch_number            1
patch_capacity          200
patch_init_stage_size   {{0, 100, 100}}

## AGE STRUCTURE AND TRANSITION MATRIX ##
pop_age_structure       {{0, 1, 2}}
pop_transition_matrix   {{0, 0, 5}
                         {0.5, 0, 0}
                         {0, 0.8, 0.5}}

## LIFE CYCLE EVENTS ##
## save_files is what actually flushes the registered file handlers; without it
## the stats are recorded but never written to smoke-out/smoke.txt.
breed                   1
viability_selection     2
aging_multi             3
regulation              4
save_stats              5
save_files              6

## MATING SYSTEM ##
mating_system           1

## REGULATION ##
regulation_carrying_capacity

## SELECTION ##
selection_trait         quant
selection_model         gaussian
selection_trait_dimension 2
selection_variance      {{10}}
selection_local_optima  {{0}}

## QUANTI TRAIT ##
quanti_traits           2
quanti_loci             100
quanti_pleiotropy       full
quanti_allele_model     continuous
quanti_mutation_rate    0.005
quanti_mutation_matrix  {{0.10, 0.02}
                         {0.02, 0.10}}
quanti_init_model       0

## STATS ##
stat                    demography adlt.quanti
stat_log_time           100
