{% set name = "pbfusion" %}
{% set version = "0.6.0" %}
{% set pbfusion_sha256 = "53ff89c8d26b867aeb3152de9bf48f50e2ceda8a3cfbb3dc379a87c959cdf179" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/PacificBiosciences/pbfusion/releases/download/{{ version }}/pbfusion-v{{ version }}-x86_64-unknown-linux-gnu.tar.gz # [linux64]
    sha256: {{ pbfusion_sha256 }} # [linux64]

about:
  home: https://github.com/PacificBiosciences/pbfusion
  license: Pacific Biosciences Software License (https://github.com/PacificBiosciences/pbfusion/blob/master/LICENSE)
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES.txt
  summary: Fusion gene detection tool for PacBio Iso-Seq data

extra:
  recipe-maintainers:
    - zeeev
    - velociroger-pb
    - egor-dolzhenko
    - alevar
  skip-lints:
    - should_be_noarch_generic

build:
  number: 0
  skip: true  # [not linux64]
  noarch: false
  run_exports:
    - {{ pin_subpackage('pbfusion', max_pin="x") }}

test:
  commands:
    - pbfusion --version
