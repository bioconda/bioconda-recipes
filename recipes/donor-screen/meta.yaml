package:
  name: donor-screen
  version: 0.2.5

source:
  - url: https://github.com/yzzzzz7/donor-screen-conda/archive/refs/tags/v0.2.5.tar.gz
    sha256: 0d4ec1d8472101f2732fafc7e57a6cc792f738b0f2443825091ee8e6611bcb10
    folder: workflow
  - url: https://faculty.washington.edu/browning/beagle/beagle.25Mar22.4f6.jar
    sha256: c50713d20d87647fac7781388fc21ab33764eb8b73d99651a44f7f81f8366e79
    folder: beagle-jar
  - url: https://faculty.washington.edu/browning/beagle/beagle.220325.zip
    sha256: f877767ec67f3dc09b37957e2e93e4f1480eac11f34a977ae996d068ec415c6d
    folder: beagle-source

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('donor-screen', max_pin='x.x') }}
  noarch: generic

requirements:
  run:
    - python >=3.10
    - bcftools
    - plink 1.90.*
    - plink2
    - openjdk >=8
    - r-base
    - r-zooroh 0.4.3

test:
  commands:
    - donor-screen --help
    - donor-screen --help | grep -q -- --cds-sites
    - donor-screen --help | grep -q -- --froh-bed
    - donor-screen froh --help
    - Rscript --vanilla -e 'stopifnot(as.character(packageVersion("RZooRoH")) == "0.4.3", is.function(RZooRoH::zookin))'
    - test -s "$CONDA_PREFIX/share/donor-screen/beagle.25Mar22.4f6.jar"

about:
  home: https://github.com/yzzzzz7/donor-screen-conda
  license: MIT AND GPL-3.0-or-later
  license_file:
    - workflow/LICENSE
    - beagle-source/gpl_license
  summary: Recipient-specific conservation donor screening from joint SNP genotypes

extra:
  recipe-maintainers:
    - yzzzzz7
  notes: >-
    The launcher resolves its data directory relative to the Conda prefix.
    The exact Beagle build used in the study is installed at build time.
