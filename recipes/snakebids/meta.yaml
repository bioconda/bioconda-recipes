{% set name = "snakebids" %}
{% set version = "0.17.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/snakebids/snakebids-{{ version }}.tar.gz
  sha256: ae2ab16ba68271a282da4a32c239325bfcad7a5a3b62b208d31b1897d111e72f

build:
  entry_points:
    - snakebids = snakebids.admin:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  number: 1
  run_exports:
    - {{ pin_subpackage('snakebids', max_pin="x.x") }}

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - pybids >=0.21.0,<0.22
    # snakemake 8+ requires python >=3.11, so on 3.10 the solver picks <8
    - snakemake >=7.18.2
    - typing_extensions >=3.10.0
    - attrs >=23.2.0
    - boutiques >=0.5.25
    - more-itertools >=8
    - universal_pathlib >=0.2.2
    - pvandyken-deprecated ==0.0.4
    - importlib-resources >=5.12.0
    - copier >=9.2.0
    - jinja2-time >=0.2.0
    - requests >=2.31.0
    - ruamel.yaml >=0.17.2
    - lazy-loader >=0.3
    - docutils !=0.21.post1
    - pluggy >=1.3

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - snakebids
  commands:
    - pip check
    - snakebids --help

about:
  home: "https://github.com/khanlab/snakebids"
  summary: "BIDS integration into snakemake workflows."
  description: |
    Snakebids is a Python package that extends Snakemake, enabling 
    users to create reproducible, scalable pipelines for processing 
    neuroimaging data in the BIDS format.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/khanlab/snakebids"

extra:
  recipe-maintainers:
    - Dhananjhay
