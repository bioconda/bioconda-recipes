{% set version = "0.0.2" %}

package:
  name: table-five
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/table-five/table_five-{{ version }}.tar.gz
  sha256: 9752b8b51db98306e56476735b627c4ea36f1a3e69895519217bcec0a68fb624

build:
  number: 0
  skip: true  # [py >= 312]
  run_exports:
    - {{ pin_subpackage("table-five", max_pin="x.x") }}
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python >=3.7,<3.12
    - maturin >=0.13,<0.14
    - pip
  run:
    - python >=3.7,<3.12

test:
  imports:
    - table_five
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/RuneBlaze/fifteen
  summary: Fast counting of the 15 unrooted quintet topologies
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - ytabatabaee
