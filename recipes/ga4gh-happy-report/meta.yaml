{% set version = "0.1.2" %}

package:
  name: ga4gh-happy-report
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/ga4gh-happy-report/ga4gh_happy_report-{{ version }}.tar.gz
  sha256: c9f0272d402392771b13684611049d62a78b3baea259736c1d10dbe2169031d5

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  run_exports:
    - {{ pin_subpackage('ga4gh-happy-report', max_pin="x.x") }}
  python:
    entry_points:
      - rep.py = ga4gh_happy_report.report:main
      - ga4gh-happy-report = ga4gh_happy_report.report:main

requirements:
  host:
    - python >=3.9
    - setuptools >=68
    - pip
  run:
    - python >=3.9
    - jinja2 >=3.0

test:
  commands:
    - rep.py --help
    - ga4gh-happy-report --help
  imports:
    - ga4gh_happy_report

about:
  summary: Generate standalone HTML benchmarking reports from GA4GH / hap.py variant-calling metrics CSVs
  license: Apache-2.0
  license_file: LICENSE
  home: https://github.com/bag-cnag/ga4gh-happy-report

extra:
  recipe-maintainers:
    - georgiakes
