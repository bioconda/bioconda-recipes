{% set name = "genome_updater" %}
{% set version = "0.9.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://github.com/pirovc/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: b7fac76b7a5d6d183c94b4aa3eada56e4831c4f9c4b6dd73bf61fcdbee4b6a7e

    
build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  noarch: generic

requirements:
  run:
    - tar
    - bc
    - parallel >=20160822
    - gawk
    - coreutils
    - wget
    - findutils
    - curl
    - gzip

test:
  commands:
    - genome_updater.sh -h 2>&1 | grep -e "┌" -e "└" -e "│"

about:
  home: https://github.com/pirovc/genome_updater
  summary: "genome_updater: bash script to download and update snapshots of NCBI RefSeq/GenBank"
  description: |
          Bash script that downloads and updates (non-redundant) snapshots of the NCBI 
          Genomes repository (RefSeq/GenBank) with advanced filters, detailed logs and 
          reports, file integrity checks, NCBI taxonomy and GTDB integration and 
          support for parallel downloads.
  license: MIT License
  license_family: MIT

extra:
  recipe-maintainers:
    - pirovc

