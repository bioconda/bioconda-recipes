{% set version = "0.2.1" %}

package:
  name: metabintools
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/metabintools/metabintools-{{ version }}.tar.gz
  sha256: 11b46bd4863a51ba26bd98cf55e64d114243ede6a7525c3b109601085793a9d1

build:
  entry_points:
    - bintools = metabintools.cli.cli:cli
    - metabintools = metabintools.cli.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage("metabintools", max_pin="x.x") }}

requirements:
  host:
    - python >=3.13
    - uv_build >=0.12.14,<0.13.0
    - pip
  run:
    - python >=3.13
    - click >=8.5.0
    - loguru >=0.7.3
    - pydantic >=2.13.5
    - pyfastx >=2.3.1
    - requests >=2.34.2
    - zstandard >=0.25.0

test:
  imports:
    - metabintools
  commands:
    - pip check
    - bintools --help
    - metabintools --help
  requires:
    - pip
    - python

about:
  home: https://sanger-tol.github.io/metabintools/ 
  summary: A toolkit for collating and manipulating metagenome bins.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - prototaxites
