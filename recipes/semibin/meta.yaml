{% set name = "SemiBin" %}
{% set version = "2.6.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz"
  sha256: 0369b38a9151391eb7531e4b640e7ef04e6177f3a02cd701ad40ff46bd5621ca

build:
  noarch: python
  number: 0
  entry_points:
    - SemiBin2=SemiBin.main:main2
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vvv
  run_exports:
    - {{ pin_subpackage('semibin', max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.10
    - setuptools
  run:
    - numpy
    - pandas
    - python >=3.10
    - python-igraph
    - pyyaml
    - requests
    - scikit-learn
    - coloredlogs
    - argcomplete
    - pytorch
    - tqdm
    - bedtools
    - hmmer
    - numexpr
    - prodigal
    - samtools
    - safetensors

test:
  imports:
    - SemiBin
  commands:
    - SemiBin2 --help
    - SemiBin2 check_install

about:
  home: "https://github.com/BigDataBiology/SemiBin"
  license: MIT
  license_family: MIT
  summary: "Metagenomic binning with siamese neural networks"
  doc_url: https://semibin.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - luispedro
    - psj1997
  identifiers:
    - doi:10.1038/s41467-022-29843-y
    - doi:10.1093/bioinformatics/btad209
    - biotools:semibin
