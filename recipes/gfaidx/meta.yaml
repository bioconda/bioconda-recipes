{% set name = "gfaidx" %}
{% set version = "1.5.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/fawaz-dabbaghieh/gfaidx/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1ec6b44441ea7dccf68c9821938e72566cd426ee3a119c47879b7ebb6c90b728

build:
  number: 0
  skip: True  # [win]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - {{ stdlib("c") }}
    - cmake >=4
    - make
  host:
    - zlib
  run:
    - zlib
    - coreutils

test:
  commands:
    - gfaidx --version
    - gfaidx --help

about:
  home: https://github.com/fawaz-dabbaghieh/gfaidx
  dev_url: https://github.com/fawaz-dabbaghieh/gfaidx
  license: MIT AND Custom
  license_file:
    - LICENSE
    - external/argparse/LICENSE
  summary: Community-based GFA graph indexing and subgraph extraction

extra:
  recipe-maintainers:
    - fawaz-dabbaghieh
  additional-platforms:
    - osx-arm64
