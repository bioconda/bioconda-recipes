{% set name = "gubbins" %}
{% set version = "3.5" %}
{% set sha256 = "2fb616172f80f7c7c208b200016249cad7d052c036485a0dc1aa0a5f02a43377" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/nickjcroucher/gubbins/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: True  # [py < 310 or py > 312]
  entry_points:
    - run_gubbins.py = gubbins.run_gubbins:main
  run_exports:
    - {{ pin_subpackage('gubbins', max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - libtool
    - autoconf
    - automake
    - autoconf-archive
    - pkg-config
  host:
    - python
    - pip
    - setuptools
    - scipy
    - dendropy >=5.0
    - biopython
    - numpy
    - numba
    - zlib
  run:
    - python
    - scipy
    - dendropy >=5.0
    - biopython
    - multiprocess
    - raxml >=8.2.12
    - iqtree >=3.0
    - rapidnj
    - raxml-ng >=2
    - fasttree >=2.1.10
    - veryfasttree
    - numpy
    - numba
    - ska2 >=0.3.0
    - r-argparser
    - r-magrittr
    - r-tidyverse
    - bioconductor-treeio
    - bioconductor-ggtree
    - r-aplot
    - r-patchwork
    - r-cowplot
    - r-rcolorbrewer

test:
  commands:
    - run_gubbins.py -h

about:
  home: "https://github.com/nickjcroucher/gubbins"
  license: "GPL-2.0-or-later"
  license_family: GPL
  license_file: LICENSE
  summary: "Rapid phylogenetic analysis of large samples of recombinant bacterial whole genome sequences using Gubbins."
  dev_url: "https://github.com/nickjcroucher/gubbins"
  doc_url: "https://nickjcroucher.github.io/gubbins"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1093/nar/gku1196
    - biotools:gubbins
    - usegalaxy-eu:gubbins
