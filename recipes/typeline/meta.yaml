{% set name = "typeline" %}
{% set version = "2.4.2" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2af320bc4b0c0e9ad252d2dda3fbe6d85c5317392fec3c79bf76becc9e0e954a

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - msgspec >=0.20
    - typing-extensions >=4.12

test:
  imports:
    - typeline
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/clintval/typeline
  summary: Write dataclasses to delimited text formats and read them back again.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/clintval/typeline
  doc_url: https://github.com/clintval/typeline/blob/{{ version }}/README.md

extra:
  recipe-maintainers:
    - clintval
