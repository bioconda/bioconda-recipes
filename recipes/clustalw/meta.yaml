{% set name = "clustalw" %}
{% set version = "2.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://ftp.ebi.ac.uk/pub/software/clustalw2/{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: e052059b87abfd8c9e695c280bfba86a65899138c82abccd5b00478a80f49486
  patches:
    - patch  # [osx]

build:
  number: 12
  run_exports:
    - {{ pin_subpackage('clustalw', max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - autoconf
    - automake
    - libtool

test:
  commands:
    - clustalw2 H 2>&1 | grep "CLUSTAL 2.1"
    - clustalw H 2>&1 | grep "CLUSTAL 2.1"

about:
  home: "https://ftp.ebi.ac.uk/pub/software/clustalw2"
  license: "LGPL-3.0-or-later"
  license_family: LGPL
  license_file: "COPYING.LESSER"
  summary: "ClustalW2 is a general purpose multiple sequence alignment program for DNA or proteins."
  doc_url: "https://ftp.ebi.ac.uk/pub/software/clustalw2/clustalw_help.txt"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:clustalw_biolib
    - biotools:ClustalW2_Phylogeny_API_EBI
    - biotools:clustalw2_phylogeny_ebi
    - biotools:clustalw2_ebi
    - doi:10.1093/bioinformatics/btm404
    - doi:10.1093/nar/22.22.4673
    - usegalaxy-eu:clustalw
