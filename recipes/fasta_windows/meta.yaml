{% set version = "0.3.0" %}

package:
  name: fasta_windows
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('fasta_windows', max_pin="x.x") }}

source:
  url: https://github.com/tolkit/fasta_windows/archive/v{{ version }}.tar.gz
  sha256: 17d7ccdb26c1d4cfbd4e062d156151c577545e80247ad30ae196b4a9d17fa1b0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}

test:
  commands:
    - fasta_windows --help
    - fasta_windows --version

about:
  home: https://github.com/tolkit/fasta_windows
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: |
    Generate fast sequence statistics in windows for each record in a fasta file.
  dev_url: https://github.com/tolkit/fasta_windows

extra:
  recipe-maintainers:
    - Euphrasiologist
  additional-platforms:
    - linux-aarch64
    - osx-arm64
