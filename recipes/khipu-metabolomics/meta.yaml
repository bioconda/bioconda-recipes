{% set name = "khipu-metabolomics" %}
{% set version = "2.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/khipu_metabolomics-{{ version }}.tar.gz
  sha256: 2540e3fcf7f7cea3a2ba243947446ab232ecddcbe379386b78c18755b203f4bb

build:
  number: 0
  noarch: python
  script:
    - sed -i.bak 's|find_packages|find_namespace_packages|' setup.py
    - rm -rf *.bak
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
  entry_points:
    - khipu = khipu.command_line:main
  run_exports:
    - {{ pin_subpackage('khipu-metabolomics', max_pin="x") }}

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools
  run:
    - python >=3.7
    - intervaltree
    - isocor
    - mass2chem
    - matplotlib-base
    - numpy
    - networkx
    - pandas
    - requests
    - scipy
    - treelib

test:
  imports:
    - khipu
  commands:
    - khipu --help

about:
  home: "https://github.com/shuzhao-li/khipu"
  summary: "Python library for generalized, low-level annotation of MS metabolomics."
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  dev_url: "https://github.com/shuzhao-li/khipu"

extra:
  recipe-maintainers:
    - hechth
