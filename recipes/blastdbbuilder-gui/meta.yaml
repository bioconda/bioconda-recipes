{% set version = "1.2.0" %}

package:
  name: blastdbbuilder-gui
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/b/blastdbbuilder-gui/blastdbbuilder_gui-{{ version }}.tar.gz
  sha256: 6c16a279185bec5b2a677349b4f87d3b7048bf789d7df8649d8762bfc7e3a422

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage("blastdbbuilder-gui", max_pin="x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
  run:
    - python >=3.9
    - blastdbbuilder >=1.1.0
    - customtkinter

test:
  imports:
    - blastdbbuilder_gui

about:
  home: "https://github.com/asadprodhan/blastdbbuilder"
  summary: "Graphical user interface for building customised BLASTn databases using blastdbbuilder (GUI)."
  license: "GPL-3.0-or-later"
  license_file: LICENSE

extra:
  recipe-maintainers:
    - asadprodhan
