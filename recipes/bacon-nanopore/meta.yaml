{% set name = "bacon-nanopore" %}
{% set version = "0.3.9" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/duceppemo/BACoN/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 2c0a960c2c6ebdffbd7fc4a1e0e38f75b2f42f3c1b19a7ba8990203a602c9021

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10
    - minimap2 >=2.24
    - samtools >=1.21
    - filtlong >=0.2.1
    - flye >=2.9.5
    - myloasm >=0.7
    - ska2 >=0.5
    - parsnp >=2.0
    - harvesttools
    - fasttree >=2.1.11
    - iqtree >=2.2
    - bbmap >=39
    - python-isal

test:
  commands:
    - bacon --help
    - bacon --version

about:
  home: https://github.com/duceppemo/BACoN
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Bait, assemble and compare Nanopore reads matching a reference sequence, such as an organelle genome
  dev_url: https://github.com/duceppemo/BACoN
  doc_url: https://github.com/duceppemo/BACoN/wiki

extra:
  recipe-maintainers:
    - duceppemo
