{% set name = "bacon-nanopore" %}
{% set version = "0.3.8" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/duceppemo/BACoN/archive/refs/tags/v{{ version }}.tar.gz
  sha256: a6a17d5e059816a4dbbea2f50dd441a69695539d07e7fe5c8b0abc1fa9ad3c05

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10
    - minimap2 >=2.24
    - samtools >=1.21
    - filtlong >=0.2.1
    - flye >=2.9.5
    - myloasm >=0.7
    - ska2 >=0.5
    - parsnp >=2.1.2
    - harvesttools
    - fasttree >=2.1.11
    - iqtree >=2.2
    - bbmap >=39
    - python-isal

test:
  commands:
    - bacon --help
    - bacon --version

about:
  home: https://github.com/duceppemo/BACoN
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Bait, assemble and compare Nanopore reads matching a reference sequence, such as an organelle genome
  dev_url: https://github.com/duceppemo/BACoN
  doc_url: https://github.com/duceppemo/BACoN/wiki

extra:
  recipe-maintainers:
    - duceppemo
