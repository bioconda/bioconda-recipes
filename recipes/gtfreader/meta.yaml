{% set version = "0.3.1" %}

package:
  name: gtfreader
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/g/gtfreader/gtfreader-{{ version }}.tar.gz
  sha256: dacc2cb31d201057932c688274c555f1911ee2b8ab55c895293780b75b573ef8

build:
  number: 0
  skip: True  # [py < 312]
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('gtfreader', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - python
    - setuptools >=69
    - cython >=3.0
    - pip
  run:
    - python
    - pandas >=2.0

test:
  imports:
    - gtfreader

about:
  home: "https://pypi.org/project/gtfreader"
  summary: "Fast Cython-backed parsing for GTF attribute columns."
  license: MIT

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - compiler_needs_stdlib_c
