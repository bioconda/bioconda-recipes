{% set name = "panhog" %}
{% set version = "0.4.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/yykaya/PanHOG/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 37dac8e6fc41e0b85fa713f0e1aa641ac181d61dce7e0e4638badf5288d93f33

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - panhog = PanHOG:main
    - pangenehog = PangeneHOG:main

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools >=61
  run:
    - python >=3.8
    - numpy
    - pandas
    - matplotlib-base
    - seaborn
    - biopython >=1.80
    - pyyaml
    - scipy
    - blast
    - mafft
    - muscle
    - pal2nal
    - paml
    - raxml-ng

test:
  imports:
    - panhog_dnds
    - panhog_genetrees
    - panhog_phylo
  commands:
    - panhog --help
    - pangenehog --help

about:
  home: https://github.com/yykaya/PanHOG
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Phylogeny-aware pangenome classification toolkit
  description: |
    PanHOG classifies and annotates Hierarchical Orthologous Groups (HOGs) in
    pangenomic datasets into core / shell / private compartments, then re-weights
    and validates the classification with the species tree, per-HOG gene trees,
    codon-based dN/dS selection, and functional annotation, producing
    publication-ready figures from an OrthoFinder N0.tsv plus per-accession FASTA.
  dev_url: https://github.com/yykaya/PanHOG

extra:
  recipe-maintainers:
    - yykaya
