{% set name = "eviann" %}
{% set version = "2.0.6" %}
{% set sha256 = "689c525c6e2989289dfc3e0b7e12c70610c802b45ca0a3330afb4290be1ee8c0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/alekseyzimin/EviAnn_release/releases/download/v{{ version }}/EviAnn-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  skip: true  # [osx]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - autoconf
    - automake
    - libtool
    - pkg-config
  host:
    - perl
    - zlib
    - bzip2
    - tar
  run:
    - perl
    - blast
    - hisat2
    - minimap2
    # eviann v2.0.0 onwards bundled miniprot v0.13
    - miniprot >=0.13
    # eviann v2.0.2 onwards bundled samtools v1.15.1
    - samtools >=1.15.1
    # eviann v2.0.3 onwards bundled springtie v3.0.0
    - stringtie >=3.0.0
    - wget
    - snap

test:
  commands:
    - eviann.sh --version

about:
  home: "https://github.com/alekseyzimin/EviAnn_release"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "Evidence-based eukaryotic genome annotation software."
  dev_url: "https://github.com/alekseyzimin/EviAnn_release"
  doc_url: "https://github.com/alekseyzimin/EviAnn_release/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
  identifiers:
    - doi:10.1101/2025.05.07.652745v1
