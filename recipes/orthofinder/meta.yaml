{% set name = "orthofinder" %}
{% set version = "3.2" %}
{% set sha256 = "554cc15b4cca86e496c680cccf8697f3b0953ff25403e2ff0d585bd015071adb" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/OrthoFinder/OrthoFinder/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  run:
    - python >=3.11,<=3.14
    - numpy
    - scipy
    - scikit-learn
    - biopython
    - ete4
    - rich
    - pandas >=2.0
    - blast
    # 2.1.7 or later: earlier versions cannot make databases of some Ensembl proteomes
    # (https://github.com/bbuchfink/diamond/issues/707); OrthoFinder is tested with 2.2
    - diamond >=2.1.7
    - mcl
    - fastme
    - mafft
    - fasttree
    - muscle
    - raxml
    - raxml-ng
    - iqtree
    - bzip2
    - mmseqs2
    - aster
    - famsa

test:
  source_files:
    - ExampleData
    - ExampleData/*
  commands:
    - orthofinder -h
    - orthofinder -v
    - orthofinder-utils
    - primary_transcript -h
    - make_ultrametric -h
    - convert_orthofinder_tree_ids -h
    - create_hog_fastas -h
    - ncbi_primary_transcript -h
    - orthogroup_gene_count -h
    - split_ortholog_files -h
    - species_tree_alignment -h
    - mcl_orthogroup_sequences -h
about:
  home: "https://github.com/OrthoFinder/OrthoFinder"
  summary: "Accurate inference of orthogroups, orthologs, gene trees and rooted species tree made easy!"
  license: "GPL-3.0-only"
  license_file: LICENSE
  license_family: GPL3
  dev_url: "https://github.com/OrthoFinder/OrthoFinder"
  doc_url: "https://orthofinder.github.io/OrthoFinder"
