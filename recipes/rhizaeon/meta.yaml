{% set name = "rhizaeon" %}
{% set version = "0.1.0" %}
{% set tag = name ~ "-v" ~ version %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # PyPI publishes wheels only (no sdist): the package is a maturin/PyO3
  # extension whose Cargo.toml is a member of the monorepo Cargo workspace
  # rooted at rust/Cargo.toml, so a self-contained sdist cannot be produced
  # from the rhizaeon/ directory alone. Build from the full monorepo tag.
  url: https://github.com/veg/HyphAeon/archive/refs/tags/{{ tag }}.tar.gz
  sha256: a2d9f72d0d8defd99f426048b17eb3212601c0c832f7621871e36b4ead46e60b

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - make
    - cmake
    - pkg-config
  host:
    - python
    - pip
    - maturin >=1.5,<2
  run:
    - python

test:
  imports:
    - rhizaeon
  commands:
    - rhizaeon --version
    - rhizaeon --help

about:
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "RhizAeon: Phylo-Attention Force Field Recombination Scanner"
  description: |
    RhizAeon is a Rust-backed scanner for detecting and characterizing
    recombination events in nucleotide sequence alignments. It projects
    alignment columns onto a phylo-attention force field, screens candidate
    recombinant taxa, verifies tracts under Fisher/Poisson significance
    floors, and can emit JSON summaries plus standalone HTML dashboards.
  doc_url: https://github.com/veg/HyphAeon#readme
  dev_url: https://github.com/veg/HyphAeon

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - d-callan
