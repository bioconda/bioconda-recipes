{% set version="0.3.8" %}

package:
  name: geneimpacts
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/d3/a8/fc73eab7f3b4f1396155677743954f39fefe4fb6a4329c5fa9d5e562121f/geneimpacts-{{ version }}.tar.gz
  sha256: 425f4596aa103b5443769c311b84f71afaa8fe08ae26b3e8ad0ec3fab93f8a7a

build:
  noarch: python
  number: 3
  script: {{ PYTHON }} -m pip install . --ignore-installed --no-deps -vv
  run_exports:
    - {{ pin_subpackage('geneimpacts', max_pin="x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python

test:
  imports:
    - geneimpacts

about:
  home: https://github.com/brentp/geneimpacts
  summary: prioritize effects of variant annotations from VEP, SnpEff, et al.
  license: MIT
