{% set version = "1.6.1" %}

package:
  name: dfast
  version: {{ version }}

source:
  url: https://github.com/nigyta/dfast_core/archive/{{ version }}.tar.gz
  sha256: fc6d03c872186cb36ce58fd55f405fda783de397eb9fb4a8d4814510eb96e687

build:
  number: 0
  # DFAST 1.6 bundles no executables (MGA and CRT were removed), so the package is noarch.
  noarch: generic
  run_exports:
    - {{ pin_subpackage("dfast", max_pin="x.x") }}

requirements:
  run:
    - python >=3.10
    - biopython
    - diced >=0.1.4  # CRISPR prediction
    - prodigal  # CDS prediction (default)
    - aragorn
    - blast >=2.13
    - rpsbproc >=0.5
    - ghostx
    - diamond  # --aligner diamond
    - hmmer >=3.1b2  # hmmscan, nhmmer and hmmbuild (rRNA prediction)
    - last >=1180  # lastal -G <genetic code>
    - defense-finder  # --modules defense (the models are downloaded by dfast_file_downloader.py --modules defense)
  # Not dependencies (optional, see README): metagene_annotator (--use_mga; linux-64 only),
  # integron_finder >=2.0.6 (--modules integron; requires hmmer <=3.3.2, which is not available for
  # linux-aarch64 and osx-arm64), PlasmidFinder 3.x (PyPI) and MobileElementFinder
  # (installed by dfast_file_downloader.py --modules mge).

test:
  imports:
    - diced
  commands:
    - dfast --version
    - dfast_file_downloader.py -h
    - prodigal -v

about:
  home: "https://dfast.nig.ac.jp"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: "docs/LICENSE"
  summary: "DDBJ Fast Annotation and Submission Tool - Prokaryotic genome annotation pipeline"
  dev_url: "https://github.com/nigyta/dfast_core"
  doc_url: "https://github.com/nigyta/dfast_core/blob/{{ version }}/README.md"

extra:
  identifiers:
    - biotools:dfast
    - doi:10.1093/bioinformatics/btx713
