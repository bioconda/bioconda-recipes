{% set version = "1.5.1" %}

package:
  name: dfast
  version: {{ version }}

source:
  url: https://github.com/nigyta/dfast_core/archive/{{ version }}.tar.gz
  sha256: 4f71f18ca1d1ad3bb73d65ad4e319763a1181dee7e6d0ed8f17d8fb96ad2905c

build:
  number: 0
  binary_relocation: False  # [osx]
  run_exports:
    - {{ pin_subpackage("dfast", max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - python >=3.10
    - biopython >=1.67
  host:
    - zlib
  run:
    - python >=3.10
    - biopython
    - openjdk  # CRT
    - aragorn
    - blast >=2.13
    - rpsbproc >=0.5
    - ghostx
    - diamond  # --aligner diamond
    - hmmer >=3.1b2  # hmmscan, nhmmer and hmmbuild (rRNA prediction)
    - last >=1180  # lastal -G <genetic code>
    - metagene_annotator >=1.0  # [x86_64]
    - prodigal  # --use_prodigal (default CDS prediction from DFAST 1.6)

test:
  commands:
    - dfast --version
    - dfast_file_downloader.py -h

about:
  home: "https://dfast.nig.ac.jp"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: "docs/LICENSE"
  summary: "DDBJ Fast Annotation and Submission Tool - Prokaryotic genome annotation pipeline"
  dev_url: "https://github.com/nigyta/dfast_core"
  doc_url: "https://github.com/nigyta/dfast_core/blob/{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:dfast
    - doi:10.1093/bioinformatics/btx713
  skip-lints:
    # MGA (mga_4) and CRT are still bundled; they will be replaced in DFAST 1.6
    - should_be_noarch_generic
    - compiler_needs_stdlib_c
