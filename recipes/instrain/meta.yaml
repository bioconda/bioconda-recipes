{% set name = "instrain" %}
{% set version = "1.12.0" %}

package:
  name: "{{ name }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 9ec0b2d58eef6639459df8860cf290d72432161e39cb80e58863888fabe45e32


build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir"
  run_exports:
    - {{ pin_subpackage('instrain', max_pin="x.x") }}

requirements:
  host:
    - pip
    - python >=3.4
    - setuptools
  run:
    - python >=3.4
    - numpy
    - pandas >=0.25,!=1.1.3
    - seaborn-base
    - matplotlib-base
    - biopython
    - tqdm
    - pysam >=0.15
    - networkx
    - h5py
    - psutil
    - pytest
    - lmfit

test:
  imports:
    - inStrain
  commands:
    - inStrain profile --help
    - inStrain compare --help

about:
  home: "https://github.com/MrOlm/inStrain"
  license: MIT
  license_family: MIT
  summary: "Calculation of strain-level metrics."
  dev_url: "https://github.com/MrOlm/inStrain"
