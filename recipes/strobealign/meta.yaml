{% set version = "0.18.0" %}

package:
  name: strobealign
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("strobealign", max_pin="x.x") }}
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cargo install -v --locked --no-track --root $PREFIX --path .

source:
  url: https://github.com/ksahlin/strobealign/archive/refs/tags/v{{ version }}.tar.gz
  sha256: fe546df7b06a55578126376f108ea7c3445dbb14585c380eac221810450250de

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - strobealign --version | grep "{{ version }}"

about:
  home: https://github.com/ksahlin/strobealign
  summary: Align short reads using dynamic seed size with strobemers
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - marcelm
