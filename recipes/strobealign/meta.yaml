{% set version = "0.20.0" %}

package:
  name: strobealign
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("strobealign", max_pin="x.x") }}
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - "if [ $(uname -m) = x86_64 ]; then export RUSTFLAGS='-C target-cpu=x86-64-v2'; fi"
    - cargo install -v --locked --no-track --root $PREFIX --path .

source:
  url: https://github.com/ksahlin/strobealign/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 651439789346c297b58f7774db6242b475eac9d38e7f16894b5b9eb17296447b

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - strobealign --version | grep "{{ version }}"

about:
  home: https://github.com/ksahlin/strobealign
  summary: Align short reads using dynamic seed size with strobemers
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - marcelm
