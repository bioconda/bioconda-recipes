{% set name = "gxformat2" %}
{% set version = "0.29.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 69580d608ed97af52759204f09f97d61b66953ba205ff20aed96e27cb0b18c16

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - gxwf-to-native = gxformat2.converter:main
    - gxwf-to-format2 = gxformat2.export:main
    - gxwf-lint = gxformat2.lint:main
    - gxwf-viz = gxformat2.cytoscape:main
    - gxwf-abstract-export = gxformat2.abstract:main
    - gxwf-mermaid = gxformat2.mermaid:main
    - gxwf-layout = gxformat2.layout:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - bioblend
    - pydantic >=2.0
    - pyyaml
    - requests
    - ruamel.yaml >=0.17.6
    - schema-salad >=8.10.20260810193251
    - typing_extensions

test:
  imports:
    - gxformat2

about:
  home: "https://github.com/galaxyproject/gxformat2"
  license: MIT
  summary: "Galaxy Workflow Format 2 Descriptions."
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/galaxyproject/gxformat2"

extra:
  recipe-maintainers:
    - nsoranzo
