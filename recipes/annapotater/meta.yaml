{% set name = "annapotater" %}
{% set version = "0.5" %}
{% set sha256 = "20ee9b5c0662486f3d71e9f805aaac55cdd9c582f8b7c0cb9485da20135d19a5" %}

# regex to use for Windows build hack
{% set win_patch = "s|C:\\\\strawberry\\\\c|$ENV{LIBRARY_PREFIX}\\\\mingw-w64|g" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/lskatz/annapotater/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports: 
    - {{ pin_subpackage(name, max_pin="x.x") }}
  # needed for linker to find some m2w64 libs
  merge_build_host: True  # [win]
  script:
    - cpanm --notest Array::IntSpan
    - >- 
      perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1 MAKE=make
      && (for /r . %%f in (*Makefile) do perl -i -pe "{{ win_patch }}" %%f)  # [win]
      && make
      && make test
      && make install VERBINST=1

requirements:
  build:
    - {{ compiler('c') }}  # [unix]
    - {{ stdlib('c') }}
    - m2w64-gcc  # [win]
    - make
    - perl-app-cpanminus # Array::IntSpan not on conda-forge/bioconda
  host:
    - perl >=5.26
    - perl-bioperl >=1.7.0
    #- perl-array-intspan >=2.003
  run:
    - perl >=5.26
    - perl-bioperl >=1.7.0
    #- perl-array-intspan >=2.003

test:
  commands:
    - annapotater --help
    - annapotater --version

about:
  home: https://github.com/lskatz/annapotater
  dev_url: https://github.com/lskatz/annapotater
  summary: A fast SNP annotation tool for haploid genomes
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - lskatz
