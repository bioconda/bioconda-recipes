{% set name = "fastnlr" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/CropCoder/FastNLR/archive/refs/tags/v{{ version }}.tar.gz
  sha256: d40368070ad74453c7b5fca0f4cfeda1bae8262491de63863446d2a0c737f7d4

build:
  number: 0

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses
  host:
    - pkg-config
  run:

test:
  commands:
    - fastnlr --version

about:
  home: https://github.com/CropCoder/FastNLR
  dev_url: https://github.com/CropCoder/FastNLR
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Fast, accurate NLR immune-receptor locus annotation for plant genomes
  description: |
    FastNLR scans the six reading frames of an assembled plant genome for
    amino-acid motifs and assembles complete and partial NLR loci. It is
    implemented in Rust and provides multithreaded scanning, memory-mapped
    FASTA input, checkpoint resume, and multi-format output.

extra:
  recipe-maintainers:
    - CropCoder
