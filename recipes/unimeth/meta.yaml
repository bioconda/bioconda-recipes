{% set name = "unimeth" %}
{% set version = "0.2.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/sekeyWang/Unimeth/archive/refs/tags/{{ version }}.tar.gz
  sha256: 46602cf2f1a61bc1f75aa0192a82bc1c86dee62175a71f03ddd08099349b8783

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.12,<3.13
    - pip
    - hatchling
  run:
    - python >=3.12,<3.13
    - pytorch >=2.3,<2.6
    - numpy >=2.0,<3
    - transformers >=4.40,<5
    - tqdm >=4.66
    - accelerate >=1.0,<2
    - pysam >=0.22
    - pod5 >=0.3,<0.3.35
    - pyarrow >=20,<21
    - scikit-learn >=1.5
    - scipy >=1.13

test:
  imports:
    - unimeth
    - unimeth.config
  commands:
    - unimeth --version
    - unimeth --help
    - unimeth infer --help
    - unimeth-infer --help
    - python -c "import pod5; print('pod5 ok')"
    - python -c "from unimeth.config.model_config import ModelConfig; assert ModelConfig.from_name('default').d_model == 384"

about:
  home: https://github.com/sekeyWang/Unimeth
  dev_url: https://github.com/sekeyWang/Unimeth
  license: BSD-3-Clause-Clear
  license_file: LICENSE
  summary: A unified DNA methylation detection framework for nanopore reads

extra:
  recipe-maintainers:
    - sekeyWang
    - PengNi
