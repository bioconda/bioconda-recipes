{% set name = "captainslog" %}
{% set version = "0.2.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/captainslog-ngs/captainslog_ngs-{{ version }}.tar.gz
  sha256: f1267fd36d980f7006f3beac7b5571fad0c0afac3b0a91c85b89e599c7faf2f0

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - typeline >=3.2.0,<4
    - typing-extensions >=4.12

test:
  imports:
    - captainslog
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/clintval/captainslog
  summary: Typed dataclasses for the metrics files that Riker, fgumi, Picard, and fgbio write.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/clintval/captainslog
  doc_url: https://github.com/clintval/captainslog/blob/{{ version }}/README.md

extra:
  recipe-maintainers:
    - clintval
