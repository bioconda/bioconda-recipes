{% set name = "prform" %}
{% set version = "0.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 428a834419f136ad0d9ff8d0bdc202c21b168debbf2fef488ab41849ca6b0f29

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  entry_points:
    - prform = prform.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61
  run:
    - python >=3.9
    - pytorch >=2.0
    - numpy >=1.22
    - scipy >=1.9
    - scikit-learn >=1.1
    - joblib >=1.2
    - h5py >=3.7

test:
  imports:
    - prform
  commands:
    - prform --version
    - prform --help
    # 0.3.0 bundles a second model, selectable with --model: 2001 nt context
    # alongside the default 10001 nt. Load both to check they were packaged.
    - python -c "from prform import PRFormPredictor; PRFormPredictor(model='10k', device='cpu'); PRFormPredictor(model='2k', device='cpu')"

about:
  home: "https://github.com/khoa-yelo/PRForm"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Predict programmed ribosomal frameshift (PRF) sites in RNA sequences."
  description: |
    prform scores every nucleotide of an RNA sequence for the probability
    of a -1 or +1 ribosomal frameshift. A 1D residual network with a 10 kb
    receptive field, plus a calibrated probability mapping, are bundled
    with the package.
  doc_url: "https://github.com/khoa-yelo/PRForm"
  dev_url: "https://github.com/khoa-yelo/PRForm"

extra:
  recipe-maintainers:
    - khoa-yelo