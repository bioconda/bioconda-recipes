package:
  name: r-metamapwidgetr
  version: 0.1.0

source:
  url: https://github.com/grunwaldlab/metaMapWidgetR/archive/refs/tags/0.1.0.tar.gz
  sha256: "b3dd25235c726f5ae212a1c803f9877f14eace9cf075b9471772fb3eed2291f4"
            
build:
  noarch: generic
  number: 0
  script: "${PREFIX}/bin/R CMD INSTALL --build ."
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports:
    - '{{ pin_subpackage("r-metamapwidgetr", max_pin="x.x") }}'
            
requirements:
  host:
    - r-base
    - r-htmlwidgets
    - r-rmarkdown
    - r-sass
  run:
    - r-base
    - r-htmlwidgets
    - r-rmarkdown
    - r-sass
            
test:
  commands:
    - "${PREFIX}/bin/R -e \"library('metaMapWidgetR')\""
    
about:
  home: https://github.com/grunwaldlab/metaMapWidgetR
  license: MIT
  license_family: MIT
  summary: 'R wrapper for the meta-map-widget JS package.'
  dev_url: https://github.com/grunwaldlab/metaMapWidgetR
