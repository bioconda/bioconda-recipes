{% set name = "pretext-to-asm" %}
{% set version = "1.4.1" %}
{% set sha256 = "a8eec2706ca0492fd49d8c93d9d38e8ee48a4228349902176ac53ab922546d2f" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/sanger-tol/agp-tpf-utils/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage("pretext-to-asm", max_pin="x") }} 

requirements:
  host:
    - python >=3.8
    - pip
    - biopython >=1.78
    - click >=8.0
    - pyyaml >=5.0
  run:
    - python >=3.8
    - biopython >=1.78
    - click >=8.0
    - pyyaml >=5.0

test:
  commands:
    - pretext-to-asm --help

about:
  home: https://github.com/sanger-tol/agp-tpf-utils
  license: MIT
  license_family: MIT
  summary: pretext-to-asm takes the AGP output from PretextView and the original FASTA file to generate new assembly FASTAs and support files
  dev_url: https://github.com/sanger-tol/agp-tpf-utils/blob/main/src/tola/assembly/scripts/pretext_to_asm.py
