{% set name = "sanntis" %}
{% set version = "1.0.0" %}
{% set sha256 = "1d56abf386ba29549e9820d1d695fef69afc8cb96de9f726c40b9091fc58193e" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/Finn-Lab/SanntiS/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  entry_points:
    - sanntis = sanntis.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
  run:
    - python >=3.11
    - perl
    - numpy >=2.0
    - pandas >=2.2
    - pyarrow >=17
    - scikit-learn >=1.9,<1.10
    - scipy >=1.13
    - skops >=0.11
    - pytorch >=2.4
    - safetensors >=0.4
    - huggingface_hub >=0.30
    - biopython >=1.84
    - pyrodigal >=3.5
    - click >=8.1
    - pydantic >=2.7
    - pyyaml >=6

test:
  imports:
    - sanntis
  commands:
    - sanntis --help > /dev/null

about:
  home: "https://github.com/Finn-Lab/SanntiS"
  summary: "SMBGC Annotation using Neural Networks Trained on Interpro Signatures."
  license: "Apache-2.0"
  license_family: Apache
  license_file: LICENSE
  dev_url: "https://github.com/Finn-Lab/SanntiS"
