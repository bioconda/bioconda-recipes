{% set name = "sanntis" %}
{% set version = "1.0.0" %}
{% set sha256 = "1d56abf386ba29549e9820d1d695fef69afc8cb96de9f726c40b9091fc58193e" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: "https://github.com/Finn-Lab/SanntiS/archive/refs/tags/v{{ version }}.tar.gz"
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  entry_points:
    - sanntis = sanntis._cli:main
  script: "{{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir"
  run_exports:
    - {{ pin_subpackage('sanntis', max_pin='x.x') }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
  run:
    - python >=3.9
    - scipy >=1.7.3,<1.8.0 
    - perl >=5
    - biopython
    - numpy >=1.16,<1.20
    - openjdk >=11.0
    - tensorflow =2.4
    - hmmer
    - joblib >=1.0.1
    - scikit-learn =0.24
    - prodigal

test:
  imports:
    - sanntis
  commands:
    - sanntis --help > /dev/null

about:
  home: "https://github.com/Finn-Lab/SanntiS"
  summary: "SMBGC Annotation using Neural Networks Trained on Interpro Signatures."
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: "https://github.com/Finn-Lab/SanntiS"
