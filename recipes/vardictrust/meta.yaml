{% set name = "vardictrust" %}
{% set version = "1.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/palakpsheth/VarDictRust/archive/refs/tags/v{{ version }}.tar.gz
  sha256: c9a211f844380e2983ab2340af8c3cb4062225d6a3131e75d40fb2e88e25ef3b

build:
  number: 0
  binary_relocation: false
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - make
    - cargo-bundle-licenses

test:
  commands:
    - vardictrust --version
    - vardictrust --help

about:
  home: https://github.com/palakpsheth/VarDictRust
  license: MIT AND GPL-2.0-or-later
  license_family: GPL2
  license_file:
    - LICENSE
    - LICENSE-3RD-PARTY
    - THIRDPARTY.yml
  summary: "Fast, memory-safe, idiomatic Rust rewrite of VarDictJava v1.8.3"
  description: |
    VarDictRust is an ultra-fast, memory-safe, idiomatic-Rust variant caller
    producing 100% parity against VarDictJava v1.8.3 across germline, somatic,
    and amplicon sequencing assays, scaling to deep whole-genome sequencing (WGS).
  doc_url: https://github.com/palakpsheth/VarDictRust
  dev_url: https://github.com/palakpsheth/VarDictRust

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - palakpsheth
  identifiers:
    - doi:10.1093/nar/gkw227
    - biotools:vardict
