{% set name = "proteomiqon-psmbasedquantification" %}
{% set version = "0.1.0" %}
{% set sha256 = "79b1a125de512305a3c22909315459728ed0d4e4fe9b2c986c724e543fc0e078" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.PSMBasedQuantification/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-psmbasedquantification"
    - test -f "$PREFIX/lib/dotnet/tools/PSMBasedQuantification/ProteomIQon.PSMBasedQuantification.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-psmbasedquantification"
    - grep -q "PSMBasedQuantification/ProteomIQon.PSMBasedQuantification.dll" "$PREFIX/bin/proteomiqon-psmbasedquantification"

about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  description: | 
    PSMBasedQuantification turns the identifications from PSMStatistics into peptide ion intensities.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/psm-based-quantification/
