{% set name = "atol-genome-launcher" %}
{% set version = "0.19.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/TomHarrop/atol-genome-launcher/archive/refs/tags/{{ version }}.tar.gz
  sha256: 07eec348b5c86169aff57c500d285878f8d47a7346957b05b1e0af1c639134ce

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  entry_points:
    - assembly-data-downloader = assembly_data_downloader.assembly_data_downloader:main
    - bpa-file-downloader = bpa_file_downloader.bpa_file_downloader:main
    - deploy-pipeline = deploy_pipeline.deploy_pipeline:main
    - generate-ena-assembly-manifest = generate_ena_assembly_manifest.generate_ena_assembly_manifest:main
    - pipeline-config-generator = pipeline_config_generator.pipeline_config_generator:main
    - pipeline-result-uploader = pipeline_result_uploader.pipeline_result_uploader:main
    - report-pipeline-result-to-canopy = report_pipeline_result_to_canopy.report_pipeline_result_to_canopy:main
    - result-file-uploader = result_file_uploader.result_file_uploader:main
    - request-assembly-repo = request_assembly_repo.request_assembly_repo:main
    - request-manifest-from-canopy = request_manifest_from_canopy.request_manifest_from_canopy:main
    - rnaseq-manifest-generator = rnaseq_manifest_generator.rnaseq_manifest_generator:main
    - rnaseq-reads-downloader = rnaseq_reads_downloader.rnaseq_reads_downloader:main
    - submit-run-to-ena = submit_run_to_ena.submit_run_to_ena:main
  run_exports:
    - {{ pin_subpackage('atol-genome-launcher', max_pin="x.x") }}

requirements:
  host:
    - pip
    - python >=3.12,<3.13
    - setuptools-scm
  run:
    - aria2
    - atol-data-broker >=0.1.2
    - ca-certificates
    - git
    - pandas >=2.3.3,<3
    - pigz
    - pydantic >=2.12.5
    - python >=3.12,<3.15
    - rclone
    - snakemake >=9.11.6,<10
    - snakedeploy >=0.11.0
    - wget

test:
  commands:
    - "assembly-data-downloader --help | grep 'usage: assembly-data-downloader'"
    - "bpa-file-downloader --help | grep 'usage: bpa-file-downloader'"
    - "deploy-pipeline --help | grep 'usage: deploy-pipeline'"
    - "pipeline-config-generator --help | grep 'usage: pipeline-config-generator'"
    - "pipeline-result-uploader --help | grep 'usage: pipeline-result-uploader'"
    - "result-file-uploader --help | grep 'usage: result-file-uploader'"
    - "request-assembly-repo --help | grep 'usage: request-assembly-repo'"
    - "rnaseq-manifest-generator --help | grep 'usage: rnaseq-manifest-generator'"
    - "rnaseq-reads-downloader --help | grep 'usage: rnaseq-reads-downloader'"
    - "submit-run-to-ena --help | grep 'usage: submit-run-to-ena'"

about:
  home: "https://github.com/TomHarrop/atol-genome-launcher"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "Utility code for AToL's Genome Engine. This package provides modules for launching assemblies and annotations based on metadata ingested by the atol-bpa-datamapper."
  dev_url: "https://github.com/TomHarrop/atol-genome-launcher"
