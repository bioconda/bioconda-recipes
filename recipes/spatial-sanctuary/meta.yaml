{% set name = "spatial-sanctuary" %}
{% set version = "2.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: "https://github.com/Lukecele/spatial-oncology-master/archive/refs/tags/v{{ version }}.tar.gz"
  sha256: 8e2b896ff5717284056d2abdaa32a11b9c1da748a5358b90f5627a394e5560b1

build:
  number: 0
  noarch: python
  entry_points:
    - spatial-sanctuary = spatial_sanctuary.cli:main
    - osimertinib-sanctuary = spatial_sanctuary.cli:main
  script: "{{ PYTHON }} -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage("spatial-sanctuary", max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - setuptools >=61.0
    - pip
  run:
    - python >=3.9
    - numpy >=1.22.0
    - scipy >=1.9.0
    - pandas >=1.5.0
    - lifelines >=0.27.0
    - matplotlib-base >=3.6.0

test:
  imports:
    - spatial_sanctuary
  commands:
    - spatial-sanctuary --help
    - osimertinib-sanctuary --help

about:
  home: https://lukecele.github.io/spatial-oncology-master/
  dev_url: https://github.com/Lukecele/spatial-oncology-master
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: "Biophysical reaction-diffusion transport solver and evolutionary sanctuary dynamics in EGFR-mutant lung adenocarcinoma (Osimertinib)."
  description: "A computational oncology framework solving steady-state reaction-diffusion transport in perivascular cords (Bessel K0) and avascular nests (Bessel I0), post-cessation exponential regrowth kinetics, and clinical survival models for Osimertinib in NSCLC."

extra:
  recipe-maintainers:
    - Lukecele
  identifiers:
    - doi:10.5281/zenodo.23623653
