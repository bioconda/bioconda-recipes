{% set version = "0.3.3" %}
{% set github = "https://github.com/acidgenomics/r-acidroxygen" %}

package:
  name: r-acidroxygen
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: d2387aba6542007aff7388b30cf1cdf2cea55d6e7566782462a20fa8f50c556b

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('r-acidroxygen', max_pin="x.x") }}

requirements:
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('AcidRoxygen')"

about:
  home: https://r.acidgenomics.com/packages/acidroxygen/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: Shared roxygen2 documentation for Acid Genomics packages.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
