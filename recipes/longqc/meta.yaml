{% set version = "1.2.3" %}

package:
  name: longqc
  version: {{ version }}

source:
  url: https://github.com/yfukasawa/LongQC/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 812379c26db5f7ef5664b1d2214b0703136659c7e41332bf5309653fb6360de9

build:
  noarch: generic
  number: 0

requirements:
  run:
    - python >=3
    - minimap2-coverage
    - numpy
    - scipy
    - matplotlib-base >=2.1.2
    - scikit-learn
    - pandas >=0.24.0
    - jinja2
    - h5py
    - pysam
    - python-edlib

test:
  commands:
    - minimap2-coverage --help

about:
  home: https://github.com/yfukasawa/LongQC
  license: MIT
  license_file: LICENSE
  summary: 'LongQC is a tool for the data quality control of the PacBio and ONT long reads'
