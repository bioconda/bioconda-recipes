{% set version = "0.15.7" %}

package:
  name: osteosarc
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/o/osteosarc/osteosarc-{{ version }}.tar.gz
  sha256: d14ae09aa66d47727d3734a91cd83dde8a9eeba727ba7afa4b218754834fe9a3

build:
  number: 0
  noarch: python
  entry_points:
    - osteosarc = osteosarc.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage('osteosarc', max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - setuptools >=77
    - pip
  run:
    - python >=3.9
    - beautifulsoup4 >=4.12
    - datacache  #>=1.12.0
    - pysam >=0.22
    - requests >=2.28

test:
  imports:
    - osteosarc
  commands:
    - osteosarc --help

about:
  home: "https://pypi.org/project/osteosarc"
  summary: "Reproducible access to the public osteosarc.com dataset."
  doc_url: "https://iskandr.github.io/osteosarc"
  dev_url: "https://github.com/iskandr/osteosarc"
  license: "Apache-2.0"
  license_family: APACHE
  license_file: LICENSE
