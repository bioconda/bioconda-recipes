{% set version = "1.72.0" %}
{% set name = "rtracklayer" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name }}/bioconductor-{{ name }}_{{ version }}_src_all.tar.gz
  md5: f5ec8a266f6b044f791b5783734b74af

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-rtracklayer", max_pin="x.x") }}'

# Suggests: GenomeInfoDb, BSgenome (>= 1.33.4), humanStemCell, microRNA (>= 1.1.1), genefilter, limma, org.Hs.eg.db, hgu133plus2.db, GenomicFeatures, BSgenome.Hsapiens.UCSC.hg19, TxDb.Hsapiens.UCSC.hg19.knownGene, RUnit
requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - automake
    - make
  host:
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocio >=1.22.0,<1.23.0
    - bioconductor-biostrings >=2.80.2,<2.81.0
    - bioconductor-genomicalignments >=1.48.0,<1.49.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-rsamtools >=2.28.0,<2.29.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - bioconductor-xvector >=0.52.0,<0.53.0
    - r-base
    - r-curl
    - r-httr
    - r-restfulr >=0.0.13
    - r-xml >=1.98-0
    - libblas
    - liblapack
    - zlib
    - liblzma-devel
  run:
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocio >=1.22.0,<1.23.0
    - bioconductor-biostrings >=2.80.2,<2.81.0
    - bioconductor-genomicalignments >=1.48.0,<1.49.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-rsamtools >=2.28.0,<2.29.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - bioconductor-xvector >=0.52.0,<0.53.0
    - r-base
    - r-curl
    - r-httr
    - r-restfulr >=0.0.13
    - r-xml >=1.98-0

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: Artistic-2.0 + file LICENSE
  summary: R interface to genome annotation files and the UCSC genome browser
  description: Extensible framework for interacting with multiple genome browsers (currently UCSC built-in) and manipulating annotation tracks in various formats (currently GFF, BED, bedGraph, BED15, WIG, BigWig and 2bit built-in). The user may export/import tracks to/from the supported browsers, as well as query and modify the browser state, such as the current viewport.
  license_file: LICENSE

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:rtracklayer
  parent_recipe:
    name: bioconductor-rtracklayer
    path: recipes/bioconductor-rtracklayer
    version: 1.40.6

