{% set name = "perl-extutils-cbuilder" %}
{% set version = "0.280236" %}
{% set sha256 = "abc21827eb8a513171bf7fdecefce9945132cb76db945036518291f607b1491f" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/A/AM/AMBS/ExtUtils-CBuilder-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-text-parsewords
    - perl-perl-ostype
    - perl-ipc-cmd
    - perl-file-temp
    - perl-extutils-makemaker
  run:
    - perl
    - perl-text-parsewords
    - perl-perl-ostype
    - perl-file-temp
    - perl-ipc-cmd
    - perl-extutils-makemaker

test:
  imports:
    - ExtUtils::CBuilder
    - ExtUtils::CBuilder::Base
    - ExtUtils::CBuilder::Platform::Unix
    - ExtUtils::CBuilder::Platform::VMS
    - ExtUtils::CBuilder::Platform::aix
    - ExtUtils::CBuilder::Platform::android
    - ExtUtils::CBuilder::Platform::cygwin
    - ExtUtils::CBuilder::Platform::darwin
    - ExtUtils::CBuilder::Platform::dec_osf
    - ExtUtils::CBuilder::Platform::os2

about:
  home: "https://metacpan.org/pod/ExtUtils::CBuilder"
  license: "perl_5"
  summary: "Compile and link C code for Perl modules."
  doc_url: "https://metacpan.org/pod/ExtUtils::CBuilder"
