{% set name = "NRPyS" %}
{% set version = "0.1.2" %}
{% set sha256 = "9da893e7f727824f88ffd6b4e20bc5f2df31e6ed3e2b202935a42b297362814d" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

source:
  url: https://github.com/kblin/nrpys/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - cargo.patch
    - pyproject.patch

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
  host:
    - python <3.12
    - pip
    - maturin
    - zlib
  run:
    - python <3.12
test:
  imports:
    - nrpys

about:
  home: "https://github.com/kblin/nrpys"
  license: AGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: "Python language bindings for nrps-rs substrate specificity predictor."

extra:
  additional-platforms:
    - linux-aarch64
