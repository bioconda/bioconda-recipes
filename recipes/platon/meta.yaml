{% set version = "1.8" %}
{% set sha256 = "74fc3aeb982b4aba3cf2de369ed1472acfabd8674f7f17632f36bd7b2f638ef8" %}

package:
  name: platon
  version: '{{ version }}'

source:
  url: https://github.com/oschwengers/platon/archive/v{{ version }}.tar.gz
  sha256: '{{ sha256 }}'

build:
  noarch: python
  number: 0
  script: python -m pip install --no-deps --ignore-installed .
  entry_points:
    - platon = platon.platon:main
  run_exports:
    - {{ pin_subpackage('platon', max_pin='x') }}

requirements:
  host:
    - python >=3
    - pip
  run:
    - python >=3
    - biopython >=1.78
    - prodigal >=2.6.3
    - diamond >=2.0.6
    - blast >=2.10.1
    - hmmer >=3.3.1
    - infernal >=1.1.4
    - mummer4 >=4.0.0beta2

test:
  import:
    - Bio.SeqIO
  commands:
    - platon --help
    - prodigal -h
    - diamond help
    - cmscan -h
    - hmmsearch -h
    - nucmer -V
    - blastn -help

about:
  home: https://github.com/oschwengers/platon
  license: GPLv3
  license_family: GPL
  license_file: LICENSE
  summary: Plasmid contig classification and characterization for short read draft assemblies.
  dev_url: https://github.com/oschwengers/platon

extra:
  identifiers:
    - biotools:platon
  recipe-maintainers:
    - oschwengers
