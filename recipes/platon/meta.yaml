{% set version = "1.8" %}
{% set sha256 = "74fc3aeb982b4aba3cf2de369ed1472acfabd8674f7f17632f36bd7b2f638ef8" %}

package:
  name: platon
  version: '{{ version }}'

source:
  url: https://github.com/oschwengers/platon/archive/v{{ version }}.tar.gz
  sha256: '{{ sha256 }}'

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  entry_points:
    - platon = platon.platon:main
  run_exports:
    - {{ pin_subpackage('platon', max_pin='x') }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - biopython >=1.87
    - pyrodigal >=3.7.1
    - diamond >=2.2.0
    - blast >=2.17.0
    - hmmer >=3.4
    - infernal >=1.1.5
    - mummer4 >=4.0.1

test:
  import:
    - Bio.SeqIO
  commands:
    - platon --help
    - pyrodigal -h
    - diamond help
    - cmscan -h
    - hmmsearch -h
    - nucmer -V
    - blastn -help

about:
  home: https://github.com/oschwengers/platon
  license: GPLv3
  license_family: GPL
  license_file: LICENSE
  summary: Plasmid contig classification and characterization for short read draft assemblies.
  dev_url: https://github.com/oschwengers/platon

extra:
  identifiers:
    - biotools:platon
    - doi:10.1099/mgen.0.000398
    - doi:10.5281/zenodo.4066768
  recipe-maintainers:
    - oschwengers
