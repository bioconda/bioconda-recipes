{% set version = "1.40.0" %}
{% set name = "scran" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name }}/bioconductor-{{ name }}_{{ version }}_src_all.tar.gz
  md5: 9819f8ebba78e5cc70eb80dd2e00860e

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-scran", max_pin="x.x") }}'

# Suggests: testthat, BiocStyle, knitr, rmarkdown, DelayedMatrixStats, HDF5Array, scRNAseq, dynamicTreeCut, ResidualMatrix, ScaledMatrix, DESeq2, pheatmap, scater, scrapper
# SystemRequirements: C++11
requirements:

  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make

  host:
    - bioconductor-beachmat >=2.28.0,<2.29.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biocsingular >=1.28.0,<1.29.0
    - bioconductor-bluster >=1.22.0,<1.23.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-edger >=4.10.5,<4.11.0
    - bioconductor-limma >=3.68.5,<3.69.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-metapod >=1.20.0,<1.21.0
    - bioconductor-s4arrays >=1.12.1,<1.13.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-scuttle >=1.22.0,<1.23.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-bh
    - r-dqrng
    - r-igraph
    - r-matrix
    - r-rcpp
    - r-statmod
    - libblas
    - liblapack
    - zlib
    - liblzma-devel

  run:
    - bioconductor-beachmat >=2.28.0,<2.29.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biocsingular >=1.28.0,<1.29.0
    - bioconductor-bluster >=1.22.0,<1.23.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-edger >=4.10.5,<4.11.0
    - bioconductor-limma >=3.68.5,<3.69.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-metapod >=1.20.0,<1.21.0
    - bioconductor-s4arrays >=1.12.1,<1.13.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-scuttle >=1.22.0,<1.23.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-bh
    - r-dqrng
    - r-igraph
    - r-matrix
    - r-rcpp
    - r-statmod

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: GPL-3
  summary: Methods for Single-Cell RNA-Seq Data Analysis
  description: Implements miscellaneous functions for interpretation of single-cell RNA-seq data. Methods are provided for assignment of cell cycle phase, detection of highly variable and significantly correlated genes, identification of marker genes, and other common tasks in routine single-cell analysis workflows.
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:scran
  parent_recipe:
    name: bioconductor-scran
    path: recipes/bioconductor-scran
    version: 1.8.4

