{% set name = "chemap" %}
{% set version = "0.3.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/chemap/chemap-{{ version }}.tar.gz
  sha256: 0e76aaf85c54a9c7dd52f0bc128fd1aaca3fc13f9cd0a81539bb8172bd2197d6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
   - {{ pin_subpackage("chemap", max_pin="x.x") }}


requirements:
  host:
    - python >=3.11,<3.15
    - poetry-core
    - pip
  run:
    - python >=3.11,<3.15
    - map4 >=1.1.3
    - numba >=0.61.2
    - numpy >=2.1.0
    - pandas >=2.2.1
    - scipy >=1.14.2
    - matplotlib-base >=3.10.1
    - rdkit >=2024.9.6
    - scikit-fingerprints >=2.0.0
    - tqdm >=4.67.1
    - pooch >=1.8.2
    - joblib >=1.3.2

test:
  imports:
    - chemap
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/chemap/
  summary: 'Library for computing molecular fingerprint based similarities as well as dimensionality reduction based chemical space visualizations. '
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mbodova
