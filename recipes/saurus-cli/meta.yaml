{% set name = "saurus-cli" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/saurus_cli-{{ version }}.tar.gz
  sha256: b0e66648b372135f0447ec31773d885c52009bbf5edef72f04a9134649c35f9d

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}
  entry_points:
    - saurus = saurus_cli:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv"

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=3.9
    - pandas >=1.5.0

test:
  imports:
    - saurus_cli
  commands:
    - saurus --help
    - saurus --version
    - saurus --examples
    - saurus --about
    - test -d ${PREFIX}/share/saurus/data/mrsa
    - test -f ${PREFIX}/share/saurus/data/DATA_VERSION
    - saurus --quiet --lineage USA300 --count | grep -q "10,448"

about:
  home: https://saurus-db.org/
  license: MIT
  license_file: LICENSE
  summary: 'Command-line interface for the SAURUS Staphylococcus aureus genomic surveillance database'
  description: |
    SAURUS-CLI provides reproducible, offline access to a master table of
    134,273 Staphylococcus aureus genomes (134,160 with typing results and
    113 metadata-only), queryable by MLST sequence type, clonal complex,
    spa type, SCCmec, agr, capsule serotype, lineage signature, MRSA/MSSA
    status, SRA availability, and epidemiological metadata (country,
    source, host, collection year), and by gene presence across the AMR,
    VFDB, and plasmid modules.

    The version 1.1.0 data release (16 gzipped TSV files plus a
    DATA_VERSION marker) ships bundled inside the package. After
    installation, queries run locally with no downloads, no API keys, and
    no network access. SAURUS-CLI is part of the ARGUS initiative, a
    family of open genomic surveillance tools covering the WHO priority
    ESKAPE pathogens.
  doc_url: https://saurus-db.org/manual.html
  dev_url: https://github.com/bbeckley-hub/saurus-cli

extra:
  recipe-maintainers:
    - bbeckley-hub
  identifiers:
    - doi:10.5281/zenodo.24599839
    - doi:10.5281/zenodo.24568725
  keywords:
    - staphylococcus-aureus
    - mrsa
    - amr
    - genomic-surveillance
    - eskape
    - argus
