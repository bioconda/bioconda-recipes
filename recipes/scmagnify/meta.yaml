{% set name = "scmagnify" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f55f14102a86e414c4a5fb52d00b5723a7c058e098155892301ddedf4777a5f8

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling
  run:
    - python >=3.10
    - anndata >=0.10
    - cellrank >=2.0.1
    - decoupler-py >=2.1.1
    - deprecated
    - genomepy >=0.16.1
    - ipython <9
    - moods
    - mudata >=0.2.3
    - netgraph
    - numpy <2
    - pandas
    - pillow
    - pooch
    - pyarrow <=20
    - pycirclize <1.10.1
    - pycomplexheatmap >=1.8.2
    - pygam
    - pyranges
    - pysam >=0.23.1
    - pytabix
    - pytorch >=2
    - rich >=10
    - scanpy >=1.9
    - seacells >=0.3.3
    - session-info
    - tensorly

test:
  imports:
    - scmagnify

about:
  home: https://github.com/LiHongCSBLab/scMagnify
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: "Multi-scale gene regulatory network (GRN) inference and analysis from single-cell multi-omic datasets"
  doc_url: https://scmagnify.readthedocs.io/
  dev_url: https://github.com/LiHongCSBLab/scMagnify

extra:
  recipe-maintainers:
    - xfchen0912
  identifiers:
    - doi:10.1038/s41467-026-78441-9
