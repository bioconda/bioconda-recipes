{% set name = "trace50" %}
{% set version = "5.0.0" %}
{% set tag = name ~ "-v" ~ version %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # PyPI publishes wheels only (no sdist): the package is a maturin/PyO3
  # extension whose Cargo.toml is a member of the monorepo Cargo workspace
  # rooted at rust/Cargo.toml, so a self-contained sdist cannot be produced
  # from the trace50/ directory alone. Build from the full monorepo tag.
  url: https://github.com/veg/HyphAeon/archive/refs/tags/{{ tag }}.tar.gz
  sha256: 03d0afeaca496dee6377e4bebaccfb1b46446d63a874fc76f1219fcaf336c477

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - make
    - cmake
    - pkg-config
  host:
    - python
    - pip
    - maturin >=1.5,<2
  run:
    - python

test:
  imports:
    - trace50
  commands:
    - trace50 --version
    - trace50 --help
    - trace50 --fasta "${CONDA_PREFIX}/share/trace50/demo_outbreak.fasta" --out-dir results
    - test -s results/trace50_visualization_dossier.json
    - test -s results/acute_transmission_dyads.csv
    - test -s results/autoclock_communities.csv
    - test -s results/patient_surveillance_assignments.csv

about:
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "TRACE-5.0: Dynamic Molecular Surveillance of Viral Transmission Networks"
  description: |
    TRACE-5.0 deconvolves viral transmission networks from dated nucleotide
    alignments. It screens candidate transmission dyads with internal TN93
    distances (or a supplied distance matrix), calibrates edges under DANNO
    with physical clock-adequacy testing and Bayesian FDR control, resolves
    STEVE communities, and infers CHIN macro-scale epidemiological scaling,
    emitting a JSON visualization dossier and tabular dyad/community/patient
    summaries.
  doc_url: https://github.com/veg/HyphAeon#readme
  dev_url: https://github.com/veg/HyphAeon

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - d-callan
