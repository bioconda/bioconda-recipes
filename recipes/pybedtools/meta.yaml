{% set name = "pybedtools" %}
{% set version = "0.12.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/8c/0e/3b645561e25640cd5ffce29e7e1966e67b3ea49b7091910e5e2f43c203db/pybedtools-0.12.1.tar.gz
  sha256: f459def3b430b4de6689a800d5d7b38beb313436cfb9d5e966600afca909415a

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("pybedtools", max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - cython
    - zlib
  run:
    - python
    - bedtools
    - numpy
    - pysam

test:
  imports:
    - pybedtools
  commands:
    - python -c "import pybedtools; help(pybedtools.BedTool.intersect)" | grep "Original BEDTools help"

about:
  home: https://github.com/daler/pybedtools
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Wraps BEDTools for use in Python and adds many additional features.
  dev_url: https://github.com/daler/pybedtools
  doc_url: https://daler.github.io/pybedtools

extra:
  identifiers:
    - biotools:pybedtools
  additional-platforms:
    - linux-aarch64
    - osx-arm64
