{% set name = "streampile" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a7d06e59d46329b0382bd9895b30cb836760bac7d4600b0196649b532b488204

build:
  number: 0
  skip: True  # [py < 311]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.15,<2
    - pip
  run:
    - python
    - bedspec >=4.0.0
    - pybgzf >=0.1.2
    - pysam >=0.23,<0.25
    - typeline >=2.4.0
    - typing-extensions >=4.12

test:
  imports:
    - streampile
  commands:
    - pip check
    - streampile --help
  requires:
    - pip

about:
  home: "https://github.com/clintval/{{ name }}"
  summary: "Forward-only pileups streamed from coordinate-sorted SAM, BAM, and CRAM records."
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - NOTICE
    - THIRDPARTY.yml
  dev_url: "https://github.com/clintval/{{ name }}"
  doc_url: "https://github.com/clintval/{{ name }}/blob/{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - clintval
