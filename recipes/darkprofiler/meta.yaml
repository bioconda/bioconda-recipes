{% set name = "darkprofiler" %}
{% set version = "0.4.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/darkprofiler-{{ version }}.tar.gz
  sha256: db79076dec6fc9cd2f4b31b9dae9c41fc221dfc6ec2465338f2b957f38221af9

build:
  number: 0
  noarch: python
  entry_points:
    - darkprofiler = darkprofiler.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
  - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.7
    - setuptools >=61
    - pip
  run:
    - python >=3.7
    - biopython >=1.78
    - matplotlib-base >=3.3

test:
  imports:
    - darkprofiler
  commands:
    - darkprofiler --help

about:
  home: "https://pypi.org/project/darkprofiler"
  summary: "DarkProfiler: Alignment and Classification of Peptides from Reference-Independent De Novo Peptide Sequencing Experiments."
  license: MIT
  license_family: MIT
  license_file: "LICENSE.txt"
  doc_url: "https://pypi.org/project/darkprofiler"

extra:
  recipe-maintainers:
    - LeeHanJun00
