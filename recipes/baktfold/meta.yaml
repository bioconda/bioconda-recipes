{% set name = "baktfold" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c41a9340c6cbd54336dbf04c89faab840af99c6163707b6a9210b16878a4fd61

build:
  number: 0
  noarch: python
  entry_points:
    - baktfold = baktfold:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"      
  run_exports:
    - {{ pin_subpackage('baktfold', max_pin='x') }}

requirements:
  host:
    - python >=3.10,<3.14
    - pip
    - setuptools
  run:
    - foldseek ==10.941cd33
    - python >=3.10,<3.14
    - biopython >=1.76
    - alive-progress >=3.0.1
    - datasets >=2.15
    - requests >=2.25
    - pyarrow >=14.0.0
    - polars >=1.0.0
    - loguru >=0.5.3
    - pyyaml >=6.0
    - click >=8.0.0
    - sentencepiece >=0.1.99
    - transformers >=4.34
    - pytorch >=2.1.2
    - numpy >=1.24
    - h5py >=3.5
    - tqdm >=4.35.0
    - xopen >=1.5.0
    - protobuf >=3.20
    - tiktoken >=0.5.0
    - pholdlib >=0.1.2

test:
  imports:
    - baktfold
  commands:
    - baktfold --help
    - baktfold run --help

about:
  home: https://github.com/gbouras13/baktfold
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Rapid & standardized annotation of bacterial genomes, MAGs & plasmids using protein structural information
  doc_url: https://baktfold.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - gbouras13
