{% set name = "igv-reports" %}
{% set version = "1.17.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/ad/a5/7c40a31bf11fc85fadcdf73ced5910b618b81fc231051b2ab87c295812c0/igv_reports-{{ version }}.tar.gz
  sha256: 70b6ff931679c2f5b6eee0961b58a71a6c341137df384222b4636abffb4d6e60

build:
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  number: 0
  entry_points:
    - create_report = igv_reports.report:main
    - create_datauri = igv_reports.datauri:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - pip
    - python
  run:
    - intervaltree
    - pysam
    - python
    - requests
    - pytwobit
    - pyyaml

test:
  imports:
    - igv_reports
  #commands:
    #- create_report --help
    #- create_datauri --help

about:
  home: "https://github.com/igvteam/igv-reports"
  license: MIT
  license_family: MIT
  license_file: "LICENSE.md"
  summary: "Creates self-contained html pages for visual variant review with IGV (igv.js)."
  dev_url: "https://github.com/igvteam/igv-reports"
  doc_url: "https://github.com/igvteam/igv-reports/blob/v{{ version }}/README.md"
