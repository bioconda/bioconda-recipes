{% set version = "4.0.0" %}
{% set name = "MetaProViz" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  sha256: 3710d4545b2b131f8bfc52810e7760887fc1a8495320c4364a2b1c7d8bc0ee7a

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-metaproviz", max_pin="x.x") }}'
  noarch: generic

# Suggests: BiocStyle, ggupset, ggVennDiagram, kableExtra, knitr, pkgdown, svglite, testthat (>= 3.1.4)
requirements:
  host:
    - bioconductor-cosmosr
    - bioconductor-enhancedvolcano
    - bioconductor-limma
    - bioconductor-omnipathr >=3.19.12
    - bioconductor-qvalue
    - bioconductor-s4vectors
    - bioconductor-summarizedexperiment
    - r-base
    - r-broom
    - r-complexupset >=1.3.3
    - r-dbi
    - r-dplyr
    - r-factoextra
    - r-ggbeeswarm
    - r-ggfortify
    - r-ggplot2 >=3.3.5
    - r-ggpubr
    - r-ggraph
    - r-ggrepel
    - r-gridextra
    - r-gtools
    - r-hash
    - r-igraph
    - r-inflection
    - r-logger
    - r-magrittr
    - r-patchwork
    - r-pheatmap
    - r-polychrome
    - r-purrr
    - r-qcc
    - r-rappdirs
    - r-readr
    - r-rlang
    - r-rstatix
    - r-stringr
    - r-tibble
    - r-tidyr
    - r-tidyselect
    - r-writexl
  run:
    - bioconductor-cosmosr
    - bioconductor-enhancedvolcano
    - bioconductor-limma
    - bioconductor-omnipathr >=3.19.12
    - bioconductor-qvalue
    - bioconductor-s4vectors
    - bioconductor-summarizedexperiment
    - r-base
    - r-broom
    - r-complexupset >=1.3.3
    - r-dbi
    - r-dplyr
    - r-factoextra
    - r-ggbeeswarm
    - r-ggfortify
    - r-ggplot2 >=3.3.5
    - r-ggpubr
    - r-ggraph
    - r-ggrepel
    - r-gridextra
    - r-gtools
    - r-hash
    - r-igraph
    - r-inflection
    - r-logger
    - r-magrittr
    - r-patchwork
    - r-pheatmap
    - r-polychrome
    - r-purrr
    - r-qcc
    - r-rappdirs
    - r-readr
    - r-rlang
    - r-rstatix
    - r-stringr
    - r-tibble
    - r-tidyr
    - r-tidyselect
    - r-writexl

test:
  commands:
    # MetaProViz imports OmnipathR, which creates an `omnipathr-log` directory
    # in the working directory when its namespace is loaded. That breaks cleanup
    # of the container test's temporary directory, so disable the logfile here.
    - $R -e "options(omnipathr.logfile = 'none'); library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: BSD_3_clause + file LICENSE
  summary: METabolomics pre-PRocessing, functiOnal analysis and VIZualisation
  description: MetaProViz can analyse standard metabolomics and exometabolomics data (CoRe). It performs pre-processing including feature filtering, missing value imputation, normalisation and outlier detection. It performs functional analysis including differential metabolite analysis (DMA), clustering based on regulatory rules (MCA) and contains different visualisation methods to extract biological interpretable graphs and saves them in a publication ready format.
  license_file: LICENSE
