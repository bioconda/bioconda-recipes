{% set version = "4.99.0" %}
{% set name = "MetaProViz" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url: https://github.com/saezlab/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e24df4b00d99e2c47791f7661bb26f12203a01e2f666c229ea40e87210ad1b25

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-metaproviz", max_pin="x.x") }}'
  noarch: generic

# Suggests: BiocStyle, ggupset, ggVennDiagram, kableExtra, magick, knitr, pkgdown, rmarkdown, svglite, ggbreak, testthat (>= 3.1.4)
requirements:
  host:
    - bioconductor-cosmosr
    - bioconductor-enhancedvolcano
    - bioconductor-limma
    - bioconductor-omnipathr >=3.19.12
    - bioconductor-qvalue
    - bioconductor-s4vectors
    - bioconductor-summarizedexperiment
    - r-base
    - r-broom
    - r-complexupset >=1.3.3
    - r-dbi
    - r-dplyr
    - r-factoextra
    - r-ggbeeswarm
    - r-ggfortify
    - r-ggnewscale
    - r-ggplot2 >=3.3.5
    - r-ggpubr
    - r-ggraph
    - r-ggrepel
    - r-gridextra
    - r-gtools
    - r-hash
    - r-igraph
    - r-inflection
    - r-logger
    - r-magrittr
    - r-patchwork
    - r-pheatmap
    - r-polychrome
    - r-purrr
    - r-rappdirs
    - r-readr
    - r-rlang
    - r-rstatix
    - r-stringr
    - r-tibble
    - r-tidyr
    - r-tidyselect
    - r-withr
    - r-writexl
  run:
    - bioconductor-cosmosr
    - bioconductor-enhancedvolcano
    - bioconductor-limma
    - bioconductor-omnipathr >=3.19.12
    - bioconductor-qvalue
    - bioconductor-s4vectors
    - bioconductor-summarizedexperiment
    - r-base
    - r-broom
    - r-complexupset >=1.3.3
    - r-dbi
    - r-dplyr
    - r-factoextra
    - r-ggbeeswarm
    - r-ggfortify
    - r-ggnewscale
    - r-ggplot2 >=3.3.5
    - r-ggpubr
    - r-ggraph
    - r-ggrepel
    - r-gridextra
    - r-gtools
    - r-hash
    - r-igraph
    - r-inflection
    - r-logger
    - r-magrittr
    - r-patchwork
    - r-pheatmap
    - r-polychrome
    - r-purrr
    - r-rappdirs
    - r-readr
    - r-rlang
    - r-rstatix
    - r-stringr
    - r-tibble
    - r-tidyr
    - r-tidyselect
    - r-withr
    - r-writexl

test:
  commands:
    # MetaProViz imports OmnipathR, which creates an `omnipathr-log` directory
    # in the working directory when its namespace is loaded. That breaks cleanup
    # of the container test's temporary directory, so disable the logfile here.
    - $R -e "options(omnipathr.logfile = 'none'); library('{{ name }}')"

about:
  home: https://github.com/saezlab/{{ name }}
  license: BSD_3_clause + file LICENSE
  summary: METabolomics pre-PRocessing, functiOnal analysis and VIZualisation
  description: MetaProViz can analyse standard metabolomics and exometabolomics data (CoRe). It performs pre-processing including feature filtering, missing value imputation, normalisation and outlier detection. It performs functional analysis including differential metabolite analysis (DMA), clustering based on regulatory rules (MCA) and contains different visualisation methods to extract biological interpretable graphs and saves them in a publication ready format.
  license_file: LICENSE
