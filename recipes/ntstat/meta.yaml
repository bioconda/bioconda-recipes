{% set version = "1.2" %}

package:
  name: ntstat
  version: {{ version }}

source:
  url: https://github.com/BirolLab/ntStat/releases/download/v{{ version }}/ntStat-{{ version }}.tar.gz
  sha256: ec407767b21cb5754005f37a1a85caad58750f582cdb5bc7200a85dcc57bfd7e

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('ntstat', max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - meson
    - meson-python
    - cmake
    - python
  host:
    - python
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - btllib >=1.7.2
    - cpp-argparse
    - cpp-tabulate
    - indicators
    - pybind11
  run:
    - python
    - ntcard
    - btllib >=1.7.2
    - matplotlib-base
    - numpy
    - scipy
    - tabulate

test:
  commands:
    - ntstat --version
    - ntstat count --help

about:
  home: https://github.com/BirolLab/ntStat
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: 'a toolkit for statistical analysis of k-mer frequency and depth'

extra:  
  additional-platforms:
    - linux-aarch64
    - osx-arm64
