{% set name = "raxml-ng" %}
{% set version = "2.0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/amkozlov/raxml-ng/releases/download/{{ version }}/{{ name }}_v{{ version }}_source.zip
  sha256: 7cd3fa6b1de373777d688032c9ec6731078b67e6a812d7a1d779295d016843d2

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - pkg-config
  host:
    - gmp
    - htslib
    - openmpi
  run:
    - htslib
    - openmpi

test:
  commands:
    - raxml-ng --version
    - raxml-ng-mpi --version  # [not osx]

about:
   home: "https://github.com/amkozlov/raxml-ng"
   license: "AGPL-3.0-or-later"
   license_family: AGPL
   license_file: "LICENSE.txt"
   summary: "RAxML Next Generation: faster, easier-to-use and more flexible."
   dev_url: "https://github.com/amkozlov/raxml-ng"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  container:
    # openmpi needs ssh client
    extended-base: true
  identifiers:
    - doi:10.1093/bioinformatics/btz305
    - biotools:RAxML-NG
    - usegalaxy-eu:raxmlng
