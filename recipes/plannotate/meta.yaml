{% set name = "plannotate" %}
{% set version = "1.2.5" %}
{% set sha256 = "5d9b557027730e4751cdd987da8d8c59847ea3ba39bb0c13450d9c06c042421e" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/mmcguffi/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: {{ sha256 }}
  - url: https://github.com/mmcguffi/{{ name }}/releases/download/v{{ version }}/BLAST_dbs.tar.gz
    sha256: 34c7bacb1c73bd75129e16990653f73b3eba7e3cdb3816a55d3989a7601f2137
    folder: BLAST_dbs

build:
  number: 0
  noarch: python
  entry_points:
    - plannotate = plannotate.pLannotate:main
  run_exports:
    - {{ pin_subpackage('plannotate', max_pin="x") }}

requirements:
  host:
    - python >=3.10,<3.14
    - pip
    - setuptools
  run:
    - python >=3.10,<3.14
    - click
    - curl
    - numpy >=1.23,<2
    - biopython >=1.78
    - blast >=2.10.1
    - diamond >=2.0.13
    - pandas >=1.3.5,<3
    - ripgrep >=13.0.0
    - tabulate >=0.8.9
    - trnascan-se >=2.0.7
    - streamlit >=1.36,<1.42
    - altair =4.2.2
    - bokeh =2.4.3
    - protobuf >=3.20.3

test:
  commands:
    - plannotate batch --help

about:
  home: "https://github.com/mmcguffi/pLannotate"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "Webserver and command line tool for annotating engineered plasmids."
  dev_url: "https://github.com/mmcguffi/pLannotate"
  doc_url: "https://github.com/mmcguffi/pLannotate/blob/v{{ version }}/README.md"

extra:
  recipe-maintainers:
    - mmcguffi
    - rpetit3
  identifiers:
    - biotools:plannotate
