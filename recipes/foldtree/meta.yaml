{% set name = "foldtree" %}
{% set version = "1.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url:  https://github.com/DessimozLab/fold_tree/archive/refs/tags/v{{ version }}.tar.gz
  sha256: fe0ce8da00b215265000df2f2eeb647ff2e7911395835188630425417695dda7

build:
  number: 0
  noarch: python
  entry_points:
    - foldtree = foldtree.foldtree:cli
    - pyfoldtree = foldtree.pyfoldtree:main
    - apisearch = foldtree.foldseek_remote_search:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools
  run:
    - python >=3.7
    - click
    - snakemake-minimal <8
    - biopython
    - foldseek
    - toytree
    - numpy
    - pandas
    - quicktree
    - python-wget
    - requests
    - scipy
    - ujson

test:
  commands:
    - foldtree --help
    - foldtree --version

about:
  home: "https://github.com/DessimozLab/fold_tree"
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: "Foldtree creates phylogenetic trees from protein structures using Foldseek."
  dev_url: "https://github.com/DessimozLab/fold_tree"
  doc_url: "https://github.com/DessimozLab/fold_tree/blob/v{{ version }}/README.md"

extra:
  identifiers:
    - doi:10.1038/s41594-025-01649-8
