{% set name = "mgcalibrator" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/NimroddeWit/MGCalibrator/archive/refs/tags/v.{{ version }}.tar.gz
  sha256: 0c5ddd7db185095674280bbf70576a3175c2b9136cbbd705d102e9e576337d43

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.9
    - pandas >=1.5
    - numpy >=1.24
    - pysam >=0.20
    - samtools
    - coverm

test:
  imports:
    - MGCalibrator
  commands:
    - mgcalibrator --help
    - mgcalibrator --version

about:
  home: https://github.com/NimroddeWit/MGCalibrator
  dev_url: https://github.com/NimroddeWit/MGCalibrator
  doc_url: https://github.com/NimroddeWit/MGCalibrator/blob/v{{ version }}/README.md
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Calibrate metagenomic coverage (BAM, SingleM or Sylph output) to absolute abundances using DNA input mass."
  description: |
    MGCalibrator converts sequencing-derived coverage information into absolute
    abundances (number of copies) using the DNA mass of each sample and the number
    of sequenced bases. Input can be BAM files, SingleM output together with the raw
    FASTQ files, or Sylph output (.sylphmpa) together with the raw FASTQ files.

extra:
  identifiers:
    - doi:10.64898/2026.02.26.708180
  recipe-maintainers:
    - NimroddeWit
