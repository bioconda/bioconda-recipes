{% set name = "r-ranomaly" %}
{% set version = "1.2.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://forge.inrae.fr/umrf/ranomaly/-/archive/v{{ version }}/ranomaly-v{{ version }}.tar.gz
  sha256: f2ab121d08125e49ff7a55926f66a6a51a96d958d7d886b1f95af2f913eacdf2

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin = "x") }}

requirements:
  build:
    - git
    - make
    - cmake
    - pkg-config
  host:
    - tbb
    - gmp
    - libcurl
    - mpfr
    - zlib
    - openssl
    - xz
    - freetype
    - libtiff
    - icu
    - compilers
    - libxml2
    - r-base =4.5.*
    - bioconductor-biocversion =3.22.0
    - bioconductor-dada2 =1.38.0
    - bioconductor-shortread =1.68.0
    - bioconductor-biobase =2.70.0
    - bioconductor-phyloseq
    - bioconductor-complexheatmap
    - bioconductor-decipher
    - bioconductor-decontam
    - bioconductor-deseq2
    - bioconductor-genomicalignments
    - bioconductor-mixomics
    - bioconductor-rhtslib
    - bioconductor-rsamtools
    - bioconductor-summarizedexperiment
    - bioconductor-metagenomeseq
    - r-doparallel
    - r-foreach
    - r-futile.logger
    - r-ggplot2
    - r-htmlwidgets
    - r-metacoder
    - r-nlme
    - r-phangorn
    - r-plotly >=4.10.4
    - r-stringr
    - r-taxize
    - r-venn
    - r-venndiagram
    - r-vroom
    - r-cluster
    - r-scales
  run:
    - tbb
    - r-base =4.5.*
    - bioconductor-dada2 =1.38.0
    - bioconductor-shortread =1.68.0
    - bioconductor-biobase =2.70.0
    - bioconductor-phyloseq
    - bioconductor-complexheatmap
    - bioconductor-decipher
    - bioconductor-decontam
    - bioconductor-deseq2
    - bioconductor-genomicalignments
    - bioconductor-mixomics
    - bioconductor-rhtslib
    - bioconductor-rsamtools
    - bioconductor-summarizedexperiment
    - bioconductor-metagenomeseq
    - r-cluster
    - r-doparallel
    - r-foreach
    - r-futile.logger
    - r-ggplot2
    - r-htmlwidgets
    - r-metacoder
    - r-nlme
    - r-phangorn
    - r-plotly >=4.10.4
    - r-stringr
    - r-taxize
    - r-venn
    - r-venndiagram
    - r-vroom

test:
  commands:
    - $R -e "library(ranomaly)"

about:
  home: https://forge.inrae.fr/umrf/ranomaly
  license: "GPL-3.0-or-later"
  summary: "rANOMALY is an R Package integrating AmplicoN wOrkflow for Microbial community AnaLYsis."

extra:
  skip-lints:
    - should_be_noarch_generic
