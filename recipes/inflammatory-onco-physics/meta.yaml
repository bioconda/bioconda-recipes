{% set name = "inflammatory-onco-physics" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: "https://github.com/Lukecele/inflammatory-onco-physics/archive/refs/tags/v{{ version }}.tar.gz"
  sha256: 3142d77f3d5928fa725f94ec95a7ffa84cbe88bb35aa8a800fc44b01949e6923

build:
  number: 0
  noarch: python
  entry_points:
    - oncophysics-calc = app_bedside_calculator:main
  script: "{{ PYTHON }} -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage("inflammatory-onco-physics", max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - setuptools >=61.0
    - pip
  run:
    - python >=3.10
    - numpy >=1.23.0
    - scipy >=1.9.0
    - pandas >=1.5.0
    - lifelines >=0.28.0
    - matplotlib-base >=3.6.0
    - seaborn >=0.12.0
    - scikit-learn >=1.2.0

test:
  commands:
    - oncophysics-calc --help

about:
  home: https://github.com/Lukecele/inflammatory-onco-physics
  dev_url: https://github.com/Lukecele/inflammatory-onco-physics
  license: MIT
  license_family: MIT
  license_file: LICENSE-MIT
  summary: "Continuous reaction-diffusion solver and survival pipeline for microvascular pharmacological sanctuaries."
  description: "A computational oncology framework and bedside decision engine modeling microvascular pharmacological sanctuaries, Bessel K0 continuous reaction-diffusion drug gradients, ctDNA lead time kinetics, and multicenter survival models in targeted solid oncology."

extra:
  recipe-maintainers:
    - Lukecele
  identifiers:
    - doi:10.21203/rs.3.rs-11695210/v1
    - doi:10.5281/zenodo.24118328
    - biotools:inflammatory-onco-physics
