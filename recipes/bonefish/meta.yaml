{% set name = "bonefish" %}
{% set version = "0.1.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/DylanCosto/bonefish/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f7b0ba5460a7e61df9c48b4d6c252fed8ba539d36994fac781ab90f976d3d59b

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - make
    - cargo-bundle-licenses

test:
  commands:
    - bonefish --version
    - bonefish --help

about:
  home: https://github.com/DylanCosto/bonefish
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Fast aligner for Oxford Nanopore DNA reads, with minimap2-level variant-calling accuracy.
  description: |
    bonefish aligns Oxford Nanopore DNA reads (FASTQ, FASTA or dorado BAM) to a reference and
    writes SAM, PAF or a coordinate-sorted, indexed BAM. It uses minimap2's lr:hq seeding and
    scoring with cheaper chaining and alignment, and is validated against GIAB truth sets.
  dev_url: https://github.com/DylanCosto/bonefish
  doc_url: https://github.com/DylanCosto/bonefish/blob/main/docs/tutorial.md

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
