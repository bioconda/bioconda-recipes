{% set version = "2.7.9" %}

package:
  name: crisprme
  version: "{{ version }}"

source:
  url: https://github.com/pinellolab/crisprme-plus/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f607b1462735d3b401ea049e7d2c5dbcb5c12d28b4c0f181cfd4d804cfe19fa4

build:
  run_exports:
    - {{ pin_subpackage('crisprme', max_pin="x") }}
  number: 0
  noarch: generic

requirements:
  host:
    - python >=3.11,<3.12
  run:
    - python >=3.11,<3.12
    - crispritz >=2.9.0
    # numerical stack
    - numpy >=1.26,<2
    - scipy >=1.11
    - pandas >=2.1,<3
    - matplotlib-base >=3.8
    - biopython
    - more-itertools
    - statsmodels
    - intervaltree
    - ijson
    # bioinformatics tools
    - pysam
    - bcftools
    - bedtools
    - bedops
    - samtools
    - htslib
    - ucsc-liftover
    - minimap2
    - impg ==0.5.0
    # data fetch / misc
    - axel
    - gdown
    - zip
    - gsl
    - importlib-metadata
    - huggingface_hub
    # web app
    - dash >=2.14,<3
    - dash-bootstrap-components <2
    - dash-daq
    - flask
    - flask-caching
    - flask-compress
    - gunicorn
    - werkzeug

test:
  commands:
    - crisprme.py --version

about:
  home: "https://github.com/pinellolab/crisprme-plus"
  license: "LicenseRef-MGBOA-1.0"
  license_family: OTHER
  license_file: LICENSE
  summary: "CRISPRme+: variant- and haplotype-aware CRISPR off-target assessment"
  dev_url: "https://github.com/pinellolab/crisprme-plus"
  doc_url: "https://github.com/pinellolab/crisprme-plus/blob/v{{ version }}/README.md"

extra:
  recipe-maintainers:
    - lucapinello
    - ManuelTgn
  identifiers:
    - doi:10.1038/s41588-022-01257-y
