{% set version = "2.8.1" %}

package:
  name: crisprme
  version: "{{ version }}"

source:
  url: https://github.com/pinellolab/crisprme-plus/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f15371e4d0c230c304fbc8f55367f5539999da5d8893e8471d75af8f8123c008

build:
  run_exports:
    - {{ pin_subpackage('crisprme', max_pin="x") }}
  number: 1
  noarch: generic

requirements:
  host:
    - python >=3.11,<3.12
  run:
    - python >=3.11,<3.12
    - crispritz >=2.9.1,<2.10
    # numerical stack
    - numpy >=1.26,<2
    - scipy >=1.11
    - pandas >=2.1,<3
    - matplotlib-base >=3.8
    - biopython
    - more-itertools
    - statsmodels
    - intervaltree
    - ijson
    - git
    - yajl
    - cffi
    # bioinformatics tools
    - pysam
    - bcftools
    - bedtools
    - bedops
    - samtools
    - htslib
    - pyliftover
    - minimap2
    - impg ==0.5.0
    # data fetch / misc
    - axel
    - gdown
    - zip
    - gsl
    - importlib-metadata
    - huggingface_hub
    # web app
    - dash >=2.14,<3
    - dash-bootstrap-components <2
    - dash-daq
    - flask ==3.1.3
    - flask-caching ==2.4.1
    - flask-compress ==1.24
    - cachelib ==0.17.0
    - gunicorn
    - werkzeug ==3.1.8

test:
  commands:
    - crisprme.py --version

about:
  home: "https://github.com/pinellolab/crisprme-plus"
  license: "LicenseRef-MGBOA-1.0"
  license_family: OTHER
  license_file: LICENSE
  summary: "CRISPRme+: variant- and haplotype-aware CRISPR off-target assessment"
  dev_url: "https://github.com/pinellolab/crisprme-plus"
  doc_url: "https://github.com/pinellolab/crisprme-plus/blob/v{{ version }}/README.md"

extra:
  recipe-maintainers:
    - lucapinello
    - ManuelTgn
  identifiers:
    - doi:10.1038/s41588-022-01257-y
