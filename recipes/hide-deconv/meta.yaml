{% set name = "hide-deconv" %}
{% set version = "0.4.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hide-deconv/hide_deconv-{{ version }}.tar.gz
  sha256: 61f65c4b417a86432318d34af763f6ecf4b7f4842618cacc2705024f34507dce

build:
  entry_points:
    - hide-deconv = hide_deconv.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.12,<3.15,!=3.14.1
    - poetry-core
    - pip
  run:
    - python >=3.12,<3.15,!=3.14.1
    - anndata >=0.12.10,<0.14.0
    - pytorch >=2.11.0,<3.0.0
    - cvxpy >=1.8.2,<2.0.0
    - numpy >=2.4.4,<3.0.0
    - pandas >=2.3.3
    - click >=8.3.2,<9.0.0
    - scikit-learn >=1.8.0,<2.0.0
    - scipy >=1.17.1,<2.0.0
    - inquirerpy >=0.3.4,<0.4.0
    - rich >=14.3.3
    - seaborn >=0.13.2,<0.14.0
    - scikit-posthocs >=0.12.0
    - statsmodels >=0.14.6
    - requests >=2.33.1,<3.0.0
    - scanpy >=1.12.1,<2.0.0
    - lifelines >=0.30.3,<0.31.0
    - umap-learn >=0.5.12,<0.6.0
    - networkx >=3.6.1,<4.0.0
    - pydeseq2 >=0.5.4,<0.6.0

test:
  imports:
    - hide_deconv
  commands:
    - pip check
    - hide-deconv --help
  requires:
    - pip

about:
  home: https://github.com/dvoelkl/HIDE-deconv
  summary: HIDE-Deconv - Hierarchical Cell Type Deconvolution
  doc_url: https://dvoelkl.github.io/HIDE-deconv/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dvoelkl
  identifiers:
    - doi:10.64898/2026.08.24.746754
