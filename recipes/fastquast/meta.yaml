{% set name = "fastQuast" %}
{% set version = "1.2.3" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz"
  sha256: df6bb3a53e5908784a6c40a73a23d0af0a96ce23f78876a133cfe539bd0a0f03

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.6
    - setuptools
  run:
    - python >=3.6

test:
  requires:
    - pip
  imports:
    - fastQuast
  commands:
    - python -m pip check
    - fastQuast --help
    - fastquast --help

about:
  home: "https://github.com/aglabx/fastQuast"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Fast and simple Quality Assessment Tool for Large Genomes"
  doc_url: "https://github.com/aglabx/fastQuast/blob/main/README.md"

extra:
  recipe-maintainers:
    - ad3002
