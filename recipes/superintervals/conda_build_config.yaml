# Extend Bioconda's pinned Python matrix to include Python 3.14.
python:
  - 3.10.* *_cpython
  - 3.11.* *_cpython
  - 3.12.* *_cpython
  - 3.13.* *_cp313
  - 3.14.* *_cp314

# Keep aligned with python in conda-forge-pinning's zip_keys.
is_python_min:
  - false
  - false
  - false
  - false
  - false
