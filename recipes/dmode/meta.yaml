{% set version = "0.1" %}

package:
  name: dmode
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/dmode/dmode-{{ version }}.tar.gz
  sha256: c5561b3329a21166ce97d1169a731c3461b0fc6b629bf470a4cf6025c960224a

build:
  entry_points:
    - dmode = dmode.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage('dmode', max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=3.10
    - pyarrow
    - matplotlib-base
    - scipy
    - statsmodels
    - tqdm
    - anndata
    - formulaic
    - numpy
    - pandas
    - scikit-learn
    - formulaic-contrasts
    - pydeseq2
    - umap-learn
    - seaborn
    - polars ==1.34.0
    - pyranges
    - adjusttext

test:
  imports:
    - dmode
  commands:
    - pip check
    - dmode --help
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/dmode/
  summary: A unified framework for Differential Modification and Expression Analysis of Nanopore direct RNA-seq data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - johannesmiedema
