{% set name = "virmake" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Rounge-lab/VirMake/releases/download/v{{ version }}/virmake-{{ version }}.tar.gz
  sha256: "b8dfb4787038080f486b3117ae2c6599f76416806daf3cba93e47a1d840c17ee"

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation"
  run_exports:
    - {{ pin_subpackage({{ name }}, max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - pip
    - hatchling
  run:
    - python >=3.12
    - click >=8.1
    - pandas >=2
    - pyyaml >=6
    - platformdirs >=4
    - snakemake >=8.14,<10
    - snakemake-executor-plugin-slurm >=1

test:
  imports:
    - virmake
  commands:
    - virmake --version
    - virmake --help

about:
  home: https://github.com/Rounge-lab/VirMake
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A Snakemake pipeline for viral metagenomic data analysis
  description: |
    VirMake is a Snakemake-based pipeline for viral taxonomic and functional
    characterisation from shotgun metagenomic sequencing data. It supports
    annotation of paired-end data, offline running, and HPC cluster
    execution via Slurm.
  doc_url: https://virmake.readthedocs.io
  dev_url: https://github.com/Rounge-lab/VirMake

extra:
  identifiers:
    - doi:10.1101/2025.02.07.637044
  recipe-maintainers:
    - sverre-branders
