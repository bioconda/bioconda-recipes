{% set version = "0.47.0" %}
{% set sha256 = "0004a1ab16f78ccf566575df5696869543970b5416bd3dd7c1069a3ee0d89479" %}
{% set name = "mehari" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/varfish-org/mehari/archive/{{ name }}-v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: True  # [osx]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cmake
    - make
    - cargo-bundle-licenses
    - pkg-config
  host:
    - clangdev
    - llvmlite
    - openssl
    - protobuf
    - libprotobuf
    - zlib
    - sqlite
  run:
    - sqlite

test:
  commands:
    - mehari -h

about:
  home: "https://github.com/varfish-org/mehari"
  license: MIT
  license_family: MIT
  license_file: "LICENSE.txt"
  summary: "VEP-like tool for sequence ontology and HGVS annotation of VCF files written in Rust."
  dev_url: "https://github.com/varfish-org/mehari"
  doc_url: "https://github.com/varfish-org/mehari/blob/{{ name }}-v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.5281/zenodo.10603122
