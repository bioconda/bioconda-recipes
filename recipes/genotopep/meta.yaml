{% set name = "genotopep" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6f6796d140cfdbd8d73f120c1859d6495e968983880361f22ceb6932bd11de6f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling >=1.25
  run:
    - python >=3.10
    - pyrodigal >=3.6,<4
    - pyyaml >=6,<7

test:
  imports:
    - genotopep
  commands:
    - genotopep --version
    - genotopep --help

about:
  home: https://github.com/ljunwon1114/GenoToPep
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Reproducible peptide candidate generation from genome and metagenome assemblies or protein FASTA files.
  dev_url: https://github.com/ljunwon1114/GenoToPep

extra:
  recipe-maintainers:
    - ljunwon1114
