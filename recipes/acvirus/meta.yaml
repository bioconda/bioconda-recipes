{% set name = "acvirus" %}
{% set version = "1.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/xiahaolong/ACVirus/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 02eec388bc57e343beaee5db4bd0c68f98676d243f95eb3e9ce071586da06aae

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage("acvirus", max_pin="x") }}

requirements:
  build:
    - bash
  run:
    - python >=3.10
    - biopython >=1.85
    - diamond >=2.1
    - distinctipy >=1.3
    - graph-tool
    - iqtree >=3
    - leidenalg
    - mafft
    - matplotlib-base
    - networkx
    - numpy
    - openpyxl
    - pandas
    - prodigal
    - python-igraph
    - scipy
    - seaborn
    - seqkit
    - trimal

test:
  imports:
    - Bio
    - graph_tool.all
    - igraph
    - leidenalg
    - numpy
    - openpyxl
    - pandas
  commands:
    - ACVirus --version
    - acvirus --version

about:
  home: https://github.com/xiahaolong/ACVirus
  summary: Genomic sequence-based annotation of viral contigs within ICTV taxonomies
  description: |
    ACVirus classifies viral contigs, places them within ICTV taxonomic
    hierarchies, builds sequence-similarity networks, identifies candidate
    novel viruses, and supports phylogenetic and genome-comparison analyses.
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  dev_url: https://github.com/xiahaolong/ACVirus

extra:
  recipe-maintainers:
    - xiahaolong
