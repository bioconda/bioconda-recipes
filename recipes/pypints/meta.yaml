{% set name = "pyPINTS" %}
{% set version = "1.2.31" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pypints/pypints-{{ version }}.tar.gz
  sha256: a439f47a46e3ccbc181a90e0f4adb85fed3449474235cae72abacd10b826e30f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - bedtools
    - biopython
    - matplotlib-base
    - numpy
    - pandas
    - pybedtools
    - pybigwig
    - pysam
    - requests
    - samtools
    - scipy
    - statsmodels
    - tabix

test:
  imports:
    - pints

about:
  home: "https://github.com/hyulab/PINTS"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: LICENSE
  summary: "Peak Identifier for Nascent Transcripts Starts (PINTS)."
  dev_url: "https://github.com/hyulab/PINTS"
  doc_url: "https://pints.yulab.org"

extra:
  identifiers:
    - doi:10.1038/s41587-022-01211-7
  notes: |
    The tool provides a set of executable files: 
    `pints_caller` (for peak calling, the main program), 
    `pints_visualizer` (for generating bigwig files from bam files), 
    `pints_normalizer` (for normalizing bigwig files by spikein counts), 
    and `pints_boundary_extender`.
