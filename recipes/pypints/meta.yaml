{% set name = "pyPINTS" %}
{% set version = "1.2.31" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://files.pythonhosted.org/packages/83/ad/28e21e0c9cd9d563b4a4019bc5d1e5e2a07ef618c880bce41aba3dab2729/pypints-1.2.31.tar.gz"
  sha256: 9d775a45287b415cfa8a9bd21252bfb3c058aa8228b16c0f1db1d82fca3617cd

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  noarch: python
  run_exports:
    - {{ pin_subpackage('pypints', max_pin="x") }}

requirements:
  host:
    - pip
    - python
  run:
    - bedtools
    - biopython
    - matplotlib-base
    - numpy
    - pandas
    - pybedtools
    - pybigwig
    - pysam
    - python
    - requests
    - samtools
    - scipy
    - statsmodels
    - tabix

test:
  imports:
    - pints

about:
  home: "https://pints.yulab.org"
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: "Peak Identifier for Nascent Transcripts Starts (PINTS)"
  dev_url: "https://github.com/hyulab/PINTS"

extra:
  identifiers:
    - doi:10.1038/s41587-022-01211-7
  notes: |
    The tool provides a set of executable files: 
    `pints_caller` (for peak calling, the main program), 
    `pints_visualizer` (for generating bigwig files from bam files), 
    `pints_normalizer` (for normalizing bigwig files by spikein counts), 
    and `pints_boundary_extender`.
