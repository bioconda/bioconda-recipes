{% set name = "dagchainer" %}
{% set version = "2020.11.11" %}

package:
  name: {{ name }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin=None) }}
  ignore_run_exports_from:
    - perl-data-dumper
    - perl-storable

source:
  url: https://github.com/kullrich/dagchainer/archive/v{{ version }}.tar.gz
  sha256: cb0b711f36e12a5c5b69e69305d0703112ef1260fe00fc37c9fdc944259d300f

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
  host:
    - perl-data-dumper
    - perl-getopt-long
    - perl-storable
    - perl-carp
    - perl-local-lib
  run:
    - perl-data-dumper
    - perl-getopt-long
    - perl-storable
    - perl-carp
    - perl-local-lib

about:
  home: https://github.com/kullrich/dagchainer
  license: MIT
  license_file: LICENSE
  summary: DAGchainer identifies syntenic regions.
  description: DAGchainer identifies chains of gene pairs sharing conserved order between genomic regions, by identifying paths through a directed acyclic graph (DAG).

test:
  commands:
    - dagchainer 2>&1 | grep dagchainer

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1093/bioinformatics/bth397

