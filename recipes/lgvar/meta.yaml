{% set name = "lgvar" %}
{% set version = "1.3.1" %}  

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/YafeiMaoLab/LGvar/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 70522e8cf254646a7a3d8a37373a0e9448320db3fd65ab055f4c35d71c6b3fe8
build:
  number: 0
  run_exports:
        - {{ pin_subpackage('lgvar', max_pin='x.x') }}
    
requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
  host:
    - python >=3.9,<3.10
    - pip
    - setuptools
    - r-base >=4.2,<4.3
    - htslib >=1.18
    - numpy
  run:
    - python >=3.9,<3.10
    - bcftools >=1.18
    - samtools
    - htslib >=1.18
    - bedtools
    - minimap2 ==2.30
    - seqkit
    - k8
    - rustybam
    - r-base ==4.2.3
    - r-dbscan ==1.1_12
    - r-data.table ==1.15.4
    - r-dplyr ==1.1.4
    - bioconductor-iranges ==2.32.0
    - biopython ==1.83
    - mygene
    - numpy
    - pandas
    - truvari ==5.4.0
    - scipy
    - matplotlib-base

test:
  commands:
    - LGVAR --help 
about:
  home: https://github.com/YafeiMaoLab/LGvar
  license: MIT  
  license_file: LICENSE
  summary: 'LGvar is a pipeline designed for large-scale structural variant (SV) detection based on genome assemblies.'
  dev_url: https://github.com/YafeiMaoLab/LGvar

extra:
  recipe-maintainers:
    - FeifeiZhou-288
