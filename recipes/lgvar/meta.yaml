{% set name = "lgvar" %}
{% set version = "1.3.0" %}  

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/YafeiMaoLab/LGvar/archive/refs/tags/v{{ version }}.tar.gz
  sha256: b6fec5ee8ed743257cbd9b1a9c4c138569db22e66dedee7e6aa9d7013f445f05
build:
  number: 0
    
requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
  host:
    - python=3.9
    - pip
    - setuptools
    - r-base=4.2.3
    - htslib
    - numpy
  run:
    - python=3.9
    - bcftools
    - samtools
    - htslib
    - bedtools
    - minimap2=2.30
    - seqkit
    - k8
    - rustybam
    - r-base=4.2.3
    - r-dbscan=1.1_12
    - r-data.table=1.15.4
    - r-dplyr=1.1.4
    - bioconductor-iranges=2.32.0
    - biopython
    - mygene
    - numpy
    - pandas
    - truvari=5.4.0
    - scipy
    - matplotlib

test:
  commands:
    - LGVAR --help 
about:
  home: https://github.com/YafeiMaoLab/LGvar
  license: MIT  
  license_file: LICENSE
  summary: 'LGvar is a pipeline designed for large-scale structural variant (SV) detection based on genome assemblies.'
  dev_url: https://github.com/YafeiMaoLab/LGvar

extra:
  recipe-maintainers:
    - FeifeiZhou-288
