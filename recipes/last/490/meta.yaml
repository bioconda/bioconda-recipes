package:
  name: last
  version: '490'

source:
  # Debian preserves the upstream 490 source archive; the original CBRC host is unavailable.
  url: https://archive.debian.org/debian/pool/main/l/last-align/last-align_490.orig.tar.xz
  sha256: 2a6d630016ac270c2dc2e9532ef05fe6ad16533f34f8d5f8bbd40bbc595ee046
  patches:
    - maf-convert.23patch
    - last-pair-probs.23patch

build:
  number: 9
  run_exports:
    - {{ pin_subpackage('last', max_pin=None) }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  run:
    - python

test:
  commands:
    - "lastal -h"
    - "lastdb -h"
    - "last-split -V"
    - "last-pair-probs -h"
    - "last-merge-batches -V"
    - "maf-convert -h"

about:
  home: 'http://last.cbrc.jp/'
  license: GPLv3
  summary: "LAST finds similar regions between sequences, and aligns them. It is designed for comparing large datasets to each other (e.g. vertebrate genomes and/or large numbers of DNA reads)."

extra:
  identifiers:
    - biotools:last
