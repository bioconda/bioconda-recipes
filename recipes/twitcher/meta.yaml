{% set name = "twitcher" %}
{% set version = "0.9.0" %}
{% set sha256 = "55a75abbd09408571c59c81380c46d7cb19f6f125e7078299459b3b312023166" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://static.crates.io/crates/{{ name }}/{{ name }}-{{ version }}.crate
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - pkg-config
    - make
    - cmake
    - clangdev
  host:
    - openssl
    - libcurl
    - zlib
    - bzip2
    - xz
  run:
    - openssl

test:
  commands:
    - twitcher --version

about:
  home: https://version.helsinki.fi/kraujasp/twitcher
  dev_url: https://version.helsinki.fi/kraujasp/twitcher
  doc_url: https://twitcher.it.helsinki.fi/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
    - {{ name }}-{{ version }}/LICENSE
    - {{ name }}-{{ version }}/THIRDPARTY.yml
  summary: Find template switch mutations in genomic data

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - jeeeesper
