{% set name = "automlsa2" %}
{% set version = "0.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: eb9920d04a78ee6f2b151496a4b0931277428052ad1f9b5101c7a1fa43201a5c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - automlsa2 = automlsa2.__main__:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - biopython >=1.80
    - numpy >=1.23
    - packaging >=22.0
    - pandas >=1.5
    - psutil >=5.9
    - rich >=12.0
    - blast >=2.12.0
    - mafft >=7.487
    - iqtree >=2.1.1

test:
  imports:
    - automlsa2
  commands:
    - automlsa2 --help
    - automlsa2 --version

about:
  home: https://github.com/davised/automlsa2
  summary: Automated Multi-Locus Sequence Analysis tool
  description: |
    automlsa2 builds multi-locus sequence analysis phylogenies from a set of
    marker gene queries and target genome FASTA files using BLAST+, MAFFT,
    and IQ-TREE.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/davised/automlsa2

extra:
  recipe-maintainers:
    - davised
