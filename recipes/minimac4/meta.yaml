{% set version = "4.1.6" %}

package:
  name: minimac4
  version: {{ version }}

source:
  url: https://github.com/statgen/Minimac4/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 0bce8d6edbf5d5d944b19c4e36403d0bc1d18f2d6003d88e01086488c3eb9333

build:
  number: 2
  run_exports:
    - {{ pin_subpackage('minimac4', max_pin="x") }}

requirements:
  build:
    - make
    - cmake >=3.24
    - pkg-config
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - python <3.14
    - cget
  host:
    - bcftools >=1.20
    - zlib
    - savvy ==2.2.0
    - xz
  run:
    - python <3.14
    - cget

test:
  commands:
    - minimac4 --help
    - minimac4 --version

about:
  home: "https://github.com/statgen/Minimac4"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "Computationally efficient genotype imputation."
  description: "Minimac4 is a lower memory and more computationally efficient implementation of the genotype imputation algorithms in minimac/mininac2/minimac3."
  dev_url: "https://github.com/statgen/Minimac4"
  doc_url: "https://genome.sph.umich.edu/wiki/Minimac4_Documentation"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:minimac4
