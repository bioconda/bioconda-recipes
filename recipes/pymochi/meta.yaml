{% set version = "1.2" %}
{% set github = "https://github.com/lehner-lab/MoCHI" %}

package:
  name: pymochi
  version: '{{ version }}'

source:
  url: https://github.com/Eric-Kobayashi/MoCHI/archive/e4c15d2b75d9dbfca09472c57d84d8803ca6fdbd.tar.gz
  sha256: f97ba263692beedc81e3cd926f8801bdc64bdba6539ee9c731d954cb1f84dbe0

build:
  noarch: python
  number: 0
  script: SETUPTOOLS_SCM_PRETEND_VERSION={{ version }} {{ PYTHON }} -m pip install . --ignore-installed --no-deps -vv
  run_exports:
    - {{ pin_subpackage('pymochi', max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python >=3.11
    - loguru
    - matplotlib-base
    - nextflow >=25.10.4,<26
    - numpy
    - pandas
    - pyreadr
    - pytorch
    - scikit-learn
    - scipy
    - seaborn

test:
  commands:
    - pymochi --help
    - pymochi-nextflow --help

about:
  home: {{ github }}
  dev_url: {{ github }} 
  license: MIT 
  summary: Neural networks to quantify energies, energetic couplings, epistasis and allostery from deep mutational scanning data

