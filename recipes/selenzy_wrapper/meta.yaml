{% set name = "selenzy_wrapper" %}
{% set version = "0.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/brsynth/selenzy-wrapper/archive/{{ version }}.tar.gz
  sha256: d4289dce74f2792c4f22c784b69de731ed5518a19b76d5f2c14d578e6819926a

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install -vv .

requirements:
  host:
    - python >=3.7,<3.10
    - pip
  run:
    - python >=3.7,<3.10
    - biopython >1.70,<=1.77
    - brs_utils
    - emboss
    - rptools >=6.2.3
test:
  source_files:
    - tests/
  imports:
    - selenzy_wrapper

about:
  home: https://github.com/brsynth/selenzy-wrapper
  summary: Python wrapper of selenzy tool
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - breakthewall
    - kenza12

