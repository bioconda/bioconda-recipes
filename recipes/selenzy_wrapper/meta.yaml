{% set name = "selenzy_wrapper" %}
{% set version = "0.3.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/brsynth/selenzy-wrapper/archive/{{ version }}.tar.gz
  sha256: 710a83f5dc9358f4f9a150361c87ef9791fea14f325286b52cdbb2c85df3eedd

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools
  run:
    - python >=3.7
    - biopython
    - brs_utils
    - emboss
    - rplibs >=6.9.7
    - pandas
test:
  source_files:
    - tests/
  imports:
    - selenzy_wrapper

about:
  home: https://github.com/brsynth/selenzy-wrapper
  summary: Python wrapper of selenzy tool
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ramez17khaled
    - breakthewall
