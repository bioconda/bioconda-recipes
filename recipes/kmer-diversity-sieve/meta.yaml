{% set name = "kmer-diversity-sieve" %}
{% set version = "0.1.0" %}
{% set commit = "70022dac889ce315a938310fe49e93618e79ddc6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Upstream has no tagged releases; 0.1.0 is this commit of main.
  url: https://github.com/stevenweaver/{{ name }}/archive/{{ commit }}.tar.gz
  sha256: dd3a65c9e42cfc1efb9c99b0261515f31dc8f59b68bd1c32805fef2c095afb56

build:
  # 1: macOS builds re-enabled (bioconda/bioconda-recipes#70401 closed 2026-10-21); the
  # source is unchanged, so the version stays at 0.1.0.
  number: 1
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}

test:
  commands:
    # There is no --version or --help; with no arguments it names the required flag.
    - l1_pipeline_serial 2>&1 | grep -q -- "--input required"

about:
  home: https://github.com/stevenweaver/kmer-diversity-sieve
  summary: Alignment-free, streaming k-mer sieve that reduces large FASTA collections to a diversity-preserving subset.
  description: |
    Drops partial records, sequencing-error records (Count-Min sketch admission) and
    near-duplicates (MinHash/LSH novelty) in a single streaming pass, so downstream analyses
    only process an informative subset. This package ships the serial build,
    l1_pipeline_serial.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/stevenweaver/kmer-diversity-sieve

extra:
  # Upstream has no tags, so the version here is set by hand against a pinned commit; an
  # automatic version bump would have nothing correct to bump to.
  autobump:
    enable: False
  additional-platforms:
    - linux-aarch64
    - osx-arm64
