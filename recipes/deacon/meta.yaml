{% set name = "deacon" %}
{% set version = "0.16.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/bede/{{ name }}/archive/{{ version }}.tar.gz
  sha256: f68ff794b7bbf4262e6e032b71eae4bb85a38fe38f73889c25fe08484bb1b181

build:
  number: 0
  script:
    # The default config.toml has target-cpu=native,
    # but we don't want that for portable CI builds.
    # Instead, use x86-64-v3 for x64, apple-m14 (=M1) for macos,
    # and the default otherwise.
    - mv .cargo/config-portable.toml .cargo/config.toml
    - cargo install --no-track --locked --verbose --root "${PREFIX}" --path .
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - openssl

test:
  commands:
    - deacon index build --help
    - deacon filter --help

about:
  home: "https://github.com/bede/deacon"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Fast alignment-free sequence filter."
  dev_url: "https://github.com/bede/deacon"
  doc_url: "https://github.com/bede/deacon/blob/{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - bede
  identifiers:
    - doi:10.1101/2025.06.09.658732
    - doi:10.1101/2025.01.27.634998
