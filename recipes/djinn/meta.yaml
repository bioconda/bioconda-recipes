{% set name = "djinn" %}
{% set version = "3.0" %}
{% set sha256 = "f874a934ba37162e874a852b18afa9dc1ae86e5755126bcaa02be0019f705a4b" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/blinkseq/djinn/releases/download/{{ version }}/djinn.{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  # Undefined symbols for architecture arm64:
  # "_SecTrustCopyCertificateChain", referenced from:
  # _crypto/x509/internal/macos.x509_SecTrustCopyCertificateChain_trampoline.abi0 in go.o
  # ld: symbol(s) not found for architecture arm64
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script:
    - mkdir -p $PREFIX/bin
    - go build -ldflags "-X github.com/blinkseq/djinn/cmd.VERSION=${PKG_VERSION} -s -w" -o $PREFIX/bin/djinn

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('go-nocgo') }}
    - go-licenses

test:
  commands:
    - "djinn --version"

about:
  home: "https://github.com/blinkseq/djinn"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "Manipulate linked-read FASTQ and SAM/BAM data, along with other tools."
  description: |
    Djinn lets you convert linked reads to a standard format, convert between platform-specific
    FASTQ formats, barcode styles, etc. It also provides a convenient method to upload linked-read
    data to NCBI that preserves barcode information, sort by barcode, and several other linked-read specific tools.
  doc_url: "https://blinkseq.github.io/djinn"
  dev_url: "https://github.com/blinkseq/djinn"

extra:
  recipe-maintainers:
    - pdimens
