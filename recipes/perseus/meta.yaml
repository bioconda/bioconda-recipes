{% set name = "Perseus" %}
{% set version = "1.3.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://github.com/matnguyen/Perseus/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 7c22ca05d04aa2bf013a8978da8b1c814d0239fcb5731344bd28ac1879bbfae7

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}
  script: |
    {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10,<3.13
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.10,<3.13
    - numpy
    - pandas
    - pytorch
    - scikit-learn
    - ete3
    - pyarrow
    - alive-progress

test:
  commands:
    - perseus -h

about:
  home: https://github.com/matnguyen/Perseus
  summary: "Perseus: Lineage-aware Kraken2 refinement for long-read metagenomics"
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - matnguyen
