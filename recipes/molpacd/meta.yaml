{% set name = "molpacd" %}
{% set version = "0.3.0" %}
{% set sha256 = "82408e123905790d3630f93040e66dcfa6210eaadcf2be3adc718354bd3af081" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.9
    - biopython >=1.80
    - numpy >=1.21,<2.5

test:
  imports:
    - molpacd
  commands:
    - molpacd --help

about:
  home: https://github.com/BlankenbergLab/molpacd
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Molecular Pore Aperture Cap Designer
  description: |
    MolPACD designs, adds, analyzes and removes molecular aperture caps in
    protein structures (PDB and mmCIF), and removes lipids packed inside
    protein cavities.
  dev_url: https://github.com/BlankenbergLab/molpacd

extra:
  recipe-maintainers:
    - jaidevjoshi83
