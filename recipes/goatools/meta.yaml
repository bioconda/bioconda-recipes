{% set name = "goatools" %}
{% set version = "1.6.9" %}
{% set sha256 = "8f1c3511cecef1bd53d401e0635e22a3f5c80e33102dbbfeb0346fd9dc10313a" %}

package:
  name: {{ name|lower }}
  version: '{{version}}'

source:
  url: https://pypi.io/packages/source/g/goatools/goatools-{{version}}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 2
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - python
    - pip
  run:
    - python
    - numpy
    - scipy
    - pandas
    - statsmodels
    - xlsxwriter
    - openpyxl
    - rich
    - ftpretty
    - setuptools
    - pydot
    - requests

test:
  commands:
    - find_enrichment.py -h
    - map_to_slim.py -h
    - plot_go_term.py -h
  imports:
    - goatools
    - goatools.obo_parser
    - goatools.go_enrichment
    - goatools.associations

about:
  home: https://github.com/tanghaibao/goatools
  summary: "Python scripts to find enrichment of GO terms"
  license: BSD-2-Clause
  license_family: BSD

extra:
  identifiers:
    - doi:10.5281/zenodo.31628
