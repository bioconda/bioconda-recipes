{% set name = "proteomiqon-peptidespectrummatching" %}
{% set version = "0.1.0" %}
{% set sha256 = "3fb8bd93a6c6d4dd00bedfd035dd6eb0117f713f24980086b1446b1bb4d67a20" %}

package:
  name: '{{ name }}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.PeptideSpectrumMatching/{{version}}
  sha256: '{{sha256}}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-peptidespectrummatching"
    - test -f "$PREFIX/lib/dotnet/tools/PeptideSpectrumMatching/ProteomIQon.PeptideSpectrumMatching.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-peptidespectrummatching"
    - grep -q "PeptideSpectrumMatching/ProteomIQon.PeptideSpectrumMatching.dll" "$PREFIX/bin/proteomiqon-peptidespectrummatching"

about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: "Identifies peptides by matching MS/MS spectra against a peptide database."
  description: |
    PeptideSpectrumMatching identifies the peptides behind the MS/MS spectra of a run.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/peptide-spectrum-matching/
