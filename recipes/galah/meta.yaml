{% set version = "0.7.0" %}
{% set name = "galah" %}
{% set sha256 = "595006a2a2796c4dd183245962ce89343d99f46ef80699972890583463ed2c01" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/wwood/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - pkg-config
  run:
    - skani >=0.4.0
    - fastani >=1.34
    - barrnap >=0.9
    - trnascan-se >=2.0.12
    #- isiteuk  # [osx and x86_64]
    - checkm2 >=1.1.0
    - pixi

test:
  commands:
    - {{ name }} --version | grep '{{ version }}'

about:
  home: "https://github.com/wwood/galah"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file:
    - LICENCE.txt
    - THIRDPARTY.yml
  summary: "Galah aims to be a more scalable metagenome assembled genome (MAG) dereplication method."
  dev_url: "https://github.com/wwood/galah"
  doc_url: "https://wwood.github.io/galah"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
