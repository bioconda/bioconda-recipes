{% set name = "percolator" %}
{% set version = "3.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/percolator/percolator/archive/refs/tags/rel-3-09-01.tar.gz
  sha256: 149bf2776c6c944a221bffd0eba352a70e5c97eda7a06d34973f1ee3d8e5f133

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('percolator', max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
    - git  # CMake downloads Eigen during the configure step
  host:
    - libboost-devel
    - llvm-openmp  # [osx]
  run:
    - llvm-openmp  # [osx]

test:
  commands:
    - percolator "${PREFIX}/testdata/percolatorTab" > /dev/null
    - test -x "${PREFIX}/bin/qvality"

about:
  home: "https://github.com/percolator/percolator"
  license: Apache-2.0
  license_family: APACHE
  license_file: "license.txt"
  summary: "Semi-supervised learning for peptide identification from shotgun proteomics datasets."
  dev_url: "https://github.com/percolator/percolator"
  doc_url: "http://percolator.ms"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:Percolator
    - doi:10.1007/s13361-016-1460-7
    - usegalaxy-eu:percolator
