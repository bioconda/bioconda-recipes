{% set version = "1.1.49" %}

package:
  name: "treeswift"
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/treeswift/treeswift-{{ version }}.tar.gz
  sha256: 7d9bd3a308a3728d0bd0713c99be769e3f88f1aac0503c751a6b760dc0ff4cee

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage('treeswift', max_pin="x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python

test:
  imports:
    - treeswift

about:
  home: "https://github.com/niemasd/TreeSwift"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "TreeSwift: Fast tree module for Python 2 and 3"
  dev_url: "https://github.com/niemasd/TreeSwift"
