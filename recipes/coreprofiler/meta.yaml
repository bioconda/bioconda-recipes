{% set version = "2.1.0" %}
{% set sha256 = "d310931afc80af12fff5e1bb538849bc5d65f18209424880a5719f3d8489867e" %}

package:
  name: coreprofiler
  version: {{ version }}

source:
  url: https://gitlab.com/ifb-elixirfr/abromics/coreprofiler/-/archive/{{ version }}/coreprofiler-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  entry_points:
    - coreprofiler = coreprofiler.__main__:main
  run_exports:
    - {{ pin_subpackage('coreprofiler', max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools-scm
    - poetry-core
  run:
    - python >=3.11
    - pandas >=2.3.3
    - biopython >=1.81.0,<2.0
    - requests >=2.32.0,<3.0.0
    - bio
    - bs4 >=0.0.2,<0.1
    - blast >= 2.10
    - packaging >=24.0,<27.0
    - rauth >=0.7.3,<0.8.0

test:
  commands:
    - coreprofiler --version

about:
  home: "https://gitlab.com/ifb-elixirfr/abromics/coreprofiler"
  dev_url: "https://gitlab.com/ifb-elixirfr/abromics/coreprofiler"
  doc_url: "https://coreprofiler.readthedocs.io/"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "CoreProfiler, an integrable cgMLST tool for local allele calling and new alleles detection."

extra:
  recipe-maintainers:
    - bebatut
    - clsiguret
    - hugolefeuvre
