{% set name = "argo" %}
{% set version = "0.2.2" %}

package:
  name: '{{ name|lower }}'
  version: '{{ version }}'

source:
  url: https://github.com/xinehc/argo/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 0e90fc989bb5b6011f810e8eae2c8187161be40ef889284bcd99f6eb3196d7e6

build:
  noarch: python
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv'
  run_exports:
    - {{ pin_subpackage('argo', max_pin='x.x') }}

requirements:
  host:
    - pip
    - setuptools
    - python >=3.7
  run:
    - python >=3.7
    - diamond >=2.1.11
    - melon >=0.3.0
    - scikit-learn

test:
    imports:
      - argo
    commands:
      - argo -h

about:
  home: https://github.com/xinehc/argo
  license: MIT
  license_family: MIT
  summary: 'Argo: species-resolved profiling of antibiotic resistance genes in complex metagenomes through long-read overlapping'

extra:
  recipe-maintainers:
    - xinehc
