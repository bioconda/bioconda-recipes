{% set name = "argo" %}
{% set version = "0.2.3" %}

package:
  name: '{{ name|lower }}'
  version: '{{ version }}'

source:
  url: https://github.com/xinehc/argo/archive/refs/tags/v{{ version }}.tar.gz
  sha256: b191011c4c3a7c3fcf83dfb935ce208251065dcc843055fba0f34176c1201ef1

build:
  noarch: python
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv'
  run_exports:
    - {{ pin_subpackage('argo', max_pin='x.x') }}

requirements:
  host:
    - pip
    - setuptools
    - python >=3.7
  run:
    - python >=3.7
    - diamond >=2.1.11
    - melon >=0.3.0
    - scikit-learn

test:
    imports:
      - argo
    commands:
      - argo -h

about:
  home: https://github.com/xinehc/argo
  license: MIT
  license_family: MIT
  summary: 'Argo: species-resolved profiling of antibiotic resistance genes in complex metagenomes through long-read overlapping'

extra:
  recipe-maintainers:
    - xinehc
