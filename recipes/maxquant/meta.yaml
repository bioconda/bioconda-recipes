{% set version = "2.4.9.0" %}
{% set sha256 = "b82e502f07c8babac759f05f4033efb92a0dad65b7d26d3667806f67d3e63401" %}

package:
  name: maxquant
  version: '{{ version }}'

source:
  # link from https://drive.google.com/drive/folders/1Ja9iaCQ6mM66VQEeaS36hqq77bnsmxQF
  # deposited at cargo port https://github.com/galaxyproject/cargo-port/pull/172
  url: https://depot.galaxyproject.org/software/maxquant/maxquant_{{ version }}_src_all.zip
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  script:
    - cp -r * $PREFIX
    - cp $RECIPE_DIR/maxquant $PREFIX/bin/maxquant
    - chmod +x $PREFIX/bin/maxquant
    - chmod +x $PREFIX/bin/MaxQuantCmd.exe
    - chmod +x $PREFIX/bin/MaxQuantGui.exe
    - chmod +x $RECIPE_DIR/xmlcombine.py
    - $RECIPE_DIR/xmlcombine.py $PREFIX/bin/conf/modifications.xml $RECIPE_DIR/mod_*.xml > $PREFIX/bin/conf/modifications_temp.xml
    - mv $PREFIX/bin/conf/modifications_temp.xml $PREFIX/bin/conf/modifications.xml
  run_exports:
    - {{ pin_subpackage('maxquant', max_pin="x.x") }}

requirements:
  host:
    - python >=3.6
  run:
    - dotnet-runtime >=3.1

test:
  commands:
    - maxquant --version 2>&1 > /dev/null | grep {{ version }}

about:
  home: http://www.coxdocs.org/doku.php?id=maxquant:start
  license: http://www.coxdocs.org/lib/exe/fetch.php?media=license_agreement.pdf
  summary: Quantitative proteomics software for analyzing large mass-spectrometric data sets. License restricted.
  description: |
    MaxQuant is a quantitative proteomics software package designed for analyzing large mass-spectrometric data sets. License restricted.

extra:
  identifiers:
    - biotools:MaxQuant
    - biotools:maxquant
    - doi:10.1038/s41592-018-0018-y
    - usegalaxy-eu:maxquant
