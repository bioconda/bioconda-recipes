{% set name = "OpenMS" %}
{% set version = "3.6.0" %}  # if ends with 'dev' it is considered a development release and pulled from GitHub

package:
  name: {{ name|lower  }}-meta
  version: {{ version  }}

{% if 'dev' in version %}
source:
  git_url: https://github.com/OpenMS/OpenMS.git
  # We do not release dev versions, so build from develop
  # Note: This will only work correctly as long as the current X.Y.Zdev version is actually the latest
  # Retrospective builds not supported.
  git_rev: develop
  git_depth: 1
  md5: unused
{% else %}
source:
  # PLEASE never use abbreviated versions anymore!
  # Since 3.6.0 releases are tagged v<version> (before: release/<version>); the release/3.6.0 URL is a 404.
  # The 3.6.0 tarball has no top-level folder and contains empty build/, .git/, THIRDPARTY/ and vcpkg/ directories.
  url: https://github.com/OpenMS/OpenMS/releases/download/v{{ version }}/OpenMS-{{ version }}.tar.gz
  sha256: 70c7f7afff938634b5e87a7c9f71856a4469ae0e45d66dd50655460dbf6d6535
  patches:
    # 3.6.0 resolves share/OpenMS from the compiled-in install path first. conda's binary prefix
    # replacement pads that string with NULs, which the compiler-folded length keeps in the path.
    - 0001-File-take-install-path-lengths-at-run-time.patch
    # bind_format.cpp includes OpenMS/FORMAT/BrukerTimsFile.h unconditionally, but libopenms (built with
    # WITH_OPENTIMS=OFF) does not install that header; the bindings that use it are already guarded.
    - 0001-bind_format-include-BrukerTimsFile.h-only-with-WITH_OPENTIMS.patch
{% endif %}

build:
  number: 0
  overlinking_ignore_patterns: "*"
  # Linking is checked in the outputs not meta recipe

# Try this when building with GUI
#extra:
#  container:
#    extended-base: True

# The top-level requirements must not contain python: conda-build then runs build.sh (the C++
# build) once, and only the pyopenms output is built once per Python version from the same work
# directory. With python here, the whole C++ build would run again for every Python version.
requirements:

    build:
      - {{ compiler('cxx') }}
      - {{ stdlib('c') }}
      - cmake >=3.24
      - ninja

    # Note: pinning of sysroot_linux-64 =2.17 enforces cos7 and is currently needed to prevent an memcpy@GLIBC2.14 error
    host:
      - bzip2
      - coin-or-utils
      - coin-or-clp
      - coin-or-cgl
      - coin-or-cbc
      - eigen >=3.4.0
      # Arrow/Parquet are required since 3.6.0 (>= 23). Pinned to one major to keep a single build variant;
      # the conda-forge-pinning that bioconda uses only lists libarrow 19-22.
      - libarrow =23=*_cpu
      - libparquet =23
      - libboost-devel  # only the header-only part of Boost is used since 3.6.0; libboost-headers would suffice
      - libcurl
      - libsvm
      - libzip
      - xerces-c
      - zlib
      - zstd
      - libgomp  # [linux]
      - sysroot_linux-64 =2.17  # [linux]
      - llvm-openmp  # [osx]

test:
  commands:
    - echo "Tests are in subpackages"

outputs:
  - name: libopenms
    version: {{ version }}
    script: package_libopenms.sh
    requirements:
        # No actual build is done. CMake is used to install different parts of the existing build
        #  from the main "package"
        # But since the other packages depend on its run_exports we want to make
        #  sure that the versions of the dependencies used are the same as above. So list them
        #  again. Also we want the compiler jinja func to have the run dependencies such that
        #  dso linker checks dont complain
        build:
          - {{ compiler('cxx') }}
          - {{ stdlib('c') }}
          - cmake
        host:
          - bzip2
          - coin-or-utils
          - coin-or-clp
          - coin-or-cgl
          - coin-or-cbc
          - eigen >=3.4.0
          # libOpenMS links these (privately); list them so that their run_exports become run
          # dependencies of libopenms itself (3.5.0's libopenms lacked libarrow/libparquet).
          - libarrow =23=*_cpu
          - libparquet =23
          - libboost-devel
          - libcurl
          - libsvm
          - libzip
          - xerces-c
          - zlib
          - zstd
          - libgomp  # [linux]
          - sysroot_linux-64 =2.17  # [linux]
          - llvm-openmp  # [osx]
        # Run dependencies are fully managed by run_exports of our host deps

    build:
      run_exports:
          # We only need to export things that we expose in our library! Since 3.6.0, Xerces-C, libsvm, Eigen,
          # CURL and nlohmann_json are private dependencies of libOpenMS and Qt is not used without the GUI.
          # Consumers only need the Boost headers (find_dependency(Boost) in OpenMSConfig.cmake).
          - libopenms {{ version }}
      # Looks like we are only using header-only part of boost in libOpenMS
      ignore_run_exports_from:
          - libboost-devel

    test:
      commands:
        - command -v readelf >/dev/null 2>&1 && readelf -d ${PREFIX}/lib/libOpenMS.so | grep 'R.*PATH' || echo "Mulled container.. skip tests" # [linux]
        - command -v otool >/dev/null 2>&1 && otool -L ${PREFIX}/lib/libOpenMS.dylib || echo "Mulled container.. skip tests"  # [osx]
        - test -f ${PREFIX}/share/OpenMS/TOOLS/OpenMS.tsv
        - test -f ${PREFIX}/lib/cmake/OpenMS/OpenMSConfig.cmake

    about:
      home: "https://github.com/OpenMS/OpenMS"
      license: "BSD-3-Clause"
      license_family: BSD
      license_file: LICENSE
      summary: "Libraries and headers for developing with OpenMS. They are also a dependency of pyopenms and openms (tools)."
      dev_url: "https://github.com/OpenMS/OpenMS"
      doc_url: "https://openms.readthedocs.io/en/latest/index.html"

  - name: openms
    version: {{ version }}
    script: package_openms-tools.sh
    requirements:
      # no actual build is done. CMake is used to install different parts of the existing build
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake
      host:
        - {{ pin_subpackage('libopenms', exact=True) }}
        # Since 3.6.0 the TOPP tools link only libOpenMS_CLI/libOpenMS (OpenMS#10247). Arrow/Parquet stay here so
        # their run_exports pin the same versions as libopenms. No pin_compatible() for them: it multiplied the
        # build by the four libarrow variants of the global pinning (4 builds of openms 3.5.0 per platform).
        # "23.* *_cpu", not "=23=*_cpu": with a build string, conda reads "=23" as "==23" (23.0.0 only);
        # merged with libopenms' run dependency libarrow >=23.0.1,<23.1.0a0 that is unsatisfiable.
        - libarrow 23.* *_cpu
        - libparquet =23
      run:
        # conda does not support run_exports from outputs in other outputs of the same package yet,
        # otherwise having libopenms in host would be enough.
        # see https://github.com/conda/conda-build/issues/3478
        - {{ pin_subpackage('libopenms', exact=True) }}

    test:
      commands:
        - command -v readelf >/dev/null 2>&1 && readelf -d ${PREFIX}/bin/OpenMSInfo | grep 'R.*PATH' || echo "Mulled container.. skip tests" # [linux]
        - command -v otool >/dev/null 2>&1 && otool -L ${PREFIX}/bin/OpenMSInfo || echo "Mulled container.. skip tests"  # [osx]
        - OPENMS_DATA_PATH=${PREFIX}/share/OpenMS/ ${PREFIX}/bin/OpenMSInfo
        - OPENMS_DATA_PATH=${PREFIX}/share/OpenMS/ ${PREFIX}/bin/FileMerger --help
        # Reads share/OpenMS/CHEMISTRY (unimod.xml, PSI-MOD.obo, Enzymes.xml) the way the tools resolve it
        # (without OPENMS_DATA_PATH, which 3.6.0 consults last); fails if the data path is broken.
        - ${PREFIX}/bin/OpenMSDatabasesInfo -enzymes_out /tmp/openms_enzymes.tsv -mods_out /tmp/openms_mods.tsv
        - test "$(wc -l < /tmp/openms_mods.tsv)" -gt 100
        # development files of the TOPP tool framework layer (see package_openms-tools.sh)
        - test -f ${PREFIX}/include/OpenMS/APPLICATIONS/TOPPBase.h
        - test -f ${PREFIX}/lib/cmake/OpenMS/OpenMSCLITargets.cmake

    about:
      home: "https://github.com/OpenMS/OpenMS"
      license: "BSD-3-Clause"
      license_family: BSD
      license_file: LICENSE
      summary: "The OpenMS TOPP tools (without GUI components and adapted thirdparty tools) and the TOPP tool framework library OpenMS_CLI with its headers, for developing own tools."
      dev_url: "https://github.com/OpenMS/OpenMS"
      doc_url: "https://openms.readthedocs.io/en/latest/index.html"

  - name: openms-thirdparty
    version: {{ version }}
    build:
     # Dependencies bumbershoot, fido, percolator are not available for osx.
     skip: True  # [osx]

    requirements:
     run:
       - {{ pin_subpackage('openms', exact=True) }}
       - comet-ms ==2024011
       - luciphor2 ==2020_04_03
       - msgf_plus ==2024.03.26
       # 3.7.1 exists only for xerces-c 3.2 (<3.3), libopenms 3.6.0 needs xerces-c 3.3; 3.9 does not use xerces-c
       - percolator ==3.9
       - sirius-ms >=6.1.0
       - thermorawfileparser ==1.4.3
       - sage-proteomics ==0.14.7
       - gnuplot
       - r-gplots

    test:
      # Test copied from openms output to make sure a test environment for this output is created.
      commands:
        - OPENMS_DATA_PATH=${PREFIX}/share/OpenMS/ ${PREFIX}/bin/OpenMSInfo

    about:
      home: "https://github.com/OpenMS/OpenMS"
      license: "BSD-3-Clause"
      license_family: BSD
      license_file: LICENSE
      summary: "A helper package to install OpenMS TOPP tools with all their compatible and conda-available versions of adapted thirdparty tools."
      dev_url: "https://github.com/OpenMS/OpenMS"
      doc_url: "https://openms.readthedocs.io/en/latest/index.html"

  # pyopenms 3.5.0 and earlier came from a recipe of their own, which pinned libopenms to the same
  # version and so could only be built after this recipe's packages were published.
  - name: pyopenms
    version: {{ version }}
    script: package_pyopenms.sh
    build:
      # pyOpenMS requires Python >= 3.11 (requires-python in src/pyOpenMS/pyproject.toml,
      # find_package(Python 3.11 REQUIRED) in src/pyOpenMS/CMakeLists.txt; OpenMS/OpenMS#10119).
      # linux-aarch64 is skipped as in the former pyopenms recipe: pyopenms 3.5.0 is a heavy build
      # that repeatedly tripped CircleCI arm.large infrastructure_fail (not a recipe issue; it builds
      # fine locally within the runner's memory and time budget). The nanobind build of 3.6.0 may be
      # lighter; re-enable after a trial build.
      skip: true  # [py < 311 or aarch64]
      run_exports:
        - {{ pin_subpackage('pyopenms', max_pin="x") }}
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - ninja
        - cmake >=3.24
      host:
        - python
        # Since 3.6.0 the bindings are nanobind (no Cython/autowrap). CMake takes nanobind from this
        # interpreter (python -m nanobind --cmake_dir); without it, it git-clones nanobind v3.1.0 and
        # builds without type stubs. nanobind.stubgen generates the .pyi stubs during the build.
        - nanobind >=3.1,<4
        - numpy >=2.0
        # The stub generation imports the freshly built package during the build.
        - pandas >=3
        - matplotlib-base
        - {{ pin_subpackage('libopenms', exact=True) }}
        # _arrow_zerocopy links Arrow directly; same major as libopenms ("23.* *_cpu", see the openms output)
        - libarrow 23.* *_cpu
        # find_package(OpenMS) needs the Boost headers (find_dependency(Boost) in OpenMSConfig.cmake)
        - libboost-headers
        # pyOpenMS itself: find_package(Eigen3 REQUIRED); header-only, so no run dependency.
        # (Since 3.6.0 find_package(OpenMS) no longer looks for Eigen, see OpenMS#10169.)
        - eigen >=3.4.0
      run:
        - python
        # Not taken from libopenms' run_exports, see the openms output (conda-build#3478).
        - {{ pin_subpackage('libopenms', exact=True) }}
        - numpy >=2.0
        - pandas >=3
        - matplotlib-base >=3.5

    test:
      imports:
        - pyopenms
      commands:
        # __version__ comes from the dist-info (importlib.metadata); "0+unknown" means it is missing
        - python -c "import pyopenms as oms; assert oms.__version__ == '{{ version }}', oms.__version__; print(oms.__version__)"
        # needs share/OpenMS/CHEMISTRY/unimod.xml, i.e. a working data path of the installed libopenms
        - python -c "import pyopenms as oms; n = oms.ModificationsDB().getNumberOfModifications(); assert n > 100, n; print(n)"
        # TODO run the full test suite?

    about:
      home: "https://github.com/OpenMS/OpenMS"
      license: "BSD-3-Clause"
      license_family: BSD
      license_file: LICENSE
      summary: "Python bindings for OpenMS, an open-source software C++ library for LC-MS data management and analyses."
      dev_url: "https://github.com/OpenMS/OpenMS"
      doc_url: "https://openms.readthedocs.io/en/latest"

about:
  home: "https://github.com/OpenMS/OpenMS"
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  summary: "OpenMS is an open-source software C++ library for LC-MS data management and analyses. The openms-meta package should not be installed. Please use one of its outputs libopenms, openms (=tools), openms-thirdparty or pyopenms."
  dev_url: "https://github.com/OpenMS/OpenMS"
  doc_url: "https://openms.readthedocs.io/en/latest/index.html"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - build_number_needs_reset  # our linter has some issues with multi-package recipes as it seems
    - missing_run_exports  # linter seems expect run_export keyword for meta-package in multi-package
    # bioconda-utils >=5.0.0 lints per output. The openms-thirdparty output has no
    # compiler, only run deps, so the linter wants it noarch. It cannot be: it
    # pins the arch-specific openms build exactly and is skipped on osx.
    - should_be_noarch_generic
    {% if 'dev' in version %}
    - uses_vcs_url
    {% endif %}
  identifiers:
    - biotools:openms
    - usegalaxy-eu:openms_fileconverter
    - doi:10.1038/s41592-024-02197-7
