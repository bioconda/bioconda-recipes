# OpenMS 3.6.0 uses floating-point std::to_chars (C++17/23 <charconv>) and, in place of Qt,
# std::filesystem. libc++ (also conda-forge's libcxx-headers) marks them unavailable below
# macOS 13.3 and 10.15 respectively; bioconda targets 11.0 (osx-arm64) and 10.13 (osx-64).
# See https://conda-forge.org/docs/maintainer/knowledge_base#newer-c-features-with-old-sdk
# The pyopenms output needs the same floor: it compiles against the libOpenMS headers, which use
# std::filesystem inline (PathUtils.h, File.h).
c_stdlib_version:           # [osx]
  - 13.3                    # [osx]
MACOSX_DEPLOYMENT_TARGET:   # [osx]
  - 13.3                    # [osx]
