# OpenMS 3.6.0 uses floating-point std::to_chars (C++17/23 <charconv>) and, in place of Qt,
# std::filesystem. libc++ 19 headers mark them unavailable below macOS 13.4 and 10.15
# respectively; bioconda targets 11.0 (osx-arm64) and 10.13 (osx-64). conda-forge has no
# 13.4 deployment target, so use 14.0.
# See https://conda-forge.org/docs/maintainer/knowledge_base#newer-c-features-with-old-sdk
c_stdlib_version:           # [osx]
  - 14.0                    # [osx]
MACOSX_DEPLOYMENT_TARGET:   # [osx]
  - 14.0                    # [osx]
