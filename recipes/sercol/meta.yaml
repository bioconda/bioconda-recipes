{% set name = "sercol" %}
{% set version = "1.2.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: c0e8258c343c6b008589e4b71bf1f1049a664a8b0d11e61a198ef2f73b798d4e

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - {{ pin_subpackage('sercol', max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.9
    - setuptools >=64
  run:
    - pandas >=2.0.0,<3
    - python >=3.9
    - serializable >=1.0.0,<2

test:
  imports:
    - sercol

about:
  home: "https://github.com/openvax/sercol"
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: "Rich collection class with grouping and filtering helpers"

extra:
  recipe-maintainers:
    - jonasscheid
