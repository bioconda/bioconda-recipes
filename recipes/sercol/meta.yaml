{% set name = "sercol" %}
{% set version = "1.0.2" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: d564332c2b40ec04a8cf72f28d4c5c049dae42016415c0ef7c4a841bf4e2cfbd

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - {{ pin_subpackage('sercol', max_pin="x") }}

requirements:
  host:
    - pip
    - python
  run:
    - pandas
    - python
    - serializable
    - simplejson

test:
  imports:
    - sercol

about:
  home: "https://github.com/openvax/sercol"
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: "Rich collection class with grouping and filtering helpers"

extra:
  recipe-maintainers:
    - jonasscheid
