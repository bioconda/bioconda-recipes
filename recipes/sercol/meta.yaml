{% set name = "sercol" %}
{% set version = "1.0.8" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 2f54383b844a8a51d4a65ec3807768c9fbe0aaae38394f9e97b568239d120625

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - {{ pin_subpackage('sercol', max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.9
    - setuptools >=64
  run:
    - pandas >=2.0.0,<3
    - python >=3.9
    - serializable >=1.0.0,<2

test:
  imports:
    - sercol

about:
  home: "https://github.com/openvax/sercol"
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: "Rich collection class with grouping and filtering helpers"

extra:
  recipe-maintainers:
    - jonasscheid
