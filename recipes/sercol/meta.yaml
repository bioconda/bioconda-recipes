{% set name = "sercol" %}
{% set version = "1.0.10" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 3eda28e4a3f56b53853e406bcc495b7f953ab0e1fa30243de28ca6ef306235b6

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - {{ pin_subpackage('sercol', max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.9
    - setuptools >=64
  run:
    - pandas >=2.0.0,<3
    - python >=3.9
    - serializable >=1.0.0,<2

test:
  imports:
    - sercol

about:
  home: "https://github.com/openvax/sercol"
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: "Rich collection class with grouping and filtering helpers"

extra:
  recipe-maintainers:
    - jonasscheid
