{% set name = "disassembler" %}
{% set version = "0.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/nekrut/disassembler/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 8be464163a939c1a01e9d0399e72af63c0b583397945596b6d6b1c332d61c3a0

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - disassembler = disassembler.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=68
  run:
    - python >=3.11
    # The only modules the package imports: biopython in cmd/msa.py, requests in
    # cmd/harvest.py. zstandard, numpy and pandas were listed here through 0.1.0 and are
    # imported nowhere; numpy and pandas belong to the repo's benchmark scripts, which are
    # not shipped.
    - biopython
    - requests
    # Binaries the subcommands shell out to. The walker floor is 0.1.1 because the fixes
    # that version makes to the walk (the prune coverage rule's tolerance, the rewritten
    # under-determined guard) are what the 0.1.1 pipeline is validated against. The sieve is
    # still 0.1.0: only its build changed.
    - logan-walker >=0.1.1,<0.2
    - kmer-diversity-sieve >=0.1.0,<0.2
    # cmd/msa.py runs `mafft --keeplength --addfragments`; 7.526 is the pinned version in
    # the repo's environment.yml and the one every published result was produced with.
    - mafft >=7.526
    - fasttree

test:
  imports:
    - disassembler
    - disassembler.cli
  commands:
    - disassembler --version | grep -q "disassembler {{ version }}"
    - disassembler --help
    # The walker and sieve subcommands resolve their binaries from PATH.
    - disassembler walker --version | grep -q "logan-walker"
    - l1_pipeline_serial 2>&1 | grep -q -- "--input required"

about:
  home: https://github.com/nekrut/disassembler
  summary: Reconstruct coding haplotypes of a target gene from planetary sequence indexes (Logan, kmindex, LexicMap).
  description: |
    Reconstructs in-frame coding haplotypes across many SRA runs from the Logan assemblies.
    The kmindex route harvests candidate accessions from a kmindex query, stratifies them by
    score and walks each accession's unitig graph with logan-walker. The LexicMap route tiles
    LexicMap hits against Logan contigs into a codon-checked cohort. Both routes can thin
    near-duplicates with kmer-diversity-sieve and end in a reference-guided codon alignment
    (MAFFT) and a FastTree phylogeny.
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - NOTICE
  dev_url: https://github.com/nekrut/disassembler

extra:
  recipe-maintainers:
    - as042
