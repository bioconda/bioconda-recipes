{% set name = "proteomiqon-labelfreeproteinquantification" %}
{% set version = "0.1.0" %}
{% set sha256 = "b3fbd40d9eaf866f4440232bb87d394836a16f95f99a48d3188c84c005708562" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.LabelFreeProteinQuantification/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-labelfreeproteinquantification"
    - test -f "$PREFIX/lib/dotnet/tools/LabelFreeProteinQuantification/ProteomIQon.LabelFreeProteinQuantification.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-labelfreeproteinquantification"
    - grep -q "LabelFreeProteinQuantification/ProteomIQon.LabelFreeProteinQuantification.dll" "$PREFIX/bin/proteomiqon-labelfreeproteinquantification"


about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  description: |
    After JoinQuantPepIonsWithProteins every quantified peptide ion carries its protein group. LabelFreeProteinQuantification turns these ion intensities into one intensity per protein group and run.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/label-free-protein-quantification/
