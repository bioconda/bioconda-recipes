{% set name = "truvari" %}
{% set version = "5.5.0" %}
{% set sha256 = "58aa2dc02de37597ba57ae18a2b32c662157e0e03d65f584a5b75e525a402d50" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/truvari-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
  entry_points:
    - truvari = truvari.__main__:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools
  run:
    - python >=3.12
    - python-edlib >=1.3.9
    - intervaltree >=3.2.1
    - joblib >=1.6.0
    - numpy >=2.5.3
    - rich >=15.0.0
    - pandas >=3.0.5
    - psutil >=7.2.2
    - pyabpoa >=1.5.6
    # upstream pins pyarrow>=25.0.1; conda-forge currently provides up to 25.0.0
    - pyarrow >=25.0.0
    - pysam >=0.24.1
    - pytabix >=0.1
    - pywfa >=0.5.1
    - mafft >=7.515

test:
  imports:
    - truvari
  commands:
    - truvari --help

about:
  home: "https://github.com/ACEnglish/truvari"
  summary: "Structural variant comparison tool for VCFs."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/ACEnglish/truvari"
  doc_url: "https://github.com/acenglish/truvari/wiki"
