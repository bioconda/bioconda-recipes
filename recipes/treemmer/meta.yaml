{% set name = "treemmer" %}
{% set version = "0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/fmenardo/Treemmer/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 3d2f82550954156ab4243b7785b273d71455d3c55109eff54baaac5e00d0bf05

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage('treemmer', max_pin='x.x') }}

requirements:
  host:
    - python >=3.11
  run:
    - python >=3.11
    - biopython
    - matplotlib-base
    - ete3
    - legacy-cgi
    - joblib
    - numpy

test:
  commands:
    - treemmer -h

about:
  home: https://github.com/fmenardo/Treemmer
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: "Python tool to reduce size and redundancy of phylogenetic datasets"
  dev_url: https://github.com/fmenardo/Treemmer

