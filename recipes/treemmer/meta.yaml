{% set name = "treemmer" %}
{% set version = "0.3" %}
 
package:
  name: {{ name|lower }}
  version: {{ version }}
 
source:
  url: https://github.com/fmenardo/Treemmer/releases/download/v{{ version }}/Treemmer_v{{ version }}.py
  sha256: dc244986787e198562bebcc2bce57218bdf196e8f82cfa6129b8f810aff54aa4
 
build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage('treemmer', max_pin='x.x') }}
 
requirements:
  host:
    - python >=3.11
  run:
    - python >=3.11
    - matplotlib-base
    - ete3
    - joblib
    - numpy
 
test:
  commands:
    - treemmer -h

about:
  home: https://github.com/fmenardo/Treemmer
  license: GPL-3.0-or-later
  license_family: GPL3
  summary: "Python tool to reduce size and redundancy of phylogenetic datasets"
  dev_url: https://github.com/fmenardo/Treemmer

extra:
  recipe-maintainers:
    - fmenardo
    - raufs
