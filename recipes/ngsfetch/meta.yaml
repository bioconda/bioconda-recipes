package:
  name: "ngsfetch"
  version: "0.1.2"

source:
  url: "https://files.pythonhosted.org/packages/f3/b7/65a6612773cb505d773d715d0f4bdfe89830c216786797f49b6ee8d3b6a3/ngsfetch-0.1.2.tar.gz"
  sha256: "910b654dca630f57b7a1d780aa0cb3fb0686043edf2a12cb7e203af22c4d80e1"

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage("ngsfetch", max_pin="x.x") }}
  script: $PYTHON -m pip install . --no-deps --ignore-installed -vvv

requirements:
  host:
    - python
    - pip
    - setuptools >=42
    - wheel
  run:
    - python
    - ffq >=0.3.1
    - aria2 >=0.0.1b0

test:
  imports:
    - ngsfetch

about:
  home: "https://github.com/NaotoKubota/ngsfetch"
  license: "MIT"
  license_file: "LICENSE"
  summary: "Fast retrieval of metadata and fastq files with ffq and aria2c"
  description: "Fast retrieval of metadata and fastq files with ffq and aria2c"
  doc_url: "https://github.com/NaotoKubota/ngsfetch"
  dev_url: "https://github.com/NaotoKubota/ngsfetch"

extra:
  recipe-maintainers:
    - NaotoKubota
