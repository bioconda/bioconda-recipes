{% set name = "sigProfilerPlotting" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sigprofilerplotting-{{ version }}.tar.gz
  sha256: 3bfcbb032fd5bb88522798e62c5dbf144bbee0b3c6b494dbee13b100ac7b08d3

build:
  number: 0
  noarch: python
  entry_points:
    - SigProfilerPlotting = sigProfilerPlotting.sigProfilerPlotting_CLI:main_function
    - sigprofilerplotting-web = sigProfilerPlotting.web.launcher:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools-scm >=8
  run:
    - python >=3.9
    - matplotlib-base >=3.4.3
    - pandas >=2.0.0
    - scikit-learn >=1.1.3
    - pillow >=10.0.0
    - plotly >=6.1.1
    - python-kaleido >=1.0.0
    - pypdf >=5.0.0

test:
  imports:
    - sigProfilerPlotting
  commands:
    - SigProfilerPlotting plotSBS --help

about:
  home: "https://github.com/alexandrovlab/SigProfilerPlotting"
  summary: "SigProfiler plotting tool."
  license: "BSD-2-Clause"
  license_family: BSD
  license_file: LICENSE
  dev_url: "https://github.com/alexandrovlab/SigProfilerPlotting"
  doc_url: "https://osf.io/2aj6t/wiki/home"
