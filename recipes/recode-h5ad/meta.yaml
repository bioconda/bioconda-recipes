{% set version = "0.1.1" %}

package:
  name: recode-h5ad
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/r/recode-h5ad/recode_h5ad-{{ version }}.tar.gz
  sha256: 08a1d6d9e71384ac0f83fc2e3cb39813cf2817e065d43c28e587674d7d3d9cc3

build:
  entry_points:
    - recode_h5ad = recode_h5ad.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8
    - setuptools >=61.0
    - anndata >=0.13.0
    - hdf5plugin >=7.0.0
    - argparse
    - numpy
    - scipy
    - pathlib
    - importlib
    - packaging
    - pip
  run:
    - python >=3.8

test:
  imports:
    - recode_h5ad
  commands:
    - pip check
    - recode_h5ad --help
  requires:
    - pip
    - python

about:
  home: https://github.com/GabrielHoffman/recode_h5ad
  summary: Recode H5AD file changing sparsity format and cell sorting
  license: ''
  license_file: PLEASE_ADD_LICENSE_FILE

extra:
  recipe-maintainers:
    - GabrielHoffman
