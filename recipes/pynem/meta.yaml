{% set version = "0.6.1" %}
{% set name = "pynem" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pynem-{{ version }}.tar.gz
  sha256: 4d1232a7a33b2890105d880336590bd7f24102c4f55a05fb13234a4d31cd0128

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - setuptools >=77.0
    - pip
  run:
    - python >=3.9
    - numpy >=1.22
    - scipy >=1.8
    - networkx >=2.8

test:
  imports:
    - pynem
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/cambroise/nem/{{ name|lower }}
  summary: 'Neighborhood EM (NEM): spatial clustering on graphs with a hidden Markov random field'
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - JeanMainguy
