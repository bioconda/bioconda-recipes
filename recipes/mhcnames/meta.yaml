{% set name = "mhcnames" %}
{% set version = "0.4.9" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 70194241c083e4f49c298df961fb02a3a58d721fa26c18aa19d7091fe63a55d1

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv "
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - pip
    - python >=3.11
    - six >=1.9.0
    - setuptools >=64
  run:
    - python >=3.11
    - six >=1.9.0

test:
  imports:
    - mhcnames

about:
  home: https://github.com/hammerlab/mhcnames
  license: Apache-2.0
  summary: Python library for MHC nomenclature parsing
  description: |
    DEPRECATED: mhcnames is no longer maintained. Please use mhcgnomes instead, which provides
    a superset of mhcnames functionality with support for more MHC nomenclature systems.

extra:
  recipe-maintainers:
    - lkuchenb
