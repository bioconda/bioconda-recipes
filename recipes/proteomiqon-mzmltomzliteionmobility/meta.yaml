{% set name = "proteomiqon-mzmltomzliteionmobility" %}
{% set version = "0.1.0" %}
{% set sha256 = "3873ed58aff0f47e444da53347d564abef98e0c8d3a15d8e5df9b0f7a0c551db" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.MzMLToMzLiteIonMobility/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-mzmltomzliteionmobility"
    - test -f "$PREFIX/lib/dotnet/tools/MzMLToMzLiteIonMobility/ProteomIQon.MzMLToMzLiteIonMobility.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-mzmltomzliteionmobility"
    - grep -q "MzMLToMzLiteIonMobility/ProteomIQon.MzMLToMzLiteIonMobility.dll" "$PREFIX/bin/proteomiqon-mzmltomzliteionmobility"


about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  description: |
    MzMLToMzLiteIonMobility converts mzML files from ion mobility instruments such as the Bruker timsTOF into mzlite files.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/mzml-to-mzlite-ion-mobility/
