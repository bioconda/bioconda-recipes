{% set version = "1.7.3" %}

package:
  name: isescan
  version: {{ version }}

source:
  url: https://github.com/xiezhq/ISEScan/archive/refs/tags/v{{ version }}.tar.gz
  sha256: cf3d7f0c272aa3527dd14565e8c7b29b8fed23a3bf880b10eda0fdfee0873fd9
  patches:
    - sse2neon.patch  # [aarch64 or arm64]

build:
  number: 1
  run_exports:
      - {{ pin_subpackage('isescan', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - sse2neon  # [aarch64 or arm64]
  run:
    - python >=3
    - numpy >=1.8
    - scipy >=0.13.1
    - fastcluster
    - fraggenescan >=1.32
    - hmmer >=3.1b2
    - blast >=2.2.31
    - biopython >=1.62

test:
  commands:
    - isescan.py -h

about:
  home: https://github.com/xiezhq/ISEScan
  license: Apache-2.0
  license_family: APACHE
  license_file:
    - LICENSE
    - ssw201507/license.ssw.txt
  summary: 'A python pipeline to identify IS (Insertion Sequence) elements in genomes and metagenomes'

extra:
  additional-platforms:
    - osx-arm64
  identifiers:
    - doi:10.1093/bioinformatics/btx433
