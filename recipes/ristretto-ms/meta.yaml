{% set name = "ristretto-ms" %}
{% set version = "0.3.0" %}
{% set sha256 = "d25a899b0ec0e850a1acd33f7703b89208f3a72d1a9122bd6b0483b955264c4a" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/ristretto_ms-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
  run:
    - python >=3.11
    - numpy >=2.0
    - scikit-learn >=1.5
    - pandas >=2.0

test:
  imports:
    - ristretto

about:
  home: "https://github.com/compomics/ristretto"
  summary: "Lean PSM rescoring for proteomics, purpose-built for ms2rescore"
  dev_url: "https://github.com/compomics/ristretto"
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE

extra:
  recipe-maintainers:
    - CompOmics
    - RalfG
