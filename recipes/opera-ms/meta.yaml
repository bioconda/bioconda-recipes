{% set version = "2.0.0" %}

package:
  name: opera-ms
  version: {{ version }}

source:
  url: https://github.com/CSB5/OPERA-MS/archive/v{{ version }}.tar.gz
  sha256: ac86b0cc8f02d504723902ae9f36ac9dec7111dc215bf34a66ff5d46a5dbd130

build:
  number: 0
  skip: True  # [not linux64]
  run_exports:
    - {{ pin_subpackage('opera-ms', max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  run:
    - megahit >=1.2.9
    - minibwa >=0.7
    - minimap2 >=2.28
    - samtools >=1.24
    - racon >=1.5
    - sylph >=1.0,<2
    - skani >=0.4,<0.5
    - freebayes >=1.3.10
    - polypolish >=0.7
    - curl

test:
  commands:
    - opera-ms --version
    - opera-ms check-dependency

about:
  home: https://github.com/CSB5/OPERA-MS
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Hybrid metagenomic assembler combining short and long reads, with strain-level clustering.
  dev_url: https://github.com/CSB5/OPERA-MS
  doc_url: https://github.com/CSB5/OPERA-MS/blob/v{{ version }}/README.md

extra:
  recipe-maintainers:
    - GITHUB_HANDLE
  identifiers:
    - doi:10.1038/s41587-019-0191-2