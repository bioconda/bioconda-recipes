{% set version = "0.4.3" %}
package:
  name: r-zooroh
  version: {{ version }}

source:
  url:
    - https://cran.r-project.org/src/contrib/RZooRoH_{{ version }}.tar.gz
    - https://cran.r-project.org/src/contrib/Archive/RZooRoH/RZooRoH_{{ version }}.tar.gz
  sha256: a673d61a7c3eeef7789599f8f5f8d39124c049a288907c1cd95aa33f1082c6f3

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - {{ stdlib('c') }}
    - make
  host:
    - r-base
    - r-data.table
    - r-doparallel
    - r-foreach
    - r-iterators
    - r-rcolorbrewer
  run:
    - r-base
    - r-data.table
    - r-doparallel
    - r-foreach
    - r-iterators
    - r-rcolorbrewer

test:
  commands:
    - Rscript --vanilla -e 'stopifnot(is.function(RZooRoH::zookin))'

about:
  home: https://cran.r-project.org/package=RZooRoH
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Partitioning of individual autozygosity into homozygous-by-descent classes

extra:
  recipe-maintainers:
    - yzzzzz7
