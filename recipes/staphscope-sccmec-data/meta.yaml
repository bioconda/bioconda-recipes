{% set name = "staphscope-sccmec-data" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Attach a tarball containing a top-level `sccmec_module_cge/` directory
  url: https://github.com/bbeckley-hub/staphscope-typing-tool/releases/download/v{{ version }}/{{ name }}-v{{ version }}.tar.gz
  
  sha256: d917f88f6aa8df0f05ba6ac470ada307f78d5215d29a0161b27647b294045c9e

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

test:
  commands:
    - test -f $PREFIX/share/staphscope/modules/sccmec_module_cge/run_sccmec_batch.sh
    - test -f $PREFIX/share/staphscope/modules/sccmec_module_cge/SCCmecFinder_v4.py
    - test -f $PREFIX/share/staphscope/modules/sccmec_module_cge/database/mec_database_20171117.fasta

about:
  home: https://github.com/bbeckley-hub/staphscope-typing-tool
  license: MIT
  summary: 'SCCmec typing database and scripts for StaphScope'
  description: |
    Database and helper scripts for the SCCmecFinder CGE module of StaphScope.
    Provides reference FASTA files, k-mer templates, and batch wrappers used
    by the SCCmec typing pipeline.

extra:
  recipe-maintainers:
    - bbeckley-hub
