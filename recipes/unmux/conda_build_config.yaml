# rustc 1.99 crashes in LLVM ("Cannot select: sign_extend") building the x86-64-v4 cargo-multivers slice of libbz2-rs-sys.
rust_compiler_version:
  - 1.98.1
# conda-forge rust_osx-64 >=1.97 requires macosx_deployment_target >=11.0, above the 10.13 osx-64 default.
c_stdlib_version:  # [osx and x86_64]
  - "11.0"         # [osx and x86_64]
