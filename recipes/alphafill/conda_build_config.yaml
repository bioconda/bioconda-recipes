# AlphaFill 2.3.1 defines sequence as std::basic_string<uint8_t> in src/blast.hpp.
# libc++ 19 removed the generic std::char_traits<T> implementation, leaving
# std::char_traits<unsigned char> undefined and causing macOS builds to fail.
# Keep the macOS compilers on 18 as a temporary compatibility workaround.
# Remove these pins once upstream supplies explicit byte character traits or
# replaces the sequence representation with a supported type.
# https://github.com/llvm/llvm-project/blob/llvmorg-19.1.0/libcxx/docs/ReleaseNotes/19.rst
c_compiler_version:            # [osx]
  - 18                         # [osx]
cxx_compiler_version:          # [osx]
  - 18                         # [osx]
clang_compiler_version:        # [osx]
  - 18                         # [osx]
clangxx_compiler_version:      # [osx]
  - 18                         # [osx]
