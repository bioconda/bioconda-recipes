# AlphaFill uses std::basic_string<uint8_t>, whose default char_traits
# implementation was removed in libc++ 19. Keep the macOS toolchain on 18.
c_compiler_version:            # [osx]
  - 18                         # [osx]
cxx_compiler_version:          # [osx]
  - 18                         # [osx]
clang_compiler_version:        # [osx]
  - 18                         # [osx]
clangxx_compiler_version:      # [osx]
  - 18                         # [osx]
