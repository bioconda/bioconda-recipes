{% set name = "bioleads" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/isomlab/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: b13e586d4437b3ffba64bf946dd0d4128907be0c598353c08ba30bb0633e77ec

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
  entry_points:
    - bioleads = bioleads.cli:main
    - bioleads-gui = bioleads.gui:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10
    - numpy >=1.24
    - scipy >=1.10
    - scikit-learn >=1.3
    - networkx >=3.1
    - pandas >=2.0
    - tqdm >=4.65
    - biopython >=1.81
    - requests >=2.31
    - plotly >=5.18
    - pyvis >=0.3.2
    - umap-learn >=0.5

test:
  imports:
    - bioleads
    - bioleads.pipeline
    - bioleads.enrichment
  commands:
    - bioleads --help

about:
  home: https://github.com/isomlab/bioleads
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Mine biomedical literature for enriched terms, co-occurrence networks, and Swanson-style hypothesis leads.
  dev_url: https://github.com/isomlab/bioleads

extra:
  recipe-maintainers:
    - dangerisom
