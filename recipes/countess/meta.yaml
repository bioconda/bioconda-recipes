{% set name = "countess" %}
{% set version = "0.1.21" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5d338212f9f29477ebc1b9a5c78503f52dfb6bd5d3a0efb69d9123d58a39448b

build:
  number: 0
  noarch: python
  entry_points:
    - countess_cmd = countess.core.cmd:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - python-duckdb >=1.5.0,<1.6.0
    - fqfa >=1.3.1,<1.4.0
    - more-itertools >=10.7.0,<10.8.0
    - numpy >=2.2.6,<2.3.0
    - oxbow >=0.5.1,<0.6.0
    - pandas >=2.3.0,<2.4.0
    - patsy >=1.0.2,<1.1.0
    - psutil >=7.0.0,<7.1.0
    - pypeg2 >=2.15.2,<2.16.0
    - pyarrow >=20.0.0,<20.1.0
    - rapidfuzz >=3.13.0,<3.14.0
    - statsmodels >=0.14.6,<0.15.0
    - typing-extensions >=4.14.0,<4.15.0

test:
  imports:
    - countess
    - countess.core
    - countess.plugins
  commands:
    - countess_cmd --help
    - countess_cmd --version

about:
  home: https://github.com/CountESS-Project/CountESS
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: CountESS is a modular Python reimplementation of Enrich2.
  doc_url: https://countess-project.github.io/CountESS/
  dev_url: https://github.com/CountESS-Project/CountESS
