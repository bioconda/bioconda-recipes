{% set name = "chainc" %}
{% set version = "0.0.2" %}

package:
 name: {{ name }}
 version: {{ version }}

source:
 url: https://github.com/hillerlab/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
 sha256: 1e72580cb5be0478cd4dfa4c6725d2f3ef613ab594e374f2a09a171747c3c61f

build:
 number: 0
 run_exports:
   - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler("rust") }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses

test:
 commands:
   - chainc --help
   - chainc --version

about:
 home: "https://github.com/hillerlab/chainc"
 license: "GPL-3.0-only"
 license_family: "GPL"
 license_file:
   - LICENSE
   - THIRDPARTY.yml
 summary: "Remove chain-breaking alignments using chain/net files"
 dev_url: "https://github.com/hillerlab/chainc"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - alejandrogzi
