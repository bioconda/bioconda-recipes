{% set name = "plotnado" %}
{% set version = "0.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/plotnado-{{ version }}.tar.gz
  sha256: d60bd40969992405e4a310d9df373616c85bab3ae5d9c49d74a0151b0891ac9e

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python >=3.12
    - setuptools >=61
    - setuptools-scm >=6.2
    - wheel
  run:
    - python >=3.12
    - cooler
    - loguru
    - matplotlib-base
    - numpy
    - pandas
    - pandera
    - pybigtools
    - pydantic >=2
    - pyranges1
    - tomli-w
    - tqdm
    - typer

test:
  imports:
    - plotnado
  commands:
    - plotnado --help
    - pip check
  requires:
    - pip

about:
  home: https://github.com/alsmith151/plotnado
  summary: Simple genomic track visualization and genome browser-style plotting
  license: GPL-3.0-or-later
  license_file: LICENSE
  doc_url: https://github.com/alsmith151/plotnado
  dev_url: https://github.com/alsmith151/plotnado

extra:
  recipe-maintainers:
    - alsmith151
