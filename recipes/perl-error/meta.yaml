package:
  name: perl-error
  version: "0.17031"

source:
  url: https://cpan.metacpan.org/authors/id/S/SH/SHLOMIF/Error-0.17031.tar.gz
  sha256: 0a85374cf9cbde5a5075f16e62246e5d36abde63ec08c5c5694f128f4546852f

build:
  noarch: generic
  number: 0
  run_exports:
