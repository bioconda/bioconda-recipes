{% set version = "1.4.0" %}

package:
  name: plasrisk
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/p/plasrisk/plasrisk-{{ version }}.tar.gz
  sha256: dc6172ae3cd9d0edd745867a4d9f3db333435f68a713fc201ebee705a747d798

build:
  number: 0
  noarch: python
  entry_points:
    - plasrisk = plasrisk.cli:main
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv"
  run_exports:
    - {{ pin_subpackage('plasrisk', max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=3.8
    - pandas >=1.3
    - numpy >=1.20
    # abricate and blast are recommended but not hard dependencies;
    # the CLI falls back to sequence-only scoring when abricate is absent.
    # Install them with: conda install -c bioconda -c conda-forge abricate blast

test:
  imports:
    - plasrisk
    - plasrisk.scoring
    - plasrisk.annotate
    - plasrisk.lookup
  commands:
    - plasrisk --help
    - plasrisk --version
    - python -c "from plasrisk import PlasRiskScorer, PIPdbScorer, get_scorer; s=get_scorer('plasrisk'); f=get_scorer('plasrisk', mode='full'); o=get_scorer('plasrisk', mode='ordinal'); print('OK')"

about:
  home: https://github.com/LLQ95/PlasRisk
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Data-driven multi-mode risk assessment for bacterial plasmids"
  description: |
    PlasRisk provides three scoring modes for bacterial plasmid risk
    assessment. The default output (--mode lite) is a FASTA-only 5-dimension
    core (S_ARG, S_BMG, S_MOB, S_SIZE, S_VF) with discrimination equivalent
    to the full model. --mode full adds host range (S_HOST), replicon type
    (S_REP), geographic spread (S_GEO), habitat breadth (S_HAB), and
    temporal growth rate (S_GROW). --mode ordinal reproduces the original
    PIPdb 8-item ordinal combined risk index (Zhu et al., Nucleic Acids Res.
    2025). S_ARG can optionally use the WHO AWaRe 2025 category table
    (--aware-version 2025); the legacy mapping used for the frozen component
    matrix remains the default. Weights were derived by data-driven consensus
    (Random Forest MDG, LASSO, grid-search optimization) on 792,964 PIPdb
    plasmid sequence clusters. PlasRisk accepts FASTA input and uses abricate
    for annotation when available; sequence-derived dimensions fall back to
    replicon empirical medians when annotation is unavailable.
  doc_url: https://github.com/LLQ95/PlasRisk#readme
  dev_url: https://github.com/LLQ95/PlasRisk

extra:
  recipe-maintainers:
    - LLQ95
  identifiers:
    - doi:10.1093/nar/gkae952
