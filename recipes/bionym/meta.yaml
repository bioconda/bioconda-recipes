{% set name = "bionym" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d2f31c9c0a364ac25d1759c85df02089bb468f6353403335053c98a810083027

build:
  number: 0
  noarch: python
  entry_points:
    - bionym = bionym.cli:app
  script: {{ PYTHON }} -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10
    - httpx >=0.27
    - typer >=0.12
    - pydantic >=2.6
    - diskcache >=5.6
    - python-dotenv >=1.0

test:
  imports:
    - bionym
  commands:
    - bionym --help
    - bionym version
    - bionym resolve --help
    - bionym ask --help
    - pip check

about:
  home: https://github.com/d-callan/bionym
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Resolve bioinformatics identifiers into confidence-scored knowledge graphs"
  description: |
    BioNym gathers evidence for a gene identifier from public 
    APIs — NCBI, VEuPathDB, OMA, UniProt, KEGG — and asks a 
    typed-question judge (JEV / any POST /v1/systemone-compatible
    backend) an ordered workflow of questions to produce a
    confidence-scored knowledge graph with evidence provenance on 
    every edge. Ships a CLI, a Python library, and a self-contained 
    HTML report (`bionym resolve --report`).
    A FastAPI service and static D3 UI live in the source repo only —
    they are not part of the installed package.
  doc_url: https://github.com/d-callan/bionym#readme
  dev_url: https://github.com/d-callan/bionym

extra:
  recipe-maintainers:
    - d-callan
