{% set version = "1.19.6" %}

package:
  name: nanoget
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/n/nanoget/nanoget-{{ version }}.tar.gz
  sha256: f900c187967af06c491cb92edc017e18b914d1c02e6d0333de2fb9a78738b6fb

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vvv
  run_exports:
    - {{ pin_subpackage('nanoget', max_pin="x") }}

requirements:
  host:
    - python >=3.0
    - pip
    - setuptools
  run:
    - python >=3.0
    - pandas >=2.0.0
    - numpy
    - biopython
    - pysam >0.10.0

test:
  imports:
    - nanoget

about:
  home: https://github.com/wdecoster/nanoget
  license: GPL-3.0-only
  summary: 'Functions to extract information from Oxford Nanopore sequencing data and alignments.'
  license_family: GPL
  license_file: LICENSE
