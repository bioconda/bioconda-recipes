{% set name = "commec" %}
{% set version = "2.1.0" %}
{% set sha256 = "e4657ae7ce1338c473a649a33c993fe81f79afb403a22a639c8b13558e7be55d" %}

package:
  name: "{{ name }}"
  version: "{{ version }}"

source:
  url: https://github.com/ibbis-bio/common-mechanism/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage('commec', max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    # Runtime Python dependencies
    - biopython
    - numpy
    - pandas
    - pyyaml
    - pycountry
    - flask
    - werkzeug
    - openpyxl
    - xlrd
    - psutil
    # Runtime non-Python dependencies
    - blast >=2.17
    - hmmer
    - infernal
    - mkcert
    - tar
    - zstd

test:
  commands:
    - commec --version
    - commec setup --help
    - commec screen --help
    - commec flag --help
    - commec list --help
    - commec gui --help

about:
  home: https://commec.ibbis.bio
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/ibbis-bio/common-mechanism/wiki
  summary: "commec: a free, open-source, globally available tool for DNA synthesis screening"
  dev_url: https://github.com/ibbis-bio/common-mechanism

extra:
  identifiers:
    - biotools:commec
  container:
    image: "quay.io/biocontainers/commec"
