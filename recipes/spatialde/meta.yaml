{% set name = "spatialde" %}
{% set version = "1.1.3" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/spatialDE/SpatialDE-{{ version }}.tar.gz
  sha256: 7005e63ac7abfdbff1d50bff5a25e53050f1015dbf243627ec2c1303641eee27

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
  - {{ pin_subpackage("spatialde", max_pin="x.x.x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy
    - scipy >=1.0
    - pandas >=0.23
    - tqdm
    - naivede
    - click

test:
  imports:
    - SpatialDE
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/Teichlab/SpatialDE
  summary: Spatial and Temporal DE test
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nilchia
