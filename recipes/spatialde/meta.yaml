{% set name = "spatialde" %}
{% set version = "1.1.3" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/spatialDE/SpatialDE-{{ version }}.tar.gz
  sha256: 7005e63ac7abfdbff1d50bff5a25e53050f1015dbf243627ec2c1303641eee27

  patches:
    - 0001-fix-scipy-compat.diff
    - 0002-fix-scipy-alias-util.diff
    - 0003-dedup-results.diff
    - 0004-fix-clip-lower.diff

build:
  number: 1
  noarch: python
  # Patch README path in setup.py to fix package metadata generation during build.
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION
  script: |
    sed -i "s/HERE.parent \/ 'README.rst'/HERE \/ 'README.rst'/" setup.py
    {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
  - {{ pin_subpackage("spatialde", max_pin="x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy
    - scipy >=1.14
    - pandas >=0.23
    - tqdm
    - naivede
    - click

test:
  imports:
    - SpatialDE
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/Teichlab/SpatialDE
  dev_url: https://github.com/Teichlab/SpatialDE
  summary: Spatial and Temporal DE test
  short_description: |
    SpatialDE is a method to identify genes which significantly depend on spatial coordinates in non-linear and non-parametric ways.
    The intended applications are spatially resolved RNA-sequencing from e.g. Spatial Transcriptomics, or in situ gene expression measurements from e.g. SeqFISH or MERFISH.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nilchia
