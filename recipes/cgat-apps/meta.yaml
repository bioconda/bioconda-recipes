{% set name = "cgat-apps" %}
{% set version = "0.7.11" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/cgat/cgat-{{ version }}.tar.gz
  sha256: 6c893949a57966d84e111b2a655381af56a953046ccb42184ebfe77e3bd958e1

build:
  number: 0
  skip: True  # [py > 312]
  entry_points:
    - cgat = cgat.cgat:main
  script_env:
    - MACOSX_DEPLOYMENT_TARGET=10.13  # [osx]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - cython >=0.29.35
    - numpy
    - pysam
    - htslib
  run:
    - python
    - cgatcore
    - alignlib-lite
    - biopython
    - matplotlib-base
    - numpy
    - pandas
    - pybedtools
    - pybigwig
    - pysam
    - htslib
    - pyyaml
    - quicksect
    - scipy
    - scikit-learn
    - sortedcontainers
    # External dependencies
    - bedtools           # [not osx]  # Excluded for macOS
    - ucsc-bedgraphtobigwig
    - ucsc-wigtobigwig
    - coreutils
    - grep

test:
  imports:
    - cgat
  commands:
    - cgat --help
    - cgat gtf2table -h # [x86_64]
    # Skip certain tests for macOS
    - find ${PREFIX} -iname "*bamtools.cpython-*-x86_64-linux-gnu.so*" -exec ldd {} \;  # [not osx]
    - cgat bam2bed -h  # [not osx]
  skip: true  # [osx]  # Temporarily skip full test suite on macOS

about:
  home: "https://github.com/cgat-developers/cgat-apps"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Computational Genomics Analysis Toolkit."
  dev_url: "https://github.com/cgat-developers/cgat-apps"
  doc_url: "https://cgat-apps.readthedocs.io/en/latest"

extra:
  additional-platforms:
    - osx-arm64
    - linux-aarch64
  recipe-maintainers:
    - Acribbs
