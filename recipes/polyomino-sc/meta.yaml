{% set name = "polyomino-sc" %}
{% set pypi_name = "Polyomino-sc" %}
{% set version = "1.0.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://pypi.io/packages/source/{{ pypi_name[0]|lower }}/{{ pypi_name|lower }}/{{ pypi_name }}-{{ version }}.tar.gz
  sha256: be740b22b1b67854759f1c5294290d40ddeedfbe2e809aa78e822a8c1ffb12bb

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - Polyomino=Polyomino.Polyomino:main_Polyomino
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - anndata >=0.8.0
    - scanpy >=1.9.1
    - scipy >=1.9.3
    - scikit-learn >=1.1.3
    - numba >=0.14.0
    - tqdm >=4.66.5
    - lap >=0.4.0
    - pytorch >=1.8.0
    - numpy <2
    - pandas
    - matplotlib-base
    - seaborn
    - igraph >=0.11.6
    - leidenalg >=0.10.2

test:
  imports:
    - Polyomino
    - Polyomino.model
    - Polyomino.plotting
    - Polyomino.utilities
    - Polyomino.extension
  commands:
    - Polyomino --help
    - python -c "import Polyomino as po; from Polyomino.Polyomino import Polyomino; print(po.__version__)"

about:
  home: https://github.com/JiekaiLab/Polyomino
  dev_url: https://github.com/JiekaiLab/Polyomino
  doc_url: https://polyomino.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: Framework for mapping scRNA-seq to spatial transcriptomics data.

extra:
  recipe-maintainers:
    - LuisHeinzlmeier