{% set name = "ccphylo" %}
{% set version = "0.9.2" %}
{% set sha256 = "3b54f27706ff345e196152420d2e4cc8efde16b9965ee2cd149c375e08b7ab6b" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://bitbucket.org/genomicepidemiology/{{ name }}/get/{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - 0001-makefile.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - zlib

test:
  commands:
   - ccphylo --help | grep CCPhylo >/dev/null

about:
  home: "https://bitbucket.org/genomicepidemiology/ccphylo"
  summary: "CCPhylo enables phylogenetic analysis of samples based on overlaps between nucleotide created by e.g. KMA. Input file(s) may be given as non-option arguments succeding all options."
  license: "Apache-2.0"
  license_family: APACHE
  license_file: "LICENSE.txt"
  dev_url: "https://bitbucket.org/genomicepidemiology/ccphylo"
  doc_url: "https://bitbucket.org/genomicepidemiology/ccphylo/src/{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1093/bioinformatics/btac774
    - doi:10.1093/biomethods/bpab008
    - doi:10.1093/nargab/lqae106
