# falcoAmadeus uses C++17 std::filesystem, which libc++ only makes available
# on macOS >= 10.15. The default osx-64 deployment target (10.13) marks it
# unavailable and the build fails to compile. Raise the target to 10.15 on
# Intel macOS only; osx-arm64 already targets >= 11.0.
c_stdlib_version:            # [osx and x86_64]
  - "10.15"                  # [osx and x86_64]
MACOSX_DEPLOYMENT_TARGET:    # [osx and x86_64]
  - "10.15"                  # [osx and x86_64]
MACOSX_SDK_VERSION:          # [osx and x86_64]
  - "10.15"                  # [osx and x86_64]
