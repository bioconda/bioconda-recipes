{% set name = "cstag" %}
{% set version = "1.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/cstag-{{ version }}.tar.gz
  sha256: d88b6c1e72a6cbef7eac69d3dcc1a18ba85b2b5fc569fa4050bfff52a638bcb5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin='x.x') }}

requirements:
  host:
    - python >=3.8,<4.0
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=3.8.0,<4.0.0
    - matplotlib-base >=3.7,<4.0

test:
  imports:
    - cstag
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/akikuno/cstag
  summary: Python module to manipulate the minimap2's CS tag
  license: MIT
  license_file: LICENSE
  doc_url: https://akikuno.github.io/cstag/cstag/

extra:
  recipe-maintainers:
    - akikuno
