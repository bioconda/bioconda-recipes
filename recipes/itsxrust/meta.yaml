{% set name = "itsxrust" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/ayobi/ITSxRust/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 0704914b508da10e1b2138ad0d9732ed34dc8d2b21163e6b1ab1cc673b01cfd0

build:
  number: 0
  run_exports:
    - itsxrust >=0.2.2,<0.3.0a0

requirements:
  build:
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - openssl
  run:
    - hmmer

test:
  commands:
    - itsxrust --help
    - itsxrust extract --help
    - test -f "$PREFIX/share/itsxrust/hmm/F.hmm"

about:
  home: https://github.com/ayobi/ITSxRust
  license: MIT
  license_file: LICENSE
  summary: "HMMER-based ITS subregion extraction for long-read fungal metabarcoding."

extra:
  recipe-maintainers:
    - ayobi

