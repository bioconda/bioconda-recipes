{% set name = "ccnv" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/matthdsm/ccnv/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 8968315f34b33512a4ec9911933fc5c0a38e3076bd7932162ed4960ee9cb0018

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
  script:
    - export CARGO_BUILD_JOBS="${CPU_COUNT}"
    - export CARGO_PROFILE_RELEASE_DEBUG=false
    - export CARGO_PROFILE_RELEASE_STRIP=symbols
    - export MATURIN_PEP517_ARGS="--locked"
    - {{ PYTHON }} -c "from pathlib import Path; p = Path('pyproject.toml'); p.write_text(p.read_text().replace('>=3.14', '>=3.12').replace('abi3-py314', 'abi3-py312'))"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python >=3.12,<3.14
    - pip
    - maturin >=1.8,<2.0
  run:
    - python >=3.12,<3.14
    - jinja2 >=3.1.6,<4
    - jsonschema >=4.20.0
    - numpy
    - polars >=2,<3
    - polars-runtime-compat
    - pyarrow
    - pyyaml >=6.0
    - ruptures >=1.1.10
    - scikit-learn
    - scipy
    - typer

test:
  imports:
    - ccnv
    - ccnv._core
  commands:
    - ccnv --help
    - ccnv extract --help
    - ccnv reference --help
    - ccnv ref-qc --help
    - ccnv predict --help

about:
  home: https://github.com/matthdsm/ccnv
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file:
    - LICENSE.md
    - THIRDPARTY.yml
  summary: "Copy-number analysis for whole-genome sequencing"
  description: |
    ccnv is an organism-agnostic bioinformatics toolkit for copy-number
    variation (CNV) detection in whole-genome sequencing (WGS) data at any
    coverage across constitutional germline and cell-free DNA prenatal (NIPT)
    workflows, building on within-sample reference normalization methodology.
  doc_url: https://matthdsm.github.io/ccnv/
  dev_url: https://github.com/matthdsm/ccnv

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - matthdsm
