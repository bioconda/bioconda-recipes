{% set version = "0.943" %}
{% set sha256 = "70c3f38164247d40419a0cfb0df748b177d19ac1caaf3e9bfb7c9acf42bee653" %}
package:
  name: angsd
  version: {{ version }}

source:
  url: https://github.com/ANGSD/angsd/releases/download/{{ version }}/angsd-{{ version }}.tar.gz
  sha256: {{ sha256 }}


build:
  number: 0
  run_exports:
    - {{ pin_subpackage("angsd", max_pin="x.x") }}  
  # osx-64: conda-build's llvm-otool aborts on misc/msHOT2glf during packaging
  skip: True  # [osx and x86_64]

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - zlib
    - bzip2
    - xz
    - htslib
  run:
    - htslib
    - zlib
    - bzip2
    - xz

test:
  commands:
    - 'angsd 2>&1 | grep "angsd version: {{ version }}"'
    - thetaStat 2>&1 | grep "neutrality test"

about:
  home: https://github.com/ANGSD/angsd
  license: GPLv3, MIT
  summary: "ANGSD: Analysis of next generation Sequencing Data"

extra:
  recipe-maintainers:
    - ANGSD
  identifiers:
    - biotools:angsd
    - doi:10.1186/s12859-014-0356-4
  additional-platforms:
    - linux-aarch64
    - osx-arm64
