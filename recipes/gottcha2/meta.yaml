{% set name = "GOTTCHA2" %}
{% set version = "2.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install -vvv --no-deps --no-build-isolation --no-cache-dir .
  run_exports:
    - {{ pin_subpackage('gottcha2', max_pin='x') }}

source:
  url: https://github.com/poeli-lanl/GOTTCHA2/archive/refs/tags/{{ version }}.tar.gz
  sha256: bfcec50dc5047c368966f46fba44f3a20edd5926e0160a0e730d749c83a7c5e1

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
    - pandas >=1.2.0
  run:
    - python >=3.9
    - minimap2 >=2.27
    - biom-format >=2.1.7
    - numpy >=1.19.0
    - pandas >=1.2.0
    - requests >=2.25.0
    - tqdm
    - pysam >=0.22.0
    - minify-html >=0.1.12
    - samtools >=1.2
    - sylph

test:
  commands:
    - minimap2 -h
    - python -c "import gottcha.gottcha2 as g; assert g.__version__ == '{{ version }}'"
    - gottcha2 version

about:
  home: https://github.com/poeli-lanl/GOTTCHA2
  license: BSD-3
  license_family: BSD
  license_file: LICENSE
  summary: 'Genomic Origin Through Taxonomic CHAllenge (GOTTCHA) v2.'
  dev_url: https://github.com/poeli-lanl/GOTTCHA2
  doc_url: https://github.com/poeli-lanl/GOTTCHA2/wiki

extra:
  identifiers:
    - biotools:gottcha2
