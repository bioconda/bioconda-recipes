{% set name = "perl-test-expander" %}
{% set version = "2.7.1" %}
{% set sha256 = "84391baa9884e946175b7ff311fe3c55f900d57b5cb72d1866e0b4dd06c56f41" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/J/JS/JSF/Test-Expander-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-path-tiny
    - perl-test2-tools-explain
    - perl-importer
    - perl-padwalker
    - perl-const-fast
    - perl-file-chdir
    - perl-sub-delete
    - perl-scalar-readonly
  run:
    - perl
    #- perl-path-tiny
    #- perl-test2-tools-explain
    #- perl-importer
    #- perl-padwalker
    #- perl-const-fast
    #- perl-file-chdir
    #- perl-sub-delete
    #- perl-scalar-readonly

test:
  imports:
    - Test::Expander
    - Test::Expander::Constants

about:
  home: "https://metacpan.org/pod/Test::Expander"
  license: "perl_5"
  summary: "Expansion of test functionalities that appear to be frequently used while testing."
  doc_url: "https://metacpan.org/pod/Test::Expander"
