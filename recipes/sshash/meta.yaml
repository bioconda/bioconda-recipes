{% set version = "6.0.0" %}
{% set name = "sshash" %}
{% set sha256 = "8212b6834eeb6d631a2e3ed59ea3838c49a73d04abd908b66c329cf0b8bc1d78" %}

package:
  name: {{ name }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("sshash", max_pin="x.x") }}

source:
  url: https://github.com/jermp/sshash/releases/download/v{{ version }}/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

requirements:
  build:
    - cmake <4.0.0
    - autoconf
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pkg-config
  host:
    - zlib
    - bzip2
    - jemalloc >=5.2.1
    - tapi # [osx and x86_64]
  run:
    - __osx >={{ MACOSX_DEPLOYMENT_TARGET|default("10.9") }} # [osx and x86_64]

test:
  commands:
    - sshash build --help

about:
  home: https://github.com/jermp/sshash
  license: MIT
  license_file: LICENSE
  summary: Compressed dictionary data structure for k-mers
  description: |
    SSHash is a compressed dictionary data structure for k-mers (strings of length k over the DNA alphabet {A,C,G,T}), based on Sparse and Skew Hashing.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
