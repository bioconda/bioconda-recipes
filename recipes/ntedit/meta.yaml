{% set name = "ntedit" %}
{% set version = "2.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

source:
  url: https://github.com/BirolLab/ntEdit/releases/download/v{{ version }}/ntEdit-{{ version }}.tar.gz
  sha256: 83926f6751ce8b574c4cc21f803c65a23b1a16793eec47b6739dc5427806533a

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake
    - make
    - automake
    - autoconf
    - meson
    - ninja
  host:
    - perl
    - zlib
    - btllib
    - llvm-openmp  # [osx]
    - boost-cpp
    - python >=3.9
  run:
    - llvm-openmp  # [osx]
    - ntstat >=1.0.1
    - ntcard
    - btllib
    - snakemake-minimal
    - boost-cpp

test:
  commands:
    - ntedit --help
    - run-ntedit --help

about:
  home: https://github.com/BirolLab/ntEdit
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: 'Ultrafast, lightweight, scalable genome assembly polishing, and SNV detection & annotation'
  doc_url: https://github.com/BirolLab/ntEdit/blob/master/README.md
  dev_url: https://github.com/BirolLab/ntEdit

extra:  
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1093/bioinformatics/btz400
    - biotools:ntEdit
