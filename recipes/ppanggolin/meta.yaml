{% set name = "PPanGGOLiN" %}
{% set version = "2.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/labgem/PPanGGOLiN/archive/{{ version }}.tar.gz
  sha256: 52b6359322a85c2765a1524d8087909ebd936fe7211ce67260fd6e61a00ba264

build:
  number: 0
  skip: true  # [py < 310]
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  entry_points:
    - ppanggolin = ppanggolin.main:main
  script:
    - export LDFLAGS="${LDFLAGS} -L${PREFIX}/lib"
    - export CPPFLAGS="${CPPFLAGS} -I${PREFIX}/include"
    - export CFLAGS="${CFLAGS} -O3 -fcommon -Wno-implicit-function-declaration"
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - cython
    - setuptools-scm
  run:
    - python
    - tqdm >=4.0.0,<5.0.0
    - pytables >=3.8.0,<4.0.0
    - pyrodigal >=3.0.0,<4.0.0
    - networkx >=3.0.0,<4.0.0
    - scipy >=1.0.0,<2.0.0
    - plotly >=5.0.0,<6.0.0
    - gmpy2 >=2.0.0,<3.0.0
    - pandas >=2.0.0,<3.0.0
    - numpy >1.24.0,<3.0.0
    - bokeh >=3.0.0,<4.0.0
    - pyroaring >=1.0.0,<2.0.0
    - gb-io >=0.4.0,<0.5.0
    - pyaragorn >=0.3.0,<0.4.0
    # Tools that are not in Python
    - graph-tool >=2.0.0,<3.0.0
    - infernal =1
    - mmseqs2 =15
    - mafft =7

test:
  commands:
    - ppanggolin --version
    - ppanggolin --help
    - ppanggolin workflow -h
  imports:
    - ppanggolin

about:
  home: "https://github.com/labgem/PPanGGOLiN"
  summary: "PPanGGOLiN: Depicting microbial species diversity via a Partitioned PanGenome Graph."
  license: "CeCiLL-2.1"
  license_family: OTHER
  license_file: "LICENSE.txt"
  doc_url: "https://ppanggolin.readthedocs.io"
  dev_url: "https://github.com/labgem/PPanGGOLiN"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:PPanGGOLiN
    - usegalaxy-eu:ppanggolin_all
    - usegalaxy-eu:ppanggolin_msa
    - doi:10.1101/836239
  recipe-maintainers:
    - axbazin
    - jpjarnoux
    - JeanMainguy
