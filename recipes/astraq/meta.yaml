{% set name = "astraq" %}
{% set version = "0.5.8" %}
{% set sha256 = "adbd328731388b2e7a932bdda15435a2440a01548c46198e8fdccef95fbc4c64" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/KulyaNikita/ASTRAQ/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
  host:
    - libgomp      # [linux]
    - llvm-openmp  # [osx]
  run:
    - libgomp      # [linux]
    - llvm-openmp  # [osx]

test:
  commands:
    - ASTRAQ --version | grep -F "{{ version }}"
    - ASTRAQ --help
    # All quartets of ((A,B),C,(D,E)); ASTRAQ must recover that tree.
    - printf 'A B C D\nA B C E\nA B D E\nA C D E\nB C D E\n' > quartets.txt
    - ASTRAQ -q quartets.txt -o species.tre -t 2
    - grep -qxF '(A,(B,(C,(D,E))));' species.tre

about:
  home: https://github.com/KulyaNikita/ASTRAQ
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Species tree reconstruction from (weighted) quartet trees by constrained dynamic programming.
  description: |
    ASTRAQ (Accurate Species Tree Reconstruction by Amalgamating Quartets)
    reconstructs a phylogeny from quartet tree topologies using constrained
    dynamic programming to maximize agreement with the input quartets. It builds
    candidate bipartitions from quartet-derived neighbor-joining trees and
    randomized taxon subsets, without requiring complete gene trees.
  dev_url: https://github.com/KulyaNikita/ASTRAQ
  doc_url: https://github.com/KulyaNikita/ASTRAQ#readme

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - gkanogiannis
    - KulyaNikita
