{% set name = "proteomiqon-mzmltomzlite" %}
{% set version = "0.1.0" %}
{% set sha256 = "c8756ffa5a5dddcf6a2fc4974c67119c8baa9cbe7ae4bc82925aaa1ced071ccf" %}

package:
  name: '{{ name }}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.MzMLToMzLite/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-mzmltomzlite"
    - test -f "$PREFIX/lib/dotnet/tools/MzMLToMzLite/ProteomIQon.MzMLToMzLite.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-mzmltomzlite"
    - grep -q "MzMLToMzLite/ProteomIQon.MzMLToMzLite.dll" "$PREFIX/bin/proteomiqon-mzmltomzlite"

about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  description: |
    MzMLToMzLite converts an mzML file into an mzlite file. It is the first tool of the chain, every later tool reads the mzlite it writes. Mzlite is the SQLite based storage format of MzIO.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/mzml-to-mzlite/
