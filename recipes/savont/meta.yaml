{% set version = "0.8.0" %}

package:
  name: savont
  version: {{ version }}

source:
  url: https://github.com/bluenote-1577/savont/archive/v{{ version }}.tar.gz
  sha256: 32e6870162398297e4e39cf60901adb2958316efc182fcf9bd1a4bbbcdf10d81

build:
  number: 2
  run_exports:
    - {{ pin_subpackage('savont', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - {{ compiler("cxx") }}
    - {{ compiler("rust") }}
    - make
    - cmake >=3.12
    - cargo-bundle-licenses
    - pkg-config
  run:
    - gzip
    - tar
    - wget

test:
  commands:
    - savont --help

about:
  home: "https://github.com/bluenote-1577/savont"
  license: MIT
  license_family: MIT
  summary: "Amplicon sequencing variants (ASVs) and taxonomic profiling from modern long-read (nanopore + PacBio) amplicon sequencing with > 98% accuracy."
  license_file: LICENSE
  dev_url: "https://github.com/bluenote-1577/savont"
  doc_url: "https://github.com/bluenote-1577/savont/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - bluenote-1577
