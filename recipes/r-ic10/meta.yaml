{% set name = "r-ic10" %}
{% set version = '2.0.3' %}

package:
  name: {{ name }}
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/iC10_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/iC10/iC10_{{ version }}.tar.gz
  sha256: e144b0e557fa13548aaefdef47ce5bca18f7b371f090130dfa168a7f153668c9

build:
  number: 0
  noarch: generic
  script: ${R} CMD INSTALL --build . ${R_ARGS}
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports:
    - {{ pin_subpackage('r-ic10', max_pin="x") }}

requirements:
  host:
    - r-base
    - bioconductor-impute
    - r-ic10trainingdata
    - r-pamr
  run:
    - r-base
    - bioconductor-impute
    - r-ic10trainingdata
    - r-pamr

test:
  commands:
    - $R -e "library('iC10')"

about:
  home: https://CRAN.R-project.org/package=iC10
  license: GPL-3.0-or-later
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'
  summary: 'Genome-driven integrated classification of breast cancer validated in over 7,500 samples'
  license_family: GPL3
