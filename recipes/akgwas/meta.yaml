{% set name = "akgwas" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://github.com/suzkami/AKmerGWAS/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1135d16c6d6fa09f89654f6799f1dfc4d8c61a0f75a652c9acf7f748f07ea172

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  entry_points:
    - akgwas = akgwas.cli:main
  run_exports:
    - {{ pin_subpackage('akgwas', max_pin="x.x") }}

requirements:
  host:
    - python >=3.11,<3.14
    - pip
    - setuptools
  run:
    - python >=3.11,<3.14
    - kmtricks
    - gemma
    - plink
    - bowtie
    - bwa

test:
  commands:
    - akgwas --version
    - akgwas --help
    - akgwas --errors
  imports:
    - akgwas
    - akgwas.stages

about:
  home: https://github.com/suzkami/AKmerGWAS
  license: MIT
  license_file: LICENSE
  summary: "AKmerGWAS -- k-mer GWAS for any input format (short reads, assemblies, genomes)."
  description: |
    AKmerGWAS is a k-mer based genome-wide association study pipeline that
    accepts any input format (short reads, assemblies, whole genomes). It counts
    k-mers with kmtricks, turns the presence/absence matrix into PLINK bed chunks,
    runs GEMMA association per chunk and trait, and maps significant k-mers back
    to reference genomes with bowtie or bwa. Version 1.0.0 is a pure-Python
    (standard-library-only) rewrite of the original Snakemake workflow.
  dev_url: https://github.com/suzkami/AKmerGWAS

extra:
  recipe-maintainers:
    - suzkami
