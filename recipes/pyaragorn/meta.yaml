{% set name = "pyaragorn" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c4ee52bb7fe6738e43980592acaaf3d4d52889a0febbb15ae78e215112cdc60a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage('pyaragorn', max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - cmake >=3.20
    - make
  host:
    - python {{ python }}
    - pip
    - cython
    - scikit-build-core
  run:
    - {{ pin_compatible("python") }}

test:
  imports:
    - {{ name }}

about:
  home: "https://github.com/althonos/pyaragorn"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: COPYING
  summary: "Cython bindings and Python interface to ARAGORN, a (t|mt|tm)RNA gene finder."
  doc_url: "https://pyaragorn.readthedocs.io/"
  dev_url: "https://github.com/althonos/pyaragorn"

extra:
  recipe-maintainers:
    - apcamargo
  additional-platforms:
    - linux-aarch64
    - osx-arm64
