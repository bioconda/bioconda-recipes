{% set name = "perl-data-dump" %}
{% set version = "1.27" %}
{% set sha256 = "009dcf9e51439a8615641dc29a582672e1a325b55c2da12975b9b49417356c0a" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/G/GA/GARU/Data-Dump-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - perl
    - perl-test
    - perl-extutils-makemaker
  run:
    - perl

test:
  imports:
    - Data::Dump

about:
  home: "https://metacpan.org/pod/Data::Dump"
  license: "perl_5"
  summary: "Pretty printing of data structures."
  doc_url: "https://metacpan.org/pod/Data::Dump"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
