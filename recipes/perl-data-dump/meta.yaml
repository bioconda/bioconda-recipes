{% set name = "perl-data-dump" %}
{% set version = "1.26" %}
{% set sha256 = "9f967e70383f1dd4e4065eab5e7f7418854dcbb1edd9c8045f43a38d0e7340b1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/G/GA/GARU/Data-Dump-1.26.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin = "x") }}


requirements:
  build:
    - make
    - {{ compiler('c') }}

  host:
    - perl
    - perl-test
    - perl-extutils-makemaker

  run:
    - perl

test:
  imports:
    - Data::Dump

about:
  home: http://metacpan.org/pod/Data::Dump
  license: perl_5
  summary: 'Pretty printing of data structures'
extra:
  additional-platforms:
    - linux-aarch64
