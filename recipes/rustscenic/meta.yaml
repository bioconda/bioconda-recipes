{% set name = "rustscenic" %}
{% set version = "0.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/r/rustscenic/rustscenic-{{ version }}.tar.gz
  sha256: 7a10768f318089c67545ddca2c1f2e00a046f7318b9cb1b81f0cd16ee72c00c3

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: |
    export CARGO_BUILD_JOBS="${CPU_COUNT}"
    cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    export MATURIN_PEP517_ARGS="--locked"
    {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python >=3.10,<3.14
    - pip
    - maturin >=1.5,<2
  run:
    - python >=3.10,<3.14
    - numpy >=1.21
    - pandas >=1.5
    - pyarrow >=10
    - scipy >=1.8
    - anndata >=0.10

test:
  imports:
    - rustscenic
    - rustscenic._rustscenic
  commands:
    - rustscenic --version | grep -Fx "rustscenic {{ version }}"

about:
  home: https://github.com/Ekin-Kahraman/rustscenic
  dev_url: https://github.com/Ekin-Kahraman/rustscenic
  doc_url: https://ekin-kahraman.github.io/rustscenic/
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
    - THIRDPARTY.yml
  summary: Rust and PyO3 implementation of SCENIC-style regulatory network analysis

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - Ekin-Kahraman
