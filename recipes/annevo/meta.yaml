{% set name = "annevo" %}
{% set version = "2.3.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/xjtu-omics/ANNEVO/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e0f51e23f191c292069e923b211337fc666f6261369930128601f7886a7cff70

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_compatible('python') }}
  skip: true  # [not linux]

requirements:
  host:
    - python =3.10
  run:
    - python =3.10
    - pytorch
    - numpy
    - pandas
    - h5py
    - biopython
    - numba
    - tqdm

test:
  commands:
    - annotation.py --help
    - prediction.py --help
    - decoding.py --help

about:
  home: https://github.com/xjtu-omics/ANNEVO
  summary: Deep learning-based ab initio gene annotation from genome sequence.
  description: |
    ANNEVO is a deep learning-based ab initio gene annotation method for
    understanding genome function. It models distal sequence information
    and joint evolutionary relationships across diverse species directly
    from genomes to predict gene structures without relying on extrinsic
    evidence (e.g. RNA-seq, protein homology).
  license: ANNEVO Non-Commercial License
  license_family: OTHER
  license_file: LICENSE
  dev_url: https://github.com/xjtu-omics/ANNEVO