{% set name = "dipper" %}
{% set version = "0.1.5" %}

package:
  name: {{ name }}-base
  version: {{ version }}

source:
  url: https://github.com/TurakhiaLab/DIPPER/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 7e60648d372677a5107d112f7316808d3a14c56521a7d5748bd873d81e034c62

build:
  number: 1
  skip: True  # [win]
  run_exports:
    - {{ pin_subpackage('dipper', max_pin="x.x") }}

outputs:
  - name: dipper                       # CPU-only
    build:
      script: bash ${RECIPE_DIR}/build_dipper.sh
      run_exports:
        - {{ pin_subpackage('dipper', max_pin="x.x") }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake
        - make
        - pkg-config
      host:
        - zlib
        - libboost-devel
        - tbb-devel
      run:
        - tbb
    test:
      commands:
        - dipper_cpu --help

  - name: dipper-cuda                  # NVIDIA GPU build
    build:
      skip: True  # [not linux]
      script: bash ${RECIPE_DIR}/build_dipper.sh
      run_exports:
        - {{ pin_subpackage('dipper-cuda', max_pin="x.x") }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake
        - make
        - pkg-config
        - cuda-nvcc
        - cuda-version >=12.0,<13
      host:
        - cuda-cudart-dev
        - cuda-version >=12.0,<13
        - zlib
        - libboost-devel
        - tbb-devel
      run:
        - tbb
        - {{ pin_subpackage('dipper', exact=True) }}   # gives users dipper_cpu too, no file overlap
    test:
      commands:
        - test -x "${PREFIX}/bin/dipper"   # can't run it: no GPU on the builder

about:
  home: "https://github.com/TurakhiaLab/DIPPER"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: "DIPPER (DIstance-based Phylogenetic PlacER) is a tool designed for ultrafast and ultralarge phylogenetic tree reconstruction on GPUs. It is capable of reconstructing a phylogenetic tree with 10 million taxa, with a minimal memory footprint."
  summary: "CUDA and CPU-only package for DIPPER"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64          
  recipe-maintainers:
    - sumit-walia
