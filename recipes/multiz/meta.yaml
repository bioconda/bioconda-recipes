{% set name = "multiz" %}
{% set version = "11.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

source:
  url: https://github.com/multiz/multiz/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 4fb22137f5a1e66782e95524a2e91914e09dcb1d85ca68e574573ad1ca8d7cb5

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
  run:
    - coreutils
    - grep

test:
  commands:
    - multiz 2>&1 | grep -qF 'multiz.v{{ version }}'
    - tba 2>&1 | grep -qF 'tba.v16'
    - roast 2>&1 | grep -qF 'roast.v5'

about:
  home: http://www.bx.psu.edu/miller_lab/
  license: MIT
  summary: DNA multiple sequence aligner from Penn State's Miller lab.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:multiz
    - biotools:tba
    - biotools:roast
