{% set name = "multiz" %}
{% set version = "11.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

source:
  url: https://github.com/multiz/multiz/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e80c8396048c2aa39239e97cd49ab6d206c77005f65d12709e3e035528fa3749

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
  run:
    - coreutils
    - grep

test:
  commands:
    - multiz 2>&1 | grep -qF 'multiz.v{{ version }}'
    - tba 2>&1 | grep -qF 'tba.v14'
    - roast 2>&1 | grep -qF 'roast.v4'

about:
  home: http://www.bx.psu.edu/miller_lab/
  license: MIT
  summary: DNA multiple sequence aligner from Penn State's Miller lab.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:multiz
    - biotools:tba
    - biotools:roast
