{% set name = "multiz" %}
{% set version = "11.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 1
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

source:
  url: https://github.com/multiz/multiz/archive/refs/tags/v{{ version }}.tar.gz
  sha256: a0e11b8ce8757359aee643f115f21ce0c0e477b1695f91454cc5b33608be945f

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
  run:
    - coreutils
    - grep

test:
  commands:
    - multiz 2>&1 | grep -qF 'multiz.v{{ version }}'
    - tba 2>&1 | grep -qF 'tba.v14'
    - roast 2>&1 | grep -qF 'roast.v4'

about:
  home: http://www.bx.psu.edu/miller_lab/
  license: MIT
  summary: DNA multiple sequence aligner from Penn State's Miller lab.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:multiz
    - biotools:tba
    - biotools:roast
