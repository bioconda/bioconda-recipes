{% set name = "multiz" %}
{% set version = "11.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

source:
  url: https://github.com/multiz/multiz/archive/refs/tags/v{{ version }}.tar.gz
  sha256: eaec5c62ca08944b5d2e10245e8785889a8ac3dbd377c71f7150e6a6924ba25d

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
  run:
    - coreutils
    - grep

test:
  commands:
    - multiz 2>&1 | grep -qF 'multiz.v{{ version }}'
    - tba 2>&1 | grep -qF 'tba.v13'
    - roast 2>&1 | grep -qF 'roast.v4'

about:
  home: http://www.bx.psu.edu/miller_lab/
  license: MIT
  summary: DNA multiple sequence aligner from Penn State's Miller lab.

extra:
  identifiers:
    - biotools:multiz
    - biotools:tba
    - biotools:roast
