{% set name = "multiz" %}
{% set version = "11.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

source:
  url: https://github.com/multiz/multiz/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 791cb7e0f9061bfd652927aa0d95335f9f839e5fdb89020b173b9f85393e21d7
  patches:
    - mkdtemp-darwin.patch

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
  run:
    - coreutils
    - grep

test:
  commands:
    - multiz 2>&1 | grep -qF 'multiz.v{{ version }}'
    - tba 2>&1 | grep -qF 'tba.v20'
    - roast 2>&1 | grep -qF 'roast.v9'

about:
  home: http://www.bx.psu.edu/miller_lab/
  license: MIT
  summary: DNA multiple sequence aligner from Penn State's Miller lab.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:multiz
    - biotools:tba
    - biotools:roast
