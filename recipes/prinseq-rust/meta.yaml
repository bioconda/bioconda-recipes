{% set name = "prinseq-rust" %}
{% set version = "1.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/metageni/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 87f911328cca56934a4a1b5d023649911ef0f79e0e3f06a3b5f2d2e55dc8008e

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cargo install -v --locked --no-track --root $PREFIX --path .

requirements:
  build:
    - {{ compiler('rust') }}
    - cargo-bundle-licenses

test:
  commands:
    - prinseq-rust --version
    - prinseq-rust --help

about:
  home: https://github.com/metageni/prinseq-rust
  license: GPL-2.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Fast FASTQ/FASTA quality control and filtering tool (Rust port of PRINSEQ++)

extra:
  recipe-maintainers:
    - metageni
