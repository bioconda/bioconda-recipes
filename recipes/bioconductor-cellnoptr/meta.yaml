{% set version = "1.58.0" %}
{% set name = "CellNOptR" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: {{ version }}

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  sha256: 08e72d98dcf4490cb977e5d840f3518186e0c2b75675f70b480c1809ae27393d

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: {{ pin_subpackage('bioconductor-cellnoptr', max_pin="x.x") }}

# Suggests: data.table, dplyr, tidyr, readr, knitr, RUnit, BiocGenerics,
# SystemRequirements: Graphviz version >= 2.2
requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - make
  host:
    - bioconductor-graph >=1.88.0,<1.89.0
    - bioconductor-rbgl >=1.86.0,<1.87.0
    - bioconductor-rgraphviz >=2.55.0,<2.57.0
    - r-base
    - r-ggplot2
    - r-igraph
    - r-rcurl
    - r-rmarkdown
    - r-stringi
    - r-stringr
    - r-xml
    - libblas
    - liblapack
    - zlib
    - liblzma-devel
    - graphviz >=2.2
  run:
    - bioconductor-graph >=1.88.0,<1.89.0
    - bioconductor-rbgl >=1.86.0,<1.87.0
    - bioconductor-rgraphviz >=2.55.0,<2.57.0
    - r-base
    - r-ggplot2
    - r-igraph
    - r-rcurl
    - r-rmarkdown
    - r-stringi
    - r-stringr
    - r-xml
    - graphviz >=2.2

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: "https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html"
  license: "GPL-3.0-or-later"
  summary: "Training of boolean logic models of signalling networks using prior knowledge networks and perturbation data."
  description: This package does optimisation of boolean logic networks of signalling pathways based on a previous knowledge network and a set of data upon perturbation of the nodes in the network.
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'
  dev_url: "https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:cellnoptr
    - doi:10.1186/1752-0509-6-133
  parent_recipe:
    name: bioconductor-cellnoptr
    path: recipes/bioconductor-cellnoptr
    version: 1.26.0
