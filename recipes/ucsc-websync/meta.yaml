{% set package = "ucsc-websync" %}
{% set program = "webSync" %}
{% set version = "502" %}
{% set sha256 = "38e29dbf7c1e6d49aaf358014960c5781fd59aa3b7b406dadc9557c98e895f22" %}

package:
  name: "{{ package }}"
  version: "{{ version }}"

source:
  url:
    - "https://hgdownload.soe.ucsc.edu/admin/exe/userApps.archive/userApps.v{{ version }}.src.tgz"
    - "https://hgdownload-euro.soe.ucsc.edu/admin/exe/userApps.archive/userApps.v{{ version }}.src.tgz"
  sha256: "{{ sha256 }}"

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(package, max_pin=None) }}

requirements:
  run:
    - python >=3.10

test:
  commands:
    - {{ program }} --help > /dev/null


about:
  home: "https://hgdownload.soe.ucsc.edu/admin/exe"
  license: "Varies; see https://genome.ucsc.edu/license"
  summary: "download from https server, using files.txt on their end to get the list of files"
  dev_url: "https://github.com/ucscGenomeBrowser/kent"
  doc_url: "https://github.com/ucscGenomeBrowser/kent/blob/v{{ version }}_base/README"

extra:
  identifiers:
    - biotools:UCSC_Genome_Browser_Utilities
    - doi:10.1093/bib/bbs038
