{% set name = "proteomiqon-peptidedb" %}
{% set version = "0.1.0" %}
{% set sha256 = "9ee598b17c798e4793f5e2e3635f0b71064643dd472f529e2c93bcff11cad6a0" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.PeptideDB/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-peptidedb"
    - test -f "$PREFIX/lib/dotnet/tools/PeptideDB/ProteomIQon.PeptideDB.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-peptidedb"
    - grep -q "PeptideDB/ProteomIQon.PeptideDB.dll" "$PREFIX/bin/proteomiqon-peptidedb"


about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  description: | 
    PeptideDB digests the proteins of a FASTA file in silico and stores the resulting peptides, with their masses and modifications, in a SQLite database.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/peptide-db/
