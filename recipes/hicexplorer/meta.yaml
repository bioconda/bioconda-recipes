{% set name = "hicexplorer" %}
{% set version = "4.0.0" %}
{% set sha256 = "5f6cc2b7abe3d5d296a8853aad0be0bd4db5a137554a1e29d85bb7b46b0d9e23" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/deeptools/HiCExplorer/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  # The test suites run on Python 3.10 to 3.12 on linux-64, linux-aarch64
  # and osx-arm64; Intel macOS (osx-64) is not tested.
  skip: True  # [py < 310 or py > 312 or (osx and x86_64)]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.24,<5
    - ninja >=1.11,<2
  host:
    # bare so conda-build makes one package per pinned Python; the range is
    # set by build.skip and by the run requirement below
    - python
    - pip
    - scikit-build-core >=1.1,<2
    - pybind11 ==2.13.6
    - libboost-headers 1.85.*
    - eigen >=3.4,<3.5
    - hdf5 >=1.14.3,<1.15
    - blosc >=1.21.6,<1.22
    - zlib >=1.2.13,<2
    - htslib >=1.23.1,<1.25
    - libblas >=3.9,<4
    - libcblas >=3.9,<4
    - liblapack >=3.9,<4
    - libbigwig >=0.4.8,<0.5
  run:
    - python >=3.10,<3.13
    - numpy >=1.23,<3
    - scipy >=1.10,<2
    - matplotlib-base >=3.8,<4
    - intervaltree >=3.1,<4
    - pandas >=2.0,<3
    - unidecode >=1.3,<2
    - hicmatrix >=17,<18
    # c-blosc2 3.4.1 to 3.6.0 for osx-arm64 link /opt/homebrew/opt/lz4
    # instead of conda's liblz4, so pytables fails to import without Homebrew.
    - c-blosc2 >=2.15,<3.4.1  # [osx]
    - hyperopt >=0.2.7,<0.4
    - python-graphviz >=0.20,<1
    - graphviz >=13,<15

test:
  imports:
    - hicexplorer
    - hicexplorer._hicx
    - tables
  commands:
    - hicexplorer > /dev/null
    - hicInfo --version
    - hicBuildMatrix --version
    - hicCorrectMatrix --version
    - hicConvertFormat --version
    - hicFindTADs --version
    - hicDetectLoops --version
    - hicPlotMatrix --version
    - chicChicagoScores --version
    - hicHyperoptDetectLoops --help > /dev/null
    - test -d "${PREFIX}/share/hicexplorer/plot/hicexplorer_plot"

about:
  home: "https://github.com/deeptools/HiCExplorer"
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
    - LICENSE
    - cpp/THIRD_PARTY_NOTICES.md
    - cpp/third_party/spectra/LICENSE
  summary: Set of programs to process, analyze and visualize Hi-C and capture Hi-C data
  dev_url: "https://github.com/deeptools/HiCExplorer"
  doc_url: "https://hicexplorer.readthedocs.io"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - joachimwolff
  identifiers:
    - doi:10.1093/nar/gky504
    - doi:10.1093/nar/gkaa220
    - doi:10.1093/gigascience/giac061
    - usegalaxy-eu:hicexplorer_hicplotviewpoint
    - biotools:hicexplorer
