{% set name = "gain-core" %}
{% set version = "2026.10.2" %}
{% set python_min = "3.12" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/gain_core-{{ version }}.tar.gz
    sha256: 277d1d76554da2ae8cb6210e5169ff48cf9627f03edcfb271df05818cc8d8c0f
  # The sdist carries no top-level LICENSE; take it from the release tag.
  - url: https://raw.githubusercontent.com/iossifovlab/gain/{{ version }}/LICENSE
    sha256: d34f0ed158e21799db86c8de595c4b957c05792b6f99a220cb6eb2f141c5e39a

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin=None) }}

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - anndata >=0.13
    - apsw >=3.52
    - cerberus >=1.3
    # dask-core, not dask: the dask metapackage pulls in bokeh, which
    # registers its own TRACE log level on import.
    - dask-core >=2026.1
    - dask-jobqueue >=0.9
    - distributed >=2026.1
    - docker-py >=7.1
    - filelock >=3.19
    - fsspec >=2026.2
    - h5py >=3.11
    - intervaltree
    - jinja2 >=3.1
    - lark >=1.2
    - markdown2 >=2.4
    - matplotlib-base >=3.8
    - networkx >=3.6
    - numpy >=2.2
    - openpyxl >=3.1
    - packaging
    - pandas >=2.2
    - pathspec >=1.0
    - psutil
    - pybigwig >=0.3
    - pydantic >=2.8
    - pyliftover >=0.4
    - pysam >=0.24
    - python-box >=7.1
    - pyyaml >=6
    - s3fs >=2026.2
    - scipy >=1.14
    - tqdm >=4.66

test:
  files:
    - entry_point_walk.py
  requires:
    - python {{ python_min }}
    - pip
  commands:
    # hatch-vcs falls back to 0.0.0.dev0 when it cannot read the version.
    - python -c "import importlib.metadata as m; v = m.version('{{ name }}'); assert v == '{{ version }}', v"
    - python entry_point_walk.py {{ name }}
    - pip check

about:
  home: https://github.com/iossifovlab/gain
  summary: "GAIn: Genomic Annotation Infrastructure"
  description: |
    GAIn annotates genomic variants with scores and gene models from a
    Genomic Resource Repository (GRR), and manages GRRs.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/iossifovlab/gain
  doc_url: https://iossifovlab.com/gaindocs/

extra:
  recipe-maintainers:
    - lchorbadjiev
    - iossifov
