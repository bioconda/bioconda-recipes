{% set name = "shapeit5" %}
{% set version = "5.1.2" %}
{% set user = "odelaneau" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Upstream repo at the main commit c34d4db (parent of the port). The
  # Apple Silicon port is applied as apple-silicon-port.patch until
  # odelaneau/shapeit PR #5 is merged; re-point url at the merged
  # commit and drop the patch afterwards.
  url: https://github.com/odelaneau/shapeit/archive/c34d4db3e99a2f7e23deb727671ae260901a5886.tar.gz
  sha256: dcdad851e86ba01d8ddbf330e426f97c16e40cf64950dfd25d0641f1cd5f61f8
  patches:
    - apple-silicon-port.patch

build:
  number: 0
  # osx-64 (Intel Mac) is no longer maintained: Apple Silicon replaced it,
  # and Apple announced Rosetta 2 support ends with macOS 27. Existing
  # 5.1.1 osx-64 packages remain available on the bioconda channel.
  skip: true  # [osx and x86_64]
  run_exports:
    - {{ pin_subpackage('shapeit5', max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - make
  host:
    - boost-cpp
    - libcurl
    - libdeflate
    - bzip2
    - htslib
    - xz
    - zlib
  run:
    - boost-cpp
    - htslib

test:
  commands:
    - SHAPEIT5_phase_common --help
    - SHAPEIT5_phase_rare --help
    - SHAPEIT5_switch --help
    - SHAPEIT5_ligate --help
    - SHAPEIT5_xcftools

about:
  home: https://odelaneau.github.io/shapeit
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Fast and accurate method for estimation of haplotypes (phasing).'
  description: 'This package provides the software SHAPEIT5. SHAPEIT5 estimates haplotypes in large datasets (WGS, WES, SNP array), with a special focus on rare variants. The HMM engine uses native ARM NEON SIMD kernels on Apple Silicon (no sse2neon emulation) and AVX2/FMA on x86_64.'
  dev_url: https://github.com/odelaneau/shapeit
  doc_url: https://odelaneau.github.io/shapeit

extra:
  identifiers:
    - doi:10.1101/2022.10.19.512867
    - biotools:shapeit5
  additional-platforms:
    - osx-arm64
