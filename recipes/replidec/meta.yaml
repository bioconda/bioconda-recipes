{% set name = "replidec" %}
{% set version = "0.3.7" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/replidec-{{ version }}.tar.gz
  sha256: 487f75fc384225a388774be0242f4e87c5dfc258787cdad2b0d2eaf1488bacc7

build:
  number: 0
  entry_points:
    - Replidec = Replidec.Replidec_cmdline:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  noarch: python
  run_exports:
    - {{ pin_subpackage('replidec', max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - biopython >=1.77
    - future >=0.18.2
    - numpy >=1.21
    - blast
    - hmmer
    - mmseqs2
    - prodigal

test:
  commands:
    - Replidec --help

about:
  home: "https://github.com/pengSherryYel/Replidec"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Replication Cycle Decipher for Phages."
  doc_url: "https://github.com/pengSherryYel/Replidec/blob/v.{{ version }}/README.md"
  dev_url: "https://github.com/pengSherryYel/Replidec"

extra:
  recipe-maintainers:
    - pengSherryYel
