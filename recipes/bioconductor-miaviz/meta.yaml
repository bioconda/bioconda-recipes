{% set version = "1.20.0" %}
{% set name = "miaViz" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: 7563ccfaa6a40bd1bf8dee47fa04d663

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-miaviz", max_pin="x.x") }}'
  noarch: generic

# Suggests: beeswarm, BiocStyle, bluster, circlize, ComplexHeatmap, ggh4x, ggpubr, knitr, maaslin3, mediation, miaTime, patchwork, rmarkdown, rstatix, shadowtext, testthat, vegan, vipor
requirements:

  host:
    - bioconductor-biocgenerics >=0.58.0,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-delayedarray >=0.38.0,<0.39.0
    - bioconductor-dirichletmultinomial >=1.54.0,<1.55.0
    - bioconductor-ggtree >=4.2.0,<4.3.0
    - bioconductor-mia >=1.20.0,<1.21.0
    - bioconductor-s4vectors >=0.50.0,<0.51.0
    - bioconductor-scater >=1.40.0,<1.41.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - bioconductor-treesummarizedexperiment >=2.20.0,<2.21.0
    - r-ape
    - r-base
    - r-dplyr
    - r-ggnewscale
    - r-ggplot2
    - r-ggraph >=2.0
    - r-ggrepel
    - r-patchwork
    - r-rlang
    - r-scales
    - r-tibble
    - r-tidygraph
    - r-tidyr
    - r-tidytext
    - r-tidytree
    - r-viridis

  run:
    - bioconductor-biocgenerics >=0.58.0,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-delayedarray >=0.38.0,<0.39.0
    - bioconductor-dirichletmultinomial >=1.54.0,<1.55.0
    - bioconductor-ggtree >=4.2.0,<4.3.0
    - bioconductor-mia >=1.20.0,<1.21.0
    - bioconductor-s4vectors >=0.50.0,<0.51.0
    - bioconductor-scater >=1.40.0,<1.41.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - bioconductor-treesummarizedexperiment >=2.20.0,<2.21.0
    - r-ape
    - r-base
    - r-dplyr
    - r-ggnewscale
    - r-ggplot2
    - r-ggraph >=2.0
    - r-ggrepel
    - r-patchwork
    - r-rlang
    - r-scales
    - r-tibble
    - r-tidygraph
    - r-tidyr
    - r-tidytext
    - r-tidytree
    - r-viridis

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: Artistic-2.0 | file LICENSE
  summary: Microbiome Analysis Plotting and Visualization
  description: The miaViz package implements functions to visualize TreeSummarizedExperiment objects especially in the context of microbiome analysis. Part of the mia family of R/Bioconductor packages.
  license_file: LICENSE

