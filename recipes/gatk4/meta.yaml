{% set name = "GATK4" %}
{% set version = "4.7.0.0" %}
{% set sha256 = "d093d2693b1626361a413ca59d6d4a0bf968717f280a8fd9ce060b25eb2ed1db" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/broadinstitute/gatk/releases/download/{{ version }}/gatk-{{ version }}.zip
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 1
  run_exports:
     - {{ pin_subpackage('gatk4-main', max_pin="x") }}

requirements:
  host:
    - r-base =4.3.1
    - r-gplots
    - r-ggplot2
    - r-gsalib
    - r-reshape
    - gcnvkernel =0.9
  run:
    - openjdk =17
    - python
    - r-base =4.3.1
    - r-gplots
    - r-ggplot2
    - r-gsalib
    - r-reshape
    - gcnvkernel =0.9

test:
  commands:
    - gatk -h
    - gatk --list
    - gatk HaplotypeCaller --help
    - gatk DetermineGermlineContigPloidy --help

outputs:
  - name: gatk4
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage("gatk4-main", exact=True) }}
    test:
      commands:
        - gatk -h
        - gatk --list
        - gatk HaplotypeCaller --help
        - gatk DetermineGermlineContigPloidy --help
  - name: gatk4-main
    script: build_main.sh
    requirements:
      run:
        - openjdk =17
        - python
    test:
      commands:
        - gatk -h
        - gatk --list
        - gatk HaplotypeCaller --help
        - gatk DetermineGermlineContigPloidy --help
  - name: gatk4-spark
    script: build_spark.sh
    requirements:
      run:
        - openjdk =17
        - python
        - {{ pin_subpackage("gatk4-main", exact=True) }}
    test:
      commands:
        - gatk -h
        - gatk --list
        - gatk MarkDuplicatesSpark --help
        - gatk DetermineGermlineContigPloidy --help

about:
  home: https://www.broadinstitute.org/gatk/
  license: BSD-3-Clause
  license_family: BSD
  summary: Genome Analysis Toolkit (GATK4)
  dev_url: https://github.com/broadinstitute/gatk
