package:
  name: age-metasv
  version: "2015.01.29.3"

source:
  url: https://github.com/marghoob/AGE/archive/344429ccb.tar.gz
  sha256: ca9f1072d3cd91858034001b4299a2ea98a7a8930d785bec2aadacbec3dbe523
  patches:
    - flags.patch

build:
  number: 10
  run_exports:
    - {{ pin_subpackage('age-metasv', max_pin=None) }}

requirements:
  build:
    - make
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  run:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]

test:
  commands:
    - age_align

about:
  home: "https://github.com/marghoob/AGE/tree/simple-parseable-output"
  license: "CCPL (Creative Commons Public License)"
  summary: "Optimal alignment of sequences with structural variants (SVs), modifiied for MetaSV integration."
  dev_url: "https://github.com/marghoob/AGE/tree/simple-parseable-output"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
