{% set name = "ExpressBetaDiversity" %}
{% set version = "1.0.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/dparks1134/ExpressBetaDiversity/archive/v{{ version }}.tar.gz
  sha256: c3ee0894ed0beea42f7668e531e53d01f4c19374d0dfd287cb400a68241c6c03
  patches:
    - 0001-Fix-hardcoded-g++.patch
    - 0002-version.patch
    - 0003-macos.patch  # [osx]
    - 0004-python-shebang.patch  # [osx]

build:
  number: 7
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - make
    - python <3.13  # required for source/dep.py
  run:
    - python >=3
    - numpy
    - matplotlib-base

test:
  commands:
    - ExpressBetaDiversity -h
    - convertToEBD.py -h
    - convertToFullMatrix.py -h

about:
  home: "https://github.com/donovan-h-parks/ExpressBetaDiversity"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: "license.txt"
  summary: "Taxon- and phylogenetic-based beta diversity measures."
  description: "Taxon- and phylogenetic-based beta diversity measures."
  doc_url: "https://github.com/donovan-h-parks/ExpressBetaDiversity"
  dev_url: "https://github.com/donovan-h-parks/ExpressBetaDiversity"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - aaronmussig
  identifiers:
    - doi:10.1038/ismej.2012.88
