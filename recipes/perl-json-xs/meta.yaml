{% set name = "perl-json-xs" %}
{% set version = "4.05" %}
{% set sha256 = "87f08065667a175e8c484d89c51366c08c686609017a68d186fbcbe833f1f958" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/M/ML/MLEHMANN/JSON-XS-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}

  host:
    - perl
    - perl-extutils-makemaker
    - perl-types-serialiser
    - perl-canary-stability
    - perl-common-sense

  run:
    - perl
    - perl-types-serialiser
    - perl-common-sense

test:
  imports:
    - JSON::XS

about:
  home: https://metacpan.org/pod/JSON::XS
  license_file: COPYING
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  summary: 'JSON serialising/deserialising, done correctly and fast'

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
