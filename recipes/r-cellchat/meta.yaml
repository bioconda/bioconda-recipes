{% set version = "2.1.2" %}

package:
  name: r-cellchat
  version: {{ version|replace("-", "_") }}

source:
  url: https://github.com/jinworks/CellChat/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 2ae82d85cb61b55d890a22ebee7ae1a95e191ca0a3275a0d7c1577e1ce4091fb

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cross-r-base {{ r_base }}  # [build_platform != target_platform]
  host:
    - r-base >=4.3
    - r-rcpp
    - r-rcppeigen
    - r-dplyr
    - r-ggplot2
    - r-igraph
    - r-nmf >=0.23.0
    - r-circlize
    - r-future
    - r-future.apply
    - r-pbapply
    - r-irlba
    - r-ggalluvial
    - r-svglite
    - r-stringr >=1.5.0
    - r-ggrepel
    - r-cowplot
    - r-rspectra
    - r-reticulate
    - r-sna
    - r-fnn
    - r-patchwork
    - r-ggpubr
    - r-ggnetwork
    - r-plotly
    - r-shiny
    - r-bslib
    - bioconductor-biocneighbors
    - bioconductor-complexheatmap
    - umap-learn
  run:
    - r-base >=4.3
    - r-rcpp
    - r-rcppeigen
    - r-dplyr
    - r-ggplot2
    - r-igraph
    - r-nmf >=0.23.0
    - r-circlize
    - r-future
    - r-future.apply
    - r-pbapply
    - r-irlba
    - r-ggalluvial
    - r-svglite
    - r-stringr >=1.5.0
    - r-ggrepel
    - r-cowplot
    - r-rspectra
    - r-reticulate
    - r-sna
    - r-fnn
    - r-patchwork
    - r-ggpubr
    - r-ggnetwork
    - r-plotly
    - r-shiny
    - r-bslib
    - bioconductor-biocneighbors
    - bioconductor-complexheatmap
    - umap-learn
test:
  commands:
    - $R -e "library('CellChat')"

about:
  home: https://github.com/jinworks/CellChat
  license: GPL-3.0
  licence_file: https://github.com/jinworks/CellChat/blob/main/LICENSE
  summary: 'R toolkit for inference, visualization and analysis of cell-cell communication from single-cell and spatially resolved transcriptomics'

extra:
  recipe-maintainers:
    - Yuri-Kawahara

