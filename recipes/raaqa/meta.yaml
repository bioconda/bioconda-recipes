package:
  name: raaqa
  version: "0.2.0"

source:
  url: https://github.com/kuzsam/raaqa/archive/refs/tags/v0.2.0.tar.gz
  sha256: 0cdea6139d765cc7368ee8a3dc6c227472f81cc16a29852e09d96e9786af2a30

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  run_exports:
    - {{ pin_subpackage('raaqa', max_pin="x.x") }}

requirements:
  host:
    - python >=3.10,<3.14
    - pip
    - setuptools
  run:
    - python >=3.10,<3.14
    - pysam >=0.22.0
    - matplotlib-base >=3.8
    - pandas >=2.0
    - numpy >=1.26

test:
  commands:
    - hese --help
    - visualise --help
    - mapq_softclip --help

about:
  home: https://github.com/kuzsam/raaqa
  license: MIT
  license_file: LICENSE
  summary: "Read Alignment-based Assembly Quality Assessment"

extra:
  recipe-maintainers:
    - kuzsam
  skip-lints:
    - should_be_noarch_generic
