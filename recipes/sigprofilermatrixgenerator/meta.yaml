{% set name = "SigProfilerMatrixGenerator" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: 219266e4e859b4484bd33032bbd79c7f64affc7f6404187c2ebbe5ad5d42c79f

build:
  entry_points:
    - SigProfilerMatrixGenerator=SigProfilerMatrixGenerator.scripts.SigProfilerMatrixGenerator_CLI:main_function
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION={{ version }} {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=69
    - setuptools-scm >=8
    - wheel
  run:
    - python >=3.9
    - matplotlib-base >=2.2.2
    - sigprofilerplotting >=1.4.1
    - statsmodels >=0.9.0
    - numpy >=2.0.0
    - pandas >=2.0.0
    - scipy >=1.12.0

test:
  imports:
    - SigProfilerMatrixGenerator
  commands:
    - SigProfilerMatrixGenerator install --help

about:
  home: https://github.com/AlexandrovLab/SigProfilerMatrixGenerator
  summary: "SigProfiler matrix generator tool."
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/AlexandrovLab/SigProfilerMatrixGenerator
