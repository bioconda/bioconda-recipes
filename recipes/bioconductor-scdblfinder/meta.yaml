{% set version = "1.26.7" %}
{% set name = "scDblFinder" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: d47fa77c4de6c247e2ae7e53c50f0116

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-scdblfinder", max_pin="x.x") }}'
  noarch: generic

# Suggests: BiocStyle, knitr, rmarkdown, testthat, scRNAseq, circlize, ComplexHeatmap, ggplot2, dplyr, viridisLite, mbkmeans
requirements:

  host:
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocneighbors >=2.6.0,<2.7.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biocsingular >=1.28.0,<1.29.0
    - bioconductor-bluster >=1.22.0,<1.23.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-genomeinfodb >=1.48.0,<1.49.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-rsamtools >=2.28.0,<2.29.0
    - bioconductor-rtracklayer >=1.72.0,<1.73.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-scater >=1.40.2,<1.41.0
    - bioconductor-scran >=1.40.0,<1.41.0
    - bioconductor-scrapper >=1.6.3,<1.7.0
    - bioconductor-scuttle >=1.22.0,<1.23.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-igraph
    - r-mass
    - r-matrix
    - r-xgboost

  run:
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocneighbors >=2.6.0,<2.7.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biocsingular >=1.28.0,<1.29.0
    - bioconductor-bluster >=1.22.0,<1.23.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-genomeinfodb >=1.48.0,<1.49.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-rsamtools >=2.28.0,<2.29.0
    - bioconductor-rtracklayer >=1.72.0,<1.73.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-scater >=1.40.2,<1.41.0
    - bioconductor-scran >=1.40.0,<1.41.0
    - bioconductor-scrapper >=1.6.3,<1.7.0
    - bioconductor-scuttle >=1.22.0,<1.23.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-igraph
    - r-mass
    - r-matrix
    - r-xgboost

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: GPL-3 + file LICENSE
  summary: scDblFinder
  description: The scDblFinder package gathers various methods for the detection and handling of doublets/multiplets in single-cell sequencing data (i.e. multiple cells captured within the same droplet or reaction volume). It includes methods formerly found in the scran package, the new fast and comprehensive scDblFinder method, and a reimplementation of the Amulet detection method for single-cell ATAC-seq.
  license_file: LICENSE

