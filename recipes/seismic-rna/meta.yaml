{% set name = "seismic-rna" %}
{% set version = "0.26.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/rouskinlab/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 2aae1c5390ec1a1f159f43543a207a714de96800f2c49d3fa44b9b85f721e603

build:
  number: 0
  skip: True  # [py < 313 or py >= 314]
  script:
    - export LDFLAGS=$(echo "${LDFLAGS}" | sed 's/-Wl,--version//g')
    - {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  entry_points:
    - seismic = seismicrna.main:cli
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - meson-python >=0.15.0
    - pip
  run:
    - python
    - bowtie2 >=2.5.5,<3
    - fastp >=1.3.6,<2
    - rnastructure >=6.6,<7
    - samtools >=1.24,<2
    - seqkit >=2.13.0,<3
    - viennarna >=2.7.2,<3
    - brotli-python >=1.2.0,<2
    - click >=8.4.2,<9
    - fastqsplitter >=1.2.0,<2
    - jgo >=3.1.0,<4
    - jinja2 >=3.1.6,<4
    - matplotlib-base >=3.8,<3.11
    - networkx >=3.6.1,<4
    - numba >=0.67.0,<1
    - numpy >=2.5.2,<3
    - pandas >=3.0.5,<4
    - plotly >=6.0.0,<8
    - pyahocorasick >=2.2.0,<3
    - pyyaml >=6.0.3,<7
    - scipy >=1.13.0,<2
    - tqdm >=4.70.0,<5
    - maven >=3.3.9
    - openjdk >=21.0

test:
  imports:
    - seismicrna

about:
  home: "https://github.com/rouskinlab/seismic-rna"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: LICENSE
  license_url: "https://www.gnu.org/licenses/gpl-3.0.html"
  summary: "SEISMIC-RNA software by the Rouskin Lab."
  dev_url: "https://github.com/rouskinlab/seismic-rna"
  doc_url: "https://rouskinlab.github.io/seismic-rna"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
