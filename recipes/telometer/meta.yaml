{% set name = "telometer" %}
{% set version = "2.0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/telometer-{{ version }}.tar.gz
  sha256: 4ce3c60d534bd12d3ccebd47f04a89c7baf46b5142c98b5ed224c5bd110161b9

build:
  number: 0
  noarch: python
  entry_points:
    - telometer = telometer.telometer:run_telometer
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools >=61,<76
  run:
    - python >=3.8
    - numpy
    - pandas
    - pysam
    - regex
    - scipy
    - samtools
    - minimap2

test:
  imports:
    - telometer
  commands:
    - telometer --help

about:
  home: "https://github.com/santiago-es/Telometer"
  license: MIT
  license_family: MIT
  license_file: "LICENSE.txt"
  summary: "A simple regular expression based method for measuring individual, chromosome-specific telomere lengths from long-read sequencing data."
  dev_url: "https://github.com/santiago-es/Telometer"

extra:
  recipe-maintainers:
    - santiago-es
