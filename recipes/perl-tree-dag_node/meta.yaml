package:
  name: perl-tree-dag_node
  version: "1.38"

source:
  url: https://cpan.metacpan.org/authors/id/R/RS/RSAVAGE/Tree-DAG_Node-1.38.tgz
  sha256: 6c812ff1a92efef4fc45af5995469fe88d5358a89215b4f18e1f6470a17e5f59

build:
  noarch: generic
  number: 0
  run_exports:
