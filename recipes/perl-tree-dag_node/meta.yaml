package:
  name: perl-tree-dag_node
  version: "1.36"

source:
  url: https://cpan.metacpan.org/authors/id/R/RS/RSAVAGE/Tree-DAG_Node-1.36.tgz
  sha256: 4cfe3582937aee324400250816fc45638088e2ca9bf4bf9c0bf2a553715772de

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage('perl-tree-dag_node', max_pin="x") }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker >=7.7
    - perl-file-slurper >=0.014
  run:
    - perl
    - perl-extutils-makemaker >=7.7
    - perl-file-slurper >=0.014

test:
  # Perl 'use' tests
  imports:
    - Tree::DAG_Node

about:
  home: http://metacpan.org/pod/Tree-DAG_Node
  license: artistic_2
  summary: 'An N-ary tree.'
