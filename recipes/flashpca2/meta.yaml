package:
  name: flashpca2
  version: "2.0"

source:
  - url: https://github.com/gabraham/flashpca/archive/refs/tags/v2.0.tar.gz
    sha256: e50955e2fbe9aa77fa656900e2468622aeae7e56ca026071fe1087583aa3d518
    patches:
      - fix-spectra-include.patch
      - fix-const-correctness.patch
      - fix-macos-dynamic-boost.patch
  - url: https://github.com/yixuan/spectra/archive/v0.8.1.tar.gz
    sha256: 339ae9221309a128b8d937ca59b77d9b30aeceacb4ef2d2df13f6f7cde7fa3f3
    folder: spectra-0.8.1

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('flashpca2', max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
  host:
    - libboost-devel
    - eigen 3.4.*

test:
  commands:
    - flashpca --help

about:
  home: https://github.com/gabraham/flashpca
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: Fast principal component analysis of SNP data (FlashPCA2)
  description: |
    FlashPCA performs fast principal component analysis (PCA) of
    large-scale genome-wide SNP data using randomised algorithms
    and the Spectra library.

extra:
  recipe-maintainers:
    - dbaku42
  identifiers:
    - biotools:flashpca
