{% set name = "typesine" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mobilome/TypeSINE/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 99246a1bbae992b2f0ea4a4432d99455dbcb397b2b8dd4df91ab1a560ce6be9c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - pandas >=1.3
    - bwa-mem2
    - samtools
    - bedtools

test:
  commands:
    - typesine --version

about:
  home: https://github.com/mobilome/TypeSINE
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Find and genotype SINE RIP loci from short-read sequencing data.
  dev_url: https://github.com/mobilome/TypeSINE

extra:
  recipe-maintainers:
    - mobilome