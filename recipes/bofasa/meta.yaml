{% set name = "bofasa" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://github.com/raufs/bofasa/archive/refs/tags/v{{ version }}.tar.gz
    sha256: f09d575f2386f109a5cbb30eda478f5cf27b8b8fbc74f727c2ac353ea0d0ea68

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('bofasa', max_pin="x") }}

requirements:
  host:
    - python
    - setuptools
    - pip
  run:
    - python>=3.9
    - genomad
    - setuptools
    - biopython
    - pip
    - orthofinder=2.5.5
    - diamond
    - scipy
    - slclust
    - ete3
    - prodigal
    - pyrodigal
    - scipy
    - pyhmmer=0.11.1
    - genomad=1.8.1
    - curl
    - rich-argparse
    - tqdm
    - plotly
    - slclust
    - pandas
    - xlsxwriter
    - hmmer
    - trimal
    - muscle=5.1
    - hmmer
    - xgboost=2.1.3
    - fasttree
test:
  commands:
    - bofasa -h

about:
  home: "https://github.com/raufs/bofasa"
  license: "BSD-3-Clause"
  license_family: BSD
  summary: "bofasa: bacterial orthology finding and syntenic analysis"
  
extra:
  additional-platforms:
    - osx-arm64
    - linux-aarch64
  recipe-maintainers:
    - raufs
