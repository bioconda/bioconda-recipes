{% set version = "1.19.0" %}
{% set name = "scAnnotatR" %}
{% set bioc = "3.24" %}

package:
  name: bioconductor-{{ name|lower }}
  version: {{ version }}

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  sha256: 78425529c2f7ad1b91a7a2ece59ad67738eca51c065bfc5c73f1d8665740b32a

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: {{ pin_subpackage('bioconductor-scannotatr', max_pin="x.x") }}

# Suggests: knitr, rmarkdown, scRNAseq, testthat
requirements:
  host:
    - bioconductor-annotationhub >=4.0.0,<4.1.0
    - bioconductor-singlecellexperiment >=1.32.0,<1.33.0
    - bioconductor-summarizedexperiment >=1.40.0,<1.41.0
    - r-ape
    - r-base
    - r-caret
    - r-data.tree
    - r-dplyr
    - r-e1071
    - r-ggplot2
    - r-kernlab
    - r-proc
    - r-rocr
    - r-seurat
  run:
    - bioconductor-annotationhub >=4.0.0,<4.1.0
    - bioconductor-singlecellexperiment >=1.32.0,<1.33.0
    - bioconductor-summarizedexperiment >=1.40.0,<1.41.0
    - r-ape
    - r-base
    - r-caret
    - r-data.tree
    - r-dplyr
    - r-e1071
    - r-ggplot2
    - r-kernlab
    - r-proc
    - r-rocr
    - r-seurat

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: "https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html"
  license: MIT
  license_family: MIT
  summary: "Pretrained learning models for cell type prediction on single cell RNA-sequencing data."
  description: "The package comprises a set of pretrained machine learning models to predict basic immune cell types. This enables all users to quickly get a first annotation of the cell types present in their dataset without requiring prior knowledge. scAnnotatR also allows users to train their own models to predict new cell types based on specific research needs."
  license_file: LICENSE
  doc_url: "https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html"
