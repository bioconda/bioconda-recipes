{% set name = "libgab" %}
{% set version = "1.1.0" %}

package:
  name:  {{ name }}
  version: {{ version }}

source:
  url: "https://github.com/grenaud/{{ name }}/archive/{{ version }}.tar.gz"
  sha256: 401b6f8e11c012f2743d707ede28520da386bbfcfb516fff19015b2314c11b60

build:
  number: 0
  skip: True  # [osx]
  run_exports:
    - {{ pin_subpackage('libgab', max_pin='x.x') }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
  host:
    - zlib
    - bamtools
    - htslib    
  run:
    - zlib
    - bamtools
    - htslib

test:
  commands:
    - test -f $PREFIX/lib/libgab/libgab.a

about:
  home: "https://github.com/grenaud/libgab"
  license: GPL
  summary: "Several C++ subroutines useful for bioinformatics"

extra:
  recipe-maintainers:
    - grenaud
