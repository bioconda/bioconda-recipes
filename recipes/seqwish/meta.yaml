{% set name = "seqwish" %}
{% set version = "0.7.12" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/pangenome/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 90d1525c14d6003ff2e498f29b8cca31e947216536230908a6078d54b840372c

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}

test:
  commands:
    - seqwish --help
    - seqwish --version

about:
  home: https://github.com/pangenome/seqwish
  license: MIT
  license_file: LICENSE
  summary: Alignment to variation graph inducer

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - AndreaGuarracino
