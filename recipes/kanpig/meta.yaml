{% set version = "2.1.0" %}
{% set name = "kanpig" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ACEnglish/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 33c968b9f6913ddbd2ca254a6e973836d7c0652b88015b0efbd8a0a194c49fab

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler("cxx") }}
    - {{ stdlib("c") }}
    - make
    - {{ compiler("rust") }}
    - cargo-bundle-licenses

test:
  commands:
    - kanpig --help

about:
  home: https://github.com/ACEnglish/kanpig
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "A fast tool for genotyping structural variants with long-reads."
  dev_url: https://github.com/ACEnglish/kanpig
  doc_url: https://github.com/ACEnglish/kanpig/wiki

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - ldenti
