{% set name = "moments" %}
{% set version = "1.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-popgen/{{ name }}_popgen-{{ version }}.tar.gz
  sha256: 6576b0940e7045f7f1043ca9f264910d91ea49befc830ce186e136dc5248bef1
  patches:
    - setup.patch

build:
  number: 0
  skip: True  # [py > 314 or py < 311]
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  script:
    - export CFLAGS="${CFLAGS} -O3 -Wno-int-conversion -Wno-implicit-function-declaration"
    - rm -f moments/*.c moments/LD/*.c
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - pkg-config
  host:
    - python
    - pip
    - setuptools-scm
    - numpy
    - cython >=3.1
  run:
    - python
    - numpy
    - scipy >=1.3,<1.17
    - mpmath >=1.0,<1.4
    - demes >=0.2

test:
  imports:
    - moments

about:
  home: "https://github.com/MomentsLD/moments"
  license: MIT
  license_family: MIT
  license_file: "LICENSE.txt"
  summary: "Evolutionary inference using SFS and LD statistics."
  dev_url: "https://github.com/MomentsLD/moments"
  doc_url: "https://momentsld.github.io/moments"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1534/genetics.117.200493
    - doi:10.1371/journal.pgen.1008204
    - doi:10.1093/molbev/msz265
