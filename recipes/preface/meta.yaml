{% set name = "preface" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/CenterForMedicalGeneticsGhent/PREFACE/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 0dd0803196eb5947e01e6a3266fb44c999001f0c07a11a2a2c57a16267f98268

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  entry_points:
    - preface = preface.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.14
    - pip
    - setuptools >=75.0
    - wheel
  run:
    - python >=3.14
    - pytorch >=2.14
    - onnx >=1.23
    - onnxscript >=0.7
    - onnxruntime >=1.31
    - typer >=0.15
    - pyyaml >=6.0
    - jsonschema >=4.23
    - numpy >=2.5
    - scipy >=1.18
    - matplotlib-base >=3.11
    - pysam >=0.24.1,<0.25

test:
  imports:
    - preface
    - preface.cli
    - preface.io
    - preface.models
  commands:
    - preface --version
    - preface --help
    - preface lint --help
    - preface train --help
    - preface predict --help

about:
  home: https://github.com/CenterForMedicalGeneticsGhent/PREFACE
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: "PREdict FetAl ComponEnt (PREFACE) - Fetal fraction prediction from shallow whole-genome NIPT sequencing data"
  dev_url: https://github.com/CenterForMedicalGeneticsGhent/PREFACE
  doc_url: https://github.com/CenterForMedicalGeneticsGhent/PREFACE#readme

extra:
  recipe-maintainers:
    - matthdsm
  identifiers:
    - doi:10.1002/pd.5508
