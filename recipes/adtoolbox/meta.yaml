{% set name = "adtoolbox" %}
{% set version = "1.1.16" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 91c17207b4d7ba9dab0af2a077d0b72503e5d8a241ba1dd00a0f908c73e9fecb

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=3.11
    - numpy >=1.22.4
    - scipy >=1.8.1
    - polars >=0.20.27
    - plotly >=5.8.0
    - nbformat >=4.2.0
    - requests >=2.27.1
    - rich >=12.4.4
    - click >=8.1.7
    - fastp
    - cutadapt
    - bioconductor-dada2
    - vsearch
    - mmseqs2
    - sra-tools
    - ncbi-datasets-cli

test:
  imports:
    - adtoolbox
    - adtoolbox.core
    - adtoolbox.adm
    - adtoolbox.configs
    - adtoolbox.optimize
  commands:
    - adtoolbox --help
    - adtoolbox --version
    - adtoolbox metagenomics process --help
    - adtoolbox adm e-adm --help
    - fastp --version
    - cutadapt --version
    - vsearch --version
    - mmseqs version

about:
  home: https://github.com/chan-csu/ADToolbox
  dev_url: https://github.com/chan-csu/ADToolbox
  doc_url: https://chan-csu.github.io/ADToolbox/
  summary: Modeling and optimization of anaerobic digestion, from sequencing reads to ADM1/e-ADM simulation
  description: |
    ADToolbox turns metagenomics evidence into model-ready anaerobic digestion
    simulations. It maps 16S amplicon data through GTDB and a curated
    enzyme-to-reaction database, or profiles shotgun reads directly, to produce
    the microbial COD allocation an extended ADM (e-ADM) model needs -- then
    simulates, visualizes, and calibrates the model against experimental data.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ParsaGhadermazi
