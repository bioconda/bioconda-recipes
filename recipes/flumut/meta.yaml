{% set name = "flumut" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/flumut-{{ version }}.tar.gz
  sha256: 980e8454198ebf18865c11ea0faf41d5028f2852a84789e127f6800ae1030cb7

build:
  run_exports: 
    - {{ pin_subpackage(name, max_pin="x.x") }}
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  number: 0

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61.2
  run:
    - python >=3.10
    - click >=8.0.0
    - flumutdb >=6.0
    - biopython >=1.87
    - openpyxl >=3.1.2
    - peewee >=3.17
    - importlib-resources >=1.3

test:
  imports:
    - flumut
  commands:
    - flumut --help
    - flumut --all-versions

about:
  home: https://github.com/izsvenezie-virology/FluMut
  summary: "A tool to search for molecular markers with potential impact on the biological characteristics of Influenza A viruses of the A(H5N1) subtype."
  license: "AGPL-3.0-or-later"
  license_family: AGPL
  license_file: LICENSE
  dev_url: https://github.com/izsvenezie-virology/FluMut

extra:
  recipe-maintainers:
    - EdoardoGiussani
    - AlexSartori
