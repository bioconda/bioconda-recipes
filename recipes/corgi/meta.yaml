{% set name = "corgi" %}
{% set version = "0.5.10" %}
{% set pypiname = "bio-corgi" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.io/packages/source/{{ pypiname[0] }}/{{ pypiname }}/bio_corgi-{{ version }}.tar.gz
    sha256: 873ebbb4d2e48c871a03cf9929122c7d768bcb7b7c37e4e747f62682f27b682f
  # The sdist on PyPI does not include the license file
  - url: https://raw.githubusercontent.com/rbturnbull/corgi/v{{ version }}/LICENSE
    sha256: bfe599db019eea60221221abc3efa3e5feab7ad50b9eaed68c24b77c021bdcc0

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - corgi = corgi.apps:Corgi.main
    - corgi-tools = corgi.apps:Corgi.tools
    - seqtree = corgi.seqtree:app
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.11,<3.15
    - uv-build >=0.13.0,<0.14
    - pip
  run:
    - python >=3.11,<3.15
    - torchapp >=0.5.9
    - numpy <2.0.0
    - biopython >=1.79
    - humanize >=3.10.0
    - pyarrow >=5.0.0
    - plotly >=5.3.1
    - appdirs >=1.4.4
    - beautifulsoup4 >=4.10.0
    - httpx >=0.20.0
    - cryptography >=36.0.1
    - pymysql >=1.0.2
    - termgraph >=0.5.3
    - pytorch >=2.0.0
    - hierarchicalsoftmax >=1.4.1
    - attrs >=23.1.0
    - polytorch >=0.1.3
    - seqbank >=0.4.0
    - multitax >=1.3.1

test:
  imports:
    - corgi
  commands:
    - corgi --help
    - corgi-tools --help
    - seqtree --help

about:
  home: https://github.com/rbturnbull/corgi
  dev_url: https://github.com/rbturnbull/corgi
  doc_url: https://rbturnbull.github.io/corgi/
  summary: Classifier for ORganelle Genomes Inter alia
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rbturnbull
    - vinisalazar
