{% set name = "corgi" %}
{% set version = "0.5.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/rbturnbull/corgi/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 2e3fd17e286a9ea32709578c09aac93b164284a7cf03c54a8946366eb278ac0e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.11,<3.15
    - uv-build >=0.13.0,<0.14
    - pip
  run:
    - python >=3.11,<3.15
    - torchapp >=0.5.9
    - numpy <2.0.0
    - biopython >=1.79
    - humanize >=3.10.0
    - pyarrow >=5.0.0
    - plotly >=5.3.1
    - appdirs >=1.4.4
    - beautifulsoup4 >=4.10.0
    - httpx >=0.20.0
    - cryptography >=36.0.1
    - pymysql >=1.0.2
    - termgraph >=0.5.3
    - pytorch >=2.0.0
    - hierarchicalsoftmax >=1.4.1
    - attrs >=23.1.0
    - polytorch >=0.1.3
    - seqbank >=0.4.0
    - multitax >=1.3.1

test:
  imports:
    - corgi
  commands:
    - corgi --help
    - corgi-tools --help
    - seqtree --help

about:
  home: https://github.com/rbturnbull/corgi
  dev_url: https://github.com/rbturnbull/corgi
  doc_url: https://rbturnbull.github.io/corgi/
  summary: Classifier for ORganelle Genomes Inter alia
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rbturnbull
    - vinisalazar
