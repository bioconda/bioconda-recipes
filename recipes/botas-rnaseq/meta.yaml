{% set version = "0.1.3" %}
{% set python_min = "3.10" %}

package:
  name: botas-rnaseq
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/b/botas-rnaseq/botas_rnaseq-{{ version }}.tar.gz
  sha256: b38b8d0ad8748f64abe6a122aaf340d4883ba17a4e92ff5419cc3df4c36da113

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}

  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77
    - wheel

  run:
    - python >={{ python_min }}
    - pysam >=0.22
    - edlib >=1.3.9
    - biopython >=1.81

test:
  imports:
    - botas
    - botas.quantify._core_fast
  commands:
    - pip check
    - botas --version
    - botas --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/clabe-wekesa/botas
  summary: "Bacterial Operon-aware Transcriptome Alignment System"
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/clabe-wekesa/botas
  dev_url: https://github.com/clabe-wekesa/botas

extra:
  recipe-maintainers:
    - clabe-wekesa
