{% set version = "0.11.0" %}

package:
  name: galaxy-ml
  version: {{ version }}

source:
  url: https://github.com/goeckslab/Galaxy-ML/archive/refs/tags/release_v{{ version }}.tar.gz
  sha256: 644b9b58329a387c8229dddf1f1e87d3f12669af5be6bf1bdcaf78d799c76eea

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('galaxy-ml', max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vvv
  #skip: True  # [osx]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - python 3.12.*
    - cython ==3.3.0
    - pip
    - setuptools ==84.0.0
    - wheel ==0.48.0
    - numpy ==2.5.3
  run:
    - python >=3.12,<3.13
    - pyfaidx ==0.9.0.4
    - pytabix ==0.1
    - tabix
    - htslib
    - scipy ==1.18.1
    - numpy ==2.4.6
    - joblib ==1.6.0
    - asteval ==1.0.10
    - pandas ==3.0.6
    - scikit-learn ==1.9.1
    - xgboost ==3.4.1
    - mlxtend ==0.25.0
    - skrebate ==0.62
    - imbalanced-learn ==0.14.2
    - keras ==3.15.1
    - keras-preprocessing ==1.1.2
    - tensorflow ==2.21.0
    - plotly ==7.1.0
    - matplotlib-base ==3.10.8
    - scikit-optimize ==0.10.2
    - h5py ==3.14.0
    - six ==1.17.0
    - bleach ==6.4.0


test:
  imports:
    - galaxy_ml
    # tensorflow can't be tested in docker at the moment
    #- galaxy_ml.keras_galaxy_models
    - galaxy_ml.iraps_classifier
    - galaxy_ml.model_persist
    - galaxy_ml.model_validations
    - galaxy_ml.preprocessors
    - galaxy_ml.utils
    - galaxy_ml.externals.selene_sdk.sequences._sequence
  commands:
    - command -v tabix
    - command -v bgzip

about:
  home: https://github.com/goeckslab/Galaxy-ML
  summary: APIs for Galaxy machine learning tools
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - qiagu
