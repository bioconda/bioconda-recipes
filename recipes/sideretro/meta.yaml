{% set version = "1.14.0" %}
{% set sha256 = "cf19d6835b346f5bbaf7923e2af9d962c9bd154e03032c0b664b14e1c0dc28e8" %}

package:
  name: sideretro
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("sideretro", max_pin="x.x.x") }}

source:
  url: https://github.com/galantelab/sideRETRO/archive/refs/tags/{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - fix-macos.patch

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - meson >=0.58.0
    - ninja
  host:
    - htslib
    - libsqlite
    - zlib
  run:
    - htslib
    - libsqlite
    - zlib

test:
  commands:
    - sider --help

about:
  home: https://github.com/galantelab/sideRETRO
  license: GPL-3.0-only
  license_file: COPYING
  license_family: GPL3
  summary: "A pipeline for detecting Somatic Insertion of DE novo RETROcopies"

extra:
  identifiers:
    - doi:10.1093/bioinformatics/btaa689
