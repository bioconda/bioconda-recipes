package:
  name: gfviewer
  version: "2.0.1"

source:
  url: https://github.com/sakshar/GFViewer/archive/refs/tags/v2.0.1.tar.gz
  sha256: fa01ec67fdadcdb2c60504bc015797d9ab7724d3156754c61fb8bda5d9f5f6eb

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv"
  run_exports:
    - {{ pin_subpackage("gfviewer", max_pin="x") }}

requirements:
  host:
    - python >=3.8,<3.13  # Restrict Python version
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.8,<3.13  # Restrict Python version
    - biopython
    - pandas
    - matplotlib-base
    - reportlab
    - pypdf2
    - openpyxl

test:
  imports:
    - gfviewer
  commands:
    - gfviewer --help

about:
  home: https://github.com/sakshar/GFViewer
  license: MIT
  license_file: LICENSE
  summary: "A bioinformatics tool for visualizing the localization of multi-gene families across the genome of a given organism."
  description: |
    This tool is designed for processing genomic data, visualizing chromosomes,
    and localizing multi-gene families using Biopython and Matplotlib.

extra:
  recipe-maintainers:
    - sakshar
