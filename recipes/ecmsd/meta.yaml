{% set name = "ECMSD" %}
{% set version = "1.3.2" %}
{% set sha256 = "a636c7e25ddd9aff53e734e179e2df9bc5fd313946af309a5f56ab6329a477fc" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://github.com/capoony/ECMSD/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage("ecmsd", max_pin="x") }}

requirements:
  run:
    - minimap2
    - bbmap
    - r-base
    - r-tidyverse
    - r-gridextra
    - r-data.table
    - pigz
    - wget
    - python >=3.6
    - numpy

test:
  commands:
    - ECMSD --version
    - ECMSD --help

about:
  home: https://github.com/capoony/ECMSD
  dev_url: https://github.com/capoony/ECMSD
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Efficient Comprehensive Mitochondrial Sequence Detection Pipeline"
  description: |
    ECMSD detects and taxonomically classifies mitochondrial sequences
    from high-throughput sequencing data using minimap2 alignment and RMUS scoring.

extra:
  recipe-maintainers:
    - capoony
    - SarahSaadain
