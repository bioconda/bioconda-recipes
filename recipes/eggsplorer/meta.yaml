{% set name = "eggsplorer" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/vebaev/eggsplorer/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 51b126de282d1d7ae418bbb98b8552adfbd872a34ea34643ba9990f83cff81e5

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - eggsplorer = eggsplorer.eggsplorer:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=77
  run:
    - python >=3.9
    - plotly >=5

test:
  imports:
    - eggsplorer
  commands:
    - eggsplorer --help
    - eggsplorer --version

about:
  home: https://github.com/vebaev/eggsplorer
  summary: "Interactive HTML report of eggNOG-mapper functional annotations of bacterial genomes."
  description: |
    Eggsplorer turns an eggNOG-mapper .emapper.annotations file into a self-contained,
    offline HTML report (COG and GO profiles, EC, TC, CAZy and Pfam summaries,
    KEGG-Decoder metabolic function scores, a cell overview and nitrogen, sulfur and
    carbon cycle diagrams) and optional TSV summary tables.
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - fonts/OFL.txt
    - third_party/kegg_decoder/LICENSE
  dev_url: https://github.com/vebaev/eggsplorer
  doc_url: https://github.com/vebaev/eggsplorer/blob/v{{ version }}/README.md

extra:
  recipe-maintainers:
    - vebaev
