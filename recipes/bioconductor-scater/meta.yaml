{% set version = "1.40.2" %}
{% set name = "scater" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name }}/bioconductor-{{ name }}_{{ version }}_src_all.tar.gz
  md5: e004a1f79fe8e0f6ffa7697881a4336a

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-scater", max_pin="x.x") }}'
  noarch: generic

# Suggests: BiocStyle, DelayedMatrixStats, snifter, densvis, cowplot, biomaRt, knitr, scRNAseq, robustbase, rmarkdown, testthat, Biobase, scattermore, ggrastr, MASS
requirements:

  host:
    - bioconductor-beachmat >=2.28.0,<2.29.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocneighbors >=2.6.0,<2.7.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biocsingular >=1.28.0,<1.29.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-scuttle >=1.22.0,<1.23.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-sparsearray >=1.12.3,<1.13.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-ggbeeswarm
    - r-ggplot2
    - r-ggrepel
    - r-matrix
    - r-pheatmap
    - r-rcolorbrewer
    - r-rcppml
    - r-rlang
    - r-rtsne
    - r-uwot
    - r-viridis

  run:
    - bioconductor-beachmat >=2.28.0,<2.29.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocneighbors >=2.6.0,<2.7.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biocsingular >=1.28.0,<1.29.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-scuttle >=1.22.0,<1.23.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-sparsearray >=1.12.3,<1.13.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-ggbeeswarm
    - r-ggplot2
    - r-ggrepel
    - r-matrix
    - r-pheatmap
    - r-rcolorbrewer
    - r-rcppml
    - r-rlang
    - r-rtsne
    - r-uwot
    - r-viridis

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: GPL-3
  summary: Single-Cell Analysis Toolkit for Gene Expression Data in R
  description: A collection of tools for doing various analyses of single-cell RNA-seq gene expression data, with a focus on quality control and visualization.
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  identifiers:
    - biotools:scater
  parent_recipe:
    name: bioconductor-scater
    path: recipes/bioconductor-scater
    version: 1.34.1

