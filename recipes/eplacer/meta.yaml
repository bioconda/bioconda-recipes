package:
  name: eplacer
  version: 0.1.0

source:
  url: https://files.pythonhosted.org/packages/8a/01/b2b16a01def6ae956545445942501e79fa1040910da2686c342721ef657f/eplacer-0.1.0.tar.gz
  sha256: 91a17596dcf9d2e6e990ee255e3d55b76e35e9dfde0abb6a8963d588bb921b5f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - eplacer = eplacer.__main__:main
  run_exports:
    - {{ pin_subpackage('eplacer', max_pin="x.x") }}
    
requirements:
  host:
    - python >=3.12
    - pip
    - setuptools
  run:
    - python >=3.12
    - pytorch >=2.5
    - torchvision
    - torchinfo
    - blast >=2.16
    - mafft
    - trimal
    - entrez-direct
    - ncbi-acc-download
    - numpy
    - pandas
    - scipy
    - scikit-learn
    - networkx
    - shapely
    - sympy
    - tqdm
    - pyyaml
    - requests
    - click
    - docopt
    - pygeohash

test:
  imports:
    - eplacer
  commands:
    - eplacer --help

about:
  home: https://github.com/NEFSC/PEMAD-PBB-ePlacer
  license: Public Domain
  license_file: LICENSE.txt
  summary: 'A deep learning approach to taxonomic assignment'

extra:
  recipe-maintainers:
    - ccpowers-NOAA