package:
  name: eplacer
  version: 0.1.0

source:
  url: https://files.pythonhosted.org/packages/8a/01/b2b16a01def6ae956545445942501e79fa1040910da2686c342721ef657f/eplacer-0.1.0.tar.gz
  sha256: c0303ed7e772a011290cd5eca8b3d194407819895ca874376cf46a518e79ba78

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools
  run:
    - python >=3.12
    - pytorch >=2.5
    - torchvision
    - torchinfo
    - blast >=2.16
    - mafft
    - trimal
    - entrez-direct
    - ncbi-acc-download
    - numpy
    - pandas
    - scipy
    - scikit-learn
    - networkx
    - shapely
    - matplotlib
    - sympy
    - tqdm
    - pyyaml
    - requests
    - click
    - docopt
    - pygeohash

test:
  imports:
    - eplacer
  commands:
    - eplacer --help

about:
  home: https://github.com/yourusername/your-package
  license: Public Domain
  license_file: LICENSE.txt
  summary: 'A deep learning approach to taxonomic assignment'
