{% set package = "ucsc-chainantirepeat" %}
{% set program = "chainAntiRepeat" %}
{% set version = "502" %}
{% set sha256 = "38e29dbf7c1e6d49aaf358014960c5781fd59aa3b7b406dadc9557c98e895f22" %}

package:
  name: "{{ package }}"
  version: "{{ version }}"

source:
  url:
    - "https://hgdownload.soe.ucsc.edu/admin/exe/userApps.archive/userApps.v{{ version }}.src.tgz"
    - "https://hgdownload-euro.soe.ucsc.edu/admin/exe/userApps.archive/userApps.v{{ version }}.src.tgz"
  sha256: "{{ sha256 }}"
  patches:
    - 0001-include.patch
    - 0003-common.mk.patch
    - 0004-straw.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(package, max_pin=None) }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - libpng
    - libuuid
    - mysql-connector-c # [not arm64]
    - openssl
    - clangdev  # [osx]
    - rsync  # [osx]
    - libiconv
    - bzip2
    - liblzma-devel
    - zlib
    - libcurl
  run:
    # gzip called via fork so runtime only
    - gzip
    - libpng
    - libuuid
    - mysql-connector-c # [not arm64]

test:
  commands:
    # just check for existence and exec bit, because the individual packages have no unified behavior
    - test -x ${PREFIX}/bin/{{ program }}

about:
  home: "https://hgdownload.soe.ucsc.edu/admin/exe"
  license: "Varies; see https://genome.ucsc.edu/license"
  summary: "Get rid of chains that are primarily the results of repeats and degenerate DNA"
  dev_url: "https://github.com/ucscGenomeBrowser/kent"
  doc_url: "https://github.com/ucscGenomeBrowser/kent/blob/v{{ version }}_base/README"

extra:
  identifiers:
    - biotools:UCSC_Genome_Browser_Utilities
    - doi:10.1093/bib/bbs038
  additional-platforms:
    - linux-aarch64
    - osx-arm64
