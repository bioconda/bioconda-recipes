c_stdlib:
  - sysroot  # [linux]
  - macosx_deployment_target  # [osx]
c_stdlib_version:
  # Match Bioconda's Linux build image; activation calls the kernel directly.
  - '2.17'  # [linux]
  - '11.0'  # [osx]
MACOSX_DEPLOYMENT_TARGET:  # [osx]
  - '11.0'  # [osx]
# The native backend requires GNU C++, including on macOS. Conda's Darwin
# GNU compiler uses libc++; the macOS-only source patch selects that runtime.
cxx_compiler:  # [osx]
  - gxx  # [osx]
cxx_compiler_version:  # [osx]
  - '16'  # [osx]
