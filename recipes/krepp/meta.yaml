{% set name = "krepp" %}
{% set version = "0.12.0" %}
{% set sha256 = "bf89eb5774201d46d260e3a658cb285f0fb371d8aaa234c128a3bf55110425df" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/bo1929/krepp/releases/download/v{{ version }}/krepp-v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pkg-config
  host:
    - zlib
    - libcurl
    - libgomp      # [linux]
    - llvm-openmp  # [osx]
  run:
    - libgomp      # [linux]
    - llvm-openmp  # [osx]

test:
  source_files:
    - test/regression/data/query_contigs.fa
  commands:
    - krepp --help 2>&1 | grep -F "krepp version: v{{ version }}"
    - krepp index -i test/regression/data/query_contigs.fa -o smoke-index -k 19 -w 19 -h 9 -m 1 -r 0
    - krepp dist -i smoke-index -q test/regression/data/query_contigs.fa --no-multi -o smoke.tsv
    - >-
      awk -F '\t' '$1 == $2 && $3 == "0.00001" { exact[$1] = 1 }
      END { exit !(exact["contig0"] && exact["contig1"]) }' smoke.tsv

about:
  home: "https://github.com/bo1929/krepp"
  dev_url: "https://github.com/bo1929/krepp"
  license: MIT AND BSL-1.0
  license_family: MIT
  license_file:
    - LICENSE
    - LICENSE_1_0.txt
  summary: "krepp: a k-mer-based maximum pseudo-likelihood method for estimating read distances and genome-wide phylogenetic placement."

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1186/s13059-026-03999-y
    - doi:10.5281/zenodo.15466359
