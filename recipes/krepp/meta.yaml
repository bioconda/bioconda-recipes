{% set name = "krepp" %}
{% set version = "0.12.1" %}
{% set sha256 = "0f1cc26ef4e0c1381767e3637f60c29b7e9653cd7828954bf5a2641a6f523145" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/bo1929/krepp/releases/download/v{{ version }}/krepp-v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pkg-config
  host:
    - zlib
    - libcurl
    - libgomp      # [linux]
    - llvm-openmp  # [osx]
  run:
    - libgomp      # [linux]
    - llvm-openmp  # [osx]

test:
  commands:
    - >-
      krepp --help 2>&1 | grep -F "krepp version: v{{ version }}"
    - >-
      test_dir=$(mktemp -d) && trap 'rm -rf -- "$test_dir"' EXIT && cd "$test_dir"
    # The mulled container only receives the installed package.
    - >-
      printf '%s\n'
      '>contig0'
      'ATTACTATTTATAGGCATGAGTCTGGGCGCGCTTGCCAGCCAATAGATCGGTGGTCCGCCTAAGG'
      'GGCGGGGACGAACTACGGGCGAACTATAGATAGGCTTTGCATTGGTTTTTGTCATAAGGTCCAGT'
      'GACTTTGTTCGTGCGGTAAGCCCGATGGGCACAGAGGACTCCCCGTACTCCGCGAGAATTCTTAGC'
      'TATA'
      '>contig1'
      'GGTACAAACCGCCGGTTCTCCGGGTGCACATCTGCGGGTGCGGTACCCACTCGAGATACAGAGAT'
      'CCCAAATCCACGAACCATTTTCGATAGGGTTGTTGATGCTATTCAAGGGGCCCAGTTTAAATGGGT'
      'CAGGACTCCGGTCAACCGCGTGTTAGGGATATCGCAGAAGACTGTTTACGTCTAACGTGAATGGTC'
      'GTA'
      > smoke.fa
    - krepp index -i smoke.fa -o smoke-index -k 19 -w 19 -h 9 -m 1 -r 0
    - krepp dist -i smoke-index -q smoke.fa --no-multi -o smoke.tsv
    - >-
      LC_ALL=C awk -F '\t' '$1 == "contig0" || $1 == "contig1" {
        distance = $3 + 0;
        if (NF != 3 || $2 != $1 || $3 != sprintf("%.5f", distance) || distance < 0 || distance >= 0.01)
          bad = 1;
        if ($1 == "contig0") first++; else second++;
      } END { exit (bad || first != 1 || second != 1) }' smoke.tsv

about:
  home: "https://github.com/bo1929/krepp"
  dev_url: "https://github.com/bo1929/krepp"
  license: MIT AND BSL-1.0
  license_family: MIT
  license_file:
    - LICENSE
    - LICENSE_1_0.txt
  summary: "krepp: a k-mer-based maximum pseudo-likelihood method for estimating read distances and genome-wide phylogenetic placement."

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1186/s13059-026-03999-y
    - doi:10.5281/zenodo.15466359
