{% set name = "jcast" %}
{% set version = "0.4.0" %}
{% set sha256 = "bd5a4b4c6c6bdc52176b5b5ea9fddd1b79c9df8e501f52b1247bc68a2314d73f" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  entry_points:
    - jcast=jcast.main:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  run_exports:
    - {{ pin_subpackage('jcast', max_pin="x.x") }}

requirements:
  host:
    - pip
    - python >=3.11
    - setuptools >=77
  run:
    - python >=3.11
    - biopython >=1.78
    - gtfparse >=1.3
    - pandas >=1.5
    - numpy >=1.23.2
    - scipy >=1.9.2
    - requests >=2.20
    - platformdirs >=2.5
    - tqdm >=4
    - matplotlib-base >=3.6

test:
  imports:
    - jcast
  commands:
    - jcast --help

about:
  home: https://github.com/ed-lau/jcast
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: "Jcast retrieves splice junction information and translates into amino acids"
  dev_url: https://github.com/ed-lau/jcast
