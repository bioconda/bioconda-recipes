{% set name = "ervmancer" %}
{% set version = "1.0.1" %}
{% set sha256 = "ba79f02682e174e5ce76566294393e7176a6a286110144ebabce3ea23fc8044a" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/AuslanderLab/ERVmancer/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - ervmancer = ervmancer.main:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.9,<3.11
    - setuptools <82
  run:
    - python >=3.9,<3.11
    - bowtie2 >=2.4.2
    - samtools >=1.20
    - bedtools >=2.29.2
    - setuptools <82
    - numpy
    - pandas
    - tqdm
    - regex

test:
  commands:
    - ervmancer --help

about:
  home: "https://github.com/AuslanderLab/ervmancer"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Quantifies HERV short read RNA sequencing expression data."
  description: "ERVmancer quantifies Human Endogenous Retrovirus (HERV) short read RNA sequencing expression data by aligning short reads to a curated subset of HERVs and then resolves ambiguity in alignment using a pre-computed HERV phylogenetic tree."
  dev_url: "https://github.com/AuslanderLab/ervmancer"

extra:
  recipe-maintainers:
    - RNAPolymerase12
    - bryantduong
