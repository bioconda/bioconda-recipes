{% set name = "sRNA-TAPS" %}
{% set version = "0.1.0.post1" %}
package:
  name: {{ name|lower }}
  version: {{ version }}
source:
  url: https://pypi.io/packages/source/s/srna-taps/srna_taps-{{ version }}.tar.gz
  sha256: 6f2dd786e8e222ef2889a766730eb6bae41f63a4b0d1c8b35a86f3ff915313ad
build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  run_exports:
    - {{ pin_subpackage('srna-taps', max_pin="x.x") }}
requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - click >=8.0
    - pysam >=0.22
    - pandas >=2.1
    - numpy >=1.26
    - scipy >=1.12
    - statsmodels >=0.14
    - snakemake >=9,<10
    - jinja2 >=3.0
    - pyyaml >=6.0
    - rich >=13.0
    - matplotlib-base >=3.8
    - plotly >=5.18
    - scikit-learn >=1.4
    - umap-learn >=0.5
    - bowtie =1.3.1
    - samtools >=1.20
    - bcftools >=1.20
    - bedtools
    - htslib >=1.20
    - fastqc >=0.12.1
    - trim-galore >=0.6.10
    - multiqc >=1.21
test:
  imports:
    - srnataps
    - srnataps.cli
    - srnataps.caller
    - srnataps.annotate
    - srnataps.snp
    - srnataps.utils
  commands:
    - srnataps --version
    - srnataps --help
about:
  home: https://github.com/HenzelerB/sRNA-TAPS
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: TAPS-based m5C and hm5C detection pipeline for small RNA sequencing
  doc_url: https://github.com/HenzelerB/sRNA-TAPS#readme
  dev_url: https://github.com/HenzelerB/sRNA-TAPS
extra:
  recipe-maintainers:
    - HenzelerB
