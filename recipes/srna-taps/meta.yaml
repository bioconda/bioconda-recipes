{% set name = "sRNA-TAPS" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0]|lower }}/{{ name|lower }}/sRNA_TAPS-{{ version }}.tar.gz
  sha256: fd0d1a11438350fd1ff53e6d0179ec143f187a4994da1039aea0a6f9780e8ef5

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  entry_points:
    - srnataps = srnataps.cli:cli
  run_exports:
    - {{ pin_subpackage('srna-taps', max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - click >=8.0
    - pysam >=0.22
    - pandas >=2.1
    - numpy >=1.26
    - scipy >=1.12
    - statsmodels >=0.14
    - snakemake >=7.0
    - jinja2 >=3.0
    - pyyaml >=6.0
    - rich >=13.0
    - bowtie =1.3.1
    - samtools >=1.20
    - bcftools >=1.20
    - htslib >=1.20
    - fastqc >=0.12.1
    - trim-galore >=0.6.10
    - multiqc >=1.21

test:
  imports:
    - srnataps
    - srnataps.cli
    - srnataps.caller
    - srnataps.annotate
    - srnataps.snp
    - srnataps.utils
  commands:
    - srnataps --version
    - srnataps --help

about:
  home: https://github.com/HenzelerB/sRNA-TAPS
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: TAPS-based m5C and 5hmC detection pipeline for small RNA sequencing
  doc_url: https://github.com/HenzelerB/sRNA-TAPS#readme
  dev_url: https://github.com/HenzelerB/sRNA-TAPS

extra:
  recipe-maintainers:
    - HenzelerB
