{% set name = "captnseq-toolkit" %}
{% set version = "0.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/simonjeanneau/captnseq-toolkit/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 32e1443ae2bc9f42bcce649d591bdc2f6e4525a900fd5a173cf8e047aae5fc7b

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation
  entry_points:
    - captnseq-toolkit = captnseq_toolkit.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=3.9
    - numpy
    - pandas
    - scipy
    - matplotlib-base

test:
  imports:
    - captnseq_toolkit
    - captnseq_toolkit.cli
    - captnseq_toolkit.sam2sites
    - captnseq_toolkit.sites2genes
    - captnseq_toolkit.essentiality
  commands:
    - captnseq-toolkit --version
    - captnseq-toolkit --help
    - captnseq-toolkit sam2sites --help
    - captnseq-toolkit sites2genes --help
    - captnseq-toolkit essentiality --help
    - python -c "from captnseq_toolkit import __version__; assert __version__ == '{{ version }}'"

about:
  home: https://github.com/simonjeanneau/captnseq-toolkit
  license: MIT
  license_file: LICENSE
  summary: Analysis tools for CAPTn-seq transposon-insertion sequencing data
  dev_url: https://github.com/simonjeanneau/captnseq-toolkit

extra:
  recipe-maintainers:
    - brassardfelix
