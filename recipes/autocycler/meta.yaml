{% set name = "autocycler" %}
{% set version = "0.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/rrwick/Autocycler/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5af439e1855be4c32564a1f33b25f9c7450289fa1a344442cc6de6e87b989553

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - pkg-config
    - clangdev
    - make
    - cmake

test:
  commands:
    - autocycler --help

about:
  home: "https://github.com/rrwick/Autocycler"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "A tool for generating consensus long-read assemblies for bacterial genomes."
  doc_url: "https://github.com/rrwick/Autocycler/wiki"
  dev_url: "https://github.com/rrwick/Autocycler"

extra:
  identifiers:
    - doi:10.5281/zenodo.14642607
    - biotools:autocycler
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - rrwick
    - mbhall88
  skip-lints:
    - compiler_needs_stdlib_c
