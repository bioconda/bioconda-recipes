{% set name = "autocycler" %}
{% set version = "0.8.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/rrwick/Autocycler/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 086e307fa45978ceac16c4916e36455d8796a930acc4d6ec911ca3e034a81c23

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - pkg-config
    - make
    - cmake

test:
  commands:
    - autocycler --help
    - test -f "$PREFIX/share/autocycler/pipelines/README.md"
    - test -f "$PREFIX/share/autocycler/pipelines/Fast_Autocycler_with_Flye_fallback_by_Ryan_Wick/autocycler_and_flye.py"

about:
  home: "https://github.com/rrwick/Autocycler"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "A tool for generating consensus long-read assemblies for bacterial genomes."
  doc_url: "https://github.com/rrwick/Autocycler/wiki"
  dev_url: "https://github.com/rrwick/Autocycler"

extra:
  identifiers:
    - doi:10.5281/zenodo.14642607
    - biotools:autocycler
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - rrwick
    - mbhall88
  skip-lints:
    - compiler_needs_stdlib_c
