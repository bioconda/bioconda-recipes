{% set name = "funprofiler" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/KoslickiLab/fmh-{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 84d6c58d04121c61e59a4f068061227916760cef17a210f46d009a01f8665ef0

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3
    - pip
    - setuptools
  run:
    - python
    - pandas
    - numpy
    - sourmash
    - biom-format

test:
  import:
    - funprofiler
  commands:
    - funcprofiler --help

about:
  home: https://github.com/KoslickiLab/fmh-{{ name }}
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "{{ name }} is a pipeline that leverages FracMinHash (implemented in sourmash) to functionally profile metagenomic samples, offering a faster and more memory-efficient alternative to alignment-based methods."
  dev_url: https://github.com/KoslickiLab/fmh-{{ name }}

extra:
  identifiers:
    - doi:10.1093/bioinformatics/btae397
    - biotools:fmh-{{ name }}
  recipe-maintainers:
    - miraep8
