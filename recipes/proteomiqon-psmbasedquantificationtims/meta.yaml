{% set name = "proteomiqon-psmbasedquantificationtims" %}
{% set version = "0.1.0" %}
{% set sha256 = "1036030d23e53794fe86193a5d78ac576a1164a3e4877971e11372cb75d2b362" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.PSMBasedQuantificationTIMs/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-psmbasedquantificationtims"
    - test -f "$PREFIX/lib/dotnet/tools/PSMBasedQuantificationTIMs/ProteomIQon.PSMBasedQuantificationTIMs.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-psmbasedquantificationtims"
    - grep -q "PSMBasedQuantificationTIMs/ProteomIQon.PSMBasedQuantificationTIMs.dll" "$PREFIX/bin/proteomiqon-psmbasedquantificationtims"


about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: "Quantifies matched peptide ions in timsTOF data using retention time and ion mobility."
  description: >-
    PSMBasedQuantificationTIMs is the PSMBasedQuantification variant for timsTOF runs. On these instruments a peptide ion is a peak in two dimensions, retention time and ion mobility, so the tool extracts the signal around every identification in both dimensions.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/psm-based-quantification-tims/


