{% set name = "locityper" %}
{% set version = "1.5.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/tprodanov/locityper/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 54330e9b5d4808a61f876d6f6f79d8c23f5f299cfda71f2355a8dcd75ece5768

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('cxx') }}
    - cmake
    - make
    - pkg-config
    - clangdev =21
    - clang =21
    - clangxx =21
  host:
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
    # - htslib >=1.19
  run:
    - python
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
    - samtools >=1.19
    - kmer-jellyfish >=1.0
    - minimap2 >=2.26
    # - strobealign >=0.17
    - pysam

test:
  commands:
    - locityper version

about:
  summary: "Targeted genotyper for complex polymorphic loci from short and long read WGS."
  home: "https://github.com/tprodanov/locityper"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/tprodanov/locityper"
  doc_url: "https://locityper.vercel.app"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - compiler_needs_stdlib_c
