{% set name = "jvarkit" %}
{% set version = "2026.04.30" %}
{% set sha256 = "f8ca47f78fac462426956ec65a7bd417ca52607ddccdba03c9ec5f29d563920d" %}
# Since v2026.04.30, "bcfparser" is a git submodule of jvarkit providing the
# BCFCodec/BCFFileReader/BCFIterator/BCFWriter classes that build.gradle compiles
# via the "bcfparser/src/main/java" source directory. GitHub archive tarballs do
# not contain submodule contents, so the pinned revision is fetched separately.
{% set bcfparser_commit = "36b3bb13096431c75277ed8cf5426ea4e7534939" %}
{% set bcfparser_sha256 = "586c782d8947a1383bcfd9b6567187a4d7628bfe3eae1980ba8271b20a04ddd0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://github.com/lindenb/{{ name|lower }}/archive/v{{ version }}.tar.gz
    sha256: {{ sha256 }}
  - url: https://github.com/lindenb/bcfparser/archive/{{ bcfparser_commit }}.tar.gz
    sha256: {{ bcfparser_sha256 }}
    folder: bcfparser

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin=None) }}
    # it's date based (yyyy.mm.dd) there's no real semantic pinning, and breaking changes happen (e.g.: tools / libraries being removed)

requirements:
  host:
    - openjdk >=11,<20
    - gradle >=8,<9
    # for realpath on older mac osx:
    - coreutils # [not linux]
    - gawk
  run:
    - openjdk >=11
    - samtools >=1.20
    - bcftools >=1.20

test:
  commands:
    - jvarkit --help
    - biostar154220 --help

about:
  home: https://github.com/lindenb/jvarkit
  summary: 'Java utilities for Bioinformatics.'
  license: MIT License
  license_family: MIT
  license_file: LICENSE.txt

extra:
  notes:
    jvarkit is Java program that comes with a custom wrapper shell script.
    This shell wrapper is called "jvarkit" and is on $PATH by default. By default
    "-Xms512m -Xmx1g" is set in the wrapper. If you want to overwrite it you can
    specify these values directly after your binaries. If you have _JAVA_OPTIONS
    set globally this will take precedence.
    For example run it with "jvarkit -Xms512m -Xmx1g"
  recipe-maintainers:
    - DrYak
  identifiers:
    - biotools:jvarkit
    - doi:10.6084/m9.figshare.1425030
