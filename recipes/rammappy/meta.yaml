{% set version = "0.1.3" %}

package:
  name: rammappy
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/r/rammappy/rammappy-{{ version }}.tar.gz
  sha256: 96a9bb503f1fc839b376264d6246980386853f12338b9da610e46d3964c37c35

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('rammappy', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.5,<2.0
    - pip
  run:
    - python

test:
  imports:
    - rammappy

about:
  home: "https://tomdstanton.github.io/rammappy"
  summary: "A Python interface to rammap, the Rust implementation of minimap2."
  doc_url: "https://tomdstanton.github.io/rammappy"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/tomdstanton/rammappy"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
