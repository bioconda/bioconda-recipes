{% set name = "pywfa" %}
{% set version = "0.6.0" %}
{% set sha256 = "67e68f129f53eb239de672b843d033122edf06a1611e31580ab78f35185d3068" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/kcleal/pywfa/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: True  # [osx]
  binary_relocation: False
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation --no-cache-dir . -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - pip
    - python
    - cython
    - setuptools
  run:
    - python

test:
  imports:
    - pywfa

about:
  summary: "A python wrapper for wavefront alignment using WFA2-lib."
  home: "https://github.com/kcleal/pywfa"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/kcleal/pywfa"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - kcleal
