{% set name = "annostat" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/a/annostat/annostat-{{ version }}.tar.gz
  sha256: fe9894a3ec5272863603d8f2b05503db10830edab8077556c337f40dcea2a005

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - matplotlib-base >=3.10
    - biopython >=1.85

test:
  imports:
    - annostat
    - annostat.cli
  commands:
    - annostat --version
    - annostat --help
    - annostat validate --help
    - annostat inspect --help
    - annostat compare --help

about:
  home: "https://github.com/dpatel511/annostat"
  dev_url: "https://github.com/dpatel511/annostat"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Analyze and validate bacterial genome annotations from GFF3 and FASTA files."
  description: |
    Annostat is a command-line toolkit for inspecting, validating, analyzing,
    and comparing bacterial genome annotations. It produces reproducible
    statistics, quality-control results, reports, tables, and scientific
    visualizations from GFF3 and FASTA inputs.

extra:
  recipe-maintainers:
    - dpatel511
