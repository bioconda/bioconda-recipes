{% set name = "ppgtk" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/ppgtk/ppgtk-{{ version }}.tar.gz
  sha256: e466fb7bae2f8fcb44d4f71167feec5ca016fb646b3e53e7148ca52fdf61d950

build:
  entry_points:
    - ppgtk = ppgtk_cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.11,<3.13
    - pip
  run:
    - python >=3.11,<3.13
    - cyvcf2 >=0.31.1
    - pandas >=2.2.2
    - scikit-learn >=1.5.1,<1.8
    - click >=8.1.7
    - matplotlib-base >=3.10.5
    - scipy >=1.15.2
    - seaborn >=0.13.2
    - statsmodels >=0.14.5
  build:
    - python >=3.11,<3.13

test:
  imports:
    - ppgtk
  commands:
    - pip check
    - ppgtk --help
  requires:
    - pip
    - python

about:
  home: https://github.com/gtiley/ppgtk
  summary: A package for polyploid popoulation genomics analyses and data exploration
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - gtiley
