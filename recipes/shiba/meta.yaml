{% set name = "shiba" %}
{% set version = "1.0.0" %}
{% set build_number = 0 %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/Sika-Zheng-Lab/Shiba/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 098b5c6a63501f8020b8fe266fb0d76a1e0601dea1dfd3cf466226cb567479ec

build:
  number: {{ build_number }}
  noarch: generic
  script:
    - mkdir -p ${PREFIX}/bin
    - mkdir -p ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}
    - cp -R src scripts example shiba.py scshiba.py snakeshiba.smk snakescshiba.smk VERSION LICENSE environment.yml ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/
    - chmod 0755 ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/shiba.py
    - chmod 0755 ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/scshiba.py
    - ln -sf ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/shiba.py ${PREFIX}/bin/shiba.py
    - ln -sf ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/scshiba.py ${PREFIX}/bin/scshiba.py
  run_exports:
    - {{ pin_subpackage("shiba", max_pin="x.x") }}

requirements:
  host:
    - python 3.12.*
  run:
    - python 3.12.*
    - numpy 2.2.*
    - pandas 2.3.*
    - scipy 1.15.*
    - scikit-learn 1.6.*
    - statsmodels 0.14.*
    - plotly 6.3.*
    - matplotlib-base 3.10.*
    - seaborn 0.13.*
    - pyyaml 6.0.*
    - openpyxl 3.1.*
    - pysam 0.23.*
    - snakemake-minimal 9.13.*
    - tosa 1.0.0
    - stringtie 3.0.*
    - subread 2.1.*
    - samtools 1.22.*
    - r-base 4.5.*
    - r-glmmtmb 1.1.13
    - r-tmb 1.9.19
    - r-jsonlite 2.0.*
    - bioconductor-deseq2 1.50.*
    - r-data.table 1.17.*
    - r-locfit
test:
  imports:
    - numpy
    - pandas
    - scipy
    - sklearn
    - statsmodels
    - plotly
    - matplotlib
    - seaborn
    - yaml
    - pysam
    - openpyxl
  commands:
    - shiba.py --help | grep "v1.0.0"
    - scshiba.py --help | grep "v1.0.0"
    - tosa --version | grep "1.0.0"
    - samtools --version
    - snakemake --version
    - test -s "$PREFIX/share/{{ name }}-{{ version }}-{{ build_number }}/src/beta_binomial_glm.R"
    - test -d "$PREFIX/share/{{ name }}-{{ version }}-{{ build_number }}/src/templates"
    - Rscript --vanilla -e 'options(warn=2); for (p in c("glmmTMB", "TMB", "jsonlite", "DESeq2")) stopifnot(requireNamespace(p,
      quietly=TRUE))'

about:
  home: "https://github.com/Sika-Zheng-Lab/Shiba"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "A versatile method for systematic identification of differential RNA splicing across platforms"
  description: |
    A versatile computational method for systematic identification of differential RNA splicing.
    Shiba/scShiba can quantify and identify differential splicing events from bulk RNA-seq data and single-cell RNA-seq data.
    Shiba and scShiba are also implemented as Snakemake workflows, SnakeShiba and SnakeScShiba, respectively.
  dev_url: "https://github.com/Sika-Zheng-Lab/Shiba"
  doc_url: "https://sika-zheng-lab.github.io/Shiba"

extra:
  recipe-maintainers:
    - NaotoKubota
