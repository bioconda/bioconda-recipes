{% set name = "diff-biophys" %}
{% set version = "0.1.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/diff_biophys-{{ version }}.tar.gz
  sha256: caed98cd88b47ac93b694f2a677db69d47fa95846bd8cb318214ece4b3a52a3d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61.0
  run:
    - python >=3.10
    - jax
    - jaxlib
    - numpy
    - biotite

test:
  imports:
    - diff_biophys

about:
  home: https://github.com/elkins-lab/diff-biophys
  summary: "Differentiable biophysical modeling in JAX"
  license: MIT
  license_file: LICENSE
  doc_url: https://elkins-lab.github.io/diff-biophys/
  dev_url: https://github.com/elkins-lab/diff-biophys
