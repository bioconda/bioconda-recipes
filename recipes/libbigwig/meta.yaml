{% set version = "0.4.10" %}
{% set sha256 = "d7126ee8dc9732f36cd958efccff46e6eafdc1ee7d8da6ff5d43faef962e4d98" %}

package:
  name: libbigwig
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('libbigwig', max_pin='x.x') }}

source:
  url: https://github.com/dpryan79/libBigWig/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - patch

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - libcurl
    - zlib
  run:
    - libcurl
    - zlib

about:
  home: https://github.com/dpryan79/libBigWig
  license: MIT
  summary: A C library for handling bigWig files

test:
  commands:
    - test -f $PREFIX/lib/libBigWig.so

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
