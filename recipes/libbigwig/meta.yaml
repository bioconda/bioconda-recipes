{% set version = "0.4.11" %}
{% set sha256 = "a593d1cb4fa329cafefbfb0809e8bdc2f8f2bedd15a709fdb4b4cb24c1338f0c" %}

package:
  name: libbigwig
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('libbigwig', max_pin='x.x') }}

source:
  url: https://github.com/dpryan79/libBigWig/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - patch

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - libcurl
    - zlib
  run:
    - libcurl
    - zlib

about:
  home: https://github.com/dpryan79/libBigWig
  license: MIT
  summary: A C library for handling bigWig files

test:
  commands:
    - test -f $PREFIX/lib/libBigWig.so

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
