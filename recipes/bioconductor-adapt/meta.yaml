{% set version = "1.6.0" %}
{% set name = "ADAPT" %}
{% set bioc = "3.21" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: 7fd2df9202ea28ebe1d14b095c52821e

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-adapt", max_pin="x.x") }}'

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
  host:
    - r-base
    - bioconductor-phyloseq >=1.39.0
    - r-rcpp >=1.0.8
    - r-rcpparmadillo >=0.10.8
    - r-rcppparallel >=5.1.5
    - r-ggplot2 >=3.4.1
    - r-ggrepel >=0.9.1
    - libblas
    - liblapack
  run:
    - r-base
    - bioconductor-phyloseq >=1.39.0
    - r-rcpp >=1.0.8
    - r-rcpparmadillo >=0.10.8
    - r-rcppparallel >=5.1.5
    - r-ggplot2 >=3.4.1
    - r-ggrepel >=0.9.1

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: MIT + file LICENSE
  summary: Analysis of Microbiome Differential Abundance by Pooling Tobit Models
  description: ADAPT is a differential abundance analysis method for microbiome data that treats zero counts as left-censored observations using Tobit models and pools effect size estimates across reference taxa selection.
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/MIT'

extra:
  recipe-maintainers:
    - MartinaCardinali
