{% set name = "grzctl" %}
{% set version = "5.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/grzctl-{{ version }}.tar.gz
  sha256: 791e20f2dce4b7f0bb0ea51aa84d758fa677bdfcfcf736daecc1a1721d64dd89

build:
  number: 0
  noarch: python
  entry_points:
    - grzctl = grzctl.cli:main
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - hatchling
    - pip
  run:
    - python >=3.12
    - requests >=2.32.3,<3
    - grz-common >=4,<5
    - grz-db >=4,<5
    - textual >=5.3,<6

test:
  imports:
    - grzctl
  commands:
    - pip check
    - grzctl --help
  requires:
    - pip

about:
  home: "https://github.com/BfArM-MVH/grz-tools"
  summary: "Control CLI for GRZ administrators."
  license: MIT
  license_family: MIT
  dev_url: "https://github.com/BfArM-MVH/grz-tools"
  doc_url: "https://github.com/BfArM-MVH/grz-tools/blob/grzctl-v{{ version }}/packages/grzctl/README.md"

extra:
  recipe-maintainers:
    - hoeze
    - tedil
