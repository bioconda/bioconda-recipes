{% set name = "DeepLC" %}
{% set version = "4.5.0" %}
{% set sha256 = "656573e399bc3f0e431fa24a48f2935649b6507123f6138a8671a50e7c22a110" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/deeplc-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage("deeplc", max_pin="x") }}
  entry_points:
    - deeplc=deeplc.__main__:main
    - deeplc-gui=deeplc.gui:start_gui

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
  run:
    - python >=3.11
    - pytorch >=2.6.0,<3
    - numpy >=1.17,<3
    - pandas >=0.25,<3
    - scikit-learn >=1.2.0,<2
    - psm-utils >=1.5,<2
    - onnx2torch >=1.5,<2
    - click >=8,<9
    - rich >=13,<15

test:
  imports:
    - deeplc

about:
  home: "https://compomics.github.io/projects/DeepLC"
  summary: 'DeepLC: Retention time prediction for (modified) peptides using Deep Learning.'
  dev_url: "https://github.com/compomics/DeepLC"
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  doc_url: "https://github.com/compomics/DeepLC/blob/v{{ version }}/README.md"

extra:
  identifiers:
    - doi:10.1038/s41592-021-01301-5
    - biotools:deeplc
  recipe-maintainers:
    - compomics
