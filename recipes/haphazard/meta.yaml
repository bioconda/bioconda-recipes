{% set version = "0.1.0" %}

package:
  name: haphazard
  version: {{ version }}

source:
  url: https://github.com/adamewing/haphazard/archive/refs/tags/v{{ version }}.tar.gz
  sha256: <paste sha256 here>

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -q

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - pysam >=0.22.0
    - numpy >=1.23
    - scipy >=1.10
    - networkx >=2.5
    - tqdm >=4.0
    - matplotlib-base >=3.3

test:
  imports:
    - haphazard
  commands:
    - haphazard --help

about:
  home: https://github.com/adamewing/haphazard
  license: MIT
  license_file: LICENSE
  summary: Resolve overlapping haplotype phase blocks in haplotagged ONT BAM files using CpG methylation profiles
