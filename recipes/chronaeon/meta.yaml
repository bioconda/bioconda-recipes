{% set name = "chronaeon" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 830129a794e8ee240c203eff9a4e43ce379d5bf34a2c8bffef9c4818ceb8d60f

build:
  number: 0
  noarch: python
  entry_points:
    - chronaeon = chronaeon.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - hyphaeon-core >=0.2.0
    - biopython >=1.80
    - numpy >=1.22.0
    - scipy >=1.9.0
    - pandas >=1.5.0
    - scikit-learn >=1.0
    - matplotlib-base >=3.5
    - tn93 >=1.0.16
    - networkx >=3.0

test:
  imports:
    - chronaeon
  commands:
    - chronaeon --version
    - chronaeon --help
    - chronaeon date --help
    - chronaeon autoclock --help
    # Exercise the hf_xet download path inside the mulled container — small
    # files bypass xet, so a real weight file is required. This catches the
    # "Reqwest error: builder error" TLS failure fixed via build.sh.
    - python -c "from huggingface_hub import hf_hub_download; hf_hub_download('datamonkey/hyphaeon', 'model.safetensors')"

about:
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "ChronAeon: Ultra-Fast Molecular Clock Dating, Phylodynamics, and Genomic Surveillance"
  description: |
    ChronAeon is the "Radar" component of the Aeon package family — rapidly
    screens genomes, detects emerging clades, and infers origin dates using
    molecular clock dating, phylodynamics, phylogeography, and multi-clock
    community deconvolution.
  doc_url: https://github.com/veg/HyphAeon#readme
  dev_url: https://github.com/veg/HyphAeon

extra:
  recipe-maintainers:
    - d-callan
