{% set name = "snakemake-executor-plugin-shared-local" %}
{% set version = "0.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/snakemake_executor_plugin_shared_local-{{ version }}.tar.gz
  sha256: 839827eaabe377761fdd766e84c70b1c43cfd49d092d66373b2f778ca73dbb72

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.11,<4.0
    - hatchling
    - pip
  run:
    - python >=3.11.0,<4.0.0
    - snakemake-interface-common >=1.22.0,<2.0.0
    - snakemake-interface-executor-plugins >=9.3.9,<10.0.0

test:
  imports:
    - snakemake_executor_plugin_shared_local

about:
  home: https://github.com/yangmqglobe/snakemake-executor-plugin-shared-local
  summary: A Snakemake executor plugin that coordinates multiple local Snakemake instances sharing one machine.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/yangmqglobe/snakemake-executor-plugin-shared-local
  doc_url: https://snakemake.github.io/snakemake-plugin-catalog/plugins/executor/shared-local.html

extra:
  recipe-maintainers:
    - yangmqglobe
