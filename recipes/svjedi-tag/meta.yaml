package:
  name: svjedi-tag
  version: "1.1.0"

source:
  url: https://github.com/MTemperville/SVJedi-Tag/archive/v1.1.0.tar.gz
  sha256: 70ee5ad72f24b792d4ae42434853c0ff35457ea30d460b5894abcead05db05c7

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  run_exports:
    - {{ pin_subpackage("svjedi-tag", max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools 

  run:
    - python >=3.11
    - pysam
    - vg >=1.76.1
    - biopython
    - matplotlib-base
    - networkx
    - prettytable
    - wcwidth
    - pandas
    - seaborn

test:
  commands:
    - svjedi-tag -h
    - LR_STATS -h
    - svjedi-tag_likelihood-calibration -h

about:
  home: "https://github.com/MTemperville/SVJedi-Tag"
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file: LICENSE
  summary: "SVJedi-Tag : a tool for genotyping inversions using linked-reads data."

extra:
  recipe-maintainers:
    - MTemperville