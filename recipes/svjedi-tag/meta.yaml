package:
  name: svjedi-tag
  version: "1.2.0"

source:
  url: https://github.com/MTemperville/SVJedi-Tag/archive/refs/tags/v1.2.0.tar.gz
  sha256: e0c50e154866b72f1771da534408bcbfcfff2108557560d401d021039ad6a9a5

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  run_exports:
    - {{ pin_subpackage("svjedi-tag", max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools 

  run:
    - python >=3.11
    - pysam
    - vg >=1.76.1
    - biopython
    - matplotlib-base
    - networkx
    - prettytable
    - wcwidth
    - pandas
    - seaborn

test:
  commands:
    - svjedi-tag -h
    - LR_STATS -h
    - svjedi-tag_likelihood-calibration -h

about:
  home: "https://github.com/MTemperville/SVJedi-Tag"
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file: LICENSE
  summary: "SVJedi-Tag : a tool for genotyping inversions using linked-reads data."

extra:
  recipe-maintainers:
    - MTemperville
