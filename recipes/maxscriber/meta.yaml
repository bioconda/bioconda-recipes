{% set name = "maxscriber" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/vaishnavpvarma/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: aaf1a56c77154713713f1a640840b669a593b17d37340e47e387c1d1d6843077

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"


requirements:
  host:
    - python >=3.9
    - pip
    - hatchling
  run:
    - python >=3.9
    - click >=8.1.7
    - textual >=0.50.0
    - rich >=13.0.0
    - pdfplumber >=0.11.0
    - pandas >=2.0.0
    - openpyxl >=3.1.0
    - fuzzywuzzy >=0.18.0
    - python-levenshtein >=0.25.0
    - alive-progress >=3.1.5
    - pyyaml >=6.0.1
    - matplotlib >=3.8.0

test:
  imports:
    - maxscriber
  commands:
    - maxscriber --help

about:
  home: "https://github.com/vaishnavpvarma/maxscriber"
  license: "MIT"
  summary: "Universal Medical PDF Extractor and Analyzer"
  license_family: MIT
  license_file: LICENSE
  description: |
    Maxscriber extracts unstructured information from medical PDFs
    and provides a clean, structured format and visual charts for better
    analysis and presentation.
  dev_url: "https://github.com/vaishnavpvarma/maxscriber"

extra:
  recipe-maintainers:
    - vaishnavpvarma
