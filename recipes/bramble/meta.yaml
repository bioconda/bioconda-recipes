{% set name = "bramble" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/zrudnick/bramble/archive/refs/tags/v{{ version }}.tar.gz
  # Output of `sha256sum v0.1.6.tar.gz`
  sha256: d2e1e095bed9ed78215bc6007f3dd128c76dccf11737f149fce685f9610401fb

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - clang
    - libclang
  host:
    - zlib
    - bzip2
  run:
    - zlib
    - bzip2

test:
  commands:
    - bramble --help
    - bramble-rs --help

about:
  home: https://github.com/zrudnick/bramble
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "Project spliced genomic alignments into transcriptomic space."

extra:
  recipe-maintainers:
    - zrudnick
