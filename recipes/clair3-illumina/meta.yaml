{% set name = "clair3-illumina" %}
{% set version = "2.0.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/HKU-BAL/Clair3/archive/refs/tags/v{{ version }}.zip
  sha256: d05e8f8633f32e01e5353940b83e455a1de39b6fceae7ef2b724d10e338d7268

build:
  number: 0
  skip: True  # [osx and x86_64]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - boost-cpp
  run:
    - clair3
    - tensorflow

test:
  imports:
    - tensorflow
  commands:
    - which clair3.py
    - run_clair3.sh -v

about:
  home: 'https://github.com/HKU-BAL/Clair3'
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: "LICENSE.md"
  summary: "Clair3 with libraries to support variant calling using Illumina short-reads. Version in sync with Clair3."
  dev_url: 'https://github.com/HKU-BAL/Clair3'

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1038/s43588-022-00387-x
