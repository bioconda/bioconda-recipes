{% set name = "isoform-dominance" %}
{% set version = "2.11.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace("-", "_") }}-{{ version }}.tar.gz
  sha256: ad13224079bb3587477685bc230bb0195d5d3be9fb0d4fd0bab85dfc22e875e9

build:
  number: 0
  noarch: python
  entry_points:
    - isoform-dominance = isoform_dominance.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - numpy >=1.24
    - scipy >=1.15
    - matplotlib-base >=3.7

test:
  imports:
    - isoform_dominance
    - isoform_dominance.identifiability
  commands:
    - isoform-dominance --version
    - isoform-dominance --help
    # the bundled self-test: offline, about 2 s, reproduces the reference LEPR result
    - isoform-dominance selftest

about:
  home: https://github.com/charliekim97/isoform-dominance-pipeline
  summary: Short-read identifiability, quantification and testing of functional isoform-class comparisons in bulk RNA-seq
  description: |
    For one gene, isoform-dominance proposes functional isoform classes from the annotation,
    decides before quantification whether short reads can resolve the class contrast (an exact
    estimability check of the fragment-class system, with the counting SE at a stated design),
    aggregates Salmon quant.sf per donor and tests the contrast across donors and cohorts.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/charliekim97/isoform-dominance-pipeline
  doc_url: https://charliekim97.github.io/isoform-dominance-pipeline/

extra:
  recipe-maintainers:
    - charliekim97
  identifiers:
    - doi:10.5281/zenodo.20672051
