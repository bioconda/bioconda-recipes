{% set version = '1.3.1' %}

package:
  name: r-mclink
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/mclink_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/mclink/mclink_{{ version }}.tar.gz
  sha256: 217ffd515a6ff19514ef78bfedc5a67d883afd8dfe7e4006dc2ce7bcd3cb08d2

build:
  noarch: generic
  number: 0
  script: R CMD INSTALL --build . ${R_ARGS}
  run_exports:
    - {{ pin_subpackage("r-mclink", max_pin="x") }}

requirements:
  host:
    - r-base
    - r-data.table >=1.17.8
    - r-dplyr >=1.1.4
    - r-matrixstats >=1.0.0
    - r-stringr >=1.5.1
    - r-tibble >=3.2.1

  run:
    - r-base
    - r-data.table >=1.17.8
    - r-dplyr >=1.1.4
    - r-matrixstats >=1.0.0
    - r-stringr >=1.5.1
    - r-tibble >=3.2.1

test:
  commands:
    - $R -e "library('mclink')"

about:
  home: https://CRAN.R-project.org/package=mclink
  license: GPL-3.0-only
  summary: Metabolic pathway completeness and abundance analysis using KEGG Orthology data
  license_family: GPL3
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - LiuyangLee
