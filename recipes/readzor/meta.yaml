{% set version = "0.1.18" %}
{% set name = "readzor" %}
{% set sha256 = "96e406506759d0870aca0f616c2d1157d1b7ff1919d1d3fdf24971bc0315ee90" %}

package:
  name: '{{ name }}'
  version: '{{ version }}'

source:
  url: https://pypi.org/packages/source/r/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: '{{ sha256 }}'

build:
  entry_points:
    - readzor = readzor.readzor:main
    - Readzor = readzor.readzor:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

requirements:
  host:
    - python
    - setuptools >=77.0.3
    - pip
  run:
    - python
    - numpy ==2.5.2
    - conda-forge::python-isal ==1.8.0

test:
  imports:
    - readzor
  commands:
    - pip check
    - readzor --help
    - Readzor --help
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/Readzor/
  summary: A Python3 program for fully automatic trimming and quality control of short read sequences.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - abjanssen
    