{% set name = "yame" %}
{% set version = "1.39" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/zhou-lab/YAME/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 6296cd1b967fd5b63bfca2f6b726e1ef67b44b3efecd2a3dfdd9747a1d0ab5b7 

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
  
requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
  host:
    - zlib
    - libcurl

test:
  commands:
    - yame fetch -l | grep -q InfiniumAnnotation

about:
  home: "https://github.com/zhou-lab/YAME"
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file: LICENSE
  summary: "YAME: Yet Another Methylation Extractor."
  dev_url: "https://github.com/zhou-lab/YAME"
  doc_url: "https://zhou-lab.github.io/YAME"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - Hongxiang2023
    - zwdzwd
