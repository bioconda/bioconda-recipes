{% set version = "1.1.0" %}
{% set name = "umi-tools-rs" %}
{% set username = "vertti" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ username }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: c9b313e7eb325e4bf4daa9bb60cf3d6fff078eb699b9f3e49fdb6792dc4863c8

build:
  number: 0

  run_exports:
    - {{ pin_subpackage('umi-tools-rs', max_pin="x.x") }}


  script:
    - export CLANG_INCLUDE_DIR=$(dirname "$(find "$BUILD_PREFIX/lib/clang" -name stddef.h -print -quit)")
    - export BINDGEN_EXTRA_CLANG_ARGS="-I${CLANG_INCLUDE_DIR}"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cargo build --release --locked -vv
    - UMI_TOOLS=$(find $(pwd) -type f -executable -name "umi-tools-rs")
    - install -Dm755 "$UMI_TOOLS" $PREFIX/bin/umi-tools-rs

requirements:
  build:
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - {{ compiler('c') }} 
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - make
    - clang
    - libclang
    - pkg-config
    - sysroot_linux-64


test:
  commands:
    - umi-tools-rs --version

about:
  home: https://github.com/vertti/umi-tools-rs
  license: MIT # please use https://spdx.org identifiers
  license_file:
    - LICENSE         # the license file for your package
    - THIRDPARTY.yml  # this file is generated by cargo-bundle-licenses
  summary: A drop-in replacement for UMI-tools, written in Rust. Same flags, same output — just faster.

extra:
  recipe-maintainers:
    - "@A-Noizes"  # your GitHub username