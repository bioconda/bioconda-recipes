{% set name = "cctyper" %}
{% set version = "1.9.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cctyper-{{ version }}.tar.gz
  sha256: 843c5dea523473fca966b6c5fa01f6188244c298a1b098dc91b63e717621cc39

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools <82
  run:
    - python >=3.10
    - setuptools <82
    - biopython >=1.76,<=1.79
    - blast >=2.5,<3
    - cairosvg
    #- diced >=0.1.1
    - drawsvg >=2
    - grep
    - hmmer >=3.0,<4
    - imageio
    - joblib >=1.0
    - minced >=0.4.2,<0.5
    - multiprocess >=0.70.14,<=0.70.15
    #- myers-batch
    - numpy >=1.17.5,<=1.24.3
    - pandas >=1.3,<=2.0.3
    - prodigal >=2.0,<2.7
    - pyhmmer >=0.12
    - pyrodigal-gv >=0.3
    - python-edlib
    - libxgboost >=1.7,<2
    - py-xgboost >=1.4,<2
    - scikit-learn >=0.22.0,<=1.3.0
    - scipy >=1.4.1,<=1.10.1
    - sed
    - tqdm >=4.64.1,<=4.66.5
    - xgboost >=1.4
    - zstandard

test:
  commands:
    - cctyper --help

about:
  home: "https://github.com/Russel88/CRISPRCasTyper"
  dev_url: "https://github.com/Russel88/CRISPRCasTyper"
  summary: "CRISPRCasTyper: Automatic detection and subtyping of CRISPR-Cas operons."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: "https://typer.crispr.dk"

extra:
  identifiers:
    - doi:10.1089/crispr.2020.0059
