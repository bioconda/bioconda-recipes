{% set name = "LongBarcodeQC" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0]|lower }}/{{ name|lower }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: 8a47344eb776add4da2079b2a772de42064cf957bed4ae668498b5f20071bb1f

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage("longbarcodeqc", max_pin="x") }}
  entry_points:
    - lbqc = longbarcodeqc.main:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - pandas >=2.1.1
    - parasail-python >=1.3.4
    - matplotlib-base >=3.8.4
    - jinja2 >=3.1.4
    - seaborn-base >=0.13.2
    - pyarrow >=14.0
    - tqdm >=4.66
    - cutadapt >=5.2
    - minimap2
    - samtools

test:
  imports:
    - longbarcodeqc
  commands:
    - lbqc --version
    - lbqc --help

about:
  home: https://github.com/ArpiarSaundersLab/LongBarcodeQC
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Analyze long-read barcode libraries from Oxford Nanopore sequencing and generate an interactive QC report
  doc_url: https://arpiarsaunderslab.github.io/LongBarcodeQC/
  dev_url: https://github.com/ArpiarSaundersLab/LongBarcodeQC

extra:
  recipe-maintainers:
    - goodez
