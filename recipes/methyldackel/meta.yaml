{% set version = "0.6.2" %}

package:
  name: methyldackel
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("methyldackel", max_pin="x.x") }}

source:
  url: https://github.com/dpryan79/MethylDackel/archive/{{ version }}.tar.gz
  sha256: ee8d7c114599ce35b41b999bf82527a21bc85eb23281d5d39bff28f81c258882

requirements:
  build:
    - make
    - {{ compiler('c') }}
  host:
    - libbigwig
    - htslib
    - zlib

test:
  commands:
    - MethylDackel --version

about:
  home: https://github.com/dpryan79/MethylDackel
  license: MIT
  license_file: LICENSE
  summary: A (mostly) universal methylation extractor for BS-seq experiments. Formerly named PileOMeth.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
