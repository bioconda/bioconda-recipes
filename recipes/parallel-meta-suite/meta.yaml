{% set name = "parallel-meta-suite" %}
{% set version = "3.7.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/qdu-bioinfo/parallel-meta-suite/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 2beec7aeb65af82551882063ced623155759958442382c63aab7b9fdb828d22c

build:
  number: 0
  skip: True  # [osx]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make

  run:
    - libgomp
    - hmmer
    - curl
    - openssl
    - tar
    - vsearch
    - r-base
    - r-optparse
    - r-vegan
    - r-gplots
    - r-ggplot2
    - r-igraph
    - r-reshape
    - r-pheatmap
    - r-proc
    - r-combinat
    - r-plyr
    - r-rcolorbrewer
    - r-permute
    - r-lattice
    - r-squash
    - r-fossil
    - r-abind
    - r-randomforest
    - r-psych
    - r-ade4
    - r-reshape2
    - r-scales

test:
  commands:
    - PM-pipeline -h
    - PM-parallel-meta -h
    - PM-profiler -h

about:
  home: https://github.com/qdu-bioinfo/parallel-meta-suite
  dev_url: https://github.com/qdu-bioinfo/parallel-meta-suite
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Parallel-META Suite for comprehensive microbiome analysis
