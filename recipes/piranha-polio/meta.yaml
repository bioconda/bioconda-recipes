{% set version = "1.6.4" %}

package:
  name: piranha-polio
  version: {{ version }}

source:
  url: https://github.com/polio-nanopore/piranha/archive/refs/tags/{{ version }}.tar.gz
  sha256: 3d45b479625ba594c2bac781a9fa87060e88a2bda5b03a53f9a3d3f7729a7612

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vvv
  run_exports:
    - {{ pin_subpackage("piranha-polio", max_pin="x") }}

requirements:
  host:
    - python >=3.12,<4
    - pip
    - setuptools
  run:
    - python >=3.12,<4
    # From upstream pyproject.toml
    - mako =1.2
    - pandas
    - snipit
    - numpy
    - scipy
    # From upstream environment.yml
    - biopython
    - bcftools =1.23
    - coreutils =9.5
    - flopp =0.2.0
    - freebayes =1.3.6
    - iqtree >=3.0
    - jclusterfunk >=0.0.25
    - mafft
    - medaka =2.2.0
    - minimap2 >=2.16
    - rasusa =0.7.1
    - samtools =1.2.0
    - snakemake-minimal >=9.13.7
    - tabix >=1.11
    - pysam

test:
  commands:
    - piranha --help
    - piranha --version

about:
  home: "https://github.com/polio-nanopore/piranha"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: LICENSE
  summary: "Poliovirus Investigation Resource Automating Nanopore Haplotype Analysis."
