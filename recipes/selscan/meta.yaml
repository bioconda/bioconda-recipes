{% set version = "3.0.1" %}
{% set sha256 = "e72ae9b5d9dea2b025fabb07b16a194f2a0470dc8389fc0c4ab1c3757f7648ef" %}

package:
  name: selscan
  version: {{ version }}

source:
  url: https://github.com/szpiech/selscan/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
  host:
    - gsl
    - zlib
  run:
    - gsl
    - zlib

test:
  commands:
    - selscan 2>&1 | grep -qF 'selscan'

about:
  home: https://github.com/szpiech/selscan
  license: GPL-3.0-only
  license_family: GPL3
  summary: a program to calculate EHH-based scans for positive selection in genomes

extra:
  identifiers:
    - biotools:selscan
    - doi:10.1093/molbev/msu211
  skip-lints:
    - should_not_be_noarch_source
