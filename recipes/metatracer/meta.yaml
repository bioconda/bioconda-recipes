{% set name = "metatracer" %}
{% set version = "0.1.2" %}
{% set sha256 = "7bd1dd37eeee3bac0627e725f9525013c4a583c1822533f3c9fee61fb120aa8f" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/FofanovLab/metatracer/archive/refs/tags/{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  entry_points:
    - metatracer = metatracer.cli:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python <3.14
    - setuptools >=64
    - pip
  run:
    - python <3.14
    - mtsv-tools >=2.1.0
    - click >=8.1
    - biopython >=1.80
    - pysam >=0.21  # not compatible with python 3.14
    - intervaltree >=3.1
    - ete3 >=3.1
    - tqdm >=4.64
    - htslib

test:
  commands:
    - metatracer --help
  imports:
    - metatracer


about:
  home: "https://github.com/FofanovLab/MetaTracer"
  summary: "MetaTracer metatranscriptomic analysis pipeline."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/FofanovLab/MetaTracer"

extra:
  recipe-maintainers:
    - tfursten
  #skip-lints:
    #- should_be_noarch_generic  # mtsv-tools dependency not available on macOS so not truly noarch.
