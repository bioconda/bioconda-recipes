{% set version = "2.1.4" %}

package:
  name: bioinfokit
  version: {{ version }}

source:
  url: https://github.com/reneshbedre/bioinfokit/archive/v{{ version }}.tar.gz
  sha256: 4824955704faf7a57aa91d4b87e581b61c3ff5a68b082bb2259d83d5123c146e

build:
  noarch: python
  number: 0
  script: python -m pip install --no-deps --ignore-installed .
  run_exports:
    - {{ pin_subpackage('bioinfokit', max_pin='x') }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - pandas
    - matplotlib-base
    - scipy
    - scikit-learn
    - seaborn
    - matplotlib-venn
    - tabulate
    - statsmodels
    - textwrap3
    - adjusttext   

test:
  imports:
    - bioinfokit

about:
  home: https://reneshbedre.github.io/blog/howtoinstall.html
  license: MIT
  summary: 'The bioinfokit toolkit aimed to provide various easy-to-use functionalities to analyze, visualize, and interpret the biological data generated from genome-scale omics experiments.'
  doc_url: https://reneshbedre.github.io/blog/howtoinstall.html
