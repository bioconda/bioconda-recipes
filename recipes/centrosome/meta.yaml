{% set name = "centrosome" %}
{% set version = "1.3.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/CellProfiler/centrosome/archive/v{{version}}.zip
  sha256: 1b6fef3c9b40735e3bf47865f37adc4af189550a29b427710f9cd0390fddd29f

build:
  number: 0
  script: CFLAGS="$CFLAGS -O3 -Wno-error=int-conversion" {{ PYTHON }} -m pip install --no-deps --no-build-isolation --no-cache-dir . -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    - cython
    - pytest
    - numpy
  run:
    - python
    - deprecation
    - matplotlib-base
    - numpy
    - pillow
    - scikit-image
    - scipy

test:
  imports:
    - centrosome

about:
  home: "https://github.com/CellProfiler/centrosome"
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  summary: 'An open source image processing library. Dependency for CellProfiler.'
  dev_url: "https://github.com/CellProfiler/centrosome"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
