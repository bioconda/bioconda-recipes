{% set name = "metabolic" %}
{% set version = "4.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/AndaMM/METABOLIC/archive/refs/tags/v{{ version }}.tar.gz
  sha256: fdbdf8a409160b7de9538a15fe20a334d32e13eb4a849bad73a487106dc29776

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  run:
    - perl =5.22.0.1
    - perl-bioperl =1.6.924
    - perl-parallel-forkmanager =1.17
    - perl-statistics-descriptive =3.0612
    - python >=3
    - r-base >=4.5.3
    - r-diagram >=1.6.5
    - r-dplyr >=1.2.1
    - r-forcats >=1.0.1
    - r-ggalluvial >=0.12.6
    - r-ggraph >=2.2.2
    - r-ggthemes >=6.0.0
    - r-igraph >=2.3.3
    - r-openxlsx >=4.2.8.1
    - r-plyr >=1.8.9
    - r-stringr >=1.6.0
    - r-tidygraph >=1.3.0
    - r-tidyverse >=2.0.0
    - hmmer >=3.4
    - prodigal >=2.6.3
    - diamond >=2.2.5
    - bowtie2 >=2.5.5
    - minimap2 >=2.31
    - samtools >=1.24
    - sambamba >=1.0.1
    - coverm >=0.8.0
    - curl >=8.22.0
    - tar >=1.35
    - gzip >=1.14
    - coreutils >=9.11
    - sed >=4.10
    - grep >=3.12
    - gawk >=5.4.1

test:
  commands:
    - METABOLIC-G.pl -v
    - METABOLIC-C.pl -v
    - METABOLIC-C.2nd_run.pl -v

about:
  home: https://github.com/AnantharamanLab/METABOLIC
  dev_url: https://github.com/AndaMM/METABOLIC
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: Metabolic and biogeochemical functional trait profiler (maintained fork)
  description: |
    Maintained fork of AnantharamanLab/METABOLIC, which is no longer maintained.
    Changes: configurable database directory, -download-db setup mode, GTDB-Tk
    decoupled (-gtdbtk-dir required for METABOLIC-C), bug fixes. See CHANGELOG.

extra:
  identifiers:
    - doi:10.1186/s40168-021-01213-8
