{% set name = "cifi" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fd4e6c140392c6722052e0e2c9b974fc3fb8f826e5c1ea5e00e2413cb16ba46a

build:
  number: 0
  skip: True  # [win]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - cifi = cifi.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake >=3.15
    - make
    - pkg-config
  host:
    - python
    - pip
    - setuptools
    - scikit-build-core >=0.4.3
    - nanobind >=1.3.2
    - htslib
    - zlib
  run:
    - python
    - click >=8.0
    - jinja2 >=3.0
    - htslib

test:
  imports:
    - cifi
  commands:
    - cifi --help
    - cifi enzymes

about:
  home: "https://github.com/mr-eyes/cifi-toolkit"
  summary: "CiFi - toolkit for downstream processing of CiFi long reads."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/mr-eyes/cifi-toolkit"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - mr-eyes
