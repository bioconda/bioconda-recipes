{% set version = "0.10.0" %}
{% set name = "salti" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/sam-sims/{{ name }}/archive/{{ name }}-{{ version }}.tar.gz
  sha256: 688ff35f127a2956ff85f8b72ddcc80a7dc0ed915a3524bd81c6110449b2bb97

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('salti', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - salti --version

about:
  home: https://github.com/Sam-Sims/salti
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: A modern multiple sequence alignment browser - built for the terminal.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - sam-sims
