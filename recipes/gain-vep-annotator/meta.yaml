{% set name = "gain-vep-annotator" %}
{% set version = "2026.11.2" %}
{% set python_min = "3.12" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/gain_vep_annotator-{{ version }}.tar.gz
  sha256: 5967465c31fc882252440279959f08bc208ec1a693ea63857acf1ba9288e7a0c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin=None) }}

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }},<3.15
    - gain-core
    # VEP itself runs in a Docker container that the annotator starts, so
    # ensembl-vep is not a run dependency.

test:
  requires:
    - python {{ python_min }}
    - pip
  commands:
    # hatch-vcs falls back to 0.0.0.dev0 when it cannot read the version.
    - python -c "import importlib.metadata as m; v = m.version('{{ name }}'); assert v == '{{ version }}', v"
    # Load every console script and gain.* plugin the installed metadata
    # declares, so a run dependency missing from this recipe fails here.
    - python -c "from importlib.metadata import distribution as d; eps = [e for e in d('{{ name }}').entry_points if e.group == 'console_scripts' or e.group.startswith('gain.')]; [e.load() for e in eps]; assert eps; print(len(eps), 'entry points loaded')"
    - install_vep_cache --help
    - pip check

about:
  home: https://github.com/iossifovlab/gain
  summary: "GAIn plugin with annotators that run the Ensembl Variant Effect Predictor (VEP)"
  description: |
    gain-vep-annotator adds two annotators to GAIn: vep_full_annotator, which
    uses a local VEP cache, and vep_effect_annotator, which uses the reference
    genome and gene models of a GAIn Genomic Resource Repository. VEP runs in
    a Docker container.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/iossifovlab/gain
  doc_url: https://iossifovlab.com/gaindocs/annotation_infrastructure.html#vep-annotators

extra:
  recipe-maintainers:
    - lchorbadjiev
    - iossifov
