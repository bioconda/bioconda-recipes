{% set name = "annatar" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a7f54e312035a2b4c37433c0e638f7ae69b36e6fbd927c78e9e4c23eb54b1a4d

build:
  number: 0
  skip: True  # [py < 311]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.15,<2
    - pip
  run:
    - python
    - anndata >=0.12.7
    - numpy >=1.26
    - pandas >=2.2
    - scipy >=1.13

test:
  imports:
    - annatar
  commands:
    - annatar --help
    - pip check
  requires:
    - pip

about:
  home: "https://github.com/clintval/{{ name }}"
  summary: "Convert a multi-sample VCF of single cells into an AnnData h5ad."
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  dev_url: "https://github.com/clintval/{{ name }}"
  doc_url: "https://github.com/clintval/{{ name }}/blob/{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - clintval
