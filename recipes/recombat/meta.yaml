{% set name = "reComBat" %}
{% set version = "0.1.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 88cc878c0026b27aafe7353ce6c7790a9be4beb20deccb28cf0a64cf807f4776
  patches:
    # Upstream metadata requires the deprecated `sklearn` placeholder and pins
    # python <3.11, numpy <2 and pandas <2; the code works with current versions.
    - fix-dependencies.patch

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - reComBat = reComBat.cli:main
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=3.8
    - numpy >=1.20.0
    - scikit-learn >=0.24
    - pandas >=1.3.4
    - tqdm >=4.62.3
    - fire >=0.4.0

test:
  imports:
    - reComBat
  commands:
    - reComBat --help
    - pip check
  requires:
    - pip

about:
  home: https://github.com/BorgwardtLab/reComBat
  summary: Regularised ComBat method to correct batch effects in gene expression data.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/BorgwardtLab/reComBat

extra:
  identifiers:
    - doi:10.1093/bioadv/vbac071
  recipe-maintainers:
    - pinin4fjords
