{% set name = "blobtk" %}
{% set version = "0.8.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/genomehubs/blobtk/archive/{{ version }}.tar.gz
  sha256: 25d01fc6aa203fefb1763903d2547735fc9efce06c35e5bb989c70cd03190a70

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - cmake
    - make
    - clangdev  # [osx]
    - clangdev <22  # [linux]
    - llvmlite
    - pkg-config
  host:
    - python
    - pip
    - maturin
    - curl
    - wget
    - openssl
    - libiconv
    - zlib
  run:
    - python

test:
  imports:
    - blobtk
  commands:
    - blobtk --help

about:
  home: "https://github.com/genomehubs/blobtk"
  summary: "Core functionality shared across BlobToolKit tools."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/genomehubs/blobtk"
  doc_url: "https://github.com/genomehubs/blobtk/wiki"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
