{% set name = "cblaster" %}
{% set version = "1.4.2" %}
{% set sha256 = "dcc5d5544e50ead0b05b66be52fdae80f90fdbb2fc220d0d39f7ac35a7549177" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  entry_points:
    - cblaster=cblaster.main:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage('cblaster', max_pin="x") }}

requirements:
  host:
    - python >=3.6
    - pip
    - setuptools
  run:
    - python >=3.6
    - appdirs
    - biopython
    - clinker-py >=0.0.15
    - gffutils
    - numpy
    - pysimplegui
    - requests
    - scipy
    - diamond
    - defusedxml

test:
  imports:
    - cblaster
    - cblaster.gui
    - tests
  commands:
    - cblaster --help
  requires:
    - pytest
    - pytest-cov
    - pytest-mock
    - requests-mock

about:
  home: "https://github.com/gamcil/cblaster"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Find clustered hits from a BLAST search."
  doc_url: "https://cblaster.readthedocs.io/en/latest/"
  dev_url: "https://github.com/gamcil/cblaster"
