{% set name = "gfatk" %}
{% set version = "0.6.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/tolkit/gfatk/archive/refs/tags/{{ version }}.tar.gz
  sha256: af53fd62120ad93b24e441c80e35b780146b569aec89aea6c0b9b93510172aa2

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - gfatk --help

about:
  home: https://github.com/tolkit/gfatk
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Explore and linearise (plant organellar) GFA assembly graphs
  dev_url: https://github.com/tolkit/gfatk

extra:
  recipe-maintainers:
    - Euphrasiologist
  identifiers:
    - doi:10.5281/zenodo.22870219
  additional-platforms:
    - linux-aarch64
    - osx-arm64
