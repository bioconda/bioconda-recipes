{% set name = "gfatk" %}
{% set version = "0.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/tolkit/gfatk/archive/refs/tags/{{ version }}.tar.gz
  sha256: d49d15f6a4b64bace498b36991ed93dd51d9fddeaf0b18cf234e96de88beb0f5

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - gfatk --help

about:
  home: https://github.com/tolkit/gfatk
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Explore and linearise (plant organellar) GFA assembly graphs
  dev_url: https://github.com/tolkit/gfatk

extra:
  recipe-maintainers:
    - Euphrasiologist
  identifiers:
    - doi:10.5281/zenodo.22870219
  additional-platforms:
    - linux-aarch64
    - osx-arm64
