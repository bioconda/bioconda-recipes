{% set name = "promevo" %}
{% set version = "0.1.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ausswal/PromEvo/archive/refs/tags/v{{ version }}.tar.gz
  # Replace with: sha256sum of the tarball downloaded from the URL above
  sha256: edc6ceaee9c24887ef49c37c7095ff65e00e0a6c74401a5888d663699f918359

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  run:
    - python >=3.10,<3.14
    - pandas
    - numpy
    - scipy
    - matplotlib-base
    - seaborn
    - biopython
    - openpyxl
    - scikit-learn
    - requests
    - ncbi-datasets-cli
    - mafft
    - meme
    - orthofinder
    - diamond
    - mcl
    - fasttree

test:
  commands:
    - promevo-check
    - datasets --version
    - command -v mafft
    - command -v meme
    - command -v tomtom
    - command -v ceqlogo
    - command -v orthofinder
    - command -v diamond
    - command -v mcl
    - command -v fasttree

about:
  home: https://github.com/ausswal/PromEvo
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: PromEvo - comparative gene family and promoter analysis pipeline
  description: |
    A Python-based comparative bioinformatics pipeline for gene-family,
    protein, promoter, transcription-start-site, nucleotide composition,
    core promoter element, motif, CpG, DNA structural property,
    and phylogenetic analyses.
  dev_url: https://github.com/ausswal/PromEvo

extra:
  recipe-maintainers:
    - ausswal
