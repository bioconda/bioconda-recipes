{% set posix = "m2-" if win else "" %}
{% set native = "m2w64-" if win else "" %}
{% set name = "r-bioregion" %}
{% set version = "1.4.0" %}

schema_version: 1

context:
  posix: '"m2-" if win else ""'
  native: '"m2w64-" if win else ""'

package:
  name: r-bioregion
  version: ${{ version }}

source:
  url: https://cran.r-project.org/src/contrib/bioregion_${{ version }}.tar.gz
  sha256: 5bb485f919906296d644949fcfdd4b124a43d4ca0ef37b4f69f1023ec0f2ce1a

build:
  number: 0
  script: 
    - {{ R }} -e "install.packages('fastkmedoids', repos='https://cloud.r-project.org')"
    - R CMD INSTALL --build .
  # merge_build_and_host_envs: true
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
  run_exports:
    - {{ pin_subpackage('r-bioregion', max_pin="x.x") }}

requirements:
  build:
    - if: build_platform != target_platform
      then: cross-r-base ${{ r_base }}
    - if: unix
      then: autoconf
    - if: unix
      then: ${{ compiler('c') }}
    - if: win
      then: ${{ compiler('m2w64_c') }}
    - if: unix
      then: ${{ compiler('cxx') }}
    - if: win
      then: ${{ compiler('m2w64_cxx') }}
    - if: win
      then: posix
  host:
    - r-Matrix
    - r-Rdpack
    - r-apcluster
    - r-ape
    - r-base >=4.2
    - r-bipartite
    - r-cluster
    - r-data.table
    - r-dbscan
    - r-dynamicTreeCut
    - r-fastcluster
    # - r-fastkmedoids
    - r-ggplot2
    - r-httr
    - r-igraph
    - r-mathjaxr
    - r-phangorn
    - r-rcartocolor
    - r-rlang
    - r-rmarkdown
    - r-segmented
    - r-sf
    - r-tidyr
    
  run:
    - r-Matrix
    - r-Rdpack
    - r-apcluster
    - r-ape
    - r-base >=4.2
    - r-bipartite
    - r-cluster
    - r-data.table
    - r-dbscan
    - r-dynamicTreeCut
    - r-fastcluster
    # - r-fastkmedoids
    - r-ggplot2
    - r-httr
    - r-igraph
    - r-mathjaxr
    - r-phangorn
    - r-rcartocolor
    - r-rlang
    - r-rmarkdown
    - r-segmented
    - r-sf
    - r-tidyr
    

tests:
  - script:
      - if: not win
        then: $R -e "library('bioregion')"
      - if: win
        then: "\"%R%\" -e \"library('bioregion')\""

about:
  summary: Package proposing a transparent methodological framework to compare bioregionalization methods based on hierarchical and non-hierarchical clustering algorithms and network algorithms.
  license: GPL-3.0-or-later
  homepage: https://github.com/bioRgeo/bioregion, https://bioRgeo.github.io/bioregion/

