{% set version = "0.3.3" %}

package:
  name: dartunifrac-gpu
  version: {{ version }}

source:
  url: https://github.com/jianshu93/DartUniFrac/archive/v{{ version }}-gpu.tar.gz
  sha256: 421fdd26a519709918f0f3dcc0742e15ac0d28f4b98b8d4ac0b7da159f1cb92d

build:
  number: 0
  skip: true  # [not (linux64 or (osx and arm64))]
  run_exports:
    - {{ pin_subpackage('dartunifrac-gpu', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - pkg-config
    - make
    - cmake
    - libgomp  # [linux]
    - hdf5 =*=nompi*
    - hdf5-static =*=nompi*
    - curl
  host:
    - lz4
    - zlib
    - openssl

test:
  commands:
    - dartunifrac-cuda --help       # [linux]
    - striped_unifrac-cuda --help   # [linux]
    - dartunifrac-metal --help      # [osx]
    - striped_unifrac-metal --help  # [osx]

about:
  home: https://github.com/jianshu93/DartUniFrac
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: >-
    DartUniFrac is an ultra-fast UniFrac algorithm that scales to millions
    of samples, using optimal balanced parentheses and Weighted MinHash
    sketching, with CUDA support on Linux and Metal support on macOS.
  dev_url: https://github.com/jianshu93/DartUniFrac
  doc_url: https://github.com/jianshu93/DartUniFrac/blob/v{{ version }}-gpu/README.md

extra:
  additional-platforms:
    - osx-arm64
  recipe-maintainers:
    - jianshu93
