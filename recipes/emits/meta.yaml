{% set name = "emits" %}
{% set version = "0.2.0" %}

package:
  name: "{{ name }}"
  version: "{{ version }}"

source:
  url: https://github.com/ayobi/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 060fcc3e904e8ed53121701359ad1c335616b053b95acf94e1163c8ba1745fdf

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  run:
    - minimap2

test:
  commands:
    - emits --help

about:
  home: https://github.com/ayobi/{{ name }}
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "EM abundance estimation for fungal ITS communities from long-read sequencing"
  dev_url: https://github.com/ayobi/{{ name }}

extra:
  recipe-maintainers:
    - ayobi
