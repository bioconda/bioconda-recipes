{% set name = "jms-metabolite-services" %}
{% set version = "0.5.9" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/jms_metabolite_services-{{ version }}.tar.gz
  sha256: b1fd44b78bfa6e81acab532d99d9170ff374a28bec8f77bbf67a31095fa58f3c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3
    - pip
    - setuptools
  run:
    - python >=3
    - mass2chem

test:
  imports:
    - jms

about:
  home: "https://github.com/shuzhao-li/JMS"
  summary: "Conversion, search of metabolic models and metabolomics data."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/shuzhao-li/JMS"

extra:
  recipe-maintainers:
    - hechth
