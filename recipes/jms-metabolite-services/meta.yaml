{% set name = "jms-metabolite-services" %}
{% set version = "0.5.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/jms_metabolite_services-{{ version }}.tar.gz
  sha256: b1fd44b78bfa6e81acab532d99d9170ff374a28bec8f77bbf67a31095fa58f3c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  run_exports:
    - {{ pin_subpackage('jms-metabolite-services', max_pin="x.x") }}


requirements:
  host:
    - python >=3.0
    - pip
    - setuptools
  run:
    - python >=3.0
    - mass2chem

test:
  imports:
    - jms
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/shuzhao-li/JMS
  summary: conversion, search of metabolic models and metabolomics data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hechth
