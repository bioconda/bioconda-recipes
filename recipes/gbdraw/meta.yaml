{% set name = "gbdraw" %}
{% set version = "0.14.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4cf8296a1ca381e29afa1c860c217e1f1fdcd7a14fcc0768619894e6525ae0ab



build:
  number: 0
  noarch: python
  script:
    - {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
    - mkdir -p $PREFIX/fonts
    - cp -f gbdraw/data/*.ttf $PREFIX/fonts/
  entry_points:
    - gbdraw = gbdraw.cli:main
  run_exports:
    - {{ pin_subpackage("gbdraw", max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - numpy >=1.23
    - pandas
    - fonttools
    - biopython
    - svgwrite
    - cairosvg
    - bcbio-gff
    - tomli
    - losat ==0.1.0

test:
  imports:
    - gbdraw
  commands:
    - gbdraw --help
    - gbdraw circular --help
    - gbdraw linear --help
    - cairosvg --help
    - losat --version

about:
  home: "https://github.com/satoshikawato/gbdraw"
  license: "MIT"
  license_family: "MIT"
  license_file:
    - "LICENSE.txt"
    - "LICENSE_LIBERATION_FONTS.txt"
  summary: "A genome diagram generator for microbes and organelles."
  description: "For details, see https://github.com/satoshikawato/gbdraw"
  fonts_license: "SIL OFL, Version 1.1"
  dev_url: "https://github.com/satoshikawato/gbdraw"

extra:
  recipe-maintainers:
    - satoshikawato
