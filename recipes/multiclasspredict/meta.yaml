
{% set name = "multiclasspredict" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  git_url: https://github.com/usegalaxy-eu/MultiClassPredict.git
  git_rev: main
  
  

build:
  noarch: python
  number: 0
  script:
    - python -m pip install . --no-deps -vv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9,<3.13
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.9,<3.13
    - numpy
    - pandas
    - scikit-learn
    - matplotlib-base
    - seaborn
    - imbalanced-learn
    - lightgbm
    - xgboost
    - pip
    - tabpfn

test:
  imports:
    - multiclasspredict
    
  commands:
    - multiclasspredict --help

about:
  home: https://github.com/usegalaxy-eu/multiclasspredict
  summary: "A FAIR Machine Learning Framework for Benchmarking, Feature Selection, and Hyperparameter Optimization of Machine Learning Models for                      Multiomics Data in Galaxy"
  license: MIT
 

extra:
  recipe-maintainers:
    - renu-pal
