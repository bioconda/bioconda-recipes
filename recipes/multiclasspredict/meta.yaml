
{% set name = "multiclasspredict" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/renu-pal/MultiClassPrediction/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ff2bb7b58b69f0ddbcbd3a34881aecd687c29ecaa75af5a3996bd9753c56e463
  
  

build:
  noarch: python
  number: 0
  script:
    - python -m pip install . --no-deps -vv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9,<3.13
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.9,<3.13
    - numpy
    - pandas
    - scikit-learn
    - matplotlib-base
    - seaborn
    - imbalanced-learn
    - lightgbm
    - xgboost
    - pip
    - tabpfn

test:
  imports:
    - multiclasspredict
    
  commands:
    - multiclasspredict --help

about:
  home: https://github.com/usegalaxy-eu/multiclasspredict
  summary: "A FAIR Machine Learning Framework for Benchmarking, Feature Selection, and Hyperparameter Optimization of machine learning Models for Multiomics Data in Galaxy"
  license: MIT
 

extra:
  recipe-maintainers:
    - renu-pal
