{% set name = "atol-data-broker" %}
{% set version = "0.1.8" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/AToL-Bioinformatics/data-broker/archive/refs/tags/{{ version }}.tar.gz
  sha256: 6214d4634dc41abc30331781f15caa2a25497e9e922d34cf4e0bbac7c242c728

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  entry_points:
    - broker = broker.cli:app
  run_exports:
    - {{ pin_subpackage('atol-data-broker', max_pin="x.x") }}

requirements:
  host:
    - pip
    - python >=3.13,<3.15
    - setuptools-scm
  run:
    - httpx >=0.27.0
    - lxml >=5.2.0
    - pydantic-settings >=2.3.0
    - pydantic >=2.7.0
    - python >=3.13,<3.15
    - rich >=13.7.0
    - tenacity >=8.3.0
    - typer >=0.12.0

test:
  commands:
    - "broker --help | grep 'Usage: broker'"

about:
  home: "https://github.com/AToL-Bioinformatics/data-broker"
  license: "MIT"
  license_family: MIT
  license_file: LICENSE
  summary: "Submits metadata to ENA on behalf of Canopy."
  dev_url: "https://github.com/AToL-Bioinformatics/data-broker"
