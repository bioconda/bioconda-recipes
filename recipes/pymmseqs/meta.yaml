{% set version = "1.2.0" %}

package:
  name: pymmseqs
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pymmseqs/pymmseqs-{{ version }}.tar.gz
  sha256: 9c29ee1327dd58656f166887aab466c7cf29f673037dc612edacb056a178f212

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1
  run_exports:
    - {{ pin_subpackage("pymmseqs", max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - poetry-core
    - pip
  run:
    - python >=3.10
    - pyyaml >=6.0.1,<7.0.0
    - numpy >=1.22.4
    - pandas >=2.2.2

test:
  imports:
    - pymmseqs
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/heispv/pymmseqs
  summary: Python wrapper for MMseqs2
  doc_url: https://github.com/heispv/pymmseqs/wiki
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - prototaxites
