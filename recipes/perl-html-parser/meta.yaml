{% set name = "perl-html-parser" %}
{% set version = "3.85" %}
{% set sha256 = "fd42ba6abe07241cf0ad57be246c3980065f683e4465e59b46af9efebc8e0c71" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/HTML-Parser-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - perl
    - perl-extutils-makemaker
    - perl-html-tagset
    - perl-test-simple
    - perl-uri
    - perl-http-message
  run:
    - perl
    - perl-html-tagset
    - perl-uri
    - perl-http-message

test:
  imports:
    - HTML::Filter
    - HTML::Parser
    
about:
  home: "https://metacpan.org/pod/HTML::Parser"
  license: "perl_5"
  summary: "HTML parser class."
  doc_url: "https://metacpan.org/pod/HTML::Parser"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
