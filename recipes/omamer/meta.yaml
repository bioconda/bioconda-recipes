{% set name = "omamer" %}
{% set version = "2.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/omamer-{{ version }}.tar.gz
  sha256: edd60962ec8ec45c123ccedfc2eb21f54b8eee4b150141d797724fcb22652241

build:
  entry_points:
    - omamer = omamer.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - alive-progress
    - biopython
    - lxml
    - numba
    - numpy >=1.26
    - pandas >2.0.0,<3
    - property-manager
    - rmath4
    - scipy
    - pytables >=3.10.1
    - tqdm
# Extra: build
    - pysais

test:
  imports:
    - omamer
  commands:
    - omamer --help
    - pip check
  requires:
    - pip

about:
  home: https://github.com/DessimozLab/omamer
  summary: OMAmer - tree-driven and alignment-free protein assignment to sub-families
  license: LGPL-3.0
  license_file:
    - LICENSE
    - COPYING.LESSER
    - COPYING

extra:
  recipe-maintainers:
    - alpae
  identifiers:
    - doi:10.1093/bioinformatics/btab219
