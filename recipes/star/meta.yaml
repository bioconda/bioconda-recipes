{% set name = "star" %}
{% set version = "2.7.11b" %}
{% set sha256 = "3f65305e4112bd154c7e22b333dcdaafc681f4a895048fa30fa7ae56cac408e7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/alexdobin/STAR/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    # Fixing shared lib issues
    - patches/0001-do-not-enforce-avx2.patch
    - patches/0002-donotuse_own_htslib.patch
    - patches/0003-create-simd-dispatch.patch
    - patches/0004-use-cxxflags-depends.patch   # [osx]
    - patches/0005-arm64.patch  # [osx]
    # 0 input reads with libc++: upstream commit 14b1f23 from alexdobin/STAR#2691 (#2632), as used by brewsci/homebrew-bio
    - patches/0006-libcxx-stringbuf-pubsetbuf.patch  # [osx]
    # --quantMode crash on uninitialised transform.outQuant (alexdobin/STAR#2142)
    - patches/0007-init-transform-outQuant.patch
    # 2nd pass (--twopassMode) misreads input re-opened through --readFilesCommand with libc++
    - patches/0008-libcxx-fresh-ifstream-on-reopen.patch  # [osx]

build:
  number: 9
  run_exports:
    - {{ pin_subpackage('star', max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - vim
  host:
    - htslib >=1.21
    - llvm-openmp   # [osx]
    - libgomp  # [linux]
    - zlib
  run:
    - htslib >=1.21
    - llvm-openmp   # [osx]
    - libgomp  # [linux]
    # GNU zcat for --readFilesCommand zcat; macOS's /usr/bin/zcat only reads .Z files
    - gzip  # [osx]

test:
  requires:
    - gawk  # run_test.sh
  commands:
    - STAR --version
    - STARlong --version

about:
  home: "https://github.com/alexdobin/STAR"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "An RNA-seq read aligner."
  dev_url: "https://github.com/alexdobin/STAR"
  doc_url: "https://github.com/alexdobin/STAR/blob/{{ version }}/doc/STARmanual.pdf"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:star
    - usegalaxy-eu:rna_starsolo
    - usegalaxy-eu:rna_star
  recipe-maintainers:
    - mjsteinbaugh
