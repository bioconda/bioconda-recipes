{% set name = "fastplong" %}
{% set version = "0.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/OpenGene/fastplong/archive/v{{ version }}.tar.gz
  sha256: c0afdf30f06e61e9837de30377894074b108cbd79b7a018501545806878e2b68

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("fastplong", max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - isa-l
    - libdeflate
    - libhwy
  run:
    - isa-l
    - libdeflate
    - libhwy

test:
  commands:
    - fastplong --help

about:
  home: "https://github.com/OpenGene/fastplong"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Ultra-fast preprocessing and quality control for long-read sequencing data."
  dev_url: "https://github.com/OpenGene/fastplong"
  doc_url: "https://github.com/OpenGene/fastplong/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1093/bioinformatics/bty560
    - doi:10.1002/imt2.107
  skip-lints:
    - compiler_needs_stdlib_c  # until https://github.com/bioconda/bioconda-utils/issues/1095 is resolved
