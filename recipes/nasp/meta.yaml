{% set version = "1.2.1" %}

package:
  name: 'nasp'
  version: {{ version }}

source:
  url: https://github.com/TGenNorth/NASP/archive/v{{ version }}.tar.gz
  sha256: e089485a1ff11b4fa43fe5876251959fecd8cba42baa159675b7e573b25a9a30

build:
  # samtools 1.1 requires openssl 1.1.1; conda-forge python >=3.12 requires openssl 3
  skip: True  # [not linux or py>=312]
  number: 2

requirements:
  build:
    - {{ compiler('go') }}
  host:
    - python
    - pip
  run:
    - python
    # 1.2 builds do not declare their libncurses.so.5 dependency and cannot load;
    # >=1.3 rejects the 'samtools sort - <prefix>' form used by NASP 1.2.1
    - samtools >=1.1,<1.2
    - trimmomatic
    - mummer
    # NASP 1.2.1 imports pkg_resources, which setuptools removed in 82.0.0
    - setuptools <82

test:
  commands:
    - nasp --help
    - nasp matrix --help
    - samtools --version

about:
  home: 'https://github.com/TGenNorth/nasp'
  license: 'Academic and Research License'
  license_file: 'LICENSE.rst'
  summary: 'NASP: an accurate, rapid method for the identification of SNPs in WGS datasets that supports flexible input and output formats'

extra:
  identifiers:
    - doi:10.1099/mgen.0.000074
  recipe-maintainers:
    - corburn
