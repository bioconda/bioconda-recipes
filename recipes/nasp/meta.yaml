{% set version = "1.2.1" %}

package:
  name: 'nasp'
  version: {{ version }}

source:
  url: https://github.com/TGenNorth/NASP/archive/v{{ version }}.tar.gz
  sha256: e089485a1ff11b4fa43fe5876251959fecd8cba42baa159675b7e573b25a9a30
  patches:
    - python-compat.patch
    - current-bcftools.patch
    - samtools13-sort.patch

build:
  skip: True  # [py<311 or not linux64]
  number: 4
  run_exports:
    - {{ pin_subpackage("nasp", max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('go-nocgo') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    # Verify the versioned targets during the build.
    - gatk 3.8 hdfd78af_12
    - picard 2.27.5 hdfd78af_0
    - varscan 2.4.6 hdfd78af_0
    - trimmomatic 0.40 hdfd78af_0
    - snap-aligner ==2.0.5
  run:
    - python
    - biopython
    # The tested intermediate release includes the startup reference-cache fix.
    - samtools ==1.3.1
    - bcftools >=1.2,<2
    - openjdk >=8,<9
    - trimmomatic 0.40 hdfd78af_0
    - gatk 3.8 hdfd78af_12
    - picard 2.27.5 hdfd78af_0
    - varscan 2.4.6 hdfd78af_0
    - bwa ==0.7.19
    - bowtie2 ==2.5.5
    - snap-aligner ==2.0.5
    - mummer

test:
  commands:
    - nasp --help
    - nasp matrix --help
    - filter_matrix_by_genome.py --help
    - filter_matrix_by_distance.py --help

about:
  home: 'https://github.com/TGenNorth/nasp'
  license: 'Academic and Research License'
  license_file: 'LICENSE.rst'
  summary: 'NASP: an accurate, rapid method for the identification of SNPs in WGS datasets that supports flexible input and output formats'

extra:
  identifiers:
    - doi:10.1099/mgen.0.000074
  recipe-maintainers:
    - corburn
