{% set version = "1.2.1" %}

package:
  name: 'nasp'
  version: {{ version }}

source:
  url: https://github.com/TGenNorth/NASP/archive/v{{ version }}.tar.gz
  sha256: e089485a1ff11b4fa43fe5876251959fecd8cba42baa159675b7e573b25a9a30
  # Upstream (TGenNorth/NASP) is no longer maintained. Fixes from
  # https://github.com/stubbyfowl/NASP/tree/fix/modernize-deps
  patches:
    - 0001-importlib-resources.patch   # pkg_resources was removed in setuptools 82
    - 0002-samtools-sort-syntax.patch  # 'samtools sort - <prefix>' was removed in samtools 1.3
    - 0003-raw-regex-strings.patch     # SyntaxWarning on Python >=3.12
    - 0004-retire-samtools-snp-caller.patch  # bcftools 0.1.x syntax; no packaged bcftools accepts it

build:
  skip: True  # [not linux]
  number: 4
  run_exports:
    - {{ pin_subpackage('nasp', max_pin="x") }}

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - samtools
    - trimmomatic
    - mummer

test:
  commands:
    - nasp --help
    - nasp matrix --help
    - samtools --version

about:
  home: 'https://github.com/TGenNorth/nasp'
  license: 'Academic and Research License'
  license_file: 'LICENSE.rst'
  summary: 'NASP: an accurate, rapid method for the identification of SNPs in WGS datasets that supports flexible input and output formats'

extra:
  identifiers:
    - doi:10.1099/mgen.0.000074
  recipe-maintainers:
    - corburn
