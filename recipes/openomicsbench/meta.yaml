{% set name = "openomicsbench" %}
{% set version = "6.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fcf65241f2bd3235089f079e44d84e32ae94aa6a64f7107748c8fd4b4385b445

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python >=3.11
    - setuptools >=68
  run:
    - python >=3.11
    - pydantic >=2.13,<3
    - numpy >=2.3,<3

test:
  imports:
    - omicsbench
  commands:
    - omicsbench --help

about:
  home: https://github.com/vxxqv/openomicsbench
  summary: Traceable omics benchmarks and deterministic FASTA and FASTQ tools
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/vxxqv/openomicsbench

extra:
  recipe-maintainers:
    - vxxqv
