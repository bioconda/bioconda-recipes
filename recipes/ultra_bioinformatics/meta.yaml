{% set name = "ultra_bioinformatics" %}
{% set version = "0.3.0" %}

package:
  name: {{ name | lower }}
  version: {{ version }}

source:
  url: https://github.com/ksahlin/ultra/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 05a16bc19c6dc86a8c736b100767bd21839e1f2c92debc69aa158ebf4cb3c6f6

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name | lower, max_pin="x.x") }}
  script:
    # libparasail-sys generates its bindings with bindgen, which loads
    # libclang at build time and does not find it on its own.
    - export LIBCLANG_PATH=$BUILD_PREFIX/lib
    - cd rust
    - cargo-bundle-licenses --format yaml --output ../THIRDPARTY.yml
    - cargo install -v --locked --no-track --root $PREFIX --path .

requirements:
  build:
    # namfinder, edlib and zlib are vendored and compiled from source by
    # build.rs, so a C and a C++ toolchain are needed alongside cargo.
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    # libparasail-sys probes pkg-config for a module named `parasail` and
    # otherwise builds its vendored copy with cmake. bioconda's parasail
    # package ships `parasail-1.pc`, so the probe cannot match it and the
    # cmake path is the one taken, and cmake needs a build tool. The source is
    # vendored in the crate, so this needs no network.
    - cmake
    - make
    - clangdev
    - cargo-bundle-licenses
  run:
    # The only runtime dependency. uLTRA calls minimap2 to detect reads
    # aligning outside the annotated regions; --disable_mm2 skips that step.
    - minimap2

test:
  commands:
    # Only what survives the mulled test, which installs the built package
    # into a bare container where `source_files` are not present. An earlier
    # revision ran a real alignment over test/ and failed there with
    # "cannot read reference test/SIRV_genes.fasta". The repository's own CI
    # runs that alignment on every push, so the coverage is not lost.
    - uLTRA --version
    - uLTRA --help > /dev/null
    - uLTRA index --help > /dev/null
    - uLTRA align --help > /dev/null

about:
  home: https://github.com/ksahlin/ultra
  license: GPL-3.0-only
  license_file:
    - LICENSE.txt
    - THIRDPARTY.yml  # generated by cargo-bundle-licenses
  summary: Splice alignment of long transcriptomic reads to a genome, guided by exon annotations
  description: >
    uLTRA is a tool for splice alignment of long transcriptomic reads to a
    genome, guided by a database of exon annotations. It is particularly
    accurate when aligning to small exons. As of 0.3.0 uLTRA is implemented in
    Rust; the command line and output files are unchanged.
  dev_url: https://github.com/ksahlin/ultra
  doc_url: https://github.com/ksahlin/ultra

extra:
  recipe-maintainers:
    - ksahlin
  identifiers:
    - doi:10.1093/bioinformatics/btab540
