{% set version = "0.3.0" %}

package:
  name: tidk
  version: {{ version }}

source:
  url: https://github.com/tolkit/telomeric-identifier/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 180e85ca4e5fdbd8d88c0497f1e7dfe3e2a69a691f535bb35b2f998c38d46c3c

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('tidk', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - cmake
    - make
    - pkg-config  # [osx]
  host:
    - openssl

test:
  commands:
    - tidk -h

about:
  home: "https://github.com/tolkit/telomeric-identifier"
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "Identify and find telomeres, or telomeric repeats in a genome."
  dev_url: "https://github.com/tolkit/telomeric-identifier"
  doc_url: "https://github.com/tolkit/telomeric-identifier/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1093/bioinformatics/btaf049
