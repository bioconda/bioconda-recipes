{% set version = "4.4.1" %}

package:
  name: bwa-mem4
  version: {{ version }}

source:
  url: https://github.com/IPNP-BIPN/bwa-mem4/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 623f8dd64d1bc91444aa7b93417c78b4200a4f920faaf18d1b9231fba2af4f7e

build:
  number: 0
  skip: True  # [win]
  run_exports:
    - {{ pin_subpackage('bwa-mem4', max_pin='x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - make
    - cmake
    - pkg-config
    # bindgen only needs libclang. On osx, clangdev's llvmdev puts an unversioned libLLVM.dylib
    # (LLVM 19) in BUILD_PREFIX/lib, where conda-forge rust >= 1.99 resolves its own
    # @rpath/libLLVM.dylib (LLVM 23) and aborts with an LLVM version mismatch.
    - clangdev  # [not osx]
    - libclang  # [osx]
  host:
    - zlib
    - bzip2
    - xz
    - libdeflate

test:
  commands:
    - bwa-mem4 --version
    - bwa-mem4 --help

about:
  home: https://github.com/IPNP-BIPN/bwa-mem4
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Byte-identical Rust reimplementation of bwa-mem2 2.3, with lower resident memory"
  description: |
    bwa-mem4 aligns short reads to a reference and produces SAM/BAM/CRAM that is byte-identical to
    bwa-mem2 2.3, verified on a real 32.9x human WGS. It reads the same index format, takes the same
    `mem` command line, and peaks at ~11 GB of RAM on hg38 versus bwa-mem2's ~17 GB. SIMD kernels
    (NEON on arm64, AVX2 on x86_64) are chosen at runtime.
  dev_url: https://github.com/IPNP-BIPN/bwa-mem4

extra:
  recipe-maintainers:
    - BenjaminDEMAILLE
  additional-platforms:
    - linux-aarch64
    - osx-arm64
