{% set name = "proteomiqon-labeledproteinquantification" %}
{% set version = "0.1.0" %}
{% set sha256 = "76e0f318c7566e8caaf94191244d8e6529f1de50df6d793e48a3d73f38a2fd7f" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.LabeledProteinQuantification/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-labeledproteinquantification"
    - test -f "$PREFIX/lib/dotnet/tools/LabeledProteinQuantification/ProteomIQon.LabeledProteinQuantification.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-labeledproteinquantification"
    - grep -q "LabeledProteinQuantification/ProteomIQon.LabeledProteinQuantification.dll" "$PREFIX/bin/proteomiqon-labeledproteinquantification"


about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: "Calculates light-to-heavy abundance ratios for protein groups."
  description: |
    After JoinQuantPepIonsWithProteins, each quantified peptide ion is assigned to a protein group. LabeledProteinQuantification combines the light and heavy peptide intensities and calculates a light-to-heavy ratio for each protein group and run.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/labeled-protein-quantification/
