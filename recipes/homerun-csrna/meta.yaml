{% set version = "1.1.2" %}

package:
  name: homerun-csrna
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/homerun-csRNA/homerun_csrna-{{ version }}.tar.gz
  sha256: 2cc16a68ba9a7d2d278786b53863e0d0f56a6a5b09de1d49f07b9397f0341d16

build:
  entry_points:
    - homerun = homerun.pipeline:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage('homerun-csrna', max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - setuptools >=61.0
    - pip
  run:
    - python >=3.9
    - pandas >=2.0
    - numpy >=1.24
    - matplotlib-base >=3.7
    - openpyxl
    - seaborn-base >=0.12
    - reportlab >=4.0
    - samtools
    - homer
    - skewer
    - star
    - hisat2

test:
  imports:
    - homerun
  commands:
    - pip check
    - homerun --help

about:
  home: https://thomasmnguyen.dev/homerun
  summary: "csRNA-seq pipeline"
  license: MIT
  license_file: LICENSE
  doc_url: https://thomasmnguyen.dev/homerun
  dev_url: https://github.com/thomasmnguyen/homerun-csrna
