{% set name = "metatrawl" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 27e5530251bc7ef36c85edeafa468ab372a549115f30ea3bfa7342166f46bf2f

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - poetry-core >=2.0
  run:
    - python >=3.12
    - click >=8.1
    - duckdb >=1.1
    - h5py >=3.10
    - matplotlib-base >=3.10
    - numpy >=1.26
    - pyarrow >=15.0
    - polars >=1.0
    - rich >=13.0
    - scipy >=1.16
    - seaborn >=0.13
    - zipstrain >=1.0.4,<2
    - zstandard >=0.23
    - sylph
    - samtools
    - bowtie2
    - prodigal
    - sra-tools >=2.11
    - ncbi-datasets-cli

test:
  imports:
    - metatrawl
  commands:
    - metatrawl --version
    - metatrawl --help
    - zipstrain --help
    - sylph --version
    - samtools --version
    - bowtie2 --version
    - datasets --version
    - command -v prodigal
    - command -v prefetch
    - command -v fasterq-dump

about:
  home: https://github.com/OlmLab/MetaTrawl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Scalable profiling and strain-level comparison of metagenomic samples."
  dev_url: https://github.com/OlmLab/MetaTrawl

extra:
  recipe-maintainers:
    - parsaghadermarzi
