{% set name = "metatrawl" %}
{% set version = "2.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 10e2fba72ece6954342d9bf53c85f883593aa809546aff89c86e45063140e6b6

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - poetry-core >=2.0
  run:
    - python >=3.12
    - click >=8.1
    - duckdb >=1.1
    - h5py >=3.10
    - matplotlib-base >=3.10
    - numpy >=1.26
    - pyarrow >=22,<23
    - polars >=1.36.1,<3
    - rich >=13.0
    - scipy >=1.16
    - seaborn >=0.13
    - zipstrain >=2.0.0,<3
    - zipstrain-rust-profiler >=0.2.0,<0.3
    - zstandard >=0.23
    - sylph
    - samtools
    - bowtie2
    - prodigal
    - sra-tools >=2.11
    - ncbi-datasets-cli

test:
  imports:
    - metatrawl
    - metatrawl.pair_api
    - metatrawl.v2_storage
  commands:
    - metatrawl --version
    - metatrawl --help
    - metatrawl sync-profile --help
    - metatrawl matrix sync-compare --help
    - metatrawl init --db metatrawl-test.duckdb
    - metatrawl database info --db metatrawl-test.duckdb
    - python -c "from metatrawl.provenance import SCHEMA_VERSION; assert SCHEMA_VERSION == 2"
    - python -c "import polars as pl; assert pl.DataFrame({'x':[1]}).select(pl.col('x').sum()).item() == 1"
    - zipstrain --help
    - sylph --version
    - samtools --version
    - bowtie2 --version
    - datasets --version
    - command -v prodigal
    - command -v prefetch
    - command -v fasterq-dump
    - command -v zipstrain-rust-profiler
    - python -c "from zipstrain.profile_backends import load_backend; assert load_backend('rust_profiler').API_VERSION == 1"

about:
  home: https://github.com/OlmLab/MetaTrawl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Scalable profiling and strain-level comparison of metagenomic samples."
  dev_url: https://github.com/OlmLab/MetaTrawl

extra:
  recipe-maintainers:
    - parsaghadermarzi
