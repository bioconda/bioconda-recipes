{% set name = "metatrawl" %}
{% set version = "1.1.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9391c1a2d9b4db69e73a864948d5187a7e2e79291bf8b6f091d4cd975ba22e0e

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - poetry-core >=2.0
  run:
    - python >=3.12
    - click >=8.1
    - duckdb >=1.1
    - h5py >=3.10
    - matplotlib-base >=3.10
    - numpy >=1.26
    - pyarrow >=22,<23
    - polars >=1.34,<2
    - rich >=13.0
    - scipy >=1.16
    - seaborn >=0.13
    - zipstrain >=1.2.2,<2
    - zipstrain-rust-profiler >=0.1.0,<1
    - zstandard >=0.23
    - sylph
    - samtools
    - bowtie2
    - prodigal
    - sra-tools >=2.11
    - ncbi-datasets-cli

test:
  imports:
    - metatrawl
  commands:
    - metatrawl --version
    - metatrawl --help
    - metatrawl sync-profile --help
    - python -c "import polars as pl; assert pl.DataFrame({'x':[1]}).select(pl.col('x').sum()).item() == 1"
    - zipstrain --help
    - sylph --version
    - samtools --version
    - bowtie2 --version
    - datasets --version
    - command -v prodigal
    - command -v prefetch
    - command -v fasterq-dump
    - command -v zipstrain-rust-profiler
    - python -c "from zipstrain.profile_backends import load_backend; assert load_backend('rust_profiler').API_VERSION == 1"

about:
  home: https://github.com/OlmLab/MetaTrawl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Scalable profiling and strain-level comparison of metagenomic samples."
  dev_url: https://github.com/OlmLab/MetaTrawl

extra:
  recipe-maintainers:
    - parsaghadermarzi
