{% set name = "nucflag" %}
{% set version = "1.0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/nucflag-{{ version }}.tar.gz
  sha256: babeeae0574e64ca5a868c089912de9c93b7175c36e8195dd4150964203fa956

build:
  number: 0
  noarch: python
  entry_points:
    - nucflag = nucflag.main:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - setuptools
    - pip
  run:
    - python >=3.11
    - matplotlib-base >=3.8.3
    - numpy >=1.26.4
    - polars >=1.6.0,<2.0
    - python-intervaltree >=3.2.1
    - py_nucflag >=0.1.9
    - pybigwig >=0.3.25
    - pyideogram >=0.1.0

test:
  imports:
    - nucflag
  commands:
    - nucflag --help

about:
  home: "https://github.com/logsdon-lab/NucFlag"
  summary: "NucFlag misassembly identifier."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/logsdon-lab/NucFlag"
  doc_url: "https://github.com/logsdon-lab/NucFlag/wiki"

extra:
  recipe-maintainers:
    - koisland
