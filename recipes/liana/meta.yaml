{% set name = "liana" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/scverse/{{ name }}/archive/refs/tags/V{{ version }}.tar.gz
  sha256: be4a3a4412846e5a37bbaa6104dbeda72e8a6399d8aec028f41c06929fe21a65

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - liana-install-skills = liana._skills.install:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.12
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=3.12
    - anndata >=0.13
    - fast-array-utils
    - mudata >=0.4
    - pydantic
    - pydantic-settings
    - python-dotenv
    - pandas
    - scanpy >=1.12
    - scverse-misc >=0.1.4
    - numba
    #- numba >=0.60.0,<0.61.0  # pip check install gets dependency error with decoupler
    - plotnine >=0.10.1
    - session-info2
    - tqdm >=4
    - docrep >=0.3.1
    - pre-commit >=3.0.0
    - omnipath >=1.0.6
    - decoupler-py >=2.0.0
    - pydeseq2 >=0.3.5
    - cell2cell
    - muon
    - mofax
    - mofapy2 >=0.7.0
    - corneto
    - cvxpy >=1.6.1
    - requests >=2.25.1

test:
  imports:
    - liana

about:
  home: "https://github.com/scverse/liana"
  doc_url: "https://liana.readthedocs.io"
  summary: "LIANA+: a one-stop-shop framework for cell-cell communication."
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  dev_url: "https://github.com/scverse/liana"

extra:
  recipe-maintainers:
    - nilchia
