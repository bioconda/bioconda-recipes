{% set name = "perl-socket" %}
{% set version = "2.043" %}
{% set sha256 = "236aab8262e928d05be0bb0a68fae9e829913f9d3fa4bb6aebba9e30edb189ad" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Socket-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - perl
    - perl-extutils-makemaker
    - perl-extutils-constant
    - perl-extutils-cbuilder
  run:
    - perl

test:
  imports:
    - Socket

extra:
  additional-platforms:
    - linux-aarch64
    # needs perl-extutils-constant
    #- osx-arm64

about:
  home: "https://metacpan.org/pod/Socket"
  license: "perl_5"
  summary: "Networking constants and support functions."
  doc_url: "https://metacpan.org/pod/Socket"
