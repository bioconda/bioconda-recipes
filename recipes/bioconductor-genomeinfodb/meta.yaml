{% set version = "1.48.0" %}
{% set name = "GenomeInfoDb" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: a2a1c79535a195453468244d738b17da

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-genomeinfodb", max_pin="x.x") }}'
  noarch: generic

# Suggests: GenomeInfoDbData, R.utils, data.table, GenomicRanges, Rsamtools, GenomicAlignments, BSgenome, GenomicFeatures, TxDb.Dmelanogaster.UCSC.dm3.ensGene, BSgenome.Scerevisiae.UCSC.sacCer2, BSgenome.Celegans.UCSC.ce2, BSgenome.Hsapiens.NCBI.GRCh38, RUnit, BiocStyle, knitr
requirements:
  host:
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - bioconductor-ucsc.utils >=1.8.0,<1.9.0
    - r-base
  run:
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - bioconductor-ucsc.utils >=1.8.0,<1.9.0
    - r-base

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: Artistic-2.0
  summary: Utilities for manipulating chromosome names, including modifying them to follow a particular naming style
  description: Contains data and functions that define and allow translation between different chromosome sequence naming conventions (e.g., "chr1" versus "1"), including a function that attempts to place sequence names in their natural, rather than lexicographic, order.

extra:
  identifiers:
    - biotools:genomeinfodb
    - doi:10.1038/nmeth.3252
  parent_recipe:
    name: bioconductor-genomeinfodb
    path: recipes/bioconductor-genomeinfodb
    version: 1.16.0

