{% set name = "fastq-dl" %}
{% set version = "3.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/f/fastq_dl/fastq_dl-{{ version }}.tar.gz
  sha256: ed6c6677f37f9d43bc3eff9bb41cf51211b2b25fa38401db0203ec953b311179

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - fastq-dl = fastq_dl.cli.download:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10,<3.14
    - poetry
    - pip
  run:
    - pigz
    - python >=3.10,<3.14
    - pysradb >=2.3
    - requests
    - rich-click >=1.6.0
    - sra-tools >=3.2.0
    - wget

test:
  commands:
    - fastq-dl --version
    - fastq-dl --help
    - fastq-dl --check
    - fastq-dl --accession SRX3606281 --provider SRA --outdir test-small-sra --verbose && rm -rf test-small-sra/
    - fastq-dl --accession SRX3606281 --outdir test-small-ena --verbose && rm -rf test-small-ena/

about:
  home: https://github.com/rpetit3/fastq-dl
  license: MIT
  license_file: LICENSE
  summary: A tool to download FASTQs associated with Study, Experiment, or Run accessions.

extra:
  recipe-maintainers:
    - rpetit3
