{% set name = "beegees" %}
{% set version = "3.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0812ebbe35489a4ba8127341cc92de8557ab09d03069df505e279a7f3a03ea8fd

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
  run:
    - python >=3.11
    - snakemake >=9.9
    - pyyaml
    - fastp
    - blast
    - hmmer
    - trim-galore
    - bbtools
    - mitogeneextractor

test:
  commands:
    - beegees --version
    - beegees --help

about:
  home: https://github.com/bge-barcoding/BeeGees
  license: MIT
  license_file: LICENSE
  summary: High-throughput protein-coding DNA barcode recovery from genome skims
  doc_url: https://github.com/bge-barcoding/BeeGees
  dev_url: https://github.com/bge-barcoding/BeeGees

extra:
  recipe-maintainers:
    - SchistoDan
