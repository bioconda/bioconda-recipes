{% set name = "beegees" %}
{% set version = "3.0.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9831306275f374199fef30154fa43f89337bb57d90c07df496c758f048c9d9ef

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
  run:
    - python >=3.11
    - snakemake >=9.9
    - snakemake-executor-plugin-slurm >=1.6
    - snakemake-executor-plugin-slurm-jobstep >=0.3
    - pyyaml
    - pandas >=2.2.3
    - numpy >=1.26.4
    - biopython >=1.84
    - fastp >=0.23.4
    - blast >=2.17.0
    - hmmer >=3.4
    - trim-galore >=0.6.10
    - pigz >=2.8
    - bwa >=0.7.19
    - multiqc >=1.35
    - snakemake-executor-plugin-slurm >=1.6.1
    - snakemake-executor-plugin-slurm-jobstep >=0.3.0
    - mitogeneextractor >=1.9.6
    - r-base >=4.4
    - r-tidyverse >=2.0.0
    - gene-fetch >=1.0.21

test:
  commands:
    - beegees --version
    - beegees --help

about:
  home: https://github.com/bge-barcoding/BeeGees
  license: MIT
  license_file: LICENSE
  summary: High-throughput protein-coding DNA barcode recovery from genome skims
  doc_url: https://github.com/bge-barcoding/BeeGees
  dev_url: https://github.com/bge-barcoding/BeeGees

extra:
  recipe-maintainers:
    - SchistoDan
