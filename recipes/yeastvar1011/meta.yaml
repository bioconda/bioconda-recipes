{% set name = "yeastvar1011" %}
{% set version = "22.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: "https://github.com/YueDong0211/YeastVar1011/archive/refs/tags/v22.1.1.tar.gz"
  sha256: 036ec00aad9570e71dc63c440c6cf8358eb8a6214db46362ad4f10c1d6a74a7c

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  run:
    - nodejs >=22,<25
    - __unix

test:
  commands:
    - yeastvar1011 --help
    - yeastvar1011 --version
    - yeastvar1011-doctor --help
    - yeastvar1011-doctor --version
    - yeastvar1011-doctor --port 0 --json

about:
  home: https://yuedong0211.github.io/YeastVar1011/
  dev_url: https://github.com/YueDong0211/YeastVar1011
  doc_url: https://github.com/YueDong0211/YeastVar1011/blob/main/docs/DEPLOYMENT.md
  summary: Yeast single-cell research planning and source-attributed marker evidence
  description: |
    A local browser workbench for yeast single-cell research planning, with
    marker evidence, quality-control metrics, methods, citations, and exports.
    Its separately configured analysis workflow definitions are included as
    source files; this package does not install scientific execution environments.
    The listed licenses apply to their respective components and source material,
    as documented in THIRD_PARTY_NOTICES.md and DATA_SOURCES.md.
  license: MIT AND Apache-2.0 AND CPAL-1.0 AND OFL-1.1 AND CC-BY-SA-3.0 AND CC-BY-4.0 AND CC-BY-NC-4.0 AND CC-BY-NC-ND-4.0
  license_family: OTHER
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - DATA_SOURCES.md
    - dist/vendor/THREE-LICENSE.txt
    - dist/vendor/EXCELJS-LICENSE.txt
    - dist/vendor/katex/LICENSE
    - dist/vendor/katex/fonts/OFL.txt
    - dist/vendor/transformers-3.8.1/LICENSE
    - dist/vendor/transformers-3.8.1/ONNXRUNTIME-LICENSE.txt
    - dist/vendor/transformers-3.8.1/JINJA-LICENSE.txt
    - dist/vendor/transformers-3.8.1/QWEN-LICENSE.txt
    - dist/vendor/citations/LICENSE-citeproc-js
    - dist/vendor/citations/CPAL-1.0.txt
    - dist/vendor/citations/AGPL-3.0-only.txt
    - dist/vendor/citations/LICENSE-CSL.txt

extra:
  recipe-maintainers:
    - YueDong0211
  notes: |
    Run yeastvar1011 --port 4173 and open its printed loopback URL; Ctrl+C stops it.
    Use yeastvar1011-doctor --port 0 for a read-only environment and data check.
    The wrappers resolve the installed share/yeastvar1011 directory relative to
    their own bin directory and support --help and --version.
    Scientific source facts are attributed; publication text, figures, and
    original downloaded supplementary documents are not included. Source rights
    are component-specific; the package is not represented as wholly MIT.
