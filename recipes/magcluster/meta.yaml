{% set name = "magcluster" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 63e34f2c6257f5e673152a41d1246d94e9f41cbafc2129d727375031be0f7439

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - blast <=2.9
    - pip
    - setuptools >=61
  run:
    - python >=3.10
    - blast <=2.9
    - biopython >=1.80
    - pyrodigal >=3.0.0
    - pyhmmer >=0.10.0
    - pyfamsa >=0.6.0
    - pandas >=2.0.0
    - typer >=0.9.0
    - rich >=13.0.0
    - pyyaml >=6.0
    - pygenomeviz >=1.0.0
    - clinker-py >=0.0.30
    
test:
  commands:
    - magcluster -h

about:
  home: "https://github.com/runjiaji/magcluster"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  summary: "Magnetosome gene cluster identification, annotation and visualization tool"

extra:
  identifiers:
    - doi:10.1128/mra.01031-21
