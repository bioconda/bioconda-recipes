{% set name = "magcluster" %}
{% set version = "1.0.0" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 63e34f2c6257f5e673152a41d1246d94e9f41cbafc2129d727375031be0f7439


build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python >=3.6
    - prokka =1.13.4
    - blast <=2.9
    - pip

  run:
    - python >=3.6
    - clinker-py
    - pandas
    - prokka =1.13.4
    - blast <=2.9
    
test:
  commands:
    - magcluster -h

about:
  home: "https://github.com/runjiaji/magcluster"
  license: "GPL-2.0-or-later"
  license_family: GPL2
  summary: "Magnetosome gene cluster identification, annotation and visualization tool"

