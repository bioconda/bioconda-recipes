{% set name = "magcluster" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 63e34f2c6257f5e673152a41d1246d94e9f41cbafc2129d727375031be0f7439

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  entry_points:
    - magcluster = magcluster.cli:app
  run_exports:
    - {{ pin_subpackage('magcluster', max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61.0
  run:
    - python >=3.10
    - biopython >=1.80
    - pyrodigal >=3.0.0
    - pyhmmer >=0.10.0
    - pyfamsa >=0.6.0
    - pandas >=2.0.0
    - typer >=0.9.0
    - rich >=13.0.0
    - pyyaml >=6.0
    - pygenomeviz >=1.0.0
    - clinker-py >=0.0.30

test:
  imports:
    - magcluster
    - magcluster.core
    - magcluster.viz
    - magcluster.utils
  commands:
    - magcluster --help
    - magcluster run --help
    - magcluster db --help

about:
  home: "https://github.com/RunJiaJi/MagCluster"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE.txt
  summary: "Fast, accurate, Prokka-free Magnetosome Gene Cluster (MGC) identification, classification, and visualization"
  description: |
    MagCluster is a specialized bioinformatics toolkit for identifying,
    annotating, and visualizing Magnetosome Gene Clusters (MGCs) in prokaryotic genomes.
    Version 1.0 removes external Prokka and BLAST dependencies, utilizing native
    Pyrodigal and PyHMMER with 92 curated HMM profiles and multi-locus synteny slicing.
  doc_url: "https://github.com/RunJiaJi/MagCluster#readme"
  dev_url: "https://github.com/RunJiaJi/MagCluster"

extra:
  recipe-maintainers:
    - RunJiaJi
  identifiers:
    - doi:10.1128/mra.01031-21
