{% set name = "magcluster" %}
{% set version = "1.1.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9b716f24777d1d60cf5d96fc741e05381c2cdb8d70bf14638aed5d80445ccd44

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - magcluster = magcluster.cli:app
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61.0
  run:
    - python >=3.10
    - biopython >=1.80
    - pyrodigal >=3.0.0
    - pyhmmer >=0.10.1
    - typer >=0.16.0
    - rich >=13.0.0
    - pyyaml >=6.0
    - pygenomeviz >=1.0.0
    - clinker-py >=0.0.30

test:
  imports:
    - magcluster
    - magcluster.core
    - magcluster.viz
    - magcluster.utils
  commands:
    - magcluster --help
    - magcluster run --help
    - magcluster db --help

about:
  home: "https://github.com/RunJiaJi/MagCluster"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: "LICENSE.txt"
  summary: "Fast, accurate, Prokka-free Magnetosome Gene Cluster (MGC) identification, classification, and visualization."
  description: |
    MagCluster is a specialized bioinformatics toolkit for identifying,
    annotating, and visualizing Magnetosome Gene Clusters (MGCs) in prokaryotic genomes.
    Version 1.0 removes external Prokka and BLAST dependencies, utilizing native
    Pyrodigal and PyHMMER with 92 curated HMM profiles and multi-locus synteny slicing.
  doc_url: "https://github.com/RunJiaJi/MagCluster#readme"
  dev_url: "https://github.com/RunJiaJi/MagCluster"

extra:
  recipe-maintainers:
    - RunJiaJi
  identifiers:
    - doi:10.1128/mra.01031-21
