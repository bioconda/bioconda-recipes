{% set name = "liftover" %}
{% set version = "1.6.0" %}
{% set sha256 = "5055a96dc85f2c459b838710fd04eb727291eca5f6df6f551f31d224bd434ba7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/liftover-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - python
    - setuptools
    - pip
    - cython
    - zlib
  run:
    - python
    - urllib3
    - platformdirs

test:
  imports:
    - liftover

about:
  home: 'https://github.com/jeremymcrae/liftover'
  summary: 'A Python package for converting point coordinates between genome assemblies, inspired by pyliftover.'
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  dev_url: 'https://github.com/jeremymcrae/liftover'

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - mencian
