{% set name = "metacontextify" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/metacontextify-{{ version }}.tar.gz
  sha256: 1c1426db033ecf74045005e65b3d221a4c14c902d1c11dd5b611587d80d86482

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
  - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - setuptools >=45
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=3.8
    - pandas >=1.3.0
    - requests >=2.25.0
    - urllib3 >=1.26.0
    - xarray >=0.20.0
    - copernicusmarine >=0.1.0
    - beautifulsoup4 >=4.9.0
    - appdirs >=1.4.4
    - duckdb
    - typer
    - netcdf4

test:
  imports:
    - metacontextify
  commands:
    - pip check
    - metacontextify --help
  requires:
    - pip

about:
  home: https://github.com/MaartenLangen/metacontextify
  summary: Automated environmental annotation of marine metagenomic samples
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MaartenLangen
