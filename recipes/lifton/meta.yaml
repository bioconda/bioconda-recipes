{% set name = "lifton" %}
{% set version = "1.0.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2ffa963679182a97cfe6c69efdd1b4b80180e2923db8df238cf65c16ee654ef4

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - lifton = lifton.lifton:main
    - gff3-validate = lifton.gff3_validator:_main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools <81
    - wheel
  run:
    - python >=3.10
    - numpy >=1.22.0
    - biopython >=1.76
    - cigar >=0.1.3
    - parasail-python >=1.2.4
    - intervaltree >=3.1.0
    - interlap >=0.2.6
    - networkx >=3.3
    - pyfaidx >=0.5.8
    - pysam >=0.19.1
    - gffutils >=0.10.1
    - ujson >=3.2.0
    - python-duckdb >=1.0
    - pyarrow >=14
    - mappy
    # External aligners LiftOn invokes as subprocesses:
    - minimap2
    - miniprot

test:
  imports:
    - lifton
    - lifton.gffbase
  commands:
    - lifton -V
    - lifton -h
    - gff3-validate -h

about:
  home: https://github.com/Kuanhao-Chao/LiftOn
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: "Accurate homology-based genome-annotation lift-over combining DNA and protein alignment"
  description: |
    LiftOn is a homology-based genome-annotation lift-over tool. Given a reference
    genome and its annotation plus a target genome, it produces an annotation for
    the target by combining DNA-level alignment (Liftoff / minimap2) with
    protein-level alignment (miniprot) via a protein-maximization CDS-chaining
    algorithm and an ORF-rescue pass. It also ships a standalone GFF3 validator
    (gff3-validate).
  doc_url: https://ccb.jhu.edu/lifton/
  dev_url: https://github.com/Kuanhao-Chao/LiftOn

extra:
  recipe-maintainers:
    - Kuanhao-Chao
  identifiers:
    - doi:10.1101/gr.279620.124
