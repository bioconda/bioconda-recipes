{% set version = "0.1.10" %}

package:
  name: lash
  version: "{{ version }}"

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('lash', max_pin="x.x") }}


source:
  url: https://github.com/jianshu93/lash/archive/refs/tags/v{{ version }}.tar.gz
  sha256: fa085fa8782a0e351fcad1e8a6804feeac12ca67eb8de6788020e67a99041497

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}


test:
  commands:
    - lash --help

about:
  home: https://github.com/jianshu93/lash
  license: MIT
  license_file: LICENSE-MIT
  summary: "Space-efficient distance approximation for (meta)genomes, using HyperMinHash, HyperLogLog, UltraLogLog, and ExaLogLog"

extra:
  recipe-maintainers:
    - jianshu93
    - clairewowo
  additional-platforms:
    - osx-arm64
