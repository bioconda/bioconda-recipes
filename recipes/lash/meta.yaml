{% set version = "0.1.7" %}

package:
  name: lash
  version: "{{ version }}"

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('lash', max_pin="x.x") }}
  skip: True

source:
  url: https://github.com/jianshu93/lash/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 673cb39a30c58dc05e3cef37924031a097cd567b071aa821f93a267e8537a818
  
requirements:
  build:
    - {{ compiler('rust') }}
    - rust-nightly


test:
  commands:
    - lash --help

about:
  home: https://github.com/jianshu93/lash
  license: MIT
  license_file: LICENSE-MIT
  summary: "Space-efficient distance approximation for (meta)genomes, using HyperMinHash, HyperLogLog, and UltraLogLog"

extra:
  maintainers:
    - Jianshu Zhao
