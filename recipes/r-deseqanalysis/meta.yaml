{% set version = "0.7.3" %}
{% set github = "https://github.com/acidgenomics/r-deseqanalysis" %}

package:
  name: r-deseqanalysis
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: c1fcbaeea3df805feac53e443acc4559e6fe3f0af6b52309361cd65ed1c8ed51

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage('r-deseqanalysis', max_pin="x.x") }}

requirements:
  host:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-deseq2 >=1.40.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.8
    - r-acidcli >=0.3.3
    - r-acidexperiment >=0.5.6
    - r-acidgenerics >=0.7.11
    - r-acidgenomes >=0.8.1
    - r-acidmarkdown >=0.3.2
    - r-acidplots >=0.7.5
    - r-acidplyr >=0.5.8
    - r-ggplot2 >=3.4.3
    - r-goalie >=0.7.10
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1
    # Suggests:
    - bioconductor-apeglm >=1.22.0
    - bioconductor-tximport >=1.28.0
    - r-ashr >=2.2.63
    - r-basejump >=0.17.0
    - r-complexupset >=1.3.3
    - r-ggrepel >=0.9.3
    - r-knitr >=1.44
    - r-pheatmap >=1.0.12
    - r-rmarkdown >=2.25
  run:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-deseq2 >=1.40.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.8
    - r-acidcli >=0.3.3
    - r-acidexperiment >=0.5.6
    - r-acidgenerics >=0.7.11
    - r-acidgenomes >=0.8.1
    - r-acidmarkdown >=0.3.2
    - r-acidplots >=0.7.5
    - r-acidplyr >=0.5.8
    - r-ggplot2 >=3.4.3
    - r-goalie >=0.7.10
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1
    # Suggests:
    - bioconductor-apeglm >=1.22.0
    - bioconductor-tximport >=1.28.0
    - r-ashr >=2.2.63
    - r-basejump >=0.17.0
    - r-complexupset >=1.3.3
    - r-ggrepel >=0.9.3
    - r-knitr >=1.44
    - r-pheatmap >=1.0.12
    - r-rmarkdown >=2.25

test:
  commands:
    - $R -e "library('DESeqAnalysis')"

about:
  home: https://r.acidgenomics.com/packages/deseqanalysis/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: Toolkit for performing differential expression with DESeq2.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
