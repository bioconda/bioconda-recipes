package:
  name: pysamstats
  version: 1.2.0

source:
  url: https://github.com/alimanfoo/pysamstats/archive/refs/tags/v1.2.0.tar.gz
  sha256: 2913f0c18b35feb89196aaa50227290574fd4a8679d5e99e72eeadece91a8bcb
  patches:
    - fix_numpy25.patch # temporary hotfix to make pysamstats compatible with the current version 2.5 of numpy until upstream merges PR#190
    - fix_const_ptr.patch # temporary hotfix to allow cythonizing with recent htslib and gcc combos until upstream merges PR#192

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('pysamstats', max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - cython
    - pysam >=0.15
    - setuptools
    - zlib
  run:
    - python
    - {{ pin_compatible('pysam', max_pin='x.x.x') }}
    - zlib
    - numpy
    - pytables

test:
  imports:
    - pysamstats
    - pysamstats.opt
  commands:
    - pysamstats --help

about:
  home: https://github.com/alimanfoo/pysamstats
  license: MIT
  summary: Calculate read mapping stats from SAM/BAM/CRAM
  details: |
    A Python utility for calculating statistics against genome position based
    on sequence alignments from a SAM, BAM or CRAM file.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:pysamstats
