{% set name = "pegasusio" %}
{% set version = "0.11.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: "3b183ecfe33f524fe6257e573b612d16c8bde0dda34cc3a539879efb176775a3"

build:
  number: 0
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  entry_points:
    - pegasusio = pegasusio.__main__:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  run_exports:
    - {{ pin_subpackage('pegasusio', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - python >=3.11,<3.15
    - cython
    - numpy >=2.0.0
    - setuptools
    - setuptools_scm
    - pip
  run:
    - python >=3.11,<3.15
    - numpy >=2.0.0
    - pandas >=1.2.0
    - anndata >=0.7
    - h5py >=3.0.0
    - loompy
    - docopt
    - natsort
    - scipy
    - zarr >=2.18.7,!=3.0.*,<4
    - pillow

test:
  requires:
    - pip
  imports:
    - pegasusio
    - pegasusio.commands
    - pegasusio.cylib.funcs
    - pegasusio.cylib.io
  commands:
    - pegasusio --help
    - python -m pip check

about:
  home: "https://github.com/lilab-bcb/pegasusio"
  doc_url: "https://pegasusio.readthedocs.io"
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  summary: "PegasusIO is the IO package for Pegasus."
  dev_url: "https://github.com/lilab-bcb/pegasusio"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - yihming
    - bli25
