{% set version = "0.4.0" %}

package:
  name: skani
  version: {{ version }}

source:
  url: https://github.com/bluenote-1577/skani/archive/v{{ version }}.tar.gz
  sha256: c8fe23ffae0119aa79cc801ac08dfc33862c94006690074daff274d937f1f786

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('skani', max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - {{ compiler("rust") }}
    - make

test:
  commands:
    - skani --help

about:
  home: "https://github.com/bluenote-1577/skani"
  license: MIT
  license_family: MIT
  summary: "skani is a fast and robust tool for calculating ANI between metagenome assembled genomes and contigs."
  dev_url: "https://github.com/bluenote-1577/skani"
  doc_url: "https://github.com/bluenote-1577/skani/wiki/skani-basic-usage-guide"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1038/s41592-023-02018-3
