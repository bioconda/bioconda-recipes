{% set name = "insitugame" %}
{% set version = "1.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: "https://github.com/Lukecele/spatial-game-assay/archive/refs/tags/v{{ version }}.tar.gz"
  sha256: 64986536a1abbf5104ecf4de80c0900ad49640966ace4082d827ba77651e8f04

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage("insitugame", max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - setuptools >=61.0
    - pip
  run:
    - python >=3.9
    - numpy >=1.20
    - scipy >=1.7
    - pandas >=1.3
    - scikit-learn >=1.0
    - matplotlib-base >=3.4

test:
  imports:
    - insitugame

about:
  home: https://lukecele.github.io/spatial-game-assay/
  dev_url: https://github.com/Lukecele/spatial-game-assay
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: "In situ spatial evolutionary game assay for inferring tumor subclonal payoff matrices and adaptive therapy regimens."
  description: "A computational oncology assay to infer subclonal payoff matrices, solve Nash equilibria, decouple microenvironmental confounders, and simulate adaptive therapy regimens directly from intact spatial transcriptomics biopsies."

extra:
  recipe-maintainers:
    - Lukecele
  identifiers:
    - doi:10.5281/zenodo.23585216
