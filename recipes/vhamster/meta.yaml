{% set version = "1.4.0" %}

package:
  name: vhamster
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/V/VHAMSTeR/vhamster-{{ version }}.tar.gz
  sha256: d03c46601f51372bb500087d77d98b56fa7288b1404a1afc83321cbf750f959e

build:
  entry_points:
    - vhamster = vhamster:main
    - vhamster-features = vhamster:features_main
    - vhamster-install-models = install_models:main
  run_exports:
    - {{ pin_subpackage("vhamster", max_pin="x.x") }}
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - setuptools >=68
    - wheel
    - pip
  run:
    - python >=3.10
    - click >=8.3,<9
    - loguru >=0.7,<1
    - numpy >=2.4,<3
    - polars >=1.39,<2
    - pytorch >=2.11,<3
    - tqdm >=4.67,<5
    - transformers >=5.4,<6
    - peft >=0.18,<1
    - biopython >=1.87,<2
    - pyrodigal-gv >=0.3.2,<0.4
    - scikit-learn >=1.8,<2
    - joblib >=1.4,<2
    - huggingface_hub >=0.23,<2
    - xgboost >=2.1,<3

test:
  imports:
    - install_models
    - vhamster
  commands:
    - pip check
    - vhamster --help
    - vhamster-features --help
    - vhamster-install-models --help
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/vhamster/
  summary: VHAMSTeR ensemble inference CLI
  license: Custom
  license_file: LICENSE

extra:
  recipe-maintainers:
    - susiegriggo
