{% set name = "isocor" %}
{% set version = "2.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 47ac04de5608a14007abcb4efd2acad711b3c4538edae59323efdb0edb3c71dd

build:
  number: 0
  noarch: python
  entry_points:
    - isocorcli = isocor.ui.isocorcli:start_cli
    - isocor = isocor.ui.isocorgui:start_gui
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  run_exports:
    - {{ pin_subpackage('isocor', max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.7
    - setuptools
    - wheel
  run:
    - pandas >=0.17.1
    - python >=3.7
    - scipy >=0.12.1
    - numpy >=1.15

test:
  imports:
    - isocor
    - isocor.tests
    - isocor.ui
  commands:
    - isocorcli --help

about:
  home: https://github.com/MetaSys-LISBP/IsoCor/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE.md
  summary: A Isotope Correction for mass spectrometry labeling experiments
  doc_url: https://isocor.readthedocs.io/
  dev_url: https://github.com/MetaSys-LISBP/IsoCor/

extra:
  recipe-maintainers:
    - gmat
  identifiers:
    - doi:10.1093/bioinformatics/btz209
