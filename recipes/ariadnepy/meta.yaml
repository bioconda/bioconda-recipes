{% set name = "ariadnepy" %}
{% set version = "0.2.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8278d34da7fc927fb35206978e7dc1a7236687e5b608008ccbd9f44aae64ddcb

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install --no-deps --no-build-isolation -vvv ."
  run_exports:
    - {{ pin_subpackage('ariadnepy', max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling
  run:
    - python >=3.10
    - python-igraph >=0.11
    - pandas >=2.0
    - requests >=2.28
    - platformdirs >=3.0
    - pyarrow >=14.0
    - pyreadr >=0.5
    - scipy >=1.10
    - matplotlib-base >=3.7

test:
  imports:
    - ariadnepy
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Minotau-R/ariadnePy
  license: Artistic-2.0
  license_file: LICENSE
  summary: Python interface to the ariadne multi-omic knowledge graph
  dev_url: https://github.com/Minotau-R/ariadnePy

extra:
  recipe-maintainers:
    - AditiAdhikari05
