{% set version = "0.1.1" %}
{% set github = "https://github.com/acidgenomics/py-acidbase" %}

package:
  name: acidbase
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/a/acidgenomics-acidbase/acidgenomics_acidbase-{{ version }}.tar.gz"
  sha256: 78df73f9869a25c6f16b9c548598f434119935373f3ae4e1ff4762f1007ffcae

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  run_exports:
    - {{ pin_subpackage('acidbase', max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - pip
    - uv-build >=0.11,<1
  run:
    - python >=3.12
    - numpy
    - packaging
    - pandas
    - psutil
    - scipy

test:
  imports:
    - acidbase

about:
  home: https://python.acidgenomics.com/acidbase/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE
  summary: Base functions for Acid Genomics packages.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
