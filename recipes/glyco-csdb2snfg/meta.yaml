package:
  name: glyco-csdb2snfg
  version: "0.3.0"

source:
  url: https://files.pythonhosted.org/packages/83/0a/3aab3edb23ed3af6fbb079b4ec9c58433fac79048da0e38a32a03a2ca6e3/glyco_csdb2snfg-0.3.0.tar.gz
  sha256: 0cb9551a98687004a79ace9dfc5232c5d6b587f8e9474d0e2feb62d0ab4aa7de

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"
  run_exports:
    - {{ pin_subpackage("glyco-csdb2snfg", max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - numpy >=1.21
    - matplotlib-base >=3.5
    - python-pptx >=0.6.21

test:
  imports:
    - csdb2snfg
  commands:
    - csdb2snfg --help

about:
  home: https://github.com/sosyphe/glyco-csdb2snfg
  license: MIT
  license_file: LICENSE
  summary: "A Python parser for converting Glyco CSDB format to SNFG drawings"
