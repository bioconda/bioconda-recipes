schema_version: 1

context:
  version: 1.5.0

package:
  name: rectanglepy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rectanglepy/rectanglepy-${{ version }}.tar.gz
  sha256: 3dc8b1b8cd16d01f524a14b17c73988423ff5ea527ca3beb5910cff224896371

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - hatchling
    - pip
  run:
    - python >=3.10
    - pandas >=2.0.0,<3.0.0
    - pydeseq2 ==0.4.11
    - scipy ==1.13.0
    - osqp >=1.0.5
    - loguru
    - numpy >=1.0.0,<2.0.0
    - anndata >=0.8.0,<0.10.9
    - statsmodels >=0.14.1

tests:
  - python:
      imports:
        - rectanglepy
      pip_check: true

about:
  summary: Hierarchical deconvolution of bulk  transcriptomics
  license: BSD-3-Clause-HP AND BSD-3-Clause
  license_file:
    - LICENSE-Commercial.md
    - LICENSE
  homepage: https://pypi.org/project/rectanglepy/
  repository: https://github.com/ComputationalBiomedicineGroup/Rectangle
  documentation: https://rectanglepy.readthedocs.io/

extra:
  recipe-maintainers:
    - nilchia