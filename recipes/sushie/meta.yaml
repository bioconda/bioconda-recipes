{% set name = "sushie" %}
{% set version = "0.20" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mancusolab/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e92f1d08d9710fcd6ead43b107fb8735415b7bb8e27ae3de96ff9b28b00c84dc

build:
  number: 0
  noarch: python
  entry_points:
    - sushie = sushie.cli:run_cli
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python <3.12
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python <3.12
    - jax >=0.10
    - jaxlib >=0.10
    - polars >=1.42
    - equinox >=0.13.0
    - scipy >=1.17
    - glimix-core >=3.1.0
    #- genoio >=0.2
    - bgen-reader >=4.0.0
    - cyvcf2 >=0.30.0

test:
  imports:
    - sushie
  commands:
    - sushie --help

about:
  home: "https://github.com/mancusolab/sushie"
  summary: "Python package for multi-ancestry SNP fine-mapping on molecular data."
  license: MIT
  license_family: MIT
  license_file: "LICENSE.txt"
  doc_url: "https://mancusolab.github.io/sushie"
  dev_url: "https://github.com/mancusolab/sushie"

extra:
  recipe-maintainers:
    - jpfeuffer
