package:
  name: ruffus
  version: 3.0.0

source:
  url: https://files.pythonhosted.org/packages/3b/05/0b82d6afe0f2c4745a70c1a8ce1084b71e7b23a9b369056e58e29ca8180b/ruffus-3.0.0.tar.gz
  sha256: 424a2c62a61a648f7826d7deeca02d344f62da3100f8c4b0d2d7882bd148f73c

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage('ruffus', max_pin="x") }}
  script: $PYTHON setup.py install --single-version-externally-managed --record=record.txt

requirements:
  host:
    - python
    - setuptools
  run:
    - python

test:
  imports:
    - ruffus

about:
  home: http://www.ruffus.org.uk/
  license: MIT
  summary: "Light-weight Python Computational Pipeline Management"
  license_file: LICENSE.TXT
