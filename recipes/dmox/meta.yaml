{% set name = "dmox" %}
{% set version = "0.3.0" %}
{% set sha256 = "614647c51ad67f3ba0598fac98d15888f9e7e936400df38220e5ec0d2cd04bfa" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://https://gitlab.in2p3.fr/isem/dmox/-/archive/v{{ version }}/dmox-v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: True # [osx]
  run_exports:
    - {{ pin_subpackage('dmox', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - make
    - cmake
    - pkg-config

test:
  commands:
    - dmox --help

about:
  home: "https://gitlab.in2p3.fr/isem/dmox"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "Rust-based demultiplexing of haplotagging linked-read data."
  description: |
    dmox is a drop-in replacement for the haplotagging linked-read demultiplexing module implemented in Harpy.
    It's used within Harpy itself, but also functions as a standalone, efficient demultiplexing software.
  dev_url: "https://gitlab.in2p3.fr/isem/dmox"
  doc_url: "https://gitlab.in2p3.fr/isem/dmox/-/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
  recipe-maintainers:
    - iago-lito
