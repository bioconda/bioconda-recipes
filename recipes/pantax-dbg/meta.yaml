{% set name = "pantax-dbg" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/xujialupaoli/PanTax-DBG/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 74e69da5f17156d07df0c8abe7c9f382455ab245d86c7a1c29434fe7683462c1

build:
  skip: true  # [osx]
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cmake >=3.18
    - ninja
    - make
    - cargo-bundle-licenses
  host:
    - python >=3.9,<3.13
    - pip
    - setuptools >=68
    - wheel
    - cxxopts >=2.2.0
    - catch2 ==2.*
    - zlib
    - bzip2
    - raptor ==3.*
  run:
    - python >=3.9,<3.13
    - pandas >=1.2.0
    - multitax >=1.3.1
    - genome_updater >=0.6.4
    - grep
    - coreutils
    - curl
    - diffutils
    - zlib
    - bzip2
    - fastp

test:
  imports:
    - themis
    - themis_scripts
  commands:
    - pantax-dbg --help
    - pantax-dbg profile --help
    - test -x "$PREFIX/libexec/pantax-dbg/ganon"
    - test -x "$PREFIX/libexec/pantax-dbg/ganon-build"
    - test -x "$PREFIX/libexec/pantax-dbg/ganon-classify"
    - test -x "$PREFIX/libexec/pantax-dbg/ganon-report"
    - test -x "$PREFIX/libexec/pantax-dbg/dbg-ggcat"

about:
  home: https://github.com/xujialupaoli/PanTax-DBG
  summary: "PanTax-DBG: metagenomic profiler with bundled modified DBG-ganon and DBG-ggcat backends"
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  identifiers:
    - biotools:pantax-dbg
