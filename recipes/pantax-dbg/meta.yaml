{% set name = "pantax-dbg" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/xujialupaoli/PanTax-DBG/releases/download/v{{ version }}/PanTax-DBG-{{ version }}.tar.gz
  sha256: 74e69da5f17156d07df0c8abe7c9f382455ab245d86c7a1c29434fe7683462c1

build:
  skip: true  # [osx]
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - cmake
    - pkg-config
    - rust

  host:
    - python >=3.9
    - pip
    - setuptools >=61
    - wheel

  run:
    - python >=3.9
    - fastp
    - numpy
    - pandas
    - lz4

test:
  imports:
    - pantax_dbg
    - pantax_dbg_scripts
  commands:
    - pantax-dbg --help
    - fastp --version

about:
  home: https://github.com/xujialupaoli/PanTax-DBG
  license: MIT
  license_file: LICENSE
  summary: "PanTax-DBG: metagenomic profiling with fast pre-screening and DBG-based refinement."
  description: |
    PanTax-DBG is a metagenomic profiling toolkit that combines fast pre-screening
    with DBG-based refinement for species- and strain-level taxonomic profiling.

extra:
  recipe-maintainers:
    - xujialupaoli
