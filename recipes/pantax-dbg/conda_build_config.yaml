# Recipe-specific variant pins for PanTax-DBG.
# SeqAn3/DBG-ganon currently fails with the newest conda-forge GCC 15 toolchain.
# Keep GCC/GXX at 13 until the C++ code is made compatible with newer compilers.
c_compiler:
  - gcc
cxx_compiler:
  - gxx
c_compiler_version:
  - 13
cxx_compiler_version:
  - 13
python:
  - 3.11
