{% set name = "egt" %}
{% set version = "0.2.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/2c/26/9737d2fd448bd912ba033fd74c91f249a2061792c6da45fda7037c54f6ef/egt-{{ version }}.tar.gz
  sha256: 019375814c2e1e024e416ae2d3b5cc89c31268b33c635ab4d6bcc2932a0798f7

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  entry_points:
    - egt = egt.cli:main
  run_exports:
    - {{ pin_subpackage('egt', max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.10
    - numpy
    - pandas
    - scipy
    - scikit-learn
    - matplotlib-base
    - networkx
    - pillow
    - umap-learn
    # umap-learn[plot] extras (datashader, holoviews, scikit-image, colorcet)
    - datashader
    - holoviews
    - scikit-image
    - colorcet
    - bokeh
    - ete4
    - snakemake-minimal >=7,<9
    - pyyaml

test:
  imports:
    - egt
  commands:
    - egt --help

about:
  home: https://github.com/conchoecia/egt
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Evolutionary Genome Topology: chromosome-evolution analysis toolkit for metazoan genomes using reciprocal-best-hits data."
  dev_url: https://github.com/conchoecia/egt
  doc_url: https://github.com/conchoecia/egt

extra:
  identifiers:
    - pypi:egt
    - doi:10.1126/sciadv.adz5561
  recipe-maintainers:
    - conchoecia
