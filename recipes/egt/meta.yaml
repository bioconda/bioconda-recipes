{% set name = "egt" %}
{% set version = "0.2.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/8b/6c/78657de1115563d0e08150265d330762a1f90704c170f09fd1eefde9e3d8/egt-{{ version }}.tar.gz
  sha256: e62b9f9d00d148f0fd1f2ff28a99879c227a438d82abc31bdfcea0596b2612a5

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  entry_points:
    - egt = egt.cli:main
  run_exports:
    - {{ pin_subpackage('egt', max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.10
    - numpy
    - pandas
    - scipy
    - scikit-learn
    - matplotlib-base
    - networkx
    - pillow
    - umap-learn
    # umap-learn[plot] extras (datashader, holoviews, scikit-image, colorcet)
    - datashader
    - holoviews
    - scikit-image
    - colorcet
    - bokeh
    - ete4
    - snakemake-minimal >=7,<9
    - pyyaml

test:
  imports:
    - egt
  commands:
    - egt --help

about:
  home: https://github.com/conchoecia/egt
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Evolutionary Genome Topology: chromosome-evolution analysis toolkit for metazoan genomes using reciprocal-best-hits data."
  dev_url: https://github.com/conchoecia/egt
  doc_url: https://github.com/conchoecia/egt

extra:
  identifiers:
    - pypi:egt
    - doi:10.1126/sciadv.adz5561
  recipe-maintainers:
    - conchoecia
