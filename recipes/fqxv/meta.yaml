{% set name = "fqxv" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/rnabioco/fqxv/archive/v{{ version }}.tar.gz
  sha256: f081ee282e2d5b0b8e34166c4a532f683f984b7383429dd1884bc464a6afb625

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('fqxv', max_pin="x.x") }}   # 0.x: pin minor while unstable

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - fqxv --help

about:
  home: https://github.com/rnabioco/fqxv
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  summary: Lossless (opt-in lossy) archiver for short-read FASTQ.
  dev_url: https://github.com/rnabioco/fqxv
  doc_url: https://github.com/rnabioco/fqxv#readme

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - compiler_needs_stdlib_c
  recipe-maintainers:
    - jayhesselberth
