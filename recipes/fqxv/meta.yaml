{% set name = "fqxv" %}
{% set version = "0.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/rnabioco/fqxv/archive/v{{ version }}.tar.gz
  sha256: 8251ca33c260de6bf08815be53c04270307209fe0048c84ddd07b4b2946b2b5e

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('fqxv', max_pin="x.x") }}   # 0.x: pin minor while unstable

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - fqxv --help

about:
  home: https://github.com/rnabioco/fqxv
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  summary: Lossless (opt-in lossy) archiver for short- and long-read FASTQ.
  dev_url: https://github.com/rnabioco/fqxv
  doc_url: https://github.com/rnabioco/fqxv#readme

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - jayhesselberth
