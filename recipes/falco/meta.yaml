{% set version = "2.0.1" %}

package:
  name: falco
  version: {{ version }}

source:
  url: https://github.com/smithlabcode/falco/releases/download/v{{ version }}/falco-{{ version }}-Source.tar.gz
  sha256: d8dbc7d98d1aafdbf8199f8df3d7f76503a4f6a8924a151c953eb23dd47d44a0

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('falco', max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - pkg-config
  host:
    - zlib
    - htslib
    - isa-l  # [not arm64]
  run:
    - htslib
    - isa-l  # [not arm64]

test:
  commands:
    - falco --help
    - falco --version

about:
  home: "https://github.com/smithlabcode/falco"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "falco is a drop-in C++ implementation of FastQC to assess the quality of sequence reads."
  doc_url: "https://falco.readthedocs.io"
  dev_url: "https://github.com/smithlabcode/falco"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - andrewdavidsmith
    - guilhermesena1
  identifiers:
    - biotools:falco
    - usegalaxy-eu:falco
    - doi:10.12688/f1000research.21142.2
