{% set name = "RRIkinDP" %}
{% set version = "0.0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/mwaldl/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 0a2a57b4510ba1230b291d72e0d91d1407e1053a66f5fae90968d8bc3bf625ee

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x.x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - pkg-config
  host:
    - boost-cpp
    - viennarna >=2.6.0
    - intarna
    - python
    - pip
    - setuptools >=77
    - pybind11 >=2.10
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
  run:
    - boost-cpp
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
    - python
    - intarna
    - viennarna >=2.6.0
    - matplotlib-base >=3.7.0
    - seaborn-base >=0.12.0
    - pandas >=2.0.0
    # required by MarkovProcess; treekin is only built for linux-64
    - treekin >=0.5.1  # [linux and x86_64]

test:
  commands:
    - RRIkinDP --version
  imports:
    - rrikindp

about:
  home: "https://github.com/mwaldl/RRIkinDP"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: COPYING
  summary: "Targeted RNA–RNA interaction kinetics."
  description: |
    RRIkinDP computes thermodynamic and kinetic features of RNA-RNA interactions based on a direct paths
    interaction formation model. As input, two RNA sequences as well as their interaction structure are
    provided. The tool generates the state space of all intermediate interactions from single base pair
    or seed interaction to the full input interaction. On top of this state space it computes the barrier
    energy for the best direct path from a given start interaction to the full input interaction. In
    addition, the included python library enables modeling of the interaction formation as a markov
    process on this state space.
  doc_url: "https://doi.org/10.1101/2023.07.28.548983"
  dev_url: "https://github.com/mwaldl/RRIkinDP"

extra:
  recipe-maintainers:
    - mwaldl
    - s-will
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1101/2023.07.28.548983
