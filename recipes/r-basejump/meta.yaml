{% set version = "0.18.2" %}
{% set github = "https://github.com/acidgenomics/r-basejump" %}

package:
  name: r-basejump
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 41c36b158bafe9a298422def8a4bd200d5ab8e07eef2f79232471b7018b2bff3

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('r-basejump', max_pin="x.x") }}

requirements:
  host:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-singlecellexperiment >=1.22.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.8
    - r-acidexperiment >=0.5.6
    - r-acidgenomes >=0.8.1
    - r-acidmarkdown >=0.3.2
    - r-acidplots >=0.7.5
    - r-acidplyr >=0.5.8
    - r-acidsinglecell >=0.4.5
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1
  run:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-singlecellexperiment >=1.22.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.8
    - r-acidexperiment >=0.5.6
    - r-acidgenomes >=0.8.1
    - r-acidmarkdown >=0.3.2
    - r-acidplots >=0.7.5
    - r-acidplyr >=0.5.8
    - r-acidsinglecell >=0.4.5
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1

test:
  commands:
    - $R -e "library('basejump')"

about:
  home: https://r.acidgenomics.com/packages/basejump/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: Base functions for bioinformatics and R package development.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
