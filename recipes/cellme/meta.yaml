{% set name = "cellme" %}
{% set version = "1.6.1" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8c46f3da85a6330dd495a9c4b85e5e2918d0970e4816dbf9c2e3463540727a8c

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
  entry_points:
    - cellme = cellme.main:run
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - defopt >=6.4,<8.0
    - liftover >=1.3
    - pysam >=0.23
    - rapidfuzz >=3.14.5
    - requests >=2.32

test:
  imports:
    - cellme
  commands:
    - pip check
    - cellme --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/clintval/cellme
  summary: Convert a human cell line identifier into a truth-track VCF of its known mutations.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/clintval/cellme

extra:
  recipe-maintainers:
    - clintval
