{% set version = "2.0.1" %}

package:
  name: irfinder
  version: '{{ version }}'

source:
  url: https://github.com/RitchieLabIGH/IRFinder/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f69ff0496ffac70b4735eb2383e0edc937387949db047c2347e6918750902fd0

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("irfinder", max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - {{ compiler("cxx") }}
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  host:
    - libboost-devel
    - zlib
    - python
  run:
    - python
    - bash
    - gawk
    - gzip
    - perl
    - wget
    - samtools
    - bedtools
    - star
    - minimap2
    - suppa
    - numpy
    - scipy
    - tensorflow
    - r-base
    - r-ggplot2
    - bioconductor-deseq2

test:
  commands:
    - IRFinder -v
    - irfinder_cnn.py --help

about:
  home: https://github.com/RitchieLabIGH/IRFinder
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: IRFinder-S, a suite to detect, quantify and explore intron retention from RNA-Seq
  dev_url: https://github.com/RitchieLabIGH/IRFinder
  doc_url: https://github.com/RitchieLabIGH/IRFinder/wiki

extra:
  identifiers:
    - doi:10.1186/s13059-021-02515-8
    - doi:10.1186/s13059-017-1184-4
  additional-platforms:
    - linux-aarch64
    - osx-arm64
