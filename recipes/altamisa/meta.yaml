{% set version = "1.0.0" %}
{% set sha256 = "e85c43aa3e7696710c67e686e6482cfd05d2ff14725c3ef5e9ff63402b620a53" %}

package:
  name: altamisa
  version: '{{version}}'

source:
  url: https://pypi.io/packages/source/a/altamisa/altamisa-{{version}}.tar.gz
  sha256: '{{sha256}}'

build:
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation --no-cache-dir . -vvv
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage('altamisa', max_pin="x.x") }}

requirements:
  host:
    - python >=3
    - pip
    - setuptools
  run:
    - python >=3
    - attrs

test:
  imports:
    - altamisa

about:
  home: https://github.com/bihealth/altamisa
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Alternative Python API for accessing ISA-tab files.
