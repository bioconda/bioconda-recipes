{% set name = "py-kmc-api" %}
{% set version = "3.2.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  git_url: https://github.com/refresh-bio/KMC.git
  git_rev: v{{version}}
  sha256: unused
  patches:
    - 0001-master.patch
    - 0002-cmake.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
    - cmake
    - clangdev  # [osx]
    - llvmlite  # [osx]
  host:
    - python
    - pybind11
    - zlib
  run:
    - python

test:
  imports:
    - py_kmc_api

about:
  home: "https://github.com/refresh-bio/kmc"
  summary: "Python API for reading KMC k-mer databases."
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: "gpl-3.0.txt"
  dev_url: "https://github.com/refresh-bio/kmc"
  doc_url: "https://github.com/refresh-bio/KMC/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:kmc
    - doi:10.1093/bioinformatics/btx304
    - doi:10.1093/bioinformatics/btv022
    - doi:10.1186/1471-2105-14-160
  skip-lints:
    - uses_vcs_url
