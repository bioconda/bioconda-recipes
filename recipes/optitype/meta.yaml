{% set version = "1.5.0" %}

package:
  name: optitype
  version: {{ version }}

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage('optitype', max_pin="x") }}

source:
  url: https://github.com/FRED-2/OptiType/archive/v{{ version }}.tar.gz
  sha256: a59e917db1f57721fc65baad703e04e76cbe293c4fe2936d4d5dae720db31da8

requirements:
  run:
    - python
    - numpy
    - pyomo
    - hdf5
    - pytables <3.10  # Pin to avoid Python 3.13 HDF5 compatibility issues
    - pandas
    - pysam
    - matplotlib-base
    - samtools
    - six
    - future
    - glpk
    - razers3

test:
  commands:
    - OptiTypePipeline.py -h

about:
  home: https://github.com/FRED-2/OptiType
  license: BSD
  summary: Precision HLA typing from next-generation sequencing data
