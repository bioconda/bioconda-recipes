{% set version = "1.0.0" %}
{% set name = "amro" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/sam-sims/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: c925c5a92f03244e313d3d1d6827344ff18aa5e6eec1e608446d6c9485539c9e

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('amro', max_pin="x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - amro --version

about:
  home: https://github.com/Sam-Sims/amro
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: SIMD accelerated FASTQ validation.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - sam-sims
