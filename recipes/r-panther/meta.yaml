{% set version = "0.5.2" %}
{% set github = "https://github.com/acidgenomics/r-panther" %}

package:
  name: r-panther
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 4f2ff0c2f303ba711a9d8b16f8aef1868bd50b09c0f136bef8699e939321153b

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('r-panther', max_pin="x.x") }}

requirements:
  host:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - r-acidbase >=0.7.0
    - r-acidcli >=0.3.3
    - r-acidgenerics >=0.7.6
    - r-acidgenomes >=0.7.5
    - r-acidplyr >=0.5.5
    - r-goalie >=0.7.8
    - r-pipette >=0.16.1
    - r-syntactic >=0.8.1
  run:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - r-acidbase >=0.7.0
    - r-acidcli >=0.3.3
    - r-acidgenerics >=0.7.6
    - r-acidgenomes >=0.7.5
    - r-acidplyr >=0.5.5
    - r-goalie >=0.7.8
    - r-pipette >=0.16.1
    - r-syntactic >=0.8.1

test:
  commands:
    - $R -e "library('PANTHER')"

about:
  home: https://r.acidgenomics.com/packages/panther/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: PANTHER database annotations.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
