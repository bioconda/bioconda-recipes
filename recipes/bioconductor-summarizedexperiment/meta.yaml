{% set version = "1.42.0" %}
{% set name = "SummarizedExperiment" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: 03714c185f20dd1c45bb8772d544d750

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-summarizedexperiment", max_pin="x.x") }}'
  noarch: generic

# Suggests: GenomeInfoDb (>= 1.45.5), rhdf5, HDF5Array (>= 1.7.5), annotate, AnnotationDbi, GenomicFeatures, SparseArray, SingleCellExperiment, TxDb.Hsapiens.UCSC.hg19.knownGene, hgu95av2.db, airway (>= 1.15.1), BiocStyle, knitr, rmarkdown, RUnit, testthat, digest
requirements:
  host:
    - bioconductor-biobase >=2.72.0,<2.73.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-s4arrays >=1.12.1,<1.13.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - r-base
    - r-matrix
  run:
    - bioconductor-biobase >=2.72.0,<2.73.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-s4arrays >=1.12.1,<1.13.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - r-base
    - r-matrix

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: Artistic-2.0
  summary: A container (S4 class) for matrix-like assays
  description: The SummarizedExperiment container contains one or more assays, each represented by a matrix-like object of numeric or other mode. The rows typically represent genomic ranges of interest and the columns represent samples.

extra:
  identifiers:
    - biotools:summarizedexperiment
    - doi:10.1038/nmeth.3252
  parent_recipe:
    name: bioconductor-summarizedexperiment
    path: recipes/bioconductor-summarizedexperiment
    version: 1.10.1

