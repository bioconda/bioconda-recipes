{% set name = "propy3" %}
{% set version = "2.0.1" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1a41bcc2b8059a6d6230ffb1c43dc275a1d53a0f53821b94a4b389baa54de7a2

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation --no-cache-dir -vvv .

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - urllib3

test:
  imports:
    - propy

about:
  home: "https://github.com/MartinThoma/propy3"
  license: "GPL-2.0-only"
  license_family: GPL
  license_file: LICENSE
  summary: "Python library for calculating various protein descriptors from protein sequences."
  dev_url: "https://github.com/MartinThoma/propy3"
  doc_url: "https://propy3.readthedocs.io"

extra:
  recipe-maintainers:
    - MartinThoma
    - jhahnfeld
