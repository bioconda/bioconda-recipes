{% set name = "propy3" %}
{% set version = "2.0.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1a41bcc2b8059a6d6230ffb1c43dc275a1d53a0f53821b94a4b389baa54de7a2

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed -vv .

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - urllib3

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - propy

about:
  home: https://github.com/MartinThoma/propy3
  license: GPLv2
  license_family: GPL
  license_file: LICENSE
  summary: Python library for calculating various protein descriptors from protein sequences
  dev_url: https://github.com/MartinThoma/propy3

extra:
  recipe-maintainers:
    - MartinThoma
    - jhahnfeld
