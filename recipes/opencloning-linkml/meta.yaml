{% set version = "1.0.0" %}

package:
  name: opencloning-linkml
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/o/opencloning-linkml/opencloning_linkml-{{ version }}.tar.gz
  sha256: 318c2ebcb563ca266258cd699d8eac4b2bd61c1d8c8a647131bb7351815a84da

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage('opencloning-linkml', max_pin="x.x") }}

requirements:
  host:
    - python >=3.10,<4.0
    - poetry-core
    - poetry-dynamic-versioning
    - pip
  run:
    - python >=3.10.0,<4.0.0
    - pydantic >=2.7.1,<3.0.0
    - linkml >=1.9.2,<2.0.0

test:
  imports:
    - opencloning_linkml
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/genestorian/OpenCloning_LinkML
  summary: A LinkML data model for OpenCloning
  doc_url: https://genestorian.github.io/OpenCloning_LinkML
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ramez17khaled
