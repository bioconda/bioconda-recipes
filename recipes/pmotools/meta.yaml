{% set version = "1.1.0" %}

package:
  name: pmotools
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pmotools/pmotools-{{ version }}.tar.gz
  sha256: 84f0064eabaa9f470677641264216ede0ee9528a91ce67f11948654cc0edce93

build:
  entry_points:
    - pmotools-python = pmotools.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.11
    - uv-build >=0.8.11,<0.9.0
    - pip
  run:
    - python >=3.11
    - pandas >=2.2.2
    - biopython >=1.83
    - jsonschema >=4.23.0
    - pre-commit
    - openpyxl >=3.1.5

test:
  imports:
    - pmotools
  commands:
    - pip check
    - pmotools-python --help
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/pmotools/
  summary: Tools for building and analyzing PMO files
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kathrynmurie
    - nickjhathaway
