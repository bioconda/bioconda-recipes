{% set name = "accusnv" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/accusnv-{{ version }}.tar.gz
  sha256: cd0fda54fd0d9c70932fa6c209e5df9bd9ca737fde6516a8c0ea4203ff9d014d

build:
  number: 0
  noarch: python
  entry_points:
    - accusnv = accusnv.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage('accusnv', max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=61
  run:
    - python >=3.11
    # Python dependencies
    - snakemake >=8
    - snakemake-executor-plugin-slurm
    - numpy
    - scipy
    - pandas
    - pytorch
    - biopython
    - bcbio-gff
    - matplotlib-base
    - statsmodels
    # External binaries invoked by the Snakemake workflow
    - bwa
    - bowtie2
    - samtools
    - bcftools
    - tabix
    - samclip
    - sickle-trim
    - cutadapt
    - phylip

test:
  source_files:
    - tests
  imports:
    - accusnv
    - accusnv.accusnv
    - accusnv.downstream
    - accusnv.preprocessing
  commands:
    - accusnv --help
    - dnapars < /dev/null || true
    - python -m unittest discover -s tests

about:
  home: "https://github.com/liaoherui/AccuSNV"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "High-accuracy SNV calling for bacterial isolates."
  doc_url: "https://github.com/liaoherui/AccuSNV/blob/main/README.md"
  dev_url: "https://github.com/liaoherui/AccuSNV"

extra:
  recipe-maintainers:
    - liaoherui
    - alexcritschristoph
  identifiers:
    - doi:10.1101/gr.281341.125
