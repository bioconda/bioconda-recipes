{% set name = "accusnv" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/accusnv-{{ version }}.tar.gz
  sha256: da9e933e7d8bebf29262c879da47f7535a6d0c00882adae9e73dbe45a8bf9793

build:
  number: 0
  noarch: python
  entry_points:
    - accusnv = accusnv.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage('accusnv', max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=61
  run:
    - python >=3.11
    # Python dependencies
    - snakemake >=8,<10
    - snakemake-executor-plugin-slurm
    - numpy
    - pyyaml
    - scipy
    - pandas
    - pytorch
    - biopython
    - bcbio-gff
    - matplotlib-base
    - statsmodels
    # External binaries invoked by the Snakemake workflow
    - bwa
    - bowtie2
    - samtools
    - bcftools
    - tabix
    - samclip
    - sickle-trim
    - cutadapt
    - phylip

test:
  imports:
    - accusnv
    - accusnv.accusnv
    - accusnv.downstream
    - accusnv.preprocessing
  commands:
    - accusnv --help
    - which dnapars
    - which bwa
    - which samclip
    - which samtools
    - which bowtie2
about:
  home: "https://github.com/liaoherui/AccuSNV"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "High-accuracy SNV calling for bacterial isolates."
  doc_url: "https://github.com/liaoherui/AccuSNV#readme"
  dev_url: "https://github.com/liaoherui/AccuSNV"

extra:
  recipe-maintainers:
    - liaoherui
    - alexcritschristoph
  identifiers:
    - doi:10.1101/gr.281341.125
