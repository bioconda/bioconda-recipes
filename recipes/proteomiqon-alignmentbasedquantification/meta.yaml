{% set name = "proteomiqon-alignmentbasedquantification" %}
{% set version = "0.1.0" %}
{% set sha256 = "ff5c8f4504da13433b1a86c45f5b57f181d39de21da792afdbcca143b3399c7f" %}

package:
  name: '{{ name }}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.AlignmentBasedQuantification/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}


requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-alignmentbasedquantification"
    - test -f "$PREFIX/lib/dotnet/tools/AlignmentBasedQuantification/ProteomIQon.AlignmentBasedQuantification.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-alignmentbasedquantification"
    - grep -q "AlignmentBasedQuantification/ProteomIQon.AlignmentBasedQuantification.dll" "$PREFIX/bin/proteomiqon-alignmentbasedquantification"

about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  description: | 
    QuantBasedAlignment predicts where a peptide ion identified in another run should elute in this run.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/alignment-based-quantification/
