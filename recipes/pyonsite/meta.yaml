# recipe/meta.yaml
{% set name = "pyonsite" %}
{% set version = "0.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/pyonsite-{{ version }}.tar.gz
  sha256: 8fa2e2ef78c5983b816e8bddb18f6d5720c3016acb29750f019879c67a63613d

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage('pyonsite', max_pin="x.x") }}
    
requirements:
  host:
    - python >=3.11,<3.13
    - poetry-core
    - pip
  run:
    - python >=3.11,<3.13
    - pyopenms >=3.6.0
    - numpy >=2.3.2
    - scipy >=1.16.0
    - click >=8.0.0
    - pyarrow

test:
  imports:
    - onsite
  commands:
    - pip check
    - onsite --help
    - ascore --help
    - phosphors --help
    - lucxor --help
  requires:
    - pip

about:
  home: https://www.github.com/bigbio/onsite
  summary: 'onsite: mass spectrometry post-translational localization tool'
  license: MIT
  license_file: LICENSE
  dev_url: https://www.github.com/bigbio/onsite

extra:
  recipe-maintainers:
    - ypriverol
    - weizhongchun
