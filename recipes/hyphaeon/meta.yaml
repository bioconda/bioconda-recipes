{% set name = "hyphaeon" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 41b06b4b68c4d3043ace74734a0e0854d3588135e9ba1cb81f03a91aff66e855

build:
  number: 0
  noarch: python
  entry_points:
    - hyphaeon = hyphaeon.cli:main
  script: {{ PYTHON }} -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - hyphaeon-core >=0.1.0
    - biopython >=1.80
    - numpy >=1.22.0
    - scipy >=1.9.0
    - pandas >=1.5.0
    - networkx >=3.0
    - matplotlib-base >=3.5
    - tn93 >=1.0.16

test:
  imports:
    - hyphaeon
  commands:
    - hyphaeon --version
    - hyphaeon --help
    - hyphaeon meme --help
    - hyphaeon phenotype --help
    - hyphaeon epistasis --help

about:
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "HyphAeon: A Deep-Time Phylogenetic Foundation Model for Multi-Scale Evolutionary, Structural, and Clinical Genomics"
  description: |
    HyphAeon is a phylogenetic foundation model for neural inference of
    episodic positive selection (MEME), directional phenotype-genotype
    association (phylowas), and multi-scale epistatic sector mining (ESSM).
    Model weights are fetched from the Hugging Face Hub on first use.
  doc_url: https://github.com/veg/HyphAeon#readme
  dev_url: https://github.com/veg/HyphAeon

extra:
  recipe-maintainers:
    - d-callan
