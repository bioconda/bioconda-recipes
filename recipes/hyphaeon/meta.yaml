{% set name = "hyphaeon" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7b966a6d6e1e0276005ca31ad942413d23a669bd2823d8a11062ddc39457da71

build:
  number: 0
  noarch: python
  entry_points:
    - hyphaeon = hyphaeon.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - hyphaeon-core >=0.2.0
    - biopython >=1.80
    - numpy >=1.22.0
    - scipy >=1.9.0
    - pandas >=1.5.0
    - networkx >=3.0
    - matplotlib-base >=3.5
    - tn93 >=1.0.16

test:
  imports:
    - hyphaeon
  commands:
    - hyphaeon --version
    - hyphaeon --help
    - hyphaeon meme --help
    - hyphaeon phenotype --help
    - hyphaeon epistasis --help
    # Exercise the hf_xet download path inside the mulled container — small
    # files bypass xet, so a real weight file is required. This catches the
    # "Reqwest error: builder error" TLS failure fixed via build.sh.
    - python -c "from huggingface_hub import hf_hub_download; hf_hub_download('datamonkey/hyphaeon', 'model.safetensors')"

about:
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "HyphAeon: A Deep-Time Phylogenetic Foundation Model for Multi-Scale Evolutionary, Structural, and Clinical Genomics"
  description: |
    HyphAeon is a phylogenetic foundation model for neural inference of
    episodic positive selection (MEME), directional phenotype-genotype
    association (phylowas), and multi-scale epistatic sector mining (ESSM).
    Model weights are fetched from the Hugging Face Hub on first use.
  doc_url: https://github.com/veg/HyphAeon#readme
  dev_url: https://github.com/veg/HyphAeon

extra:
  recipe-maintainers:
    - d-callan
