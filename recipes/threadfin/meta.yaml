{% set name = "threadfin" %}
{% set version = "4.6.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 69be2fcab08df65ce4b53d685a6ac64e68c6fc27d0a4a0f554a716a01f2dda95

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - anndata >=0.10
    - numpy >=1.24
    - pandas >=2.0
    - scipy >=1.10
    - scikit-learn >=1.3
    - joblib >=1.2
    - scanpy >=1.10
    - matplotlib-base >=3.7
    - python-igraph >=0.10
    - leidenalg >=0.10
    # threadfin pins pynndescent <0.7; umap-learn 0.6 requires pynndescent >=0.7
    - umap-learn >=0.5.5,<0.6
    - pynndescent >=0.5.8,<0.7
    - harmonypy >=0.0.9

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - threadfin
  commands:
    - pip check

about:
  home: https://github.com/Reynold4k/Threadfin
  summary: "Relationships between B-cell clones from paired single-cell RNA and BCR sequencing."
  description: |
    Threadfin takes paired single-cell RNA and receptor (BCR or TCR) sequencing and describes every clone by the
    distribution of its cells' transcriptional states, so that clones, not cells, can be compared, mapped and tested:
    clone embeddings, clonal coherence, clonal programmes, clone-level tests and clonal memory.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/Reynold4k/Threadfin
  doc_url: https://github.com/Reynold4k/Threadfin/blob/main/docs/README.md

extra:
  recipe-maintainers:
    - Reynold4k
  identifiers:
    - doi:10.5281/zenodo.23824521
