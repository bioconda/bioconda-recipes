package:
  name: r-metamapwidget
  version: 0.2.0

source:
  url: https://github.com/grunwaldlab/metaMapWidgetR/archive/refs/tags/0.2.0.tar.gz
  sha256: "74e0fa511c13afeef3b02f6a791d3935a231a8f6d716bbc8fce557ac6ea149c7"
            
build:
  noarch: generic
  number: 0
  script: "${PREFIX}/bin/R CMD INSTALL --build ."
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports:
    - '{{ pin_subpackage("r-metamapwidget", max_pin="x.x") }}'
            
requirements:
  host:
    - r-base
    - r-htmlwidgets
    - r-rmarkdown
    - r-sass
  run:
    - r-base
    - r-htmlwidgets
    - r-rmarkdown
    - r-sass
            
test:
  commands:
    - "${PREFIX}/bin/R -e \"library('metaMapWidgetR')\""
    
about:
  home: https://github.com/grunwaldlab/metaMapWidgetR
  license: MIT
  license_family: MIT
  summary: 'R wrapper for the meta-map-widget JS package.'
  dev_url: https://github.com/grunwaldlab/metaMapWidgetR
