{% set version = "2.12.1" %}
{% set bc = "batchcompute" %}
{% set bcv = "2.1.7" %}

package:
  name: runjob
  version: {{ version }}

source:
  url: https://github.com/yodeng/runjob/archive/v{{ version }}.tar.gz
  sha256: a58501a27d7390e0393cbb04e67aa10afbcac357ff50292a5986a28c7cc807c9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install -vvv --no-deps --no-build-isolation --no-cache-dir . https://pypi.org/packages/source/{{ bc[0] }}/{{ bc }}/{{ bc }}-{{ bcv }}.tar.gz
  entry_points:
    - runflow = runjob.main:entry_exec
    - runjob = runjob.main:entry_exec
    - runsge = runjob.main:entry_exec
    - runshell = runjob.main:entry_exec
    - qs = runjob.jobstat:qs
    - qslurm = runjob.jobstat:qslurm
    - runjob-server = runjob.jobsocket:job_server
    - runjob-client = runjob.jobsocket:job_client
    - runjob-report = runjob.jobsocket:job_report
  run_exports:
    - {{ pin_subpackage('runjob', max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.7
    - setuptools
    - unzip
  run:
    - python >=3.7
    - psutil
    - prettytable
    - configparser
    - rich-argparse
    - apscheduler

test:
  imports:
    - runjob
  commands:
    - runjob --help
    - runsge --help

about:
  home: "https://github.com/yodeng/runjob"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Manage jobs or pipeline of bioinfomation."
  description: "Runjob is a program for managing a group of related bioinformatic jobs or pipelines running on a compute cluster."
  dev_url: "https://github.com/yodeng/runjob"
  doc_url: "https://runjob.readthedocs.io/en/latest"
