{% set name = "deeptools" %}
{% set version = "4.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/deeptools/deepTools/archive/refs/tags/{{ version }}.tar.gz
  sha256: 244cc0242bc8799b68f5798737fd616f7f0f364c0ee3bab28db27b986f4cc76e

build:
  number: 1
  skip: True  # [py < 312]
  script:
    # The clang 19 linker driver resolves @rpath/libclang-cpp.19.1.dylib
    # relative to its conda package cache (loader_path), where the library
    # does not exist - it ships in the separate libclang-cpp19.1 package and
    # is installed into the build prefix. dyld then aborts the linker with
    #   dyld: Library not loaded: @rpath/libclang-cpp.19.1.dylib
    # Extend dyld's fallback search path with the build prefix so the clang
    # libraries are found.
    - export DYLD_FALLBACK_LIBRARY_PATH="${BUILD_PREFIX}/lib${DYLD_FALLBACK_LIBRARY_PATH:+:${DYLD_FALLBACK_LIBRARY_PATH}}"  # [osx]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - make
    - pkg-config
    - clangdev
  host:
    - python
    - pip
    - setuptools
    - maturin >=1.0,<2.0
    - htslib
  run:
    - python
    - pybigwig >=0.3
    - numpy >=2.0.0
    - scipy >=1.13
    - matplotlib-base >=3.10
    - pysam >=0.23
    - deeptoolsintervals >=0.1

test:
  imports:
    - deeptools
  commands:
    - bamCompare --version
    - plotHeatmap --version

about:
  home: "https://github.com/deeptools/deepTools"
  license: MIT
  license_family: MIT
  license_file: "LICENSE.txt"
  summary: "A set of user-friendly tools for normalization and visualzation of deep-sequencing data."
  doc_url: "https://deeptools.readthedocs.io/en/latest"
  dev_url: "https://github.com/deeptools/deepTools"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:deeptools
    - doi:10.1093/nar/gkw257
    - usegalaxy-eu:deeptools_plot_heatmap
    - usegalaxy-eu:deeptools_plot_pca
    - usegalaxy-eu:deeptools_plot_profile
    - usegalaxy-eu:deeptools_plot_correlation
    - usegalaxy-eu:deeptools_plot_coverage
    - usegalaxy-eu:deeptools_plot_fingerprint
    - usegalaxy-eu:deeptools_plot_enrichment
    - usegalaxy-eu:deeptools_bam_compare
    - usegalaxy-eu:deeptools_bam_pe_fragmentsize
    - usegalaxy-eu:deeptools_bigwig_compare
    - usegalaxy-eu:deeptools_correct_gc_bias
    - usegalaxy-eu:deeptools_multi_bam_summary
    - usegalaxy-eu:deeptools_compute_matrix
    - usegalaxy-eu:deeptools_compute_gc_bias
    - usegalaxy-eu:deeptools_multi_bigwig_summary
    - usegalaxy-eu:deeptools_compute_matrix_operations
    - usegalaxy-eu:deeptools_alignmentsieve
    - usegalaxy-eu:deeptools_estimatereadfiltering
    - usegalaxy-eu:hicup_deduplicator
    - usegalaxy-eu:deeptools_bigwig_average
