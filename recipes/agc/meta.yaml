{% set name = "agc" %}
{% set version = "3.2.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/refresh-bio/agc/releases/download/v{{ version }}/agc-v3.2.4-arm64_linux.tar.gz  # [linux and aarch64]
    sha256: 14553a823cab3ac7435ed3241e3a0ff309280f58736dec9adf1084b6a9343a0d  # [linux and aarch64]
  - url: https://github.com/refresh-bio/agc/releases/download/v{{ version }}/agc-v3.2.4-x64_linux.tar.gz  # [linux and x86_64]
    sha256: d4960824acc7dd1e61befa24da58cbc34b01b1f64d636d9cb7ca13e2c5ec818f  # [linux and x86_64]
  - url: https://github.com/refresh-bio/agc/releases/download/v{{ version }}/agc-v3.2.4-x64_mac.tar.gz  # [osx and x86_64]
    sha256: b1a99fc55715b1699c3e94474426456eff6270fb83848beed40b79150ed9caec  # [osx and x86_64]
  - url: https://github.com/refresh-bio/agc/releases/download/v{{ version }}/agc-v3.2.4-m1_mac.tar.gz  # [osx and arm64]
    sha256: 4b1cff58789d2afd75a8fcd37e5a0317ce56ca64b96bd9be1ff4d03cf05f97ba  # [osx and arm64]

build:
  number: 0
  script: "mkdir -p ${PREFIX}/bin; install -v -m 0755 agc ${PREFIX}/bin"
  run_exports:
    - {{ pin_subpackage('agc', max_pin="x") }}

requirements:
  build:

test:
  commands:
    - agc

about:
  home: "https://github.com/refresh-bio/agc"
  summary: "Assembled Genomes Compressor (AGC) is a tool designed to compress collections of de-novo assembled genomes. It can be used for various types of datasets: short genomes (viruses) as well as long (humans)."
  license: MIT
  license_family: MIT
  dev_url: "https://github.com/refresh-bio/agc"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - should_be_noarch_generic
    - should_not_be_noarch_source
