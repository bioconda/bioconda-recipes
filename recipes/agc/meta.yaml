{% set name = "agc" %}
{% set version = "3.2.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/refresh-bio/agc/releases/download/v{{ version }}/agc-v3.2.5-arm64_linux.tar.gz  # [linux and aarch64]
    sha256: 01264011b6e34e3b6ba8ef6c012b51994b22a85c9b1e3a819238205742f52d38  # [linux and aarch64]
  - url: https://github.com/refresh-bio/agc/releases/download/v{{ version }}/agc-v3.2.5-x64_linux.tar.gz  # [linux and x86_64]
    sha256: 5bf18d023de284168c13947024cc4fe8cb7d0dcefd54981be044aba11022810b  # [linux and x86_64]
  - url: https://github.com/refresh-bio/agc/releases/download/v{{ version }}/agc-v3.2.5-x64_mac.tar.gz  # [osx and x86_64]
    sha256: a18c820a75e492fd1c1bbb5112fa2b047f47395737221c3af150428eb468d7cc  # [osx and x86_64]
  - url: https://github.com/refresh-bio/agc/releases/download/v{{ version }}/agc-v3.2.5-m1_mac.tar.gz  # [osx and arm64]
    sha256: a9f47a60cf59796519858001356472b575192fbb62057fd618bda92ce9f3564c  # [osx and arm64]

build:
  number: 0
  script: "mkdir -p ${PREFIX}/bin; install -v -m 0755 agc ${PREFIX}/bin"
  run_exports:
    - {{ pin_subpackage('agc', max_pin="x") }}

requirements:
  build:

test:
  commands:
    - agc

about:
  home: "https://github.com/refresh-bio/agc"
  summary: "Assembled Genomes Compressor (AGC) is a tool designed to compress collections of de-novo assembled genomes. It can be used for various types of datasets: short genomes (viruses) as well as long (humans)."
  license: MIT
  license_family: MIT
  dev_url: "https://github.com/refresh-bio/agc"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - should_be_noarch_generic
    - should_not_be_noarch_source
