# Extend the Python build matrix to include 3.14 (cp314) ahead of bioconda's
# global pinning (conda-forge-pinning 2026.01.07 stops at 3.13), the way
# pysam (#64731) and cyvcf2 did. pyBigWig 0.3.26 builds and runs on 3.14
# from source (pip). numpy is pinned to the oldest numpy-2 release per Python
# (numpy-2 forward-compatible ABI), which satisfies the recipe's
# `numpy >=2.0.0`. Remove once bioconda's pinning includes 3.14.
# Extra dependency versions: https://github.com/conda-forge/conda-forge-pinning-feedstock/blob/main/recipe/conda_build_config.yaml
zip_keys:
  - [python, python_impl, numpy, is_python_min]

python:
  - 3.10.* *_cpython
  - 3.11.* *_cpython
  - 3.12.* *_cpython
  - 3.13.* *_cp313
  - 3.14.* *_cp314

python_impl:
  - cpython
  - cpython
  - cpython
  - cpython
  - cpython

numpy:
  - 2.0
  - 2.0
  - 2.0
  - 2.1
  - 2.3

is_python_min:
  - false
  - false
  - false
  - false
  - false
