{% set name = "ms-gpt" %}
{% set version = "1.0.0" %}
{% set commit = "f2c844e61f079051baf3014c33df5ba2f0524363" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/VIKI623/MS-GPT/archive/{{ commit }}.tar.gz
  sha256: fbfab880ed9ab97313356f4f3470569dabf897b0b63bd5c2e5ff1d0904038026

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.10
    - pytorch >=2.2.0,<3
    - transformers >=4.52.0,<5.0.0
    - peft >=0.10.0,<1
    - safe-mol >=0.1.13,<0.2
    - datamol
    - datasets >=2.18.0
    - rdkit
    - numpy >=1.26.0,<3
    - pandas >=2.0.0,<4
    - pyarrow >=14.0.0
    - omegaconf >=2.3.0,<3
    - tqdm
    - matplotlib-base >=3.7.0
    - wandb >=0.16.5

test:
  imports:
    - ms_gpt
    - ms_gpt.paths
    - ms_gpt.data.benchmark_spectrum_dataset
    - ms_gpt.data.formula_group_sampler
    - ms_gpt.data.mlm_pretraining_dataset
    - ms_gpt.data.posterior_aligned_dataset
    - ms_gpt.data.posterior_queries
    - ms_gpt.data.spectrum_utils
    - ms_gpt.models.conditional_mlm
    - ms_gpt.models.mist_massspecgym_encoder
    - ms_gpt.models.mist_nplib1_encoder
    - ms_gpt.models.posterior_aligned_adapter

about:
  home: https://github.com/VIKI623/MS-GPT
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  dev_url: https://github.com/VIKI623/MS-GPT
  summary: "Known-formula MS/MS de novo structure elucidation by spectrum-induced posterior querying of a molecule-language model."
  description: |
    MS-GPT formulates known-formula MS/MS de novo structure elucidation as
    spectrum-induced posterior querying of a conditional molecule-language
    model. A MIST spectrum encoder maps an MS/MS spectrum and its formula to a
    fingerprint posterior, a calibrated band of thresholded queries is derived
    from it, and candidate structures generated across the band are ranked by
    generation-frequency consensus. This package provides the ms_gpt Python
    library; model checkpoints and benchmark data are distributed separately
    by the authors.

extra:
  identifiers:
    - doi:10.48550/arXiv.2607.23607
  notes: |
    This package provides the ms_gpt Python library only. The evaluation and
    training scripts, model checkpoints and benchmark data are obtained from
    https://github.com/VIKI623/MS-GPT as described in its README.
    On Linux hosts with an NVIDIA driver, conda installs a CUDA build of
    PyTorch automatically. To require a CUDA build rather than fall back to
    CPU, install with: conda install -c conda-forge -c bioconda ms-gpt "pytorch=*=cuda*"
  recipe-maintainers:
    - RJMW
