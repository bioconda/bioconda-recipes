{% set name = "metacooler" %}
{% set version = "0.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d43187bb56b96cfac7173c0ca46b053c1254d5386652994513c6815959fe63fe

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  entry_points:
    - metacooler = metacooler.cli.main:cli
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - hatchling >=1.27
    - pip
  run:
    - python >=3.10
    - cooler >=0.10
    - h5py >=3.8
    - numpy >=1.24
    - pandas >=2.0
    - rich-click >=1.9
    - rich >=13
    - pyfaidx >=0.7.2.2
    - matplotlib-base >=3.7
    - scipy >=1.10
    - click >=8.1
    - pyyaml >=6.0
    - pyarrow >=13
    - jinja2 >=3.1

test:
  imports:
    - metacooler
  commands:
    - metacooler --help

about:
  home: https://github.com/js2264/metacooler
  summary: Hi-C contact maps for metagenomes, an extension of the cooler format.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://js2264.github.io/metacooler/

extra:
  recipe-maintainers:
    - js2264
