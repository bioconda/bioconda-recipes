{% set name = "nwkit" %}
{% set version = "0.27.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://github.com/kfuku52/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 3d147b3c6471a481ff97658057e72d5eb6f865fdd5c3c18a4188d612d040ca2f

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-build-isolation --no-deps -vv"
  run_exports:
    - {{ pin_subpackage("nwkit", max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.9
    - ete4 >=4.3.0
    - biopython
    - pandas
    - requests
    - numpy

test:
  commands:
    - nwkit --help
  imports:
    - nwkit

about:
  home: "https://github.com/kfuku52/nwkit"
  license: "BSD-3-Clause"
  license_file: LICENSE
  summary: "Tools for processing newick trees"

extra:
  recipe-maintainers:
    - kfuku52
