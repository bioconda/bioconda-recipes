{% set name = "acinetoscope-mge-data" %}
{% set version = "1.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/bbeckley-hub/acinetoscope/releases/download/v{{ version }}/{{ name }}-v{{ version }}.zip
  sha256: a9ef96265c6dfa4636d33e45e3e82e9376e1ba61983817b08448d2f99d84f693

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

test:
  commands:
    - test -d $PREFIX/share/acinetoscope/modules/mge_module/mobileOG-db/beatrix-1-6_v1_all
    - test -f $PREFIX/share/acinetoscope/modules/mge_module/mobileOG-db/beatrix-1-6_v1_all/mobileOG-db-beatrix-1.6.dmnd

about:
  home: https://github.com/bbeckley-hub/acinetoscope
  license: MIT
  license_file: LICENSE
  summary: 'mobileOG-db database for the AcinetoScope MGE profiling module'
  description: |
    Pre-built mobileOG-db payload used by the AcinetoScope mobile genetic
    element profiling module. Contains the DIAMOND database and metadata
    files required for per-genome MGE signature detection.
  doc_url: https://github.com/bbeckley-hub/acinetoscope
  dev_url: https://github.com/bbeckley-hub/acinetoscope

extra:
  recipe-maintainers:
    - bbeckley-hub
