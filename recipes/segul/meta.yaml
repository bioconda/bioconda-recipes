{% set version = "0.25.0" %}

package:
  name: segul
  version: {{ version }}

source:
  url: https://github.com/hhandika/segul/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1ce5e4161a240bdf7c7dc094c92dd2953b2f4ea5e111ed365c3c32c3327f38fc

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('segul', max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}

test:
  commands:
    - segul --help

about:
  home: "https://github.com/hhandika/segul"
  license: MIT
  license_family: MIT
  summary: "An ultrafast and memory efficient tool for phylogenomics."
  dev_url: "https://github.com/hhandika/segul"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - hhandika
