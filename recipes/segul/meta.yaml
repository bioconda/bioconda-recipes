{% set version = "0.24.0" %}

package:
  name: segul
  version: {{ version }}

source:
  url: https://github.com/hhandika/segul/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 7496bd2ae83144b4f3da6e083b8c0c87cf04a258fe8592177aa71729c82677d2

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('segul', max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}

test:
  commands:
    - segul --help

about:
  home: "https://github.com/hhandika/segul"
  license: MIT
  license_family: MIT
  summary: "An ultrafast and memory efficient tool for phylogenomics."
  dev_url: "https://github.com/hhandika/segul"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - hhandika
