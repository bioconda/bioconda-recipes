{% set name = "fastqtk" %}
{% set version = "0.30" %}
{% set sha256 = "040765ca63a5916a9587c94a275d818045444e7c63b82fc3e19514d5c591af92" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://github.com/ndaniel/fastqtk/archive/refs/tags/v0.30.tar.gz
  sha256: {{ sha256 }}
  patches:
    - makefile.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin = "x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - zlib
  host:
    - zlib

test:
  commands:
    - fastqtk 2>&1 | grep "Version" > /dev/null

about:
  home: https://github.com/ndaniel/fastqtk
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: fastqtk is a fast and lightweight tool for interleaving/deinterleaving/counting/trimming FASTQ files.
extra:
  additional-platforms:
    - linux-aarch64
