{% set name = "turbo-picard-picard-shim" %}
{% set version = "0.1.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/dnncha/turbo-picard/archive/refs/tags/v0.1.10.tar.gz
  sha256: 9ab9054a1caf526dc2da1cf066861e7e5a32b5cdc8991c5cd9fa84c75840cd69
build:
  number: 0
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage('turbo-picard-picard-shim', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - clangdev
    - make
    - pkg-config
    - python
  host:
    - bzip2
    - curl
    - libzlib
    - openssl
    - xz
  run:
    - turbo-picard =={{ version }}
    - bzip2
    - curl
    - libzlib
    - openssl
    - xz
  run_constrained:
    - picard ==0

test:
  commands:
    - picard --version
    - turbo-picard AccelerationStatus --help
    - picard MarkDuplicates --help

about:
  home: https://github.com/dnncha/turbo-picard
  doc_url: https://turbo-picard.readthedocs.io/
  dev_url: https://github.com/dnncha/turbo-picard
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Optional picard command shim for turbo-picard.
  description: |
    Installs a picard compatibility entrypoint backed by turbo-picard. This
    package intentionally conflicts with upstream picard because it shadows the
    same command name. See CITATION.cff for the software citation and the
    documentation for the separate real-data evidence citations.

extra:
  recipe-maintainers:
    - dnncha
