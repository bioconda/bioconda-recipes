{% set version = "0.7.0" %}

package:
  name: onkopus
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/o/onkopus/onkopus-{{ version }}.tar.gz
  sha256: ea2d3a6be3bef7ad0cfcb3d7e62d9a3aa4275e57fc0df5debac2adb3c4f79aae

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('onkopus', max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
  run:
    - python >=3.9
    - requests
    - numpy
    - matplotlib-base
    - pandas
    - plotly
    - scikit-learn
    - async-timeout
    - redis-py
    - pyaml
    - adagenes

test:
  imports:
    - onkopus

about:
  home: "https://gitlab.gwdg.de/MedBioinf/mtb/onkopus/onkopus"
  summary: "Variant interpretation framework to analyze and interpret genetic alterations in cancer."
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: LICENSE
  dev_url: "https://gitlab.gwdg.de/MedBioinf/mtb/onkopus/onkopus"

extra:
  recipe-maintainers:
    - famosab
