schema_version: 1

context:
  version: "0.7.0"

package:
  name: onkopus
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/onkopus/onkopus-${{ version }}.tar.gz
  sha256: ea2d3a6be3bef7ad0cfcb3d7e62d9a3aa4275e57fc0df5debac2adb3c4f79aae

build:
  number: 0
  skip: match(python, "<3.9")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
  run:
    - python
    - requests
    - numpy
    - matplotlib-base
    - pandas
    - plotly
    - scikit-learn
    - async-timeout
    - redis-py
    - pyaml
    - adagenes

tests:
  - python:
      imports:
        - onkopus
      pip_check: true

about:
  summary: Variant interpretation framework to analyze and interpret genetic alterations in cancer
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://gitlab.gwdg.de/MedBioinf/mtb/onkopus/onkopus

extra:
  recipe-maintainers:
    - famosab
