package:
  name: 'r-qtlseqr'
  version: "0.7.5.2"

source:
  git_url: https://github.com/bmansfeld/QTLseqr.git
  git_rev: 5e761379a805b65038c415c8d3ce7aa61abe89dc
  sha256: unused

build:
  number: 8
  # nothing provides r-stable needed by r-modeest-2.4.0-r42hd8ed1ab_3
  skip: True  # [linux and aarch64]
  rpaths:
    - lib/R/lib/
    - lib/
  script:
    - export DISABLE_AUTOBREW=1
    - ${R} CMD INSTALL --build . ${R_ARGS}
  run_exports:
    - {{ pin_subpackage('r-qtlseqr', max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - r-base
    - r-mass
    - r-rcpp
    - r-dplyr
    - r-modeest
    - r-ggplot2
    - r-gtools
    - r-readr
    - r-tidyr
    - r-locfit
  run:
    - r-base
    - r-mass
    - r-rcpp
    - r-dplyr
    - r-modeest
    - r-ggplot2
    - r-gtools
    - r-readr
    - r-tidyr
    - r-locfit

test:
  commands:
    - $R -e "library('QTLseqr')"

about:
  home: "https://github.com/bmansfeld/QTLseqr"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  summary: "QTLseqr is an R package for QTL mapping using NGS Bulk Segregant Analysis."
  dev_url: "https://github.com/bmansfeld/QTLseqr"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - uses_vcs_url
  recipe-maintainers:
    - Zhougeng Xu
