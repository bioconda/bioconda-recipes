{% set name = "pourrna" %}
{% set version = "1.3.1" %}
{% set sha256 = "4c5c131302a0cb5d21793a41ccea6b84b9c5f59a4e50bb6bbbd274b2b8c017cb" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ViennaRNA/pourRNA/releases/download/v{{ version }}/pourRNA-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage( name, max_pin="x.x") }}

requirements:
  build:
    - make
    - pkg-config
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - gengetopt
    - viennarna >=2.4.14,<3.0.0
  run:
    - viennarna >=2.4.14,<3.0.0
test:
  commands:
    - pourRNA --version

about:
  home: https://github.com/ViennaRNA/pourRNA/
  license: GPLv2
  license_file: COPYING
  summary: "Compute local minima and respective transition rates of an RNA energy landscape."

extra:
  identifiers:
    - doi:10.1093/bioinformatics/btz583
  recipe-maintainers:
    - entzian
    - martin-raden
