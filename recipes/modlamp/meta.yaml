{% set name = "modlamp" %}
{% set version = "4.3.3" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: "09b5d66428ba6e5905706a5e96b08203be0f130f646861ed322e7e458e885e77"

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.10
    - setuptools >=77
  run:
    - python >=3.10
    - numpy >=1.17
    - scipy >=1.8
    - matplotlib-base >=3.9
    - scikit-learn >=1.0
    - pandas >=1.4
    - requests >=2.25
    - lxml >=4.6
    - joblib >=1.1

test:
  imports:
    - modlamp

about:
  home: "http://modlamp.org"
  license: "BSD-3-Clause"
  license_family: "BSD"
  summary: "python package for in silico peptide design and QSAR studies"
  doc_url: "https://modlamp.org/index.html"
  dev_url: "https://github.com/alexarnimueller/modlamp"

extra:
  recipe-maintainers:
    - jaidevjoshi83
