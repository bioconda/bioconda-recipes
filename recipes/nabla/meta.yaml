{% set name = "nabla" %}
{% set version = "1.3.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/CNHume/nabla/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5def676bdabdfad76eb0c7c84e1e6e0d4ee3e074c6a0a9a00002bf78c80d546e

build:
  number: 1
  run_exports:
    - {{ pin_subpackage('nabla', max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}

test:
  commands:
    - nabla -V
    - nabla64 -V

about:
  home: https://github.com/CNHume/nabla
  license: LGPL-3.0-or-later
  license_file:
    - cli/LICENSES/COPYING_LESSER.txt
    - cli/LICENSES/COPYING.txt
  summary: "Longest common subsequence (LCS) of two sequences or files, with automatic algorithm selection, FASTA input, and SAM CIGAR output."
  description: |
    nabla finds the Longest Common Subsequence (LCS) of two record or text
    sequences, selecting automatically among four algorithms — Myers,
    Hunt-Szymanski, RickSpace, or RickTime — based on the input's edit
    distance, match count, and alphabet size.  nabla can read FASTA (-F) and
    emit SAM CIGAR alignments (-G), allowing nucleotide and protein sequences
    to be compared.  The wide-position nabla64 build lifts the 32-bit
    restriction to support whole-genome inputs.

extra:
  recipe-maintainers:
    - CNHume
  identifiers:
    - doi:10.5281/zenodo.24474948
