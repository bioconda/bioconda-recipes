{% set name = "RagTag" %}
{% set version = "2.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/24/6d/cf2396137b4b1a24c5f5517f8aada42cd3c3bb065b09855e254125354b5f/ragtag-{{ version }}.tar.gz
  sha256: 883237df576baa0155093caca644f7255cb7a80c707e9f657a95229ab47e52ed

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3
    - setuptools
  run:
    - python >=3
    - networkx
    - intervaltree
    - numpy
    - pysam
    - minimap2
    - mummer

test:
  imports:
    - ragtag_utilities
  commands:
    - ragtag.py --help

about:
  home: "https://github.com/malonge/RagTag"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Fast reference-guided genome assembly scaffolding."
  doc_url: "https://github.com/malonge/RagTag/wiki"
  dev_url: "https://github.com/malonge/RagTag"

extra:
  recipe-maintainers:
    - malonge
  identifiers:
    - doi:10.1186/s13059-022-02823-7
    - biotools:ragtag
    - usegalaxy-eu:ragtag
