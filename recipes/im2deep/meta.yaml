{% set name = "im2deep" %}
{% set version = "2.0.0" %}
{% set sha256 = "e7d09fd13200d7f9da69e12f5a3de4d980bf68589edd739d7c7b80728fa173ba" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/im2deep-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:

  number: 0
  entry_points:
    - im2deep=im2deep.__main__:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  noarch: python
  run_exports:
    - {{ pin_subpackage('im2deep', max_pin="x.x") }}

requirements:
  host:
    - pip
    - python >=3.11
    - uv-build
  run:
    - python >=3.11
    - click >=8
    - deeplc >=4.0.0b1
    - psm-utils >=1.5.1
    - pandas >=1.5
    - numpy >=1.25
    - rich >=13
    - pytorch >=2.6.0
    - lightning >=2.1

test:
  imports:
    - im2deep

about:
  home: https://github.com/compomics/im2deep
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: "Framework for prediction of collisional cross-section of peptides."
  dev_url: https://github.com/compomics/im2deep

extra:
  recipe-maintainers:
    - CompOmics
    - rodvrees
