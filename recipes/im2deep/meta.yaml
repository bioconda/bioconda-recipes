{% set name = "im2deep" %}
{% set version = "2.0.2" %}
{% set sha256 = "53bd587ddfe1d7bf3b3a7054a7bad513d636265d515a8619752b2af1af033b89" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/im2deep-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:

  number: 0
  entry_points:
    - im2deep=im2deep.__main__:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  noarch: python
  run_exports:
    - {{ pin_subpackage('im2deep', max_pin="x.x") }}

requirements:
  host:
    - pip
    - python >=3.11
    - uv-build
  run:
    - python >=3.11
    - click >=8,<9
    - deeplc >=4.0.0b1,<5
    - psm-utils >=1.5.1,<2
    - pandas >=1.5,<3
    - numpy >=1.25,<3
    - rich >=13,<15
    - pytorch >=2.6.0,<3
    - lightning >=2.1,<3

test:
  imports:
    - im2deep

about:
  home: https://github.com/compomics/im2deep
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: "Framework for prediction of collisional cross-section of peptides."
  dev_url: https://github.com/compomics/im2deep

extra:
  recipe-maintainers:
    - CompOmics
    - rodvrees
