{% set name = "ilesta" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/yvlaere/Ilesta/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 97ab6ae492c5008447d2018acaa0576b2161b4f5d8eec6c013649328a72291af

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yaml
    - cargo install -v --locked --no-track --root $PREFIX --path .

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  run:
    - minimap2 >=2.28

test:
  commands:
    - Ilesta --help

about:
  home: "https://github.com/yvlaere/Ilesta"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file:
    - LICENSE
    - THIRDPARTY.yaml
  summary: "De novo genome assembler for long-read sequencing data."
  dev_url: "https://github.com/yvlaere/Ilesta"

extra:
  recipe-maintainers:
    - yvlaere
  additional-platforms:
    - linux-aarch64
    - osx-arm64
