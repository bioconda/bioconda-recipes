{% set name = "varnet" %}
{% set version = "1.5.5" %}
{% set python_min = "3.10" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/skandlab/VarNet/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5b2d33eef0bf4438a2bbb561e715af5d5228a0efb944de5ea9d679ea5ad72f1d

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    # pandas >=3 makes np.split/np.array_split on a DataFrame return plain
    # ndarrays, which breaks prediction batching (snvs/predict.py).
    - pandas >=1.1.1,<3
    - joblib >=0.16.0
    - pysam >=0.16.0.1
    # Bundled models were saved with Keras 2; TF >=2.16 switches tf.keras to Keras 3,
    # which cannot load them.
    - tensorflow-cpu >=2.13,<2.16
    - pybedtools >=0.8.1
    # predict.py shells out to `bedtools sort` when writing the final VCF.
    - bedtools
    # download_resources.sh downloads with curl and checks files with md5sum.
    - curl
    - coreutils

test:
  requires:
    - python {{ python_min }}
  commands:
    - varnet-predict --help
    - varnet-filter --help
    - varnet-predict --version
    - varnet-filter --version
    - test -x $PREFIX/bin/varnet-download-resources
    # predict.py shells out to this when writing the final VCF
    - bedtools --version

about:
  home: https://github.com/skandlab/VarNet
  license: LicenseRef-PolyForm-Noncommercial-1.0.0
  license_file: LICENSE
  summary: Accurate somatic variant detection using weakly supervised deep learning.

extra:
  notes: |
    VarNet installs three commands: `varnet-filter`, `varnet-predict` and `varnet-download-resources`.
    Run the filter step first to find candidate variants, then predict to generate VCF output.
    For tumor-only mode, run `varnet-download-resources <folder>` once and pass the folder with `--resource_dir`.
    See https://github.com/skandlab/VarNet for full usage instructions.
