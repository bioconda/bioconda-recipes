{% set name = "varnet" %}
{% set version = "1.5.3" %}
{% set python_min = "3.10" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/skandlab/VarNet/archive/refs/tags/v{{ version }}.tar.gz
  sha256: b97c5acf60ad16d5061b23ad34f6d5210bbf6667393872fdd56ee1876eb554ba
  patches:
    # Stray `if` line in the v1.5.3 tag; fixed upstream on master after tagging.
    - fix-indels-predict-syntax.patch

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - pandas >=1.1.1
    - joblib >=0.16.0
    - pysam >=0.16.0.1
    # Bundled models were saved with Keras 2; TF >=2.16 switches tf.keras to Keras 3,
    # which cannot load them.
    - tensorflow-cpu >=2.13,<2.16
    - pybedtools >=0.8.1

test:
  requires:
    - python {{ python_min }}
  commands:
    - varnet-predict --help
    - varnet-filter --help

about:
  home: https://github.com/skandlab/VarNet
  license: LicenseRef-PolyForm-Noncommercial-1.0.0
  license_file: LICENSE
  summary: Accurate somatic variant detection using weakly supervised deep learning.

extra:
  notes: |
    VarNet installs two commands: `varnet-filter` and `varnet-predict`.
    Run the filter step first to find candidate variants, then predict to generate VCF output.
    See https://github.com/skandlab/VarNet for full usage instructions.
