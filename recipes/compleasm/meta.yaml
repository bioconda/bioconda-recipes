{% set name = "compleasm" %}
{% set version = "0.2.9" %}
{% set hash = "f82f8d33c4d644381830dcb61c19a5b68f78f0d465201ccfe3e8d8446afc0429" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://github.com/huangnengCSU/compleasm/archive/refs/tags/v{{ version }}.tar.gz"
  sha256: {{ hash }}
 
build:
  number: 0
  noarch: python
  entry_points:
    - compleasm=compleasm:main
  script:
    - {{ PYTHON }} -m pip install . -vv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x.x") }}

requirements:
  host:
    - pip
    - python >=3.9
  run:
    - python >=3.9
    - pandas
    - hmmer
    - miniprot >=0.11
    - sepp
    - dendropy <4.6.0

test:
  commands:
    - compleasm --help

about:
  home: "https://github.com/huangnengCSU/compleasm"
  license: Apache License 2.0
  license_file: LICENSE
  summary: "Compleasm: a faster and more accurate reimplementation of BUSCO"
  dev_url: "https://github.com/huangnengCSU/compleasm"

extra:
  recipe-maintainers:
    - huangnengCSU
