{% set name = "flair" %}
{% set version = "3.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/64/c6/a5fb6bf91a36577e594753ebf97008c3536da9de0959e68343e7c5e33d5f/flair_brookslab-3.0.1.tar.gz
  sha256: 04554034b62f95a74b1f062d5c48d39fcb21ffd122085ed7ffddb6b13de60bcf

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage('flair', max_pin="x") }}

requirements:
  host:
    - python >=3.12,<3.15
    - pip
    - poetry-core
  run:
    - python >=3.12,<3.15
    - pysam >=0.23.0,<0.24.0
    - pipettor >=1.1.0,<2.0.0
    - ncls >=0.0.70,<0.1.0
    - mappy >=2.28,<3.0
    - numpy >=2.2,<3.0
    - scipy >=1.15.1,<2.0.0
    - setuptools >=80.2.0,<81.0.0
    - minimap2 >=2.28,<3.00
    - samtools >=1.21
    - bedtools >=2.31.1,<3.0
    - matplotlib-base >=3.10,<4.0

test:
  imports:
    - flair
  commands:
    - flair align --help

about:
  home: "https://github.com/BrooksLabUCSC/flair"
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: "LICENSE.txt"
  summary: "Correction, isoform definition, and alternative splicing analysis of noisy reads (ONT and PacBio)."
  dev_url: "https://github.com/BrooksLabUCSC/flair"
  doc_url: "https://flair.readthedocs.io"

extra:
  identifiers:
    - doi:10.1038/s41467-020-15171-6
