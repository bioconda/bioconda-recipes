{% set version = "1.1.4" %}

package:
  name: dfast_qc
  version: {{ version }}

source:
  url: https://github.com/nigyta/dfast_qc/archive/{{ version }}.tar.gz
  sha256: b25549237940b107699d2aa947fbb0c2d9070347d4771ea2087508758180bfed

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('dfast_qc', max_pin="x") }}

requirements:
  run:
    - python >=3.8
    - prodigal
    - hmmer
    - checkm-genome ==1.2.2
    - ete3
    - more-itertools
    - peewee
    - mash
    - skani
    - gsl

test:
  commands:
    - which dfast_qc
    - dfast_qc -h

about:
  home: 'https://dfast.nig.ac.jp'
  license: "GPLv3"
  license_file: "docs/LICENSE"
  summary: "DFAST_QC: Taxonomy and completeness check for prokaryotic genomes."
  dev_url: "https://github.com/nigyta/dfast_qc"
