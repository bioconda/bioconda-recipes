{% set version = "0.9.7" %}

package:
  name: rikin
  version: {{ version }}

source:
  url: https://github.com/s-will/rikin/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 4eab891c98b871401e4d5163959e6f3c9621512bf57897ba62cc1d1689366545

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('rikin', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - autoconf
    - automake
    - libtool
    - pkg-config
    - gengetopt
    - make
  host:
    - viennarna
    - locarna
    - zlib
    - llvm-openmp  # [osx]
  run:
    - viennarna
    - locarna
    - llvm-openmp  # [osx]
    - python >=3.9
    - numpy
    - pandas
    - scipy
    - matplotlib-base
    - seaborn
    - octave

test:
  commands:
    - rikin_enum --help
    - rikin_barriers --help
    - rikin_prune --help
    - rikin_pipeline.py --help
    - rikin_plot.py --help

about:
  home: https://github.com/s-will/rikin
  license: AGPL-3.0-or-later 
  license_file: COPYING
  license_family: AGPL
  summary: Fast computation of RNA-RNA interaction kinetics
  description: |
    RNAInterKin (RIKin) implements tools for the fast computation of RNA-RNA
    interaction kinetics in a detailed RNAup/IntaRNA-inspired interaction
    model, based on RNA secondary structure and the full Turner nearest-
    neighbor energy model.

extra:
  recipe-maintainers:
    - s-will
  additional-platforms:
    - linux-aarch64
    - osx-arm64
