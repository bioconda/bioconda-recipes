{% set version = "1.0.2" %}

package:
  name: tb-consensus-aligner
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/tb-consensus-aligner/tb_consensus_aligner-{{ version }}.tar.gz
  sha256: 7549b51aa66fa3827e5ebafc0c0a697b98a55f750680f59552201f5b975884b5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage('tb-consensus-aligner', max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - setuptools >=61.0.0
    - wheel
    - pip
  run:
    - python >=3.8
    - biopython >=1.80

test:
  imports:
    - tb_consensus_aligner
  commands:
    - pip check
    - tb-consensus-aligner --help
  requires:
    - pip
    - python

about:
  home: https://github.com/scg40/TBConsensusAligner
  summary: Building consensus fasta files and variable multi-sequence alignments for mycobacterial genomes.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - scg40
