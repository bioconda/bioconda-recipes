{% set version = "1.0.5" %}

package:
  name: hyphlow
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hyphlow/hyphlow-{{ version }}.tar.gz
  sha256: b01eb27e55f583ac2c5d1027e5e16c74fa9bd27de8c3e9e356e9e3f08bbeb344

build:
  entry_points:
    - hyphlow = hyphlow.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage('hyphlow', max_pin="x") }}

requirements:
  host:
    - python >=3.8,<3.13
    - setuptools >=61.0
    - pip
  run:
    - python >=3.8,<3.13
    - hyphy
    - pyqt
    - qtawesome
    - pandas
    - ete3
    - rapidfuzz
    - taxopy
    - xlsxwriter

test:
  imports:
    - hyphlow
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/hyphlow/
  summary: Bioinformatics selection analysis pipeline and GUI
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hellojung0810
