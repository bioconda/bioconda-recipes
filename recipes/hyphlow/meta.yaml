{% set version = "1.0.3" %}

package:
  name: hyphlow
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hyphlow/hyphlow-{{ version }}.tar.gz
  sha256: 715f7b54199072312f730d564a510abae2503a454678494eb70a145943ee6731

build:
  entry_points:
    - hyphlow = hyphlow.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8
    - setuptools >=61.0
    - pip
  run:
    - python >=3.8
    - hyphy
    - pyqt
    - qtawesome
    - pandas
    - ete3
    - rapidfuzz
    - taxopy
    - xlsxwriter

test:
  imports:
    - hyphlow
  commands:
    - pip check
    - hyphlow --help
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/hyphlow/
  summary: Bioinformatics selection analysis pipeline and GUI
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hellojung0810
