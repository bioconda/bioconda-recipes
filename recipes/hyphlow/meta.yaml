{% set version = "1.0.6" %}

package:
  name: hyphlow
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hyphlow/hyphlow-{{ version }}.tar.gz
  sha256: df9c31d78f43d51ff29ec16856a96d65dfa141319bff99e2eec33012d628f0b5

build:
  number: 0
  noarch: python
  entry_points:
    - hyphlow = hyphlow.main:main
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('hyphlow', max_pin="x") }}

requirements:
  host:
    - python >=3.8,<3.13
    - setuptools >=61.0
    - pip
  run:
    - python >=3.8,<3.13
    - hyphy
    - pyqt
    - qtawesome
    - pandas
    - ete3
    - rapidfuzz
    - taxopy
    - xlsxwriter
    - matplotlib-base
    - seaborn-base

test:
  imports:
    - hyphlow

about:
  home: "https://pypi.org/project/hyphlow"
  summary: "Bioinformatics selection analysis pipeline and GUI."
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hellojung0810
