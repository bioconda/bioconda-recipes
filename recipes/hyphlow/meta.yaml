{% set version = "1.0.5" %}

package:
  name: hyphlow
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hyphlow/hyphlow-{{ version }}.tar.gz
  sha256: b01eb27e55f583ac2c5d1027e5e16c74fa9bd27de8c3e9e356e9e3f08bbeb344

build:
  number: 0
  noarch: python
  entry_points:
    - hyphlow = hyphlow.main:main
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('hyphlow', max_pin="x") }}

requirements:
  host:
    - python >=3.8,<3.13
    - setuptools >=61.0
    - pip
  run:
    - python >=3.8,<3.13
    - hyphy
    - pyqt
    - qtawesome
    - pandas
    - ete3
    - rapidfuzz
    - taxopy
    - xlsxwriter
    - matplotlib-base
    - seaborn-base

test:
  imports:
    - hyphlow

about:
  home: "https://pypi.org/project/hyphlow"
  summary: "Bioinformatics selection analysis pipeline and GUI."
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hellojung0810
