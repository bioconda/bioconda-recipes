{% set name = "bioqc-agent" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/zarrine905/bioqc-agent/archive/0b7c59187b67a96de76334771e0f80bddf7a2004.tar.gz
  sha256: 56d57ac111bb4de7e6a92bffc7ec0d276a6bd77dbac32708dda10501db42bad3

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python
  run:
    - python
    - fastqc
    - pandas
    - pyyaml
    - scikit-learn

test:
  commands:
    - bioqc-agent --help

about:
  home: https://github.com/zarrine905/bioqc-agent
  license: MIT
  license_file: LICENSE
  summary: Rule-based NGS FASTQ QC with optional ML anomaly screening
  description: |
    BioQC-Agent combines FastQC, configurable deterministic QC rules,
    optional machine-learning anomaly screening, and optional local
    LLM-assisted interpretation for paired-end FASTQ data.
  doc_url: https://github.com/zarrine905/bioqc-agent#readme
  dev_url: https://github.com/zarrine905/bioqc-agent

extra:
  recipe-maintainers:
    - zarrine905
  notes: |
    The installed bioqc-agent command runs the pipeline and expects paired-end
    FASTQ files. Ollama and the llama3.2:3b model are optional external
    components for local LLM draft output; they are not installed by this
    package. The deterministic QC and ML steps can run without Ollama.
    The source is pinned to an immutable GitHub archive for commit
    0b7c59187b67a96de76334771e0f80bddf7a2004 because upstream has not
    published a tagged release.
