{% set name = "dstar" %}
{% set version = "1.0.0" %}

package:
  name: dstar
  version: {{ version }}

source:
  url: https://github.com/TQ-Smith/DSTAR/archive/refs/tags/DSTARv{{ version }}.tar.gz
  sha256: a2534e582a5918c6ae721b2f8f4a2800cd14f1385bb1a4f57c3209f693260b57

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - make
  host:
    - zlib

test:
  commands:
    - dstar

about:
  home: https://github.com/TQ-Smith/DSTAR
  summary: D STatistic with Allelic Rarefaction
  description: |
    D STatistic with Allelic Rarefaction (D*) identifies locally introgressed regions in a three population tree. D* does not require an outgroup, incorporates multiallelic sites, and corrects for unequal sample sizes between populations.
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/TQ-Smith/DSTAR/wiki
  dev_url: https://github.com/TQ-Smith/DSTAR

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - TQ-Smith
  skip-lints:
    - compiler_needs_stdlib_c
