{% set name = "seqfu" %}
{% set version = "1.30.1" %}
{% set sha256 = "2b747438cfd44d2717f3c2158daec438b9023740fe42dfb5c8e9a1b3e4531158" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/quadram-institute-bioscience/seqfu_v1/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: True  # [win]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - nim >=2.2.0  # [not arm64]
    - make
    - pkg-config
    - coreutils
  host:
    - curl
    - pcre
    - zlib
  run:
    - pcre

test:
  commands:
    - seqfu
    - seqfu stats --help
    - seqfu --version
    - "seqfu --version | grep '{{ version }}'"

about:
  home: "https://github.com/quadram-institute-bioscience/seqfu_v1"
  docs: "https://corebio.info/seqfu_v1"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: LICENSE
  summary: "DNA sequence utilities."
  description: |
    A collection of utilities to work with FASTX (FASTA or FASTQ) files
    that accept gzipped input.
    Tools to interleave and deinterleave, to calculate stats, and extract
    portions of sequence datasets.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - telatin
  identifiers:
    - biotools:{{ name }}
    - doi:10.3390/bioengineering8050059
  skip-lints:
    - compiler_needs_stdlib_c
