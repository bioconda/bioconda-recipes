{% set version = "0.1.0" %}

package:
  name: varnova
  version: {{ version }}

source:
  url: https://github.com/imrobintomar/VarNova/releases/download/v{{ version }}/varnova-linux-x86_64.tar.gz
  sha256: b4849d54d3a7b0a322adaa8444ab825e2395e4fa964705df6528d138221d772f

build:
  number: 0
  skip: True  # [not linux]
  binary_relocation: false
  script: |
    install -m 0755 varnova "${PREFIX}/bin/varnova"

requirements:
  run:
    - libgcc-ng >=12

test:
  commands:
    - varnova --version

about:
  home: https://github.com/imrobintomar/VarNova
  license: MIT
  license_file: LICENSE
  summary: "High-performance genomic variant annotation tool written in Rust"
  doc_url: https://github.com/imrobintomar/VarNova#readme
  dev_url: https://github.com/imrobintomar/VarNova

extra:
  recipe-maintainers:
    - imrobintomar
