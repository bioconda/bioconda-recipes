{% set version = "0.1.0" %}

package:
  name: varnova
  version: {{ version }}

source:
  url: https://github.com/imrobintomar/VarNova/releases/download/v{{ version }}/varnova-linux-x86_64.tar.gz
  sha256: b4849d54d3a7b0a322adaa8444ab825e2395e4fa964705df6528d138221d772f

build:
  number: 0
  skip: True  # [not linux]
  skip: True  # [not x86_64]
  script: |
    mkdir -p "${PREFIX}/bin"
    cp varnova "${PREFIX}/bin/varnova"
    chmod +x "${PREFIX}/bin/varnova"

requirements:
  build: []
  host: []
  run:
    - libgcc-ng >=12

test:
  commands:
    - varnova --version
    - varnova --help
    - varnova download --list

about:
  home: https://github.com/imrobintomar/VarNova
  license: MIT
  license_file: LICENSE
  summary: "Fastest genomic variant annotation tool — 14× faster than ANNOVAR, 10.7× faster than VEP"
  description: |
    VarNova is a high-performance genomic variant annotation tool written in Rust.
    It annotates SNVs, insertions, deletions, and block substitutions against gene
    databases (refGene, ensGene) and filter databases (gnomAD, ClinVar, dbSNP,
    dbNSFP, COSMIC) while producing ANNOVAR-compatible output with automatic
    gene-disease annotation from HPO, GenCC, ClinGen, OMIM, and PanelApp.

    Features:
      - 14x faster than ANNOVAR, 10.7x faster than VEP
      - ANNOVAR-identical output columns
      - Automatic gene-disease context (GenCC, ClinGen, OMIM, HPO, PanelApp)
      - HGVS notation for SNVs and indels
      - Binary .vnidx database format for NVMe speed
      - Python API (PyO3 bindings)
      - No runtime dependencies
  dev_url: https://github.com/imrobintomar/VarNova

extra:
  recipe-maintainers:
    - imrobintomar
  identifiers:
    - biotools:varnova
