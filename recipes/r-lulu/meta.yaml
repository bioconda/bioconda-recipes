{% set version = "0.1.0" %}
{% set commit = "50187ba8bb5eb3a36f4509e8dc0a7aeaa63a1e75" %}

package:
  name: r-lulu
  version: {{ version }}

source:
  url: https://github.com/tobiasgf/lulu/archive/{{ commit }}.tar.gz
  sha256: d493659aebe52b59c1f0e5998616a60093f8776cbf1543f02a36fc51bd5a631f

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage('r-lulu', max_pin='x.x') }}
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  host:
    - r-base
    - r-dplyr
  run:
    - r-base
    - r-dplyr

test:
  commands:
    - $R -e "library('lulu'); stopifnot(packageVersion('lulu') == '0.1.0')"

about:
  home: https://github.com/tobiasgf/lulu
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Post-clustering curation of amplicon data for reliable biodiversity metrics
  description: >-
    LULU identifies and merges likely artefactual daughter OTUs using
    co-occurrence, sequence similarity, and relative abundance information.
  dev_url: https://github.com/tobiasgf/lulu

extra:
  recipe-maintainers:
    - ollybolly

