{% set name = "lsabgc" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Kalan-Lab/lsaBGC-Pan/archive/refs/tags/v{{ version }}.tar.gz
  sha256: fe0ca05f252ad6093256df96f8e0bc85e796a2c7a964b8b24b16e13f6947885c
  
build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage("lsabgc", max_pin="x") }}

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    # BGC prediction, orthology inference and downstream analysis tools
    - zol >=1.8.0
    - bofasa
    - gecco >=0.10.0
    - orthofinder =2.5.5
    - pyseer >=1.3
    - muscle 5.1.*
    - famsa
    - prodigal
    - pyrodigal
    - trimal
    - fasttree
    - iqtree
    - mcl
    - hmmer
    - pal2nal
    - diamond
    - curl
    - tar
    - legacy-cgi
    # python libraries
    - biopython
    - ete3
    - numpy
    - scipy
    - pandas
    - xlsxwriter >=3.0.3
    - plotly >=5.0
    - matplotlib-base >=3.6
    - tqdm
    - rich-argparse

test:
  requires:
    - python {{ python_min }}
  imports:
    - lsaBGC
    - lsaBGC.util
    - lsaBGC.phyloplot
    - lsaBGC.paramplots
    - lsaBGC.setup_databases
    - lsaBGC.classes.Pan
    - lsaBGC.classes.GCF
    - lsaBGC.classes.BGC
  commands:
    - lsaBGC-Pan -h
    - lsaBGC-Pan setup -h
    - lsaBGC-Cluster -h
    - lsaBGC-See -h
    - lsaBGC-ComprehenSeeIve -h
    - lsaBGC-MIBiGMapper -h
    - lsaBGC-Reconcile -h
    - lsaBGC-Sociate -h
    - GSeeF -h
    - popstrat -h
    - phylogenate -h

about:
  home: https://github.com/Kalan-Lab/lsaBGC-Pan
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: "lsaBGC-Pan - refined workflow for pan-BGC-omic evolutionary investigations."
  dev_url: https://github.com/Kalan-Lab/lsaBGC-Pan
  doc_url: https://github.com/Kalan-Lab/lsaBGC-Pan/wiki

extra:
  recipe-maintainers:
    - raufs
    
