{% set name = "pyskani" %}
{% set version = "0.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 663114278d04c586c2684ce8111699884be1122bcef7d2e892a64886938e8e17

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
  skip: True  # [py27 or py36]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
  host:
    - python
    - pip
    - maturin
  run:
    - python

test:
  imports:
    - {{ name }}
  commands:
    - python -m unittest -vv {{ name }}.tests

about:
  home: "https://github.com/althonos/pyskani/"
  license: "MIT"
  license_family: "MIT"
  license_file: "COPYING"
  summary: "PyO3 bindings and Python interface to skani, a method for fast fast genomic identity calculation using sparse chaining."
  doc_url: "https://pyskani.readthedocs.io"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - althonos
