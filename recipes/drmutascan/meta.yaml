package:
  name: drmutascan
  version: "1.0.0"

source:
  git: https://github.com/luhan125/Drmutascan.git
  tag: v1.0.0

build:
  number: 1                     # 版本号递增
  noarch: generic
  script: |
    mkdir -p $PREFIX/bin
    cp -r $SRC_DIR/scripts/* $PREFIX/bin/
    chmod +x $PREFIX/bin/*.sh

requirements:
  host: []
  run:
    - python >=3.8
    - blast
    - samtools >=1.13
    - bedtools
    - last
    - biopython
    - pandas
    - numpy
    - openjdk

about:
  home: https://github.com/luhan125/Drmutascan
  license: MIT
  summary: "Drmutascan - 病原微生物耐药基因突变分析软件"
