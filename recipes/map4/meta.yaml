{% set name = "map4" %}
{% set version = "1.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/map4/map4-{{ version }}.tar.gz
  sha256: c80aef9e34ec3784e5493bbb068272cc2219b1fc44882f85e8e92588c1a755cc

build:
  entry_points:
    - map4 = map4.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage("map4", max_pin="x.x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - mhfp
    - numpy
    - rdkit
    - tqdm
    - scikit-learn
    - matplotlib-base

test:
  imports:
    - map4
  commands:
    - pip check
    - map4 --help
  requires:
    - pip
    - python

about:
  home: https://github.com/reymond-group/map4
  summary: MinHashed AtomPair Fingerprint of Radius 2
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mbodova
