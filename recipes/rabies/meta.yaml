{% set name = "rabies" %}
{% set version = "0.6.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rabies-{{ version }}.tar.gz
  sha256: 0133fcdb4322ce51291f71bc1942d85ac080dde988f1f21344b33e99ef44fcc5

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('rabies', max_pin="x.x") }}

requirements:
  host:
    - python >=3.9,<3.13
    - pip
    - setuptools
  run:
    - python >=3.9,<3.13
    - etelemetry >=0.2.0
    - matplotlib-base ==3.3.4
    - networkx <3
    - nibabel ==3.2.1
    - nilearn ==0.7.1
    - nipype ==1.6.1
    - numpy ==1.20.1
    - pandas ==1.2.4
    - pathos ==0.2.7
    - pybids ==0.16.3
    - qbatch ==2.3
    - scikit-learn ==0.24.1
    - scipy ==1.8.1
    - seaborn-base ==0.11.1
    - simpleitk ==2.0.2
    - traits <7.0

test:
  imports:
    - rabies

about:
  home: https://github.com/CoBrALab/RABIES
  summary: 'RABIES: Rodent Automated Bold Improvement of EPI Sequences.'
  license: "GPL-2.0-or-later"
  license_family: GPL
  license_file: LICENSE
  dev_url: https://github.com/CoBrALab/RABIES

extra:
  recipe-maintainers:
    - jaeakle
