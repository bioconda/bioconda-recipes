{% set name = "cosigt" %}
{% set version = "0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

build:
  number: 0
  run_exports:
      - {{ pin_subpackage(name, max_pin='x.x') }}

source:
  - url: https://github.com/davidebolo1993/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 964929bcb08f0fd0177e112c083ee6b70420846e60be379ae66744a2fcaee729

requirements:
  build:
    - {{ compiler('go') }}
    - {{ stdlib('c') }}

test:
  commands:
    - cosigt -h

about:
  home: https://github.com/davidebolo1993/{{ name }}
  license: 'GNU General Public License v3 (GPLv3)'
  license_family: GPL3
  license_file: LICENSE
  summary: Cosigt (COsine SImilarity-based GenoTyper)
  dev_url: https://github.com/davidebolo1993/{{ name }}

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - AndreaGuarracino
