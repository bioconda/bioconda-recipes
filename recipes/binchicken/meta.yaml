{% set version = "0.14.1" %}
{% set name = "binchicken" %}
{% set sha256 = "43a5787594fd0c4e158176f6cb5b2e82c03be4f55e3f237b8ab5d5d6712bb5c2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  entry_points:
    - binchicken = binchicken.binchicken:main
    - ibis = binchicken.binchicken:main
  run_exports:
    - {{ pin_subpackage('binchicken', max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python =3.11.*
    - snakemake-minimal >=9.22.0
    - snakemake-executor-plugin-cluster-generic >=1
    - bird_tool_utils_python >=0.5.1
    - extern
    - ruamel.yaml >=0.15.99
    - polars =1.36.*
    - pigz
    - pyarrow
    - parallel
    - sourmash =4.8.*
    - sourmash_plugin_branchwater =0.9.*
    - pyopenssl >22.1.0
    - pixi >=0.72.1
    - pip

test:
  commands:
    - {{ name }} --version | grep '{{ version }}'

about:
  home: https://github.com/aroneys/binchicken
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Targeted recovery of low abundance metagenome assembled genomes through intelligent coassembly
  dev_url: https://github.com/aroneys/binchicken
  doc_url: https://aroneys.github.io/binchicken
