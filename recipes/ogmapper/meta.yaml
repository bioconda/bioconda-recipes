{% set version = "1.1.1" %}

package:
  name: ogmapper
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("ogmapper", max_pin="x") }}

source:
  url: https://github.com/vtrevino/ogmapper/archive/refs/tags/1.1.1.zip
  sha256: f3ad63c8419035cc8c2c29b230a59569ff7cfc77a99ab012e1bf26528060b203

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - wfa2-lib
    - zlib

test:
  commands:
    - ogmapper

about:
  home: https://github.com/vtrevino/ogmapper
  summary: A fast and light genomic mapper for short reads
  license: GPLv3
  license_file: LICENSE
  license_family: GPL3

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:ogmapper
