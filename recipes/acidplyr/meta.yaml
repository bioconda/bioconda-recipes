{% set version = "0.1.1" %}
{% set github = "https://github.com/acidgenomics/py-acidplyr" %}

package:
  name: acidplyr
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/a/acidgenomics-acidplyr/acidgenomics_acidplyr-{{ version }}.tar.gz"
  sha256: c802b1f3e69c4fc5a84d159c430e064a6638d776d70b4e2a87e0b336c32208c2

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  run_exports:
    - {{ pin_subpackage('acidplyr', max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - pip
    - uv-build >=0.11,<1
  run:
    - python >=3.12
    - numpy
    - pandas

test:
  imports:
    - acidplyr

about:
  home: https://python.acidgenomics.com/acidplyr/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE
  summary: A pandas-based grammar for data frame manipulation.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
