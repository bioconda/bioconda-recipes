{% set name = "biocutils" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/biocutils-{{ version }}.tar.gz
  sha256: e40c48153497ccf7a5d089d2389bfda0cba573f20ceecc4162864ed3aefa926d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - numpy

test:
  imports:
    - biocutils
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/biocpy/biocutils
  summary: Miscellaneous utilities for BiocPy, mostly to mimic base functionality in R.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - SilenWang
