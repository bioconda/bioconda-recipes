{% set version = "1.20.0" %}
{% set name = "mia" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name }}/bioconductor-{{ name }}_{{ version }}_src_all.tar.gz
  md5: 95a3c57e4682ed65e07d5d71f22f5c34

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-mia", max_pin="x.x") }}'

# Suggests: ade4, BiocStyle, biomformat, dada2, knitr, mediation, miaTime, miaViz, microbiomeDataSets, NMF, patchwork, philr, phyloseq, reldist, rhdf5, rmarkdown, scuttle, testthat, topicdoc, topicmodels, yaml
requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
  host:
    - bioconductor-biocgenerics >=0.58.0,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biostrings >=2.80.0,<2.81.0
    - bioconductor-bluster >=1.22.0,<1.23.0
    - bioconductor-decipher >=3.8.0,<3.9.0
    - bioconductor-decontam >=1.32.0,<1.33.0
    - bioconductor-delayedarray >=0.38.0,<0.39.0
    - bioconductor-delayedmatrixstats >=1.34.0,<1.35.0
    - bioconductor-dirichletmultinomial >=1.54.0,<1.55.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-multiassayexperiment >=1.38.0,<1.39.0
    - bioconductor-s4vectors >=0.50.0,<0.51.0
    - bioconductor-scater >=1.40.0,<1.41.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - bioconductor-treesummarizedexperiment >=2.20.0,<2.21.0
    - r-ape
    - r-base
    - r-dplyr
    - r-ecodive
    - r-mass
    - r-rcpp
    - r-rlang
    - r-stringr
    - r-tibble
    - r-tidyr
    - r-vegan
    - libblas
    - liblapack
    - zlib
    - liblzma-devel
  run:
    - bioconductor-biocgenerics >=0.58.0,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biostrings >=2.80.0,<2.81.0
    - bioconductor-bluster >=1.22.0,<1.23.0
    - bioconductor-decipher >=3.8.0,<3.9.0
    - bioconductor-decontam >=1.32.0,<1.33.0
    - bioconductor-delayedarray >=0.38.0,<0.39.0
    - bioconductor-delayedmatrixstats >=1.34.0,<1.35.0
    - bioconductor-dirichletmultinomial >=1.54.0,<1.55.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-multiassayexperiment >=1.38.0,<1.39.0
    - bioconductor-s4vectors >=0.50.0,<0.51.0
    - bioconductor-scater >=1.40.0,<1.41.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - bioconductor-treesummarizedexperiment >=2.20.0,<2.21.0
    - r-ape
    - r-base
    - r-dplyr
    - r-ecodive
    - r-mass
    - r-rcpp
    - r-rlang
    - r-stringr
    - r-tibble
    - r-tidyr
    - r-vegan

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: Artistic-2.0 | file LICENSE
  summary: Microbiome analysis
  description: mia implements tools for microbiome analysis based on the SummarizedExperiment, SingleCellExperiment and TreeSummarizedExperiment infrastructure. Data wrangling and analysis in the context of taxonomic data is the main scope. Additional functions for common task are implemented such as community indices calculation and summarization.
  license_file: LICENSE

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
