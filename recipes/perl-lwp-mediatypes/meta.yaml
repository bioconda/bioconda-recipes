{% set name = "perl-lwp-mediatypes" %}
{% set version = "6.05" %}
{% set sha256 = "abb2dcfbf069317fe65b098e3b2ad58c5eb33e9a839b9190cce6d371f8966cc1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/LWP-MediaTypes-6.05.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
    - perl-file-spec
    - perl-test-fatal
    - perl-test-more

  run:
    - perl
    - perl-carp 
    - perl-exporter 

test:
  imports:
    - LWP::MediaTypes

about:
  home: http://metacpan.org/pod/LWP::MediaTypes
  license: perl_5
  summary: 'guess media type for a file or a URL'
