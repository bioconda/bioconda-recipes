{% set name = "Trinotate" %}
{% set version = "4.0.6" %}
{% set sha256 = "1e3bb64d291ff0bb4715feb1b952c58ec4cc7277f3d3b9ffefe89992601acb4f" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Trinotate/Trinotate/archive/refs/tags/Trinotate-v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage('trinotate', max_pin="x") }}

requirements:
  host:
    - perl
    - perl-app-cpanminus
    - perl-module-build
    - perl-dbi
    - perl-dbd-sqlite
    - perl-file-find-rule
  run:
    - perl
    - sqlite
    - perl-app-cpanminus
    - perl-module-build
    - perl-dbi
    - perl-dbd-sqlite
    - perl-cgi
    - blast
    - hmmer
    - perl-file-find-rule
    - wget
    - diamond
    - infernal

test:
  commands:
    - Trinotate --help 2>&1 | grep "Trinotate --db <sqlite.db>"
    - test -n "${TRINOTATE_HOME}" && test -x "${TRINOTATE_HOME}/util/Trinotate_report_writer.pl"
    # exercise the driver end to end: create an empty Trinotate schema; --report must refuse an empty db
    - perl "${TRINOTATE_HOME}/util/admin/util/init_Trinotate_sqlite_db.pl" --sqlite test.sqlite
    - Trinotate --db test.sqlite --report > report.tsv 2> report.err || true
    - grep -q "Transcript table in test.sqlite is empty" report.err
    # then load the bundled sample transcripts/proteins with --init and generate a report
    - gunzip -c "${TRINOTATE_HOME}/testing/input_data/Trinity.fasta.gz" > Trinity.fasta
    - gunzip -c "${TRINOTATE_HOME}/testing/input_data/Trinity.fasta.gene_to_trans_map.gz" > gene_trans_map
    - gunzip -c "${TRINOTATE_HOME}/testing/input_data/Trinity.fasta.transdecoder.pep.gz" > transdecoder.pep
    - Trinotate --db test.sqlite --init --gene_trans_map gene_trans_map --transcript_fasta Trinity.fasta --transdecoder_pep transdecoder.pep
    - Trinotate --db test.sqlite --report --pfam_cutoff DNC > report.tsv
    - head -1 report.tsv | grep transcript_id
    - test $(grep -c TRINITY_ report.tsv) -gt 600

about:
  home: https://trinotate.github.io/
  license: 'BSD-3-Clause'
  license_file: LICENSE.txt
  summary: 'Trinotate is a comprehensive annotation suite designed for automatic
    functional annotation of transcriptomes, particularly de novo assembled
    transcriptomes, from model or non-model organisms'

extra:
  identifiers:
    - biotools:trinotate
    - usegalaxy-eu:trinotate
