{% set name = "PANORAMA" %}
{% set version = "1.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/labgem/{{ name }}/archive/{{ version }}.tar.gz
  sha256: '5262d6ba8086665655fa7a043a9115866f485a83a0cda7aa1e92a82f15e90775'

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed -vv .
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - ppanggolin >=2.1.0
    - pyhmmer >=0.6
    - lxml >=4.9.2
    - selenium >=4.35.0
    - geckodriver >=0.36.0

test:
  imports:
    - panorama
  commands:
    - panorama -h

about:
  home: https://github.com/labgem/{{ name }}
  doc_url: https://panorama.readthedocs.io
  license: "CeCiLL-2.1"
  license_file: LICENSE
  summary: "A robust pangenome-based method for predicting and comparing biological systems across species."


extra:
  recipe-maintainers:
    - jpjarnoux
    - JeanMainguy
