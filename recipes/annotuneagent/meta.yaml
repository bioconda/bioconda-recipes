{% set name = "annotuneagent" %}
{% set version = "0.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 793459fa200ee7cc1c9795e29011e3c57f580045e3ed4a1ff19c1d8d5ba5e353

build:
  number: 0
  noarch: python
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - annotuneagent = annotuneagent.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=3.10
    - anndata >=0.11.3
    - numpy >=1.23
    - pandas >=1.4
    - scipy >=1.7
    - scanpy >=1.10
    # sc.tl.leiden(flavor="igraph")
    - python-igraph >=0.10
    - scikit-misc >=0.1.4
    - numba >=0.57
    - scikit-learn >=1.1
    - matplotlib-base >=3.6
    - pyyaml >=6

test:
  imports:
    - annotuneagent
  commands:
    - annotuneagent --help

about:
  home: "https://github.com/leelieber2025/AnnoTuneAgent"
  dev_url: "https://github.com/leelieber2025/AnnoTuneAgent"
  doc_url: "https://annotuneagent.readthedocs.io"
  summary: "Cluster-level cell-type annotation from marker, name, and ML results."
  license: "Apache-2.0"
  license_family: APACHE
  license_file: LICENSE

extra:
  recipe-maintainers:
    - leelieber2025
