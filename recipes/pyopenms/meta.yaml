{% set name = "pyopenms" %}
{% set version = "3.6.0" %}

package:
  name: {{ name }}
  version: {{ version }}
{% if "dev" in version %}

source:
  git_url: https://github.com/OpenMS/OpenMS.git
  git_rev: develop
  md5: unused
{% else %}

source:
  url: https://github.com/OpenMS/OpenMS/releases/download/v{{ version }}/OpenMS-{{ version }}.tar.gz
  sha256: 70c7f7afff938634b5e87a7c9f71856a4469ae0e45d66dd50655460dbf6d6535
  patches:
    # libopenms does not install BrukerTimsFile.h.
    - 0001-bind_format-include-BrukerTimsFile.h-only-with-WITH_OPENTIMS.patch
{% endif %}

build:
  number: 0
  skip: true  # [py < 311]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - ninja
    - cmake >=3.24
  host:
    - python
    - nanobind >=3.1,<4
    - numpy >=2.0
    - pandas >=3
    - matplotlib-base >=3.5
    - libopenms =={{ version }}
    - libarrow =23=*_cpu
    - libboost-headers
    - eigen >=3.4.0
  run:
    - python
    - libopenms =={{ version }}
    - numpy >=2.0
    - pandas >=3
    - matplotlib-base >=3.5

test:
  imports:
    - pyopenms
  commands:
    - python -c "import pyopenms as oms; assert oms.__version__ == '{{ version }}', oms.__version__; print(oms.__version__)"
    - python -c "import pyopenms as oms; n = oms.ModificationsDB().getNumberOfModifications(); assert n > 100, n; print(n)"

about:
  home: "https://github.com/OpenMS/OpenMS"
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  summary: "Python bindings for OpenMS, an open-source software C++ library for LC-MS data management and analyses."
  dev_url: "https://github.com/OpenMS/OpenMS"
  doc_url: "https://openms.readthedocs.io/en/latest"

extra:
  recipe-maintainers:
    - timosachsenberg
    - jonasscheid
  additional-platforms:
    - osx-arm64
  identifiers:
    - biotools:openms
    - doi:10.1038/s41592-024-02197-7
{% if "dev" in version %}
  skip-lints:
    - uses_vcs_url
{% endif %}
