# Same macOS floor as openms-meta (libopenms): OpenMS 3.6.0 headers use std::filesystem inline
# (PathUtils.h, File.h), which libc++ marks unavailable below macOS 10.15, and libopenms itself
# needs 13.3 for floating-point std::to_chars. bioconda targets 11.0 (osx-arm64) and 10.13 (osx-64).
c_stdlib_version:           # [osx]
  - 13.3                    # [osx]
MACOSX_DEPLOYMENT_TARGET:   # [osx]
  - 13.3                    # [osx]
