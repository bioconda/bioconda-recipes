# Same macOS floor as openms-meta (libopenms): OpenMS 3.6.0 headers use std::filesystem inline
# (PathUtils.h, File.h) and libopenms needs 13.4 for floating-point std::to_chars. conda-forge has
# no 13.4 deployment target, so use 14.0. bioconda targets 11.0 (osx-arm64) and 10.13 (osx-64).
c_stdlib_version:           # [osx]
  - 14.0                    # [osx]
MACOSX_DEPLOYMENT_TARGET:   # [osx]
  - 14.0                    # [osx]
