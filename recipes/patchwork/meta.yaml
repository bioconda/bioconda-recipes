{% set name = "patchwork" %}
{% set version = "0.8.0" %}
{% set sha256 = "4fb332ecd36230e28b1b22edd9b2063c4238c01a8a1b157b81fb9c8b73bac7a7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/fethalen/Patchwork/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  binary_relocation: false
  run_exports:
    - {{ pin_subpackage('patchwork', max_pin='x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - julia >=1.12.1,<1.13
  run:
    - diamond >=2.0.10

test:
  commands:
    - patchwork --help

about:
  home: https://github.com/fethalen/Patchwork
  doc_url: https://github.com/fethalen/Patchwork#readme
  dev_url: https://github.com/fethalen/Patchwork
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Alignment-based exon retrieval and concatenation for phylogenomics

extra:
  recipe-maintainers:
    - fethalen
