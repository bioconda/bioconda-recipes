{% set version = "1.1.0" %}

package:
  name: rsbio-seq
  version: {{ version }}

source:
  url: https://github.com/anuradhawick/rsbio-seq/archive/v{{ version }}.tar.gz
  sha256: ea0eb2924281b94285a73a98892b1e959db6267970f7fae4726a80c0ee29f146

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('rsbio-seq', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler("rust") }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses
    - python >=3.9
  host:
    - python >=3.9
    - maturin >=1.9.3,<2.0
    - pip
  run:
    - python >=3.9

test:
  imports:
    - rsbio_seq
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/anuradhawick/rsbio-seq
  license: AGPL-3.0-only AND Apache-2.0 AND GPL-3.0-only
  license_file:
    - LICENSE-APACHE
    - LICENSE
    - LICENSE-GPL
  summary: "RSBio-Seq: a fast and light-weight sequence reading library"
  description: "RSBio-Seq is a fast and light-weight sequence reading library"
  doc_url: https://github.com/anuradhawick/rsbio-seq
  dev_url: https://github.com/anuradhawick/rsbio-seq

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - Vini2
    - anuradhawick
