{% set version = "1.1.0" %}

package:
  name: rsbio-seq
  version: {{ version }}

source:
  url: https://github.com/anuradhawick/rsbio-seq/archive/v{{ version }}.tar.gz
  sha256: ea0eb2924281b94285a73a98892b1e959db6267970f7fae4726a80c0ee29f146

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.9
    - maturin >=1.9.3,<2.0
    - pip
  run:
    - python >=3.9

test:
  imports:
    - rsbio_seq
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  license: AGPL-3.0-only AND Apache-2.0 AND GPL-3.0-only
  license_file:
    - LICENSE-APACHE
    - LICENSE
    - LICENSE-GPL

extra:
  recipe-maintainers:
    - Vini2
    - anuradhawick
