{% set name = "pyensembl" %}
{% set version = "2.28.1" %}
{% set sha256 = "f07ff67c98645b4149b344b273600ba5fed4e8d1437ebb885c04599e8da8905f" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0]|lower }}/{{ name|lower }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script:
    - wget https://files.pythonhosted.org/packages/30/94/3a66a2643773fc1f89a9b896d8b072121e8a24261a2e74b7fbf9abe37c29/datacache-1.26.0.tar.gz
    - tar -xvzf datacache-1.26.0.tar.gz
    - cd datacache-1.26.0
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
    - cd ../
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - pyensembl = pyensembl.shell:run
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
    - wget
    - tar
  run:
    - python >=3.9
    - typechecks >=0.0.2
    #- datacache >=1.18.0,<2.0.0
    - memoized-property >=1.0.2
    - tinytimer
    - gtfparse >=2.9.0
    - serializable
    - numpy >=2.0.0
    - pyfaidx >=0.8.1
    - filelock >=3.24,<5.0.0  # [py >= 310]
    - filelock >=3.12,<4.0.0  # [py < 310]
    - pandas >=0.15
    - six >=1.9.0
    - pylint >=1.4.4
    - python-dateutil >=2.5.0
    - platformdirs >=3.0
    - requests >=2.5.1
    - tqdm >=4.64

test:
  imports:
    - pyensembl
  commands:
    - pyensembl --help

about:
  home: "https://github.com/openvax/pyensembl"
  license: "Apache-2.0"
  summary: "Python interface to ensembl reference genome metadata."
  license_family: APACHE
  license_file: LICENSE
  dev_url: "https://github.com/openvax/pyensembl"
