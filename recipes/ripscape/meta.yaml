{% set name = "ripscape" %}
{% set version = "0.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/sittinanchanarat-cpu/ripscape/archive/v{{ version }}.tar.gz
  sha256: d17775f164d3a7b3771106e0aea2dfe3f03fb89c00183ed9f2cd347f0075e2a1

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("rust") }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses
    - make

test:
  commands:
    - ripscape --version
    - ripscape --help
    - ripscape lrar --help

about:
  home: https://github.com/sittinanchanarat-cpu/ripscape
  license: MIT OR Apache-2.0
  license_family: MIT
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  summary: Calibrated, masking-aware mapping of repeat-induced point mutation (RIP) and genome compartments in fungal genomes.
  dev_url: https://github.com/sittinanchanarat-cpu/ripscape
  doc_url: https://github.com/sittinanchanarat-cpu/ripscape/blob/v{{ version }}/README.md

extra:
  recipe-maintainers:
    - sittinanchanarat-cpu
  identifiers:
    - doi:10.5281/zenodo.23092981
  additional-platforms:
    - linux-aarch64
    - osx-arm64
