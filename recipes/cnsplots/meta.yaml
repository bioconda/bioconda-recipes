{% set version = "0.5.0" %}

package:
  name: cnsplots
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/cnsplots/cnsplots-{{ version }}.tar.gz
  sha256: a02b974ac0cf0ffc46ca47f567da807920739e1b0de10a08b67cdc53cda6b36a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10,<4.0
    - setuptools >=61.0
    - pip
  run:
    - python >=3.10,<4.0
    - adjusttext
    - anndata
    - biopython
    - comprisk >=0.7,<0.8
    - gseapy
    - lifelines >=0.30,<0.31
    - lxml
    - matplotlib-base >=3.10,<3.11
    - matplotlib-venn
    - natsort
    - num2tex
    - numpy
    - palettable
    - pandas
    - patsy
    - pycomplexheatmap >=1.8.4,<1.9
    - scanpy
    - scikit-learn
    - scipy
    - seaborn >=0.13.2,<0.14
    - statannotations >=0.7.2,<0.8
    - statsmodels
    - upsetplot

test:
  imports:
    - cnsplots
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/faridrashidi/cnsplots
  summary: A comprehensive plotting library for bioinformatics and data visualization
  doc_url: https://cnsplots.farid.one
  license: BSD-3-Clause
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - Matt-BF

