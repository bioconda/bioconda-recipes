package:
  name: embassy-phylip
  version: "3.69.660"

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("embassy-phylip", max_pin="x") }}

source:
  url: ftp://emboss.open-bio.org/pub/EMBOSS/PHYLIPNEW-3.69.660.tar.gz
  sha256: af385d01826e67e05295955f05721728abbd4feb9e11a944189414da6590bfeb

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - zlib
    - emboss ==6.6.0
  run:
    - emboss ==6.6.0

about:
  home: http://emboss.open-bio.org/
  license: Other
  license_file: COPYING
  summary: embassy/emboss wrappers for phylip functions

test:
  commands:
    # test a few tools
    -  fneighbor --help
    -  ffactor --help
    -  fmix --help
