package:
  name: embassy-phylip
  version: "3.69.650"

build:
  number: 4

source:
  url: ftp://emboss.open-bio.org/pub/EMBOSS/old/6.5.0/PHYLIPNEW-3.69.650.tar.gz
  md5: 488d117d32a391a9b53c60260595e67b

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - zlib
    - emboss==6.5.0
  run:
    - zlib
    - emboss

about:
  home: http://emboss.open-bio.org/
  license: file
  license_file: COPYING
  summary: embassy/emboss wrappers for phylip functions

test:
  commands:
    # test a few tools
    -  fneighbor --help
    -  ffactor --help
    -  fmix --help
