{% set version = "0.1.1" %}

package:
  name: pairwise-alignments-to-msa
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pairwise-alignments-to-msa/pairwise_alignments_to_msa-{{ version }}.tar.gz
  sha256: aa8c6a4434b1b8302bff2f72b2d974ee1c87b22d164e15ef385b00fc2fe72208

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage('pairwise-alignments-to-msa', max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - poetry-core
    - pip
  run:
    - python >=3.9

test:
  imports:
    - pairwise_alignments_to_msa
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/Cassiebastress/tuplealign
  summary: A tool to convert tuple sequence alignments to multi-sequence alignments.
  doc_url: https://github.com/Cassiebastress/tuplealign
 # readme
  license: SNIA
 # readme
  license_file: LICENSE  # readme

extra:
  recipe-maintainers:
    - ramez17khaled
