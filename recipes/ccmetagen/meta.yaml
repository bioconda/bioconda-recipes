{% set name = "ccmetagen" %}
{% set version = "1.5.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://github.com/vrmarcelino/CCMetagen/archive/v{{ version }}.tar.gz"
  sha256: "e8cc42c291811dfa727e82f381220f4c1aed34b10ed547794bf9c4615b6638be"

build:
  noarch: python
  number: 0
  script: "python -m pip install --no-deps --ignore-installed . "
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - pip
    - python
  run:
    - python >=3.9,<3.12
    - ete3
    - pandas
    - kma >=1.3
    - krona

test:
  commands:
    - CCMetagen.py --help


about:
  home: "https://github.com/vrmarcelino/CCMetagen"
  license: "GPL3"
  license_family: "GPL3"
  license_file: "LICENSE"
  summary: "CCMetagen: comprehensive and accurate identification of eukaryotes and prokaryotes in metagenomic data."

extra:
  recipe-maintainers:
    - vrmarcelino
    - vinisalazar
