{% set version = "0.1.9.5" %}

package:
  name: mnnpy
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/m/mnnpy/mnnpy-{{ version }}.tar.gz
  sha256: 41cdafaf21392144b683d7acf99f7a1fc59085f9b3697cd6ace57f40dddace9c
  patches:
    - 0001-Fix-missing-forceobj-for-numba.jit.patch
    - 0002-Use-workers-for-scipy-cKDTree.patch
    - 0003-Replace-deprecated-numpy-float.patch

build:
  number: 10
  skip: True  # [py < 311 or py >= 314]
  run_exports:
    - {{ pin_subpackage("mnnpy", max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  host:
    - cython
    - pip
    - python
    - setuptools
    - wheel
  run:
    # mnnpy still calls AnnData.concatenate, removed in AnnData 0.13.
    - anndata >=0.9.2,<0.13
    - numba
    - numpy >=1.23.5,<2.3
    - pandas
    - python >=3.11,<3.14
    # SciPy 1.15 changed the randomized interpolative SVD outputs.
    - scipy >=1.9.3,<1.15

test:
  imports:
    - mnnpy
    - mnnpy._utils

about:
  home: http://github.com/chriscainx/mnnpy
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: Mutual nearest neighbors correction in python.

extra:
  recipe-maintainers:
    - pinin4fjords
