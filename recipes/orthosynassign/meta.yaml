{% set name = "orthosynassign" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/stajichlab/orthoSynAssign/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: db80d5a0fa13221230c323744798996f87d64e6ed0266c23091fd52671b3282a

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  skip: true  # [py != python_min.replace(".", "")|int]
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - pip
    - python {{ python_min }}
    - python-abi3
    - maturin >=1.0,<2.0
  run:
    - pygenomeviz >=1.6.0
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check
    - orthosynassign --help
    - orthosynassign-vis --help

about:
  home: https://github.com/stajichlab/orthoSynAssign
  dev_url: https://github.com/stajichlab/orthoSynAssign
  doc_url: https://orthosynassign.readthedocs.io/
  license: GPL-3.0-or-later
  license_family: GPL
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Ortholog Synteny Assignment Tool for analyzing OrthoFinder results with genome annotations
  description: |
    orthoSynAssign (Ortholog Synteny Assignment Tool) is a Python tool to partition orthogroups into syntenic orthogroups (SOGs)
    of positional orthologs using synteny information inferred from genome annotation files (BED converted from GFF3/GTF). It is a
    Python re-implementation of OrthoRefine, addressing sample-matching and memory-usage issues in the original C++ tool, with
    core synteny analysis implemented in Rust for speed and efficiency.

extra:
  recipe-maintainers:
    - chtsai0105
  identifiers:
    - doi:10.5281/zenodo.18762979
    - doi:10.64898/2026.08.10.744007
