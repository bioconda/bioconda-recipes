schema_version: 1

context:
  version: "0.2.0"

package:
  name: adex
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/adex/adex-${{ version }}.tar.gz
  sha256: 8e19aa3d01bb0c55ba5ee6180867757376a1d05a8b3380ebdaacb2b86b8109ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - adex-preprocess = preprocess:main
      - adex-app = app:main
      - adex-init = src.init:main

requirements:
  host:
    - python >=3.13
    - setuptools >=80
    - pip
  run:
    - python >=3.13
    - dash ==3.1.0
    - dash-ag-grid >=35.3.0
    - dash-bootstrap-components ==2.0.4
    - dash-iconify ==0.1.2
    - jsonschema >=4.26.0
    - mygene ==3.2.2
    - numpy >=2.0.0
    - polars >=2.1.0
    - gseapy >=1.3.2
    - lxml >=6.1.3
    - tqdm >=4.70.1

tests:
  - python:
      imports:
        - app
        - assets
        - callbacks
        - components
        - config
        - preprocess
        - src
        - ui
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - adex-preprocess --help
      - adex-app --help
      - adex-init --help

about:
  summary: Allen Differential results EXplorer
  license: Allen Institute Software License
  license_file: LICENSE
  homepage: https://pypi.org/project/ADEX/

extra:
  recipe-maintainers:
    - gartician
