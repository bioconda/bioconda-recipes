{% set version = "0.1.7" %}

package:
  name: phageboost
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/P/PhageBoost/PhageBoost-{{ version }}.tar.gz
  sha256: 74ebd365e05b71cce30ad0dbda5897330aaa71885ba63b2970c01e36ac2c0e32

build:
  entry_points:
    - PhageBoost = PhageBoost.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage('phageboost', max_pin="x") }}

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - biopython
    - joblib
    - more-itertools
    - numpy
    - pandas
    - pickleshare
    - pyrodigal
    - scipy
    - pytables
    - xgboost
    - cachier
    - tabulate

test:
  imports:
    - PhageBoost
  commands:
    - pip check
    - PhageBoost --help
  requires:
    - pip
    - python

about:
  home: https://github.com/ku-cbd/PhageBoost
  summary: a Fast Prophage and Phage Predictor
  license: GPL-3.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - devanathan
