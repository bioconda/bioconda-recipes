{% set name = "pymzqc" %}
{% set version = "1.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pymzqc/pymzqc-{{ version }}.tar.gz
  sha256: 93987476d3151f21be724f5f9d1b5d21fe5deff62247df1b350e3ca5e0926e9e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv

requirements:
  host:
    - python >=3.8
    - pip
    - hatchling
  run:
    - python >=3.8
    - jsonschema >=3.2.0
    - strict-rfc3339
    - rfc3339-validator
    - numpy
    - pandas >=1.1.5
    - pronto
    - requests >=2.27.1
    - click

test:
  imports:
    - mzqc
    - mzqcaccessories
  commands:
    - mzqc-fileinfo --help
    - mzqc-filemerger --help
    - mzqc-fixdescriptions --help
    - mzqc-validator --help

about:
  home: https://github.com/MS-Quality-Hub/pymzqc
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Python library for the PSI-mzQC quality control file format."
  doc_url: https://pymzqc.readthedocs.io
  dev_url: https://github.com/MS-Quality-Hub/pymzqc

extra:
  identifiers:
    - biotools:pymzqc
  recipe-maintainers:
    - singjc
