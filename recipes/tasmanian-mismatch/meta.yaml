{% set name = "tasmanian-mismatch" %}
{% set version = "2.0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/nebiolabs/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 31f2a3c662af4bcf6b726c1f74e795e4784a7e68bb96b91bdf0e6988f38da328

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('tasmanian-mismatch', max_pin='x') }}
  script: |
    set -euxo pipefail

    export CARGO_PROFILE_RELEASE_LTO=false
    export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$BUILD_PREFIX/lib/pkgconfig:$BUILD_PREFIX/share/pkgconfig"

    TARGET="${TARGET:-${HOST:-}}"
    if [[ -z "$TARGET" ]]; then
      echo "ERROR: TARGET/HOST not set"
      exit 1
    fi
    target_env="${TARGET//-./_}"

    # Only set toolchain vars if they exist (avoid exporting empty strings)
    if [[ -n "${CC:-}" ]]; then
      export "CC_${target_env}=${CC}"
    fi
    if [[ -n "${CXX:-}" ]]; then
      export "CXX_${target_env}=${CXX}"
    fi
    if [[ -n "${AR:-}" ]]; then
      export "AR_${target_env}=${AR}"
    fi
    if [[ -n "${RANLIB:-}" ]]; then
      export "RANLIB_${target_env}=${RANLIB}"
    fi

    if [[ -n "${CFLAGS:-}" ]]; then
      export "CFLAGS_${target_env}=${CFLAGS}"
    fi
    if [[ -n "${CXXFLAGS:-}" ]]; then
      export "CXXFLAGS_${target_env}=${CXXFLAGS}"
    fi
    if [[ -n "${LDFLAGS:-}" ]]; then
      export "LDFLAGS_${target_env}=${LDFLAGS}"
    fi

    cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    cargo build --release --locked -vv 2>&1 | tee build.log
    
    echo "=== DEBUG ==="
    ls -R target || true

    CARGO_TARGET_DIR=$(find target -maxdepth 2 -type d -name release | head -n1)

    echo "Using cargo target dir: $CARGO_TARGET_DIR"
    
    for bin in tasmanian-mismatch tasmanian-diagnostics tasmanian-rescale-quality; do
      if [[ -f "$CARGO_TARGET_DIR/$bin" ]]; then
        patchelf --set-rpath "$PREFIX/lib" "$CARGO_TARGET_DIR/$bin"
        install -Dm755 "$CARGO_TARGET_DIR/$bin" "$PREFIX/bin/$bin"
      else
        echo "ERROR: missing binary $bin in $CARGO_TARGET_DIR"
        exit 1
      fi
    done

requirements:
  host:
    - htslib
    - clangdev  # for bindgen
    - llvmdev
    - cmake
    - zlib

  build:
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pkg-config
    - clangdev
    - make
    - cmake

  run:
    - python >=3.10
    - bokeh >=3,<4
    - polars >=0.20,<2
    - pandas

test:
  commands:
    - tasmanian-mismatch --help
    - tasmanian-diagnostics --help
    - tasmanian-rescale-quality --help

about:
  home: "https://github.com/nebiolabs/tasmanian-mismatch"
  license: "LGPL-2.1-or-later"
  license_family: LGPL
  license_file:
    - LICENCE.txt
    - THIRDPARTY.yml
  summary: "Tasmanian tool to analyze mismatches in sequencing data (Rust + Python hybrid)."
  description: |
    Version 2.x is a Rust-based rewrite of tasmanian-mismatch.
    Some functionality relies on Python components, which are installed
    via Conda (pixi is not used in this environment).

    The original Python-only implementation is available in 1.x releases.
  dev_url: "https://github.com/nebiolabs/tasmanian-mismatch"

extra:
  recipe-maintainers:
    - aerijman
  skip-lints:
    - should_be_noarch_generic
