{% set name = "tasmanian-mismatch" %}
{% set version = "2.0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/nebiolabs/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 31f2a3c662af4bcf6b726c1f74e795e4784a7e68bb96b91bdf0e6988f38da328

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
  run_exports:
    - {{ pin_subpackage('tasmanian-mismatch', max_pin="x") }}

requirements:
  host:
    - python <3.13
    - pip
  run:
    - python <3.13
    - numpy
    - pandas
    - scipy
    - plotly
    - matplotlib-base
    - scikit-learn
    - seaborn-base
    - statsmodels
    - termcolor

test:
  imports:
    - tasmanian
    - tasmanian.utils

about:
  home: "https://github.com/nebiolabs/tasmanian-mismatch"
  license: "LGPL-2.1-or-later"
  license_family: LGPL
  summary: "Tasmanian tool to analyze mismatches at read and position in high throughput sequencing data."
  dev_url: "https://github.com/nebiolabs/tasmanian-mismatch"

extra:
  recipe-maintainers:
    - aerijman
