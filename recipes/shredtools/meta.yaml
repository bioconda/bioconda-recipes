{% set name = "shredtools" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/vikshiv/shredtools/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 8f804b78596747ca6c7ba59a0dbb92c3bbb96a9734bc4143f3b2c875f741a036

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61
  run:
    - python >=3.9
    - mumemto >=1.4.0
    - numpy
    - pysam
    - tqdm
    - matplotlib-base

test:
  imports:
    - shredtools
  commands:
    - shredtools --version
    - shredtools -h
    - shredtools index -h
    - shredtools extract -h

about:
  home: https://github.com/vikshiv/shredtools
  summary: Utilities for manipulating the pangenome coordinate system with multi-MUMs
  description: |
    Shredtools is a toolkit for querying a pangenome using multi-MUMs computed by Mumemto.
    It builds indexes on .bumbl files and enables extracting syntenic regions, shreds,
    and refining alignments.
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  dev_url: https://github.com/vikshiv/shredtools
  doc_url: https://github.com/vikshiv/shredtools

extra:
  recipe-maintainers:
    - vikshiv
