{% set name = "orfedit" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ARU-life-sciences/orfedit/archive/refs/tags/{{ version }}.tar.gz
  sha256: 9d6dc35b320b6ebdaa1d06b64f15c34b4947b706b29c0a9d412d9b1422e2d55f

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - orfedit --help

about:
  home: https://github.com/ARU-life-sciences/orfedit
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: RNA-editing-aware ORF finding in plant organellar genomes
  dev_url: https://github.com/ARU-life-sciences/orfedit

extra:
  recipe-maintainers:
    - Euphrasiologist
  additional-platforms:
    - linux-aarch64
    - osx-arm64
