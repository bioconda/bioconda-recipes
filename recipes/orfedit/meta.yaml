{% set name = "orfedit" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ARU-life-sciences/orfedit/archive/refs/tags/{{ version }}.tar.gz
  sha256: 5965ac617ce09caeb973c6293e2667b4cc4f7f0fe915b32327ad1be97dae2972

build:
  number: 1
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - orfedit --help

about:
  home: https://github.com/ARU-life-sciences/orfedit
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: RNA-editing-aware ORF finding in plant organellar genomes
  dev_url: https://github.com/ARU-life-sciences/orfedit

extra:
  recipe-maintainers:
    - Euphrasiologist
  additional-platforms:
    - linux-aarch64
    - osx-arm64
