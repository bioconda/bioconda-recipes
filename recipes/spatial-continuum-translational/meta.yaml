{% set name = "spatial-continuum-translational" %}
{% set version = "0.1.53" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: "https://github.com/Lukecele/spatial-continuum-translational/archive/refs/tags/v{{ version }}.tar.gz"
  sha256: 3d22bdd40f9ed6fd079a1b1bd2d7bd9c597f1b44f57a56210c69ac22b5cc4dba

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage("spatial-continuum-translational", max_pin="x.x") }}
  entry_points:
    - spatial-continuum-gist = spatial_continuum_translational.cli:main
  script: "{{ PYTHON }} -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv"

requirements:
  host:
    - python >=3.10
    - setuptools >=61
    - pip
  run:
    - python >=3.10
    - spatial-continuum ==1.0.3

test:
  imports:
    - spatial_continuum_translational
  commands:
    - spatial-continuum-gist --help

about:
  home: https://github.com/Lukecele/spatial-continuum-translational
  dev_url: https://github.com/Lukecele/spatial-continuum-translational
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Reproducible research-only GIST phenotype profile CLI."
  description: "A deterministic Python and command-line research profile for explicit GIST features, supporting validated TSV, CSV, and JSON cohort inputs. It is not a clinical predictor or treatment recommendation."

extra:
  recipe-maintainers:
    - Lukecele
  identifiers:
    - doi:10.21203/rs.3.rs-11633521/v1
    - doi:10.5281/zenodo.23963563
