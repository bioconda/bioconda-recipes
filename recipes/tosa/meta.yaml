{% set version = "1.0.0" %}

package:
  name: tosa
  version: {{ version }}

source:
  url: https://github.com/Sika-Zheng-Lab/Tosa/archive/refs/tags/v{{ version }}.tar.gz
  sha256: b632347046a749a7af3fafdb9fb659a78eb351653f79e2b0156262102bc72526

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('tosa', max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - pkg-config
    - clangdev
    - cmake
    - make
  host:
    - libclang
    - openssl
    - libcurl
    - zlib
    - bzip2
    - xz

test:
  commands:
    - tosa --version
    - tosa --help

about:
  home: https://github.com/Sika-Zheng-Lab/Tosa
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Fast junction and exon-intron boundary read counting from RNA-seq and scRNA-seq
  dev_url: https://github.com/Sika-Zheng-Lab/Tosa
  doc_url: https://github.com/Sika-Zheng-Lab/Tosa/blob/main/README.md

extra:
  recipe-maintainers:
    - NaotoKubota
