{% set name = "muat" %}
{% set version = "0.1.27" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/primasanjaya/muat/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 12d10b6e21316c72703f6b07154b99a97185baa3fd19b9293eade33631f5d167

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - numpy
    - pandas
    - requests
    - importlib_resources  # [py<39]
    - bedtools
    - htslib
    - natsort
    - boto3
    - openpyxl
    - scikit-learn
    - pytorch
    - pyliftover
    - bcftools
    - tqdm
    - bedops
    - swalign

test:
  imports:
    - muat

about:
  home: https://github.com/primasanjaya/muat
  license: Apache-2.0
  license_file: LICENSE
  summary: A package for Mutation Attention Tool

extra:
  recipe-maintainers:
    - primasanjaya
