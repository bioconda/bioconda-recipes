{% set name = "perl-sql-abstract-pg" %}
{% set version = "1.01" %}
{% set sha256 = "c35b9c0c5eff38c74552c99d806f017050ada33ac4adafa3203d1e9cd3c1db90" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/S/SR/SRI/SQL-Abstract-Pg-{{ version }}.tar.gz
  sha256: {{ sha256 }}


build:
  number: 0
  run_exports:
    weak:
      - {{ name }} ={{ version }}
  noarch: generic

requirements:
  host:
    - perl =>5.32
    - perl-sql-abstract
    - perl-test-deep
    - make

  run:
    - perl =>5.32
    - perl-sql-abstract
    - perl-test-deep

test:
  # Perl 'use' tests
  imports:
    - SQL::Abstract::Pg


about:
  home: https://mojolicious.org
  license: Artistic-2.0
  summary: 'PostgreSQL features for SQL::Abstract'

extra:
  recipe-maintainers:
    - khaled196
