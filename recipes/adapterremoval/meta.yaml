{% set version = "3.0.2" %}
{% set sha256 = "905f7c3289f743a90d228226ad6a50aec101343830bfdef5608ec9bb69af0ca7" %}

package:
  name: adapterremoval
  version: {{ version }}

source:
  url: https://github.com/MikkelSchubert/adapterremoval/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - 0001-osx.patch  # [osx]

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('adapterremoval', max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pkg-config
    - cmake
    - meson
    - ninja
  host:
    - isa-l
    - libdeflate
    - zlib
    - bzip2
    - wget
    - sphinx
    - perl
  run:
    - isa-l

test:
  commands:
    - adapterremoval3 -h

about:
  home: "https://github.com/MikkelSchubert/adapterremoval"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "The AdapterRemoval v2 tool for merging and clipping reads."
  dev_url: "https://github.com/MikkelSchubert/adapterremoval"
  doc_url: "https://adapterremoval.readthedocs.io/en/stable"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:adapterremoval
    - usegalaxy-eu:adapter_removal
    - doi:10.1186/s13104-016-1900-2
