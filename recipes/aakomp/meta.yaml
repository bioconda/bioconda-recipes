{% set name = "aakomp" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/BirolLab/{{ name }}/releases/download/{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: e2ff17734fed5058c0e6e169525f5a02295e2ad5082ff3aa97007f862f210a6a

build:
  number: 0
  skip: True  # [win]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - meson
    - ninja
    - pkg-config
    - python >=3.9
    - pigz
  host:
    - mamba
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - gperftools =2.10
    - sdsl-lite
    - libdivsufsort
    - libsequence
    - zlib
    - boost-cpp
    - btllib
    - hmmer
    - r-base >=4.2,<5
    - r-ggplot2
    - r-dplyr
    - r-readr
    - r-cairo
    - r-gridextra
    - r-pracma
  run:
    - python >=3.9
    - mamba
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - gperftools =2.10
    - sdsl-lite
    - libdivsufsort
    - libsequence
    - boost-cpp
    - btllib
    - hmmer
    - r-base >=4.2,<5
    - r-ggplot2
    - r-dplyr
    - r-readr
    - r-cairo
    - r-gridextra
    - r-pracma

test:
  commands:
    - make_mibf --help
    - aakomp --help
    - run-aakomp --help

about:
  home: "https://github.com/bcgsc/aakomp"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "Amino acid k-mer-based genome completeness assessment."
  dev_url: "https://github.com/bcgsc/aakomp"

extra:
  additional-platforms:
    - linux-aarch64
    # sdsl-lite not available on osx-arm64
    #- osx-arm64
  recipe-maintainers:
    - jwcodee
