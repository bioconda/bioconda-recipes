{% set version = "1.2.9" %}

package:
  name: qrstar
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/q/qrstar/qrstar-{{ version }}.tar.gz
  sha256: a5d59ef030833c87b2de63faddc50e1d30ad3ff195733f1bf2797fee211df8a7

build:
  entry_points:
    - qrstar = qrstar.cli:run
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage("qrstar", max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - setuptools >=64
    - wheel
    - pip
  run:
    - python >=3.9
    - dendropy >=4
    - numpy
    - table-five

test:
  imports:
    - qrstar
  commands:
    - pip check
    - qrstar --help
  requires:
    - pip
    - python

about:
  home: https://github.com/ytabatabaee/QR-STAR
  summary: 'QR-STAR: rooting species trees under the multi-species coalescent'
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ytabatabaee
