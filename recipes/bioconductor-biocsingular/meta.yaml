{% set version = "1.28.0" %}
{% set name = "BiocSingular" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: ad586e9236ce6ee15e6ae67dc3180e45

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-biocsingular", max_pin="x.x") }}'

# Suggests: testthat, BiocStyle, knitr, rmarkdown, ResidualMatrix
# SystemRequirements: C++17
requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
  host:
    - bioconductor-assorthead >=1.6.3,<1.7.0
    - bioconductor-beachmat >=2.28.0,<2.29.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-scaledmatrix >=1.20.0,<1.21.0
    - r-base
    - r-irlba
    - r-matrix
    - r-rcpp
    - r-rsvd
    - libblas
    - liblapack
    - zlib
    - liblzma-devel
  run:
    - bioconductor-assorthead >=1.6.3,<1.7.0
    - bioconductor-beachmat >=2.28.0,<2.29.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-scaledmatrix >=1.20.0,<1.21.0
    - r-base
    - r-irlba
    - r-matrix
    - r-rcpp
    - r-rsvd

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: GPL-3
  summary: Singular Value Decomposition for Bioconductor Packages
  description: Implements exact and approximate methods for singular value decomposition and principal components analysis, in a framework that allows them to be easily switched within Bioconductor packages or workflows. Where possible, parallelization is achieved using the BiocParallel framework.
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:biocsingular

