{% set version = "0.10.0" %}

package:
  name: lexicmap
  version: {{ version }}

source:
  url: https://github.com/shenwei356/LexicMap/archive/v{{ version }}.tar.gz
  sha256: 4cb01f13d7ad964a8c0bf864f4d55ffe6f0292f4b99732dba1207deb3706ff33

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('lexicmap', max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('go-nocgo') }}

test:
  commands:
    - lexicmap version

about:
  home: https://github.com/shenwei356/LexicMap
  summary: efficient sequence alignment against millions of prokaryotic genomes
  license: MIT

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - should_be_noarch_generic
    - should_not_be_noarch_source
