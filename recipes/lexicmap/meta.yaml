{% set version = "0.10.1" %}

package:
  name: lexicmap
  version: {{ version }}

source:
  url: https://github.com/shenwei356/LexicMap/archive/v{{ version }}.tar.gz
  sha256: 4245698c69cac3c88f2aecf4013e6626d6c8eab2dd77c7d9f08e22814db44649

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('lexicmap', max_pin='x.x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('go-nocgo') }}

test:
  commands:
    - lexicmap version

about:
  home: https://github.com/shenwei356/LexicMap
  summary: efficient sequence alignment against millions of prokaryotic genomes
  license: MIT

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - should_be_noarch_generic
    - should_not_be_noarch_source
