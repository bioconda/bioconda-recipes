
{% set name = "metguild" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/faithoni/MetGuild_workflow/archive/refs/tags/v0.1.0-rc.1.tar.gz
  sha256: ee92f0e1ec03aa098c89b024ade613fb7799470652debe08be4c9e4043dac717

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}


requirements:
  run:
    - bash
    - python >=3.10,<3.14
    - numpy >=1.24,<3
    - pandas >=2,<4
    - scipy >=1.10,<2
    - scikit-learn >=1.2,<2
    - matplotlib-base >=3.7,<4
    - plotly >=5.18,<7

test:
  commands:
    - metguild --help
    - python -c "import numpy, pandas, scipy, sklearn, matplotlib, plotly"

about:
  home: https://github.com/faithoni/MetGuild_workflow
  summary: "Genome-resolved workflow for identifying metabolic potential guilds"
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - faithoni

