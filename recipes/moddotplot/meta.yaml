{% set version = "1.0.1" %}

package:
  name: moddotplot
  version: {{ version }}

source:
  url: https://github.com/marbl/ModDotPlot/archive/v{{ version }}.tar.gz
  sha256: c09d7e30c4eff7403e8b468af5aa5d4fb12ce01ab3f7788b8b318be94f698391

build:
  number: 0
  entry_points:
    - moddotplot = moddotplot.__main__:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('moddotplot', max_pin="x.x") }}

requirements:
  host:
    - python >=3.7
    - setuptools >=61.0
    - pip
  run:
    - python >=3.7
    - pysam
    - pandas
    - plotly
    - dash
    - plotnine ==0.12.4
    - palettable
    - mmh3
    - setproctitle
    - numpy
    - pillow
    - patchworklib ==0.6.3
    - cairosvg
    - pygenometracks
    - svgutils
    - cooler
    - seaborn-base

test:
  imports:
    - moddotplot
  commands:
    - moddotplot --help

about:
  home: "https://github.com/marbl/ModDotPlot"
  summary: "ModDotPlot is a dot plot visualization tool designed to be used at scale, both for smaller sequences and whole genomes."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/marbl/ModDotPlot"
  doc_url: "https://github.com/marbl/ModDotPlot/blob/v{{ version }}/README.md"

extra:
  identifiers:
    - doi:10.1093/bioinformatics/btae493
