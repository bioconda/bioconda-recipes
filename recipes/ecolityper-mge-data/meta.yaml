{% set name = "ecolityper-mge-data" %}
{% set version = "1.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/bbeckley-hub/EcoliTyper/releases/download/v{{ version }}/{{ name }}-v{{ version }}.zip
  sha256: 2e3c455debc109093d2275522deedf09d936086e66a361da00f173651ff2ca53

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

test:
  commands:
    - test -d $PREFIX/share/ecolityper/modules/mge_module/mobileOG-db/beatrix-1-6_v1_all
    - test -f $PREFIX/share/ecolityper/modules/mge_module/mobileOG-db/beatrix-1-6_v1_all/mobileOG-db-beatrix-1.6.dmnd

about:
  home: https://github.com/bbeckley-hub/EcoliTyper
  license: MIT
  license_file: LICENSE
  summary: 'mobileOG-db database for the EcoliTyper MGE profiling module'
  description: |
    Pre-built mobileOG-db payload used by the EcoliTyper mobile genetic
    element profiling module. Contains the DIAMOND database, protein
    FASTA, and metadata files required for per-genome MGE signature
    detection.
  doc_url: https://github.com/bbeckley-hub/EcoliTyper
  dev_url: https://github.com/bbeckley-hub/EcoliTyper

extra:
  recipe-maintainers:
    - bbeckley-hub
