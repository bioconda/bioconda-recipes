{% set name = "proteomes2structs" %}
{% set version = "0.2.2a1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/CielResearch/Proteomes2Structs/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5868f8976e7fd7e17541586faae7ef02d30fc6cb65c2dba6d7dd037a7fbe8fdd

build:
  number: 0

requirements:
  run:
    - bash
    - curl

test:
  commands:
    - proteomes2structs --version

about:
  home: https://github.com/CielResearch/Proteomes2Structs
  license: CC-BY-NC-4.0
  summary: "Download AlphaFold DB structural data for UniProt proteomes."
  description: "Given UniProt proteome accession IDs, Proteomes2Structs downloads structural data from AlphaFold DB for each protein in each proteome."
  dev_url: https://github.com/CielResearch/Proteomes2Structs
