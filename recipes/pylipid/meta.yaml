{% set name = "PyLipID" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/pylipid-{{ version }}.tar.gz
  sha256: bab3d306345fef9ff40c03637ad70322cf6733ff4685555d8ae42fc8c7fc65fe

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage('pylipid', max_pin="x.x") }}


requirements:
  host:
    - python >=3.6,<4.0
    - pip
    - setuptools  
  run:
    - python >=3.6,<4.0
    - mdtraj
    - numpy >=1.20
    - pandas
    - matplotlib-base >=3.3.3
    - networkx
    - scipy
    - python-louvain
    - logomaker
    - statsmodels
    - scikit-learn
    - p-tqdm
    - kneebow
    - netcdf4

test:
  imports:
    - pylipid
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/wlsong/PyLipID
  summary: PyLipID - A Python Library For Lipid Interaction Analysis
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - jaidevjoshi83
    
