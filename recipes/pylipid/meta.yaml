package:
  name: pylipid
  version: 1.5.14

source:
  url: https://pypi.io/packages/source/p/pylipid/pylipid-1.5.14.tar.gz
  sha256: ba1a0506c7922d9e03d8ee1ca26dc181976d94bec76073842c565d1a1c1ce660

build:
  number: 0
  noarch: python
  script: $PYTHON -m pip install --no-deps --ignore-installed .

requirements:
  build:
    - python
    - pip
    - setuptools
  host:
    - python 
    - pip
    - setuptools
  run:
    - python 
    - mdtraj
    - numpy
    - pandas
    - matplotlib >=3.3.3
    - networkx
    - scipy
    - python-louvain
    - logomaker
    - statsmodels
    - scikit-learn
    - tqdm
    - p-tqdm
    - kneebow

test:
  imports:
    - pylipid

about:
  home: https://github.com/wlsong/PyLipID
  license: BSD-3-Clause
  license_family: BSD
  summary: PyLipID - A Python Library For Lipid Interaction Analysis
  description: |
    PyLipID is a Python library for analyzing lipid-protein interactions 
    from molecular dynamics simulations. It provides tools for trajectory 
    analysis, lipid interaction detection, and visualization.
  doc_url: https://github.com/wlsong/PyLipID
  dev_url: https://github.com/wlsong/PyLipID

extra:
  recipe-maintainers:
    - jaidevjoshi83