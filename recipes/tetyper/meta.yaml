{% set name = "TETyper" %}
{% set version = "1.2" %}
{% set sha256 = "b3432af27f09aa643c11d932481164124711a59b52249b3332b4943ac44567ff" %}

package:
    name: {{ name|lower }}
    version: {{ version }}
source:
  url: https://github.com/aesheppard/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: generic
  script: "mkdir -p $PREFIX/bin && cp TETyper.py $PREFIX/bin"
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}
  
requirements:
  run:
    - python
    - biopython
    - pysam
    - pyvcf
    - samtools
    - bcftools
    - bwa
    - spades
    - blast

test:
    commands:
        - TETyper.py -h

about:
    home: https://github.com/aesheppard/TETyper
    license: GPL-3.0
    license_file: LICENSE
    summary: Typing of a specific transposable element (TE) of interest from paired-end sequencing data.

extra:
  identifiers:
    - doi:10.1099/mgen.0.000232
