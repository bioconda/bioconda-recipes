{% set name = "arachne" %}
{% set version = "0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/pdimens/arachne/releases/download/{{ version }}/arachne.{{ version }}.tar.gz 
  sha256: 9d0a0a58495144853efe9e7c119b7d1476a04d40464cf7e633cb0b55df27ce53

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('arachne', max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('go') }}
    - autoconf
    - automake
    - go-licenses
    - libzlib
    - make
  run:
    - samtools >=1.23

test:
  commands:
    - arachne --version

about:
  home: "https://github.com/pdimens/arachne"
  summary: "Linked-Read Alignment Tool and successor to Lariat"
  description: |
    Arachne is a fork intended to be a revival and continuation of Lariat, the linked-read aware aligner created by 10X Genomics and
    bundled in their LongRanger pipeline. Arachne does not directly support any specific linked-read FASTQ format. Instead, it expects
    the 'standard' linked-read data format, which is a consistent future-proof format following the internationally recognized FASTQ
    and SAM specifications. The package provides a lossless converter that accepts haplotagging, stLFR, and TELLseq FASTQ data to
    faciliate these conversions.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/pdimens/arachne"
  doc_url: "https://pdimens.github.io/arachne/"

extra:
  recipe-maintainers:
    - pdimens