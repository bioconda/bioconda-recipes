{% set name = "mtsv-tools" %}
{% set version = "2.2.0" %}
{% set sha256 = "29130e9b78d899a0f4bcbce68ee978a44720250d27fe899d1ac650b45a78e16f" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/FofanovLab/mtsv_tools/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - pkg-config

test:
  commands:
    - mtsv-build --version

about:
  home: "https://github.com/FofanovLab/mtsv_tools"
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  license_family: MIT
  summary: "mtsv_tools contains core tools for alignment-based metagenomic/metatranscriptomic assignment."
  dev_url: "https://github.com/FofanovLab/mtsv_tools"
  doc_url: "https://github.com/FofanovLab/mtsv_tools/blob/{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
