{% set python_min = "3.11" %}
{% set name = "t2pmhc" %}
{% set version = "1.1.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bb4e15f9f0c4e25d9b0fbdf5c53738d78fb7239360199d1212c6eca7e081813a

build:
  entry_points:
    - t2pmhc = t2pmhc.__main__:run_t2pmhc
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >={{ python_min }}
    - biopython >=1.85
    - joblib >=1.4
    - numpy >=1.26,<3
    - pandas >=2.1
    - rich >=13
    - rich-click >=1.9
    - scikit-learn >=1.6,<1.8
    - pytorch >=2.6
    - pytorch_geometric >=2.6

test:
  imports:
    - t2pmhc
  commands:
    - pip check
    - t2pmhc --help
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/qbic-pipelines/t2pmhc
  summary: A structure-informed graph neural network for predicting TCR-pMHC binding
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/qbic-pipelines/t2pmhc
  doc_url: https://github.com/qbic-pipelines/t2pmhc/blob/main/README.md

extra:
  recipe-maintainers:
    - jonasscheid
  identifiers:
    - doi:10.64898/2026.02.27.708137
