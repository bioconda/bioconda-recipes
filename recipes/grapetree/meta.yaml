{% set name = "grapetree" %}
{% set version = "3.0.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 8d73dcde3a8bd5152065c428a89ca380b7a7d3affeff8dc4310fcfa8bf50733a

build:
  number: 0
  noarch: python
  entry_points:
    - grapetree = grapetree.grapetree:main
  script: "{{ PYTHON }} -m pip install . -vv --ignore-installed --no-deps"

requirements:
  host:
    - pip
    - python
  run:
    - ete3
    - flask
    - networkx
    - numba
    - numpy
    - psutil
    - pandas
    - requests
    - python
    - unidecode
 
test:
  imports:
    - grapetree
  commands:
    - grapetree --help

about:
  home: "https://github.com/achtman-lab/GrapeTree"
  license: "GNU General Public v3 (GPLv3)"
  license_family: GPL3
  license_file: LICENSE 
  summary: "Web interface of GrapeTree, which is a program for phylogenetic analysis."

extra:
  recipe-maintainers:
    - simonhtausch
