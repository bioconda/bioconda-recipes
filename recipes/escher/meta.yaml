{% set name = "escher" %}
{% set version = "1.8.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://files.pythonhosted.org/packages/3e/a1/ee2db46df35c6e35c78d5931bac2da65d4bc84380bbc18f264597bb2d6cf/escher-{{ version }}.tar.gz"
  sha256: cdbcee71b2687212dca06d96bfeab7e3a8b2bb7b5f3d341f5a725d7ce55ba711

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv --ignore-installed --no-deps"
  run_exports:
    - {{ pin_subpackage('escher', max_pin='x') }}

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - cobra >=0.5.0
    - ipywidgets >=7.7.0,<8
    - jinja2 >=3.0.3,<4
    - jsonschema >=4.17.3,<5
    - pandas >=0.18
    - pytest
    - python >=3.6

test:
  imports:
    - escher

about:
  home: "https://escher.github.io"
  license: MIT
  license_family: MIT
  summary: "Escher: A Web Application for Building, Sharing, and Embedding Data-Rich Visualizations of Metabolic Pathways"

extra:
  recipe-maintainers:
    - chapmanb
