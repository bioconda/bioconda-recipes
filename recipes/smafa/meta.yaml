{% set version = "0.9.0" %}
{% set name = "smafa" %}
{% set sha256 = "dd0e889b508f7a018b515342f6f5661558b06143b721cdfc4fd8352b6c7045ae" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/wwood/{{ name }}/archive/v{{version}}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses

test:
  commands:
    - smafa --version | grep {{ version }}

about:
  home: "https://github.com/wwood/smafa"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: "LICENCE.txt"
  summary: "smafa is a tool for querying and clustering pre-aligned small pre-aligned sequences."
  dev_url: "https://github.com/wwood/smafa"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
