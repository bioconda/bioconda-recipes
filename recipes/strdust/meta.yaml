{% set name = "strdust" %}
{% set version = "1.1.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/wdecoster/STRdust/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1b9e35e4da610c9b65196dba73bfda990036ffb51847ce9e2fcfb0a8934369f5

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    # rust 1.99 on osx loads the build env's libLLVM 19 (from the clang 19 toolchain) and
    # aborts with 'LLVM version mismatch: this compiler was built for LLVM 23'
    - rust <1.99  # [osx]
    - clangdev
    - make
    - cmake
    - autoconf
    - automake
    - libtool
    - pkg-config
    - cargo-bundle-licenses
  host:
    - zlib
    - htslib

test:
  commands:
    - STRdust --help

about:
  home: "https://github.com/wdecoster/STRdust"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Tandem repeat genotyper for long reads."
  dev_url: "https://github.com/wdecoster/STRdust"
  doc_url: "https://github.com/wdecoster/STRdust/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - osx-arm64
    - linux-aarch64
  identifiers:
    - doi:10.1101/gr.279265.124
  skip-lints:
    - compiler_needs_stdlib_c
