{% set name = "genomicranges" %}
{% set version = "0.8.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a493956ec5a72b1a63f6b3e2f56a64a7b6938fa06fd0119fffe4bcb75e86c3eb

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python
    - setuptools >=46.1.0
    - setuptools-scm >=5
    - pip
  run:
    - python
    - numpy
    - biocutils >=0.3.3
    - biocframe >=0.7.1
    - iranges >=0.7.2
    - compressed-lists >=0.4.3

test:
  imports:
    - genomicranges
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/BiocPy/GenomicRanges
  summary: Container class to represent and operate over genomic regions and annotations.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
