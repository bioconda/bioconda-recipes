{% set name = "haplodon" %}
{% set version = "0.20.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/fxwiegand/haplodon/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 541f46e7f415b3378fbd6196b5a517d6b2757423783435fda9b409a16c50e803

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - pkg-config
    - make
    - cmake
    - clangdev <22  # [linux]
    - libclang {{ c_compiler_version }}.*  # [osx]
  host:
    - gsl
    - libcblas
    - libcurl
    - openssl  # [not osx]

test:
  commands:
    - haplodon --help

about:
  home: "https://github.com/fxwiegand/haplodon"
  license: MIT
  license_family: MIT
  summary: "Haplodon is a command-line tool designed for uncertainty-aware haplotype-based genomic variant effect prediction."
  dev_url: "https://github.com/fxwiegand/haplodon"
  doc_url: "https://github.com/fxwiegand/haplodon/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - fxwiegand
    - felixmoelder
    - johanneskoester
  skip-lints:
    - compiler_needs_stdlib_c
