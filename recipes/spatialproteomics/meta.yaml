{% set version = "0.9.0" %}

package:
  name: spatialproteomics
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/spatialproteomics/spatialproteomics-{{ version }}.tar.gz
  sha256: 23ce39e039dfef7fc90b611721bd3a9990938fe56d18c58ccb6252391e4dcc83

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage('spatialproteomics', max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - hatchling >=1.26
    - pip
  run:
    - python >=3.11
    - cffi >=1.15.0
    - xarray >=2025.6.0
    - scikit-image >=0.25
    - matplotlib-base >=3.8.0
    - tqdm >=4.64.0
    - scikit-learn >=1.4.2
    - zarr >=3.0.0
    - numpy >=1.25
    - opencv >=4.11.0
    - pandas >=2.2.2
    - pyyaml >=6.0

test:
  imports:
    - spatialproteomics
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/spatialproteomics/
  dev_url: https://github.com/sagar87/spatialproteomics/
  summary: Spatialproteomics is an interoperable toolbox for analyzing highly multiplexed fluorescence image data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MeyerBender
    - vsuppiyar
