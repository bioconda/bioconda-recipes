{% set version = "2.3.0" %}

package:
  name: mmaseq
  version: {{ version }}

source:
  url: https://github.com/ssi-dk/MMASeq/archive/v{{ version }}.tar.gz
  sha256: 1715cfdf80c670a3a6c8d3195f7cdb6bfadafdf78cd4abc7992b6615766aa03b

build:
  entry_points:
    - mmadeploy = mmaseq.deploy:launcher
    - mmacreate = mmaseq.create:launcher
    - mmaseq = mmaseq.mmaseq:launcher
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage('mmaseq', max_pin="x") }}

requirements:
  host:
    - python >=3.13
    - hatchling >=1.25
    - pip
  run:
    - python >=3.13
    - packaging >=26.1
    - ruamel.yaml <0.19
    - snakemake
    - pandas
    - conda  # required: pipeline uses snakemake --use-conda internally


test:
  imports:
    - mmaseq
  commands:
    - mmadeploy --help
    - mmacreate --help
    - mmaseq --help

about:
  home: "https://github.com/ssi-dk/MMASeq"
  summary: "Mixed Microbial Analysis on Sequencing data."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: "https://github.com/ssi-dk/MMASeq"

extra:
  recipe-maintainers:
    - SimoneScrima
