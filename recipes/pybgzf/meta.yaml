{% set name = "pybgzf" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c5c811bce3fe8f4106435c5571ebfa007c736eda937f19ed1f4bc409db286601

build:
  number: 0
  skip: True  # [py < 311]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.15,<2
    - pip
  run:
    - python
    - typing-extensions >=4.12

test:
  imports:
    - pybgzf
  commands:
    - pip check
  requires:
    - pip

about:
  home: "https://github.com/clintval/{{ name }}"
  summary: "Streaming BGZF compression with on-the-fly tabix and CSI indexing."
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - NOTICE
    - THIRDPARTY.yml
  dev_url: "https://github.com/clintval/{{ name }}"
  doc_url: "https://github.com/clintval/{{ name }}/blob/{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - clintval
