{% set name = "perl-datetime-locale" %}
{% set version = "1.47" %}
{% set sha256 = "c0b25e1cdb2825d4469b96c7bbd1d7f20c5fc5fc5ae7f5e2bf6e69e08bfb9ecd" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/DateTime-Locale-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('perl-datetime-locale', max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
  host:
    - perl
    - perl-cpan-meta-check
    - perl-test-requires
    - perl-test-warnings
    - perl-extutils-makemaker
    - perl-specio
    - perl-params-validationcompiler
    - perl-test-more
    - perl-namespace-autoclean
    - perl-dist-checkconflicts
    - perl-file-sharedir-install
    - perl-file-sharedir
    - perl-test2-plugin-nowarnings
  run:
    - perl
    - perl-namespace-autoclean
    - perl-dist-checkconflicts
    - perl-params-validationcompiler
    - perl-specio
    - perl-file-sharedir

test:
  imports:
    - DateTime::Locale
    - DateTime::Locale::Base
    - DateTime::Locale::Catalog
    - DateTime::Locale::Data
    - DateTime::Locale::FromData
    - DateTime::Locale::Util

about:
  home: "https://metacpan.org/pod/DateTime::Locale"
  license: "Perl_5"
  summary: "Localization support for DateTime.pm."
  doc_url: "https://metacpan.org/pod/DateTime::Locale"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
