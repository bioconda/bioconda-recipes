{% set name = "baltic" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 597e66381aeb7ecb22f74984e481a8fcdd654ced23467acb039c4c17f1f14163

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation --no-cache-dir . -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.5
    - pip
    - setuptools
  run:
    - python >=3.5
    - matplotlib-base >=2.0.0
    - numpy >=1.16
    - scipy
    - requests

test:
  imports:
    - baltic

about:
  home: "https://github.com/evogytis/baltic"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE 
  summary: "Lightweight package for analyzing, manipulating and visualizing annotated phylogenetic trees."
  dev_url: "https://github.com/evogytis/baltic"
