{% set name = "SeqSero2S" %}
{% set version = "1.2.1" %}
{% set sha256 = "01f8e9640e035a2645896a19bbc486dc2302bb14705a7ac55e3753e6556324b8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/LSTUGA/SeqSero2S/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - biopython-minimum.patch

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - biopython >=1.75
    - blast >=2.2
    - zstd         # libzstd.so.1 required by blastn binary
    - samtools
    - bedtools >=2.17
    - sra-tools >=2.8
    - spades >=3.9
    - salmid
    - bwa >=0.7
    - seqtk >=1.3
    - stringmlst >=0.6
    - mlst >=2.35.0

test:
  commands:
    - SeqSero2S.py --version
    - SeqSero2S.py --check
    - python -c "from Bio import SeqIO, SearchIO"
    - SeqSero2S.py -h
    - blastn -help
    - SalmID.py -h
    - mlst --check
    - mlst -h

about:
  home: "https://github.com/LSTUGA/{{ name }}"
  license: "GPL-2.0-or-later"
  license_family: GPL
  license_file: 'LICENSE'
  summary: "Simplified Salmonella serotype prediction from genome sequencing data"
  dev_url: "https://github.com/LSTUGA/{{ name }}"

extra:
  recipe-maintainers:
    - LSTUGA
    - crashfrog
    - biocoder
  identifiers:
    - doi:10.1128/aem.02600-24
