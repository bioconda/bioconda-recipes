{% set name = "SeqSero2S" %}
{% set version = "1.2.1" %}
{% set release = "22bb50bfa5bbf321d70095d2d3387e5f319ea6a0" %}
{% set sha256 = "2cad60b993b85f76aef54019ca815e09c9b8d8ba3e3b9769d26a26fb29dbfad1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/LSTUGA/SeqSero2S/archive/{{ release }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - biopython-minimum.patch

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - biopython >=1.75
    - blast >=2.2
    - zstd         # libzstd.so.1 required by blastn binary
    - samtools
    - bedtools >=2.17
    - sra-tools >=2.8
    - spades >=3.9
    - salmid
    - bwa >=0.7
    - seqtk >=1.3
    - stringmlst >=0.6
    - mlst >=2.35.0

test:
  commands:
    - SeqSero2S.py --version
    - SeqSero2S.py --check
    - python -c "from Bio import SeqIO, SearchIO"
    - SeqSero2S.py -h
    - blastn -help
    - SalmID.py -h
    - mlst --check
    - mlst -h

about:
  home: "https://github.com/LSTUGA/{{ name }}"
  license: "GPL-2.0-or-later"
  license_family: GPL
  license_file: 'LICENSE'
  summary: "Simplified Salmonella serotype prediction from genome sequencing data"
  dev_url: "https://github.com/LSTUGA/{{ name }}"

extra:
  recipe-maintainers:
    - LSTUGA
    - crashfrog
    - biocoder
  identifiers:
    - doi:10.1128/aem.02600-24
