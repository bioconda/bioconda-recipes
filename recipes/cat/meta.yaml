{% set version = "7.0.0b0" %}


package:
  name: cat
  version: {{ version }}

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage("cat", max_pin="x") }}

requirements:
  run:
    - cat_pack =={{ version }}

test:
  commands:
    - CAT_pack --version

about:
  home: https://github.com/MGXlab/CAT_pack
  dev_url: https://github.com/MGXlab/CAT_pack
  license: MIT
  license_family: MIT
  summary: Compatibility package for CAT pack under its former bioconda name cat
