{% set version = "1.0.0" %}

package:
  name: r-snp.slicer
  version: {{ version }}

source:
  url: https://github.com/PlasmoGenEpi/snp.slicer/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 8b9af894b0cd9031f5ea72d3bac220ca1c201e88df2f3f1ccb9e42251741282c

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports:
    - {{ pin_subpackage('r-snp.slicer', max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - r-base
    - r-dplyr
    - r-posterior
    - r-readr
    - r-rcpp
    - r-rcppeigen
    - r-tidyr
  run:
    - r-base
    - r-dplyr
    - r-posterior
    - r-readr
    - r-rcpp
    - r-tidyr

test:
  commands:
    - $R -e "library('snp.slicer')"

about:
  home: https://github.com/PlasmoGenEpi/snp.slicer
  dev_url: https://github.com/PlasmoGenEpi/snp.slicer
  doc_url: https://plasmogenepi.github.io/snp.slicer/
  summary: Bayesian nonparametric resolution of multi-strain infections
  description: >
    Implementation of SNP-Slice, a Bayesian nonparametric method for resolving
    multi-strain infections using slice sampling with stick-breaking
    construction. The algorithm simultaneously estimates strain haplotypes
    and links them to hosts from sequencing data, and supports categorical,
    Poisson, binomial, and negative binomial observation models.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kathrynmurie
