{% set version = "0.1.3" %}

package:
  name: mozaiko
  version: {{ version }}

source:
  url: https://github.com/CIBIO-BU/mozaiko/archive/refs/tags/{{ version }}.tar.gz
  sha256: e4f22cc01747f179d6fc94c981adfdbb7aed86b51a63e81da812311c359fe1e9

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage('mozaiko', max_pin="x.x") }}

requirements:
  build:
    - unzip

  host:
    - python >=3.9
    - pip
    - setuptools >=61
    - wheel

  run:
    - python >=3.9
    - numpy
    - pandas
    - matplotlib-base
    - biopython
    - tqdm
    - vsearch ==2.16
    - cutadapt ==4.9
    - catnip-seq

test:
  imports:
    - mozaiko
  commands:
    - pip check
    - mozaiko --version
    - crabs --version
  requires:
    - pip
    - python

about:
  home: https://github.com/CIBIO-BU/mozaiko
  summary: Piecing Together Complete Genetic Coverage for Biomonitoring
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - camilababo