{% set version = "1.3.0" %}

package:
  name: r-netcomi
  version: {{ version|replace("-", "_") }}

source:
  url: https://github.com/stefpeschel/NetCoMi/archive/refs/tags/v{{ version }}.zip
  sha256: d2429186ca82cd710cfac135b1b9fc15e2fb59071b4e4f55e4a91f15c008aa91

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports:
    - {{ pin_subpackage('r-netcomi', max_pin="x") }}

requirements:
  host:
    - r-base
    - r-spieceasi >=1.0.6
    - bioconductor-biobase
    - bioconductor-mia
    - bioconductor-summarizedexperiment
    - r-dosnow
    - r-fdrtool
    - r-filematrix
    - r-foreach
    - r-gtools
    - r-huge
    - r-igraph
    - r-mass
    - r-matrix
    - bioconductor-phyloseq
    - r-pulsar
    - r-qgraph
    - r-rdpack
    - r-snow
    - r-spring
    - r-vegan
    - r-wgcna
    - r-orca
    - r-corrplot
    - r-mixedcca >=1.6.2
  run:
    - r-base
    - r-spieceasi >=1.0.6
    - bioconductor-biobase
    - bioconductor-mia
    - bioconductor-summarizedexperiment
    - r-dosnow
    - r-fdrtool
    - r-filematrix
    - r-foreach
    - r-gtools
    - r-huge
    - r-igraph
    - r-mass
    - r-matrix
    - bioconductor-phyloseq
    - r-pulsar
    - r-qgraph
    - r-rdpack
    - r-snow
    - r-spring
    - r-vegan
    - r-wgcna
    - r-orca
    - r-corrplot
    - r-mixedcca >=1.6.2

test:
  commands:
    - $R -e "library('NetCoMi')"

about:
  home: "https://github.com/stefpeschel/NetCoMi"
  license: "GPL-3.0-only"
  license_family: GPL3
  summary: "Network Construction and Comparison for Microbiome Data."
  dev_url: "https://github.com/stefpeschel/NetCoMi"
  license_file: LICENSE
  description: NetCoMi offers functions for constructing, analyzing, and comparing 
           microbial association networks as well as dissimilarity-based networks for 
           microbial compositional data. It also includes functionality for 
           constructing differential association networks.
  doc_url: "https://netcomi.de"

extra:
  identifiers:
    - doi:10.1093/bib/bbaa290
    - doi:10.5281/zenodo.3775500
