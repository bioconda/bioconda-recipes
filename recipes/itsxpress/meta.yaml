{% set name = "itsxpress" %}
{% set version = "2.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/USDA-ARS-GBRU/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: cab733df4b0913644e5a62dd1380ee117fe5bac3418c7f6c813d76325f810e26

build:
  number: 0
  noarch: python
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  entry_points:
    - itsxpress = itsxpress.main:main
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation --no-cache-dir . -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.8
    - setuptools
    - setuptools-scm >=8
  run:
    - python >=3.8
    - biopython >=1.79
    - hmmer >=3.1b2
    - vsearch >=2.21.1
    - pyzstd

test:
  imports:
    - itsxpress
  commands:
    - itsxpress --help

about:
  home: "https://github.com/usda-ars-gbru/itsxpress"
  license: "CC0-1.0"
  license_family: 'PUBLIC-DOMAIN'
  license_file: "LICENSE.txt"
  summary: 'ITSxpress: Software to rapidly trim the Internally Transcribed Spacer (ITS) region from FASTQ files.'
  dev_url: "https://github.com/usda-ars-gbru/itsxpress"
  doc_url: "https://itsxpress.readthedocs.io/en/latest"

extra:
  recipe-maintainers:
    - arivers
    - seina001
  identifiers:
    - biotools:ITSxpress
    - doi:10.1128/spectrum.00601-24
    - doi:10.5281/zenodo.1304349
    - doi:10.12688/f1000research.15704.1
