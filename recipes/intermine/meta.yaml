{% set name = "intermine" %}
{% set version = "1.14.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/i/intermine/intermine-{{ version }}.tar.gz
  sha256: 4bdf96e067f5b3958b2c17ffb3a3bec306515a49cd819d1b3c67fd29e80a5193

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3
    - pip
    - setuptools
  run:
    - python >=3
    - requests
    - lxml

test:
  imports:
    - intermine
    - intermine.lists

about:
  description: "InterMine Webservice Client:A Python API to access bioinformatics data warehouses powered by the InterMine platform."
  license: "LGPL-3.0-only AND BSD-2-Clause"
  license_family: LGPL
  summary: "InterMine WebService client."
  home: "http://www.intermine.org"
  license_file: "LICENSE-LGPL"
