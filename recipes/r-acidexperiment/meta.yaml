{% set version = "0.5.6" %}
{% set github = "https://github.com/acidgenomics/r-acidexperiment" %}

package:
  name: r-acidexperiment
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 578dcca7ff98c35f25448a302ec5016ba2cac6a0c9ed808d411d6bf37182ec80

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('r-acidexperiment', max_pin="x.x") }}

requirements:
  host:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biobase >=2.60.0
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-genomicranges >=1.52.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.0
    - r-acidcli >=0.3.0
    - r-acidgenerics >=0.7.1
    - r-acidgenomes >=0.7.5
    - r-acidplyr >=0.5.5
    - r-goalie >=0.7.8
    - r-matrix >=1.6.1
    - r-pipette >=0.16.1
    - r-syntactic >=0.8.1
    # Suggests:
    - bioconductor-biostrings >=2.68.0
    - bioconductor-genomeinfodb >=1.36.0
    - r-scales >=1.2.1
  run:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biobase >=2.60.0
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-genomicranges >=1.52.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.0
    - r-acidcli >=0.3.0
    - r-acidgenerics >=0.7.1
    - r-acidgenomes >=0.7.5
    - r-acidplyr >=0.5.5
    - r-goalie >=0.7.8
    - r-matrix >=1.6.1
    - r-pipette >=0.16.1
    - r-syntactic >=0.8.1
    # Suggests:
    - bioconductor-biostrings >=2.68.0
    - bioconductor-genomeinfodb >=1.36.0
    - r-scales >=1.2.1

test:
  commands:
    - $R -e "library('AcidExperiment')"

about:
  home: https://r.acidgenomics.com/packages/acidexperiment/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: Toolkit to extend the functionality of SummarizedExperiment.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
