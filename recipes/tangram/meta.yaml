{% set version = "0.4.0" %}

package:
  name: tangram-sc
  version: {{ version }}

source:
  url: https://github.com/broadinstitute/Tangram/archive/refs/tags/v{{ version }}.tar.gz
  sha256: d5558cd419c8d46bdc958064cb97f963d1ea793866414c025906ec15033512ed

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  noarch: python

requirements:
  host:
    - python=3.13
    - pip
  run:
    - python=3.13
    - squidpy==1.8.1
    - libpysal==4.14.1

test:
  imports:
    - tangram
  commands:
    - pip check

about:
  home: https://github.com/broadinstitute/Tangram
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Single-cell spatial mapping of spatial transcriptomics data"

extra:
  recipe-maintainers:
    - LuisHeinzlmeier