{% set version = "0.9.0" %}
{% set github = "https://github.com/acidgenomics/r-pointillism" %}

package:
  name: r-pointillism
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 05ceab727b0e1d1f01cf5cf1e30f400bcda33ce95f5ee0859f4ada2ce7ee8afa

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('r-pointillism', max_pin="x.x") }}

requirements:
  host:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-biocparallel >=1.34.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-singlecellexperiment >=1.22.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.0
    - r-acidcli >=0.3.0
    - r-acidexperiment >=0.5.0
    - r-acidgenerics >=0.7.1
    - r-acidgenomes >=0.6.0
    - r-acidmarkdown >=0.3.0
    - r-acidplots >=0.7.0
    - r-acidplyr >=0.5.0
    - r-acidsinglecell >=0.4.0
    - r-ggplot2 >=3.4.3
    - r-goalie >=0.7.1
    - r-matrix >=1.6.1
    - r-pipette >=0.14.0
    - r-seurat >=4.9.9
    - r-seuratobject >=4.9.9
    - r-syntactic >=0.7.0
    # Suggests:
    - r-basejump >=0.18.0
    - r-future >=1.33.0
    - r-rmarkdown >=2.25
  run:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-biocparallel >=1.34.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-singlecellexperiment >=1.22.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.0
    - r-acidcli >=0.3.0
    - r-acidexperiment >=0.5.0
    - r-acidgenerics >=0.7.1
    - r-acidgenomes >=0.6.0
    - r-acidmarkdown >=0.3.0
    - r-acidplots >=0.7.0
    - r-acidplyr >=0.5.0
    - r-acidsinglecell >=0.4.0
    - r-ggplot2 >=3.4.3
    - r-goalie >=0.7.1
    - r-matrix >=1.6.1
    - r-pipette >=0.14.0
    - r-seurat >=4.9.9
    - r-seuratobject >=4.9.9
    - r-syntactic >=0.7.0
    # Suggests:
    - r-basejump >=0.18.0
    - r-future >=1.33.0
    - r-rmarkdown >=2.25

test:
  commands:
    - $R -e "library('pointillism')"

about:
  home: https://r.acidgenomics.com/packages/pointillism/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: Single-cell RNA-seq toolkit.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
