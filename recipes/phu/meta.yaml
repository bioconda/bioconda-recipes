{% set name = "phu" %}
{% set version = "0.9.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/camilogarciabotero/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 3e2724a24e88160850c21d9d5f84805082771be5e673b010b419d58a09be1971

build:
  number: 0
  noarch: python
  entry_points:
    - phu = phu.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.10
    - click >=8.1.7,<8.2
    - rich >=13.7,<=15
    - pandas >=2.3.2
    - typer >=0.17.3
    - pyhmmer >=0.11.1
    - pyrodigal >=3.6.3.post1
    - pyrodigal-gv >=0.3.2
    - vclust
    - seqkit
    - mafft

test:
  commands:
    - phu --help

about:
  home: "https://github.com/camilogarciabotero/phu"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Phage Utilities (phu): modular toolkit for clustering, classifying, and analyzing viral sequences."
  description: |
    **phu** (Phage Utilities) is a Python toolkit designed for viral bioinformatics workflows.
    It provides modular commands to handle tasks such as:
      * `screen`: screening of contigs for protein families with profile HMMs (Pfam, KOfam, dbCAN or user-supplied).
      * `jack`: iterative screening of contigs from seed protein sequences.
      * `cluster`: dereplication and clustering of viral genomes into species- and genus-level groups.
      * `avger`: prioritisation of auxiliary viral gene candidates.
  dev_url: "https://github.com/camilogarciabotero/phu"
  doc_url: "https://camilogarciabotero.github.io/phu"

extra:
  recipe-maintainers:
    - camilogarciabotero
