{% set name = "OSTIR" %}
{% set version = "1.1.3" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://files.pythonhosted.org/packages/ab/f7/6e62f0f43ff828da0f24696bc70b34f9ea2d6b70490d2e2a4fadaf168213/ostir-{{ version }}.tar.gz"
  sha256: "6fa38a4e867c8d38aab16b59addc07ce2de03ee766ef6018c24c7a78ff163e14"

build:
  number: 0
  entry_points:
    - ostir = ostir.ostir:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  noarch: python
  run_exports:
    - {{ pin_subpackage('ostir', max_pin="x.x.x") }}

requirements:
  host:
    - pip
    - python >=3.8
    - setuptools
  run:
    - python >=3.8
    - viennarna >=2.4.18
    - numpy >=1.20.1

test:
  imports:
    - ostir
  commands:
    - ostir --help
    - ostir -i TTCTAGActttaatttaacgtaaataaggaagtcattATGGCGAGCTCTGAAGACGTTATCAAAGAGTTCATGCGTTTCAAAGTTCGTATGGA -t string

about:
  home: "https://github.com/barricklab/ostir"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: "LICENSE"
  summary: "Open Source Transcription Initiation Rates"
  doc_url: "https://github.com/barricklab/ostir/wiki"
  dev_url: "https://github.com/barricklab/ostir"

extra:
  recipe-maintainers:
    - croots
    - jeffreybarrick
