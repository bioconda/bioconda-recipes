{% set name = "sensityper" %}
{% set version = "1.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a1ef88f327a2f702895023cc1c3d33f882fafd6ddfb2c83e5fbbe56dc1e77c8e

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}
  script: "{{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir"
  entry_points:
    - sensityper = sensityper.sensityper:main
    - sensityping-metrics = sensityper.sensityping_metrics:cli

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools >=61
  run:
    - python >=3.8
    - numpy
    - pandas
    - scikit-learn
    - plotly

test:
  imports:
    - sensityper
  commands:
    - sensityper --help
    - sensityping-metrics --help

about:
  home: https://github.com/leosanbu/sensityper
  dev_url: https://github.com/leosanbu/sensityper
  doc_url: https://leosanbu.github.io/sensityper/
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Genomic antimicrobial susceptibility prediction and treatment recommendation for Neisseria gonorrhoeae

extra:
  recipe-maintainers:
    - leosanbu
