{% set version = "0.3.1" %}
{% set github = "https://github.com/acidgenomics/r-chromium" %}

package:
  name: r-chromium
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 98568d8333eecdb5ffedd5124fdfacc12bf61b2e114863d2cbe75c1c18014279

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('r-chromium', max_pin="x.x") }}

requirements:
  host:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-rhdf5 >=2.44.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-singlecellexperiment >=1.22.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.8
    - r-acidcli >=0.3.3
    - r-acidexperiment >=0.5.6
    - r-acidgenerics >=0.7.11
    - r-acidgenomes >=0.8.1
    - r-acidplyr >=0.5.8
    - r-acidsinglecell >=0.4.5
    - r-goalie >=0.7.10
    - r-matrix >=1.6.1
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1
  run:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-rhdf5 >=2.44.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-singlecellexperiment >=1.22.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.8
    - r-acidcli >=0.3.3
    - r-acidexperiment >=0.5.6
    - r-acidgenerics >=0.7.11
    - r-acidgenomes >=0.8.1
    - r-acidplyr >=0.5.8
    - r-acidsinglecell >=0.4.5
    - r-goalie >=0.7.10
    - r-matrix >=1.6.1
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1

test:
  commands:
    - $R -e "library('Chromium')"

about:
  home: https://r.acidgenomics.com/packages/chromium/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: Toolkit for 10X Genomics Chromium single cell data.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
