{% set name = "codon-bias" %}
{% set version = "0.5.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz"
  sha256: f2d8c9de40999b83a9d2f13af456e7ab3a91d0e18bbf2d86f5cfdd0dbd041edc

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
    - wheel
  run:
    - numpy
    - pandarallel
    - pandas <3
    - python >=3.9
    - scipy

test:
  requires:
    - pip
  imports:
    - codonbias
  commands:
    - python -m pip check

about:
  home: "https://github.com/alondmnt/codon-bias"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "codon usage bias analysis tools"
  doc_url: "https://codon-bias.readthedocs.io/en/latest/"

extra:
  recipe-maintainers:
    - RedPenguin100
