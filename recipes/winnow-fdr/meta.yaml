{% set version = "2.0.0" %}

package:
  name: winnow-fdr
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/w/winnow-fdr/winnow_fdr-{{ version }}.tar.gz
  sha256: da1081f2eec67c05f6ce7fabbfcc87aeef43c17cbd4129bb81fcd4bf898bb19a

build:
  entry_points:
    - winnow = winnow.scripts.main:app
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10,<3.14
    - setuptools
    - pip
  run:
    - python >=3.10,<3.14
    - koinapy >=0.0.10
    - tomli >=2.2.1
    - typer >=0.15.2
    - instanovo >=1.1.4
    - huggingface-hub >=0.35.3
    - hydra-core>=1.3.2
    - matchms >=0.31.0
    - scikit-learn >=1.3.0
    - matplotlib >=3.7.0
    - torch >=2.6
    - safetensors >=0.7.0
    - polars >=1.39.3
    - biopython >=1.87
    - pyahocorasick >=2.3.1

test:
  imports:
    - winnow
  commands:
    - pip check
    - winnow --help
  requires:
    - pip
    - python

about:
  home: https://github.com/instadeepai/winnow
  summary: Score calibration and false discovery estimation for de novo peptide sequencing.
  license: Apache-2.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - BioGeek
