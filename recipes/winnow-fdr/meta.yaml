{% set version = "2.0.0" %}

package:
  name: winnow-fdr
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/w/winnow-fdr/winnow_fdr-{{ version }}.tar.gz
    sha256: 08835b95edefb478ad03ad8bb58968facee15d581e7e93cc8c89b9928ec89d15
  # The PyPI sdist does not include the project's end-to-end example data.
  - url: https://github.com/instadeepai/winnow/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 74bfcefef400261a95879452a508f9f1760b04f9202de605f15c3affe8a4f4a2
    folder: test-data

build:
  entry_points:
    - winnow = winnow.scripts.main:app
  noarch: python
  script: |
    # winnow-fdr requires pyahocorasick >=2.3.1, but 2.3.1 only adds linux ARM
    # wheels to PyPI - no library changes (see the project's CHANGELOG). conda-forge
    # already builds 2.3.0 for linux-aarch64, so relax the bound to keep the
    # installed metadata consistent with the run requirement below.
    # Upstream is relaxing this too (instadeepai/winnow#241); once a release with
    # that change is out, bump the version and drop this patch.
    sed -i.bak 's/pyahocorasick>=2.3.1/pyahocorasick>=2.3.0/' pyproject.toml
    rm -f pyproject.toml.bak
    {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage("winnow-fdr", max_pin="x") }}

requirements:
  host:
    - python >=3.10,<3.13
    - setuptools
    - pip
  run:
    - python >=3.10,<3.13
    - koinapy >=0.0.10
    - tomli >=2.2.1
    - typer >=0.15.2
    - instanovo >=1.1.4
    - huggingface_hub >=0.35.3
    - hydra-core >=1.3.2
    - matchms >=0.31.0
    - scikit-learn >=1.3.0
    - matplotlib-base >=3.7.0
    - pytorch >=2.6,<2.9  # [linux]
    - pytorch >=2.6,<2.8  # [osx]
    - safetensors >=0.7.0
    - polars >=1.39.3
    - biopython >=1.87
    - pyahocorasick >=2.3.0

test:
  imports:
    - winnow
  source_files:
    - test-data/examples/example_data
  commands:
    - pip check
    - winnow --help
    - >-
      winnow train
      dataset.spectrum_path_or_directory=test-data/examples/example_data/spectra.mgf
      dataset.predictions_path=test-data/examples/example_data/predictions.csv
      model_output_dir=models/new_model
      dataset_output_path=results/calibrated_dataset.csv
      calibrator.features.retention_time_feature.train_fraction=0.3
      calibrator.features.retention_time_feature.min_train_points=2
      calibrator.hidden_dims="[32, 16]"
      calibrator.n_iter_no_change=100
      calibrator.max_epochs=100
    - >-
      winnow predict
      calibrator.pretrained_model_name_or_path=models/new_model
      fdr_control.fdr_threshold=1.0
      dataset.spectrum_path_or_directory=test-data/examples/example_data/spectra.mgf
      dataset.predictions_path=test-data/examples/example_data/predictions.csv
    - test -f results/calibrated_dataset.csv
  requires:
    - pip
    - python

about:
  home: https://github.com/instadeepai/winnow
  summary: Score calibration and false discovery estimation for de novo peptide sequencing.
  license: Apache-2.0
  license_file: LICENSE.md

extra:
  identifiers:
    - biotools:winnow
    - doi:10.48550/arXiv.2509.24952
  recipe-maintainers:
    - BioGeek
