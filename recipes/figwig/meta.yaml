{% set name = "figwig" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/f/figwig/figwig-{{ version }}.tar.gz
  sha256: e2708fc6a6410f9338f3df6ee857f603bad238226dcd7d45903c31a8a87b7c2e

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  entry_points:
    - figwig = figwig.__main__:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling >=1.27
  run:
    - python >=3.10
    - numba >=0.58
    - numpy >=1.23

test:
  imports:
    - figwig
  requires:
    - pip
  commands:
    - pip check
    - figwig --help

about:
  home: https://github.com/jmschrei/figwig
  summary: A fast, multithreaded reader and writer of bigWig files, into and out of numpy.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/jmschrei/figwig

extra:
  recipe-maintainers:
    - musharna
