{% set name = "scanitd" %}
{% set version = "0.9.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/scanitd-{{ version }}.tar.gz
  sha256: 24962f31888bacb01760effe2af232dc0efbd27046d4e86572c0724202605017

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('scanitd', max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - scanitd = scanitd.cli.cli:app

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - numpy >=2.0.0
    - pysam >=0.22.0
    - pyfaidx >=0.7.2
    - psutil >=5.9.5
    - loguru >=0.7.0
    - typer >=0.12.5
    - rich >=13.7.0

test:
  imports:
    - scanitd
    - scanitd.ssw
  commands:
    - scanitd --help
    - python -c "from scanitd.ssw import AlignmentMgr; m = AlignmentMgr(); m.set_read('ACGT'); m.set_reference('TTACGTTT'); r = m.align(); assert r.CIGAR == '4M' and r.reference_start == 2"

about:
  home: https://github.com/ylab-hi/ScanITD
  summary: Detecting internal tandem duplication with robust variant allele frequency estimation
  license: MIT
  license_file: LICENSE
  doc_url: https://scanitd.readthedocs.io

extra:
  identifiers:
    - doi:10.1093/gigascience/giaa089
  recipe-maintainers:
    - dolittle007
