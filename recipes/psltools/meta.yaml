{% set name = "psltools" %}
{% set version = "0.0.3" %}

package:
 name: {{ name }}
 version: {{ version }}

source:
 url: https://github.com/alejandrogzi/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
 sha256: 238eb006b1f09d483a5c47db523bbd3a0478c7130f35dbc45a4cbac76e51989b

build:
 number: 0
 run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler("cxx") }}
    - {{ compiler("rust") }}
    - cargo-bundle-licenses
    - cmake
    - make
    - pkg-config

test:
 commands:
   - psltools --help
   - psltools --version

about:
 home: "https://github.com/alejandrogzi/psltools"
 license: "Apache-2.0"
 license_family: APACHE
 license_file:
   - LICENSE
   - THIRDPARTY.yml
 summary: "work with .psl files in rust"
 dev_url: "https://github.com/alejandrogzi/psltools"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - alejandrogzi
  skip-lints:
    - compiler_needs_stdlib_c
