{% set name = "eukcc" %}
{% set version = "2.3.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 36488dc3e6bf653638639ad0da40f5201e02a938f8303d0ef9b46f2e47da5850

build:
  number: 0
  noarch: python
  entry_points:
    - eukcc = eukcc.__main__:main
    - shared_markers = eukcc.find_markerset:main
    - binlinks = scripts.binlinks:main
    - filter_euk_bins = scripts.filter_euk_bins:main
    - binlinks.py = scripts.binlinks:main
    - filter_euk_bins.py = scripts.filter_euk_bins:main
  script: "{{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir"
  run_exports:
    - {{ pin_subpackage('eukcc', max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.10,<3.12
    - setuptools >=61.0
  run:
    - biopython ==1.83
    - click >=8.1
    - ete3 >=3.1.3
    - jsonpickle >=4.0.0
    - numpy >=1.24.4
    - python >=3.10,<3.12
    - hmmer =3.3
    - epa-ng =0.3.8
    - 'metaeuk =4.a0f584d'
    - bwa
    - pplacer
    - samtools >=1.12
    - pysam ==0.21.0
    - six

test:
  imports:
    - eukcc
  commands:
    - eukcc --help > /dev/null

about:
  home: "https://github.com/EBI-Metagenomics/EukCC"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "Check eukaryotic genomes or MAGs for completeness and contamination."
  doc_url: "https://eukcc.readthedocs.io/en/latest"
  dev_url: "https://github.com/EBI-Metagenomics/EukCC"

extra:
  recipe-maintainers:
    - openpaul
    - dezordi
