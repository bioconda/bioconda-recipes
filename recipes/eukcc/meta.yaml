{% set name = "eukcc" %}
{% set version = "2.2.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 2cf505b3e32f7e3957273284bfbfca7a2e7d9590b1173af3d421bc4f585990a3

build:
  number: 0
  noarch: python
  entry_points:
    - eukcc = eukcc.__main__:main
    - shared_markers = eukcc.find_markerset:main
    - binlinks = scripts.binlinks:main
    - filter_euk_bins = scripts.filter_euk_bins:main
  script: "{{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir"
  run_exports:
    - {{ pin_subpackage('eukcc', max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.8
    - setuptools
  run:
    - biopython ==1.83
    - configargparse
    - ete3
    - jsonpickle
    - numpy
    - python >=3.8
    - hmmer =3.3
    - epa-ng =0.3.8
    - 'metaeuk =4.a0f584d'
    - bwa
    - pplacer
    - samtools >=1.12
    - pysam
    - six

test:
  imports:
    - eukcc
  commands:
    - eukcc --help > /dev/null

about:
  home: "https://github.com/Finn-Lab/EukCC"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "Check eukaryotic genomes or MAGs for completeness and contamination."
  doc_url: "https://eukcc.readthedocs.io/en/latest"
  dev_url: "https://github.com/Finn-Lab/EukCC"

extra:
  recipe-maintainers:
    - openpaul
