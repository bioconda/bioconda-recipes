{% set version = "1.0.5" %}

package:
  name: scgbinner
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/S/SCGBinner/scgbinner-{{ version }}.tar.gz
  sha256: d28202c42d2172502b2cf7450c4582d8afc258ed06c342891956f9ec8a5d0fea

build:
  noarch: python
  run_exports:
   - {{ pin_subpackage("scgbinner", max_pin="x.x") }}
  entry_points:
    - scgbinner = SCGBinner.wrapper:main
    - split_contigs = SCGBinner.Split_contigs:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9,<3.10
    - setuptools >=61
    - pip
  run:
    - python >=3.9,<3.10
    - biopython
    - numpy =1.19
    - scipy
    - igraph
    - leidenalg
    - joblib
    - pandas =1.4
    - scikit-learn
    - pyyaml
    - tensorboard
    - tqdm
    - hnswlib
    - atomicwrites
    - bedtools
    - fraggenescan
    - hmmer
test:
  imports:
    - SCGBinner
  commands:
    - pip check
    - scgbinner
    - split_contigs --help
  requires:
    - pip
    - python

about:
  home: https://github.com/htaohan/SCGBinner
  summary: Metagenomic binning method
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - htaohan
