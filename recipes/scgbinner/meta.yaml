{% set version = "1.0.3" %}

package:
  name: scgbinner
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/S/SCGBinner/scgbinner-{{ version }}.tar.gz
  sha256: 06c7d3ff87a2ad6d6f676d5faec3867c587c3b3062dc77cd46380630eeb0e5e9

run_exports:
   - {{ pin_subpackage("centrifuge", max_pin="x.x") }}

build:
  noarch: python
  entry_points:
    - scgbinner = SCGBinner.wrapper:main
    - split_contigs = SCGBinner.Split_contigs:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9,<3.10
    - setuptools >=61
    - pip
  run:
    - python >=3.9,<3.10
    - biopython
    - numpy =1.19
    - scipy
    - igraph
    - leidenalg
    - joblib
    - pandas =1.4
    - scikit-learn
    - pyyaml
    - tensorboard
    - tqdm
    - hnswlib
    - atomicwrites
    - bedtools
test:
  imports:
    - SCGBinner
  commands:
    - pip check
    - scgbinner
    - split_contigs --help
  requires:
    - pip
    - python

about:
  home: https://github.com/htaohan/SCGBinner
  summary: SCG-guided metagenomic binning tool
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - htaohan
