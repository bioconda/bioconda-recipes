{% set name = "trackplot" %}
{% set version = "0.7.0" %}

package:
  name: trackplot
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 413ac86da30dfcc9b086c17216cced8bbe1691e0d1dcf5fa5387dbb4b5667700

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - trackplot = trackplot.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.11,<3.14
    - pip
    - setuptools >=65.0
  run:
    - python >=3.11,<3.14
    - adjusttext >=1.3.0
    - cairocffi >=1.7.1
    - click >=8.2.1
    - click-option-group >=0.5.7
    - filetype >=1.2.0
    - flask >=3.1.1
    - hicmatrix >=17.2
    - loguru >=0.7.3
    - matplotlib-base >=3.10.3
    - numpy >=2.3.0
    - pandas >=2.3.0
    - pybigwig >=0.3.24
    - pysam >=0.23.3
    - requests >=2.32.4
    - scipy >=1.15.3
    - seaborn-base >=0.13.2
    - xmltodict >=0.15.0

test:
  imports:
    - trackplot
  commands:
    - trackplot --help

about:
  home: "https://github.com/ygidtu/trackplot"
  summary: "The trackplot is a tool for visualizing various next-generation sequencing (NGS) data, including DNA-seq, RNA-seq, single-cell RNA-seq and full-length sequencing datasets."
  doc_url: "https://trackplot.readthedocs.io/en/latest"
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  dev_url: "https://github.com/ygidtu/trackplot"

extra:
  recipe-maintainers:
    - ygidtu
