{% set name = "palm_annot" %}
{% set version = "0.0.1" %}
{% set commit = "a59b5fed048eea2973cc78f89effbe955e56ad3e" %}
{% set sha256 = "46b70825058c29d1b9e9c78cf6f4464b55fe251965c48673b92f13aa6a3971e6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/rcedgar/palm_annot/archive/{{ commit }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

requirements:
  run:
    - python >=3.8
    - hmmer
    - diamond
    - palmscan ==2.0

test:
  commands:
    - palm_annot.py --help 2>&1 | grep -i "RdRp"
    - fev2tsv.py --help 2>&1 | head -5

about:
  home: https://github.com/rcedgar/palm_annot
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: "HMM-based annotation of viral RdRp palmprint regions"
  description: |
    palm_annot finds RNA-dependent RNA polymerase (RdRp) regions in
    nucleotide or protein sequences using HMM profiles and palmprint
    motifs, with optional palmcore (150pp150) trimming. It improves
    sensitivity and false-positive rate compared with the PSSM-based
    palmscan, while still calling palmscan2 internally for PSSM
    search and pamerge.
  dev_url: https://github.com/rcedgar/palm_annot

extra:
  recipe-maintainers:
    - shoichisakaguchi
