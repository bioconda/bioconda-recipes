{% set name = "alpharaw" %}
{% set version = "0.7.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/MannLabs/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e751f1967f60224e0d7f3c9c635f6dbda1efdd6f8601ac9794c02140a6615060

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  entry_points:
    - alpharaw = alpharaw.cli:run
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - setuptools
    - pip
  run:
    - python >=3.8
    - click
    - pythonnet
    - h5py
    - numba
    - pandas
    - numpy
    - pyteomics
    - lxml
    - owlready2
    - alphabase >=1.5.0

test:
  imports:
    - alpharaw
  commands:
    - alpharaw --help

about:
  home: "https://github.com/MannLabs/alpharaw"
  summary: "An open-source Python package to unify raw MS data access and storage."
  description: |
    AlphaRaw provides unified access to raw mass spectrometry data from
    various instrument vendors, converting them to a standardized HDF5
    format for downstream analysis in the AlphaPept ecosystem.
  license: "Apache-2.0"
  license_family: APACHE
  license_file: "LICENSE.txt"
  dev_url: "https://github.com/MannLabs/alpharaw"

extra:
  recipe-maintainers:
    - jonasscheid
