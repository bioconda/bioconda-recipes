{% set version = "1.24.0" %}
{% set name = "BiocOncoTK" %}
{% set bioc = "3.19" %}

package:
  name: bioconductor-{{ name|lower }}
  version: {{ version }}

source:
  url:
    - 'https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz'
    - 'https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz'
    - 'https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz'
    - 'https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz'
  sha256: a3ae5bb9a251ee9122de9a14fb770e206f5d8e73470724db3cddaf9ae9c98c40

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: {{ pin_subpackage('bioconductor-bioconcotk', max_pin="x.x") }}

# Suggests: knitr, dbplyr, org.Hs.eg.db, MultiAssayExperiment, BiocStyle, ontoProc, ontologyPlot, pogos, GenomeInfoDb, restfulSE (>= 1.3.7), BiocFileCache, TxDb.Hsapiens.UCSC.hg19.knownGene, Biobase, TxDb.Hsapiens.UCSC.hg18.knownGene, reshape2, testthat, AnnotationDbi, FDb.InfiniumMethylation.hg19, EnsDb.Hsapiens.v75, rmarkdown, rhdf5client, AnnotationHub
requirements:
  host:
    - 'bioconductor-complexheatmap >=2.26.0,<2.27.0'
    - 'bioconductor-curatedtcgadata >=1.32.0,<1.33.0'
    - 'bioconductor-genomicfeatures >=1.62.0,<1.63.0'
    - 'bioconductor-genomicranges >=1.62.0,<1.63.0'
    - 'bioconductor-graph >=1.88.0,<1.89.0'
    - 'bioconductor-iranges >=2.44.0,<2.45.0'
    - 'bioconductor-rgraphviz >=2.56.0,<2.57.0'
    - 'bioconductor-s4vectors >=0.48.0,<0.49.0'
    - 'bioconductor-summarizedexperiment >=1.40.0,<1.41.0'
    - r-base
    - r-bigrquery
    - r-car
    - r-dbi
    - r-dplyr
    - r-dt
    - r-ggplot2
    - r-ggpubr
    - r-httr
    - r-magrittr
    - r-mass
    - r-plyr
    - r-rjson
    - r-scales
    - r-shiny
  run:
    - 'bioconductor-complexheatmap >=2.26.0,<2.27.0'
    - 'bioconductor-curatedtcgadata >=1.32.0,<1.33.0'
    - 'bioconductor-genomicfeatures >=1.62.0,<1.63.0'
    - 'bioconductor-genomicranges >=1.62.0,<1.63.0'
    - 'bioconductor-graph >=1.88.0,<1.89.0'
    - 'bioconductor-iranges >=2.44.0,<2.45.0'
    - 'bioconductor-rgraphviz >=2.56.0,<2.57.0'
    - 'bioconductor-s4vectors >=0.48.0,<0.49.0'
    - 'bioconductor-summarizedexperiment >=1.40.0,<1.41.0'
    - r-base
    - r-bigrquery
    - r-car
    - r-dbi
    - r-dplyr
    - r-dt
    - r-ggplot2
    - r-ggpubr
    - r-httr
    - r-magrittr
    - r-mass
    - r-plyr
    - r-rjson
    - r-scales
    - r-shiny

test:
  commands:
    - '$R -e "library(''{{ name }}'')"'

about:
  home: "https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html"
  license: "Artistic-2.0"
  summary: "Bioconductor components for general cancer genomics."
  description: "Provide a central interface to various tools for genome-scale analysis of cancer studies."
