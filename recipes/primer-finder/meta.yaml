{% set name = "primer-finder" %}
{% set version = "1.8.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/duceppemo/primer-finder/archive/refs/tags/v{{ version }}.tar.gz
  sha256: c6de2c31e7bdce5f15401ef559e44a35e8dc95a7e9a33dfad6756921576e78a1

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - kmc >=3.2
    - skesa >=2.4
    - spades >=3.15
    - minimap2 >=2.24
    - blast >=2.14
    - primer3 >=2.6

test:
  commands:
    - primer-finder --help
    - primer-finder --version

about:
  home: https://github.com/duceppemo/primer-finder
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Find group-specific kmers to design selective qPCR assays
  dev_url: https://github.com/duceppemo/primer-finder
  doc_url: https://github.com/duceppemo/primer-finder/wiki

extra:
  recipe-maintainers:
    - duceppemo
