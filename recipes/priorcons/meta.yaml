{% set name = "priorcons" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/p/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5b3216554580277e387f8413c2a019b282229c49a7241947c25440afaec42921


build:
  noarch: python
  number: 0
  script: python -m pip install . --no-deps -vv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.8
    - numpy
    - pandas
    - biopython
    - pyarrow

test:
  commands:
    - priorcons --help
  imports:
    - priorcons

about:
  home: https://github.com/GERMAN00VP/priorcons
  license: APL-1.0
  license_file: LICENSE
  summary: Prior-guided integration tool that improves viral consensus sequences by filling masked regions using candidate sequences validated against evolutionary priors.
  author: Germán Vallejo Palma
  maintainer: Germán Vallejo Palma

extra:
  recipe-maintainers:
    - GERMAN00VP
