{% set name = "priorcons" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/p/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5b3216554580277e387f8413c2a019b282229c49a7241947c25440afaec42921

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  entry_points:
    - priorcons = priorcons.cli:entrypoint
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.9
    - numpy >=1.21

test:
  imports:
    - priorcons
  commands:
    - priorcons --help
    - priorcons --version

about:
  home: https://github.com/GERMAN00VP/PriorCons
  license: Apache-2.0
  license_family: APACHE
  license_file:
    - LICENSE
    - NOTICE
  summary: Prior-guided integration of viral consensus sequences using a reference-anchored genome database.
  dev_url: https://github.com/GERMAN00VP/PriorCons

extra:
  recipe-maintainers:
    - GERMAN00VP
