{% set name = "alphatims" %}
{% set version = "1.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/MannLabs/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 6acd6f6057491994797c8cd03fb77dbe6e3c94f5ac7e5fa6bcf07fc1b6f0205a

build:
  number: 1
  noarch: python
  entry_points:
    - alphatims = alphatims.cli:run
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - setuptools
    - pip
  run:
    - python >=3.8
    - click
    - h5py
    - numba
    - pandas
    - psutil
    - pyzstd
    - tqdm
    - alpharaw

test:
  imports:
    - alphatims
  commands:
    - alphatims --help

about:
  home: "https://github.com/MannLabs/alphatims"
  summary: "A Python package for indexing Bruker timsTOF raw data."
  description: |
    AlphaTims provides fast indexing and slicing of Bruker timsTOF raw
    data for mass spectrometry-based proteomics.
  license: "Apache-2.0"
  license_family: APACHE
  license_file: "LICENSE.txt"
  dev_url: "https://github.com/MannLabs/alphatims"
  doc_url: "https://alphatims.readthedocs.io/en/latest"

extra:
  recipe-maintainers:
    - jonasscheid
