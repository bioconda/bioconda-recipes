{% set name = "pyham" %}
{% set version = "2.0.1" %}
{% set sha256 = "591158271416c51332eb0565bda8beac8b30fd5c6db704e1719102d27beba685" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/85/03/ddca6c694d3a1e5b48c1e4210f7831e6112e582ade86e4dbece47a5845aa/pyham-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=3.10
    - numpy
    - scipy
    - lxml
    - ete4
    - python-brotli
    - requests
    - tqdm
test:
  imports:
    - pyham

about:
  home: https://github.com/DessimozLab/pyham
  summary: A tool to analyse Hierarchical Orthologous Groups (HOGs)
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - alpae
