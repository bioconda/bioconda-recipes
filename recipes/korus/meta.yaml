{% set version = "1.1.1" %}

package:
  name: korus
  version: {{ version }}

source:
  url: https://github.com/BirolLab/korus/releases/download/v{{ version }}/KORUS-{{ version }}.tar.gz 
  sha256: 7f2c10ac9e7b59747f224341775cd4adcd786f0a8e11810df297d72eac2390b8 

build:
  number: 0
  noarch: generic
  run_exports: 
    - {{ pin_subpackage("korus", max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - btllib >=1.7.1
  run:
    - python >=3.9
    - btllib >=1.7.1
    - snakemake
    - ntcard >=1.0.1
    - ntstat
    - numpy
    - pandas
    - scikit-learn
    - matplotlib-base
    - plotly
    - packaging
    - ntroot >=1.2.2


test:
  commands:
    - korus --version
    - korusEncode --help
    - korusDecode.py --help
    - korusAggregateMatrices.py --help
    - korusMatrix.py --help

about:
  home: https://github.com/BirolLab/korus
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: 'Probabilistic ancestry inference using Bloom filter-encoded k-mer signals'
