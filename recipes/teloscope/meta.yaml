{% set name = "teloscope" %}
{% set version = "0.1.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/vgl-hub/teloscope/releases/download/v{{version}}/teloscope.v{{version}}-with_submodules.zip
  sha256: 6277cc991a1929bc01670ae89e407aa091a48af51ce4e83f2c2334e7bca6f1fc

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('teloscope', max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - zlib
    - openssl
  run:
    - python
    - numpy
    - pandas
    - matplotlib-base

test:
  commands:
    - teloscope -h | grep "teloscope"
    - test -f $PREFIX/bin/scripts/teloscope_report.py
    - python3 $PREFIX/bin/scripts/teloscope_report.py --help

about:
  home: https://github.com/vgl-hub/teloscope
  dev_url: https://github.com/vgl-hub/teloscope
  doc_url: "https://github.com/vgl-hub/teloscope/blob/v{{ version }}/README.md"
  license_family: MIT
  license: MIT
  license_file: LICENSE
  summary: "A telomere annotation tools for genome assemblies."

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:teloscope
    - usegalaxy-eu:teloscope
    - doi:10.1093/bioinformatics/btac460
