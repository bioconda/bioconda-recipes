{% set name = "hmnrandomread" %}
{% set version = "0.13.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/guillaume-gricourt/HmnRandomRead/archive/{{ version }}.tar.gz
  sha256: 2a3ff155ed81b9d7e835e56ae910179c2751d302a56d3ae2a87a9eff8c094b19

build:
  number: 0
  script:
    - export LIBCLANG_PATH="$BUILD_PREFIX/lib"
    - cargo bundle-licenses --format yaml --output THIRDPARTY.yaml    
    - cargo install -v --locked --no-track --profile=release --root $PREFIX --path .
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - clangdev
    - make
    - pkg-config
    - cargo-bundle-licenses
  host:
    - perl
    - zlib
    - curl
    - openssl
  run:
    - openssl

test:
  commands:
    - HmnRandomRead version

about:
  home: "https://github.com/guillaume-gricourt/HmnRandomRead"
  summary: "A sequence-read simulator program for NGS."
  description: "A sequence-read simulator program for NGS."
  license: MIT
  license_file: 
    - LICENSE
    - THIRDPARTY.yaml
  dev_url: "https://github.com/guillaume-gricourt/HmnRandomRead"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - guillaume-gricourt
