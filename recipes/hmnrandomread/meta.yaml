{% set name = "hmnrandomread" %}
{% set version = "0.11.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/guillaume-gricourt/HmnRandomRead/archive/{{ version }}.tar.gz 
  sha256: cf7d8a01c118b3c8f5302917baa8fa4be75bdc3bc418aeb49fabe9ab7d82e39c

build:
  number: 0
  skip: true [osx]

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - htslib
  host:
    - htslib
  run:
    - python
    - pytest
    - htslib

test:
  source_files:
    - Makefile
  commands:
    - which HmnRandomRead
  requires:
    - make

about:
  home: https://github.com/guillaume-gricourt/HmnRandomRead
  summary: A sequence-read simulator program for NGS
  description: A sequence-read simulator program for NGS
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - guillaume-gricourt
