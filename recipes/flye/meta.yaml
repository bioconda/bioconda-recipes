{% set name = "flye" %}
{% set version = "2.9.7" %}
{% set sha256 = "041635b3b7e7afc69fd50ab9cbf040db4749b04ae626ba65c8b08f550642351f" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mikolmogorov/Flye/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - 0001-Makefile-aarch64.patch
    - 0002-src-Makefile.patch

build:
  number: 0
  entry_points:
    - flye = flye.main:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
  host:
    - python
    - pip
    - setuptools
    - zlib
  run:
    - python
    - setuptools  # [osx]

test:
  commands:
    - flye -h | grep "Assembly"
    - python -c "import flye.tests.test_toy as t; t.main()"

about:
  home: "https://github.com/mikolmogorov/Flye"
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  summary: "A fast and accurate de novo assembler for single molecule sequencing reads using repeat graphs."
  doc_url: "https://github.com/mikolmogorov/Flye/blob/flye/docs/USAGE.md"
  dev_url: "https://github.com/mikolmogorov/Flye"

extra:
  additional-platforms:
    - osx-arm64
    - linux-aarch64
  identifiers:
    - biotools:Flye
    - usegalaxy-eu:flye
    - doi:10.1038/s41592-020-00971-x
    - doi:10.1038/s41587-019-0072-8
    - doi:10.1073/pnas.1604560113
  skip-lints:
    - compiler_needs_stdlib_c
