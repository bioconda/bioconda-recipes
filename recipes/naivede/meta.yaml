{% set name = "naivede" %}
{% set version = "1.2.0" %}

context:
  version: "1.2.0"

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/naiveDE/NaiveDE-{{ version }}.tar.gz
  sha256: 339258edcb34a5e82661ec6b1ae850bf15dc875dd4fa687bb05d0721f25bf8ad

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps
  run_exports:
  - {{ pin_subpackage("naivede", max_pin="x.x.x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy
    - scipy
    - pandas
    - tqdm
    - patsy

test:
  imports:
    - NaiveDE
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/Teichlab/NaiveDE
  summary: The most trivial DE test based on likelihood ratio tests
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nilchia
