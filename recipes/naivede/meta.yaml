{% set name = "naivede" %}
{% set version = "1.3.1" %}
{% set commit = "34899669cc210fad62f28243432dc5ecf8697764" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/Teichlab/NaiveDE/archive/{{ commit }}.tar.gz
  sha256: 0702c44fa6196d4a43493cbaf0e4e1a1e35261bb12f06ea37ada8bdcf145ec81

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
  - {{ pin_subpackage("naivede", max_pin="x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy
    - scipy
    - pandas
    - tqdm
    - patsy
    - matplotlib-base

test:
  imports:
    - NaiveDE
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/Teichlab/NaiveDE
  dev_url: https://github.com/Teichlab/NaiveDE
  summary: The most trivial DE test based on likelihood ratio tests
  description: |
    NaiveDE is a Python package that implements a simple differential expression (DE) test based on likelihood ratio tests.
    It is designed to be easy to use and integrate into existing workflows for analyzing gene expression data.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nilchia
