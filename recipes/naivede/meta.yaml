{% set name = "naivede" %}
{% set version = "1.2.0" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/naiveDE/NaiveDE-{{ version }}.tar.gz
  sha256: 339258edcb34a5e82661ec6b1ae850bf15dc875dd4fa687bb05d0721f25bf8ad

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
  - {{ pin_subpackage("naivede", max_pin="x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy
    - scipy
    - pandas
    - tqdm
    - patsy

test:
  imports:
    - NaiveDE
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/Teichlab/NaiveDE
  dev_url: https://github.com/Teichlab/NaiveDE
  summary: The most trivial DE test based on likelihood ratio tests
  description: |
    NaiveDE is a Python package that implements a simple differential expression (DE) test based on likelihood ratio tests. It is designed to be easy to use and integrate into existing workflows for analyzing gene expression data.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nilchia
