{% set version = "0.8.1" %}
{% set github = "https://github.com/acidgenomics/r-acidgenomes" %}

package:
  name: r-acidgenomes
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 7f17b593cd4d027292eb019d16a4c21cff583d99a5692fceda5d984b2c90f22c

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('r-acidgenomes', max_pin="x.x") }}

requirements:
  host:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-genomeinfodb >=1.36.0
    - bioconductor-genomicranges >=1.52.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - r-acidbase >=0.7.5
    - r-acidcli >=0.3.3
    - r-acidgenerics >=0.7.6
    - r-acidplyr >=0.5.5
    - r-goalie >=0.7.8
    - r-pipette >=0.16.1
    - r-syntactic >=0.8.1
    # Suggests:
    - bioconductor-annotationdbi >=1.62.0
    - bioconductor-annotationhub >=3.8.0
    - bioconductor-biocfilecache >=2.8.0
    - bioconductor-biomart >=2.56.0
    - bioconductor-ensembldb >=2.24.0
    - bioconductor-genomicfeatures >=1.52.0
    - r-rvest >=1.0.3
    - r-withr >=2.5.0
  run:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-genomeinfodb >=1.36.0
    - bioconductor-genomicranges >=1.52.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - r-acidbase >=0.7.5
    - r-acidcli >=0.3.3
    - r-acidgenerics >=0.7.6
    - r-acidplyr >=0.5.5
    - r-goalie >=0.7.8
    - r-pipette >=0.16.1
    - r-syntactic >=0.8.1
    # Suggests:
    - bioconductor-annotationdbi >=1.62.0
    - bioconductor-annotationhub >=3.8.0
    - bioconductor-biocfilecache >=2.8.0
    - bioconductor-biomart >=2.56.0
    - bioconductor-ensembldb >=2.24.0
    - bioconductor-genomicfeatures >=1.52.0
    - r-rvest >=1.0.3
    - r-withr >=2.5.0

test:
  commands:
    - $R -e "library('AcidGenomes')"

about:
  home: https://r.acidgenomics.com/packages/acidgenomes/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: Toolkit for downloading and processing genome annotations.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
