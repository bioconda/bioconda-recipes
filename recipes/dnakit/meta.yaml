{% set name = "dnakit" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7ef8576f3be363e83ec2dd7790379fd044d52b428e4ab1f029e836f9f01db354

build:
  number: 0
  noarch: python
  entry_points:
    - dnakit = dnakit.cli.app:run
    - dnakit-mcp = dnakit.tools.server:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - pyyaml >=6.0
    - rich >=13.7
    - tomli >=2.0
    - typer >=0.12
    - requests >=2.32
    - jsonschema >=4.23
    - graphql-core >=3.2
    - pydantic >=2
    - httpx >=0.27
    - opentelemetry-sdk >=1.30

test:
  imports:
    - dnakit
  commands:
    - dnakit --version
    - dnakit normalize ACGU
    - pip check

about:
  home: "https://github.com/mapengsen/DNAKit"
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - DISCLAIMER.md
  summary: "Deterministic tools for DNA sequence analysis."
  description: |
    DNAKit is a reproducible Python toolkit for DNA sequence normalization,
    file conversion, descriptors, pattern scanning, similarity analysis,
    dataset preparation, evaluation, simulation, and visualization.
  doc_url: "https://mapengsen.github.io/DNAKit"
  dev_url: "https://github.com/mapengsen/DNAKit"

extra:
  recipe-maintainers:
    - mapengsen
