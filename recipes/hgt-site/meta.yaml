{% set name = "hgt-site" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/iraajgangavaram/hgt-site/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f2c5d8dd6c732ee7eb29290a62293b444329530ad47c1e58e51c862a6f362a57

build:
  number: 0
  noarch: python
  entry_points:
    - hgt-site = hgt_site.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
  run:
    - python >=3.9
    - pysam >=0.21

test:
  imports:
    - hgt_site
  commands:
    - hgt-site --help
    - hgt-site --version

about:
  home: https://github.com/iraajgangavaram/hgt-site
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Call candidate horizontal gene transfer sites from host alignments and Kraken2 read classifications."
  dev_url: https://github.com/iraajgangavaram/hgt-site
  doc_url: https://github.com/iraajgangavaram/hgt-site/blob/v{{ version }}/README.md

extra:
  recipe-maintainers:
    - iraajgangavaram
  identifiers:
    - doi:10.5281/zenodo.23842712
