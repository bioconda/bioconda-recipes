package:
  name: "shiba2sashimi"
  version: "0.2.0"

source:
  url: "https://files.pythonhosted.org/packages/4b/1c/849bdf421dc45343c399fd9e165117c55d09cedc129ca3a8f0a024611764/shiba2sashimi-0.2.0.tar.gz"
  sha256: "a1b2d7f882ab8bddc78cee3df16c67a786f57e762defc2c37cf7cfb0e378e2a7"

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage("shiba2sashimi", max_pin="x.x") }}
  script: $PYTHON -m pip install . --no-deps --ignore-installed -vvv

requirements:
  host:
    - python
    - pip
  run:
    - python
    - numpy >=1.18.0,<2.0.0
    - matplotlib-base >=3.1.0
    - pysam >=0.22.0

test:
  imports:
    - shiba2sashimi

about:
  home: "https://github.com/Sika-Zheng-Lab/shiba2sashimi"
  license: "MIT"
  license_file: "LICENSE"
  summary: "A utility for creating sashimi plot from Shiba output"
  description: "A utility to create Sashimi plots, a publication-quality visualization of RNA-seq data, from Shiba output."
  doc_url: "https://github.com/Sika-Zheng-Lab/shiba2sashimi"
  dev_url: "https://github.com/Sika-Zheng-Lab/shiba2sashimi"

extra:
  recipe-maintainers:
    - NaotoKubota
