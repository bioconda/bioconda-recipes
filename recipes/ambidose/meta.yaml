{% set name = "ambidose" %}
{% set version = "0.3.2" %}

package: 
  name: {{ name }}
  version: {{ version  }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4e3fd2cc79db996aee57d953094bea5285f0d428c08cd642621ae7ca57d8647f

build:
  number: 0
  noarch: python
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - ambidose = ambidose.cli:main
  run_exports:
    - {{ pin_subpackage('ambidose', max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61
  run:
    - python >=3.10
    - anndata >=0.8,<0.14
    - numpy >=1.23
    - pandas >=1.3
    - scipy >=1.7
    - h5py >=3.0
    - scanpy >=1.10
    - scikit-learn >=1.0
    - scikit-image >=0.19
    - threadpoolctl >=3.0
    - python-igraph >=0.10
    - scfair >=0.7

test:
  imports:
    - ambidose
  commands:
    - ambidose --version

about:
  home: https://github.com/leelieber2025/AmbiDose
  dev_url: https://github.com/leelieber2025/AmbiDose
  doc_url: https://ambidose.readthedocs.io
  summary: Per-cell ambient dose removal for droplet scRNA-seq
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE

extra:
  recipe-maintainers:
    - leelieber2025
