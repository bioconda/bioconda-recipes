{% set name = "binette" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}
source:
  url: https://github.com/genotoul-bioinfo/Binette/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f8defafffcc8a95b1a57d5ff9090793c24ae363f05d76dd22aab75acc3ee759c

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed -vv .
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}


requirements:
  host:
    - python >=3.12
    - pip
    - setuptools

  run:
    - python >=3.12
    - checkm2 >=1.1,<2.0
    # tensorflow 2.19 builds request an executable stack and fail to load with glibc >= 2.41
    # https://github.com/conda-forge/tensorflow-feedstock/issues/455
    - tensorflow >=2.17,<2.19
    - numpy >=1.24,<3.0
    - diamond >=2.1,<3
    - pandas >=2,<3
    - joblib >=1.0,<2.0
    - networkx >=3.0,<4.0
    - pyfastx >=2,<3
    - pyrodigal >=3.0,<4.0
    - typer >=0.9,<1.0
    - pyroaring >=1.0.0,<2.0.0
    - rich >=12.0.0,<16.0.0



test:
  imports:
    - binette
  commands:
    - binette -h

about:
  home: https://github.com/genotoul-bioinfo/Binette
  doc_url: https://binette.readthedocs.io
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: "A fast and accurate binning refinement tool to constructs high quality MAGs from the output of multiple binning tools."

extra:
  identifiers:
    - biotools:binette
    - usegalaxy-eu:binette
    - doi:10.21105/joss.06782
  recipe-maintainers:
    - JeanMainguy
