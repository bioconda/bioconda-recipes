{% set name = "breseq" %}
{% set version = "0.40.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/barricklab/breseq/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 7a98640f916a63047579c9f762922e2e29f1fa88a8d47860011fdc1005c046b1

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ stdlib("c") }}
    - {{ compiler("cxx") }}
    - autoconf
    - automake
    - libtool
    - pkg-config
  host:
    - zlib
  run:
    - r-base
    - r-cairo
    - bowtie2 >=2.0.0, !=2.0.3, !=2.0.4, !=2.3.1

test:
  commands:
    - breseq --help 2>&1 | grep Usage
    - gdtools --help 2>&1 | grep Usage

about:
  home: "https://github.com/barricklab/breseq"
  license: "GPL-2.0-or-later"
  license_family: GPL
  license_file: COPYING
  summary: "A computational pipeline for finding mutations relative to a reference sequence in short-read DNA re-sequencing data."
  doc_url: "https://barricklab.org/twiki/pub/Lab/ToolsBacterialGenomeResequencing/documentation"
  dev_url: "https://github.com/barricklab/breseq"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:breseq
    - biotools:breseq_bam2aln
    - biotools:breseq_bam2cov
    - usegalaxy-eu:breseq
