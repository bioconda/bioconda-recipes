{% set name = "kfb2zarr" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/camlloyd/kfb2zarr/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 902917e6cb3bdb61ecd8abd690b635fe1e25d4c706c6991bc1b4566f567dac03

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - cmake
    - make
    - pkg-config

test:
  commands:
    - kfb2zarr --help

about:
  home: https://github.com/camlloyd/kfb2zarr
  license: "MIT OR Apache-2.0"
  license_family: MIT
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  summary: Convert KFBio whole slide images (.kfb, .kfbf) to OME-Zarr

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - camlloyd
