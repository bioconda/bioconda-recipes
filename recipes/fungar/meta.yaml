{% set name = "fungar" %}
{% set version = "2.0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/resgen-br/fungar/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e7a98aef199305f3825495efdffcc797c022baf3079af6d8e9011fde539a6dd6

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.6
  run:
    - python >=3.6
    - pandas
    - diamond >=2.1.24,<2.2

test:
  commands:
    - fungar --help
    - fungar_report.py --help
    #- fungar_benchmark.py --help

about:
  home: "https://github.com/resgen-br/fungar"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "FUNGAR: antifungal resistance detection pipeline."
  description: |
    FUNGAR is a Bash pipeline for detecting antifungal resistance mutations
    directly from metagenomic short reads using DIAMOND and curated mutation databases.
  dev_url: "https://github.com/resgen-br/fungar"
