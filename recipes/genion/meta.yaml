{% set version = "1.2.3" %}
{% set sha256 = "4e38b69138d7f77289094f13be557ca7c51131ff3d019432c70dbca8c6362476" %}

package:
  name: genion
  version: {{ version }}

source:
  url: https://github.com/vpc-ccg/genion/archive/{{ version }}.zip
  sha256: {{ sha256 }}

build:
  number: 3
  run_exports:
    - {{ pin_subpackage('genion', max_pin="x") }}

requirements:
  build:
    - make
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - zlib

test:
  commands:
    - genion --help

about:
  home: "https://github.com/vpc-ccg/genion"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Characterizing gene fusions using long transcriptomics reads."
  dev_url: "https://github.com/vpc-ccg/genion"
  doc_url: "https://github.com/vpc-ccg/genion/blob/{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
