{% set version = "0.3.0" %}

package:
  name: skiver
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('skiver', max_pin='x.x') }}

source:
  url: https://github.com/GZHoffie/skiver/archive/v{{ version }}.tar.gz
  sha256: 85bc94e00fc84d966ed93e9fd68b069db23940ee3b3b2da7110a046ab25b0449

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - {{ stdlib("c") }}
    - {{ compiler("rust") }}
    - cmake
    - make
    - cargo-bundle-licenses

test:
  commands:
    - skiver --help

about:
  home: "https://github.com/GZHoffie/skiver"
  license: MIT
  license_family: MIT
  summary: "Reference-free quality control and error estimation for sequencing reads"
  license_file: 
    - LICENSE         # the license file for your package
    - THIRDPARTY.yml  # this file is generated by cargo-bundle-licenses
  dev_url: "https://github.com/GZHoffie/skiver"
  doc_url: "https://github.com/GZHoffie/skiver/blob/v{{ version }}/README.md"

extra:
  recipe-maintainers:
    - GZHoffie
  identifiers:
    - doi:https://doi.org/10.64898/2026.02.12.705514
  additional-platforms:
    - linux-aarch64
    - osx-arm64
