{% set version = "0.3.0" %}

package:
  name: skiver
  version: {{ version }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('skiver', max_pin='x.x') }}

source:
  url: https://github.com/GZHoffie/skiver/archive/v{{ version }}.tar.gz
  sha256: aff4c0531136377fb8ae60275e9bfaec59dcb143e2302c8c4ace927aadca4950

requirements:
  build:
    - {{ compiler("cxx") }}
    - {{ compiler("rust") }}
    - make
    - cmake >=3.12

test:
  commands:
    - skiver --help

about:
  home: "https://github.com/GZHoffie/skiver"
  license: MIT
  license_family: MIT
  summary: "Skiver is a tool that aims to perform quality control for a set of reads, estimating the sequencing error rates/types, without relying on the quality scores or the need for a reference genome."
  license_file: LICENSE
  dev_url: "https://github.com/GZHoffie/skiver"
  doc_url: "https://github.com/GZHoffie/skiver/blob/v{{ version }}/README.md"

extra:
  recipe-maintainers:
    - GZHoffie
  identifiers:
    - doi:https://doi.org/10.64898/2026.02.12.705514
  additional-platforms:
    - linux-aarch64
    - osx-arm64