{% set version = "2.4.2" %}
{% set name = "FLAMES" %}
{% set bioc = "3.22" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: 3b93f97d6adb9864db8a1f4d40d168e0
  patches:
    - 0001-do-not-vendor-minimap2-oarfish.patch
    - 0002-fix-basilisk-flames-env-package-versions.patch


build:
  number: 1
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-flames", max_pin="x.x") }}'

# Suggests: BiocStyle, GEOquery, ggrastr, knitr, rmarkdown, uwot, testthat (>= 3.0.0), xml2
# SystemRequirements: GNU make, C++17
requirements:

  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }} # build dependenvy installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L26
    - automake
    - make

  host:
    - bioconductor-bambu >=3.12.0,<3.13.0
    - r-xgboost >=3.1.2,<3.5 # There seem to be some version constraints here, but they remain unclear, and this should probably be fixed in the bioconda recipe for bioconductor-bambu. This is the best info I could find, and seems to refer to what ended up in Bioconductor release 3.22: https://github.com/GoekeLab/bambu/issues/447#issuecomment-3741976709
    - bioconductor-basilisk >=1.22.0,<1.23.0
    - bioconductor-biocgenerics >=0.56.0,<0.57.0
    - bioconductor-biocparallel >=1.44.0,<1.45.0
    - bioconductor-biostrings >=2.78.0,<2.79.0
    - bioconductor-complexheatmap >=2.26.0,<2.27.0
    - bioconductor-genomicalignments >=1.46.0,<1.47.0
    - bioconductor-genomicfeatures >=1.62.0,<1.63.0
    - bioconductor-genomicranges >=1.62.0,<1.63.0
    - bioconductor-ggbio >=1.58.0,<1.59.0
    - bioconductor-iranges >=2.44.0,<2.45.0
    - bioconductor-matrixgenerics >=1.22.0,<1.23.0
    - bioconductor-rhtslib >=3.6.0,<3.7.0
    - bioconductor-rsamtools >=2.26.0,<2.27.0
    - bioconductor-rtracklayer >=1.70.0,<1.71.0
    - bioconductor-s4arrays >=1.10.0,<1.11.0
    - bioconductor-s4vectors >=0.48.0,<0.49.0
    - bioconductor-scater >=1.38.0,<1.39.0
    - bioconductor-scran >=1.38.0,<1.39.0
    - bioconductor-scuttle >=1.20.0,<1.21.0
    - bioconductor-seqinfo >=1.0.0,<1.1.0
    - bioconductor-shortread >=1.68.0,<1.69.0
    - bioconductor-singlecellexperiment >=1.32.0,<1.33.0
    - bioconductor-spatialexperiment >=1.20.0,<1.21.0
    - bioconductor-summarizedexperiment >=1.40.0,<1.41.0
    - r-abind
    - r-base
    - r-circlize
    - r-cli
    - r-cowplot
    - r-crew
    - r-dplyr
    - r-ggplot2
    - r-gridextra
    - r-igraph
    - r-jsonlite
    - r-magick
    - r-magrittr
    - r-matrix
    - r-r.utils
    - r-rcolorbrewer
    - r-rcpp
    - r-readr
    - r-reticulate
    - r-scatterpie
    - r-stringr
    - r-testthat
    - r-tibble
    - r-tidyr
    - r-tidyselect
    - r-withr
    - libblas
    - liblapack
    - zlib
    - liblzma-devel
    - glpk # build dependency installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L11
    - libcurl # build dependency installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L12  , this implicitly pulls in openssl, another build dependency from the Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L13
    - libxml2-devel >=2.14.5 # build dependency installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L14
    - imagemagick # build dependency installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L16  , this implicitly also pulls in libpng, another build dependency from the Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L15
    - bzip2 # build dependency installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L17
    - ncurses # build dependency installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L19

  run:
    - bioconductor-bambu >=3.12.0,<3.13.0
    - bioconductor-basilisk >=1.22.0,<1.23.0
    - bioconductor-biocgenerics >=0.56.0,<0.57.0
    - bioconductor-biocparallel >=1.44.0,<1.45.0
    - bioconductor-biostrings >=2.78.0,<2.79.0
    - bioconductor-complexheatmap >=2.26.0,<2.27.0
    - bioconductor-genomicalignments >=1.46.0,<1.47.0
    - bioconductor-genomicfeatures >=1.62.0,<1.63.0
    - bioconductor-genomicranges >=1.62.0,<1.63.0
    - bioconductor-ggbio >=1.58.0,<1.59.0
    - bioconductor-iranges >=2.44.0,<2.45.0
    - bioconductor-matrixgenerics >=1.22.0,<1.23.0
    - bioconductor-rhtslib >=3.6.0,<3.7.0
    - bioconductor-rsamtools >=2.26.0,<2.27.0
    - bioconductor-rtracklayer >=1.70.0,<1.71.0
    - bioconductor-s4arrays >=1.10.0,<1.11.0
    - bioconductor-s4vectors >=0.48.0,<0.49.0
    - bioconductor-scater >=1.38.0,<1.39.0
    - bioconductor-scran >=1.38.0,<1.39.0
    - bioconductor-scuttle >=1.20.0,<1.21.0
    - bioconductor-seqinfo >=1.0.0,<1.1.0
    - bioconductor-shortread >=1.68.0,<1.69.0
    - bioconductor-singlecellexperiment >=1.32.0,<1.33.0
    - bioconductor-spatialexperiment >=1.20.0,<1.21.0
    - bioconductor-summarizedexperiment >=1.40.0,<1.41.0
    - r-abind
    - r-base
    - r-circlize
    - r-cli
    - r-cowplot
    - r-crew
    - r-dplyr
    - r-ggplot2
    - r-gridextra
    - r-igraph
    - r-jsonlite
    - r-magick
    - r-magrittr
    - r-matrix
    - r-r.utils
    - r-rcolorbrewer
    - r-rcpp
    - r-readr
    - r-reticulate
    - r-scatterpie
    - r-stringr
    - r-testthat
    - r-tibble
    - r-tidyr
    - r-tidyselect
    - samtools >=1.14 # runtime dependency installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L54  , version constraint from: https://github.com/mritchielab/FLAMES/issues/34#issuecomment-2153219282
    - oarfish >=0.8,<0.9 # runtime dependency manually installed in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L90
    - minimap2 >=2.29 # runtime dependency installed (?) as a permanent copy of the minimap2 source code: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/src/submodule/minimap2/minimap.h#L8  , the bioconda recipe includes k8, which seems to have been missing from the deb package in the past
    - libuv # runtime dependency installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L65 (probably for python env setup with basilisk?)
    - git # Avoid errors such as: Error in step barcode_demultiplex: bootstrapping of pyenv requires git to be installed, pipeline stopped.
    - pkg-config # build dependency installed via apt in Dockerfile: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/Dockerfile#L21 (seems to be needed for pyenv installation, which basilisk uses for python env installations)
    - python ==3.11.9 # IF YOU UPDATE THIS VERSION, ALSO UPDATE IT IN THE BASILISK_CUSTOM_PYTHON_ENV_X_Y_Z VARIABLES IN THE ACTIVATE AND DEACTIVATE SCRIPTS (activate.sh, activate.fish, deactivate.sh, deactivate.fish)  # This and the following dependecies are for basilisk env usage: https://github.com/mritchielab/FLAMES/blob/f8c31c2cec3e1b4e5558e0502cf8647461ace6f4/R/basilisk.R#L5-L13
    - pip # reticulate needs this to be present under macOS for using the above pre-installed python version, even though the reticulate pyenv install then re-installs a newer pip version

test:
  commands:
    # see run_test.r for more comprehensive test
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: GPL (>= 3)
  summary: 'FLAMES: Full Length Analysis of Mutations and Splicing in long read RNA-seq data'
  description: Semi-supervised isoform detection and annotation from both bulk and single-cell long read RNA-seq data. Flames provides automated pipelines for analysing isoforms, as well as intermediate functions for manual execution.
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

