{% set version = "5-cf8933" %}
{% set sha256 = "04f8f695e925fd842667b1839c960afef93deb05131eba478426f622b97ab6a0" %}

package:
  name: plass
  version: {{ version|replace("-", ".")  }}

source:
  url: https://github.com/soedinglab/plass/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - 3e436173321a2d0365a08bfb3b281108ed9ad414.patch

build:
  number: 4
  run_exports:
    - {{ pin_subpackage('plass', max_pin=None) }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - cmake
    - make
    - pkg-config
  host:
    - mpich-mpicc
    - mpich-mpicxx
    #- llvm-openmp  # [osx]
    #- libgomp      # [linux]
    - perl
    - gawk
    - zlib
    - bzip2
  run:
    - mpich-mpicc
    - mpich-mpicxx
    #- llvm-openmp  # [osx]
    #- libgomp      # [linux]
    - gawk

test:
  commands:
    - plass > /dev/null
    - penguin > /dev/null

about:
  home: "https://github.com/soedinglab/plass"
  license: "GPL-3.0-or-later"
  license_family: GPL3
  summary: "Plass (Protein-Level ASSembler) and PenguiN (Protein-guided Nucleotide assembler) are methods to assemble short read sequencing data on a protein level to proteins or DNA contigs."
  dev_url: "https://github.com/soedinglab/plass"
  doc_url: "https://github.com/soedinglab/plass/blob/{{ version }}/README.md"

extra:
  identifiers:
    - doi:10.1038/s41592-019-0437-4
    - doi:10.1186/s40168-024-01904-y
    - biotools:plass
  recipe-maintainers:
    - milot-mirdita
    - martin-steinegger
  additional-platforms:
    - linux-aarch64
    - osx-arm64
