{% set name = "anchorwave" %}
{% set version = "1.3.0" %}
{% set tag = "v1.3.0" %}
{% set sha256 = "158ee8435976e584e556c8085bccea0fd6b3322418cacea463a123788fcb4f87" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/baoxingsong/AnchorWave/archive/refs/tags/{{ tag }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: True  # [not unix]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - cmake >=3.10
    - {{ stdlib("c") }}
  host:
    - zlib
    - libgomp  # [linux]
  run:
    - gmap
    - minimap2

test:
  commands:
    - 'anchorwave --version | grep -F "anchorwave v1.3.0"'
    - 'anchorwave --help 2>&1 | grep -F "Usage: anchorwave"'
    - 'anchorwave genoAli -h 2>&1 | grep -F "fa3^2 (default: 50000)"'
    - 'printf "%s\n" ">reference" "ACGTACGT" > reference.fa'
    - 'printf "%s\n" ">query" "ACGTTCGT" > query.fa'
    - 'anchorwave ali -r reference.fa -s query.fa > alignment.fa'
    - 'test "$(grep -c ''^>'' alignment.fa)" -eq 2'

about:
  home: "https://github.com/baoxingsong/AnchorWave"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Sensitive alignment of genomes with high sequence diversity, extensive structural polymorphism, and whole-genome duplication variation.'
  dev_url: "https://github.com/baoxingsong/AnchorWave"
  doc_url: "https://github.com/baoxingsong/AnchorWave/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
