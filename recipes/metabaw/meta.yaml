{% set name = "metabaw" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/XiangZhouCAS/MetaBAW/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 942cef5f0f5388fc809a63433b7f71cce2f5791643905492e51271f90f408d41

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=69
  run:
    - python >=3.11
    - bash
    - git

test:
  imports:
    - metabaw
  commands:
    - metabaw -v
    - metabaw -h
    - metabaw bin -h
    - metabaw annotation -h
    - metabaw check -h

about:
  home: https://github.com/XiangZhouCAS/MetaBAW
  dev_url: https://github.com/XiangZhouCAS/MetaBAW
  license: MIT
  license_file: LICENSE
  summary: "MetaBAW: metagenome Binning Automated Workflow"

extra:
  recipe-maintainers:
    - XiangZhouCAS
