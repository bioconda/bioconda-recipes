{% set name = "plink2" %}
# PEP 440 form of the upstream tag: v2.0.0-b.X.0 -> 2.0.0bX (v2.0.0-b.X.Y ->
# 2.0.0bX.postY).
{% set version = "2.0.0b1.post3" %}
{% set tag = "v2.0.0-b.1.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/chrchang/plink-ng/archive/refs/tags/{{ tag }}.tar.gz
  sha256: e36dde2aad1f4b8980c8454f4b6a744016a1e4298eef8c130ffd433d92eaec23

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin=None) }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
  host:
    - zlib
    - zstd
    - openblas  # [linux]
  run:
    - libopenblas  # [linux]

test:
  commands:
    - plink2 --version | grep "PLINK v{{ tag[1:] }}"
    - test -x "${PREFIX}/bin/pgen_compress"
    - plink2 --dummy 200 500 --out dummy
    - plink2 --pfile dummy --maf 0.05 --freq --pca 2 --out out
    - test -s out.afreq
    - test -s out.eigenvec

about:
  home: https://www.cog-genomics.org/plink/2.0/
  dev_url: https://github.com/chrchang/plink-ng
  doc_url: https://www.cog-genomics.org/plink/2.0/
  license: GPL-3.0-or-later AND LGPL-3.0-or-later
  license_family: GPL3
  license_file:
    - 2.0/COPYING
    - 2.0/COPYING.LESSER
  summary: Whole genome association analysis toolset (PLINK 2.0)
  description: |
    PLINK 2.0 is a whole-genome association analysis toolset designed to
    handle VCF files, dosage data and multiallelic variants at biobank scale,
    using its .pgen/.pvar/.psam fileset.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1186/s13742-015-0047-8
    - biotools:plink
