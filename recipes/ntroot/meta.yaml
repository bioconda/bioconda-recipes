{% set name = "ntRoot" %}
{% set version = "1.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/BirolLab/ntRoot/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: a6602e28b3ad7f96b4b1aeefc3a8b74fb53b813a5c8149fcfba961a0e0f98351

build:
  number: 1
  noarch: generic
  run_exports: 
    - {{ pin_subpackage("ntroot", max_pin="x") }}

requirements:
  host:
    - perl
  run:
    - python <3.13
    - snakemake
    - samtools
    - ntedit >=2.0.2
    - perl
    - bedtools
    - plotly
    - pandas

test:
  commands:
    - ntroot -h

about:
  home: https://github.com/BirolLab/ntroot
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: 'Ancestry inference from genomic data'
