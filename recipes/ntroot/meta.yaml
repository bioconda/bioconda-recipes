{% set name = "ntRoot" %}
{% set version = "1.2.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/BirolLab/ntRoot/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: cd016f1e2ae2389f73da8975e16e55f09ef76b442e00d187340aa4a3221aae64

build:
  number: 0
  noarch: generic
  run_exports: 
    - {{ pin_subpackage("ntroot", max_pin="x") }}

requirements:
  host:
    - perl
  run:
    - python <3.13
    - snakemake
    - samtools
    - ntedit >=2.0.2
    - perl
    - bedtools
    - plotly
    - pandas

test:
  commands:
    - ntroot -h

about:
  home: https://github.com/BirolLab/ntroot
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: 'Ancestry inference from genomic data'
