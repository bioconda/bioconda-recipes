{% set name = "alphabase" %}
{% set version = "1.10.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 944778d207ec6c166398bbcc280323af4398488b89b9073f73cf79bd2d964653

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - setuptools
    - pip
  run:
    - python >=3.9
    - numba
    - numpy
    - pandas
    - h5py
    - contextlib2
    - python-xxhash
    - biopython
    - tqdm
    - regex
    - pyarrow
    - pyahocorasick
    - pyteomics
    - pyyaml
    - lxml
    - rdkit
    - certifi

test:
  imports:
    - alphabase
  commands:
    - pip check

about:
  home: "https://github.com/MannLabs/alphabase"
  summary: "An infrastructure Python package of the AlphaX ecosystem."
  description: |
    AlphaBase provides foundational data structures and utilities for
    mass spectrometry-based proteomics in the AlphaPept ecosystem.
  license: "Apache-2.0"
  license_family: APACHE
  license_file: "LICENSE.txt"
  dev_url: "https://github.com/MannLabs/alphabase"
  doc_url: "https://alphabase.readthedocs.io/en/latest"

extra:
  recipe-maintainers:
    - jonasscheid
