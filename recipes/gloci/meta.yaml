{% set version = "0.1.0" %}

package:
  name: gloci
  version: {{ version }}

source:
  url: https://github.com/duartemolha/gloci/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 38d08fc4332d049b537e6b22eb5c31aa302b8f99c00f663390e4a8ee7a2f13e3

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('gloci', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses

test:
  files:
    - test/a.bed
    - test/b.bed
    - test/expected.bed
  commands:
    - gloci --version
    - gloci genomes show hg38
    # conda copies the listed files with their test/ prefix.
    - cd test && gloci intersect -a a.bed -b b.bed | cmp - expected.bed
    - test -f $PREFIX/share/man/man1/gloci.1
    - test -f $PREFIX/share/bash-completion/completions/gloci
    - test -f $PREFIX/share/zsh/site-functions/_gloci
    - test -f $PREFIX/share/fish/vendor_completions.d/gloci.fish

about:
  home: https://github.com/duartemolha/gloci
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Fast genomic interval and VCF toolkit, one static binary (replaces bedtools, bedops, vcftools)
  dev_url: https://github.com/duartemolha/gloci

extra:
  recipe-maintainers:
    - duartemolha
  additional-platforms:
    - linux-aarch64
    - osx-arm64
