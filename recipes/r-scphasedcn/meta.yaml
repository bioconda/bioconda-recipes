{% set version = "0.1.1" %}

package:
  name: r-scphasedcn
  version: {{ version }}

source:
  url: https://github.com/ljwharbers/scphasedcn/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 9161d19cf8d0b057bd91f472cb4cfcd5cf8e3967559d1fdf717eb05e331e1d46

build:
  noarch: generic
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  script: $R CMD INSTALL --build . && install -m 0755 inst/scripts/call_scn.R $PREFIX/bin/call_scn.R
  run_exports:
    - {{ pin_subpackage("r-scphasedcn", max_pin="x.x") }}

requirements:
  host:
    - r-base >=4.2
    - r-data.table
    - r-fnn
    - r-irlba
    - r-mass
    - r-matrix
    - r-robustbase
    - r-yaml
    - bioconductor-genomicranges
    - bioconductor-iranges
    - bioconductor-rhdf5
    - bioconductor-rsamtools
  run:
    - r-base >=4.2
    - r-data.table
    - r-fnn
    - r-irlba
    - r-mass
    - r-matrix
    - r-robustbase
    - r-yaml
    - bioconductor-genomicranges
    - bioconductor-iranges
    - bioconductor-rhdf5
    - bioconductor-rsamtools
    - htslib
    - scphasedcn ={{ version }}

test:
  commands:
    - $R -e "library('scphasedcn')"
    - call_scn.R --help

about:
  home: https://github.com/ljwharbers/scphasedcn
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: Single-cell copy-number calling from SPLONGGET long-read single-cell DNA data (depth + read-phased alleles)
  dev_url: https://github.com/ljwharbers/scphasedcn
  doc_url: https://ljwharbers.github.io/scphasedcn/

extra:
  recipe-maintainers:
    - ljwharbers
