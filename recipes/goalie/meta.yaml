{% set version = "0.2.0" %}
{% set github = "https://github.com/acidgenomics/py-goalie" %}

package:
  name: goalie
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 50b6e67db41943e3ac54787603604e6bc13905403579a7a350ad0130a502e241

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  run_exports:
    - {{ pin_subpackage('goalie', max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - pip
    - uv-build >=0.11,<1
  run:
    - python >=3.12

test:
  imports:
    - goalie

about:
  home: https://python.acidgenomics.com/goalie/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE
  summary: Assertive check functions for defensive Python programming.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
