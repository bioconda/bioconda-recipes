{% set version = "1.22.0" %}
{% set name = "scuttle" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name }}/bioconductor-{{ name }}_{{ version }}_src_all.tar.gz
  md5: 0b280ee4d496aeaf91e773e5808b9ad9

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-scuttle", max_pin="x.x") }}'

# Suggests: BiocStyle, knitr, scRNAseq, rmarkdown, testthat, sparseMatrixStats, DelayedMatrixStats, scran
# SystemRequirements: C++11
requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
  host:
    - bioconductor-assorthead >=1.6.3,<1.7.0
    - bioconductor-beachmat >=2.28.0,<2.29.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-s4arrays >=1.12.1,<1.13.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-sparsearray >=1.12.3,<1.13.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-matrix
    - r-rcpp
    - libblas
    - liblapack
    - zlib
    - liblzma-devel
  run:
    - bioconductor-assorthead >=1.6.3,<1.7.0
    - bioconductor-beachmat >=2.28.0,<2.29.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-delayedarray >=0.38.2,<0.39.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-matrixgenerics >=1.24.0,<1.25.0
    - bioconductor-s4arrays >=1.12.1,<1.13.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-sparsearray >=1.12.3,<1.13.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - r-base
    - r-matrix
    - r-rcpp

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: GPL-3
  summary: Single-Cell RNA-Seq Analysis Utilities
  description: Provides basic utility functions for performing single-cell analyses, focusing on simple normalization, quality control and data transformations. Also provides some helper functions to assist development of other packages.
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:scuttle

