{% set name = "fastqsplitter" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 14cfb45eabe00de29886dbf2ad8dedd1b9990cb82ee194b5c41291533f3b879d

build:
  number: 9
  entry_points:
    - fastqsplitter = fastqsplitter:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - pip
    - setuptools
    - cython
    - python
    - xopen >=0.8.1
  run:
    - pigz  # Pigz is required for optimal speed. 
    - python
    - xopen >=0.8.1  # Version 0.8.1 includes important optimizations for reading gzipped files.

test:
  imports:
    - fastqsplitter
  commands:
    - fastqsplitter --help

about:
  home: "https://github.com/LUMC/fastqsplitter"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Splits FASTQ files evenly."
  doc_url: "https://fastqsplitter.readthedocs.io"
  dev_url: "https://github.com/LUMC/fastqsplitter"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - rhpvorderman
