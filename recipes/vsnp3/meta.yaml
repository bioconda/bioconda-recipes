{% set user = "USDA-VS" %}
{% set name = "vsnp3" %}
{% set version = "3.36" %}
{% set sha256 = "b4757cf716cbeb05700b2ce8841c27a2e6f45077422acc652652dd921649708e" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('vsnp3', max_pin="x") }}

source:
  url: https://github.com/{{ user }}/{{ name }}/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}

# Version policy, because these pins have been got wrong before:
#
#   * Floors are the oldest versions CI actually exercises.  A floor nothing
#     tests is a guess written down.
#   * Ceilings sit only at the next major, where a compatibility boundary is
#     known to be.  Do not add a ceiling to avoid testing a version; test it.
#     The one exception is spades, capped below a minor because the boundary
#     there is a packaging change rather than an API one.  See its entry.
#   * Never `<=`.  Conda pads the shorter version with zeros before comparing,
#     so `<=1.26` excludes 1.26.4 and pins numpy to exactly 1.26.0.  That is how
#     this recipe came to hold environments on numpy 1.26.0 and Python 3.12.0,
#     which in turn put scipy in a configuration it declares unsupported.
#     tests/test_release_consistency.py now fails on any `<=` here.
#
# numpy and pandas span the 1.x/2.x and 2.x/3.x boundaries deliberately: both
# ends are exercised by the CI matrix, and the cross-version-agreement job
# proves they produce identical calls.  Do not narrow them without evidence.
requirements:
  run:
    # 3.12 is not a preference: bin/vsnp3_alignment_vcf.py and
    # bin/vsnp3_best_reference_sourmash.py use PEP 701 f-strings, which are a
    # SyntaxError before 3.12.  noarch adds no python constraint of its own, so
    # this line is the only thing stopping an install into a 3.11 env.
    - python >=3.12,<3.14
    - bcftools
    - biopython >=1.84          # 1.84 is the numpy 2 release
    - bwa
    - minimap2 >=2.24
    - dask >=2024.6             # 2024.6 is the numpy 2 / pandas 2.2 release
    - freebayes >=1.3.5
    - vcflib=1.0.12
    - humanize >=3.14.0
    - numpy >=1.26.4,<3
    # 2.2.2 is the first pandas built against numpy 2; everything below it
    # assumes the numpy 1 C-ABI.  <3 is held for now because pandas 3 makes
    # copy-on-write mandatory and changes the default string dtype.
    - pandas >=2.2.2,<3
    - openpyxl >=3.0.9
    - xlsxwriter >=3.0.2
    - parallel
    - pigz
    - regex >=2.5.110
    - samtools >=1.14
    - seqkit >=2.1.0
    - sourmash >=4.8.4
    # Capped below 4.2 to keep openmpi out of the environment.  bioconda rebuilt
    # spades 4.2.0 against MPI (build h8d6e82b_1 onward, and all of 4.3.x), which
    # drags in openmpi and the mpi metapackage -- three extra packages, and a
    # transport layer this pipeline never uses: vsnp3_assembly.py shells out to
    # `spades.py --careful` on a single node and never to spades-mpi.  The cap is
    # on the minor because the MPI-free 4.2.0 build (haf24da9_0) is older than the
    # MPI ones at the same version, so the solver takes the MPI build if 4.2 is
    # admitted at all.  Lift this when bioconda ships a nompi variant.
    - spades >=3.15.2,<4.2
    - py-cpuinfo
    - raxml >=8.2.12
    - plotly >=5.22,<7          # writes the HTML tree, which is a compared artifact
    - pyyaml
    - jinja2                    # renders the step 1 HTML report
    # Renders that same HTML to the PDF written beside it.  The floor is a tested
    # one: 66 and 69 both produce the report, and 61 does not -- conda resolves it
    # against pydyf 0.11, whose PDF() signature it predates, so every conversion
    # raises TypeError.  The report's CSS also avoids grid, unimplemented before
    # 63.  Do not lower this without rendering a report at the new floor.
    - weasyprint >=66
    - matplotlib-base >=3.9,<4  # 3.9 is the numpy 2 release
    # Reached through seaborn's kdeplot, and the package that actually pinned
    # down the numpy floor: scipy 1.17 requires numpy >=1.26.4.  Declared
    # explicitly because it otherwise arrives only as a dependency of the
    # seaborn metapackage.
    - scipy >=1.11,<2
    - seaborn >=0.13.2,<1       # 0.13.2 is the numpy 2 release

test:
  commands:
    # Load the import graph of both entry points and confirm every script reports
    # the same version.  The previous test was `vsnp3_step1.py -h` alone, so a
    # broken import anywhere in step2 was not caught at build time.
    - vsnp3_step1.py --help
    - vsnp3_step2.py --help
    - vsnp3_step1.py --version
    - vsnp3_step2.py --version
    - vsnp3_annotation.py --version
    - vsnp3_group_on_defining_snps.py --version
    - vsnp3_path_adder.py --version
    # Confirms the installed $PREFIX/bin agrees end to end, which a
    # per-script --version cannot.
    - vsnp3_version.py --check

about:
  home: https://github.com/{{ user }}/{{ name }}
  license: GPL3
  license_file: LICENSE
  summary: Rapidly call, validate, and compare SNPs from FASTQ files in a timely manner utilizing large data sets.
  dev_url: https://github.com/USDA-VS/vsnp3