{% set name = "perl-http-date" %}
{% set version = "6.07" %}
{% set sha256 = "278c875a1abae8b3afaf7961c8dfe8ea21b37e04ce8fe3c387e7eb999c1d2128" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/HTTP-Date-6.07.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
  host:
    - perl 
    - perl-time-local >=1.28
    - perl-datetime-timezone
    - perl-extutils-makemaker
    - perl-file-spec 
    - perl-io-handle
    - perl-test-more 
  run:
    - perl
    - perl-exporter 
    - perl-time-local >=1.28
    - perl-datetime-timezone
    - perl-timedate

test:
  imports:
    - HTTP::Date

about:
  home: http://metacpan.org/pod/HTTP::Date
  license: perl_5
  summary: 'date conversion routines'
