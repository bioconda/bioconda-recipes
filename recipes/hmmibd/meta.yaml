{% set version = "2.1.3" %}
{% set sha256 = "bcca76a327accbe7d06e8a63d20a856ab6514676789c07f5b76c53e92e11bcfe" %}

package:
  name: hmmibd
  version: {{ version }}

source:
  url: https://github.com/glipsnort/hmmIBD/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  run:
    - python

test:
  commands:
    - hmmIBD 2>&1 | grep -qF 'Usage'

about:
  home: https://github.com/glipsnort/hmmIBD
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: A hidden Markov model for detecting segments of shared ancestry (identity by descent) in haploid genomes

extra:
  identifiers:
    - biotools:hmmIBD
    - doi:10.1186/s12936-018-2349-7
