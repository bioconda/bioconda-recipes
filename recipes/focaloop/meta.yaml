{% set name = "focaloop" %}
{% set version = "0.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/nekrut/focaloop/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 49e2ab017be3fafff72d4d0fc0d2b9f4a36858c6c0898f9fe6edcf5c3fb8f679

build:
  number: 0
  skip: true  # [py < 310 or win]
  entry_points:
    - focaloop = focaloop.cli:main
  run_exports:
    - {{ pin_subpackage('focaloop', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  host:
    - python
    - pip
    - setuptools >=68
  run:
    - python
    - numpy >=1.24
    - pandas >=2.0
    - pyarrow >=14
    - scipy >=1.10
    - pyyaml >=6
    - requests >=2.28
    - zstandard >=0.21
    - pydeseq2 >=0.4.12
    - statsmodels >=0.14
    - scikit-learn >=1.5
    - numba >=0.58
    - mappy >=2.26
    - pysam >=0.22
    - biopython >=1.83
    - bwa >=0.7.17
    - bwa-mem2 >=2.2.1
    - strobealign >=0.14.0
    - minimap2 >=2.28
    - hisat2 >=2.2.1
    - salmon >=1.10.3
    - piscem >=0.10.3
    - samtools >=1.21
    - bcftools >=1.21
    - htslib >=1.21
    - miniprot
    - diamond
    - stringtie
    - gffcompare
    - seqkit
    - hmmer
    - infernal
    - trnascan-se
    - barrnap
    - curl
    - zstd

test:
  imports:
    - focaloop
    - focaloop.panexpr
    - focaloop.malariavar
    - focaloop.geneloop
  commands:
    - focaloop --version
    - focaloop expressionloop --help
    - focaloop variationloop --help
    - focaloop geneloop --help
    - focaloop query --help

about:
  home: https://github.com/nekrut/focaloop
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Adaptive byte-budgeted streaming loops for RNA-seq expression, genomic variation, and eukaryotic genome annotation"
  dev_url: https://github.com/nekrut/focaloop

extra:
  recipe-maintainers:
    - nekrut
