{% set name = "mantpy" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 106b784f0d69d5cc2c7f573f78bfc1016a685c6555f95866dcd584184071d555

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  number: 0
  run_exports:
    - {{ pin_subpackage("mantpy", max_pin="x") }}

requirements:
  host:
    - python >=3.11,<3.14
    - hatch-vcs
    - hatchling
    - pip
  run:
    - python >=3.11,<3.14
    - anndata >=0.12
    - dask-core >=2024.10
    - igraph >=0.10
    - leidenalg >=0.10
    - joblib >=1.3
    - matplotlib-base >=3.8
    - networkx >=3.2
    - numpy >=1.24,<2.5
    - pandas >=2.1
    - pillow >=10
    - pooch >=1.8
    - requests >=2.28
    - scanpy >=1.10,<1.13
    - scikit-image >=0.21
    - scikit-learn >=1.4
    - scipy >=1.11
    - seaborn >=0.13
    - squidpy >=1.8.2,<1.9
    - tifffile >=2025.5.21
    - tqdm >=4.66
    - zarr >=3.1,<3.2

test:
  imports:
    - mantpy
  commands:
    - pip check
  requires:
    - pip

about:
  summary: A framework for extracellular matrix analysis in spatial proteomics
  home: https://github.com/moeghaf/Mantpy
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nilchia
