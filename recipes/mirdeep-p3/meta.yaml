# bioconda recipe for mirdeep-p3
# Source recipe: conda.recipe/ in the mirdeep-p3 repo
package:
  name: mirdeep-p3
  version: "3.1.4c"

source:
  url: https://github.com/YangXZ-lab/mirdeep-p3/archive/refs/tags/v3.1.4c.tar.gz
  sha256: 0b581109fae168bedb00e021d9a79e5868ace85680507d9c01cb4dec83171623

build:
  number: 0
  noarch: generic

requirements:
  run:
    # Python core
    - python >=3.9
    - biopython >=1.81
    - numpy >=1.26
    - pyyaml >=6.0
    - openpyxl >=3.0
    - xlsxwriter >=3.0

    # alignment / mapping
    - bowtie 1.3.1
    - bowtie2 >=2.5
    - samtools >=1.17
    - bedtools >=2.30
    - seqkit >=2.4
    - viennarna >=2.7,<2.8
    - trim-galore >=0.6.7

    # annotation / homology
    - blast >=2.13
    - hmmer >=3.3
    - fasta3 >=36.3.8
    - mmseqs2 >=14
    - diamond >=2.0
    - eggnog-mapper >=2.1
    - meme >=5.4
    - prodigal >=2.6
    - gffread >=0.12

    # R plotting
    - r-base >=4.2
    - r-ggplot2 >=3.4
    - r-dplyr >=1.0
    - r-tidyr >=1.2
    - r-stringr >=1.4
    - r-scales >=1.2
    - r-optparse >=1.7
    - r-patchwork >=1.1
    - r-gridextra >=2.3
    - r-viridis >=0.6
    - r-circlize >=0.4.14
    - r-svglite >=2.1
    - r-ggrepel >=0.9
    - r-ggraph >=2.1
    - r-igraph >=1.5
    - r-data.table >=1.14
    - r-openxlsx >=4.2
    - r-jsonlite >=1.8
    - r-ape >=5.7

    # Bioconductor
    - bioconductor-clusterprofiler >=4.10
    - bioconductor-complexheatmap >=2.18
    - bioconductor-deseq2 >=1.42
    - bioconductor-apeglm >=1.24
    - bioconductor-enrichplot >=1.22
    - bioconductor-gosemsim >=2.28
    - bioconductor-dose >=3.28
    - bioconductor-annotationforge >=1.44
    - bioconductor-ggtree >=3.10
    - bioconductor-biostrings >=2.70
    - bioconductor-genomicranges >=1.54
    - bioconductor-iranges >=2.36
    - bioconductor-go.db >=3.18
    - bioconductor-keggrest >=1.42

test:
  commands:
    - mirdeep-p3 --version
    - mirdeep-p3 -h
    - mirdeep-p3 identification -h

about:
  home: https://github.com/YangXZ-lab/mirdeep-p3
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: "Plant miRNA discovery and functional annotation pipeline"

extra:
  recipe-maintainers:
    - mercedes-cykt
