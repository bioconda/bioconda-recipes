{% set name = "piper" %}
{% set version = "0.15.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 87b153fe291453a7f56af975c20d2f5da3c0c258d55e99e824552dc83fbe5e7d

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  #script: 2to3 . && {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - pip
    - python >=3
    - hatchling
  run:
    - logmuse >=0.2.4
    - pandas
    - psutil
    - python >=3
    - ubiquerg >=0.8.0
    - yacman >=0.9.3
    - pipestat >=0.11.0
    - importlib_metadata

test:
  imports:
    - pypiper
  requires:
    - coveralls >=1.1
    - hypothesis
    - mock ==2.0.0
    - pytest >=4.2.1
    - pytest-cov ==2.6.1
    - veracitools

about:
  home: "https://github.com/databio/pypiper"
  license: "BSD-2-Clause"
  license_family: BSD
  license_file: "LICENSE.txt"
  dev_url: "https://github.com/databio/pypiper"
  doc_url: "https://pypiper.databio.org/en/latest"
  summary: "A lightweight python toolkit for gluing together restartable, robust command line pipelines."

extra:
  recipe-maintainers:
    - michalstolarczyk
