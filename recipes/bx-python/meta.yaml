{% set name = "bx-python" %}
{% set version = "0.16.0" %}
{% set sha256 = "28d53abb81019e89d73fe82c58ff7213cc3cafdcc0f5c0505fcf4fc47f6785d1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/bx_python-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  skip: True  # [py < 311]
  script:
    - export LDFLAGS="${LDFLAGS} -L${PREFIX}/lib"
    - export CFLAGS="${CFLAGS} -I${PREFIX}/include -O3"  # [not osx]
    - export CFLAGS="${CFLAGS} -I${PREFIX}/include -O3 -fno-define-target-os-macros"  # [osx]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pkg-config
  host:
    - python
    - pip
    - setuptools >=77.0.0
    - cython
    - numpy >=1.25
    - zlib
  run:
    - python
    - pyparsing
    - numpy >=1.25

test:
  imports:
    - bx
    - bx.align
    - bx.align.sitemask
    - bx.align.tools
    - bx.arrays
    - bx.bbi
    - bx.cookbook
    - bx.intervals
    - bx.intervals.operations
    - bx.intseq
    - bx.misc
    - bx.motif
    - bx.motif.io
    - bx.motif.logo
    - bx.phylo
    - bx.phylo.newick
    - bx.pwm
    - bx.seq
    - bx.tabular
    - bx_extras

about:
  home: "https://github.com/bxlab/bx-python"
  summary: "Tools for manipulating biological data, particularly multiple sequence alignments."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: "https://bx-python.readthedocs.io/en/latest"
  dev_url: "https://github.com/bxlab/bx-python"

extra:
  identifiers:
    - biotools:bx-python
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - nsoranzo
