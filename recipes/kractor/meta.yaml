{% set version = "5.0.0" %}
{% set name = "kractor" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/sam-sims/{{ name }}/archive/{{ name }}-{{ version }}.tar.gz
  sha256: d2ee04f3794566c3ec2627f9ebac61537fa3c159ff272ad9f66747cef9e1c8a1

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('kractor', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - cargo-bundle-licenses

test:
  commands:
    - kractor --version

about:
  home: https://github.com/Sam-Sims/kractor
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Rapidly extract reads from a FASTQ file based on taxonomic classification via Kraken2.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - sam-sims
