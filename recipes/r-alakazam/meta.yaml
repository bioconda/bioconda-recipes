{% set name = "alakazam" %}
{% set version = "1.2.1" %}
{% set native = 'm2w64-' if win else '' %}

package:
  name: r-{{ name }}
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/{{ name }}_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
  sha256: 161c87a946857da2b876f679abc4ae8d265835c92c0d56e0ecacf0aea04084d4

build:
  number: 5
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports:
  - {{ pin_subpackage('r-alakazam', max_pin="x") }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
  host:
    - r-base
    - bioconductor-biostrings >=2.56.0
    - bioconductor-genomicalignments >=1.24.0
    - bioconductor-iranges >=2.22.2
    - r-matrix
    - r-rcpp >=0.12.12
    - r-airr >=1.3
    - r-ape
    - r-dplyr >=1.0
    - r-ggplot2 >=3.3.4
    - r-igraph >=1.0
    - r-progress
    - r-readr
    - r-rlang
    - r-scales
    - r-seqinr
    - r-stringi
    - r-tibble
    - r-tidyr >=1.0
  run:
    - r-base
    - bioconductor-biostrings >=2.56.0
    - bioconductor-genomicalignments >=1.24.0
    - bioconductor-iranges >=2.22.2
    - r-matrix
    - r-rcpp >=0.12.12
    - r-airr >=1.3
    - r-ape
    - r-dplyr >=1.0
    - r-ggplot2 >=3.3.4
    - r-igraph >=1.0.0
    - r-progress
    - r-readr
    - r-rlang
    - r-scales
    - r-seqinr
    - r-stringi
    - r-tibble
    - r-tidyr >=1.0

test:
  commands:
    - $R -e "library('alakazam')"

about:
  home: "https://github.com/immcantation/alakazam"
  license: "AGPL-3.0-or-later"
  summary: "Provides methods for high-throughput adaptive immune receptor repertoire sequencing (AIRR-Seq; Rep-Seq) analysis. In particular, immunoglobulin (Ig) sequence lineage reconstruction, lineage topology analysis, diversity profiling, amino acid property analysis and gene usage."
  license_family: AGPL
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/AGPL-3'
  doc_url: "https://alakazam.readthedocs.io/en/stable"
  dev_url: "https://github.com/immcantation/alakazam"

extra:
  identifiers:
    - doi:10.1093/bioinformatics/btv359
    - doi:10.1126/scitranslmed.3008879
  skip-lints:
    - in_other_channels
  recipe-maintainers:
    - ggabernet
  additional-platforms:
    - linux-aarch64
    - osx-arm64
