{% set name = "cytospace-sc" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/digitalcytometry/cytospace/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 29d9207cb2ebc6d6ce88ab4abe6084c965ec20b3a86aaca37d96c7bb490e4b30

build:
  number: 0
  noarch: python
  #skip: true  # [osx and arm64]
  run_exports:
    - {{ pin_subpackage("cytospace-sc", max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
  run:
    - setuptools <82
    - python >=3.9
    - numpy >=1.26
    - scipy >=1.11
    - pandas >=2.2
    - matplotlib-base >=3.8
    - scanpy >=1.9.6
    - lap >=0.5.12
    - ortools-python >=9.2 # [not osx]
    - gdown >=4.7
    - r-base >=4.3
    - r-seurat >=5.0
    - r-matrix >=1.6
    - r-spatstat >=3.0
    - r-argparse >=2.3
    - bioconductor-glmgampoi >=1.16
    - datatable >=1.1.0 # [not osx]

test:
  imports:
    - cytospace
  commands:
    - cytospace --help

about:
  home: https://github.com/digitalcytometry/cytospace
  license: LicenseRef-Stanford-NC
  license_file: LICENSE
  summary: >-
    Optimal mapping of scRNA-seq data to spatial transcriptomics data
    via shortest-augmenting-path linear assignment.
  description: |
    CytoSPACE is a computational tool for assigning single-cell
    transcriptomes to in situ spatial transcriptomics (ST) data.
    It minimizes a correlation-based cost function through a linear
    programming optimization routine, yielding globally optimal
    cell-to-spot assignments without requiring batch correction or
    gene selection.

extra:
  identifiers:
    - doi:10.1038/s41587-023-01697-9
    - biotools:cytospace
  recipe-maintainers:
    - LuisHeinzlmeier