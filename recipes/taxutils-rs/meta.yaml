{% set name = "taxutils-rs" %}
{% set crate = "taxutils" %}
{% set version = "1.0.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://static.crates.io/crates/{{ crate }}/{{ crate }}-{{ version }}.crate
  sha256: 59f2f4efc9d60d8547ed2f63ba2c9b180c51626c16b3cbc7b99b44ec9ad660c1

build:
  number: 0
  script:
    - tar -xzf "{{ crate }}-{{ version }}.crate"
    - cd "{{ crate }}-{{ version }}"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cargo install --locked --no-track --root "${PREFIX}" --path .
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("rust") }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses
    - tar

test:
  commands:
    - tu --help
    - tu --version

about:
  home: https://github.com/SwabSeq/taxutils-rs
  license: MIT
  license_family: MIT
  license_file:
    - taxutils-{{ version }}/LICENSE
    - taxutils-{{ version }}/THIRDPARTY.yml
  summary: "Rust utilities for working with NCBI taxonomic data and FASTA files."
  description: |
    taxutils-rs provides the tu command-line program and a Rust library for
    working with NCBI taxonomy data, accession-to-taxid mappings, corrected
    taxonomic ranks, target taxa, and FASTA files.
  doc_url: https://docs.rs/taxutils
  dev_url: https://github.com/SwabSeq/taxutils-rs

extra:
  recipe-maintainers:
    - "wgobrien"
  authors:
    - "William O'Brien"
