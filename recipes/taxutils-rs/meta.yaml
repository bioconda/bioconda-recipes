{% set name = "taxutils-rs" %}
{% set version = "1.1.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/SwabSeq/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 005df08b5381b0b5f58bb45a9e5a67aaceebcd819dc2ed2c303b629704060d39

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cargo install -v --locked --no-track --root "${PREFIX}" --path .
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("rust") }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses

test:
  commands:
    - tu --help
    - tu --version

about:
  home: https://github.com/SwabSeq/taxutils-rs
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "Rust utilities for working with NCBI taxonomic data and FASTA files."
  description: |
    taxutils-rs provides the tu command-line program and a Rust library for
    working with NCBI taxonomy data, accession-to-taxid mappings, corrected
    taxonomic ranks, target taxa, and FASTA files.
  doc_url: https://docs.rs/taxutils
  dev_url: https://github.com/SwabSeq/taxutils-rs

extra:
  recipe-maintainers:
    - wgobrien
  authors:
    - "William O'Brien"
