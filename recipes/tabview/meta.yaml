{% set version = "1.5.0" %}

package:
  name: tabview
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/tabview/tabview-{{ version }}.tar.gz
  sha256: d28f1a638c5bcf01280b8fc292a83caa872a5001293f04dcb35a9afe60bd7c96

build:
  number: 0
  noarch: python
  entry_points:
    - tabview = tabview.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage('tabview', max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - hatchling
    - pip
  run:
    - python >=3.11

test:
  imports:
    - tabview
  commands:
    - tabview -h > /dev/null || [[ "$?" == 2 ]]

about:
  home: "https://github.com/Tabviewer/tabview"
  license: MIT
  license_family: MIT
  license_file: "LICENSE.txt"
  dev_url: "https://github.com/Tabviewer/tabview"
  summary: "A curses command-line CSV and list (tabular data) viewer."
