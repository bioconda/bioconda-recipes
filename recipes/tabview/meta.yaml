package:
  name: tabview
  version: "1.5.0"

source:
  url: https://files.pythonhosted.org/packages/1a/b0/b0e7b597357942b8cf23a09a3805ea6226fce5325d7315aa5d90076893b7/tabview-1.5.0.tar.gz
  sha256: d28f1a638c5bcf01280b8fc292a83caa872a5001293f04dcb35a9afe60bd7c96

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --ignore-installed --no-deps -vv

requirements:
  host:
    - python
    - setuptools
    - ncurses

  run:
    - python
    - ncurses

test:
  imports:
    - tabview

  commands:
    - tabview -h > /dev/null || [[ "$?" == 2 ]]

about:
  home: https://github.com/firecat53/tabview
  license: MIT License
  summary: 'A curses command-line CSV and list (tabular data) viewer'
