{% set version = "0.3.1" %}
{% set sha256 = "780f8fc1373eb83e1d0d4545802c015ffd1206d4f4dc2b3ecaaef21fe192f7bb" %}

package:
  name: sansa
  version: '{{ version }}'

source:
  url: https://github.com/dellytools/sansa/archive/v{{ version }}.tar.gz
  sha256: '{{ sha256 }}'

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('sansa', max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - zlib
    - bzip2
    - boost-cpp
    - xz
    - htslib
  run:
    - boost-cpp
    - htslib

test:
  commands:
    - sansa --help

about:
  home: https://github.com/dellytools/sansa
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Structural variant annotation
  dev_url: "https://github.com/dellytools/sansa"
  doc_url: "https://github.com/dellytools/sansa/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
