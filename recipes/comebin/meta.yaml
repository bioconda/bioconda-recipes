package:
  name: comebin
  version: "1.1.0"

source:
  url: https://github.com/ziyewang/COMEBin/archive/refs/tags/1.1.0.tar.gz
  sha256: d17310f5b96e8295ba785c731a86f2782b8386befdd2a2ed54842f2fa9f321bf

build:
  number: 1
  noarch: generic
  run_exports:
    - {{ pin_subpackage('comebin', max_pin="x.x") }}

requirements:
  run:
    - atomicwrites >=1.4.1
    - bedtools >=2.31.0
    - biolib >=0.1.6
    - biopython >=1.76
    - bwa >=0.7.17
    - checkm-genome >=1.2.3
    - click >=8.4.2
    - fraggenescan >=1.31 
    - gdown >=6.1.0
    - hmmer >=3.4
    - hnswlib >=0.8.0
    - igraph >=1.0.0
    - joblib >=1.5.3
    - leidenalg >=0.12.0
    - matplotlib-base >=3.10
    - matplotlib-inline >=0.1.3
    - numba >=0.66.0
    - networkx >=3.6.1
    - numpy >=2.4.6
    - pandas >=3.0.3
    - pplacer >=1.1.alpha19
    - prodigal >=2.6.3
    - python >=3.13
    - python-dateutil >=2.8.2
    - python-fastjsonschema >=2.15.3
    - pytorch >=2.13.0
    - pyyaml >=6.0
    - ruamel.yaml >=0.19.1
    - samtools >=1.24
    - scanpy >=1.12.2
    - scikit-learn >=1.9.0
    - scipy >=1.18.0
    - seaborn >=0.13.2
    - setuptools >=80.9.0
    - tensorboard >=2.20.0
    - tqdm

test:
  commands:
    - which run_comebin.sh 
    - which gen_cov_file.sh

about:
  home: "https://github.com/ziyewang/COMEBin"
  license: BSD
  summary: "COMEBin allows effective binning of metagenomic contigs using COntrastive Multi-viEw representation learning"
