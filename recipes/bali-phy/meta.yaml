{% set version = "4.3" %}

package:
  name: bali-phy
  version: {{ version }}

source:
  url: https://github.com/bredelings/bali-phy/archive/{{ version }}.tar.gz
  sha256: 02ea2f882ed55cd5cc1d4b15ceb56861c729f20f6302fbd3e65c8c61b848e3c6

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('bali-phy', max_pin='x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - meson >=1.6
    - ninja
    - pkg-config
    - pandoc
  host:
    - eigen >=3.4.0
    - libboost-devel >=1.91
    - cereal
    - fmt >=12
    - glib
    - cairo
    - freetype
    - expat
    - xorg-xorgproto  # [linux]
    - zlib
    - xxhash
    - cli11 >=2.6.1
    - libutf8proc
    - zstd
    - zstd-static
  run:
    - gnuplot
    - r-base
    - perl
    - python >=3

about:
  home: https://www.bali-phy.org
  dev_url: https://github.com/bredelings/BAli-Phy/
  license: GPL-2.0-only
  license_family: GPL
  license_file: COPYING
  summary: Bayesian co-estimation of phylogenies and multiple sequence alignments.

test:
  commands:
    - bali-phy help
    # Exercise installed model loading and MCMC; help alone misses missing runtime files/libraries.
    - bali-phy "$PREFIX/share/doc/bali-phy/examples/5S-rRNA/25-muscle.fasta" --test --seed=12345
    # Keep container-owned output off the mounted test directory so host cleanup succeeds.
    - >-
      (test_dir=$(mktemp -d /tmp/bali-phy-test.XXXXXXXX) &&
      trap 'rm -rf "$test_dir"' EXIT &&
      cd "$test_dir" &&
      bali-phy "$PREFIX/share/doc/bali-phy/examples/5S-rRNA/5d.fasta" --iterations=20 --seed=12345)
    - bpy-summarize --help
    - bpy-subsample --help
    - character-properties --help

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.1093/bioinformatics/btab129
    - biotools:bali-phy
