{% set version = '1.4.3' %}

package:
   name: genera
   version: {{ version|replace('-', '_') }}

source:
  - url: https://github.com/josuebarrera/GenEra/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 0d494b846c15b45b012d620a622bb30b0d74e9fcad48b826ffe85dd0fa803fb1

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('genera', max_pin="x.x") }}

requirements:
  host:
    - python >=3.8,<3.9
  run:
    - python >=3.8,<3.9
    - diamond >=2.2.6
    - mmseqs2 >=14.7e284
    - foldseek >=3.915ef7d
    - scipy >=1.7.3
    - r-seqinr >=4.2_16
    - r-optparse >=1.7.3
    - r-bio3d >=2.4_3
    - r-tidyverse >=1.3.2
    - r-phytools >=0.6_99
    - orthofinder >=2.5.5
    - ncbitax2lin >=2.3.2
    - absense >=1.0.1

test:
  commands:
    - genEra -h
    - hmmEra -h
    - test_installation.sh -h

about:
  home: https://github.com/josuebarrera/GenEra
  license: "GPL-3.0-or-later"
  license_family: GPL3
  summary: "Uncovering gene-family founder events during major evolutionary transitions in animals, plants and fungi using GenEra"
