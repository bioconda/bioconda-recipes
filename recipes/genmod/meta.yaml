{% set name = "genmod" %}
{% set version = "3.13.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 51ef8b950e92bf79713b83faa0b44ce16e20e812f0925941261b135e1370bbd4

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage('genmod', max_pin="x") }}
  entry_points:
    - genmod = genmod.commands.base:cli
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"

requirements:
  host:
    - pip
    - hatchling
    - python >=3.11
  run:
    - python >=3.11
    - click
    - configobj
    - importlib_resources
    - intervaltree >=3.1.0
    - ped_parser
    - pysam
    - six

test:
  imports:
    - genmod
    - genmod.annotate_models
    - genmod.annotate_models.models
    - genmod.annotate_regions
    - genmod.annotate_variants
    - genmod.annotations
    - genmod.commands
    - genmod.errors
    - genmod.score_variants
    - genmod.utils
    - genmod.vcf_tools
  commands:
    - genmod --help

about:
  home: "http://github.com/moonso/genmod"
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: "Annotate genetic inheritance models in variant files"

extra:
  recipe-maintainers:
    - ramprasadn
