{% set name = "pango-collapse" %}
{% set version = "0.8.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace("-","_") }}-{{ version }}.tar.gz
  sha256: 28f6bba3a04c8afc05fa1a2a2863390c49c95ea3c63d4195db4d1028e8b186fd

build:
  number: 0
  noarch: python
  entry_points:
    - pango-collapse = pango_collapse.main:app
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - poetry-core
    - pip
  run:
    - python >=3.12
    - typer >=0.27.0,<0.28.0
    - pango_aliasor >=0.3.0,<0.4.0
    - pandas >=3.0.5,<4.0.0
    - numpy >=2.5.1,<3.0.0
    - click >=8.0.0,<9.0.0
    - rich >=15.0.0,<16.0.0

test:
  imports:
    - pango_collapse
  commands:
    - pip check
    - pango-collapse --help

about:
  home: "https://github.com/MDU-PHL/pango-collapse"
  summary: "Collapse Pango sublineages up to user defined parent lineages."
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  dev_url: "https://github.com/MDU-PHL/pango-collapse"

extra:
  recipe-maintainers:
    - Wytamma
