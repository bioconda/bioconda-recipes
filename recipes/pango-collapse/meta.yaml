{% set name = "pango-collapse" %}
{% set version = "0.8.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace("-","_") }}-{{ version }}.tar.gz
  sha256: 28f6bba3a04c8afc05fa1a2a2863390c49c95ea3c63d4195db4d1028e8b186fd

build:
  run_exports:
    - {{ pin_subpackage('pango-collapse', max_pin="x.x") }}
  entry_points:
    - pango-collapse = pango_collapse.main:app
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8,<4.0
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=3.8,<4.0
    - typer >=0.6.1,<0.7.0
    - pango_aliasor >=0.3.0,<0.4.0
    - pandas >=1.3,<=1.5.3
    - numpy >=1.19.5,<1.27.0

test:
  imports:
    - pango_collapse
  commands:
    - pip check
    - pango-collapse --help
  requires:
    - pip

about:
  home: https://github.com/MDU-PHL/pango-collapse
  summary: Collapse Pango sublineages up to user defined parent lineages.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Wytamma



