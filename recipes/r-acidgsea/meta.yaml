{% set version = "0.9.2" %}
{% set github = "https://github.com/acidgenomics/r-acidgsea" %}

package:
  name: r-acidgsea
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 0dbe2c15f0af342910879259a2db1d15c6dd4f903d46f8702623ac1537a8293a

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('r-acidgsea', max_pin="x.x") }}

requirements:
  host:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-fgsea >=1.26.0
    - bioconductor-genomeinfodb >=1.36.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.8
    - r-acidcli >=0.3.3
    - r-acidexperiment >=0.5.6
    - r-acidgenerics >=0.7.11
    - r-acidgenomes >=0.8.1
    - r-acidmarkdown >=0.3.2
    - r-acidplots >=0.7.5
    - r-acidplyr >=0.5.8
    - r-deseqanalysis >=0.7.3
    - r-ggplot2 >=3.4.3
    - r-goalie >=0.7.10
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1
    # Suggests:
    - r-basejump >=0.18.0
    - r-knitr >=1.44
    - r-rmarkdown >=2.25
  run:
    # Depends:
    - r-base
    # Imports:
    - bioconductor-biocgenerics >=0.46.0
    - bioconductor-fgsea >=1.26.0
    - bioconductor-genomeinfodb >=1.36.0
    - bioconductor-iranges >=2.34.0
    - bioconductor-s4vectors >=0.38.0
    - bioconductor-summarizedexperiment >=1.30.0
    - r-acidbase >=0.7.8
    - r-acidcli >=0.3.3
    - r-acidexperiment >=0.5.6
    - r-acidgenerics >=0.7.11
    - r-acidgenomes >=0.8.1
    - r-acidmarkdown >=0.3.2
    - r-acidplots >=0.7.5
    - r-acidplyr >=0.5.8
    - r-deseqanalysis >=0.7.3
    - r-ggplot2 >=3.4.3
    - r-goalie >=0.7.10
    - r-pipette >=0.16.2
    - r-syntactic >=0.8.1
    # Suggests:
    - r-basejump >=0.18.0
    - r-knitr >=1.44
    - r-rmarkdown >=2.25

test:
  commands:
    - $R -e "library('AcidGSEA')"

about:
  home: https://r.acidgenomics.com/packages/acidgsea/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE.md
  license_family: APACHE
  summary: Parameterized fast gene set enrichment analysis.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
