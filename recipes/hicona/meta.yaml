{% set name = "hicona" %}
{% set version = "0.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9a56b19dc67474dce33b98fddeaf168f2d4eb47d13d983ee75de157ed888a769

build:
  number: 0
  noarch: python
  skip: true  # [win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=3.10
    - cooler
    - polars
    - pyarrow
    - bioframe
    - seaborn
    - coolbox ==0.4.0
    - cooltools
    - graph-tool

test:
  imports:
    - hicona
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/leomorelli/HiCONA
  summary: Network analysis toolkit for Hi-C data.
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/leomorelli/HiCONA

extra:
  recipe-maintainers:
    - leomorelli
    - StefanoCretti
