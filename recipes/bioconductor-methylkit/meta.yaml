{% set version = "1.38.0" %}
{% set name = "methylKit" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: db8e31729cc02d653e749ab0bc999446

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-methylkit", max_pin="x.x") }}'

# Suggests: testthat (>= 2.1.0), knitr, rmarkdown, genomation, BiocManager
# SystemRequirements: GNU make
requirements:

  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make

  host:
    - bioconductor-fastseg >=1.58.0,<1.59.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-limma >=3.68.5,<3.69.0
    - bioconductor-qvalue >=2.44.0,<2.45.0
    - bioconductor-rhtslib >=3.8.0,<3.9.0
    - bioconductor-rsamtools >=2.28.0,<2.29.0
    - bioconductor-rtracklayer >=1.72.0,<1.73.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - r-base
    - r-data.table >=1.9.6
    - r-emdbook
    - r-gtools
    - r-kernsmooth
    - r-mclust
    - r-mgcv
    - r-r.utils
    - r-rcpp
    - libblas
    - liblapack
    - zlib
    - liblzma-devel

  run:
    - bioconductor-fastseg >=1.58.0,<1.59.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-limma >=3.68.5,<3.69.0
    - bioconductor-qvalue >=2.44.0,<2.45.0
    - bioconductor-rhtslib >=3.8.0,<3.9.0
    - bioconductor-rsamtools >=2.28.0,<2.29.0
    - bioconductor-rtracklayer >=1.72.0,<1.73.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - r-base
    - r-data.table >=1.9.6
    - r-emdbook
    - r-gtools
    - r-kernsmooth
    - r-mclust
    - r-mgcv
    - r-r.utils
    - r-rcpp

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: Artistic-2.0
  summary: DNA methylation analysis from high-throughput bisulfite sequencing results
  description: methylKit is an R package for DNA methylation analysis and annotation from high-throughput bisulfite sequencing. The package is designed to deal with sequencing data from RRBS and its variants, but also target-capture methods and whole genome bisulfite sequencing. It also has functions to analyze base-pair resolution 5hmC data from experimental protocols such as oxBS-Seq and TAB-Seq. Methylation calling can be performed directly from Bismark aligned BAM files.

extra:
  additional-platforms:
    - linux-aarch64
  identifiers:
    - biotools:methylkit
  parent_recipe:
    name: bioconductor-methylkit
    path: recipes/bioconductor-methylkit
    version: 1.6.3