{% set name = "perl-http-tiny" %}
{% set version = "0.096" %}
{% set sha256 = "1df1a8caecbf97a2cbe002a655e0fe21d4cd5bbee9e40656a3a602423f98eaef" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/H/HA/HAARG/HTTP-Tiny-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-exporter
    - perl-file-temp
    - perl-extutils-makemaker
    - perl-socket
    - perl-carp
    - perl-ipc-cmd
    - perl-mime-base64
    - perl-data-dumper
    - perl-time-local
    - perl-lib
    #- perl-test-more
    #- perl-file-basename
  run:
    - perl
    - perl-carp
    - perl-time-local
    - perl-mime-base64
    - perl-socket

test:
  imports:
    - HTTP::Tiny

about:
  home: "https://metacpan.org/pod/HTTP::Tiny"
  license: "perl_5"
  summary: "A small, simple, correct HTTP/1.1 client."
  doc_url: "https://metacpan.org/pod/HTTP::Tiny"
  dev_url: "https://github.com/Perl-Toolchain-Gang/HTTP-Tiny"
