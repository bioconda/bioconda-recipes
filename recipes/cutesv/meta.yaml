{% set version = "2.1.4" %}

package:
  name: cutesv
  version: {{ version }}

source:
  url: https://github.com/tjiangHIT/cuteSV/archive/cuteSV-v{{ version }}.tar.gz
  sha256: e84292be5b9329fdb6ab9bf1c9b678506b33a70694abba7099aafe919183bb3b

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation --no-cache-dir -vvv .
  run_exports:
    - {{ pin_subpackage("cutesv", max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3
    - setuptools
  run:
    - biopython
    - cigar
    - numpy
    - pysam >=0.15.0
    - python >=3
    - pyvcf3
    - scikit-learn
    - scipy

test:
  commands:
    - cuteSV -h

about:
  home: 'https://github.com/tjiangHIT/cuteSV'
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "cuteSV is a long-read based human genomic structural variation detection tool."
  dev_url: 'https://github.com/tjiangHIT/cuteSV'

extra:
  recipe-maintainers:
    - tjiangHIT
