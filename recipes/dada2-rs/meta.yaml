{% set name = "dada2-rs" %}
{% set version = "0.5.0" %}

package:
  name: {{ name }}
  version: {{ version }}

# The crates.io tarball, not the GitHub tag: the published manifest has the
# experimental WFA backend's git dependency stripped, so the build needs no git
# fetch. It is the Needleman-Wunsch-only build.
source:
  url: https://crates.io/api/v1/crates/{{ name }}/{{ version }}/download
  fn: {{ name }}-{{ version }}.tar.gz
  sha256: d400ab90e077b6eaca4e9b3c33114c1269b7f385d71c757f5ad501a7ba62b081
  patches:
    # Upstream PR HPCBio/dada2-rs#329: without it, Cargo's new build-dir
    # layout tags the version '+build'. Drop at the next release.
    - build-tags-new-build-dir.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler("rust") }}
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses

test:
  commands:
    - dada2-rs --version | grep -qx "dada2-rs {{ version }}"
    - dada2-rs --help

about:
  home: https://github.com/HPCBio/dada2-rs
  license: LGPL-3.0-only
  license_family: LGPL
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: A Rust implementation of the DADA2 amplicon denoising algorithm.
  dev_url: https://github.com/HPCBio/dada2-rs
  doc_url: https://dada2-rs.readthedocs.io

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - cjfields
