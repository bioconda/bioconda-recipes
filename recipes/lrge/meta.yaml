{% set version = "1.0.0" %}
{% set name = "lrge" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mbhall88/{{ name }}/archive/{{ name }}-{{ version }}.tar.gz
  sha256: 614e8576c2f7abf3613f7806b9e851e48ead33ff0dc9d1a8b2f13a789b2baa4f

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('lrge', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - zlib
  host:
    - zlib
    - liblzma

test:
  commands:
    - lrge --version

about:
  home: https://github.com/mbhall88/lrge
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Genome size estimation from long read overlaps

extra:
  identifiers:
    - doi:10.1093/bioinformatics/btaf593
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - mbhall88
