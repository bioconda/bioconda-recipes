{% set name = "taxutils" %}
{% set version = "1.1.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 093f5f5d0387c9b5ca55ec09bc7ee1b2973c3d28bc6330bcd341be5d6b459a82

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler("rust") }}
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
  host:
    - python >=3.10
    - pip
    - setuptools >=68
    - setuptools-rust
    - wheel
  run:
    - python >=3.10
    - numpy
    - pandas

test:
  imports:
    - taxutils

about:
  home: https://github.com/SwabSeq/taxutils
  license: MIT
  license_file: LICENSE
  summary: "Utilities for working with NCBI taxonomic data."

extra:
  recipe-maintainers:
    - "wgobrien"
  authors:
    - "William O'Brien"
