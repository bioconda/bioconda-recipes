{% set name = "taxutils" %}
{% set version = "1.1.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 093f5f5d0387c9b5ca55ec09bc7ee1b2973c3d28bc6330bcd341be5d6b459a82

build:
  number: 0
  script:
    - (cd rust && cargo-bundle-licenses --format yaml --output ../THIRDPARTY.yml)
    - "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  entry_points:
    - taxutils = taxutils.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("rust") }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses
  host:
    - python >=3.10
    - pip
    - setuptools >=68
    - setuptools-rust >=1.9
    - wheel
  run:
    - python >=3.10
    - numpy
    - pandas

test:
  imports:
    - taxutils
  commands:
    - taxutils --help
    - python -c "from taxutils import backend_info; assert backend_info()['selected'] == 'rust'"

about:
  home: https://github.com/SwabSeq/taxutils
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "Utilities for working with NCBI taxonomic data."

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - "wgobrien"
  authors:
    - "William O'Brien"
