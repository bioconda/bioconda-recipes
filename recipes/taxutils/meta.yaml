{% set name = "taxutils" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/SwabSeq/taxutils/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 0172eb3a5dea9df675bdb17d6e4273554bd05b1ec36ce456e5c5a0e8d7a5187c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.10
    - numpy
    - pandas

test:
  imports:
    - taxutils
  commands:
    - python -c "from taxutils import taxutils; assert callable(taxutils)"

about:
  home: https://github.com/SwabSeq/taxutils
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Utilities for working with NCBI taxonomic data.
  doc_url: https://pypi.org/project/taxutils/
  dev_url: https://github.com/SwabSeq/taxutils

extra:
  recipe-maintainers:
    - wgobrien
