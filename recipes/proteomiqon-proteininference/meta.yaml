{% set name = "proteomiqon-proteininference" %}
{% set version = "0.1.0" %}
{% set sha256 = "cc39063be273b49301c9d05f548b2379aeedbeaaed638e7abd6074d1f2f78763" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.ProteinInference/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip

  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-proteininference"
    - test -f "$PREFIX/lib/dotnet/tools/ProteinInference/ProteomIQon.ProteinInference.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-proteininference"
    - grep -q "ProteinInference/ProteomIQon.ProteinInference.dll" "$PREFIX/bin/proteomiqon-proteininference"


about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: "Infers protein groups from identified peptides."
  description: |
    ProteinInference maps the identified peptides back to proteins and reports protein groups: sets of proteins that share their peptide evidence.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/protein-inference/
