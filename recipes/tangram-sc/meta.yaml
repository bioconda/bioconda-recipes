{% set name = "tangram-sc" %}
{% set version = "1.0.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6ced24573e288fa01a8070e3c7600058de51296bac1702515db87c310da6ac13

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - pip
    - pytorch
    - pandas
    - numpy
    - scipy
    - matplotlib-base
    - seaborn
    - scanpy
    - scikit-learn
    - tqdm

tests:
  - python:
      imports:
        - docs
        - tangram
      pip_check: true

about:
  summary: Spatial alignment of single cell transcriptomic data.
  license: BSD-3-Clause
  license_file: LICENSE.md
  homepage: https://github.com/broadinstitute/Tangram

extra:
  recipe-maintainers:
    - nilchia
