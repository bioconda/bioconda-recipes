{% set name = "tangram-sc" %}
{% set version = "1.0.4" %}
{% set commit = "4c68995a418f41dc8caef567598c4d9b47781a13" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/broadinstitute/Tangram/archive/{{ commit }}.tar.gz
  sha256: 81c89e5d07fffa1ee0d7471bd5ecfaf5376556c2ffe73ecd8294dec1607defff

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
    - {{ pin_subpackage('tangram-sc', max_pin="x") }}

requirements:
  host:
    - python >=3.8.5
    - pip
    - setuptools
  run:
    - python >=3.8.5
    - pytorch
    - numpy <2.0.0
    - anndata <0.10.0
    - pandas
    - scipy
    - matplotlib-base
    - seaborn
    - scanpy
    - scikit-learn
    - tqdm
    - squidpy
    - libpysal
    - squidpy <=1.3.0

test:
  imports:
    - tangram
    - tangram.mapping_utils
    - tangram.utils
    - tangram.plot_utils
    - tangram.mapping_optimizer
    - tangram.spatial_weights
  commands:
    - python -c "import tangram as tg; assert tg.__version__ == '{{ version }}'"

about:
  home: https://github.com/broadinstitute/Tangram
  dev_url: https://github.com/broadinstitute/Tangram
  doc_url: https://tangram-sc.readthedocs.io/en/latest/
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: Spatial alignment of single-cell transcriptomic data onto spatial gene expression data.
  description: |
    Tangram is a Python package, written in PyTorch and based on scanpy, for
    mapping single-cell (or single-nucleus) gene expression data onto spatial
    gene expression data collected from the same anatomical region or tissue type.
  identifiers:
    - doi:10.1038/s41592-021-01264-7

extra:
  recipe-maintainers:
    - LuisHeinzlmeier