{% set name = "ebi-eva-common-pyutils" %}
{% set version = "1.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ebi_eva_common_pyutils-{{ version }}.tar.gz
  sha256: e9c3212fb65d2ab3c06f498eab7ed65a220a8109bfce64283b154fbf9c1c7b7c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3
    - pip
    - setuptools
  run:
    - python >=3
    - pip
    - requests
    - lxml ==5.*
    - pyyaml
    - cached-property ==1.5.*
    - retry
    - openpyxl ==3.*

test:
  imports:
    - ebi_eva_common_pyutils
    - ebi_eva_internal_pyutils
  commands:
    - pip check

about:
  home: "https://github.com/EBIVariation/eva-common-pyutils"
  summary: "EBI EVA - Common Python Utilities."
  license: "Apache-2.0"
  license_family: APACHE
  license_file: LICENSE
  dev_url: "https://github.com/EBIVariation/eva-common-pyutils"

extra:
  recipe-maintainers:
    - apriltuesday
