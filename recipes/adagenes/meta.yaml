{% set version = "0.5.3" %}

package:
  name: adagenes
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/a/adagenes/adagenes-{{ version }}.tar.gz
  sha256: c50c7c9090b60a3dce100169da6f70c5704ec43b7bd9f01c4b3a3d68492326bc

build:
  number: 0
  noarch: python
  entry_points:
    - adagenes = adagenes.cli:main
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('adagenes', max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
    - requests
    - liftover
    - plotly
    - openpyxl
    - matplotlib-base
    - scikit-learn
    - blosum
    - pandas
    - python-magic
    - upsetplot
    - pyaml
    - numpy
    - flask
    - flask_cors
    - flask-swagger-ui
    - pymongo
    - onkopus
  run:
    - python >=3.9
    - requests
    - liftover
    - plotly
    - openpyxl
    - matplotlib-base
    - scikit-learn
    - blosum
    - pandas
    - python-magic
    - upsetplot
    - pyaml
    - numpy
    - flask
    - flask_cors
    - flask-swagger-ui
    - pymongo
    - onkopus

test:
  commands:
    - adagenes --help

about:
  home: "https://gitlab.gwdg.de/MedBioinf/mtb/adagenes"
  summary: "Generic toolkit for processing DNA polymorphism data."
  license: MIT
  license_family: MIT
  dev_url: "https://gitlab.gwdg.de/MedBioinf/mtb/adagenes"
