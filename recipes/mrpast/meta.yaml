{% set name = "mrpast" %}
{% set version = "0.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 01743dc8133c35f3bb7f3bfdc584275b6ff57eaa62c270560beea699e24bcf12

build:
  number: 0
  entry_points:
    - mrpast = mrpast.main:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-cache-dir --no-build-isolation -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - numpy >=2.0.0
    - dataclasses-json
    - msprime
    - orjson
    - pandas
    - pip
    - pyfaidx
    - python
    - pyyaml
    - tabulate
    - tqdm
    - tskit
  run:
    - {{ pin_compatible('numpy') }}
    - dataclasses-json
    - msprime
    - orjson
    - pandas
    - pyfaidx
    - python
    - pyyaml
    - tabulate
    - tqdm
    - tskit

test:
  imports:
    - mrpast
  commands:
    - mrpast --help

about:
  home: "https://aprilweilab.github.io"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: LICENSE
  summary: "Demographic inference from Ancestral Recombination Graphs."
  doc_url: "https://mrpast.readthedocs.io/en/latest"
  dev_url: "https://github.com/aprilweilab/mrpast"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - dcdehaas
