{% set name = "glycorender" %}
{% set version = "0.4.2" %}
package:
  name: {{ name }}
  version: {{ version }}
source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e9c1a18194ed09f2d6209c4196289c236c5e6a89687544cdd203ee0e3509b33a
build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=3.10
    - numpy
test:
  imports:
    - glycorender
  commands:
    - pip check
  requires:
    - pip
about:
  home: https://github.com/BojarLab/glycorender
  summary: A bespoke SVG to PDF/PNG renderer for the GlycoDraw platform
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/BojarLab/glycorender
extra:
  recipe-maintainers:
    - Bribak
