{% set name = "crispritz" %}
{% set version = "2.10.0" %}

package:
  name: {{name}}
  version: {{ version }}

source:
  url: https://github.com/pinellolab/CRISPRitz/archive/v{{ version }}.tar.gz
  sha256: a3d7ce8936d2a882d788a47f03fde2fbbd038f10a2a27340f94c3011ba4338b2

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin = "x") }}

  skip: True  # [osx]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
    - make
  host:
    # The C++ enricher (add-variants) links against zlib; header needed at build.
    - zlib
    - python >=3.11,<3.12
  run:
    # CRISPRitz is from now on (2026-10-08) a PURE ENUMERATION ENGINE 
    # (index-genome / search / add-variants).
    # Scoring (CFD + azimuth), annotation and reporting moved to CRISPRme+, so the whole
    # azimuth ML stack is GONE: no scikit-learn / scipy / matplotlib-base / biopython /
    # statsmodels / more-itertools / intervaltree / tk, and numpy/pandas are UNPINNED
    - pandas                 # add-variants Python-fallback enricher
    - bcftools               # add-variants VCF handling
    - boost-cpp
    - openmp     # [osx]
    - zlib
    - python >=3.11,<3.12
  run_constrained:
    # CRISPRme X.Y.z requires CRISPRitz X.Y.* (they share major.minor; CRISPRitz
    # docs/RELEASING.md, Version policy). CRISPRitz 2.10 writes index format 2, which
    # crisprme 2.8.1 refuses and 2.8.0 aborts on, and codes every allele of a split site:
    # keep it out of any environment that holds an earlier crisprme, existing ones
    # included (crisprme 2.8.1 build 1 pins crispritz <2.10; its build 0 and the 2.8.0
    # and 2.7.9 builds set no upper bound).
    - crisprme >=2.10.0

test:
  commands:
    - crispritz.py
    - crispritz.py index-genome help
    - crispritz.py search help
    - crispritz.py add-variants help
    - crispritz.py index-info help
    - crispritz.py version
    - test -x "$PREFIX/bin/enricher"
    - test -x "$PREFIX/opt/crispritz/Python_Scripts/Enrichment/enricher"

about:
  home: https://github.com/pinellolab/CRISPRitz
  license: LicenseRef-MGBOA-1.0        # CRISPRitz relicensed AGPL -> MGBOA 1.0 (see repo LICENSE)
  license_family: OTHER
  license_file: LICENSE
  summary: CRISPRitz enumeration engine for CRISPR off-target search (index / search / add-variants).
extra:
  recipe-maintainers:
    - lucapinello
    - ManuelTgn
  additional-platforms:
    - linux-aarch64
