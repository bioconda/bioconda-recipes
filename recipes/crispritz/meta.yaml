{% set name = "crispritz" %}
{% set version = "2.9.0" %}

package:
  name: {{name}}
  version: {{ version }}

source:
  url: https://github.com/pinellolab/CRISPRitz/archive/v{{ version }}.tar.gz
  sha256: 57031301e8b406bab306cb161a4d76a284d95b73cc426545e83113154a1c8027

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin = "x") }}

  skip: True  # [osx]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
    - make
  host:
    # The C++ enricher (add-variants) links against zlib; header needed at build.
    - zlib
    - python >=3.11,<3.12
  run:
    # CRISPRitz is from now on (2026-10-08) a PURE ENUMERATION ENGINE 
    # (index-genome / search / add-variants).
    # Scoring (CFD + azimuth), annotation and reporting moved to CRISPRme+, so the whole
    # azimuth ML stack is GONE: no scikit-learn / scipy / matplotlib-base / biopython /
    # statsmodels / more-itertools / intervaltree / tk, and numpy/pandas are UNPINNED
    - pandas                 # add-variants Python-fallback enricher
    - bcftools               # add-variants VCF handling
    - boost-cpp
    - openmp     # [osx]
    - zlib
    - python >=3.11,<3.12

test:
  commands:
    - crispritz.py
    - crispritz.py index-genome help
    - crispritz.py search help
    - crispritz.py add-variants help

about:
  home: https://github.com/pinellolab/CRISPRitz
  license: LicenseRef-MGBOA-1.0        # CRISPRitz relicensed AGPL -> MGBOA 1.0 (see repo LICENSE)
  license_family: OTHER
  license_file: LICENSE
  summary: CRISPRitz enumeration engine for CRISPR off-target search (index / search / add-variants).
extra:
  recipe-maintainers:
    - lucapinello
    - ManuelTgn
  additional-platforms:
    - linux-aarch64
