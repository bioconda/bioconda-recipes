{% set name = "crispritz" %}
{% set version = "2.7.1" %}

package:
  name: {{name}}
  version: {{ version }}

source:
  url: https://github.com/pinellolab/CRISPRitz/archive/v{{ version }}.tar.gz
  sha256: 7a89b467168e12dc16a14cf055c8350481e40cc85399bb6e6dba361b30c2178c

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin = "x") }}

  skip: True  # [osx]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
    - make
  host:
    - boost-cpp
    - python >=3.8,<3.9
  run:
    - rename
    - bedtools
    - bedops
    - scikit-learn =0.23.2
    - biopython
    - intervaltree
    - matplotlib-base
    - pandas
    - scipy
    - numpy
    - more-itertools
    - statsmodels
    - bcftools
    - boost-cpp
    - tk
    - openmp     # [osx]
    - python >=3.8,<3.9
    - pysam 0.22.1
    - htslib

test:
  commands:
    - crispritz.py

about:
  home: https://github.com/pinellolab/CRISPRitz
  license: GPL3
  license_file: LICENSE
  summary: CRISPRitz, tool package for CRISPR experiments assessment and analysis.
extra:
  additional-platforms:
    - linux-aarch64
