{% set name = "crispritz" %}
{% set version = "2.8.1" %}

package:
  name: {{name}}
  version: {{ version }}

source:
  url: https://github.com/pinellolab/CRISPRitz/archive/v{{ version }}.tar.gz
  sha256: f31cf17de859be34a4c6d0936cb19e30c0194b6695fc7f73c789695b33535e79

build:
  number: 1
  run_exports:
    - {{ pin_subpackage(name, max_pin = "x") }}

  skip: True  # [osx]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
    - make
  host:
    - boost-cpp
    # The C++ enricher (add-variants) links against zlib; header needed at build.
    - zlib
    - python >=3.11,<3.12
  run:
    - rename
    - bedtools
    - bedops
    # The azimuth (Doench 2016) on-target model is vendored from CRISPR-HAWK and
    # only unpickles on this scikit-learn/numpy/pandas/scipy combo. Do NOT bump
    # scikit-learn past 1.1.x without re-serializing the model: sklearn 1.2
    # removed sklearn.ensemble._gb_losses, which the model references.
    - scikit-learn ==1.1.3
    - numpy ==1.24.4
    - pandas ==2.0.3
    - scipy ==1.10.1
    - biopython
    - intervaltree
    - matplotlib-base
    - more-itertools
    - statsmodels
    - bcftools
    - boost-cpp
    - tk
    - openmp     # [osx]
    - python >=3.11,<3.12
    - pysam 0.22.1
    - htslib

test:
  commands:
    # CLI resolves and reports the expected version (prints "CRISPRitz v 2.8.1")
    - crispritz.py version | grep -i {{ version }}
    # the three search/build binaries are installed under opt/crispritz
    - test -x $PREFIX/opt/crispritz/buildTST
    - test -x $PREFIX/opt/crispritz/searchTST
    - test -x $PREFIX/opt/crispritz/searchBruteForce
    # the compiled (fast) enricher MUST be installed in both places
    # crispritz.py _enricher_command() checks, else it silently falls back to
    # the ~15x slower enricher.py; guard that regression.
    - command -v enricher
    - test -x $PREFIX/opt/crispritz/Python_Scripts/Enrichment/enricher

about:
  home: https://github.com/pinellolab/CRISPRitz
  license: AGPL-3.0-or-later
  license_file: LICENSE
  summary: CRISPRitz, tool package for CRISPR experiments assessment and analysis.
extra:
  recipe-maintainers:
    - lucapinello
  additional-platforms:
    - linux-aarch64
