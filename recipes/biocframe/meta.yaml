{% set name = "biocframe" %}
{% set version = "0.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3b98ee356ee3dc1d2e962c7494e4641f388e814aa988b81d768852eb5ca3c808

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=3.9
    - numpy >=1.26.0
    - biocutils >=0.3.3

test:
  imports:
    - biocframe
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/BiocPy/biocframe
  summary: Flexible dataframe representation to support nested structures.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
