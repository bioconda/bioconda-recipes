{% set name = "perl-module-metadata" %}
{% set version = "1.000040" %}
{% set sha256 = "b53620c268537d3741c72252e3d890824a20ed3cbb085d2e2eee62f7efc1cf2e" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/Module-Metadata-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-carp
    - perl-extutils-makemaker
    - perl-file-path
    - perl-file-temp
    - perl-exporter
    - perl-lib
    - perl-base
    - perl-version
  run:
    - perl
    - perl-carp
    - perl-version
    - perl-encode

test:
  imports:
    - Module::Metadata

about:
  home: "https://github.com/Perl-Toolchain-Gang/Module-Metadata"
  license: "Perl_5"
  summary: "Gather package and POD information from perl module files."
  dev_url: "https://github.com/Perl-Toolchain-Gang/Module-Metadata"
  doc_url: "https://metacpan.org/pod/Module::Metadata"
