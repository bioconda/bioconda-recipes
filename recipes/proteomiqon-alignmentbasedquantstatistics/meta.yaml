{% set name = "proteomiqon-alignmentbasedquantstatistics" %}
{% set version = "0.1.0" %}
{% set sha256 = "3ce77de7ac8443df0baf9d800404985ba5df94d8758d979618805a64ad08f0cc" %}

package:
  name: '{{ name }}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.AlignmentBasedQuantStatistics/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}


requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-alignmentbasedquantstatistics"
    - test -f "$PREFIX/lib/dotnet/tools/AlignmentBasedQuantStatistics/ProteomIQon.AlignmentBasedQuantStatistics.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-alignmentbasedquantstatistics"
    - grep -q "AlignmentBasedQuantStatistics/ProteomIQon.AlignmentBasedQuantStatistics.dll" "$PREFIX/bin/proteomiqon-alignmentbasedquantstatistics"
  

about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: "Scores the confidence of peptide ion quantifications transferred across runs."
  description: | 
    A peptide ion transferred by QuantBasedAlignment and quantified by AlignmentBasedQuantification has no identification in the run, so nothing yet says whether the quantified peak is the ion.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/alignment-based-quant-statistics/
