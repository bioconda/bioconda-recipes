# rastair 2.2.0 requires rustc >= 1.97.1 (rust-version in Cargo.toml).
# conda-forge rust_osx-64 >= 1.97 requires macosx_deployment_target >= 11.0,
# so the default c_stdlib_version of 10.13 pulled in by stdlib("c") would
# force the solver back to rust 1.95, which fails the crate's MSRV check.
rust_compiler_version:
  - 1.97.1
c_stdlib_version:
  - "11.0"  # [osx]
