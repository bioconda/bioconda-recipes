{% set version = "1.0.0" %}

package:
  name: scnic
  version: {{ version }}

source:
  url: https://github.com/lozuponelab/SCNIC/archive/{{ version }}.tar.gz
  sha256: df5e33b0734906f2ef40d06dd692dc7d5a58a04709b5905c52f6eca6e3b090d9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage('scnic', max_pin="x.x") }}

requirements:
  host:
    - python >=3
    - pip
    - pytest-runner
  run:
    - python >=3
    - numpy
    - scipy >=1.9.0,<=1.10.1
    - pandas >=1
    - statsmodels
    - h5py
    - biom-format
    - networkx >=2
    - scikit-bio
    - fastspar
    - tqdm
    - matplotlib-base
    - seaborn-base

test:
  imports:
    - SCNIC
  command:
    - SCNIC_analysis.py --help
    - fastspar --help  # verify fastspar working correctly

about:
  home: https://github.com/lozuponelab/SCNIC
  license: "BSD-3-Clause"
  license_family: BSD
  license_file: LICENSE
  summary: "SCNIC: Sparse Cooccurence Network Investigation for Compositional data"
  dev_url: https://github.com/lozuponelab/SCNIC

extra:
  recipe-maintainers:
    - lozuponelab
