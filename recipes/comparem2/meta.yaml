{% set name = "comparem2" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/cmkobel/CompareM2/archive/refs/tags/v{{ version }}.tar.gz
  sha256: a115bf2c634bc78aef857882b2403bae7c08962766e068a1039ba5b4cc44a20d

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - comparem2 = comparem2.cli:main
    - cm2 = comparem2.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77
  run:
    - python >=3.11
    - snakemake-minimal >=9,<10
    - snakemake-executor-plugin-slurm
    - snakemake-executor-plugin-cluster-generic
    - textual
    # The analysis tools are deployed per rule at run time, not installed here.
    - conda

test:
  imports:
    - comparem2
  commands:
    - comparem2 --version
    - comparem2 --help
    - cm2 --help

about:
  home: https://github.com/cmkobel/CompareM2
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: A genomes-to-report pipeline for comparing microbial genomes
  description: |
    CompareM2 runs fourteen analysis tools over a set of microbial assemblies
    and renders one self-contained HTML report: assembly statistics,
    completeness, taxonomy, annotation, AMR genes, sequence types, ANI, a
    pangenome, phylogenies and draft metabolic models.
  doc_url: https://comparem2.readthedocs.io
  dev_url: https://github.com/cmkobel/CompareM2

extra:
  recipe-maintainers:
    - cmkobel
  identifiers:
    - doi:10.1093/bioinformatics/btaf517
