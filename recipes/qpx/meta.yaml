{% set name = "qpx" %}
{% set version = "1.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b3d71d0823d13f3b77f2ccf85ec84ac5757fb8a3d26c7bbb14dab71e41414f2f

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  entry_points:
    - qpxc = qpx.cli.main:main

requirements:
  host:
    - python >=3.10,<3.14
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=3.10
    - click >=8.1
    - pandas >=2.1
    - pyarrow >=14.0
    - pyopenms >=3.3.0,<4.0.0
    - numpy >=1.24
    - duckdb >=1.1.3
    - pyyaml >=6.0
    - scipy
    - mudata >=0.3.1
    - anndata >=0.9.0
    - defusedxml >=0.7.1        # missing — caused the ModuleNotFoundError
    - sdrf-pipelines >=0.1.6     # missing (core dep)

test:
  imports:
    - qpx
  commands:
    - qpxc --help
    - pip check
  requires:
    - pip

about:
  home: https://github.com/bigbio/qpx
  summary: 'Quantitative proteomics data toolkit — convert, transform, query, and validate QPX Parquet datasets'
  description: |
    qpx is a Python toolkit for working with quantitative proteomics data in
    the QPX Parquet format. It provides commands to convert results from
    common search engines, transform and aggregate quantitative data, run
    SQL-style queries with DuckDB, and validate datasets against the QPX
    schema.
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  doc_url: https://qpx.quantms.org
  dev_url: https://github.com/bigbio/qpx

extra:
  recipe-maintainers:
    - ypriverol
