{% set name = "proteomiqon-psmstatistics" %}
{% set version = "0.1.0" %}
{% set sha256 = "2ce97ce50d53753c85df489b2f7844bc6201fc6a12bcf902b80574342a50d1b7" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.PSMStatistics/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-psmstatistics"
    - test -f "$PREFIX/lib/dotnet/tools/PSMStatistics/ProteomIQon.PSMStatistics.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-psmstatistics"
    - grep -q "PSMStatistics/ProteomIQon.PSMStatistics.dll" "$PREFIX/bin/proteomiqon-psmstatistics"


about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: "Scores and filters peptide-spectrum matches using q-values and posterior error probabilities."
  description: | 
    PeptideSpectrumMatching and PeptideSpectrumMatchingTIMs report several target and decoy candidates per spectrum, each with a SEQUEST-like, an Andromeda-like and an X!Tandem-like score. PSMStatistics combines these columns into one score with a FastTree classifier (ML.NET) trained to separate targets from decoys. It keeps the best candidate per scan by this score, computes its Q-value and PEP value, and writes the targets that pass both thresholds.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/psm-statistics/
