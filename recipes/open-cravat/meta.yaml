{% set name = "open-cravat" %}
{% set version = "3.2.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/4e/f2/4b707609662ff9d69bc3622e9e703e5682355b26d74c17b8ffad8c299e3d/open_cravat-3.2.1.tar.gz
  sha256: 8962518853d7b5be5f9e8f3965c7e64b0431cef193f3b836000715fa45ef54cb

build:
  number: 0
  entry_points:
    - oc=cravat.oc:main
  noarch: python
  script: {{PYTHON}} -m pip install . -vvv --no-build-isolation --no-deps --no-cache-dir
  run_exports:
    - {{ pin_subpackage('open-cravat', max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.9
    - setuptools
  run:
    - aiohttp <4.0.0
    - aiosqlite
    - biopython
    - chardet >=3.0.4,<6.0.0
    - intervaltree
    - markdown
    - mpmath
    - nest-asyncio
    - openpyxl
    - oyaml
    - psutil
    - pyliftover
    - python >=3.9
    - setuptools
    - pyyaml
    - requests
    - requests-toolbelt
    - twobitreader
    - websockets
    - xlsxwriter
    - pyvcf3
    - looseversion
    - packaging >=25.0.0
    - flask
    - paste
    - waitress
    - whitenoise
    - flask-caching
    - cachelib
    - celery
    - cryptography

test:
  imports:
    - cravat

about:
  home: "https://www.opencravat.org"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "OpenCRAVAT - variant analysis toolkit"
  doc_url: https://github.com/KarchinLab/open-cravat/wiki
  dev_url: https://github.com/KarchinLab/open-cravat

extra:
  recipe-maintainers:
    - cvaske
    - kmoad
    - rachelkarchin
    - skanderson
