{% set name = "open-cravat" %}
{% set version = "3.2.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/o/open-cravat/open_cravat-{{ version }}.tar.gz
  sha256: 1cf4a59aec23ee373397393b2b98448be3f257de26fc70985aacf5a8df6d5dcd

build:
  number: 0
  noarch: python
  script: {{PYTHON}} -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
  entry_points:
    - oc = cravat.oc:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - pip
    - python >=3.9
    - setuptools
  run:
    - aiohttp <4.0.0
    - aiosqlite
    - biopython
    - chardet >=3.0.4,<6.0.0
    - intervaltree
    - markdown
    - mpmath
    - nest-asyncio
    - openpyxl
    - oyaml
    - psutil
    - pyliftover
    - python >=3.9
    - setuptools
    - pyyaml
    - requests
    - requests-toolbelt
    - twobitreader
    - websockets
    - xlsxwriter
    - pyvcf3
    - looseversion
    - packaging >=25.0.0
    - flask
    - paste
    - waitress
    - whitenoise
    - flask-caching
    - cachelib
    - celery
    - cryptography

test:
  imports:
    - cravat

about:
  home: "https://www.opencravat.org"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "OpenCRAVAT - variant analysis toolkit"
  doc_url: "https://github.com/KarchinLab/open-cravat/wiki"
  dev_url: "https://github.com/KarchinLab/open-cravat"

extra:
  recipe-maintainers:
    - cvaske
    - kmoad
    - rachelkarchin
    - skanderson
