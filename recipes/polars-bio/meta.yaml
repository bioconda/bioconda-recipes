{% set name = "polars-bio" %}
{% set version = "0.33.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/polars_bio-{{ version }}.tar.gz
  sha256: 341b2e2821cee55efa428836b102769d6b31eb7c6d6c6444593cc9cddedd5ecd

build:
  number: 0
  # polars-bio requires Python >=3.11,<3.15 (pyproject.toml).
  skip: true  # [py < 311]
  run_exports:
    # Still 0.x with an evolving API, so pin downstream consumers to the
    # minor version rather than the major one.
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - cmake
    - make
    - pkg-config
    # The crate tree pulls several dependencies straight from git tags, so the
    # build environment needs a git client.
    - git
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
  host:
    - python
    - pip
    - maturin >=1.0,<2.0
  run:
    - python
    - polars >=1.37.1
    - pyarrow >=23.0.1,<25
    - datafusion >=53.0.0,<54
    - tqdm >=4.67.0,<5
    - polars-config-meta >=0.3.0,<1

test:
  imports:
    - polars_bio
  commands:
    - pip check
    # Exercise the compiled extension, not just the import.
    - python -c "import polars_bio as pb; print(pb.__version__)"
    # Run as a script, not under pytest: these commands are re-run inside the
    # mulled biocontainer, which only has the run dependencies, so anything
    # from `requires` below (pytest included) is absent there.
    - python test_overlap.py
  requires:
    - pip
  files:
    - test_overlap.py

about:
  home: https://github.com/biodatageeks/polars-bio
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: 'Blazing fast genomic operations on large Python dataframes'
  description: |
    polars-bio is a Python library for genomics built on top of Polars,
    Apache Arrow and Apache DataFusion. It provides a DataFrame API for
    genomics data and is designed to be fast, memory efficient and easy
    to use.

    Key features:
      - Popular genomic interval operations with a DataFrame API
      - SQL-powered querying of bioinformatics data
      - Native parallel engine powered by Apache DataFusion
      - Out-of-core / streaming processing
      - Reading from cloud storage
      - Zero-copy data exchange with Apache Arrow
      - Support for VCF, BAM, CRAM, SAM, FASTQ, FASTA, BED, GFF, GTF and
        BigWig/BigBed
  doc_url: https://biodatageeks.org/polars-bio/
  dev_url: https://github.com/biodatageeks/polars-bio

extra:
  recipe-maintainers:
    - mwiewior
  identifiers:
    - doi:10.1093/bioinformatics/btaf640
