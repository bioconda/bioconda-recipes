{% set name = "pyopal" %}
{% set version = "0.7.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c4c69fc4e71b258979fa0fd4a4bfd6933d104dc4823b9270b512b74d3bd9c49d

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - make
  host:
    - python
    - pip
    - cython
    - scikit-build-core
    - scoring-matrices >=0.2
  run:
    - python
    - archspec
    - scoring-matrices >=0.2

test:
  imports:
    - {{ name }}
  commands:
    - python -m unittest -vv {{ name }}.tests

about:
  home: "https://github.com/althonos/pyopal"
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: "Cython bindings and Python interface to Opal, a SIMD-accelerated pairwise aligner."
  doc_url: "https://pyopal.readthedocs.org"
  dev_url: "https://github.com/althonos/pyopal"

extra:
  recipe-maintainers:
    - althonos
  additional-platforms:
    - linux-aarch64
    - osx-arm64
