{% set version = "1.1.4" %}

package:
  name: virallc
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/v/virallc/virallc-{{ version }}.tar.gz
  sha256: 57e32472133b819b29e4d30ba23c98e513f154df223d26e086a05cfcf2cebe43

build:
  entry_points:
    - virallc = virallc.__main__:main
    - alnPairDist = virallc.scripts.alnPairDist:main
    - alnSeqCov = virallc.scripts.alnSeqCov:main
    - virallcClusters = virallc.scripts.virallcClusters:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8
    - setuptools
    - pip
  run:
    - python >=3.8
    - biopython
    - networkx
    - python-build
    - pandas
    - blast
    - mafft
    - nextclade

test:
  imports:
    - virallc
  commands:
    - virallc --help
    - alnPairDist --help
    - alnSeqCov --help
    - virallcClusters --help
  requires:
    - pip
    - python

about:
  home: https://github.com/ChrispinChaguza/virallc/
  summary: 'ViralLC: A Python package for consistent assignment of viral lineages'
  doc_url: https://github.com/ChrispinChaguza/virallc/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - chrispinchaguza
