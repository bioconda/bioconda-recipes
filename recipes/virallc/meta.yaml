{% set version = "1.1.5" %}

package:
  name: virallc
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/v/virallc/virallc-{{ version }}.tar.gz
  sha256: ae3c1a8d21e47864770f57aae4458ac5f5d565459081381fe911927957090084

build:
  entry_points:
    - virallc = virallc.__main__:main
    - alnPairDist = virallc.scripts.alnPairDist:main
    - alnSeqCov = virallc.scripts.alnSeqCov:main
    - virallcClusters = virallc.scripts.virallcClusters:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage('virallc', max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - setuptools
    - pip
  run:
    - python >=3.8
    - biopython
    - networkx
    - python-build
    - pandas
    - mafft
    - nextclade
    - blast

test:
  imports:
    - virallc
  commands:
    - virallc --help
    - alnPairDist --help
    - alnSeqCov --help
    - virallcClusters --help
  requires:
    - pip
    - python

about:
  home: https://github.com/ChrispinChaguza/virallc/
  summary: 'ViralLC: A utility for defining and assigning viral lineages consistently'
  doc_url: https://github.com/ChrispinChaguza/virallc/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - chrispinchaguza
