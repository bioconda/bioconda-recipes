{% set version = "2.8.8" %}
{% set python_min = "3.10" %}

package:
  name: phasis
  version: {{ version }}

source:
  url: https://github.com/blakemeyerslab/Phasis/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 36243865c4cc16470530968e26761258571bd6e14a6983d71e4096bfe2d86248

build:
  number: 0
  noarch: python
  run_exports:
    - {{ pin_subpackage('phasis', max_pin='x') }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - phasis = phasis.cli:main
    - phasis-compare = phasis.result_comparison:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >={{ python_min }}
    - numpy >=1.26.4
    # pandas 3.1 changed the order of groupby(sort=False).indices; one Phasis 2.8.8 code path
    # relies on the earlier order. Fixed upstream for the next release, which drops this bound.
    - pandas <3.1
    - scipy
    - scikit-learn >=1.3.2
    - matplotlib-base
    - seaborn
    - tqdm
    - hisat2
    - samtools >=1.10

test:
  requires:
    - python {{ python_min }}
  imports:
    - phasis
    - phasis.stages.classify
    - phasis.plot_style
  commands:
    - phasis -version
    - phasis -h
    - phasis-compare --help
    - hisat2 --version
    - samtools --version
    - python -c "from phasis import __version__; assert __version__ == '2.8.8'"
    - python -c "from phasis.deps_check import require_dependencies; require_dependencies()"

about:
  home: https://github.com/blakemeyerslab/Phasis
  license: Artistic-2.0
  license_file: LICENSE.txt
  summary: Detection and register-resolved interpretation of phased small-RNA loci
  doc_url: https://github.com/blakemeyerslab/Phasis/blob/main/README.md
  dev_url: https://github.com/blakemeyerslab/Phasis
