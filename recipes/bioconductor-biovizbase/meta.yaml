{% set version = "1.60.0" %}
{% set name = "biovizBase" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: 18490811e5b6351dd73e62f6b4b091c1

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-biovizbase", max_pin="x.x") }}'

# Suggests: BSgenome.Hsapiens.UCSC.hg19, TxDb.Hsapiens.UCSC.hg19.knownGene, BSgenome, rtracklayer, EnsDb.Hsapiens.v75, RUnit
requirements:

  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - make

  host:
    - bioconductor-annotationdbi >=1.74.0,<1.75.0
    - bioconductor-annotationfilter >=1.36.0,<1.37.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biostrings >=2.80.2,<2.81.0
    - bioconductor-ensembldb >=2.36.1,<2.37.0
    - bioconductor-genomeinfodb >=1.48.0,<1.49.0
    - bioconductor-genomicalignments >=1.48.0,<1.49.0
    - bioconductor-genomicfeatures >=1.64.0,<1.65.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-rsamtools >=2.28.0,<2.29.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - bioconductor-variantannotation >=1.58.0,<1.59.0
    - r-base
    - r-dichromat
    - r-hmisc
    - r-rcolorbrewer
    - r-rlang
    - r-scales
    - libblas
    - liblapack
    - zlib
    - liblzma-devel

  run:
    - bioconductor-annotationdbi >=1.74.0,<1.75.0
    - bioconductor-annotationfilter >=1.36.0,<1.37.0
    - bioconductor-biocgenerics >=0.58.1,<0.59.0
    - bioconductor-biostrings >=2.80.2,<2.81.0
    - bioconductor-ensembldb >=2.36.1,<2.37.0
    - bioconductor-genomeinfodb >=1.48.0,<1.49.0
    - bioconductor-genomicalignments >=1.48.0,<1.49.0
    - bioconductor-genomicfeatures >=1.64.0,<1.65.0
    - bioconductor-genomicranges >=1.64.0,<1.65.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-rsamtools >=2.28.0,<2.29.0
    - bioconductor-s4vectors >=0.50.3,<0.51.0
    - bioconductor-seqinfo >=1.2.0,<1.3.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - bioconductor-variantannotation >=1.58.0,<1.59.0
    - r-base
    - r-dichromat
    - r-hmisc
    - r-rcolorbrewer
    - r-rlang
    - r-scales

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: Artistic-2.0
  summary: Basic graphic utilities for visualization of genomic data.
  description: The biovizBase package is designed to provide a set of utilities, color schemes and conventions for genomic data. It serves as the base for various high-level packages for biological data visualization. This saves development effort and encourages consistency.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - biotools:biovizbase
    - doi:10.1038/nmeth.3252
  parent_recipe:
    name: bioconductor-biovizbase
    path: recipes/bioconductor-biovizbase
    version: 1.28.2