{% set name = "gwiscan" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/beavenmanjengwa/gwiscan/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 8f1a18c922aa49856b9d89494b35bc65ee626c3ff74dbce06135630558df2ecd

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
    - {{ pin_subpackage('gwiscan', max_pin="x") }}
  entry_points:
    - gwiscan = gwiscan.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.10
    - biopython >=1.80
    - pandas >=1.5
    - openpyxl >=3.1
    - requests >=2.28
    - pyyaml >=6.0
    - setuptools           # provides pkg_resources, imported by weblogo (not bundled on Python >=3.12)
    - hmmer
    - diamond
    - seqkit
    - mafft
    - clipkit
    - iqtree
    - meme
    - weblogo
    - r-base
    - r-ggplot2
    - r-dplyr
    - r-tidyr

test:
  imports:
    - gwiscan
  commands:
    - gwiscan --help
    - gwiscan --version

about:
  home: https://github.com/beavenmanjengwa/gwiscan
  license: MIT
  license_file: LICENSE
  summary: Genome-wide identification and annotation pipeline for gene families or superfamilies
  description: |
    GWIscan is a pipeline for the genome-wide identification and annotation of gene
    families and superfamilies which combines BLAST, profile hidden Markov models,
    and InterProScan. It runs in family, superfamily, or architecture modes, on a
    single proteome or across multiple species.
  dev_url: https://github.com/beavenmanjengwa/gwiscan

extra:
  recipe-maintainers:
    - beavenmanjengwa
