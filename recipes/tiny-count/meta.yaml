{% set version = "1.6.0" %}
{% set sha256 = "85e8a18dd03b804149151826056b85b1fe493a9ba3465273b96881074e798628" %}

package:
  name: tiny-count
  version: {{ version }}

source:
  url: https://github.com/MontgomeryLab/tinyRNA/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  skip: True  # [not unix]
  number: 0
  script: "{{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir"
  script_env:
    - tiny_count_only=1
  entry_points:
    - tiny = tiny.entry:main
    - tiny-config = tiny.rna.configuration:Configuration.main
    - tiny-collapse = tiny.rna.collapser:main
    - tiny-count = tiny.rna.counter.counter:main
    - tiny-plot = tiny.rna.plotter:main
  run_exports:
    - {{ pin_subpackage('tiny-count', max_pin="x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - python
    - setuptools
    - cython
    - pysam
    - pip
  run:
    - python

test:
  commands:
    - tiny-count -h

about:
  home: "https://github.com/MontgomeryLab/tinyRNA"
  license: "GPL-3.0-only"
  license_family: GPL3
  license_file: "LICENSE.md"
  summary: \
    A precision counting tool for hierarchical classification 
    and quantification of small RNA-seq reads. tiny-count is
    part of the tinyRNA analysis pipeline.
  dev_url: "https://github.com/MontgomeryLab/tinyRNA"
  doc_url: "https://github.com/MontgomeryLab/tinyRNA/blob/v{{ version }}/README.md"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
