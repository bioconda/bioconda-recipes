{% set version = "0.1.1" %}
{% set github = "https://github.com/acidgenomics/py-syntactic" %}

package:
  name: syntactic
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: d75464f45b1dbb0b6a406146f834eaf2e44b65627589ce796c5b826ec1b2a6b5

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  run_exports:
    - {{ pin_subpackage('syntactic', max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - pip
    - uv-build >=0.11,<1
  run:
    - python >=3.12

test:
  imports:
    - syntactic

about:
  home: https://python.acidgenomics.com/syntactic/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE
  summary: Make syntactically valid names out of strings.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
