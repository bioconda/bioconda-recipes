schema_version: 1

context:
  version: "1.3.2"

package:
  name: geneml
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/geneml/geneml-${{ version }}.tar.gz
  sha256: ba2a8caa46f9325a2c486fcfa5d2812b89c8d9cad6c639d4c3baf1aa65c1bb74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - geneml = geneml.main:main

requirements:
  host:
    - python >=3.9
    - hatchling >=1.27.0
    - hatch-vcs >=0.5.0
    - pip
  run:
    - python >=3.9
    - biopython >=1.78
    - enlighten >=1.14.1
    - helperlibs >=0.2.2
    - numba >=0.53.1
    - numpy >=1.21.0
    - psutil >=5.9.0
    - tensorflow >=2.17.0

tests:
  - python:
      imports:
        - geneml
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - geneml --help

about:
  summary: Gene Annotation Across Diverse Fungal Species Using Deep Learning
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://pypi.org/project/geneml/

extra:
  recipe-maintainers:
    - lhon
    - lisavader
