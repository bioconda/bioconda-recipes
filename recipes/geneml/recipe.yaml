schema_version: 1

context:
  version: "1.5.0"

package:
  name: geneml
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/geneml/geneml-${{ version }}.tar.gz
  sha256: 243cd4ba4ddda88d712c26db0a980f81814df8d6aeff5b6c0870b4e4c2841f44

build:
  number: 0
  skip: match(python, "<3.9")
  script: pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - geneml = geneml.main:main

requirements:
  host:
    - python
    - hatchling >=1.27.0
    - hatch-vcs >=0.5.0
    - pip
  run:
    - python >=3.9
    - biopython >=1.78
    - enlighten >=1.14.1
    - helperlibs >=0.2.2
    - numba >=0.60.0
    - if: target_platform == "osx-64"
      then: numba <0.61.0
    - numpy >=1.21.0
    - psutil >=5.9.0
    - if: target_platform == "linux-64"
      then: tensorflow-cpu >=2.16.2
    - if: target_platform != "linux-64"
      then: tensorflow >=2.16.2
    - if: target_platform == "osx-64"
      then: tensorflow <2.17.0

tests:
  - python:
      imports:
        - geneml
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - geneml --help

about:
  summary: Gene Annotation Across Diverse Fungal Species Using Deep Learning
  description: >-
    geneML uses a deep learning approach to predict genes from fungal genomic
    sequences and produces annotations in GFF3 format.
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/hexagonbio/geneML
  repository: https://github.com/hexagonbio/geneML

extra:
  recipe-maintainers:
    - lhon
    - lisavader
