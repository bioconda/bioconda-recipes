{% set name = "bqc" %}
{% set version = "0.0.1" %}

package:
 name: {{ name }}
 version: {{ version }}

source:
 url: https://github.com/hillerlab/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
 sha256: d7c1cc541441001f01f7254840ae15d08284a0e9b2c4dc0cf532e8ca4a9ff09a

build:
 number: 0
 run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("rust") }}
    - cargo-bundle-licenses

test:
 commands:
   - bqc --help
   - bqc --version

about:
 home: "https://github.com/hillerlab/bqc"
 license: "MIT"
 license_family: "MIT"
  license_file:
    - LICENSE
    - bqc/THIRDPARTY.yml
 summary: "CBQ-native all-in-one quality control tool"
 dev_url: "https://github.com/hillerlab/bqc"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - alejandrogzi
