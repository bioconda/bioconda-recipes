{% set name = "bqc" %}
{% set version = "0.0.4" %}

package:
 name: {{ name }}
 version: {{ version }}

source:
 url: https://github.com/hillerlab/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
 sha256: e9a2f643909768cdbe22e7c95af9cac7d3aaef68eb52d9d1da001fc3358c9762

build:
 number: 0
 run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("rust") }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses

test:
 commands:
   - bqc --help
   - bqc --version

about:
 home: "https://github.com/hillerlab/bqc"
 license: "MIT"
 license_family: "MIT"
 license_file:
   - LICENSE
   - bqc/THIRDPARTY.yml
 summary: "CBQ-native all-in-one quality control tool"
 dev_url: "https://github.com/hillerlab/bqc"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - alejandrogzi
