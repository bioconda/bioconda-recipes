{% set name = "transsplice" %}
{% set version = "0.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ARU-life-sciences/transsplice/archive/refs/tags/{{ version }}.tar.gz
  sha256: 9991739bb589747d45e2c012e8af1b6232893812128b56ffbec24587c232c255

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - transsplice --help

about:
  home: https://github.com/ARU-life-sciences/transsplice
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Reconstruct trans-spliced plant organellar genes from scattered exon hits
  dev_url: https://github.com/ARU-life-sciences/transsplice

extra:
  recipe-maintainers:
    - Euphrasiologist
  additional-platforms:
    - linux-aarch64
    - osx-arm64
