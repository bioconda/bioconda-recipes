{% set version = "2.20.0" %}
{% set name = "TreeSummarizedExperiment" %}
{% set bioc = "3.23" %}

package:
  name: bioconductor-{{ name|lower }}
  version: '{{ version }}'

source:
  url:
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/{{ name }}_{{ version }}.tar.gz
    - https://bioconductor.org/packages/{{ bioc }}/bioc/src/contrib/Archive/{{ name }}/{{ name }}_{{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/{{ name }}_{{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-{{ name|lower }}/bioconductor-{{ name|lower }}_{{ version }}_src_all.tar.gz
  md5: 2740057e81fa069b3d49d32f7649eee9

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports: '{{ pin_subpackage("bioconductor-treesummarizedexperiment", max_pin="x.x") }}'
  noarch: generic

# Suggests: ggtree, ggplot2, BiocStyle, knitr, rmarkdown, testthat
requirements:
  host:
    - bioconductor-biocgenerics >=0.58.0,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biostrings >=2.80.0,<2.81.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-s4vectors >=0.50.0,<0.51.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - bioconductor-treeio >=1.36.0,<1.37.0
    - r-ape
    - r-base
    - r-dplyr
    - r-rlang
  run:
    - bioconductor-biocgenerics >=0.58.0,<0.59.0
    - bioconductor-biocparallel >=1.46.0,<1.47.0
    - bioconductor-biostrings >=2.80.0,<2.81.0
    - bioconductor-iranges >=2.46.0,<2.47.0
    - bioconductor-s4vectors >=0.50.0,<0.51.0
    - bioconductor-singlecellexperiment >=1.34.0,<1.35.0
    - bioconductor-summarizedexperiment >=1.42.0,<1.43.0
    - bioconductor-treeio >=1.36.0,<1.37.0
    - r-ape
    - r-base
    - r-dplyr
    - r-rlang

test:
  commands:
    - $R -e "library('{{ name }}')"

about:
  home: https://bioconductor.org/packages/{{ bioc }}/bioc/html/{{ name }}.html
  license: GPL (>=2)
  summary: 'TreeSummarizedExperiment: a S4 Class for Data with Tree Structures'
  description: TreeSummarizedExperiment has extended SingleCellExperiment to include hierarchical information on the rows or columns of the rectangular data.
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

