{% set name = "evaladmix" %}
{% set version = "1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/GenisGE/evalAdmix/archive/refs/tags/v{{ version }}.tar.gz
  sha256: be19b174dd28d0546850be01abdecffd337ad1e95008ffe50b017d0ac7bc943d

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("evaladmix", max_pin="x.x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
  host:
    - zlib
  run:
    - zlib

test:
  commands:
    - evalAdmix

about:
  home: https://github.com/GenisGE/evalAdmix
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Evaluate model fit of inferred admixture proportions.

extra:
  identifiers:
    - doi:10.1111/1755-0998.13171
    - doi:10.1093/genetics/iyad157
