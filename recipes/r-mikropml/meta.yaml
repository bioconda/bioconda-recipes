{% set version = '1.7.1' %}

package:
  name: r-mikropml
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/mikropml_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/mikropml/mikropml_{{ version }}.tar.gz
  sha256: d939dab82719494d1b582bd3b64e0d9d2eafc3930fa4f27011e01a40f119f8d0

build:
  run_exports:
    - { pin_subpackage("r-mikropml", max_pin="x") }}

  noarch: generic

  merge_build_host: True  # [win]
  # If this is a new build for the same version, increment the build number.
  number: 0
  # no skip

  # This is required to make R link correctly on Linux.
  rpaths:
    - lib/R/lib/
    - lib/

# Suggests: assertthat, doFuture, forcats, foreach, furrr, future, future.apply, ggplot2, knitr, progress, progressr, purrr, rmarkdown, roxygen2, rsample, styler, testthat, tidyr, usethis
requirements:

  host:
    - r-base
    - r-mlmetrics
    - bioconductor-s4vectors
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment
    - bioconductor-treesummarizedexperiment
    - r-caret
    - r-dplyr
    - r-e1071
    - r-glmnet
    - r-kernlab
    - r-randomforest
    - r-rlang
    - r-rpart
    - r-tidyselect
    - r-xgboost

  run:
    - r-base
    - r-mlmetrics
    - bioconductor-s4vectors
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment
    - bioconductor-treesummarizedexperiment
    - r-caret
    - r-dplyr
    - r-e1071
    - r-glmnet
    - r-kernlab
    - r-randomforest
    - r-rlang
    - r-rpart
    - r-tidyselect
    - r-xgboost

test:
  commands:
    - $R -e "library('mikropml')"           # [not win]

about:
  home: https://www.schlosslab.org/mikropml/, https://github.com/SchlossLab/mikropml
  license: MIT
  summary: "An interface to build machine learning models for classification and regression problems.
    'mikropml' implements the ML pipeline described by Top\xE7uo\u011Flu et al. (2020)
    <doi:10.1128/mBio.00434-20> with reasonable default options for data preprocessing,
    hyperparameter tuning, cross-validation, testing, model evaluation, and interpretation
    steps.  See the website <https://www.schlosslab.org/mikropml/> for more information,
    documentation, and examples."
  license_family: MIT
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/MIT'
    - LICENSE

