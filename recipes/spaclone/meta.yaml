{% set name = "spaclone" %}
{% set version = "1.0.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2c65f43f385ee780efa49642416430e86c8dab24d8a04859ba92d1cc398e2b56

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - spaclone = spaclone.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - anndata >=0.10.8
    - h5py >=3.11
    - python-igraph >=0.11
    - matplotlib-base >=3.8.4
    - numpy >=2
    - pandas >=2.2.2
    - pyarrow >=16
    - scanpy >=1.10
    - scikit-learn >=1.4.2
    - scipy >=1.13

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - spaclone
  commands:
    - pip check
    - spaclone --help

about:
  home: https://github.com/Reynold4k/spaclone
  summary: "Spatial BCR and TCR analysis, from raw tables to biology, with every position checked against random placement."
  description: |
    spaclone reads a spatial transcriptome and an immune-receptor table from any mainstream tool, tests whether
    receptor positions can be trusted, maps class-switch and somatic-hypermutation hotspots with their transcriptome
    identity, places lineage trees on the tissue and runs sciCSR-style class-switch dynamics on spatial graphs.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/Reynold4k/spaclone
  doc_url: https://github.com/Reynold4k/spaclone/tree/main/docs

extra:
  recipe-maintainers:
    - Reynold4k
  identifiers:
    - doi:10.5281/zenodo.23826886
