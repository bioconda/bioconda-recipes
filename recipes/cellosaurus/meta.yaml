{% set version = "0.2.1" %}
{% set github = "https://github.com/acidgenomics/py-cellosaurus" %}

package:
  name: cellosaurus
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/a/acidgenomics-cellosaurus/acidgenomics_cellosaurus-{{ version }}.tar.gz"
  sha256: dc4804a94db2e951c999b49da7a98c8220f8b458485fd1350e0219601f2d3827

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  run_exports:
    - {{ pin_subpackage('cellosaurus', max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - pip
    - uv-build >=0.11,<1
  run:
    - python >=3.12
    - pandas

test:
  imports:
    - cellosaurus

about:
  home: https://python.acidgenomics.com/cellosaurus/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE
  summary: Cellosaurus identifier mapping toolkit.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
