{% set version = "0.2.1" %}
{% set github = "https://github.com/acidgenomics/py-cellosaurus" %}

package:
  name: cellosaurus
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 7870feddd5e573f2990dc97abd0e4a5e75d7dfeb3dd43cc24730c57152d40be5

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  run_exports:
    - {{ pin_subpackage('cellosaurus', max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - pip
    - uv-build >=0.11,<1
  run:
    - python >=3.12
    - pandas

test:
  imports:
    - cellosaurus

about:
  home: https://python.acidgenomics.com/cellosaurus/
  dev_url: "{{ github }}"
  license: Apache-2.0
  license_file: LICENSE
  summary: Cellosaurus identifier mapping toolkit.

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
