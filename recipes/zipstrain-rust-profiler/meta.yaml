{% set name = "zipstrain-rust-profiler" %}
{% set version = "0.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/z/{{ name }}/zipstrain_rust_profiler-{{ version }}.tar.gz
  sha256: 2c5f72a2863688823d52eca4096617691ae250293a9c5ba409d242edef3aa44a

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - pkg-config
    - clangdev
    - libclang
    - cargo-bundle-licenses
  host:
    - python >=3.12
    - pip
    - maturin >=1.8,<2
    - zlib
  run:
    - python >=3.12
    - zipstrain >=1.2.0,<2
    - polars >=1.34,<2
    - pyarrow >=22,<23

test:
  imports:
    - zipstrain_rust_profiler
  source_files:
    - tests/data
    - tests/test_profile_parity.py
  requires:
    - pytest
  commands:
    - command -v zipstrain-rust-profiler
    - python -c "from zipstrain.profile_backends import load_backend; assert load_backend('rust_profiler').API_VERSION == 1"

about:
  home: https://github.com/OlmLab/ZipStrain
  dev_url: https://github.com/OlmLab/ZipStrain
  doc_url: https://olmlab.github.io/ZipStrain/plugins/
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "Native multithreaded profiling backend for ZipStrain."

extra:
  skip-lints:
    - version_constraints_missing_whitespace
  recipe-maintainers:
    - parsaghadermarzi
  additional-platforms:
    - linux-aarch64
    - osx-arm64
