{% set version = "1.0.0" %}

package:
  name: mashpit
  version: '{{ version }}'

source:
  url: https://github.com/tongzhouxu/mashpit/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 631ed8ef56884ce46fae5708353ce81152e96a2d8966f0bd54d6f371fb4e15f4
  patches:
    # conda-forge's final 3.7.x build is 3.7.3; keep installed metadata consistent.
    - matplotlib-conda.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation --no-cache-dir . -vvv
  number: 0
  entry_points:
    - mashpit = mashpit.mashpit:main
  run_exports:
    - {{ pin_subpackage("mashpit", max_pin="x.x") }}

requirements:
  host:
    - python >=3.8,<3.11
    - pip
    - setuptools >=75.1.0,<75.2
  run:
    # sourmash 4.6.1 has no Python 3.11 builds on linux-64 or osx-64.
    - python >=3.8,<3.11
    - sourmash >=4.6.1,<4.7
    - screed >=1.0.5,<1.1.3
    - pandas >=2.0.3,<2.1
    - numpy >=1.24.4,<1.25
    - pyarrow >=7,<26
    - biopython >=1.83,<2
    - scikit-bio >=0.6.2,<0.7
    - tqdm >=4.67.0,<4.68
    - matplotlib-base >=3.7.3,<3.8
    - streamlit >=1.40.1,<1.41
    - requests
    - ncbi-datasets-cli >=16.10
    - altair >=4.0,<6
    # sourmash 4.6.1 imports pkg_resources, removed in setuptools 82.
    - setuptools <82

test:
  imports:
    - mashpit.mashpit
    - mashpit.report
    - mashpit.tree_plot
    - pyarrow
    - streamlit
    - matplotlib
  commands:
    - mashpit --help
    - mashpit gui --help
    - datasets --help
    - python -c "from mashpit.tree_plot import render_tree; png, svg, tips = render_tree('(a:1,b:1);'); assert png.startswith(b'\x89PNG') and b'<svg' in svg and tips == 2"

about:
  home: https://github.com/tongzhouxu/mashpit
  license: "GPL-2.0-or-later"
  license_family: GPL2
  license_file: LICENSE
  summary: "Sketch-based surveillance platform."
  dev_url: https://github.com/tongzhouxu/mashpit

