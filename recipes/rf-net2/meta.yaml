{% set name = "rf-net2" %}
{% set version = "2.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  noarch: generic
  number: 0
  skip: false
  run_exports:
    - {{ pin_subpackage("rf-net2", max_pin="x.x") }}

source:
  url: https://github.com/flu-crew/rf-net-2/archive/refs/heads/main.zip
  sha256: fdf5c48b1aa45b9da192105f2296194e36db7be459c0030b221090324cb3f0b7

requirements:
  build:
  host:
    - openjdk >=11.0.1
    - zlib
    - wget
    - unzip
  run:
    - openjdk >=11.0.1
    - zlib
    - wget
    - unzip

test:
  commands:
    - java -jar RF-Net-2.0.4.jar -h

about:
  home: https://github.com/flu-crew/rf-net-2
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: 'A tool for fast inference of virus reassortment and hybridization networks'

extra:
  additional-platforms:
    - linux-aarch64
  identifiers:
    - biotools:rf-net2
    - doi:10.1093/bioinformatics/btac075