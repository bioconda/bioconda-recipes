{% set name = "panteraga" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/piosierra/panteraGA/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 3bdfc9b3e0fdfceace191b8f69a86cd68b487122d26eace6cbc8e11fe7d03e1c
  # HMM classifier libraries pantera_hmm_v2 (CC0), doi:10.5281/zenodo.24543291
  - url: https://zenodo.org/records/24543291/files/pantera_hmm_v2.tar.gz
    sha256: cb9ece1055401fc5141f36cf8781f1bed590c2eee0f921cd1410c2a2ee328156
    folder: zenodo_hmm

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  run:
    - r-base >=4.1
    - r-getopt
    - r-codetools
    - r-ape
    - r-stringi
    - r-data.table
    - bioconductor-biostrings
    - mafft
    - blast >=2.12  # blastn, makeblastdb, dustmasker (-mt_mode needs 2.12)
    - cd-hit        # cd-hit-est
    - fastga        # FastGA, ONEview, FAtoGDB, GIXmake
    - alntools      # svfind
    - fastan        # FasTAN (tandem masking, the default)
    - hmmer         # hmmsearch, nhmmer (HMM classifier)
    - miniprot      # protein-to-DNA alignment (HMM classifier)
    - infernal      # cmscan, cmfetch, cmalign (SINE heads, ncRNA flag)
    - trf           # tandem repeat flag
    # optional: diamond, only for the host-protein part of the libraries (built by
    # model/hmm/host_build/build_host_part.sh, not shipped)

test:
  commands:
    - panteraGA -h
    - test -s $PREFIX/share/{{ name }}-{{ version }}/scripts/pantera_classify.R
    - test -s $PREFIX/share/{{ name }}-{{ version }}/model/label_map.tsv
    - test -s $PREFIX/share/{{ name }}-{{ version }}/model/hmm/prot/pantera_v5.cal.hmm.gz
    - test -s $PREFIX/share/{{ name }}-{{ version }}/model/hmm/tir/pantera_tir_ends.hmm.gz
    - hmmsearch -h > /dev/null
    - miniprot --version
    - cmscan -h > /dev/null

about:
  home: https://github.com/piosierra/panteraGA
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Generate a Transposable Elements library from a FastGA whole genome alignment.
  description: |
    panteraGA builds a library of polymorphic transposable elements from FastGA whole-genome alignments and
    classifies it with an HMM classifier. The classifier's model libraries (pantera_hmm_v2, CC0) are
    downloaded from Zenodo (doi:10.5281/zenodo.24543291).
  dev_url: https://github.com/piosierra/panteraGA

extra:
  recipe-maintainers:
    - piosierra
