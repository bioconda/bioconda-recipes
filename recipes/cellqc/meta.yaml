{% set name = "cellqc" %}
{% set version = "0.3.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 2c0a524872c2c3a14b7b99a7db7a4acd8a38330866cb6fa7755607ce116b8388

build:
  number: 0
  entry_points:
    - cellqc=cellqc.cellqc:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  script: "{{ PYTHON }} -m pip install . -vv"
  noarch: python

requirements:
  host:
    - click
    - pip
    - pygraphviz
    - python {{ python_min }}
    - snakemake
  run:
    - click
    - pygraphviz
    - python >={{ python_min }}
    - snakemake
    - bioconductor-dropletutils
    - r-seurat
    - r-seuratobject
    - r-dplyr
    - r-ggplot2
    - r-soupx >=1.6.2
    - r-harmony
    - r-remotes
    - r-scpred
    - scanpy >=1.9.1
    - numpy
    - anndata =0.7.8
    - graphviz

test:
  imports:
    - cellqc
  commands:
    - cellqc --help

about:
  home: "https://github.com/lijinbio/cellqc"
  license: MIT
  license_family: MIT
  license_file: "LICENSE"
  summary: "Cellqc standardizes the qualiy control of single-cell RNA-Seq (scRNA) data to render clean feature count matrices."

extra:
  recipe-maintainers:
    - lijinbio
