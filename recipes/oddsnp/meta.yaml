{% set version = "0.1.2" %}
{% set name = "oddsnp" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/o/oddsnp/oddsnp-{{ version }}.tar.gz
  sha256: bb12d25e914b7e1c323db4eca1c59942ecfe9531082613dc3814182629549e0b
  
build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0
  run_exports:
    - {{ pin_subpackage("oddsnp", max_pin="x.x") }}

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools

  run:
    - python >=3.12
    - click
    - pandas
    - pysam >=0.17
    - plotly
    - nbformat
    - python-kaleido      # conda-forge name for kaleido
    - tqdm
    - scipy
    - requests
    - ipykernel
    - threadpoolctl
    - vireosnp
    - cellsnp-lite 

test:
  imports:
    - oddSNP
  commands:
    - oddSNP --help
  requires:
    - python
    - pip

about:
  home: https://github.com/nemoto-lab/oddSNP
  summary: A CLI tool for Optimizing demultiplexing pooled experiments based on Single-Nucleotide Polymorphism
  doc_url: https://nemoto-lab.github.io/oddSNP/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - RodolfoAllendes
