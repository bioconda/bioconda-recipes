{% set name = "gecode" %}
{% set version = "6.3.0" %}
{% set sha256 = "3edd6b13a6b9543614f7377c53a71c565ff315898d4788b651d01285bf91100a" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/Gecode/gecode/archive/release-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  #skip: True  # [osx]
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin = "x") }}

requirements:
  build:
    - make
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - perl
    - mpfr
    - gmp
  run:
    - mpfr
    - gmp

test:
  commands:
    - fzn-gecode --help >& /dev/null
    - magic-sequence --help >& /dev/null

about:
  home: "https://github.com/gecode/gecode"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Generic constraint development environment."
  doc_url: "https://www.gecode.dev"
  dev_url: "https://github.com/gecode/gecode"

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
