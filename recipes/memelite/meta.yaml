{% set name = "memelite" %}
{% set version = "0.5.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/memelite/memelite-{{ version }}.tar.gz
  sha256: 42f3e141c566b713d4caadadd8e9f4ca88c0993177b79eaca37782d91a036f60

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  entry_points:
    - ttl = memelite.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - uv-build >=0.11.14,<0.12.0
  run:
    - python >=3.9
    - numba >=0.55.1
    - numpy >=1.14.2
    - pandas >=1.3.3
    - pyfaidx >=0.7.2.1
    - tqdm >=4.64.1

test:
  imports:
    - memelite
    - memelite.fimo
    - memelite.tomtom
  requires:
    - pip
  commands:
    - pip check
    - ttl --help

about:
  home: https://github.com/jmschrei/memesuite-lite
  summary: Fast numba re-implementations of MEME suite tools (Tomtom, FIMO) as Python functions.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/jmschrei/memesuite-lite

extra:
  recipe-maintainers:
    - musharna
