{% set name = "rmats" %}
{% set version = "4.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  sha256: 974a4038dfea70c5760e6b41beb8b44d6989bf30e1a0869d105120165fe734a0
  url: https://github.com/Xinglab/rmats-turbo/releases/download/v{{ version }}/rmats_turbo_v{{ version|replace(".","_") }}.tar.gz

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - libgomp  # [linux]
    - cmake
  host:
    - python
    - cython
    - numpy
    - gsl
    - zlib
    - libblas
    - liblapack
    - setuptools
  run:
    - python
    - numpy
    - gsl
    - zlib
    - star >=2.5  # [not (osx and arm64)]

test:
  commands:
    - rmats.py --version
    - $PREFIX/rMATS/rMATS_C/rMATSexe | grep "Fail to open"

about:
  home: http://rnaseq-mats.sourceforge.net
  license: Free for non-commercial use, see LICENSE file
  summary: MATS is a computational tool to detect differential alternative splicing events from RNA-Seq data.
  license_file: LICENSE

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
