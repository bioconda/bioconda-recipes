{% set name = "skder" %}
{% set version = "1.3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/raufs/skDER/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 71a7ec466dd2c26c0fae482d48348250f3f8a75ca8c2c263a89c62877a35ebed

build:
  number: 1
  skip: True # [py <= 310]
  run_exports:
    - {{ pin_subpackage('skder', max_pin='x') }}
  script:
    - set -euxo pipefail
    - "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
    - mkdir -p ${PREFIX}/bin
    - export LDFLAGS=
    - "${CXX} -std=c++11 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/skDERsum src/skDER/skDERsum.cpp"
    - "${CXX} -std=c++11 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/skDERcore src/skDER/skDERcore.cpp"
    - chmod +x ${PREFIX}/bin/skDERcore
    - chmod +x ${PREFIX}/bin/skDERsum

requirements:
  build:
     - {{ compiler('cxx') }}
     - {{ stdlib('c') }}
  host:
    - python
    - setuptools
    - pip
    - wget
  run:
    - python >=3.11
    - biopython
    - setuptools
    - skani
    - wget
    - numpy
    - seaborn
    - matplotlib-base
    - python-igraph
    - pandas
    - pyrodigal
    - cd-hit
    - aiofile
    - aiohttp
    - tqdm
    - diamond >=2.1.11

test:
  commands:
    - skder -h

about:
  home: https://github.com/raufs/skDER
  license: BSD-3-Clause license
  license_file: LICENSE
  license_family: BSD
  summary: "skDER & CiDDER: efficient & high-resolution dereplication methods for microbial genomes"
  dev_url: https://github.com/raufs/skDER

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - raufs
