{% set name = "acinetoscope" %}
{% set version = "1.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/bbeckley-hub/acinetoscope/archive/refs/tags/v{{ version }}.tar.gz
  sha256: cc8374b55f134a4016a66e8df99606d9455d0fc7ea1ac3fbfa3674de89e5be0d

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
  run:
    - python >=3.9
    - pandas >=1.5.0
    - biopython >=1.85
    - psutil >=5.9.0
    - requests >=2.28.0
    - tqdm >=4.64.1
    - click >=8.0.0
    - kaptive >=3.1.0
    - beautifulsoup4 >=4.11.0
    - lxml >=4.9.0
    - matplotlib-base >=3.5.0
    - seaborn >=0.12.0
    - scipy >=1.10.1
    - plotly >=5.10.0
    - abricate >=1.2.0
    - fastani >=1.34
    - mlstdb >=1.3.0
    - diamond >=2.1.10
    - prodigal >=2.6.3
    - perl
    - any2fasta
    - blast >=2.13.0
    - perl-moo
    - perl-list-moreutils
    - perl-json
    - perl-lwp-protocol-https
    - perl-path-tiny
    - perl-data-dumper
    - perl-getopt-long
    - perl-file-which

test:
  commands:
    - acinetoscope --help
    - acinetoscope --help | grep -q -- '--pull-mge-db'

about:
  home: https://github.com/bbeckley-hub/acinetoscope
  license: MIT
  license_file: LICENSE
  summary: 'AcinetoScope: Comprehensive A. baumannii genomic typing pipeline with parallel execution'
  description: |
    AcinetoScope is a complete, automated genomic analysis pipeline for Acinetobacter
    baumannii, featuring parallel execution for rapid processing of bacterial genomes.
    The pipeline integrates multiple analysis modules into a unified workflow: FASTA QC
    with FASTANI species confirmation, dual MLST (Pasteur and Oxford), Kaptive K/O
    locus typing, AMRFinderPlus resistance detection, ABRicate multi-database screening,
    APT plasmid typing, mobileOG-db MGE profiling, and gene-centric plus sample-centric
    interactive HTML reports.

    The mobileOG-db payload (~1 GB) is fetched at runtime with `acinetoscope --pull-mge-db`.
    Docker and Singularity images bundle the data and need neither step.
  doc_url: https://github.com/bbeckley-hub/acinetoscope
  dev_url: https://github.com/bbeckley-hub/acinetoscope

extra:
  recipe-maintainers:
    - bbeckley-hub
