{% set name = "varcode" %}
{% set version = "10.18.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2732c01413a51cc1eaeb1f6d08aae413f5593916c3bf4465b6fd6b03b8bc66c8

build:
  number: 0
  noarch: python
  entry_points:
    - varcode-genes = varcode.cli.genes_script:main
    - varcode = varcode.cli.main:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
  run:
    - python >=3.11
    - memoized-property >=1.0.2
    - numpy >=2.0.0,<3
    - pandas >=2.2.2,<3
    - pyensembl >=2.30.0
    - gtfparse >=3.0.2,<4
    - sercol >=1.0.3
    - serializable >=1.1.0

test:
  imports:
    - test
    - varcode
    - varcode.cli
    - varcode.effects
  commands:
    - varcode-genes --help
    - varcode --help

about:
  home: "https://github.com/openvax/varcode"
  license: "Apache-2.0"
  license_family: APACHE
  license_file: LICENSE
  summary: "Variant annotation in Python."
  dev_url: "https://github.com/openvax/varcode"
  doc_url: "https://github.com/openvax/varcode/blob/main/README.md"

extra:
  recipe-maintainers:
    - jonasscheid
