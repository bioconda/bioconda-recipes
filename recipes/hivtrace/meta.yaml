{% set name = "hivtrace" %}
{% set version = "0.10.2" %}
{% set sha256 = "9236586ef0dc2fcf565b42ecad8f1f54ec1c1530293c33975be915490f2bf1f6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - {{ pin_subpackage('hivtrace', max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - biopython >=1.58
    - tornado >=4.3
    - python-hppy >=0.9.9
    - python-hyphy-python >=0.1.11
    - python-hivclustering >=1.6.8
    # hivtrace shells out to these at run time
    - cawlign
    - tn93 >=1.0.6

test:
  commands:
    - hivtrace -h 2>&1 | grep 'usage' > /dev/null
    - hivtrace_strip_drams -h 2>&1 | grep 'usage' > /dev/null
    - hivtrace_viz -h 2>&1 | grep 'Usage' > /dev/null
    - command -v cawlign
    - command -v tn93

about:
  home: https://github.com/veg/hivtrace
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'HIV TRACE is an application that identifies potential transmission clusters within a supplied FASTA file with an option to find potential links against the Los Alamos HIV Sequence Database.'
  dev_url: https://github.com/veg/hivtrace
