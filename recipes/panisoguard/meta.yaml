{% set name = "panisoguard" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/jibeomko/PanIsoGuard/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e00a11ceb4a1a45367418a8a23cf631bf70e78f3eff305be3e78d362995e092f

build:
  number: 0
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cmake >=3.20
    - make
  host:
    - htslib >=1.18
  run:
    - htslib >=1.18

test:
  commands:
    - panisoguard --version
    - panisoguard --help > /dev/null
    - panisoguard adjudicate --help > /dev/null
    - panisoguard combine --help > /dev/null
    - >-
      printf '%b'
      'chr1\ttest\texon\t101\t200\t.\t+\t.\tgene_id "G1"; transcript_id "T1";\nchr1\ttest\texon\t301\t400\t.\t+\t.\tgene_id "G1"; transcript_id "T1";\nchr1\ttest\texon\t501\t600\t.\t+\t.\tgene_id "G1"; transcript_id "T1";\nchr1\ttest\texon\t101\t200\t.\t+\t.\tgene_id "G1"; transcript_id "T2";\nchr1\ttest\texon\t501\t600\t.\t+\t.\tgene_id "G1"; transcript_id "T2";\n'
      > mini.gtf
    - panisoguard combine --gtf flair:mini.gtf --out combine_smoke.tsv
    - test -s combine_smoke.tsv
    - >-
      cd "$(mktemp -d)" && panisoguard example tiny && cd tiny && mkdir -p out &&
      panisoguard adjudicate --classification data/classification.tsv --isoforms-gtf data/caller.gtf
      --ref-gtf data/reference.gtf --sj-tab data/short_read.SJ.tab --out-prefix out/sample &&
      diff -u expected/sample.adjudicated.tsv out/sample.adjudicated.tsv &&
      diff -u expected/sample.attribution.jsonl out/sample.attribution.jsonl &&
      diff -u expected/sample.junctions.tsv out/sample.junctions.tsv

about:
  home: https://github.com/jibeomko/PanIsoGuard
  dev_url: https://github.com/jibeomko/PanIsoGuard
  doc_url: https://github.com/jibeomko/PanIsoGuard#readme
  license: MIT AND BSL-1.0
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.txt
    - thirdparty/catch2/LICENSE.txt
    - thirdparty/tomlplusplus/LICENSE
  summary: Caller-agnostic adjudication of long-read RNA-seq novel isoforms
  description: |
    PanIsoGuard ingests novel isoform calls from long-read RNA-seq callers
    (FLAIR/IsoQuant/Bambu/...) and/or SQANTI3 output, plus a BAM and optional
    short-read SJ.tab and personalized haplotype FASTAs, and re-classifies each
    novel call into a confidence class with a mechanistic attribution and a
    provenance/circularity flag. Depends only on htslib.

extra:
  recipe-maintainers:
    - jibeomko
  additional-platforms:
    - osx-arm64
