{% set version = "0.10.0" %}
{% set commit = "eb206c807b01ab856f82a87502b43e27960a7471" %}

package:
  name: admixld
  version: {{ version }}

source:
  url: https://github.com/yzfranci/AdmixLD/archive/{{ commit }}.tar.gz
  sha256: ffe3dfa1204f8fb7df0558fbf82a37fc623ff1bc2e07b9e237614190c958beca

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('admixld', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.16
    - make
  host:
    - htslib
    - eigen
    - libgomp      # [linux]
    - llvm-openmp  # [osx]
  run:
    - htslib

test:
  commands:
    - admixld --help

about:
  home: https://github.com/yzfranci/AdmixLD
  license: MIT
  license_file: LICENSE
  summary: Fast genome-scale inference of ancestry disequilibrium in hybrid zones.

extra:
  recipe-maintainers:
    - yzfranci
