{% set name = "ecolityper" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/bbeckley-hub/EcoliTyper/archive/v{{ version }}.tar.gz
  sha256: 9819cb9bc87e79e452206239f6414c241a7e57b31f1c2eb4e49c682fff802d1b

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - pandas >=1.5.0
    - biopython >=1.80
    - psutil >=5.9.0
    - requests >=2.28.0
    - tqdm >=4.64.0
    - click >=8.0.0
    - tabulate >=0.9.0
    - beautifulsoup4 >=4.11.0
    - lxml >=4.9.0
    - matplotlib-base >=3.5.0
    - seaborn >=0.12.0
    - scipy >=1.10.1
    - plotly >=5.10.0
    - abricate >=1.2.0
    - fastani >=1.34
    - ezclermont >=0.7.0
    - mlstdb >=1.3.0                # NEW
    - diamond >=2.1.10              # NEW
    - prodigal >=2.6.3              # NEW
    - ecolityper-mge-data =={{ version }}   # NEW
    - perl
    - any2fasta
    - cgecore >=1.5.6
    - blast >=2.13.0
    - perl-moo
    - perl-list-moreutils
    - perl-json
    - perl-lwp-protocol-https
    - perl-path-tiny
    - perl-data-dumper
    - perl-getopt-long
    - perl-file-which

test:
  commands:
    - ecolityper --help
    - python -c "import ecoliTyper; print('EcoliTyper imported successfully')"
    - test -d $PREFIX/share/ecolityper/modules/mge_module/mobileOG-db/beatrix-1-6_v1_all

about:
  home: https://github.com/bbeckley-hub/EcoliTyper
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Comprehensive E. coli Typing Pipeline: MLST, Serotyping, CH Typing, Phylogrouping, AMR, and Virulence Analysis'
  description: |
    EcoliTyper is a comprehensive bioinformatics pipeline for complete Escherichia coli
    genomic characterization. It integrates multiple typing schemes including MLST,
    serotyping (O and H antigens), CH typing (FumC and FimH), ezClermont phylogrouping,
    antibiotic resistance detection (AMRFinderPlus), virulence/plasmid screening (ABRicate),
    and mobile genetic element profiling (mobileOG-db).
  doc_url: https://github.com/bbeckley-hub/EcoliTyper
  dev_url: https://github.com/bbeckley-hub/EcoliTyper

extra:
  recipe-maintainers:
    - bbeckley-hub

  autobump:
    enable: false
