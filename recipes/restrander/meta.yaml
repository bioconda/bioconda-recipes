{% set name = "restrander" %}
{% set version = "1.1.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mritchielab/restrander/archive/refs/tags/v{{ version }}.tar.gz
  sha256: d2a811d08deadd4d4b0a11fe0aa87311eebe31e59e4cdcaebe6f5307560ae359

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('restrander', max_pin='x') }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
  host:
    - zlib

test:
  commands:
    - restrander --help
    - test -f "${PREFIX}/share/restrander/config/PCB109.json"

about:
  home: https://github.com/mritchielab/restrander
  license: MIT
  license_file: LICENSE
  summary: A fast, accurate program for orienting and quality-checking cDNA sequencing reads

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - qingxiangguo
