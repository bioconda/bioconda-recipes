{% set name = "restrander" %}
{% set version = "1.1.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mritchielab/restrander/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e046ffa436a64c54339d766d62baa4f9392f3cc78ce6d0f6f119895d7a2905f4

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
  host:
    - zlib
  run:
    - zlib

test:
  commands:
    - restrander --help
    - test -f "${PREFIX}/share/restrander/config/PCB109.json"

about:
  home: https://github.com/mritchielab/restrander
  license: MIT
  license_file: LICENSE
  summary: A fast, accurate program for orienting and quality-checking cDNA sequencing reads

extra:
  recipe-maintainers:
    - qingxiangguo
