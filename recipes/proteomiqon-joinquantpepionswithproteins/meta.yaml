{% set name = "proteomiqon-joinquantpepionswithproteins" %}
{% set version = "0.1.0" %}
{% set sha256 = "73659089a5e5670db82d1927d4b856484eda5eba716ecfa8b08bbf25d1b5db32" %}

package:
  name: '{{name}}'
  version: '{{ version }}'

source:
  url: https://www.nuget.org/api/v2/package/ProteomIQon.JoinQuantPepIonsWithProteins/{{ version }}
  sha256: '{{ sha256 }}'

build:
  noarch: generic
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  

requirements:
  build: 
    - {{ stdlib('c') }}
  host:
    - unzip
  run:
    - dotnet-runtime >=10.0, <11.0
    - zlib

test:
  commands:
    - test -x "$PREFIX/bin/proteomiqon-joinquantpepionswithproteins"
    - test -f "$PREFIX/lib/dotnet/tools/JoinQuantPepIonsWithProteins/ProteomIQon.JoinQuantPepIonsWithProteins.dll"
    # Sanity-check the wrapper is valid bash and points at the right DLL
    - bash -n "$PREFIX/bin/proteomiqon-joinquantpepionswithproteins"
    - grep -q "JoinQuantPepIonsWithProteins/ProteomIQon.JoinQuantPepIonsWithProteins.dll" "$PREFIX/bin/proteomiqon-joinquantpepionswithproteins"


about:
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: "Links quantified peptide ions to their inferred protein groups and q-values."
  description: |
    A .quant file contains the intensities of peptide ions. A .prot file provides their protein-group assignments and the associated confidence. JoinQuantPepIonsWithProteins combines these files by expanding the semicolon-separated peptide sequences in the protein table and matching them to quantified peptide ions. Matching ions receive their protein group and q-value.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/join-quant-with-peptide-ions/
