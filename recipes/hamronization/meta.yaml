{% set name = "hamronization" %}
{% set version = "1.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hamronization-{{ version }}.tar.gz
  sha256: 8a4292897a19a1224e1f621da194739d527c8443a9978aede3bf5a844cbcb00d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin='x.x') }}

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools
  run:
    - python >=3.7
    - pandas

test:
  imports:
    - hAMRonization
  commands:
    - pip check
    - hamronize --help
  requires:
    - pip

about:
  home: https://github.com/pha4ge/hAMRonization
  summary: Tool to convert and summarize AMR gene detection outputs using the hAMRonization specification
  license: LGPL-3.0-only
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - fmaguire
