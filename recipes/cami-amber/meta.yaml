{% set version = "2.0.8" %}

package:
  name: cami-amber
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/cami-amber/cami_amber-{{ version }}.tar.gz
  sha256: 49127e588dc8008739c0d9e25ba15573710447b33355b6bfdce62791ec4413d0

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage("cami-amber", max_pin="x") }}
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
    - cp -rf ./cami_amber/utils/add_length_column.py $PREFIX/bin
    - cp -rf ./cami_amber/utils/convert_fasta_bins_to_biobox_format.py $PREFIX/bin
    - cp -rf ./cami_amber/utils/argparse_parents.py $PREFIX/bin

requirements:
  host:
    - python >=3.6
    - pip
    - setuptools
  run:
    - python >=3.6
    - numpy >=2.0.1
    - biopython >=1.86
    - matplotlib-base >=3.10.8
    - pandas >=2.2.2
    - bokeh >=3.8.2
    - seaborn-base >=0.13.2
    - jinja2 >=3.1.6
    - pyarrow >=17.0.0

test:
  commands:
    - amber.py --help
    - add_length_column.py -h
    - convert_fasta_bins_to_biobox_format.py -h

about:
  home: https://github.com/CAMI-challenge/AMBER
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: 'AMBER: Assessment of Metagenome BinnERs'
  dev_url: https://github.com/CAMI-challenge/AMBER
